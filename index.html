  renderShell(`
    <div class="card">
      <div class="k-label">NOTIFICATIONS</div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;">
        <h2 style="margin:0;">Announcements</h2>
        ${NOTIF_ANNOUNCEMENTS.length ? `<button class="mini-btn" id="dismiss-all-announce">Dismiss all</button>` : ""}
      </div>
      ${announceHtml}
    </div>
    ${isAdmin() ? `
    <div class="card" style="margin-top:16px;">
      <div class="k-label">ADMIN</div>
      <h2 style="margin-bottom:4px;">Needs a reply</h2>
      <p style="color:var(--text-dim);font-size:13px;margin:0 0 16px;">First admin to reply owns it. Sending a reply moves it into your Conversations and disappears from other admins' view.</p>
      ${unclaimedHtml || `<p style="color:var(--text-faint);font-size:13px;">Nothing waiting on a reply.</p>`}
    </div>` : ""}
  `);

  NOTIF_UNCLAIMED.forEach(m=> wireRichEditor(`thread-rte-${m.id}`));

  const dismissAllBtn = document.getElementById("dismiss-all-announce");
  if(dismissAllBtn) dismissAllBtn.addEventListener("click", async ()=>{
    await supabase.from("announcement_dismissals").upsert(NOTIF_ANNOUNCEMENTS.map(a=>({ user_id: session.user.id, message_id: a.id })));
    await refreshMessagingView();
  });
  root.querySelectorAll("[data-dismiss-announce]").forEach(el=> el.addEventListener("click", async ()=>{

      await supabase.from("messages").delete().eq("id", id);
      collapsedThreadIds.delete(id);
      await refreshMessagingView();

function renderChat(){
  const threadsHtml = NOTIF_THREADS.map(threadCardHtml).join("") || `<p style="color:var(--text-faint);font-size:13px;">No conversations yet.</p>`;

  renderShell(`
    <div class="card">
      <div class="k-label">CHAT</div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
        <h2 style="margin:0;">Conversations</h2>
        <button class="btn primary" id="new-convo-btn">+ New Conversation</button>
      </div>
      ${threadsHtml}
    </div>
  `);

  const newConvoBtn = document.getElementById("new-convo-btn");
  if(newConvoBtn) newConvoBtn.addEventListener("click", openNewConversationModal);

  NOTIF_THREADS.forEach(t=> wireRichEditor(`thread-rte-${t.root.id}`));
  root.querySelectorAll("[data-thread-toggle]").forEach(el=> el.addEventListener("click", (e)=>{
    e.stopPropagation();
    const id = el.getAttribute("data-thread-toggle");
    if(collapsedThreadIds.has(id)) collapsedThreadIds.delete(id); else collapsedThreadIds.add(id);
    render();
  }));
  root.querySelectorAll("[data-discard-thread]").forEach(el=> el.addEventListener("click", async ()=>{
    const id = el.getAttribute("data-discard-thread");
    if(confirm("Discard this conversation? This can't be undone.")){
      await supabase.from("messages").delete().eq("thread_id", id);
      await supabase.from("messages").delete().eq("id", id);
      collapsedThreadIds.delete(id);
      await refreshMessagingView();
    }
  }));
  root.querySelectorAll("[data-send-thread]").forEach(el=> el.addEventListener("click", async ()=>{
    await sendThreadMessage(el.getAttribute("data-send-thread"));
  }));

async function sendThreadMessage(rootId){
  const editorEl = document.getElementById(`thread-rte-${rootId}`);
  const body = editorEl.innerHTML.trim();
  if(!body || body === "<br>") return;
  const root = NOTIF_UNCLAIMED.find(m=>m.id===rootId) || (NOTIF_THREADS.find(t=>t.root.id===rootId)||{}).root;
  if(!root) return;

  const wasUnclaimedPoolItem = root.audience === "admins" && !root.claimed_by;

  let recipientId;
  if(root.audience === "user"){
    // Direct thread (e.g. admin-initiated coaching conversation) — just message the other participant.
    recipientId = (root.sender_id === session.user.id) ? root.recipient_id : root.sender_id;
  } else {
    // Pool-originated flag/comment thread.
    const iAmOriginalSender = root.sender_id === session.user.id;
    if(iAmOriginalSender){
      recipientId = root.claimed_by;
      if(!recipientId){ alert("No admin has picked this up yet — nothing to send to."); return; }
    } else {
      recipientId = root.sender_id;
      if(!root.claimed_by){
        await supabase.from("messages").update({ claimed_by: session.user.id }).eq("id", root.id).is("claimed_by", null);
      }
    }
  }
  await supabase.from("messages").insert({ sender_id: session.user.id, sender_name: profile.name, recipient_id: recipientId, audience:"user", type:"reply", body, context: root.context, thread_id: root.id });

  if(wasUnclaimedPoolItem){
    await openChat(root.id); // follow through on the conversation you just started
  } else {
    await refreshMessagingView();
  }
}

/* ============================================================
   REALTIME + TOASTS
   ============================================================ */
function stripHtml(html){ const d = document.createElement("div"); d.innerHTML = html; return (d.textContent||"").trim(); }

function showToast(text, onClickFn){
  const el = document.createElement("div");
  el.className = "app-toast";
  el.textContent = text;
  el.addEventListener("click", ()=>{ el.remove(); (onClickFn || openNotifications)(); });
  document.body.appendChild(el);
  setTimeout(()=>{ el.classList.add("out"); setTimeout(()=>el.remove(), 300); }, 6000);
}

function setupRealtime(){
  teardownRealtime();
  const chAnnounce = supabase.channel("rt-announcements-"+session.user.id)
    .on("postgres_changes", { event:"INSERT", schema:"public", table:"messages", filter:"audience=eq.all" }, (payload)=>{
      if(payload.new.sender_id === session.user.id) return;
      showToast("📣 " + stripHtml(payload.new.body).slice(0,90), openNotifications);
      if(view==="notifications" || view==="chat") refreshMessagingView(); else loadAllNotifications();
    }).subscribe();
  realtimeChannels.push(chAnnounce);

  const chToMe = supabase.channel("rt-to-me-"+session.user.id)
    .on("postgres_changes", { event:"INSERT", schema:"public", table:"messages", filter:`recipient_id=eq.${session.user.id}` }, (payload)=>{
      showToast("💬 " + escapeHtml(payload.new.sender_name) + ": " + stripHtml(payload.new.body).slice(0,70), ()=>openChat());
      if(view==="notifications" || view==="chat") refreshMessagingView(); else loadAllNotifications();
    }).subscribe();
  realtimeChannels.push(chToMe);

  if(isAdmin()){
    const chAdmin = supabase.channel("rt-admin-inbox-"+session.user.id)
      .on("postgres_changes", { event:"INSERT", schema:"public", table:"messages", filter:"audience=eq.admins" }, (payload)=>{
        if(payload.new.thread_id || payload.new.sender_id === session.user.id) return;
        showToast("🚩 New item waiting in the admin inbox", openNotifications);
        if(view==="notifications" || view==="chat") refreshMessagingView(); else loadAllNotifications();
      }).subscribe();
    realtimeChannels.push(chAdmin);
  }

  // Discarding a conversation deletes rows — without listening for DELETE too,
  // the other participant would never see it disappear until they refresh.
  const chDeletes = supabase.channel("rt-deletes-"+session.user.id)
    .on("postgres_changes", { event:"DELETE", schema:"public", table:"messages" }, ()=>{
      if(view==="notifications" || view==="chat") refreshMessagingView(); else loadAllNotifications();
    }).subscribe();
  realtimeChannels.push(chDeletes);
}
function teardownRealtime(){ realtimeChannels.forEach(ch=> supabase.removeChannel(ch)); realtimeChannels = []; }

/* ============================================================
   DRAG AUTO-SCROLL — activated during any drag-to-reorder gesture
   so dragging near the top/bottom edge scrolls the page.
   ============================================================ */
let _dragScrollSpeed = 0;
let _dragScrollRAF = null;
function _dragScrollHandler(e){
  const threshold = 110;
  const y = e.clientY;
  const h = window.innerHeight;
  if(y < threshold) _dragScrollSpeed = -((threshold - y) * 0.5 + 3);
  else if(y > h - threshold) _dragScrollSpeed = ((y - (h - threshold)) * 0.5 + 3);
  else _dragScrollSpeed = 0;
}
function _dragScrollStep(){
  if(_dragScrollSpeed !== 0) window.scrollBy(0, _dragScrollSpeed);
  _dragScrollRAF = requestAnimationFrame(_dragScrollStep);
}
function startDragAutoScroll(){
  _dragScrollSpeed = 0;
  document.addEventListener("dragover", _dragScrollHandler);
  if(!_dragScrollRAF) _dragScrollRAF = requestAnimationFrame(_dragScrollStep);
}
function stopDragAutoScroll(){
  document.removeEventListener("dragover", _dragScrollHandler);
  if(_dragScrollRAF){ cancelAnimationFrame(_dragScrollRAF); _dragScrollRAF = null; }
  _dragScrollSpeed = 0;
}

/* ============================================================
   RICH TEXT EDITOR (used for reference pages, lesson bodies,
   announcements, comments/flags, and admin replies)
   ============================================================ */
function richEditorHtml(id, initialHtml){
  return `
    <div class="rte-toolbar" data-rte="${id}">
      <button type="button" data-cmd="bold" title="Bold"><b>B</b></button>
      <button type="button" data-cmd="italic" title="Italic"><i>I</i></button>
      <button type="button" data-cmd="underline" title="Underline"><u>U</u></button>
      <div class="rte-sep"></div>
      <select data-cmd="fontSize" title="Text size">
        <option value="2">Small</option>
        <option value="3" selected>Normal</option>
        <option value="5">Large</option>
        <option value="7">Huge</option>
      </select>
      <div class="rte-sep"></div>
      <button type="button" data-cmd="insertUnorderedList" title="Bullet list">• List</button>
      <button type="button" data-cmd="insertOrderedList" title="Numbered list">1. List</button>
      <div class="rte-sep"></div>
      <button type="button" data-cmd="image" title="Insert image">🖼</button>
      <input type="file" accept="image/*" style="display:none" id="${id}-file">
      <div class="rte-sep"></div>
      <button type="button" data-cmd="clearFormat" title="Clear formatting">Tx</button>
    </div>
    <div class="rte-body" id="${id}" contenteditable="true">${initialHtml || ""}</div>
  `;
}
function clearFormatting(editorEl){
  editorEl.focus();
  // Handles native bold/italic/underline/execCommand-applied styles.
  document.execCommand("removeFormat", false, null);
  // Pasted content (Word, Google Docs, other browser tabs, etc.) often carries
  // inline style/color attributes that removeFormat doesn't touch — strip those directly.
  editorEl.querySelectorAll("*").forEach(el=>{
    el.removeAttribute("style");
    el.removeAttribute("color");
    el.removeAttribute("bgcolor");
    el.removeAttribute("face");
  });
  editorEl.querySelectorAll("font").forEach(f=>{
    while(f.firstChild) f.parentNode.insertBefore(f.firstChild, f);
    f.parentNode.removeChild(f);
  });
}

function wireRichEditor(id){
  const toolbar = document.querySelector(`.rte-toolbar[data-rte="${id}"]`);
  const editorEl = document.getElementById(id);
  if(!toolbar || !editorEl) return;
  toolbar.querySelectorAll("button[data-cmd]").forEach(btn=>{
    btn.addEventListener("mousedown", (e)=>e.preventDefault()); // keep focus/selection in the editor
    btn.addEventListener("click", async ()=>{
      editorEl.focus();
      const cmd = btn.getAttribute("data-cmd");
      if(cmd === "image"){ document.getElementById(`${id}-file`).click(); return; }
      if(cmd === "clearFormat"){ clearFormatting(editorEl); return; }
      document.execCommand(cmd, false, null);
    });
  });
  const sizeSelect = toolbar.querySelector('select[data-cmd="fontSize"]');
  if(sizeSelect) sizeSelect.addEventListener("change", ()=>{ editorEl.focus(); document.execCommand("fontSize", false, sizeSelect.value); });
  const fileInput = document.getElementById(`${id}-file`);
  fileInput.addEventListener("change", async ()=>{
    const file = fileInput.files[0]; if(!file) return;
    const dataUrl = await compressImageFile(file);
    insertResizableImage(editorEl, dataUrl);
    attachImageResizeHandles(editorEl);
    fileInput.value = "";
  });
  editorEl.addEventListener("paste", async (e)=>{
    const cd = e.clipboardData || window.clipboardData;
    const items = cd.items;
    // Some browsers attach a flattened image snapshot alongside real HTML when you
    // copy a mixed selection (text + images) from a page or document. If we only
    // checked for an image item, we'd wrongly treat the WHOLE paste as "just an
    // image" and silently discard all the actual text and other pictures. Only take
    // the single-image fast path when there's genuinely no HTML riding along with it.
    const hasHtml = Array.from(items).some(it => it.type === "text/html");
    if(!hasHtml){
      for(const item of items){
        if(item.type && item.type.startsWith("image/")){
          e.preventDefault();
          const file = item.getAsFile();
          const dataUrl = await compressImageFile(file);
          insertResizableImage(editorEl, dataUrl);
          attachImageResizeHandles(editorEl);
          return;
        }
      }
    }
    // Mixed/rich paste (or plain text) — let the browser's default paste happen,
    // then wrap any plain <img> tags it inserted so every picture — no matter how
    // it got in — ends up resizable and click-to-enlarge, same as ones we insert.
    // Two passes: large pastes can take a moment longer to finish landing in the DOM.
    setTimeout(()=>{ normalizePastedImages(editorEl); attachImageResizeHandles(editorEl); }, 0);
    setTimeout(()=>{ normalizePastedImages(editorEl); attachImageResizeHandles(editorEl); }, 200);
  });
  attachImageResizeHandles(editorEl);
}

/* ============================================================
   CUSTOM IMAGE RESIZE — replaces native CSS `resize`, which
   behaves inconsistently inside contenteditable regions across
   browsers (images would render at inflated size only while
   actively editing). This gives identical behavior everywhere.
   ============================================================ */
function attachImageResizeHandles(editorEl){
  editorEl.querySelectorAll(".rte-img-wrap").forEach(wrap=>{
    if(!wrap.querySelector(".rte-resize-handle")){
      const handle = document.createElement("span");
      handle.className = "rte-resize-handle";
      handle.setAttribute("contenteditable", "false");
      wrap.appendChild(handle);
    }
  });
}
let _imgResizeDrag = null;
document.addEventListener("mousedown", (e)=>{
  const handle = e.target.closest(".rte-resize-handle");
  if(!handle) return;
  e.preventDefault(); e.stopPropagation();
  const wrap = handle.parentElement;
  const img = wrap.querySelector("img");
  if(!img) return;
  _imgResizeDrag = { img, startX:e.clientX, startY:e.clientY, startW:img.offsetWidth, startH:img.offsetHeight };
});
document.addEventListener("mousemove", (e)=>{
  if(!_imgResizeDrag) return;
  const { img, startX, startY, startW, startH } = _imgResizeDrag;
  const w = Math.max(80, startW + (e.clientX - startX));
  const h = Math.max(60, startH + (e.clientY - startY));
  setImageSize(img, w, h);
});
document.addEventListener("mouseup", ()=>{ _imgResizeDrag = null; });
function normalizePastedImages(editorEl){
  const rawImgs = Array.from(editorEl.querySelectorAll("img")).filter(img =>
    !img.closest(".rte-img-wrap") && !img.classList.contains("brand-mark") && !img.closest("header.top")
  );
  rawImgs.forEach(img=>{
    const wrap = document.createElement("span");
    wrap.className = "rte-img-wrap";
    wrap.setAttribute("contenteditable", "false");
    wrap.setAttribute("draggable", "true");
    const sizeToImage = ()=>{
      const w = img.naturalWidth || img.width || 280;
      const h = img.naturalHeight || img.height || 190;
      const maxW = 340, maxH = 260;
      const scale = Math.min(maxW/w, maxH/h, 1);
      setImageSize(img, Math.max(Math.round(w*scale), 80), Math.max(Math.round(h*scale), 60));
    };
    sizeToImage();
    if(!img.naturalWidth){
      // Image (often an external URL from the source page) hasn't finished loading yet —
      // resize the box once it does, instead of leaving it stuck at a fallback guess.
      img.addEventListener("load", sizeToImage, { once:true });
    }
    img.parentNode.insertBefore(wrap, img);
    img.removeAttribute("style");
    wrap.appendChild(img);
  });
}
function setImageSize(img, w, h){
  img.setAttribute("width", w);
  img.setAttribute("height", h);
  img.style.width = w + "px";
  img.style.height = h + "px";
}
function openImageLightbox(src){
  const wrap = document.createElement("div");
  wrap.className = "lightbox-overlay";
  wrap.innerHTML = `<button class="lightbox-close" title="Close">✕</button><img src="${src}" class="lightbox-img" draggable="false"><div class="lightbox-hint">Scroll or double-click to zoom · drag to pan</div>`;
  document.body.appendChild(wrap);
  const img = wrap.querySelector(".lightbox-img");

  let scale = 1, panX = 0, panY = 0, dragging = false, startX = 0, startY = 0;
  function applyTransform(){
    img.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    img.style.cursor = scale > 1 ? "grab" : "zoom-in";
  }

  function onWheel(e){
    e.preventDefault();
    const delta = e.deltaY < 0 ? 0.2 : -0.2;
    scale = Math.min(4, Math.max(1, scale + delta));
    if(scale === 1){ panX = 0; panY = 0; }
    applyTransform();
  }
  function onDblClick(){
    scale = scale > 1 ? 1 : 2.5;
    if(scale === 1){ panX = 0; panY = 0; }
    applyTransform();
  }
  function onMouseDown(e){
    if(scale <= 1) return;
    e.preventDefault();
    dragging = true; startX = e.clientX - panX; startY = e.clientY - panY;
    img.style.cursor = "grabbing";
  }
  function onMouseMove(e){
    if(!dragging) return;
    panX = e.clientX - startX; panY = e.clientY - startY;
    applyTransform();
  }
  function onMouseUp(){
    dragging = false;
    if(scale > 1) img.style.cursor = "grab";
  }

  img.addEventListener("wheel", onWheel, { passive:false });
  img.addEventListener("dblclick", onDblClick);
  img.addEventListener("mousedown", onMouseDown);
  window.addEventListener("mousemove", onMouseMove);
  window.addEventListener("mouseup", onMouseUp);

  const close = ()=>{
    window.removeEventListener("mousemove", onMouseMove);
    window.removeEventListener("mouseup", onMouseUp);
    document.removeEventListener("keydown", onKey);
    wrap.remove();
  };
  wrap.addEventListener("click", (e)=>{ if(e.target===wrap || e.target.classList.contains("lightbox-close")) close(); });
  const onKey = (e)=>{ if(e.key==="Escape") close(); };
  document.addEventListener("keydown", onKey);
}
document.addEventListener("click", (e)=>{
  const img = e.target.closest(".rte-img-wrap img");
  if(!img) return;
  if(img.closest('[contenteditable="true"]')) return;
  openImageLightbox(img.getAttribute("src"));
});

function insertResizableImage(editorEl, dataUrl){
  editorEl.focus();
  const probe = new Image();
  probe.onload = ()=>{
    const maxW = 340, maxH = 260;
    let w = probe.naturalWidth || maxW, h = probe.naturalHeight || maxH;
    const scale = Math.min(maxW/w, maxH/h, 1);
    w = Math.max(Math.round(w*scale), 80);
    h = Math.max(Math.round(h*scale), 60);
    document.execCommand("insertHTML", false, `<span class="rte-img-wrap" contenteditable="false" draggable="true"><img src="${dataUrl}" width="${w}" height="${h}" style="width:${w}px;height:${h}px;"></span>&nbsp;`);
  };
  probe.src = dataUrl;
}
function compressImageFile(file, maxDim, quality){
  maxDim = maxDim || 900; quality = quality || 0.82;
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = (e)=>{
      const img = new Image();
      img.onerror = reject;
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > h && w > maxDim){ h = Math.round(h*maxDim/w); w = maxDim; }
        else if(h >= w && h > maxDim){ w = Math.round(w*maxDim/h); h = maxDim; }
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

        <input type="text" data-q-opt="${i}:${oi}" value="${escapeHtml(opt)}"><button class="mini-btn danger" data-q-opt-del="${i}:${oi}" ${q.opts.length<=2?'disabled':''}>✕</button></div>`).join("");

        <button class="mini-btn danger" data-q-del="${i}">Delete</button></div>
        <div class="field"><label>Question</label><textarea data-q-text="${i}" style="min-height:55px;">${escapeHtml(q.q)}</textarea></div>
        <div class="field"><label>Options (select correct)</label>${optsHtml}<button class="mini-btn" data-q-opt-add="${i}" style="margin-top:4px;">+ Add option</button></div>
        <div class="field"><label>Explanation</label><textarea data-q-explain="${i}" style="min-height:55px;">${escapeHtml(q.explain)}</textarea></div>
        <div class="nav-buttons"><button class="btn" data-q-cancel="${i}">Cancel</button><button class="btn primary" data-q-save="${i}">Save question</button></div>
      </div>`;
    }
    return `<div class="sub-card"><div class="sub-card-head"><span class="tag">QUESTION ${i+1}${q.q?' · '+escapeHtml(q.q.slice(0,50))+(q.q.length>50?'…':''):''}</span>
      <div class="mini-tools">
        <button class="mini-btn" data-q-up="${i}" ${questionLocked||i===0?'disabled':''}>↑</button>
        <button class="mini-btn" data-q-down="${i}" ${questionLocked||i===d.quiz.length-1?'disabled':''}>↓</button>

function wireEditorEvents(){
  const d = draftModule;
  document.getElementById("mod-title").addEventListener("input", e=>{ d.title=e.target.value; });
  document.getElementById("mod-short").addEventListener("input", e=>{ d.short=e.target.value; });

  root.querySelectorAll("[data-lesson-label]").forEach(el=> el.addEventListener("input", e=>{ d.lessons[+el.dataset.lessonLabel].label=e.target.value; }));
  root.querySelectorAll("[data-lesson-title]").forEach(el=> el.addEventListener("input", e=>{ d.lessons[+el.dataset.lessonTitle].title=e.target.value; }));
  if(expandedLessonIdx !== null){
    wireRichEditor(`lesson-rte-${expandedLessonIdx}`);
    const rteEl = document.getElementById(`lesson-rte-${expandedLessonIdx}`);
    if(rteEl) rteEl.addEventListener("input", ()=>{ d.lessons[expandedLessonIdx].body = rteEl.innerHTML; });
  }
  root.querySelectorAll("[data-lesson-up]").forEach(el=> el.addEventListener("click", ()=>{ if(expandedLessonIdx!==null) return; const i=+el.dataset.lessonUp; [d.lessons[i-1],d.lessons[i]]=[d.lessons[i],d.lessons[i-1]]; renderEditor(); }));
  root.querySelectorAll("[data-lesson-down]").forEach(el=> el.addEventListener("click", ()=>{ if(expandedLessonIdx!==null) return; const i=+el.dataset.lessonDown; [d.lessons[i+1],d.lessons[i]]=[d.lessons[i],d.lessons[i+1]]; renderEditor(); }));
  root.querySelectorAll("[data-lesson-del]").forEach(el=> el.addEventListener("click", ()=>{
    if(expandedLessonIdx!==null) return;
    const i=+el.dataset.lessonDel;
    if(confirm("Delete this lesson?")){ d.lessons.splice(i,1); expandedLessonIdx=null; lessonSnapshot=null; renderEditor(); }
  }));
  root.querySelectorAll("[data-lesson-edit]").forEach(el=> el.addEventListener("click", ()=>{
    if(expandedLessonIdx !== null){ alert("Save or cancel the lesson you're currently editing first."); return; }
    const i = +el.dataset.lessonEdit;
    lessonSnapshot = JSON.parse(JSON.stringify(d.lessons[i]));
    expandedLessonIdx = i; renderEditor();
  }));
  root.querySelectorAll("[data-lesson-save]").forEach(el=> el.addEventListener("click", ()=>{
    const i = +el.dataset.lessonSave;
    if(!d.lessons[i].title.trim()){ alert("Give the lesson a title before saving it."); return; }
    expandedLessonIdx = null; lessonSnapshot = null; renderEditor();
  }));
  root.querySelectorAll("[data-lesson-cancel]").forEach(el=> el.addEventListener("click", ()=>{
    const i = +el.dataset.lessonCancel;
    if(lessonSnapshot) d.lessons[i] = lessonSnapshot;
    expandedLessonIdx = null; lessonSnapshot = null; renderEditor();
  }));
  document.getElementById("add-lesson").addEventListener("click", ()=>{
    if(expandedLessonIdx !== null){ alert("Save or cancel the lesson you're currently editing first."); return; }
    d.lessons.push(blankLesson());
    const i = d.lessons.length-1;
    lessonSnapshot = JSON.parse(JSON.stringify(d.lessons[i]));
    expandedLessonIdx = i; renderEditor();
  });

  root.querySelectorAll("[data-q-text]").forEach(el=> el.addEventListener("input", e=>{ d.quiz[+el.dataset.qText].q=e.target.value; }));
  root.querySelectorAll("[data-q-explain]").forEach(el=> el.addEventListener("input", e=>{ d.quiz[+el.dataset.qExplain].explain=e.target.value; }));
  root.querySelectorAll("[data-q-opt]").forEach(el=> el.addEventListener("input", e=>{ const [qi,oi]=el.dataset.qOpt.split(":").map(Number); d.quiz[qi].opts[oi]=e.target.value; }));
  root.querySelectorAll("[data-q-correct]").forEach(el=> el.addEventListener("change", e=>{ d.quiz[+el.dataset.qCorrect].correct=+e.target.value; }));
  root.querySelectorAll("[data-q-opt-add]").forEach(el=> el.addEventListener("click", ()=>{ d.quiz[+el.dataset.qOptAdd].opts.push("New option"); renderEditor(); }));
  root.querySelectorAll("[data-q-opt-del]").forEach(el=> el.addEventListener("click", ()=>{
    const [qi,oi]=el.dataset.qOptDel.split(":").map(Number); if(d.quiz[qi].opts.length<=2) return;
    d.quiz[qi].opts.splice(oi,1); if(d.quiz[qi].correct===oi) d.quiz[qi].correct=0; else if(d.quiz[qi].correct>oi) d.quiz[qi].correct-=1; renderEditor();
  }));
  root.querySelectorAll("[data-q-up]").forEach(el=> el.addEventListener("click", ()=>{ if(expandedQuestionIdx!==null) return; const i=+el.dataset.qUp; [d.quiz[i-1],d.quiz[i]]=[d.quiz[i],d.quiz[i-1]]; renderEditor(); }));
  root.querySelectorAll("[data-q-down]").forEach(el=> el.addEventListener("click", ()=>{ if(expandedQuestionIdx!==null) return; const i=+el.dataset.qDown; [d.quiz[i+1],d.quiz[i]]=[d.quiz[i],d.quiz[i+1]]; renderEditor(); }));
  root.querySelectorAll("[data-q-del]").forEach(el=> el.addEventListener("click", ()=>{
    if(expandedQuestionIdx!==null) return;
    const i=+el.dataset.qDel;
    if(confirm("Delete this question?")){ d.quiz.splice(i,1); expandedQuestionIdx=null; questionSnapshot=null; renderEditor(); }
  }));
  root.querySelectorAll("[data-q-edit]").forEach(el=> el.addEventListener("click", ()=>{
    if(expandedQuestionIdx !== null){ alert("Save or cancel the question you're currently editing first."); return; }
    const i = +el.dataset.qEdit;
    questionSnapshot = JSON.parse(JSON.stringify(d.quiz[i]));
    expandedQuestionIdx = i; renderEditor();
  }));
  root.querySelectorAll("[data-q-save]").forEach(el=> el.addEventListener("click", ()=>{
    const i = +el.dataset.qSave;
    if(!d.quiz[i].q.trim()){ alert("Give the question some text before saving it."); return; }
    expandedQuestionIdx = null; questionSnapshot = null; renderEditor();
  }));
  root.querySelectorAll("[data-q-cancel]").forEach(el=> el.addEventListener("click", ()=>{
    const i = +el.dataset.qCancel;
    if(questionSnapshot) d.quiz[i] = questionSnapshot;
    expandedQuestionIdx = null; questionSnapshot = null; renderEditor();
  }));
  document.getElementById("add-question").addEventListener("click", ()=>{
    d.quiz.push(blankQuestion());
    const i = d.quiz.length-1;
    questionSnapshot = JSON.parse(JSON.stringify(d.quiz[i]));
    expandedQuestionIdx = i; renderEditor();
  });

  document.getElementById("editor-cancel").addEventListener("click", ()=>{ view = editingExistingId?"lesson":"dashboard"; if(editingExistingId){ currentModId=editingExistingId; currentLessonIdx=0; } render(); });

  const delBtn = document.getElementById("editor-delete");
  if(delBtn) delBtn.addEventListener("click", async ()=>{
    if(confirm(`Delete "${d.title||'this module'}"? This can't be undone.`)){
      await supabase.from("modules").delete().eq("id", editingExistingId);
      await loadEverything(); view="dashboard"; render();
    }
  });

  document.getElementById("editor-save").addEventListener("click", async ()=>{
    if(expandedLessonIdx !== null || expandedQuestionIdx !== null){ alert("Save or cancel what you're currently editing first."); return; }
    if(!d.title.trim()){ alert("Give the module a title before saving."); return; }
    const wasNewModule = !editingExistingId;
    const id = editingExistingId || slugify(d.title);
    await supabase.from("modules").upsert({ id, title:d.title, short:d.short, led_color:d.ledColor, sort_order: editingExistingId ? undefined : (MODULES.length+1) });
    await supabase.from("lessons").delete().eq("module_id", id);
    if(d.lessons.length){
      await supabase.from("lessons").insert(d.lessons.map((l,i)=>({ module_id:id, sort_order:i, label:l.label, title:l.title, body:l.body })));
    }
    await supabase.from("quiz_questions").delete().eq("module_id", id);
    if(d.quiz.length){
      await supabase.from("quiz_questions").insert(d.quiz.map((q,i)=>({ module_id:id, sort_order:i, question:q.q, options:q.opts, correct_index:q.correct, explanation:q.explain })));
    }
    await loadEverything();
    currentModId = id; currentLessonIdx = 0;
    view = MODULES.find(m=>m.id===id).lessons.length ? "lesson" : "dashboard";
    render();
    if(wasNewModule) openNewModuleNotifyModal(d.title);
  });
}

}

/* ============================================================
   REFERENCE GUIDE (OneNote-style, admin editable)
   ============================================================ */
let refCollapsed = new Set();
let dragRefId = null;

async function loadReference(){
  if(guestMode) return;
  const { data } = await supabase.from("reference_pages").select("*").order("sort_order");
  REFERENCE_PAGES = data || [];
  if(!REFERENCE_PAGES.find(p=>p.id===currentRefId)) currentRefId = null;
}
async function openReference(){
  await loadReference();
  refEditing = false;
  if(!currentRefId){ const top = REFERENCE_PAGES.find(p=>!p.parent_id); if(top) currentRefId = top.id; }
  view = "reference"; render();
}
function topLevelPages(){ return REFERENCE_PAGES.filter(p=>!p.parent_id).sort((a,b)=>a.sort_order-b.sort_order); }
function childPages(parentId){ return REFERENCE_PAGES.filter(p=>p.parent_id===parentId).sort((a,b)=>a.sort_order-b.sort_order); }

function renderReference(){
  const editOn = canEdit();
  const tops = topLevelPages();

  function sidebarRow(p, isChild){
    const active = p.id===currentRefId;
    const kids = isChild ? [] : childPages(p.id);
    const collapsed = refCollapsed.has(p.id);
    const chevron = (!isChild && kids.length) ? `<button class="mini-btn" data-ref-toggle="${p.id}" style="padding:2px 5px;">${collapsed?'▸':'▾'}</button>` : `<span style="width:20px;display:inline-block;"></span>`;
    const tools = editOn ? `
      <span class="ref-row-tools">
        ${!isChild ? `<button class="mini-btn" data-ref-addsub="${p.id}">+ Sub</button>` : ""}
        <button class="mini-btn danger" data-ref-del="${p.id}">✕</button>
      </span>` : "";
    return `<div class="ref-row ${active?'active':''} ${isChild?'child':''}" draggable="${editOn}" data-ref-select="${p.id}" data-ref-drag="${p.id}" data-ref-parent="${p.parent_id||''}">
      ${!isChild ? chevron : ""}<span class="ref-row-title">${escapeHtml(p.title)}</span>${tools}
    </div>`;
  }

  const sidebarHtml = tops.map(p=>{
    const kids = childPages(p.id);
    const collapsed = refCollapsed.has(p.id);
    return sidebarRow(p,false) + (!collapsed ? kids.map(k=>sidebarRow(k,true)).join("") : "");
  }).join("") || `<p style="color:var(--text-faint);font-size:12.5px;padding:10px;">No pages yet.</p>`;

  const addTopBtn = editOn ? `<button class="dashed-btn" id="add-ref-page" style="margin-top:10px;">+ Add page</button>` : "";

  const page = REFERENCE_PAGES.find(p=>p.id===currentRefId);
  let contentHtml;
  if(!REFERENCE_PAGES.length){
    contentHtml = `<div class="card"><p style="color:var(--text-dim);font-size:14px;">Nothing here yet.${editOn ? ' Click "+ Add page" to start building it out.' : ' Check back once an admin has added content.'}</p></div>`;
  } else if(!page){
    contentHtml = `<div class="card"><p style="color:var(--text-dim);font-size:14px;">Select a page from the left.</p></div>`;
  } else if(refEditing){
    contentHtml = `
      <div class="card">
        <input type="text" id="ref-title" class="onenote-title-input" placeholder="Page title" value="${escapeHtml(refDraft.title)}">
        ${richEditorHtml("ref-body-rte", refDraft.body)}
        <div class="hint" style="margin-top:8px;">Paste an image directly, or use the 🖼 button. Drag an image's corner to resize it.</div>
        <div class="nav-buttons">
          <div style="display:flex;gap:10px;"><button class="btn" id="ref-cancel">Cancel</button><button class="btn danger" id="ref-delete">Delete page</button></div>
          <button class="btn primary" id="ref-save">Save page</button>
        </div>
      </div>`;
  } else {
    const editBtn = editOn ? `<button class="btn" id="ref-edit" style="border-color:var(--amber);color:var(--amber);">✎ Edit page</button>` : "";
    contentHtml = `
      <div class="card">
        <div class="k-label">REFERENCE GUIDE</div>
        <h2>${escapeHtml(page.title)}</h2>
        <div class="body">${page.body}</div>
        <div class="nav-buttons"><div></div>${editBtn}</div>
      </div>`;
  }

  renderShell(`
    <div class="ref-layout">
      <div class="ref-sidebar"><div class="ref-sidebar-list">${sidebarHtml}</div>${addTopBtn}</div>
      <div class="ref-content">${contentHtml}</div>
    </div>
  `);

  if(refEditing) wireRichEditor("ref-body-rte");

  root.querySelectorAll("[data-ref-select]").forEach(el=> el.addEventListener("click", (e)=>{
    if(e.target.closest("[data-ref-toggle]")||e.target.closest("[data-ref-addsub]")||e.target.closest("[data-ref-del]")) return;
    currentRefId = el.getAttribute("data-ref-select"); refEditing=false; render();
  }));
  root.querySelectorAll("[data-ref-toggle]").forEach(el=> el.addEventListener("click", (e)=>{
    e.stopPropagation();
    const id = el.getAttribute("data-ref-toggle");
    if(refCollapsed.has(id)) refCollapsed.delete(id); else refCollapsed.add(id);
    render();
  }));

  const addPageBtn = document.getElementById("add-ref-page");
  if(addPageBtn) addPageBtn.addEventListener("click", async ()=>{
    const { data, error } = await supabase.from("reference_pages").insert({ title:"New page", body:"<p>Write here.</p>", parent_id:null, sort_order: tops.length }).select().single();
    if(!error){ await loadReference(); currentRefId = data.id; refDraft = { title:data.title, body:data.body }; refEditing = true; render(); }
  });
  root.querySelectorAll("[data-ref-addsub]").forEach(el=> el.addEventListener("click", async (e)=>{
    e.stopPropagation();
    const parentId = el.getAttribute("data-ref-addsub");
    const kids = childPages(parentId);
    refCollapsed.delete(parentId);
    const { data, error } = await supabase.from("reference_pages").insert({ title:"New subsection", body:"<p>Write here.</p>", parent_id:parentId, sort_order: kids.length }).select().single();
    if(!error){ await loadReference(); currentRefId = data.id; refDraft = { title:data.title, body:data.body }; refEditing = true; render(); }
  }));
  root.querySelectorAll("[data-ref-del]").forEach(el=> el.addEventListener("click", async (e)=>{
    e.stopPropagation();
    const id = el.getAttribute("data-ref-del");
    const target = REFERENCE_PAGES.find(p=>p.id===id);
    const hasKids = childPages(id).length>0;
    if(confirm(`Delete "${target.title}"?${hasKids?' This will also delete its subsections.':''}`)){
      await supabase.from("reference_pages").delete().eq("id", id);
      if(currentRefId===id) currentRefId = null;
      await loadReference(); render();
    }
  }));

  if(editOn){
    let dragOverEl = null;
    root.querySelectorAll("[data-ref-drag]").forEach(el=>{
      el.addEventListener("dragstart", (e)=>{ dragRefId = el.getAttribute("data-ref-drag"); e.dataTransfer.effectAllowed = "move"; el.style.opacity = "0.4"; startDragAutoScroll(); });
      el.addEventListener("dragend", ()=>{
        el.style.opacity = "";
        stopDragAutoScroll();
        if(dragOverEl){ dragOverEl.classList.remove("drag-over-top","drag-over-bottom"); dragOverEl = null; }
      });
      el.addEventListener("dragover", (e)=>{
        e.preventDefault();
        const rect = el.getBoundingClientRect();
        const pos = (e.clientY - rect.top) < rect.height/2 ? "before" : "after";
        if(dragOverEl && dragOverEl!==el) dragOverEl.classList.remove("drag-over-top","drag-over-bottom");
        dragOverEl = el;
        el.classList.toggle("drag-over-top", pos==="before");
        el.classList.toggle("drag-over-bottom", pos==="after");
      });
      el.addEventListener("dragleave", ()=>{ el.classList.remove("drag-over-top","drag-over-bottom"); });
      el.addEventListener("drop", async (e)=>{
        e.preventDefault();
        const pos = el.classList.contains("drag-over-top") ? "before" : "after";
        el.classList.remove("drag-over-top","drag-over-bottom");
        const targetId = el.getAttribute("data-ref-drag");
        if(!dragRefId || dragRefId===targetId){ dragRefId=null; return; }
        await reorderRefDrop(dragRefId, targetId, pos);
        dragRefId = null;
      });
    });
  }

  const editBtn = document.getElementById("ref-edit");
  if(editBtn) editBtn.addEventListener("click", ()=>{ refDraft = { title:page.title, body:page.body }; refEditing = true; render(); });
  const cancelBtn = document.getElementById("ref-cancel");
  if(cancelBtn) cancelBtn.addEventListener("click", ()=>{ refEditing=false; render(); });
  const saveBtn = document.getElementById("ref-save");
  if(saveBtn) saveBtn.addEventListener("click", async ()=>{
    const title = document.getElementById("ref-title").value.trim() || "Untitled page";
    const body = document.getElementById("ref-body-rte").innerHTML;
    await supabase.from("reference_pages").update({ title, body }).eq("id", page.id);
    refEditing = false; await loadReference(); render();
  });
  const deleteBtn = document.getElementById("ref-delete");
  if(deleteBtn) deleteBtn.addEventListener("click", async ()=>{
    if(confirm(`Delete "${page.title}"? This can't be undone.`)){
      await supabase.from("reference_pages").delete().eq("id", page.id);
      refEditing = false; currentRefId = null; await loadReference(); render();
    }
  });
}

async function reorderRefDrop(draggedId, targetId, pos){
  const dragged = REFERENCE_PAGES.find(p=>p.id===draggedId);
  const target = REFERENCE_PAGES.find(p=>p.id===targetId);
  if(!dragged || !target) return;
  if((dragged.parent_id||null) !== (target.parent_id||null)) return; // only reorder within the same level
  const siblings = (dragged.parent_id ? childPages(dragged.parent_id) : topLevelPages());
  const fromIdx = siblings.findIndex(s=>s.id===draggedId);
  let toIdx = siblings.findIndex(s=>s.id===targetId);
  if(fromIdx===-1 || toIdx===-1) return;
  if(pos==="after") toIdx++;
  const reordered = siblings.slice();
  reordered.splice(fromIdx,1);
  if(fromIdx < toIdx) toIdx--;
  reordered.splice(toIdx,0,dragged);
  for(let i=0;i<reordered.length;i++){
    if(reordered[i].sort_order !== i){ await supabase.from("reference_pages").update({ sort_order:i }).eq("id", reordered[i].id); }
  }
  await loadReference(); render();
}

/* ============================================================
   PERSONAL NOTES — private per-user notepad, autosaving.
   Same page/subsection structure as the Reference Guide, but only
   ever visible to the person who wrote it (enforced by RLS).
   ============================================================ */
let PERSONAL_NOTES = [];
let currentNoteId = null;
let notesCollapsed = new Set();
let dragNoteId = null;
let noteSaveTimer = null;

async function loadPersonalNotes(){
  if(guestMode) return;
  const { data } = await supabase.from("personal_notes").select("*").eq("user_id", session.user.id).order("sort_order");
  PERSONAL_NOTES = data || [];
  if(!PERSONAL_NOTES.find(n=>n.id===currentNoteId)) currentNoteId = null;
}
async function openNotes(){
  await loadPersonalNotes();
  if(!currentNoteId){ const top = PERSONAL_NOTES.find(n=>!n.parent_id); if(top) currentNoteId = top.id; }
  view = "notes"; render();
}
function topLevelNotes(){ return PERSONAL_NOTES.filter(n=>!n.parent_id).sort((a,b)=>a.sort_order-b.sort_order); }
function childNotes(parentId){ return PERSONAL_NOTES.filter(n=>n.parent_id===parentId).sort((a,b)=>a.sort_order-b.sort_order); }

function renderNotes(){
  const tops = topLevelNotes();

  function sidebarRow(n, isChild){
    const active = n.id===currentNoteId;
    const kids = isChild ? [] : childNotes(n.id);
    const collapsed = notesCollapsed.has(n.id);
    const chevron = (!isChild && kids.length) ? `<button class="mini-btn" data-note-toggle="${n.id}" style="padding:2px 5px;">${collapsed?'▸':'▾'}</button>` : `<span style="width:20px;display:inline-block;"></span>`;
    const tools = `
      <span class="ref-row-tools">
        ${!isChild ? `<button class="mini-btn" data-note-addsub="${n.id}">+ Sub</button>` : ""}
        <button class="mini-btn danger" data-note-del="${n.id}">✕</button>
      </span>`;
    return `<div class="ref-row ${active?'active':''} ${isChild?'child':''}" draggable="true" data-note-select="${n.id}" data-note-drag="${n.id}">
      ${!isChild ? chevron : ""}<span class="ref-row-title">${escapeHtml(n.title)}</span>${tools}
    </div>`;
  }

  const sidebarHtml = tops.map(n=>{
    const kids = childNotes(n.id);
    const collapsed = notesCollapsed.has(n.id);
    return sidebarRow(n,false) + (!collapsed ? kids.map(k=>sidebarRow(k,true)).join("") : "");
  }).join("") || `<p style="color:var(--text-faint);font-size:12.5px;padding:10px;">No notes yet.</p>`;

  const note = PERSONAL_NOTES.find(n=>n.id===currentNoteId);
  let contentHtml;
  if(!note){
    contentHtml = `<div class="card"><p style="color:var(--text-dim);font-size:14px;">${PERSONAL_NOTES.length ? 'Select a note from the left.' : 'Nothing here yet — click "+ Add note" to start your first page.'}</p></div>`;
  } else {
    contentHtml = `
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div class="k-label" style="margin-bottom:0;">MY NOTES · PRIVATE TO YOU</div>
          <span id="note-save-status" style="font-family:var(--mono);font-size:11px;color:var(--text-faint);"></span>
        </div>
        <input type="text" id="note-title" class="onenote-title-input" placeholder="Note title" value="${escapeHtml(note.title)}" style="margin-top:10px;">
        ${richEditorHtml("note-body-rte", note.body)}
        <div class="hint" style="margin-top:8px;">Saved automatically as you type. Paste an image directly, or use the 🖼 button.</div>
        <div class="nav-buttons"><button class="btn danger" id="note-delete">Delete note</button><div></div></div>
      </div>`;
  }

  renderShell(`
    <div class="ref-layout">
      <div class="ref-sidebar"><div class="ref-sidebar-list">${sidebarHtml}</div><button class="dashed-btn" id="add-note" style="margin-top:10px;">+ Add note</button></div>
      <div class="ref-content">${contentHtml}</div>
    </div>
  `);

  if(note) wireRichEditor("note-body-rte");

  root.querySelectorAll("[data-note-select]").forEach(el=> el.addEventListener("click", (e)=>{
    if(e.target.closest("[data-note-toggle]")||e.target.closest("[data-note-addsub]")||e.target.closest("[data-note-del]")) return;
    currentNoteId = el.getAttribute("data-note-select"); render();
  }));
  root.querySelectorAll("[data-note-toggle]").forEach(el=> el.addEventListener("click", (e)=>{
    e.stopPropagation();
    const id = el.getAttribute("data-note-toggle");
    if(notesCollapsed.has(id)) notesCollapsed.delete(id); else notesCollapsed.add(id);
    render();
  }));

  const addBtn = document.getElementById("add-note");
  if(addBtn) addBtn.addEventListener("click", async ()=>{
    const { data, error } = await supabase.from("personal_notes").insert({ user_id: session.user.id, title:"New note", body:"<p>Write here.</p>", parent_id:null, sort_order: tops.length }).select().single();
    if(!error){ await loadPersonalNotes(); currentNoteId = data.id; render(); }
  });
  root.querySelectorAll("[data-note-addsub]").forEach(el=> el.addEventListener("click", async (e)=>{
    e.stopPropagation();
    const parentId = el.getAttribute("data-note-addsub");
    const kids = childNotes(parentId);
    notesCollapsed.delete(parentId);
    const { data, error } = await supabase.from("personal_notes").insert({ user_id: session.user.id, title:"New subsection", body:"<p>Write here.</p>", parent_id:parentId, sort_order: kids.length }).select().single();
    if(!error){ await loadPersonalNotes(); currentNoteId = data.id; render(); }
  }));
  root.querySelectorAll("[data-note-del]").forEach(el=> el.addEventListener("click", async (e)=>{
    e.stopPropagation();
    const id = el.getAttribute("data-note-del");
    const target = PERSONAL_NOTES.find(n=>n.id===id);
    const hasKids = childNotes(id).length>0;
    if(confirm(`Delete "${target.title}"?${hasKids?' This will also delete its subsections.':''}`)){
      await supabase.from("personal_notes").delete().eq("id", id);
      if(currentNoteId===id) currentNoteId = null;
      await loadPersonalNotes(); render();
    }
  }));

  let dragOverEl = null;
  root.querySelectorAll("[data-note-drag]").forEach(el=>{
    el.addEventListener("dragstart", (e)=>{ dragNoteId = el.getAttribute("data-note-drag"); e.dataTransfer.effectAllowed = "move"; el.style.opacity = "0.4"; startDragAutoScroll(); });
    el.addEventListener("dragend", ()=>{
      el.style.opacity = "";
      stopDragAutoScroll();
      if(dragOverEl){ dragOverEl.classList.remove("drag-over-top","drag-over-bottom"); dragOverEl = null; }
    });
    el.addEventListener("dragover", (e)=>{
      e.preventDefault();
      const rect = el.getBoundingClientRect();
      const pos = (e.clientY - rect.top) < rect.height/2 ? "before" : "after";
      if(dragOverEl && dragOverEl!==el) dragOverEl.classList.remove("drag-over-top","drag-over-bottom");
      dragOverEl = el;
      el.classList.toggle("drag-over-top", pos==="before");
      el.classList.toggle("drag-over-bottom", pos==="after");
    });
    el.addEventListener("dragleave", ()=>{ el.classList.remove("drag-over-top","drag-over-bottom"); });
    el.addEventListener("drop", async (e)=>{
      e.preventDefault();
      const pos = el.classList.contains("drag-over-top") ? "before" : "after";
      el.classList.remove("drag-over-top","drag-over-bottom");
      const targetId = el.getAttribute("data-note-drag");
      if(!dragNoteId || dragNoteId===targetId){ dragNoteId=null; return; }
      await reorderNoteDrop(dragNoteId, targetId, pos);
      dragNoteId = null;
    });
  });

  const deleteBtn = document.getElementById("note-delete");
  if(deleteBtn) deleteBtn.addEventListener("click", async ()=>{
    if(confirm(`Delete "${note.title}"? This can't be undone.`)){
      await supabase.from("personal_notes").delete().eq("id", note.id);
      currentNoteId = null; await loadPersonalNotes(); render();
    }
  });

  const titleInput = document.getElementById("note-title");
  const bodyRte = document.getElementById("note-body-rte");
  if(titleInput && bodyRte){
    const trigger = ()=> scheduleNoteAutosave(note.id, titleInput, bodyRte);
    titleInput.addEventListener("input", trigger);
    bodyRte.addEventListener("input", trigger);
  }
}

function scheduleNoteAutosave(noteId, titleInput, bodyRte){
  const statusEl = document.getElementById("note-save-status");
  if(statusEl) statusEl.textContent = "Saving…";
  clearTimeout(noteSaveTimer);
  noteSaveTimer = setTimeout(async ()=>{
    const title = titleInput.value.trim() || "Untitled note";
    const body = bodyRte.innerHTML;
    await supabase.from("personal_notes").update({ title, body, updated_at: new Date().toISOString() }).eq("id", noteId);
    const n = PERSONAL_NOTES.find(x=>x.id===noteId);
    if(n){ n.title = title; n.body = body; }
    const titleEl = document.querySelector(`[data-note-select="${noteId}"] .ref-row-title`);
    if(titleEl) titleEl.textContent = title;
    const statusElNow = document.getElementById("note-save-status");
    if(statusElNow) statusElNow.textContent = "Saved";
  }, 900);
}

async function reorderNoteDrop(draggedId, targetId, pos){
  const dragged = PERSONAL_NOTES.find(n=>n.id===draggedId);
  const target = PERSONAL_NOTES.find(n=>n.id===targetId);
  if(!dragged || !target) return;
  if((dragged.parent_id||null) !== (target.parent_id||null)) return;
  const siblings = (dragged.parent_id ? childNotes(dragged.parent_id) : topLevelNotes());
  const fromIdx = siblings.findIndex(s=>s.id===draggedId);
  let toIdx = siblings.findIndex(s=>s.id===targetId);
  if(fromIdx===-1 || toIdx===-1) return;
  if(pos==="after") toIdx++;
  const reordered = siblings.slice();
  reordered.splice(fromIdx,1);
  if(fromIdx < toIdx) toIdx--;
  reordered.splice(toIdx,0,dragged);
  for(let i=0;i<reordered.length;i++){
    if(reordered[i].sort_order !== i){ await supabase.from("personal_notes").update({ sort_order:i }).eq("id", reordered[i].id); }
  }
  await loadPersonalNotes(); render();
}

/* ============================================================
   ROUTER
   ============================================================ */
function render(){
  if(view==="loading") root.innerHTML = `<div style="padding:60px;text-align:center;color:#8A96AD;font-family:'IBM Plex Mono',monospace;font-size:13px;">LOADING…</div>`;
  else if(view==="auth") renderAuth();
  else if(view==="home") renderHome();
  else if(view==="dashboard") renderDashboard();
  else if(view==="lesson") renderLesson();
  else if(view==="quiz") renderQuiz();
  else if(view==="results") renderResults();
  else if(view==="editor") renderEditor();
  else if(view==="team") renderTeam();
  else if(view==="analyze") renderAnalyze();
  else if(view==="settings") renderSettings();
  else if(view==="reference") renderReference();
  else if(view==="notifications") renderNotifications();
  else if(view==="chat") renderChat();
  else if(view==="notes") renderNotes();
  // Catch any raw <img> tags left over from before this fix existed (or from
  // any other source) so every picture gets resize/click-to-enlarge, not just
  // newly pasted ones — this only touches the live DOM, no save needed.
  normalizePastedImages(root);
}

/* ============================================================
   INIT
   ============================================================ */
(async function init(){
  applyTheme(currentTheme());
  view="loading"; render();
  const { data } = await supabase.auth.getSession();
  if(data.session){ session = data.session; await afterLogin(); }
  else { view="auth"; render(); }

  supabase.auth.onAuthStateChange((event, newSession)=>{
    if(event === "SIGNED_OUT"){ session=null; profile=null; view="auth"; render(); }
  });
})();

})();
</script>
