<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');
  :root{
    --bg:#0A0F1A; --panel:#121A2B; --stroke:#24304a; --text:#E7ECF6; --text-dim:#8A96AD; --text-faint:#5A6480;
    --green:#34D399; --green-dim:#34D39933; --amber:#F0A93D; --amber-dim:#F0A93D33; --red:#EF5D5D; --red-dim:#EF5D5D33;
    --cyan:#52D5E0; --cyan-dim:#52D5E033; --mono:'IBM Plex Mono',monospace; --sans:'IBM Plex Sans',sans-serif;
    --input-bg:#0e1626; --body-bg-glow:radial-gradient(circle at 15% -10%,#17233d 0%,transparent 45%),radial-gradient(circle at 100% 0%,#142234 0%,transparent 40%);
  }
  *{box-sizing:border-box;} html,body{margin:0;padding:0;}
  body{ background:var(--body-bg-glow),var(--bg); color:var(--text); font-family:var(--sans); min-height:100vh; -webkit-font-smoothing:antialiased; }
  a,button,input,textarea{font-family:inherit;}
  #app{ max-width:1180px; margin:0 auto; padding:28px 20px 90px; }
  header.top{ display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; padding-bottom:22px; margin-bottom:26px; border-bottom:1px solid var(--stroke); }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand-mark{ width:36px; max-width:36px; height:auto; max-height:36px; object-fit:contain; display:block; flex:none; }
  .brand-text .name{ font-family:var(--mono); font-weight:700; letter-spacing:.04em; font-size:13px; }
  .brand-text .tag{ font-size:11px; color:var(--text-faint); letter-spacing:.05em; }
  .top-right{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  nav.crumbs{ font-family:var(--mono); font-size:12px; color:var(--text-faint); }
  .crumbs-row{ display:block; font-family:var(--mono); font-size:12px; color:var(--text-faint); margin:-8px 0 18px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .crumbs-row button{ background:none; border:none; color:var(--cyan); cursor:pointer; font-family:var(--mono); font-size:12px; padding:0; }
  .crumbs-row button:hover{ text-decoration:underline; }
  nav.crumbs button{ background:none; border:none; color:var(--cyan); cursor:pointer; font-family:var(--mono); font-size:12px; padding:0; }
  .pill-btn{ font-family:var(--mono); font-size:11px; letter-spacing:.04em; padding:7px 12px; border-radius:7px; border:1px solid var(--stroke); background:#141d30; color:var(--text-dim); cursor:pointer; }
  .dept-tabs{ display:flex; gap:4px; margin-bottom:16px; border-bottom:2px solid var(--stroke); padding-left:2px; }
  .dept-tab{ padding:10px 22px; border-radius:10px 10px 0 0; border:1px solid transparent; border-bottom:none; background:transparent; color:var(--text-faint); cursor:pointer; font-size:13.5px; font-family:var(--sans); font-weight:600; position:relative; bottom:-2px; transition:background .15s, color .15s; }
  .dept-tab:hover{ color:var(--text-dim); background:var(--input-bg); }
  .dept-tab.active{ background:var(--panel); color:var(--cyan); border-color:var(--stroke); border-bottom:2px solid var(--panel); }
  html.theme-light .dept-tab.active{ background:var(--panel); border-bottom-color:var(--panel); }
  .pill-btn:hover{ border-color:#3a4a70; color:var(--text); }
  .admin-badge{ font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; padding:6px 10px; border-radius:20px; border:1px solid var(--amber-dim); background:var(--amber-dim); color:var(--amber); }
  .led-strip{ display:flex; gap:6px; align-items:center; }
  .led{ width:9px; height:9px; border-radius:50%; background:#26314a; border:1px solid #2f3c5a; flex:none; }
  .led.on-green{ background:var(--green); border-color:var(--green); box-shadow:0 0 8px var(--green); }
  .led.on-amber{ background:var(--amber); border-color:var(--amber); box-shadow:0 0 8px var(--amber); }
  .led.on-red{ background:var(--red); border-color:var(--red); box-shadow:0 0 8px var(--red); }
  .led.blink{ animation:blinkled 1.1s steps(1) infinite; } @keyframes blinkled{50%{opacity:.15;}}
  .hero{ background:var(--panel); border:1px solid var(--stroke); border-radius:14px; padding:26px 26px 22px; margin-bottom:26px; position:relative; overflow:hidden; }
  .hero::after{ content:""; position:absolute; right:-40px; top:-40px; width:220px; height:220px; background:radial-gradient(circle,var(--cyan-dim),transparent 70%); pointer-events:none; }
  .hero .eyebrow{ font-family:var(--mono); font-size:11px; color:var(--cyan); letter-spacing:.14em; text-transform:uppercase; margin-bottom:10px; }
  .hero h1{ font-size:26px; margin:0 0 10px; line-height:1.25; font-weight:700; }
  .hero p{ color:var(--text-dim); font-size:14.5px; line-height:1.6; max-width:560px; margin:0 0 18px; }
  .panel-row{ display:flex; gap:22px; flex-wrap:wrap; }
  .stat{ font-family:var(--mono); } .stat .num{ font-size:22px; font-weight:700; } .stat .lbl{ font-size:11px; color:var(--text-faint); letter-spacing:.06em; }
  .grid{ display:grid; gap:14px; }
  .mod-card{ background:var(--panel); border:1px solid var(--stroke); border-radius:12px; padding:20px; cursor:pointer; transition:.15s; display:flex; flex-direction:column; gap:12px; position:relative; }
  .mod-card:hover{ border-color:#3a4a70; transform:translateY(-1px); }
  .mod-card .row-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:14px; }
  .mod-card h3{ margin:0 0 6px; font-size:16.5px; } .mod-card .sub{ color:var(--text-dim); font-size:13px; line-height:1.5; margin:0; }
  .mod-card .meta{ font-family:var(--mono); font-size:11px; color:var(--text-faint); display:flex; gap:14px; margin-top:2px; align-items:center; }
  .status-pill{ font-family:var(--mono); font-size:10.5px; letter-spacing:.05em; padding:4px 9px; border-radius:20px; border:1px solid var(--stroke); color:var(--text-faint); white-space:nowrap; text-transform:uppercase; }
  button.status-pill{ background:var(--panel); text-transform:none; letter-spacing:0; font-size:11.5px; }
  button.status-pill:hover{ border-color:#3a4a70; color:var(--text); }
  .team-row-main:hover{ background:#141d30; } html.theme-light .team-row-main:hover{ background:var(--input-bg); }
  .team-row-detail td{ border-bottom:1px solid var(--stroke); background:var(--input-bg); }
  html.theme-light .team-row-detail td{ background:#f5f7fb; }
  .status-pill.done{ color:var(--green); border-color:var(--green-dim); background:var(--green-dim); }
  .status-pill.progress{ color:var(--amber); border-color:var(--amber-dim); background:var(--amber-dim); }
  .progress-bar{ height:5px; border-radius:4px; background:#1c2740; overflow:hidden; } .progress-bar>div{ height:100%; background:linear-gradient(90deg,var(--cyan),var(--green)); }
  .card-tools{ position:absolute; top:14px; right:14px; display:flex; gap:6px; }
  .icon-btn{ width:28px; height:28px; border-radius:7px; border:1px solid var(--stroke); background:#0f1626; color:var(--text-dim); cursor:pointer; font-size:13px; display:flex; align-items:center; justify-content:center; }
  .icon-btn:hover{ border-color:#3a4a70; color:var(--text); } .icon-btn.danger:hover{ border-color:var(--red); color:var(--red); }
  .add-mod-card{ border:1px dashed var(--stroke); border-radius:12px; display:flex; align-items:center; justify-content:center; padding:26px; cursor:pointer; color:var(--text-faint); font-family:var(--mono); font-size:12.5px; }
  .add-mod-card:hover{ border-color:var(--cyan); color:var(--cyan); }
  .lesson-nav{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:22px; }
  .lesson-tab{ font-family:var(--mono); font-size:11.5px; padding:7px 12px; border-radius:8px; border:1px solid var(--stroke); background:var(--panel); color:var(--text-dim); cursor:pointer; }
  .lesson-tab.active{ border-color:var(--cyan); color:var(--cyan); background:var(--cyan-dim); } .lesson-tab.quiz{ margin-left:auto; }
  .card{ background:var(--panel); border:1px solid var(--stroke); border-radius:12px; padding:26px; position:relative; }
  .ref-content .card{ border:none; }
  .card h2{ margin:0 0 4px; font-size:20px; } .card .k-label{ font-family:var(--mono); font-size:11px; color:var(--text-faint); letter-spacing:.1em; text-transform:uppercase; margin-bottom:14px; }
  .card .body{ color:#C7CFE0; }
  .card .body p{ color:#C7CFE0; font-size:14.5px; line-height:1.75; margin:0 0 14px; }
  .card .body ul, .card .body ol{ margin:0 0 14px; padding-left:20px; color:#C7CFE0; font-size:14.5px; line-height:1.8; } .card .body li{ margin-bottom:4px; } .card .body strong{ color:var(--text); }
  .card .body img{ max-width:100%; border-radius:8px; margin:10px 0; display:block; }
  .nav-buttons{ display:flex; justify-content:space-between; margin-top:22px; gap:10px; flex-wrap:wrap; }
  .btn{ font-family:var(--mono); font-size:12.5px; letter-spacing:.03em; padding:10px 18px; border-radius:8px; border:1px solid var(--stroke); background:#182236; color:var(--text); cursor:pointer; transition:.15s; }
  .btn:hover{ border-color:#4a5b82; } .btn.primary{ background:linear-gradient(155deg,#1c3a35,#14261f); border-color:var(--green); color:var(--green); }
  .btn.primary:hover{ box-shadow:0 0 0 1px var(--green); } .btn.danger{ background:linear-gradient(155deg,#3a1c1c,#261414); border-color:var(--red); color:var(--red); } .btn:disabled{ opacity:.35; cursor:not-allowed; }
  .q-progress{ font-family:var(--mono); font-size:11.5px; color:var(--text-faint); margin-bottom:8px; }
  .q-block{ margin-bottom:8px; } .q-block h3{ font-size:16.5px; line-height:1.5; margin:0 0 18px; }
  .opt{ display:flex; align-items:flex-start; gap:12px; padding:13px 15px; border:1px solid var(--stroke); border-radius:9px; margin-bottom:10px; cursor:pointer; background:#0f1626; transition:.12s; }
  .opt:hover{ border-color:#3a4a70; } .opt .dot{ width:15px; height:15px; border-radius:50%; border:1px solid #445071; flex:none; margin-top:2px; }
  .opt span.txt{ font-size:14px; color:#D5DCEA; line-height:1.5; }
  .opt.selected{ border-color:var(--cyan); background:var(--cyan-dim); } .opt.selected .dot{ border-color:var(--cyan); background:var(--cyan); }
  .opt.correct{ border-color:var(--green); background:var(--green-dim); } .opt.correct .dot{ border-color:var(--green); background:var(--green); }
  .opt.wrong{ border-color:var(--red); background:var(--red-dim); } .opt.wrong .dot{ border-color:var(--red); background:var(--red); } .opt.disabled{ cursor:default; }
  .explain{ font-size:13px; color:var(--text-dim); background:#0f1626; border:1px solid var(--stroke); border-radius:8px; padding:12px 14px; margin-top:6px; line-height:1.6; } .explain strong{ color:var(--text); }
  .result-hero{ text-align:center; padding:36px 20px; } .result-hero .big-score{ font-family:var(--mono); font-size:52px; font-weight:700; } .result-hero .verdict{ font-size:14px; color:var(--text-dim); margin-top:6px; }
  .led-array{ display:flex; justify-content:center; gap:8px; margin:22px 0; } .led-array .led{ width:12px; height:12px; }
  footer.foot{ margin-top:60px; text-align:center; font-family:var(--mono); font-size:11px; color:var(--text-faint); }
  .field{ margin-bottom:16px; } .field label{ display:block; font-family:var(--mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-faint); margin-bottom:6px; }
  .field input[type=text],.field input[type=email],.field input[type=password],.field textarea{ width:100%; background:var(--input-bg); border:1px solid var(--stroke); border-radius:8px; color:var(--text); padding:10px 12px; font-size:13.5px; line-height:1.6; font-family:var(--sans); resize:vertical; }
  .search-input{ background:var(--input-bg); border:1px solid var(--stroke); border-radius:8px; color:var(--text); padding:9px 12px; font-size:13px; font-family:var(--sans); }
  .search-input:focus{ border-color:var(--cyan); }
  .field textarea{ font-family:var(--mono); font-size:12.5px; min-height:110px; }
  .field input:focus,.field textarea:focus{ border-color:var(--cyan); } .field .hint{ font-size:11px; color:var(--text-faint); margin-top:5px; }
  .editor-section{ margin-top:30px; } .editor-section-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .editor-section-head h3{ font-size:14px; margin:0; font-family:var(--mono); letter-spacing:.05em; color:var(--text-dim); text-transform:uppercase; }
  .sub-card{ background:var(--input-bg); border:1px solid var(--stroke); border-radius:10px; padding:18px; margin-bottom:14px; position:relative; }
  .sub-card-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; } .sub-card-head .tag{ font-family:var(--mono); font-size:10.5px; color:var(--text-faint); }
  .mini-tools{ display:flex; gap:6px; }
  .mini-btn{ font-family:var(--mono); font-size:10.5px; padding:5px 9px; border-radius:6px; border:1px solid var(--stroke); background:#141d30; color:var(--text-dim); cursor:pointer; }
  .mini-btn:hover{ border-color:#3a4a70; color:var(--text); } .mini-btn.danger:hover{ border-color:var(--red); color:var(--red); }
  .opt-row{ display:flex; align-items:center; gap:10px; margin-bottom:8px; } .opt-row input[type=radio]{ accent-color:var(--green); width:16px; height:16px; flex:none; } .opt-row input[type=text]{ flex:1; }
  .dashed-btn{ width:100%; border:1px dashed var(--stroke); border-radius:9px; background:none; color:var(--text-faint); font-family:var(--mono); font-size:12px; padding:12px; cursor:pointer; }
  .dashed-btn:hover{ border-color:var(--cyan); color:var(--cyan); }
  table.team{ width:100%; border-collapse:collapse; font-size:13px; }
  table.team th{ text-align:left; font-family:var(--mono); font-size:10.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.05em; padding:8px 10px; border-bottom:1px solid var(--stroke); }
  table.team td{ padding:10px; border-bottom:1px solid var(--stroke); color:#D5DCEA; }
  .role-tag{ font-family:var(--mono); font-size:10px; padding:3px 8px; border-radius:12px; border:1px solid var(--stroke); }
  .role-tag.admin{ color:var(--amber); border-color:var(--amber-dim); background:var(--amber-dim); }
  .role-tag.supervisor{ color:var(--cyan); border-color:var(--cyan-dim); background:var(--cyan-dim); }
  .auth-wrap{ max-width:400px; margin:60px auto; }
  .error-msg{ color:var(--red); font-size:12.5px; font-family:var(--mono); margin:-6px 0 12px; }
  .info-msg{ color:var(--cyan); font-size:12.5px; font-family:var(--mono); margin:-6px 0 12px; }
  @media (max-width:640px){ .hero h1{ font-size:21px; } .card{ padding:18px; } }
  html.theme-light{
    --bg:#F3F5FA; --panel:#FFFFFF; --stroke:#DCE3F0; --text:#1B2233; --text-dim:#5B6478; --text-faint:#8891A3;
    --input-bg:#eef1f8; --body-bg-glow:none;
  }
  html.theme-light body{ background:#F3F5FA; }

  /* Programmer — true black terminal, phosphor green */
  html.theme-programmer{
    --bg:#000000; --panel:#000000; --stroke:#1f3d1f; --text:#3dff70; --text-dim:#2ee85c; --text-faint:#22b348;
    --green:#3dff70; --green-dim:#3dff7033; --amber:#ffcc00; --amber-dim:#ffcc0033; --red:#ff4444; --red-dim:#ff444433;
    --cyan:#00ffaa; --cyan-dim:#00ffaa33; --input-bg:#020a04; --body-bg-glow:none;
  }
  html.theme-programmer body{ background:#000000; }
  html.theme-programmer, html.theme-programmer .card .body p, html.theme-programmer .card .body ul, html.theme-programmer .card .body ol, html.theme-programmer .opt span.txt{ font-family:var(--mono); }

  /* Retro Amber — old CRT monochrome terminal */
  html.theme-retro{
    --bg:#0a0603; --panel:#140d05; --stroke:#4a3414; --text:#ffb000; --text-dim:#e6a000; --text-faint:#b3801a;
    --green:#8fe67a; --green-dim:#8fe67a33; --amber:#ffb000; --amber-dim:#ffb00033; --red:#ff6644; --red-dim:#ff664433;
    --cyan:#ffb000; --cyan-dim:#ffb00033; --input-bg:#1a1006; --body-bg-glow:radial-gradient(circle at 15% -10%,#2a1a05 0%,transparent 45%);
  }
  html.theme-retro body{ background:radial-gradient(circle at 15% -10%,#2a1a05 0%,transparent 45%),#0a0603; }

  /* Synthwave — 80s neon */

  /* Content saved with an inline text color — from the color tool, or from
     content pasted in from elsewhere — locks that exact color in, which
     overrides theme switching entirely since inline styles always win over
     CSS no matter what the color value is. This affects both bold and plain
     text, so rather than guessing at specific hex values one at a time,
     force every inline color within body content to the current theme's

     something (a real warning callout, etc.) should use the highlight tool
     instead, which is left untouched here. */

// Sanitizes rich-text HTML before rendering: strips script/iframe/object/
// embed tags, on*= handlers, and javascript: URLs, while preserving normal
// formatting. Applied at render time, not save time — content can reach
// the database through paths other than this app's own editor UI, so
// sanitizing only on the way in would leave existing and future bad data
// unprotected.
const SANITIZE_ALLOWED_TAGS = new Set(['P','BR','B','STRONG','I','EM','U','S','STRIKE','UL','OL','LI','A','SPAN','DIV','IMG','H1','H2','H3','H4','BLOCKQUOTE','TABLE','THEAD','TBODY','TR','TD','TH','HR','SUB','SUP','FONT']);
const SANITIZE_ALLOWED_ATTRS = new Set(['href','src','style','class','target','rel','colspan','rowspan','alt','width','height','data-interactive-pic-id','contenteditable','data-hotspot-id','data-align','draggable','data-link-type','data-link-mod','data-link-lesson','data-link-ref']);
function sanitizeHtml(html){
  if(!html) return '';
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const walk = (node)=>{
    Array.from(node.childNodes).forEach(child=>{
      if(child.nodeType !== 1) return; // only elements need checking — text nodes can't execute anything
      if(!SANITIZE_ALLOWED_TAGS.has(child.tagName)){

        // inline content that was sitting inside an otherwise-disallowed tag.
        while(child.firstChild) node.insertBefore(child.firstChild, child);

function modById(id){ return MODULES.find(m=>m.id===id); }

// stick around in that array even though they no longer correspond to any
// current lesson. Raw .length can then exceed the module's real lesson
// count. This filters to only IDs that still exist in the module.
function viewedLessonCount(lessonsViewedArr, m){
  if(!lessonsViewedArr || !lessonsViewedArr.length || !m) return 0;
  const validIds = new Set(m.lessons.map(l=>l.id));
  return lessonsViewedArr.filter(id=>validIds.has(id)).length;
}

  const s = progressMap[m.id];
  const totalLessons = m.lessons.length || 1;
  const viewedCount = viewedLessonCount(s && s.lessonsViewed, m);
  const lessonFraction = Math.min(viewedCount / totalLessons, 1);
  if(!m.quiz.length) return Math.round(lessonFraction * 100);
  const quizFraction = s ? (s.best||0) / m.quiz.length : 0;
  return Math.round((lessonFraction*0.5 + quizFraction*0.5) * 100);
}
async function markLessonViewed(m, lessonId){
  const existing = progressMap[m.id] || { best:0, total:m.quiz.length, lastScore:0, attempts:0, lessonsViewed:[], startedAt:null, masteredAt:null };
  if(!existing.lessonsViewed) existing.lessonsViewed = [];
  if(existing.lessonsViewed.includes(lessonId)) return; // already recorded, skip the write
  existing.lessonsViewed = [...existing.lessonsViewed, lessonId];
  if(!existing.startedAt) existing.startedAt = new Date().toISOString();

  // and every lesson viewed — so this can be the moment mastery is earned
  // if the quiz was already aced and this was the last lesson left. (The
  // other order — acing the quiz after already viewing every lesson — is
  // handled in finishQuiz() instead.)

      existing.masteredAt = new Date().toISOString();

  dismissedModulePopups = new Set((dismissalsRes.data||[]).map(d=>d.module_id));

  INTERACTIVE_PICTURES = {};

async function ensureInteractivePicImage(ipId){
  const ip = INTERACTIVE_PICTURES[ipId];
  if(!ip || ip.image) return ip; // already have it, or it doesn't exist
  const { data } = await supabase.from("interactive_pictures").select("image").eq("id", ipId).single();
  if(data) ip.image = data.image;
  return ip;
}
async function ensureInteractivePicSlides(ipId){
  const ip = INTERACTIVE_PICTURES[ipId];
  if(!ip || ip.slides) return ip; // already have it (even an empty array counts as "loaded"), or it doesn't exist
  const { data } = await supabase.from("interactive_pictures").select("slides").eq("id", ipId).single();
  ip.slides = (data && data.slides) || [];
  return ip;
}

async function loadProfile(){
  const { data } = await supabase.from("profiles").select("*").eq("id", session.user.id).single();
  profile = data;
  simWarningDismissed = !!(profile && profile.sim_warning_dismissed);
  dashboardShowCompleted = !!(profile && profile.dashboard_show_completed);
  showSearchPreview = !(profile && profile.show_search_preview === false);
}

// Wraps an autosave call so the global loading bar skips it — autosave
// already shows its own "Saving…/Saved" text, unlike genuinely unindicated
// actions (deletes, page loads, button clicks) where the bar is the only feedback.
async function silentSave(fn){
  window.silentSaveDepth = (window.silentSaveDepth||0) + 1;
  try { return await fn(); }
  finally { window.silentSaveDepth = Math.max(0, (window.silentSaveDepth||1) - 1); }
}

function promptDepartmentChoice(){
  return new Promise((resolve)=>{
    // Self-service department selection no longer exists — admins set this
    // at account creation, and the database blocks self-granting it. This
    // screen only appears for legacy accounts or self-grant attempts.
    openModal(`
      <h3>No department access yet</h3>
      <p class="sub">Your account doesn't have access to any department's training content yet. An admin needs to grant this from People — reach out to one to get set up.</p>
      <div class="modal-actions" style="justify-content:center;">
        <button class="btn" id="dept-pick-logout">Log out</button>
      </div>
    `, false, true);
    document.getElementById("dept-pick-logout").addEventListener("click", async ()=>{
      closeModal();
      await supabase.auth.signOut();
    });
    // Deliberately never resolves — there's nothing for afterLogin() to
    // proceed into for an account with no department access at all.
  });
}

async function submitAuth(){
  authError=""; authInfo="";
  const email = document.getElementById("auth-email").value.trim();
  const password = document.getElementById("auth-password").value;
  if(!email || !password){ authError = "Enter an email and password."; renderAuth(); return; }

  const { data, error } = await supabase.auth.signInWithPassword({ email, password });
  if(error){ authError = error.message; renderAuth(); return; }
  session = data.session;
  await afterLogin();
}

function renderSetPassword(){
  const isMandatoryChange = profile && profile.must_change_password;
  const heading = AUTH_LINK_TYPE==='recovery' ? 'Reset your password' : isMandatoryChange ? 'Set a new password' : "You're almost in";
  const sub = AUTH_LINK_TYPE==='recovery' ? 'Choose a new password for your account.' : isMandatoryChange ? "Your admin set a temporary password to get you started — choose your own before continuing." : 'Choose a password to finish setting up your account.';
  root.innerHTML = `
    <div class="auth-wrap">
      <div style="text-align:center;margin-bottom:26px;">
        <div class="brand-text"><div class="name">${T('brand.name','COMPORIUM TRAINING MODULES')}</div></div>
      </div>
      <div class="card">
        <h3 style="margin-top:0;">${heading}</h3>
        <p class="sub">${sub}</p>
        ${authError ? `<div class="error-msg">${escapeHtml(authError)}</div>` : ""}
        <div class="field"><label>New password</label><input type="password" id="setpw-1" placeholder="••••••••"></div>
        <div class="field"><label>Confirm password</label><input type="password" id="setpw-2" placeholder="••••••••"></div>
        <button class="btn primary" id="setpw-submit" style="width:100%;">Set password &amp; continue</button>
      </div>
    </div>
  `;
  document.getElementById("setpw-submit").addEventListener("click", submitSetPassword);
}

async function submitSetPassword(){
  authError = "";
  const pw1 = document.getElementById("setpw-1").value;
  const pw2 = document.getElementById("setpw-2").value;
  if(!pw1 || pw1.length<6){ authError = "Password must be at least 6 characters."; renderSetPassword(); return; }
  if(pw1 !== pw2){ authError = "Passwords don't match."; renderSetPassword(); return; }
  const btn = document.getElementById("setpw-submit");
  btn.disabled = true; btn.textContent = "Saving…";
  const { error } = await supabase.auth.updateUser({ password: pw1 });
  if(error){
    authError = error.message;
    btn.disabled = false; btn.textContent = "Set password & continue";
    renderSetPassword();
    return;
  }
  // Only relevant for the mandatory-change path — profile is already loaded
  // there (afterLogin ran and returned early before reaching here), unlike
  // the invite-link path, where this runs before afterLogin/loadProfile has
  // ever executed at all, so profile would still be null.
  if(profile && profile.must_change_password){
    await supabase.from("profiles").update({ must_change_password:false }).eq("id", session.user.id);
    profile.must_change_password = false;
  }
  await afterLogin();
}

let wasFirstLoginThisSession = false;

async function afterLogin(){
  window.loadingBarSuppressed = true;
  view = "loading"; render();
  await loadProfile();
  if(profile && profile.theme && THEME_NAMES.includes(profile.theme)){
    // The account-level preference wins once we actually know who's logged
    // in — this overrides whatever localStorage/default was showing on the
    // pre-login screen a moment ago.
    applyTheme(profile.theme);
  }
  if(profile && profile.must_change_password){
    // An admin set a temporary password for this account — block everything
    // else until they've chosen their own. Reuses the same screen built for
    // the invite-link flow, just reached a different way.
    window.loadingBarSuppressed = false;
    view = "set-password";
    render();
    return;
  }
  wasFirstLoginThisSession = profile.is_first_login === true;
  if(wasFirstLoginThisSession){
    await supabase.from("profiles").update({ is_first_login:false }).eq("id", session.user.id);
    profile.is_first_login = false;
  }
  if(profile && myDepartments().length===0){
    await promptDepartmentChoice();
  }
  // These four don't depend on each other's results, only on profile being
  // loaded — running them in parallel instead of one-after-another cuts
  // total login time from the sum of all four round trips down to the
  // slowest single one.
  await Promise.all([
    loadEverything(),
    loadUiTextOverrides(),
    loadAllNotifications(),
    loadStandaloneQuizzes()
  ]);
  setupRealtime();
  window.loadingBarSuppressed = false;
  view = "home"; render();
  ensureFeedbackButton();
  await showUnseenAnnouncements();
}

async function showUnseenAnnouncements(){
  const since = profile.last_seen_announcement_at || profile.created_at || "1970-01-01T00:00:00Z";
  const { data, error } = await supabase.from("messages").select("*").eq("audience","all").gt("created_at", since).order("created_at",{ascending:true});
  if(error){ console.error("Failed to check for new announcements:", error); return; }
  const { data: dismissals } = await supabase.from("announcement_dismissals").select("message_id").eq("user_id", session.user.id);
  const dismissedIds = new Set((dismissals||[]).map(d=>d.message_id));
  const unseen = (data || []).filter(a=> !dismissedIds.has(a.id));

  // Unread chat messages — NOTIF_THREADS is already populated from loadAllNotifications() in afterLogin.
  const unreadMessages = [];
  NOTIF_THREADS.forEach(t=> t.messages.forEach(m=>{ if(m.recipient_id===session.user.id && !m.is_read) unreadMessages.push(m); }));

  if(!unseen.length && !unreadMessages.length) return;

  function renderDigest(){
    const annHtml = unseen.length ? `
      <h3 style="font-size:13px;color:var(--text-dim);margin:0 0 10px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.05em;">Announcements</h3>
      ${unseen.map(a=>`
        <div class="sub-card" data-digest-item="${a.id}">
          <div class="sub-card-head"><span class="tag">📣 ${escapeHtml(a.sender_name)} · ${new Date(a.created_at).toLocaleString()}</span>
            <button class="mini-btn" data-digest-dismiss="${a.id}">Dismiss</button></div>
          <div style="font-size:14px;color:var(--text);">${sanitizeHtml(a.body)}</div>
        </div>`).join("")}
    ` : "";

    const msgHtml = unreadMessages.length ? `
      <h3 style="font-size:13px;color:var(--text-dim);margin:${unseen.length?'20px':'0'} 0 10px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.05em;">New messages</h3>
      ${unreadMessages.map(m=>`
        <div class="sub-card">
          <div class="sub-card-head"><span class="tag">💬 ${escapeHtml(m.sender_name)} · ${new Date(m.created_at).toLocaleString()}</span></div>
          <div style="font-size:14px;color:var(--text);">${sanitizeHtml(m.body)}</div>
        </div>`).join("")}
      <button class="btn" id="digest-go-chat" style="margin-top:4px;">Open Chat →</button>
    ` : "";

    const totalCount = unseen.length + unreadMessages.length;
    openModal(`
      <h3>${totalCount===1 ? "1 thing" : `${totalCount} things`} while you were away</h3>
      <p class="sub">Posted or sent while you were logged out.</p>
      ${annHtml}${msgHtml}
      <div class="modal-actions">
        ${unseen.length ? `<button class="btn" id="ann-digest-dismiss-all">Dismiss all</button>` : ""}
        <button class="btn primary" id="ann-digest-ok">Got it</button>
      </div>
    `, true);
    document.querySelectorAll("[data-digest-dismiss]").forEach(el=> el.addEventListener("click", async ()=>{
      const id = el.getAttribute("data-digest-dismiss");
      await supabase.from("announcement_dismissals").upsert({ user_id: session.user.id, message_id: id });
      const idx = unseen.findIndex(u=>u.id===id);
      if(idx>-1) unseen.splice(idx,1);
      if(!unseen.length && !unreadMessages.length){ closeModal(); markAnnouncementsSeen(); }
      else renderDigest();
    }));
    const dismissAllBtn = document.getElementById("ann-digest-dismiss-all");
    if(dismissAllBtn) dismissAllBtn.addEventListener("click", async ()=>{
      await supabase.from("announcement_dismissals").upsert(unseen.map(a=>({ user_id: session.user.id, message_id: a.id })));
      unseen.length = 0;
      if(!unreadMessages.length){ closeModal(); markAnnouncementsSeen(); }
      else renderDigest();
    });
    const goChat = document.getElementById("digest-go-chat");
    if(goChat) goChat.addEventListener("click", ()=>{ closeModal(); markAnnouncementsSeen(); openChat(); });
    document.getElementById("ann-digest-ok").addEventListener("click", ()=>{ closeModal(); markAnnouncementsSeen(); });
  }

  async function markAnnouncementsSeen(){
    if(!data.length) return;
    const latest = data[data.length-1].created_at;
    await supabase.from("profiles").update({ last_seen_announcement_at: latest }).eq("id", session.user.id);
    profile.last_seen_announcement_at = latest;
  }

  renderDigest();
}

async function logout(){
  teardownRealtime();
  closeAllFullscreenOverlays();
  await supabase.auth.signOut();
  session = null; profile = null; MODULES = []; progressMap = {};
  removeFeedbackButton();
  view = "auth"; authMode = "login"; render();
}

function resumeLessonIdx(m){
  const s = progressMap[m.id];
  const viewed = s && s.lessonsViewed ? s.lessonsViewed : [];
  const idx = m.lessons.findIndex(l=> !viewed.includes(l.id));
  return idx === -1 ? Math.max(m.lessons.length-1, 0) : idx;
}
function moduleStatus(id){
  const s = progressMap[id];
  const m = modById(id);
  if(m && !m.quiz.length){
    const viewedCount = viewedLessonCount(s && s.lessonsViewed, m);
    if(m.lessons.length && viewedCount >= m.lessons.length) return "mastered";
    if(viewedCount > 0) return "reading";
    return "new";
  }
  if(!s) return "new";
  if(m && m.quiz.length && s.best === m.quiz.length){
    const viewedCount = viewedLessonCount(s.lessonsViewed, m);
    const allLessonsViewed = !m.lessons.length || viewedCount >= m.lessons.length;
    if(allLessonsViewed) return "mastered";
  }
  if(!s.attempts) return "reading";
  return "attempted";
}

async function reorderModuleDrop(draggedId, targetId, pos){
  const fromIdx = MODULES.findIndex(m=>m.id===draggedId);
  let toIdx = MODULES.findIndex(m=>m.id===targetId);
  if(fromIdx===-1 || toIdx===-1) return;
  if(pos==="after") toIdx++;
  const dragged = MODULES[fromIdx];
  const reordered = MODULES.slice();
  reordered.splice(fromIdx,1);
  if(fromIdx < toIdx) toIdx--;
  reordered.splice(toIdx,0,dragged);
  MODULES = reordered;
  for(let i=0;i<MODULES.length;i++){
    await supabase.from("modules").update({ sort_order:i }).eq("id", MODULES[i].id);
  }
  render();
}

function lessonInteractivePicsComplete(lesson){
  if(!lesson || !lesson.body) return true;
  const matches = [...lesson.body.matchAll(/data-interactive-pic-id="([^"]+)"/g)];
  if(!matches.length) return true;
  return matches.every(m=>{
    const ip = INTERACTIVE_PICTURES[m[1]];
    if(!ip) return true;
    if(ip.type === 'slideshow'){
      if(ip.slides === null) return false; // not loaded yet — safer to block than to silently let this pass before we actually know
      if(!ip.slides.length) return true; // loaded, and genuinely has no slides
      const seenSet = myInteractivePicProgress[m[1]] || new Set();
      return ip.slides.every((s,i)=> seenSet.has(i));
    }
    if(!ip.hotspots.length) return true;
    const readSet = myInteractivePicProgress[m[1]] || new Set();
    return ip.hotspots.every(h=>readSet.has(h.id));
  });
}

async function startQuiz(mode){
  const m = modById(currentModId);
  const wouldBeTestRun = canEditContent() && editMode;
  // Resume an already-live in-memory session as-is. Skipped for test runs —
  // an editor may have just changed the simulation's screens, so a stale
  // session could point at a screen index that no longer exists.
  if(mode !== "missed" && !wouldBeTestRun && quizInProgressModId === currentModId && quizActiveIndices.length){
    view = "quiz"; render();
    return;
  }
  await ensureQuizSimScreens(m);
  quizIsTestRun = wouldBeTestRun;
  quizTestRunResult = null;
  const priorAttempts = (progressMap[m.id] && progressMap[m.id].attempts) || 0;
  if(priorAttempts >= MAX_QUIZ_ATTEMPTS && !canEditContent()){ alert(`You've used all ${MAX_QUIZ_ATTEMPTS} attempts for this quiz.`); return; }
  quizCarriedAnswers = {};

  // Real (non-test-run) sessions: check for a persisted in-progress session
  // for this module — someone who left the site entirely and came back.
  // Validated against the module's current question count in case content
  // changed while they were away; stale/mismatched saves are discarded
  // rather than risking a crash on an out-of-range index.
  if(mode !== "missed" && !quizIsTestRun){
    const { data: saved } = await supabase.from("quiz_in_progress").select("*").eq("user_id", session.user.id).eq("module_id", m.id).maybeSingle();
    if(saved && Array.isArray(saved.active_indices) && saved.active_indices.every(i=> i>=0 && i<m.quiz.length)){
      quizActiveIndices = saved.active_indices;
      quizAnswers = saved.answers || new Array(quizActiveIndices.length).fill(null);
      quizRevealed = saved.revealed || new Array(quizActiveIndices.length).fill(false);
      quizIdx = Math.min(saved.current_idx||0, quizActiveIndices.length-1);
      quizSimScreenIndex = saved.sim_screen_index || {};
      quizSimMisclicks = saved.sim_misclicks || {};
      quizInProgressModId = currentModId;
      view = "quiz"; render();
      return;
    }
  }

  quizSimScreenIndex = {};
  quizSimMisclicks = {};
  if(!quizIsTestRun){
    // Real attempt starting fresh (not resumed) — this is the timestamp
    // that ends up on the quiz_attempts row once it's submitted.
    quizAttemptStartedAt = new Date().toISOString();
    // Also covers modules with no lessons at all, where a quiz attempt is
    // the very first interaction — otherwise "Module Started" would stay
    // N/A forever for those.
    const existingProg = progressMap[m.id];
    if(!existingProg || !existingProg.startedAt){
      const rec = existingProg || { best:0, total:m.quiz.length, lastScore:0, attempts:0, lessonsViewed:[], masteredAt:null };
      rec.startedAt = quizAttemptStartedAt;
      progressMap[m.id] = rec;
      await supabase.from("progress").upsert({
        user_id: session.user.id, module_id: m.id, best_score: rec.best, total: m.quiz.length, last_score: rec.lastScore,
        attempts: rec.attempts, lessons_viewed: rec.lessonsViewed||[], started_at: rec.startedAt, mastered_at: rec.masteredAt||null, updated_at: new Date().toISOString()
      }, { onConflict: "user_id,module_id" });
    }
  }
  if(mode === "missed"){
    const { data: attempts } = await supabase.from("quiz_attempts").select("*").eq("user_id", session.user.id).eq("module_id", m.id).order("created_at", { ascending:false }).limit(1);
    const lastAttempt = attempts && attempts[0];
    if(lastAttempt && lastAttempt.answers && lastAttempt.answers.length === m.quiz.length){
      const missedIdx = [];
      m.quiz.forEach((q,i)=>{
        const priorAns = lastAttempt.answers[i];
        if(priorAns && priorAns.is_correct){
          quizCarriedAnswers[i] = { question:q.q, options:q.opts, selected:priorAns.selected, correct:q.correct, is_correct:true };
        } else {
          missedIdx.push(i);
        }
      });
      quizActiveIndices = missedIdx.length ? missedIdx : m.quiz.map((_,i)=>i);
    } else {
      quizActiveIndices = m.quiz.map((_,i)=>i); // no usable prior attempt — fall back to full quiz
    }
  } else {
    quizActiveIndices = m.quiz.map((_,i)=>i);
  }
  quizAnswers = new Array(quizActiveIndices.length).fill(null);
  quizRevealed = new Array(quizActiveIndices.length).fill(false);
  quizIdx = 0;
  // Test runs never persist to quiz_in_progress, so this marker must skip
  // them too — otherwise a real attempt right after could match the
  // fast-path resume above and restore the test run's completed state.
  if(!quizIsTestRun) quizInProgressModId = currentModId;
  view = "quiz"; render();
}

function scheduleQuizProgressSave(){
  // Test runs and the "missed questions" retake flow don't get persisted —
  // test runs are never real attempts to begin with, and a missed-retake
  // session is short-lived by nature (it only exists right after finishing
  // a full attempt).
  if(quizIsTestRun || !session) return;
  clearTimeout(quizProgressSaveTimer);
  quizProgressSaveTimer = setTimeout(async ()=>{
    modulesWithResumableQuiz.add(currentModId);
    await silentSave(()=> supabase.from("quiz_in_progress").upsert({
      user_id: session.user.id, module_id: currentModId,
      active_indices: quizActiveIndices, answers: quizAnswers, revealed: quizRevealed, current_idx: quizIdx,
      sim_screen_index: quizSimScreenIndex, sim_misclicks: quizSimMisclicks,
      updated_at: new Date().toISOString()
    }, { onConflict: "user_id,module_id" }));
  }, 400);
}

function renderQuiz(){
  const m = modById(currentModId); if(!m||!m.quiz.length){ view="lesson"; render(); return; }
  const realIdx = quizActiveIndices[quizIdx];
  if(realIdx===undefined || !m.quiz[realIdx]){ view="lesson"; render(); return; } // stale quiz session state pointing at a question that doesn't exist for this module — bail to the lesson view rather than crashing
  lastModuleContext = { view:"quiz", modId: currentModId, lessonIdx: currentLessonIdx };
  const q = m.quiz[realIdx]; const revealed = quizRevealed[quizIdx]; const selected = quizAnswers[quizIdx];
  const isMissedRetake = quizActiveIndices.length < m.quiz.length;
  const isSim = q.type === 'simulation';
  const isLast = quizIdx === quizActiveIndices.length-1;
  const editBtn = canEdit() ? `<button class="btn" id="edit-mod-q" style="border-color:var(--amber);color:var(--amber);">✎ Edit module</button>` : "";

  let bodyHtml, nextLabel, nextDisabled;
  if(isSim){
    const screens = q.simScreens || [];
    // Also handles a screen index that's out of bounds for the current
    // screens array, not just an undefined one — a saved/resumed session
    // could point at a screen that no longer exists if the content changed
    // since it was saved, and that should recover gracefully rather than
    // silently showing "not set up" for a question that actually is.
    if(quizSimScreenIndex[quizIdx] === undefined || quizSimScreenIndex[quizIdx] >= screens.length) quizSimScreenIndex[quizIdx] = 0;
    const screen = screens[quizSimScreenIndex[quizIdx]];
    if(!screen || !screen.image){
      bodyHtml = `<p style="color:var(--text-faint);">This simulation hasn't been set up yet.</p>`;
    } else if(selected === "done"){
      bodyHtml = `<div style="position:relative;display:inline-block;max-width:100%;border-radius:8px;box-shadow:0 0 0 3px var(--green), 0 0 22px 4px #2ecc7155;">
        <img src="${screen.image}" style="max-width:100%;display:block;user-select:none;border-radius:8px;opacity:.75;" draggable="false">
      </div><p style="color:var(--green);font-size:13px;margin-top:12px;">✓ Done — you found it.</p>`;
    } else if(selected === "failed"){
      bodyHtml = `<div style="position:relative;display:inline-block;max-width:100%;border-radius:8px;box-shadow:0 0 0 3px var(--red), 0 0 22px 4px #e74c3c55;">
        <img src="${screen.image}" style="max-width:100%;display:block;user-select:none;border-radius:8px;opacity:.75;" draggable="false">
      </div><p style="color:var(--red);font-size:13px;margin-top:12px;">✗ Incorrect — too many missed clicks.</p>`;
    } else {
      bodyHtml = `<p style="color:var(--text-dim);font-size:13.5px;margin-bottom:10px;">This exercise only works in fullscreen. Click the screenshot to begin.</p>
      <div style="position:relative;display:inline-block;max-width:100%;cursor:pointer;" id="sim-play-inline-trigger">
        <img src="${screen.image}" style="max-width:100%;display:block;user-select:none;border-radius:8px;" draggable="false">
        <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#00000055;border-radius:8px;">
          <span style="background:#000000cc;color:var(--cyan);padding:8px 16px;border-radius:20px;font-size:13px;font-family:var(--mono);">⛶ Click to start</span>
        </div>
      </div>`;
    }
    nextLabel = isLast ? 'See results →' : 'Next question →';
    nextDisabled = selected===null;
  } else {
    const opts = q.opts.map((opt,i)=>{ let cls="opt"; if(revealed){ cls+=" disabled"; if(i===q.correct) cls+=" correct"; else if(i===selected) cls+=" wrong"; } else if(i===selected){ cls+=" selected"; }
      return `<div class="${cls}" data-idx="${i}"><div class="dot"></div><span class="txt">${escapeHtml(opt)}</span></div>`; }).join("");
    const explain = revealed ? `<div class="explain"><strong>${selected===q.correct?'Correct.':'Not quite.'}</strong> ${escapeHtml(q.explain)}</div>` : "";
    bodyHtml = opts + explain;
    nextLabel = isLast?(revealed?'See results →':'Check answer'):(revealed?'Next question →':'Check answer');
    nextDisabled = selected===null;
  }

  const jumpNavHtml = canEdit() ? `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;">
    ${quizActiveIndices.map((_,idx)=>`<button class="mini-btn" data-quiz-jump="${idx}" style="${idx===quizIdx?'border-color:var(--amber);color:var(--amber);':''}min-width:34px;">${idx+1}</button>`).join("")}
    <span style="color:var(--text-faint);font-size:11px;font-family:var(--mono);align-self:center;margin-left:6px;">EDIT MODE · JUMP TO ANY QUESTION</span>
  </div>` : "";

  renderShell(`
    <div class="q-progress">MODULE QUIZ${isMissedRetake?' · RETAKING MISSED QUESTIONS':''} · ${escapeHtml(m.title.toUpperCase())} · QUESTION ${quizIdx+1} OF ${quizActiveIndices.length}</div>
    ${jumpNavHtml}
    <div class="card"><div class="q-block"><h3>${escapeHtml(q.q)}</h3>${bodyHtml}</div>
      <div class="nav-buttons"><div style="display:flex;gap:10px;"><button class="btn" id="quiz-prev" ${quizIdx===0?'disabled':''}>← Previous</button>${editBtn}</div>
      <button class="btn primary" id="quiz-next" ${nextDisabled?'disabled':''}>${nextLabel}</button></div>
      <div class="nav-buttons" style="margin-top:8px;"><button class="mini-btn" id="flag-question">🚩 Flag this question</button><div></div></div>
    </div>`);

  if(isSim){
    const handleZoneClick = (zi)=>{
      const screens = q.simScreens;
      const screen = screens[quizSimScreenIndex[quizIdx]];
      const zone = screen.zones[zi];
      if(zone.targetScreenId){
        const nextScreenIdx = screens.findIndex(s=>s.id===zone.targetScreenId);
        if(nextScreenIdx>=0){ quizSimScreenIndex[quizIdx] = nextScreenIdx; return true; }
        return false;
      } else {
        quizAnswers[quizIdx] = "done";
        return true;
      }
    };
    const trigger = document.getElementById("sim-play-inline-trigger");
    if(trigger) trigger.addEventListener("click", ()=>{
      const proceed = ()=> openSimPlayFullscreen(q, quizIdx, handleZoneClick);
      if(simWarningDismissed) proceed(); else showSimWarningModal(proceed);
    });
    document.getElementById("quiz-next").addEventListener("click", ()=>{ if(isLast){ finishQuiz(); } else { quizIdx++; render(); window.scrollTo(0,0); } });
  } else {
    if(!revealed) root.querySelectorAll(".opt").forEach(el=> el.addEventListener("click", ()=>{ quizAnswers[quizIdx]=parseInt(el.getAttribute("data-idx")); scheduleQuizProgressSave(); render(); }));
    document.getElementById("quiz-next").addEventListener("click", ()=>{ if(!revealed){ quizRevealed[quizIdx]=true; scheduleQuizProgressSave(); render(); } else if(isLast){ finishQuiz(); } else { quizIdx++; scheduleQuizProgressSave(); render(); window.scrollTo(0,0); } });
  }
  document.getElementById("quiz-prev").addEventListener("click", ()=>{ if(quizIdx>0){ quizIdx--; render(); window.scrollTo(0,0); } });
  root.querySelectorAll("[data-quiz-jump]").forEach(el=> el.addEventListener("click", ()=>{ quizIdx = +el.getAttribute("data-quiz-jump"); render(); }));
  const editModQ=document.getElementById("edit-mod-q"); if(editModQ) editModQ.addEventListener("click", ()=>openEditor(m.id, undefined, realIdx));
  document.getElementById("flag-question").addEventListener("click", ()=> openFeedbackModal("flag", `${m.title} — Q${quizIdx+1}: ${q.q}`));
}

async function finishQuiz(){
  const m = modById(currentModId);
  const answerDetail = new Array(m.quiz.length);
  quizActiveIndices.forEach((realIdx, i)=>{
    const q = m.quiz[realIdx];
    if(q.type === 'simulation'){
      answerDetail[realIdx] = { question:q.q, type:'simulation', is_correct: quizAnswers[i] === "done" };
    } else {
      answerDetail[realIdx] = { question:q.q, options:q.opts, selected:quizAnswers[i], correct:q.correct, is_correct: quizAnswers[i]===q.correct };
    }
  });
  Object.keys(quizCarriedAnswers).forEach(idxStr=>{ answerDetail[+idxStr] = quizCarriedAnswers[idxStr]; });
  const correctCount = answerDetail.reduce((acc,a)=> acc + (a && a.is_correct ? 1 : 0), 0);

  if(quizIsTestRun){
    // Testing content in edit mode — doesn't count as a real attempt, nothing gets saved.
    quizTestRunResult = { lastScore: correctCount, total: m.quiz.length };
    quizJustFinished = true; view = "results"; render(); window.scrollTo(0,0);
    return;
  }

  quizInProgressModId = null;
  modulesWithResumableQuiz.delete(m.id);
  // Cancel any pending debounced save first — otherwise a save queued right
  // as the last question was answered could fire after this delete,
  // resurrecting the row with stale completed state via upsert.
  clearTimeout(quizProgressSaveTimer);
  await supabase.from("quiz_in_progress").delete().eq("user_id", session.user.id).eq("module_id", m.id);

  const prior = progressMap[m.id];
  const best = Math.max(correctCount, prior?prior.best:0);
  const startedAt = (prior && prior.startedAt) || quizAttemptStartedAt || new Date().toISOString();
  const priorLessonsViewed = prior&&prior.lessonsViewed ? prior.lessonsViewed : [];
  const allLessonsViewed = !m.lessons.length || viewedLessonCount(priorLessonsViewed, m) >= m.lessons.length;
  const masteredAt = (prior && prior.masteredAt) || (best === m.quiz.length && allLessonsViewed ? new Date().toISOString() : null);
  const record = { best, total: m.quiz.length, lastScore: correctCount, attempts: (prior?prior.attempts:0)+1, lessonsViewed: priorLessonsViewed, startedAt, masteredAt };
  progressMap[m.id] = record;
  await supabase.from("progress").upsert({
    user_id: session.user.id, module_id: m.id, best_score: record.best, total: record.total, last_score: record.lastScore, attempts: record.attempts, lessons_viewed: record.lessonsViewed, started_at: record.startedAt, mastered_at: record.masteredAt, updated_at: new Date().toISOString()
  }, { onConflict: "user_id,module_id" });

  await supabase.from("quiz_attempts").insert({
    user_id: session.user.id, module_id: m.id, score: correctCount, total: m.quiz.length, answers: answerDetail, started_at: quizAttemptStartedAt
  });
  quizAttemptStartedAt = null;
  quizJustFinished = true; view = "results"; render(); window.scrollTo(0,0);
}

function renderResults(){
  const m = modById(currentModId); if(!m){ view="dashboard"; render(); return; }
  lastModuleContext = { view:"results", modId: currentModId, lessonIdx: currentLessonIdx };

  if(quizIsTestRun && quizTestRunResult){
    const s = quizTestRunResult;
    const p = s.total ? Math.round((s.lastScore/s.total)*100) : 0;
    if(quizJustFinished){ quizJustFinished = false; if(p===100) launchConfetti(); }
    const leds = Array.from({length:5}).map((_,i)=>{ const lit = i < Math.round((s.lastScore/s.total)*5); const color = p===100?"on-green":p>=60?"on-amber":"on-red"; return `<span class="led ${lit?color:''}"></span>`; }).join("");
    renderShell(`
      <div class="card result-hero"><div class="k-label">TEST RUN · ${escapeHtml(m.title.toUpperCase())}</div>
        <div class="big-score">${s.lastScore}/${s.total}</div><div class="led-array">${leds}</div>
        <p style="color:var(--amber);font-size:13px;margin-top:14px;">⚠ Test run — nothing was saved. This doesn't count as a real attempt.</p>
        <div class="nav-buttons" style="justify-content:center;gap:14px;margin-top:14px;"><button class="btn" id="retake">Retake quiz</button><button class="btn" id="review">Review lessons</button><button class="btn primary" id="back-dash">Back to dashboard</button></div>
      </div>`);
    document.getElementById("retake").addEventListener("click", ()=> startQuiz("full"));
    document.getElementById("review").addEventListener("click", ()=>{ currentLessonIdx=0; view="lesson"; render(); window.scrollTo(0,0); });
    document.getElementById("back-dash").addEventListener("click", ()=>{ view="dashboard"; render(); window.scrollTo(0,0); });
    return;
  }

  const s = progressMap[m.id];
  // Based on s.lastScore (this attempt), not pct(s) (best-ever score) — a
  // mismatch there could show a green "fully registered" verdict and
  // confetti on a failed retake, since the best score never changed.
  const currentPct = s.total ? Math.round((s.lastScore/s.total)*100) : 0;
  if(quizJustFinished){ quizJustFinished = false; if(currentPct===100) launchConfetti(); }
  const leds = Array.from({length:5}).map((_,i)=>{ const lit = i < Math.round((s.lastScore/s.total)*5); const color = currentPct===100?"on-green":currentPct>=60?"on-amber":"on-red"; return `<span class="led ${lit?color:''}"></span>`; }).join("");
  const verdict = currentPct===100?"Fully registered. This module is locked in.":currentPct>=60?"Mostly holding — worth a second pass before it's live-call ready.":"Signal's not there yet. Revisit the lessons and retake when ready.";
  const attemptsUsed = s.attempts || 0;
  const attemptsExhausted = attemptsUsed >= MAX_QUIZ_ATTEMPTS && !canEditContent();
  const hasMissed = s.lastScore < s.total && !attemptsExhausted;
  const attemptsLine = canEditContent()
    ? `<p style="font-family:var(--mono);font-size:13px;margin-top:14px;color:var(--text-dim);">Unlimited attempts (content editor)</p>`
    : `<p style="font-family:var(--mono);font-size:13px;margin-top:14px;color:${attemptsExhausted?'var(--red)':'var(--text-dim)'};">${attemptsUsed}/${MAX_QUIZ_ATTEMPTS} attempts${attemptsExhausted ? ' — No attempts left' : ' — Try again?'}</p>`;
  renderShell(`
    <div class="card result-hero"><div class="k-label">QUIZ RESULT · ${escapeHtml(m.title.toUpperCase())}</div>
      <div class="big-score">${s.lastScore}/${s.total}</div><div class="led-array">${leds}</div><div class="verdict">${escapeHtml(verdict)}</div>
      ${attemptsLine}
      ${hasMissed ? `<label style="display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;font-size:13px;color:var(--text-dim);margin-top:10px;"><input type="checkbox" id="retake-missed-toggle"> Retake missed questions only — questions you already got right won't count against you</label>` : ""}
      <div class="nav-buttons" style="justify-content:center;gap:14px;margin-top:14px;"><button class="btn" id="retake" ${attemptsExhausted?'disabled':''}>Retake quiz</button><button class="btn" id="review">Review lessons</button><button class="btn primary" id="back-dash">Back to dashboard</button></div>
    </div>`);
  const retakeBtn = document.getElementById("retake");
  if(!attemptsExhausted) retakeBtn.addEventListener("click", ()=>{
    const toggle = document.getElementById("retake-missed-toggle");
    startQuiz(toggle && toggle.checked ? "missed" : "full");
  });
  document.getElementById("review").addEventListener("click", ()=>{ currentLessonIdx=0; view="lesson"; render(); window.scrollTo(0,0); });
  document.getElementById("back-dash").addEventListener("click", ()=>{ view="dashboard"; render(); window.scrollTo(0,0); });
}

const ROLE_PRESETS = {
  admin:  { editContent:true,  createQuizzes:true,  managePeople:true,  createAccounts:true },
  supervisor: { editContent:true, createQuizzes:true, managePeople:true, createAccounts:true },
  editor: { editContent:true,  createQuizzes:false, managePeople:false, createAccounts:false },
  agent:  { editContent:false, createQuizzes:false, managePeople:false, createAccounts:false }
};
function computeDisplayRole(perms, actualRole){
  // admin and supervisor share an identical permission preset (both get
  // full access everywhere) — permissions alone can't tell them apart, so
  // check the actual stored role first for exactly these two before
  // falling back to matching by permission combination for everything else.
  if(actualRole === "admin" || actualRole === "supervisor"){
    const preset = ROLE_PRESETS[actualRole];
    if(preset.editContent===perms.editContent && preset.createQuizzes===perms.createQuizzes && preset.managePeople===perms.managePeople && preset.createAccounts===perms.createAccounts) return actualRole;
  }
  for(const roleName of ["admin","editor","agent"]){
    const preset = ROLE_PRESETS[roleName];
    if(preset.editContent===perms.editContent && preset.createQuizzes===perms.createQuizzes && preset.managePeople===perms.managePeople && preset.createAccounts===perms.createAccounts) return roleName;
  }
  return "custom";
}

async function loadQuizProgressData(){
  const dept = currentActiveDepartment();
  const { data: quizzesRaw } = await supabase.from("standalone_quizzes").select("*").eq("sent", true);
  const quizzes = (quizzesRaw||[]).filter(q=> rawRowHasDeptAccess(q, dept));
  quizProgressSentQuizzes = quizzes.slice().sort((a,b)=>{
    if(!a.sent_at && !b.sent_at) return 0;
    if(!a.sent_at) return 1;  // unknown send date (sent before sent_at existed) sorts to the bottom
    if(!b.sent_at) return -1;
    return new Date(b.sent_at) - new Date(a.sent_at); // most recent first
  });
  const { data: attempts } = await supabase.from("standalone_quiz_attempts").select("*");
  const { data: recipients } = await supabase.from("standalone_quiz_recipients").select("*");
  const { data: allTeamMembers } = await supabase.from("team_members").select("*");
  QUIZ_PROGRESS_ROWS = teamRows.map(person=>{
    const eligible = (quizzes||[]).filter(q=>{
      if(q.audience_type==="everyone") return true;
      if(q.audience_type==="team") return (allTeamMembers||[]).some(tm=>tm.team_id===q.team_id && tm.user_id===person.id);
      if(q.audience_type==="specific") return (recipients||[]).some(r=>r.quiz_id===q.id && r.user_id===person.id);
      return false;
    });
    const perQuiz = eligible.map(q=>{
      const attempt = (attempts||[]).find(a=>a.quiz_id===q.id && a.user_id===person.id);
      return { quizId:q.id, title:q.title, completed: !!attempt, needsGrading: !!attempt && !attempt.graded };
    });
    const completedCount = perQuiz.filter(x=>x.completed).length;
    const pct = perQuiz.length ? Math.round((completedCount/perQuiz.length)*100) : 0;
    return { id:person.id, name:person.name, role:person.role, teamIds:person.teamIds, canAccessTs:person.canAccessTs, canAccessCs:person.canAccessCs, canAccessTestboard:person.canAccessTestboard, perQuiz, completedCount, totalCount:perQuiz.length, pct };
  });
}

async function openTeamProgress(){
  const { data: people } = await supabase.from("profiles").select("*").order("name");
  const { data: allProgress } = await supabase.from("progress").select("*");
  const { data: teamsData } = await supabase.from("teams").select("*").order("name");
  const { data: memberships } = await supabase.from("team_members").select("*");

  TEAMS_LIST = (teamsData||[]).map(t=>({
    id: t.id, name: t.name, accessTs: !!t.access_ts, accessCs: !!t.access_cs, accessTestboard: !!t.access_testboard,
    memberIds: (memberships||[]).filter(m=>m.team_id===t.id).map(m=>m.user_id)
  }));

  teamRows = (people||[]).map(p=>{
    const rows = (allProgress||[]).filter(pr=>pr.user_id===p.id);
    const perModule = {};
    const perModuleRaw = {};
    MODULES.forEach(m=>{
      const r = rows.find(rr=>rr.module_id===m.id);
      const totalLessons = m.lessons.length || 1;
      const viewedCount = viewedLessonCount(r && r.lessons_viewed, m);
      const lessonFraction = Math.min(viewedCount/totalLessons, 1);
      if(!m.quiz.length){
        perModule[m.id] = Math.round(lessonFraction * 100);
      } else {
        const quizFraction = r ? (r.best_score||0)/m.quiz.length : 0;
        perModule[m.id] = Math.round((lessonFraction*0.5 + quizFraction*0.5) * 100);
      }
      perModuleRaw[m.id] = { best: r ? (r.best_score||0) : 0, total: m.quiz.length, attempts: r ? (r.attempts||0) : 0, lessonsViewed: r && r.lessons_viewed ? r.lessons_viewed : [] };
    });
    const values = Object.values(perModule);
    const overall = values.length ? Math.round(values.reduce((a,b)=>a+b,0)/values.length) : 0;
    const mastered = values.filter(v=>v===100).length;
    const teamIds = (memberships||[]).filter(m=>m.user_id===p.id).map(m=>m.team_id);
    return { id:p.id, name:p.name, role:p.role, perModule, perModuleRaw, overall, mastered, teamIds,
      permEditContent: !!p.perm_edit_content, permCreateQuizzes: !!p.perm_create_quizzes, permManagePeople: !!p.perm_manage_people, permCreateAccounts: !!p.perm_create_accounts,
      canAccessTs: !!p.can_access_ts, canAccessCs: !!p.can_access_cs, canAccessTestboard: !!p.can_access_testboard };
  });
  view = "team"; render();
}

function generateTempPassword(){
  // Avoids visually ambiguous characters (0/O, 1/l/I) since this password
  // has to be manually relayed to someone — verbally, over chat, whatever —
  // not just copy-pasted by the same person who generated it.
  const chars = "ABCDEFGHJKMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789";
  let pw = "";
  for(let i=0;i<10;i++) pw += chars[Math.floor(Math.random()*chars.length)];
  return pw;
}

  document.getElementById("newuser-cancel").addEventListener("click", closeModal);

  });
  document.getElementById("newuser-submit").addEventListener("click", async ()=>{
    const nameRaw = document.getElementById("newuser-name").value.trim();
    const emailRaw = document.getElementById("newuser-email").value.trim();
    const passwordRaw = document.getElementById("newuser-password").value;
    const role = document.getElementById("newuser-role").value;

    DEPARTMENTS.forEach(d=>{

    });

      showErr((data && data.error) || await extractFunctionError(error));
      btn.disabled = false; btn.textContent = "Create Account";
      return;
    }
    logEdit("created", "user_account", `${nameRaw} (${emailRaw}) created as ${role}`);
    await openTeamProgress(); // refresh the roster so the new account shows up — do this before swapping the modal content below, not after, so it can't be forgotten if something later fails
    showNewUserCreatedModal(nameRaw, emailRaw, passwordRaw);
  });
}

function openTeamManageModal(teamId){
  const team = teamId ? TEAMS_LIST.find(t=>t.id===teamId) : null;
  const memberIds = new Set(team ? team.memberIds : []);
  const mine = myDepartments();
  const initial = {};
  DEPARTMENTS.forEach(d=>{ initial[d.id] = team ? !!team[d.teamField] : mine.includes(d.id); });

  function memberListHtml(includeMap){
    return teamRows.filter(r=> DEPARTMENTS.some(d=> includeMap[d.id] && r[d.rowField])).map(r=>`
      <label style="display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px;color:var(--text);">
        <input type="checkbox" value="${r.id}" class="team-member-check" ${memberIds.has(r.id)?'checked':''}> ${escapeHtml(r.name)}${r.role==='admin'?' <span class="role-tag admin">ADMIN</span>':r.role==='supervisor'?' <span class="role-tag supervisor">SUPERVISOR</span>':''}
      </label>`).join("") || `<p style="color:var(--text-faint);font-size:12.5px;">Nobody has access to the selected department(s) yet.</p>`;
  }

  const deptFieldHtml = team
    ? `<div class="field"><label>Department access</label><p style="color:var(--text-dim);font-size:13px;margin:0;">${DEPARTMENTS.filter(d=>team[d.teamField]).map(d=>d.label).join(' + ')} — set when the team was created, can't be changed after.</p></div>`
    : `<div class="field"><label>Department access</label>
        ${DEPARTMENTS.map(d=>`<label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text);margin-bottom:6px;"><input type="checkbox" data-team-dept-check="${d.id}" ${initial[d.id]?'checked':''}> ${escapeHtml(d.label)}</label>`).join("")}
        <p class="hint">Check one or more — only people with access to a checked department will be selectable below.</p>
      </div>`;

  openModal(`
    <h3>${team ? "Manage team" : "New team"}</h3>
    <div class="field"><label>Team name</label><input type="text" id="team-name-input" value="${team?escapeHtml(team.name):''}" placeholder="e.g. July 2026 New Hires"></div>
    ${deptFieldHtml}
    <div class="field"><label>Members</label>
      <div id="team-member-list" style="max-height:220px;overflow-y:auto;border:1px solid var(--stroke);border-radius:8px;padding:10px;">
        ${memberListHtml(initial)}
      </div>
    </div>
    <div class="modal-actions" style="justify-content:space-between;">
      ${team ? `<button class="btn danger" id="team-delete-btn">Delete team</button>` : `<span></span>`}
      <div style="display:flex;gap:10px;"><button class="btn" id="team-cancel-btn">Cancel</button><button class="btn primary" id="team-save-btn">${team?"Save":"Create"}</button></div>
    </div>
  `, true);
  const checkEls = {};
  DEPARTMENTS.forEach(d=>{ checkEls[d.id] = document.querySelector(`[data-team-dept-check="${d.id}"]`); });
  const currentMap = ()=>{ const m={}; DEPARTMENTS.forEach(d=>{ m[d.id] = checkEls[d.id] ? checkEls[d.id].checked : false; }); return m; };
  const refreshMemberList = ()=>{ document.getElementById("team-member-list").innerHTML = memberListHtml(currentMap()); };
  Object.values(checkEls).forEach(el=>{ if(el) el.addEventListener("change", refreshMemberList); });
  document.getElementById("team-cancel-btn").addEventListener("click", closeModal);
  const delBtn = document.getElementById("team-delete-btn");
  if(delBtn) delBtn.addEventListener("click", async ()=>{
    if(confirm(`Delete "${team.name}"? This can't be undone.`)){
      await supabase.from("teams").delete().eq("id", team.id);
      if(teamRosterFilter === team.id) teamRosterFilter = ""; // don't leave the roster filtered on a team that no longer exists
      QUIZ_PROGRESS_ROWS = null; // team membership changed, force a fresh load next time it's viewed
      closeModal(); await openTeamProgress();
    }
  });
  document.getElementById("team-save-btn").addEventListener("click", async ()=>{
    const name = document.getElementById("team-name-input").value.trim();
    if(!name){ alert("Give the team a name."); return; }
    const selectedIds = Array.from(document.querySelectorAll(".team-member-check:checked")).map(cb=>cb.value);
    let tid = team ? team.id : null;
    if(!tid){
      const map = currentMap();
      if(!DEPARTMENTS.some(d=>map[d.id])){ alert("Check at least one department."); return; }
      const insertObj = { name };
      DEPARTMENTS.forEach(d=>{ insertObj[d.teamDbField] = map[d.id]; });
      const { data, error } = await supabase.from("teams").insert(insertObj).select().single();
      if(error){ alert("Couldn't create team: " + error.message); return; }
      tid = data.id;
    } else {
      await supabase.from("teams").update({ name }).eq("id", tid);
    }
    await supabase.from("team_members").delete().eq("team_id", tid);
    if(selectedIds.length){
      await supabase.from("team_members").insert(selectedIds.map(uid=>({ team_id: tid, user_id: uid })));
    }
    closeModal();
    await openTeamProgress();
  });
}

function renderTeam(){
  if(teamsSectionOpen.quizzes && !QUIZ_PROGRESS_ROWS && teamRows.length){
    loadQuizProgressData().then(()=> render());
  }
  const dept = currentActiveDepartment();
  const deptTeams = TEAMS_LIST.filter(t=> teamHasDeptAccess(t, dept));
  const teamsHtml = deptTeams.length ? deptTeams.map(t=>`
    <span style="display:inline-flex;align-items:center;gap:2px;margin:0 6px 6px 0;">
      <button class="mini-btn" data-manage-team="${t.id}" style="border-top-right-radius:0;border-bottom-right-radius:0;">${escapeHtml(t.name)} · ${t.memberIds.length}</button>
      <button class="mini-btn" data-download-team-tracker="${t.id}" title="Download tracker for ${escapeHtml(t.name)}" style="border-top-left-radius:0;border-bottom-left-radius:0;border-left:1px solid var(--stroke);">⬇</button>
    </span>
  `).join("") : `<p style="color:var(--text-faint);font-size:12.5px;">No teams yet.</p>`;

  // Scoped to people the viewing admin's own department access covers,
  // before role/team/search filters apply on top — otherwise a CS-only
  // admin could see TS reps' names, roles, and progress.
  const deptRows = teamRows.filter(r=> canAccessDeptForRow(r, dept));
  let filteredRows = deptRows;
  if(teamRosterFilter.startsWith("role:")){
    const role = teamRosterFilter.slice(5);
    filteredRows = deptRows.filter(r=> r.role === role);
  } else if(teamRosterFilter){
    filteredRows = deptRows.filter(r=> r.teamIds.includes(teamRosterFilter));
  }
  if(teamSearchQuery.trim()){
    const q = teamSearchQuery.trim().toLowerCase();
    filteredRows = filteredRows.filter(r=> r.name.toLowerCase().includes(q));
  }

  const focusModule = teamModuleFilter ? modById(teamModuleFilter) : null;

  // ---- People rows ----
  const peopleRows = filteredRows.map(r=>{
    const isSelf = r.id===profile.id;
    const pending = pendingRoleChanges[r.id];
    const storedPerms = { editContent:r.permEditContent, createQuizzes:r.permCreateQuizzes, managePeople:r.permManagePeople, createAccounts:r.permCreateAccounts };
    const currentPerms = pending ? pending.perms : storedPerms;
    const displayRole = computeDisplayRole(currentPerms, pending ? pending.role : r.role);
    const panelOpen = permissionsPanelOpen.has(r.id);
    const isDirty = !!pending && (pending.role !== r.role || pending.perms.editContent !== r.permEditContent || pending.perms.createQuizzes !== r.permCreateQuizzes || pending.perms.managePeople !== r.permManagePeople);

    const roleCell = isSelf
      ? `<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
          <span class="role-tag ${r.role==='admin'?'admin':r.role==='supervisor'?'supervisor':''}">${r.role.toUpperCase()} (YOU)</span>
          <button class="mini-btn" data-perm-toggle="${r.id}">Department access ${panelOpen?'▾':'▸'}</button>
        </div>`
      : canManagePeople()
      ? `<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
          <select class="mini-btn" data-role-select="${r.id}">
            <option value="agent" ${displayRole==='agent'?'selected':''}>User</option>
            <option value="editor" ${displayRole==='editor'?'selected':''}>Editor</option>
            <option value="admin" ${displayRole==='admin'?'selected':''}>Admin</option>
            <option value="supervisor" ${displayRole==='supervisor'?'selected':''}>Supervisor</option>
            <option value="custom" ${displayRole==='custom'?'selected':''}>Custom</option>
          </select>
          <button class="mini-btn" data-perm-toggle="${r.id}">Permissions ${panelOpen?'▾':'▸'}</button>
          ${isDirty ? `<button class="mini-btn" data-role-save="${r.id}" style="color:var(--green);border-color:var(--green-dim);">Save</button>` : ""}
        </div>`
      : `<span class="role-tag ${r.role==='admin'?'admin':r.role==='supervisor'?'supervisor':''}">${displayRole.toUpperCase()}</span>`;
    const editPersonBtn = (!isSelf && canManagePeople()) ? `<button class="mini-btn" data-edit-person="${r.id}" data-edit-person-name="${escapeHtml(r.name)}">Edit</button>` : "";
    const mainRow = `<tr><td>${escapeHtml(r.name)}</td><td>${roleCell}</td><td>${editPersonBtn}</td></tr>`;
    const panelRow = panelOpen ? `
      <tr class="team-row-detail"><td colspan="3">
        <div style="padding:10px 4px 16px;display:flex;flex-direction:column;gap:8px;">
          ${!isSelf ? `
          <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text);"><input type="checkbox" data-perm-check="${r.id}:editContent" ${currentPerms.editContent?'checked':''}> Can edit modules, lessons and module quizzes</label>
          <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text);"><input type="checkbox" data-perm-check="${r.id}:createQuizzes" ${currentPerms.createQuizzes?'checked':''}> Can create quizzes</label>
          <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text);"><input type="checkbox" data-perm-check="${r.id}:managePeople" ${currentPerms.managePeople?'checked':''}> Can edit users and teams</label>
          <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text);"><input type="checkbox" data-perm-check="${r.id}:createAccounts" ${currentPerms.createAccounts?'checked':''}> Can add new user accounts</label>
          <div style="border-top:1px solid var(--stroke);margin-top:6px;padding-top:10px;">` : ""}
            ${DEPARTMENTS.map(d=>`<label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text);margin-top:4px;"><input type="checkbox" data-dept-check="${r.id}:${d.id}" ${r[d.rowField]?'checked':''}> Can access ${escapeHtml(d.label)}</label>`).join("")}
          ${!isSelf ? `</div>` : ""}
        </div>
      </td></tr>` : "";
    return mainRow + panelRow;
  }).join("");

  // ---- Module progress rows ----
  const deptModulesForRoster = MODULES.filter(m=> teamHasDeptAccess(m, dept));
  // Drafts excluded from the overall %/mastered stats — trainees can't
  // access them at all, so counting them would understate real progress.
  // Still included in deptModulesForRoster itself, since the per-person
  // expanded view shows draft pills (greyed out) and the module filter
  // dropdown below should still be able to target one.
  const publishedModulesForRoster = deptModulesForRoster.filter(m=>m.isPublished);
  // Recomputed here, scoped to only the active department's modules —
  // r.overall/r.mastered were computed once across both departments mixed
  // together, so switching tabs could still show "100% mastered" on a tab
  // with zero modules in it.
  function deptOverallFor(r){
    const values = publishedModulesForRoster.map(m=> r.perModule[m.id]).filter(v=> v!==undefined);
    return values.length ? Math.round(values.reduce((a,b)=>a+b,0)/values.length) : 0;
  }
  function deptMasteredFor(r){
    return publishedModulesForRoster.filter(m=> r.perModule[m.id]===100).length;
  }
  // Supervisors are hidden from Module Progress by default (not from
  // People above, which always shows everyone) — filtering explicitly to
  // "Supervisors" exempts the hide, since that obviously wants them.
  const moduleProgressRows = (!includeSupervisorsInProgress && teamRosterFilter !== 'role:supervisor')
    ? filteredRows.filter(r=> r.role !== 'supervisor')
    : filteredRows;
  const moduleSortedRows = teamModuleSort ? moduleProgressRows.slice().sort((a,b)=>{
    const va = focusModule ? (a.perModule[focusModule.id]||0) : deptOverallFor(a);
    const vb = focusModule ? (b.perModule[focusModule.id]||0) : deptOverallFor(b);
    return teamModuleSort==="asc" ? va-vb : vb-va;
  }) : moduleProgressRows.slice().sort((a,b)=> a.name.localeCompare(b.name));
  const moduleRows = moduleSortedRows.map(r=>{
    const expanded = teamExpandedRows.has(r.id);
    const moduleGrid = deptModulesForRoster.map(m=>{
      if(!m.isPublished){
        return `<span class="status-pill" title="Draft — not yet accessible to this person" style="cursor:not-allowed;opacity:.45;background:var(--panel);text-transform:none;letter-spacing:0;font-size:11.5px;">${escapeHtml(m.title)} · Draft</span>`;
      }
      const pct = r.perModule[m.id];
      const cls = pct===100 ? "done" : pct>0 ? "progress" : "";
      const isSelected = attemptDetailFor && attemptDetailFor.userId===r.id && attemptDetailFor.moduleId===m.id;
      return `<button class="status-pill ${cls}" data-view-attempt="${r.id}:${m.id}" style="cursor:pointer;${isSelected ? 'box-shadow:0 0 0 2px var(--cyan), 0 0 14px 3px #22d3ee66;' : ''}">${escapeHtml(m.title)} · ${pct}%</button>`;
    }).join("");

    let progressCell, thirdCell;
    if(focusModule){
      const pct = r.perModule[focusModule.id];
      const raw = r.perModuleRaw[focusModule.id];
      progressCell = `<td style="min-width:160px;">
          <div style="display:flex;align-items:center;gap:8px;">
            <div class="progress-bar" style="flex:1;"><div style="width:${pct}%"></div></div>
            <span style="font-family:var(--mono);font-size:11.5px;color:var(--text-dim);white-space:nowrap;">${pct}%</span>
          </div>
        </td>`;
      thirdCell = `<td style="font-family:var(--mono);font-size:12px;color:var(--text-dim);white-space:nowrap;">${!focusModule.quiz.length ? "No quiz for this module" : (raw.attempts ? `${raw.best}/${raw.total} (${raw.total?Math.round((raw.best/raw.total)*100):0}%) correct` : "no attempts yet")}</td>`;
    } else {
      progressCell = `<td style="min-width:160px;">
          <div style="display:flex;align-items:center;gap:8px;">
            <div class="progress-bar" style="flex:1;"><div style="width:${deptOverallFor(r)}%"></div></div>
            <span style="font-family:var(--mono);font-size:11.5px;color:var(--text-dim);white-space:nowrap;">${deptOverallFor(r)}%</span>
          </div>
        </td>`;
      thirdCell = `<td style="font-family:var(--mono);font-size:12px;color:var(--text-dim);white-space:nowrap;">${deptMasteredFor(r)}/${publishedModulesForRoster.length} (${publishedModulesForRoster.length?Math.round((deptMasteredFor(r)/publishedModulesForRoster.length)*100):0}%) mastered</td>`;
    }

    const mainRow = `
      <tr class="team-row-main" data-team-toggle="${r.id}" style="cursor:pointer;">
        <td>${escapeHtml(r.name)}</td>
        ${progressCell}
        ${thirdCell}
        <td style="text-align:center;color:var(--text-faint);">${expanded?'▾':'▸'}</td>
      </tr>`;
    const detailRow = expanded ? `
      <tr class="team-row-detail"><td colspan="4">
        <div style="display:flex;flex-wrap:wrap;gap:8px;padding:14px 4px 14px;">
          ${moduleGrid || `<span style="color:var(--text-faint);font-size:12.5px;">No modules yet.</span>`}
        </div>
        ${(attemptDetailFor && attemptDetailFor.userId===r.id) ? renderInlineAttemptDetailHtml(r) : ""}
      </td></tr>` : "";
    return mainRow + detailRow;
  }).join("");

  // ---- Quiz progress rows ----
  let quizRowsHtml = `<p style="color:var(--text-faint);font-size:13px;">Loading…</p>`;
  const focusQuiz = teamQuizFilter ? quizProgressSentQuizzes.find(q=>q.id===teamQuizFilter) : null;
  if(QUIZ_PROGRESS_ROWS){
    let filteredQuizRows = QUIZ_PROGRESS_ROWS.filter(r=> canAccessDeptForRow(r, dept));
    if(teamRosterFilter.startsWith("role:")){
      filteredQuizRows = filteredQuizRows.filter(r=> r.role === teamRosterFilter.slice(5));
    } else if(teamRosterFilter){
      filteredQuizRows = filteredQuizRows.filter(r=> (r.teamIds||[]).includes(teamRosterFilter));
    }
    if(teamSearchQuery.trim()){
      const q = teamSearchQuery.trim().toLowerCase();
      filteredQuizRows = filteredQuizRows.filter(r=> r.name.toLowerCase().includes(q));
    }
    if(!includeSupervisorsInProgress && teamRosterFilter !== 'role:supervisor'){
      filteredQuizRows = filteredQuizRows.filter(r=> r.role !== 'supervisor');
    }
    if(teamQuizSort) filteredQuizRows = filteredQuizRows.slice().sort((a,b)=> teamQuizSort==="asc" ? a.pct-b.pct : b.pct-a.pct);
    else filteredQuizRows = filteredQuizRows.slice().sort((a,b)=> a.name.localeCompare(b.name));
    quizRowsHtml = filteredQuizRows.map(r=>{
      const expanded = quizProgressExpandedRows.has(r.id);
      const quizPills = r.perQuiz.map(pq=>{
        const cls = pq.needsGrading ? 'progress' : pq.completed ? 'done' : '';
        const label = pq.needsGrading ? 'Needs grading' : pq.completed ? 'Completed' : 'Not started';
        return `<button class="status-pill ${cls}" ${pq.completed?`data-view-quiz-attempt="${r.id}:${pq.quizId}"`:''} style="${pq.completed?'cursor:pointer;':'cursor:default;'}">${escapeHtml(pq.title)} · ${label}</button>`;
      }).join("");
      let progressCell, thirdCell;
      if(focusQuiz){
        const pq = r.perQuiz.find(x=>x.quizId===focusQuiz.id);
        const pct = pq && pq.completed ? 100 : 0;
        const status = !pq ? "Not eligible" : pq.needsGrading ? "Needs grading" : pq.completed ? "Completed" : "Not started";

      } else {

    el.disabled = true; el.textContent = "Resetting…";
    const { error: delErr } = await supabase.from("quiz_attempts").delete().eq("user_id", userId).eq("module_id", moduleId);

    if(updErr){ alert("Couldn't reset: " + updErr.message); el.disabled = false; el.textContent = "🔄 Reset Attempts"; return; }
    // Reflect the reset locally rather than re-fetching everything — these
