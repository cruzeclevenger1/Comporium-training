let ANALYZE_MODULE_STATS = [];
let ANALYZE_MISSED_QUESTIONS = [];
let ANALYZE_TOTALS = { totalPeople:0, notStarted:0, totalAttempts:0, totalFlags:0 };

/* ============================================================
   STANDALONE QUIZZES — admin-authored, no module attached.
   Separate from Training Module quizzes entirely.
   ============================================================ */
let QUIZZES = [];
let quizAlertActive = false; // drives the red/green dot on the Home "Quizzes" card
let quizListSectionOpen = { pending:true, completed:false, sent:false, sentCompleted:false };
let currentQuizId = null;
let quizTakeAnswers = {};
let quizBuilderDraft = null;
let expandedQuizQuestionIdx = null;

async function loadStandaloneQuizzes(){
  if(guestMode){ QUIZZES = []; return; }
  const [{ data: quizzes }, { data: questions }, { data: myAttempts }, { data: myTeamMemberships }, { data: myRecipientRows }] = await Promise.all([
    supabase.from("standalone_quizzes").select("*").order("created_at", { ascending:false }),
    supabase.from("standalone_quiz_questions").select("*").order("sort_order"),
    supabase.from("standalone_quiz_attempts").select("*").eq("user_id", session.user.id),
    supabase.from("team_members").select("team_id").eq("user_id", session.user.id),
    supabase.from("standalone_quiz_recipients").select("quiz_id").eq("user_id", session.user.id)
  ]);
  const myTeamIds = new Set((myTeamMemberships||[]).map(m=>m.team_id));
  const myRecipientQuizIds = new Set((myRecipientRows||[]).map(r=>r.quiz_id));

  QUIZZES = (quizzes||[])
    .filter(q=> guestMode || canAccessDepartment(q.department||'TS'))
    .map(q=>{
    // Broad visibility (via RLS) lets any quiz-manager see every quiz, for
    // management purposes. That's NOT the same as "this quiz is actually
    // meant for me to take" — compute that separately and explicitly.
    let isRecipient = false;
    if(q.sent){
      if(q.audience_type === "everyone") isRecipient = true;
      else if(q.audience_type === "team") isRecipient = myTeamIds.has(q.team_id);
      else if(q.audience_type === "specific") isRecipient = myRecipientQuizIds.has(q.id);
    }
    return {
      id:q.id, title:q.title, createdBy:q.created_by, createdByName:q.created_by_name, department:q.department||'TS',
      audienceType:q.audience_type, teamId:q.team_id, sent:q.sent, createdAt:q.created_at,
      questions:(questions||[]).filter(qq=>qq.quiz_id===q.id).map(qq=>({ id:qq.id, type:qq.question_type, question:qq.question, options:qq.options||[], correct:qq.correct_index, explain:qq.explanation||"" })),
      myAttempt: (myAttempts||[]).find(a=>a.quiz_id===q.id) || null,
      isRecipient, isFullyComplete:false // filled in by the background pass below, for quiz-managers only
    };
  });

  // A reasonable first-pass value so the dashboard LED is correct immediately
  // for regular users; managers get a more complete answer (including ungraded
  // submissions) once the background pass below finishes.
  quizAlertActive = QUIZZES.some(q=> q.isRecipient && !q.myAttempt);

  // Completion status across everyone (not just yourself) is only needed for
  // quiz-managers, and requires 4 extra bulk queries — not worth blocking
  // everyone else's login for. Runs after the page is already usable.
  if(canCreateQuizzes()) loadQuizManagerExtras().catch(()=>{});
}

async function loadQuizManagerExtras(){
  const [aAttempts, aTeamMembers, aRecipients, aProfiles] = await Promise.all([
    supabase.from("standalone_quiz_attempts").select("quiz_id,user_id,graded"),
    supabase.from("team_members").select("team_id,user_id"),
    supabase.from("standalone_quiz_recipients").select("quiz_id,user_id"),
    supabase.from("profiles").select("id")
  ]);
  const allAttempts = aAttempts.data || [], allTeamMembers = aTeamMembers.data || [];
  const allRecipients = aRecipients.data || [], allProfileIds = (aProfiles.data || []).map(p=>p.id);

  QUIZZES.forEach(q=>{
    if(!q.sent) return;
    let eligibleIds;
    if(q.audienceType === "everyone") eligibleIds = allProfileIds;
    else if(q.audienceType === "team") eligibleIds = allTeamMembers.filter(m=>m.team_id===q.teamId).map(m=>m.user_id);
    else eligibleIds = allRecipients.filter(r=>r.quiz_id===q.id).map(r=>r.user_id);
    q.isFullyComplete = eligibleIds.length > 0 && eligibleIds.every(uid=>{
      const att = allAttempts.find(a=>a.quiz_id===q.id && a.user_id===uid);
      return att && att.graded;
    });
  });

  const hasPending = QUIZZES.some(q=> q.isRecipient && !q.myAttempt);
  const hasUngraded = allAttempts.some(a=> !a.graded);
  quizAlertActive = hasPending || hasUngraded;
  if(view==="home" || view==="quizzes") render(); // refresh the LED / Sent Quizzes tab now that this landed
}

async function openAnalyze(){
  if(guestMode){ view = "analyze"; render(); return; }
  const dept = currentActiveDepartment();
  const deptModules = MODULES.filter(m=> m.department===dept);
  const deptModuleIds = new Set(deptModules.map(m=>m.id));
  const { data: profilesData } = await supabase.from("profiles").select("id,can_access_ts,can_access_cs");
  const { data: allProgressRaw } = await supabase.from("progress").select("*");
  const { data: allAttemptsRaw } = await supabase.from("quiz_attempts").select("*");
  const { data: flagRows } = await supabase.from("messages").select("department").in("type", ["flag","comment","highlight"]);
  const allProgress = (allProgressRaw||[]).filter(p=> deptModuleIds.has(p.module_id));
  const allAttempts = (allAttemptsRaw||[]).filter(a=> deptModuleIds.has(a.module_id));

  const totalPeople = (profilesData||[]).filter(p=> dept==='CS' ? p.can_access_cs : p.can_access_ts).length;
  const startedUserIds = new Set(allProgress.map(p=>p.user_id));
  const notStarted = Math.max(totalPeople - startedUserIds.size, 0);

  ANALYZE_MODULE_STATS = deptModules.map(m=>{
    const progRows = allProgress.filter(p=>p.module_id===m.id);
    const totalLessons = m.lessons.length || 1;
    const hasQuiz = m.quiz.length > 0;
    const completions = progRows.map(p=>{
      const viewedCount = p.lessons_viewed ? p.lessons_viewed.length : 0;
      const lessonFraction = Math.min(viewedCount/totalLessons, 1);
      if(!hasQuiz) return lessonFraction * 100;
      const quizFraction = (p.best_score||0)/m.quiz.length;
      return (lessonFraction*0.5 + quizFraction*0.5) * 100;
    });
    const avgCompletion = completions.length ? Math.round(completions.reduce((a,b)=>a+b,0)/completions.length) : 0;
    const masteredCount = hasQuiz
      ? progRows.filter(p=> p.best_score===m.quiz.length).length
      : progRows.filter(p=> (p.lessons_viewed?p.lessons_viewed.length:0) >= m.lessons.length).length;
    const startedCount = progRows.length;
    return { id:m.id, title:m.title, avgCompletion, masteredCount, startedCount };
  });

  // Only count each person's most recent attempt per module — matching what
  // showAttemptDetail shows ("their latest attempt"). Counting every historical
  // attempt made "missed" numbers disagree with someone's current, corrected
  // standing after a retake.
  const latestAttemptByUserModule = {};
  allAttempts.forEach(a=>{
    const key = a.user_id + "::" + a.module_id;
    const existing = latestAttemptByUserModule[key];
    if(!existing || new Date(a.created_at) > new Date(existing.created_at)) latestAttemptByUserModule[key] = a;
  });
  const questionTally = {};
  Object.values(latestAttemptByUserModule).forEach(a=>{
    (a.answers||[]).forEach(ans=>{
      const key = a.module_id + "::" + ans.question;
      if(!questionTally[key]) questionTally[key] = { moduleId:a.module_id, question:ans.question, total:0, missed:0 };
      questionTally[key].total++;
      if(!ans.is_correct) questionTally[key].missed++;
    });
  });
  ANALYZE_MISSED_QUESTIONS = Object.values(questionTally)
    .filter(q=>q.missed>0)
    .map(q=>({ ...q, missRate: Math.round((q.missed/q.total)*100), moduleTitle: (modById(q.moduleId)||{}).title || "Unknown module" }))
    .sort((a,b)=> b.missed - a.missed)
    .slice(0, 50); // kept broader than the old top-10 so filtering by a specific module below isn't starved of results

  const flagCount = (flagRows||[]).filter(m=> !m.department || m.department===dept).length;
  ANALYZE_TOTALS = { totalPeople, notStarted, totalAttempts: allAttempts.length, totalFlags: flagCount };

  view = "analyze"; render();
}

let moduleAnalyzeDetailModule = null;
let moduleAnalyzeDetailRoster = [];
let moduleAnalyzeDetailExpandedPerson = null;
let moduleAnalyzeDetailExpandedAttempt = null;

async function openModuleAnalyzeDetail(moduleId){
  const m = modById(moduleId);
  if(!m){ alert("Couldn't find that module."); return; }
  const { data: attempts } = await supabase.from("quiz_attempts").select("*").eq("module_id", moduleId).order("created_at", { ascending:true });
  const { data: allProfiles } = await supabase.from("profiles").select("id,name");
  const byUser = {};
  (attempts||[]).forEach(a=>{
    if(!byUser[a.user_id]) byUser[a.user_id] = [];
    byUser[a.user_id].push(a);
  });
  moduleAnalyzeDetailModule = m;
  moduleAnalyzeDetailRoster = Object.keys(byUser).map(uid=>{
    const person = (allProfiles||[]).find(p=>p.id===uid);
    const userAttempts = byUser[uid];
    const bestAttempt = userAttempts.reduce((best, a)=>{
      if(!best) return a;
      if((a.score||0) > (best.score||0)) return a;
      if((a.score||0) === (best.score||0) && new Date(a.created_at) > new Date(best.created_at)) return a;
      return best;
    }, null);
    return { id:uid, name: person?person.name:'Unknown', attempts:userAttempts, best: bestAttempt.score||0, total: bestAttempt.total || m.quiz.length };
  }).sort((a,b)=> a.name.localeCompare(b.name));
  moduleAnalyzeDetailExpandedPerson = null;
  moduleAnalyzeDetailExpandedAttempt = null;
  view = "module-analyze-detail"; render();
}

function renderAttemptMissedQuestions(a){
  const missed = (a.answers||[]).filter(x=>!x.is_correct);
  if(!missed.length) return `<p style="color:var(--green);font-size:13px;">No missed questions on this attempt — clean sweep.</p>`;
  return missed.map(x=>`
    <div class="sub-card">
      <div style="font-size:13.5px;margin-bottom:6px;color:var(--text);">${escapeHtml(x.question)}</div>
      <div style="font-size:12.5px;color:var(--red);margin-bottom:2px;">Their answer: ${escapeHtml(x.options[x.selected] ?? '(no answer)')}</div>
      <div style="font-size:12.5px;color:var(--green);">Correct answer: ${escapeHtml(x.options[x.correct])}</div>
    </div>`).join("");
}

function renderModuleAnalyzeDetail(){
  const m = moduleAnalyzeDetailModule;
  if(!m){ view="analyze"; render(); return; }
  const rows = moduleAnalyzeDetailRoster.map(r=>{
    const expanded = moduleAnalyzeDetailExpandedPerson === r.id;
    const mainRow = `<tr class="team-row-main" style="cursor:pointer;">
      <td data-manalyze-toggle="${r.id}">${escapeHtml(r.name)}</td>
      <td data-manalyze-toggle="${r.id}" style="font-family:var(--mono);font-size:12px;color:var(--text-dim);white-space:nowrap;">${r.best}/${r.total} (${r.total?Math.round((r.best/r.total)*100):0}%) best</td>
      <td data-manalyze-toggle="${r.id}" style="font-family:var(--mono);font-size:12px;color:var(--text-faint);white-space:nowrap;">${r.attempts.length} attempt${r.attempts.length===1?'':'s'}</td>
      <td><button class="mini-btn danger" data-manalyze-reset="${r.id}" data-manalyze-reset-name="${escapeHtml(r.name)}">Reset attempts</button></td>
      <td data-manalyze-toggle="${r.id}" style="text-align:center;color:var(--text-faint);">${expanded?'▾':'▸'}</td>
    </tr>`;
    const detailRow = expanded ? `<tr class="team-row-detail"><td colspan="5">
      <div style="display:flex;flex-direction:column;gap:8px;padding:10px 4px 16px;">
        ${r.attempts.map((a,i)=>{
          const attemptExpanded = moduleAnalyzeDetailExpandedAttempt === a.id;
          return `<div>
            <button class="mini-btn" data-manalyze-attempt="${r.id}:${a.id}" style="width:100%;text-align:left;">Attempt ${i+1}: ${a.score}/${a.total} · ${new Date(a.created_at).toLocaleString()} ${attemptExpanded?'▾':'▸'}</button>
            ${attemptExpanded ? `<div style="padding:10px 4px 4px;">${renderAttemptMissedQuestions(a)}</div>` : ""}
          </div>`;
        }).join("")}
      </div>
    </td></tr>` : "";
    return mainRow + detailRow;
  }).join("");

  renderShell(`
    <div class="card">
      <div class="k-label">MODULE PERFORMANCE</div>
      <h2 style="margin-bottom:4px;">${escapeHtml(m.title)}</h2>
      <p style="color:var(--text-dim);font-size:13.5px;margin:0 0 20px;">Everyone who's attempted this module's quiz — up to 3 attempts each. Click a person, then an attempt, to see exactly which questions were missed on that attempt. "Reset attempts" clears their history so they can take it fresh.</p>
      <div style="overflow-x:auto;"><table class="team"><thead><tr><th>Name</th><th>Best score</th><th>Attempts</th><th></th><th></th></tr></thead><tbody>${rows || `<tr><td colspan="5" style="color:var(--text-faint);font-size:13px;padding:16px 4px;">No attempts yet.</td></tr>`}</tbody></table></div>
      <div class="nav-buttons"><button class="btn" id="manalyze-back">← Back to Analyze</button><div></div></div>
    </div>
  `);
  document.getElementById("manalyze-back").addEventListener("click", ()=>{ view="analyze"; render(); });
  root.querySelectorAll("[data-manalyze-reset]").forEach(el=> el.addEventListener("click", async (e)=>{
    e.stopPropagation();
    const uid = el.getAttribute("data-manalyze-reset");
    const name = el.getAttribute("data-manalyze-reset-name");
    if(!confirm(`Reset all quiz attempts for ${name} on "${m.title}"? This clears their attempt count, score, and history — they'll be able to take it fresh, up to 3 more times. Their lesson-reading progress is not affected.`)) return;
    const { error: delErr } = await supabase.from("quiz_attempts").delete().eq("user_id", uid).eq("module_id", m.id);
    if(delErr){ alert("Couldn't reset: " + delErr.message); return; }
    await supabase.from("progress").update({ best_score:0, last_score:0, attempts:0 }).eq("user_id", uid).eq("module_id", m.id);
    logEdit("reset", "module_quiz_attempts", `${m.title} — ${name}`);
    if(uid === session.user.id) await loadEverything(); // refresh our own cached progress, not just the roster view
    showToast("Attempts reset.");
    await openModuleAnalyzeDetail(m.id);
  }));
  root.querySelectorAll("[data-manalyze-toggle]").forEach(el=> el.addEventListener("click", ()=>{
    const uid = el.getAttribute("data-manalyze-toggle");
    moduleAnalyzeDetailExpandedPerson = (moduleAnalyzeDetailExpandedPerson===uid) ? null : uid;
    moduleAnalyzeDetailExpandedAttempt = null;
    render();
  }));
  root.querySelectorAll("[data-manalyze-attempt]").forEach(el=> el.addEventListener("click", (e)=>{
    e.stopPropagation();
    const [, attemptId] = el.getAttribute("data-manalyze-attempt").split(":");
    moduleAnalyzeDetailExpandedAttempt = (moduleAnalyzeDetailExpandedAttempt===attemptId) ? null : attemptId;
    render();
  }));
}

let QUIZ_ANALYZE_ROWS = [];
let QUIZ_ANALYZE_MISSED = [];
let QUIZ_ANALYZE_TOTALS = { totalQuizzes:0, totalPeople:0, avgCompletion:0, totalSubmissions:0 };

async function openQuizAnalyze(){
  if(!QUIZ_PROGRESS_ROWS) await loadQuizProgressData();
  const { data: quizzes } = await supabase.from("standalone_quizzes").select("*").eq("sent", true);
  const { data: questions } = await supabase.from("standalone_quiz_questions").select("*");
  const { data: attempts } = await supabase.from("standalone_quiz_attempts").select("*");

  const totalPeople = QUIZ_PROGRESS_ROWS.length;
  const avgCompletion = totalPeople ? Math.round(QUIZ_PROGRESS_ROWS.reduce((a,r)=>a+r.pct,0)/totalPeople) : 0;

  QUIZ_ANALYZE_ROWS = (quizzes||[]).map(q=>{
    const qAttempts = (attempts||[]).filter(a=>a.quiz_id===q.id);
    const eligibleCount = QUIZ_PROGRESS_ROWS.filter(r=> r.perQuiz.some(pq=>pq.quizId===q.id)).length;
    return { id:q.id, title:q.title, submissions:qAttempts.length, eligibleCount };
  });

  const questionTally = {};
  (attempts||[]).forEach(a=>{
    (a.answers||[]).forEach(ans=>{
      if(ans.type !== "multiple_choice") return;
      const key = a.quiz_id + "::" + ans.question;
      if(!questionTally[key]) questionTally[key] = { quizId:a.quiz_id, question:ans.question, total:0, missed:0 };
      questionTally[key].total++;
      if(!ans.is_correct) questionTally[key].missed++;
    });
  });
  QUIZ_ANALYZE_MISSED = Object.values(questionTally)
    .filter(q=>q.missed>0)
    .map(q=>({ ...q, missRate: Math.round((q.missed/q.total)*100), quizTitle: (quizzes||[]).find(x=>x.id===q.quizId)?.title || "Unknown quiz" }))
    .sort((a,b)=> b.missed - a.missed)
    .slice(0, 50);

  QUIZ_ANALYZE_TOTALS = { totalQuizzes: (quizzes||[]).length, totalPeople, avgCompletion, totalSubmissions: (attempts||[]).length };
  view = "quiz-analyze"; render();
}

/* ============================================================
   NOTIFICATIONS / MESSAGING
   ============================================================ */
async function loadAllNotifications(){
  if(guestMode) return;
  const joinCutoff = (profile && profile.created_at) ? profile.created_at : "1970-01-01T00:00:00Z";
  const admin = isAdmin();
  // None of these seven depend on each other's results — only followUps
  // below does (it needs rootIds, computed from these). Previously run one
  // at a time, up to 8 round trips in a row; now a single batch, cutting
  // the wait to the slowest individual query plus one extra round trip for
  // followUps, instead of the sum of all of them.
  const [
    { data: announcements, error: announceErr },
    { data: dismissals },
    { data: myRoots },
    { data: directSent },
    { data: directReceived },
    ucRes,
    mcRes
  ] = await Promise.all([
    supabase.from("messages").select("*").eq("audience","all").gte("created_at", joinCutoff).order("created_at",{ascending:false}).limit(15),
    supabase.from("announcement_dismissals").select("message_id").eq("user_id", session.user.id),
    supabase.from("messages").select("*").eq("audience","admins").is("thread_id", null).eq("sender_id", session.user.id).order("created_at",{ascending:false}),
    supabase.from("messages").select("*").eq("audience","user").is("thread_id", null).eq("sender_id", session.user.id).order("created_at",{ascending:false}),
    supabase.from("messages").select("*").eq("audience","user").is("thread_id", null).eq("recipient_id", session.user.id).order("created_at",{ascending:false}),
    admin ? supabase.from("messages").select("*").eq("audience","admins").is("thread_id", null).is("claimed_by", null).order("created_at",{ascending:false}) : Promise.resolve({ data: null }),
    admin ? supabase.from("messages").select("*").eq("audience","admins").is("thread_id", null).eq("claimed_by", session.user.id).order("created_at",{ascending:false}) : Promise.resolve({ data: null })
  ]);
  if(announceErr) console.error("Failed to load announcements:", announceErr);
  const dismissedIds = new Set((dismissals||[]).map(d=>d.message_id));
  NOTIF_ANNOUNCEMENTS = (announcements||[]).filter(a=> !dismissedIds.has(a.id));

  let claimedRoots = [];
  if(admin){
    NOTIF_UNCLAIMED = (ucRes.data||[]).filter(m=> !m.department || canAccessDepartment(m.department));
    claimedRoots = (mcRes.data||[]).filter(m=> !m.department || canAccessDepartment(m.department));
  } else {
    NOTIF_UNCLAIMED = [];
  }

  const rootMap = {};
  (myRoots||[]).forEach(r=> rootMap[r.id]=r);
  claimedRoots.forEach(r=> rootMap[r.id]=r);
  (directSent||[]).forEach(r=> rootMap[r.id]=r);
  (directReceived||[]).forEach(r=> rootMap[r.id]=r);
  const allRoots = Object.values(rootMap);
  const rootIds = allRoots.map(r=>r.id);

  let followUps = [];
  if(rootIds.length){
    const { data: fu } = await supabase.from("messages").select("*").eq("audience","user").in("thread_id", rootIds).order("created_at",{ascending:true});
    followUps = fu || [];
  }
  NOTIF_THREADS = allRoots.map(root=>{
    const messages = followUps.filter(f=>f.thread_id===root.id);
    const lastActivity = messages.length ? messages[messages.length-1].created_at : root.created_at;
    return { root, messages, lastActivity };
  }).sort((a,b)=> new Date(b.lastActivity) - new Date(a.lastActivity));

  const quizLinkedThreads = NOTIF_THREADS.filter(t=> t.root.related_quiz_id && t.root.related_quiz_user_id);
  if(quizLinkedThreads.length){
    const quizIds = [...new Set(quizLinkedThreads.map(t=>t.root.related_quiz_id))];
    const { data: linkedAttempts } = await supabase.from("standalone_quiz_attempts").select("*").in("quiz_id", quizIds);
    const { data: linkedQuizzes } = await supabase.from("standalone_quizzes").select("id,title").in("id", quizIds);
    quizLinkedThreads.forEach(t=>{
      t.relatedAttempt = (linkedAttempts||[]).find(a=> a.quiz_id===t.root.related_quiz_id && a.user_id===t.root.related_quiz_user_id) || null;
      t.relatedQuizTitle = (linkedQuizzes||[]).find(q=>q.id===t.root.related_quiz_id)?.title || "quiz";
    });
  }
}

function notifBadgeCount(){
  return isAdmin() ? NOTIF_UNCLAIMED.length : 0;
}
function chatBadgeCount(){
  let unread = 0;
  NOTIF_THREADS.forEach(t=> t.messages.forEach(m=>{ if(m.recipient_id===session.user.id && !m.is_read) unread++; }));
  return unread;
}

async function loadMessagingData(){
  await loadAllNotifications();
}

async function markMyThreadMessagesRead(){
  const unreadIds = [];
  NOTIF_THREADS.forEach(t=> t.messages.forEach(m=>{ if(m.recipient_id===session.user.id && !m.is_read) unreadIds.push(m.id); }));
  if(unreadIds.length){ await supabase.from("messages").update({ is_read:true }).in("id", unreadIds); await loadMessagingData(); }
}

function applyDefaultThreadVisibility(){
  if(NOTIF_THREADS.length > 1){
    NOTIF_THREADS.forEach(t=> collapsedThreadIds.add(t.root.id));
  } else if(NOTIF_THREADS.length === 1){
    collapsedThreadIds.delete(NOTIF_THREADS[0].root.id);
  }
}

async function openNotifications(){
  await loadMessagingData();
  view = "notifications"; render();
}

async function openChat(focusThreadId){
  await loadMessagingData();
  await markMyThreadMessagesRead();
  applyDefaultThreadVisibility();
  if(focusThreadId) collapsedThreadIds.delete(focusThreadId);
  view = "chat"; render();
}

async function refreshMessagingView(){
  await loadMessagingData();
  if(view==="chat") await markMyThreadMessagesRead();
  if(view==="notifications" || view==="chat") render();
}

const typeLabel = { flag:"🚩 Flag", highlight:"✨ Highlight", comment:"💬 Comment" };

function otherPartyName(t){
  if(t.root.sender_id !== session.user.id) return t.root.sender_name;
  const theirMsg = t.messages.find(m=> m.sender_id !== session.user.id);
  return theirMsg ? theirMsg.sender_name : "no one yet";
}

function threadCardHtml(t){
  const statusPill = !t.root.claimed_by ? `<span class="status-pill progress">Awaiting reply</span>` : `<span class="status-pill done">In conversation</span>`;
  const collapsed = collapsedThreadIds.has(t.root.id);

  if(collapsed){
    return `
      <div class="sub-card thread-card thread-collapsed" data-thread-toggle="${t.root.id}">
        <div class="sub-card-head" style="cursor:pointer;">
          <span class="tag">${typeLabel[t.root.type]||t.root.type}${t.root.context?(' · '+escapeHtml(t.root.context)):''} · with ${escapeHtml(otherPartyName(t))}</span>
          <span style="display:flex;gap:8px;align-items:center;">${statusPill}<button class="mini-btn" data-thread-toggle="${t.root.id}">Show</button></span>
        </div>
      </div>`;
  }

  const bubbles = [t.root, ...t.messages].map(m=>{
    const mine = m.sender_id === session.user.id;
    return `<div class="chat-bubble ${mine?'mine':'theirs'}">
      <div class="chat-bubble-meta">${escapeHtml(m.sender_name)} · ${new Date(m.created_at).toLocaleString()}</div>
      <div class="chat-bubble-body">${m.body}</div>
    </div>`;
  }).join("");

  const needsGrading = t.relatedAttempt && !t.relatedAttempt.graded;
  const gradingHtml = needsGrading ? `
    <div class="sub-card" style="background:#0a0f1c;margin-top:10px;">
      <div class="sub-card-head"><span class="tag">GRADE THIS SUBMISSION · ${escapeHtml(t.relatedQuizTitle||'')}</span></div>
      ${t.relatedAttempt.answers.map((ans,idx)=> ans.type==="long_answer" ? `<div style="margin-bottom:14px;">
          <div style="font-size:13px;color:var(--text);margin-bottom:4px;"><strong>${escapeHtml(ans.question)}</strong></div>
          <div style="font-size:13px;color:var(--text-dim);white-space:pre-wrap;margin-bottom:8px;">${escapeHtml(ans.answer||'(no answer)')}</div>
          <div style="display:flex;gap:8px;">
            <button class="mini-btn chat-grade-choice" data-chat-grade-root="${t.root.id}" data-chat-grade-idx="${idx}" data-chat-grade-val="true">✓ Correct</button>
            <button class="mini-btn chat-grade-choice" data-chat-grade-root="${t.root.id}" data-chat-grade-idx="${idx}" data-chat-grade-val="false">✕ Incorrect</button>
          </div>
        </div>` : '').join("")}
    </div>` : "";

  const bottomHtml = needsGrading ? `
      <div class="field" style="margin-top:10px;"><label style="font-size:11px;color:var(--text-faint);">Optional feedback to include with your response</label>${richEditorHtml(`thread-rte-${t.root.id}`, "")}</div>
      <button class="btn primary" data-send-grading-response="${t.root.id}" style="margin-top:8px;">Send response</button>
    ` : `
      <div class="field" style="margin-top:10px;">${richEditorHtml(`thread-rte-${t.root.id}`, "")}</div>
      <button class="mini-btn" data-send-thread="${t.root.id}" style="margin-top:8px;">Send</button>
    `;

  return `
    <div class="sub-card thread-card">
      <div class="sub-card-head">
        <span class="tag">${typeLabel[t.root.type]||t.root.type}${t.root.context?(' · '+escapeHtml(t.root.context)):''} · with ${escapeHtml(otherPartyName(t))}</span>
        <span style="display:flex;gap:8px;align-items:center;">${statusPill}<button class="mini-btn" data-thread-toggle="${t.root.id}">Hide</button><button class="mini-btn danger" data-discard-thread="${t.root.id}">Discard</button></span>
      </div>
      <div class="chat-scroll">${bubbles}</div>
      ${gradingHtml}
      ${bottomHtml}
    </div>`;
}

      <p style="color:var(--text-dim);font-size:13px;margin:0 0 16px;">First admin to reply owns it. Sending a reply moves it into your Conversations and disappears from other admins' view.</p>
      ${unclaimedHtml || `<p style="color:var(--text-faint);font-size:13px;">Nothing waiting on a reply.</p>`}
    </div>` : ""}
  `);

  NOTIF_UNCLAIMED.forEach(m=> wireRichEditor(`thread-rte-${m.id}`));

  const dismissAllBtn = document.getElementById("dismiss-all-announce");
  if(dismissAllBtn) dismissAllBtn.addEventListener("click", async ()=>{
    await supabase.from("announcement_dismissals").upsert(NOTIF_ANNOUNCEMENTS.map(a=>({ user_id: session.user.id, message_id: a.id })));

  });
  root.querySelectorAll("[data-dismiss-announce]").forEach(el=> el.addEventListener("click", async ()=>{

    await refreshMessagingView();

  root.querySelectorAll("[data-discard-thread]").forEach(el=> el.addEventListener("click", async ()=>{

      await supabase.from("messages").delete().eq("thread_id", id);
      await supabase.from("messages").delete().eq("id", id);
      collapsedThreadIds.delete(id);
      await refreshMessagingView();
    }
  }));
  root.querySelectorAll("[data-send-thread]").forEach(el=> el.addEventListener("click", async ()=>{

  }));
  root.querySelectorAll("[data-admreq-accept]").forEach(el=> el.addEventListener("click", async ()=>{

    if(roleErr){ alert("Couldn't update their role: " + roleErr.message); return; }
    await supabase.from("messages").insert({ sender_id: session.user.id, sender_name: profile.name, recipient_id: userId, audience:"user", type:"reply", claimed_by: session.user.id, body:`<p>Your admin request was approved by ${escapeHtml(profile.name)}. Log out and back in (or refresh) to see your new access.</p>` });
    await supabase.from("messages").delete().eq("id", msgId);
    await refreshMessagingView();
  }));
  root.querySelectorAll("[data-admreq-deny]").forEach(el=> el.addEventListener("click", async ()=>{

function renderChat(){
  const threadsHtml = NOTIF_THREADS.map(threadCardHtml).join("") || `<p style="color:var(--text-faint);font-size:13px;">No conversations yet.</p>`;

  renderShell(`
    <div class="card">
      <div class="k-label">CHAT</div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
        <h2 style="margin:0;">Conversations</h2>
        <button class="btn primary" id="new-convo-btn">+ New Conversation</button>
      </div>
      ${threadsHtml}
    </div>
  `);

  const newConvoBtn = document.getElementById("new-convo-btn");
  if(newConvoBtn) newConvoBtn.addEventListener("click", openNewConversationModal);

  NOTIF_THREADS.forEach(t=> wireRichEditor(`thread-rte-${t.root.id}`));
  root.querySelectorAll("[data-thread-toggle]").forEach(el=> el.addEventListener("click", (e)=>{
    e.stopPropagation();
    const id = el.getAttribute("data-thread-toggle");
    if(collapsedThreadIds.has(id)) collapsedThreadIds.delete(id); else collapsedThreadIds.add(id);
    render();
  }));
  root.querySelectorAll("[data-discard-thread]").forEach(el=> el.addEventListener("click", async ()=>{
    const id = el.getAttribute("data-discard-thread");
    if(confirm("Discard this conversation? This can't be undone.")){
      await supabase.from("messages").delete().eq("thread_id", id);
      await supabase.from("messages").delete().eq("id", id);
      collapsedThreadIds.delete(id);
      await refreshMessagingView();
    }
  }));
  root.querySelectorAll("[data-send-thread]").forEach(el=> el.addEventListener("click", async ()=>{
    await sendThreadMessage(el.getAttribute("data-send-thread"));
  }));
  root.querySelectorAll(".chat-grade-choice").forEach(btn=> btn.addEventListener("click", ()=>{
    const rootId = btn.getAttribute("data-chat-grade-root");
    const idx = btn.getAttribute("data-chat-grade-idx");
    const val = btn.getAttribute("data-chat-grade-val") === "true";
    if(!chatPendingGrades[rootId]) chatPendingGrades[rootId] = {};
    chatPendingGrades[rootId][idx] = val;
    root.querySelectorAll(`.chat-grade-choice[data-chat-grade-root="${rootId}"][data-chat-grade-idx="${idx}"]`).forEach(b=>{
      const isThis = b === btn;
      b.style.color = isThis ? (val ? "var(--green)" : "var(--red)") : "var(--text-dim)";
      b.style.fontWeight = isThis ? "700" : "400";
    });
  }));
  root.querySelectorAll("[data-send-grading-response]").forEach(btn=> btn.addEventListener("click", async ()=>{
    const rootId = btn.getAttribute("data-send-grading-response");
    const t = NOTIF_THREADS.find(x=>x.root.id===rootId);
    if(!t || !t.relatedAttempt) return;
    const grades = chatPendingGrades[rootId] || {};
    const longAnswerIdxs = t.relatedAttempt.answers.map((a,i)=> a.type==="long_answer" ? i : null).filter(i=>i!=null);
    const allGraded = longAnswerIdxs.every(i=> grades[i] != null);
    if(!allGraded){ alert("Mark every long-answer question Correct or Incorrect before sending a response."); return; }

    btn.disabled = true; btn.textContent = "Sending…";
    const updatedAnswers = t.relatedAttempt.answers.map((a,i)=> a.type==="long_answer" ? { ...a, is_correct: grades[i] } : a);

    const { data: updatedRows, error: gradeErr } = await supabase.from("standalone_quiz_attempts").update({ answers: updatedAnswers, graded: true }).eq("quiz_id", t.root.related_quiz_id).eq("user_id", t.root.related_quiz_user_id).select();
    if(gradeErr){ alert("Couldn't save grading: " + gradeErr.message); btn.disabled = false; btn.textContent = "Send response"; return; }
    if(!updatedRows || !updatedRows.length){ alert("Grading didn't save — the database silently rejected this update (likely a permissions rule). Nothing was sent. Please tell your admin/developer this happened."); btn.disabled = false; btn.textContent = "Send response"; return; }

    const editorEl = document.getElementById(`thread-rte-${rootId}`);
    const customFeedback = editorEl ? getCleanEditorHtml(editorEl).trim() : "";
    const correctCount = longAnswerIdxs.filter(i=>grades[i]===true).length;
    const summaryHtml = `<p>Your long-answer responses for "<strong>${escapeHtml(t.relatedQuizTitle||'the quiz')}</strong>" have been graded: ${correctCount}/${longAnswerIdxs.length} (${longAnswerIdxs.length?Math.round((correctCount/longAnswerIdxs.length)*100):0}%) correct.</p>${(customFeedback && customFeedback!=="<br>") ? customFeedback : ""}`;

    const { error: msgErr } = await supabase.from("messages").insert({
      sender_id: session.user.id, sender_name: profile.name,
      recipient_id: t.root.related_quiz_user_id, audience:"user", type:"reply",
      claimed_by: session.user.id, body: summaryHtml
    });
    if(msgErr){ alert("Grading was saved, but the response couldn't be sent: " + msgErr.message); }

    // Clear this submission out of the admin's conversations — its job is done.
    await supabase.from("messages").delete().eq("thread_id", rootId);
    await supabase.from("messages").delete().eq("id", rootId);

    delete chatPendingGrades[rootId];
    logEdit("graded", "standalone_quiz_attempt", `${t.relatedQuizTitle} — ${t.root.sender_name}`);
    QUIZ_PROGRESS_ROWS = null; // Quiz Progress will reflect the new grade on next load
    showToast("Response sent.");
    await refreshMessagingView();
  }));
}

async function sendThreadMessage(rootId){
  const editorEl = document.getElementById(`thread-rte-${rootId}`);
  const body = getCleanEditorHtml(editorEl).trim();
  if(!body || body === "<br>") return;
  const root = NOTIF_UNCLAIMED.find(m=>m.id===rootId) || (NOTIF_THREADS.find(t=>t.root.id===rootId)||{}).root;
  if(!root) return;

  const wasUnclaimedPoolItem = root.audience === "admins" && !root.claimed_by;

  let recipientId;
  if(root.audience === "user"){
    // Direct thread (e.g. admin-initiated coaching conversation) — just message the other participant.
    recipientId = (root.sender_id === session.user.id) ? root.recipient_id : root.sender_id;
  } else {
    // Pool-originated flag/comment thread.
    const iAmOriginalSender = root.sender_id === session.user.id;
    if(iAmOriginalSender){
      recipientId = root.claimed_by;
      if(!recipientId){ alert("No admin has picked this up yet — nothing to send to."); return; }
    } else {
      recipientId = root.sender_id;
      if(!root.claimed_by){
        await supabase.from("messages").update({ claimed_by: session.user.id }).eq("id", root.id).is("claimed_by", null);
      }
    }
  }
  await supabase.from("messages").insert({ sender_id: session.user.id, sender_name: profile.name, recipient_id: recipientId, audience:"user", type:"reply", body, context: root.context, thread_id: root.id });

  if(wasUnclaimedPoolItem){
    await openChat(root.id); // follow through on the conversation you just started
  } else {
    await refreshMessagingView();
  }
}

function launchConfetti(){
  const colors = ['#f5a623','#2ecc71','#00d4ff','#e74c3c','#a78bfa'];
  const container = document.createElement('div');
  container.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:850;overflow:hidden;';
  document.body.appendChild(container);
  for(let i=0;i<80;i++){
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    const size = 6 + Math.random()*6;
    piece.style.left = (Math.random()*100) + 'vw';
    piece.style.background = colors[Math.floor(Math.random()*colors.length)];
    piece.style.width = size + 'px';
    piece.style.height = (size*1.6) + 'px';
    piece.style.borderRadius = Math.random()>0.5 ? '50%' : '2px';
    piece.style.animationDuration = (2.2 + Math.random()*1.6) + 's';
    piece.style.animationDelay = (Math.random()*0.4) + 's';

  setTimeout(()=> container.remove(), 4200);

function showToast(text, onClickFn){
  const el = document.createElement("div");
  el.className = "app-toast";
  el.textContent = text;
  el.addEventListener("click", ()=>{ el.remove(); (onClickFn || openNotifications)(); });
  document.body.appendChild(el);
  setTimeout(()=>{ el.classList.add("out"); setTimeout(()=>el.remove(), 300); }, 6000);
}

function setupRealtime(){
  teardownRealtime();
  const chMyProfile = supabase.channel("rt-my-profile-"+session.user.id)
    .on("postgres_changes", { event:"UPDATE", schema:"public", table:"profiles", filter:`id=eq.${session.user.id}` }, async ()=>{
      const oldP = profile;
      await loadProfile(); // re-fetch from source of truth rather than trusting the realtime payload directly —
                            // safer against payload-shape surprises and against two rapid updates racing each other
      const changed = !oldP || oldP.can_access_ts !== profile.can_access_ts || oldP.can_access_cs !== profile.can_access_cs
        || oldP.role !== profile.role || oldP.perm_edit_content !== profile.perm_edit_content
        || oldP.perm_create_quizzes !== profile.perm_create_quizzes || oldP.perm_manage_people !== profile.perm_manage_people;
      if(changed){
        showToast("Your access was updated.");
        activeDepartment = null; refActiveDepartment = null; // let it re-pick a sensible default under the new access
        await loadEverything();
        render();
      }
    }).subscribe();
  realtimeChannels.push(chMyProfile);

  const chAnnounce = supabase.channel("rt-announcements-"+session.user.id)
    .on("postgres_changes", { event:"INSERT", schema:"public", table:"messages", filter:"audience=eq.all" }, (payload)=>{
      if(payload.new.sender_id === session.user.id) return;
      showToast("📣 " + stripHtml(payload.new.body).slice(0,90), openNotifications);
      if(view==="notifications" || view==="chat") refreshMessagingView(); else loadAllNotifications().then(render);
    }).subscribe();
  realtimeChannels.push(chAnnounce);

  const chToMe = supabase.channel("rt-to-me-"+session.user.id)
    .on("postgres_changes", { event:"INSERT", schema:"public", table:"messages", filter:`recipient_id=eq.${session.user.id}` }, (payload)=>{
      showToast("💬 " + escapeHtml(payload.new.sender_name) + ": " + stripHtml(payload.new.body).slice(0,70), ()=>openChat());
      if(view==="notifications" || view==="chat") refreshMessagingView(); else loadAllNotifications().then(render);
    }).subscribe();
  realtimeChannels.push(chToMe);

  if(isAdmin()){
    const chAdmin = supabase.channel("rt-admin-inbox-"+session.user.id)
      .on("postgres_changes", { event:"INSERT", schema:"public", table:"messages", filter:"audience=eq.admins" }, (payload)=>{
        if(payload.new.thread_id || payload.new.sender_id === session.user.id) return;
        showToast("🚩 New item waiting in the admin inbox", openNotifications);
        if(view==="notifications" || view==="chat") refreshMessagingView(); else loadAllNotifications().then(render);
      }).subscribe();
    realtimeChannels.push(chAdmin);
  }

  // Discarding a conversation deletes rows — without listening for DELETE too,
  // the other participant would never see it disappear until they refresh.
  const chDeletes = supabase.channel("rt-deletes-"+session.user.id)
    .on("postgres_changes", { event:"DELETE", schema:"public", table:"messages" }, ()=>{
      if(view==="notifications" || view==="chat") refreshMessagingView(); else loadAllNotifications().then(render);
    }).subscribe();
  realtimeChannels.push(chDeletes);
}
function teardownRealtime(){ realtimeChannels.forEach(ch=> supabase.removeChannel(ch)); realtimeChannels = []; }

function openSimZoneTargetModal(d, qi, si, zi, onSaved){
  const q = d.quiz[qi];
  const screens = q.simScreens;
  const zone = screens[si].zones[zi];
  const options = screens.map((s,idx)=> idx===si ? "" : `<option value="${s.id}" ${zone.targetScreenId===s.id?'selected':''}>Screen ${idx+1}</option>`).join("");
  const isScreenGoal = q.endGoal === 'screen';
  openModal(`
    <h3>Where does this button lead?</h3>
    <p class="sub">${isScreenGoal ? "Pick which screen this button leads to." : 'Pick the next screen, or "Finish" if this is the button that completes the simulation.'}</p>
    <div class="field"><select id="sim-zone-target-select">
      ${isScreenGoal ? `<option value="" ${!zone.targetScreenId?'selected':''} disabled>— choose a screen —</option>` : `<option value="" ${!zone.targetScreenId?'selected':''}>Finish (completes the simulation)</option>`}
      ${options}
    </select></div>
    <div class="field"><label>Which click activates this button?</label>
      <select id="sim-zone-clicktype-select">
        <option value="left" ${(zone.clickType||'left')==='left'?'selected':''}>Left click</option>
        <option value="right" ${zone.clickType==='right'?'selected':''}>Right click</option>
      </select>
      <p class="hint">Using the other button on this area counts as a misclick — useful for teaching right-click menus specifically.</p>
    </div>
    <div class="modal-actions"><button class="btn" id="sim-zone-cancel">Cancel</button><button class="btn primary" id="sim-zone-save">Save</button></div>
  `);
  document.getElementById("sim-zone-cancel").addEventListener("click", closeModal);
  document.getElementById("sim-zone-save").addEventListener("click", ()=>{
    const val = document.getElementById("sim-zone-target-select").value;
    if(isScreenGoal && !val){ alert("Pick which screen this button leads to."); return; }
    zone.targetScreenId = val || null;
    zone.clickType = document.getElementById("sim-zone-clicktype-select").value;
    closeModal();
    onSaved();
  });
}

function renderSimZonesHtml(screens, si, qi){
  const screen = screens[si];
  return (screen.zones||[]).map((z,zi)=>{
    const targetScreenIdx = z.targetScreenId ? screens.findIndex(s=>s.id===z.targetScreenId) : -1;
    const targetLabel = (targetScreenIdx>=0 ? `→ Screen ${targetScreenIdx+1}` : "→ Finish") + (z.clickType==='right' ? ' · Right-click' : '');
    return `<div class="sim-zone" data-sim-zone="${qi}:${si}:${zi}" style="position:absolute;left:${z.x}%;top:${z.y}%;width:${z.w}%;height:${z.h}%;border:2px dashed var(--cyan);cursor:pointer;">

function openSimPlayFullscreen(q, quizIdx, handleZoneClick){
  if(quizSimMisclicks[quizIdx] === undefined) quizSimMisclicks[quizIdx] = 0;
  const overlay = document.createElement("div");
  overlay.id = "sim-play-fullscreen-overlay";
  overlay.style.cssText = "position:fixed;inset:0;z-index:700;background:#000000f5;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;";
  document.body.appendChild(overlay);
  window.activeFullscreenCleanups.push(()=> overlay.remove());

  function showMisclickX(clientX, clientY){
    const x = document.createElement("div");
    x.textContent = "✕";
    x.style.cssText = `position:fixed;left:${clientX-11}px;top:${clientY-14}px;color:var(--red);font-size:22px;font-weight:900;z-index:800;pointer-events:none;text-shadow:0 0 8px #000;transition:opacity .35s;`;
    document.body.appendChild(x);
    setTimeout(()=>{ x.style.opacity = "0"; }, 250);
    setTimeout(()=>{ x.remove(); }, 650);
  }

  function tooManyMisclicks(){
    overlay.remove();
    openModal(`
      <h3>Too many missed clicks</h3>
      <p class="sub">You've missed too many clicks, please reread the lesson and try again.</p>
      <div class="modal-actions"><button class="btn primary" id="sim-misclick-ok">OK</button></div>
    `);
    document.getElementById("sim-misclick-ok").addEventListener("click", ()=>{
      closeModal();
      currentLessonIdx = 0; view = "lesson"; render();
    });
  }

  function draw(){
    const screens = q.simScreens;
    const screen = screens[quizSimScreenIndex[quizIdx]];
    const isFinalScreen = q.endGoal === 'screen' && q.finalScreenId === screen.id;

    if(isFinalScreen){
      overlay.innerHTML = `
        <div style="width:100%;max-width:1300px;margin-bottom:14px;">
          <h2 style="color:var(--text);font-size:20px;font-weight:700;margin:0 0 12px;">${escapeHtml(q.q)}</h2>
          <div style="display:flex;justify-content:flex-end;"><button class="btn" id="sim-play-fullscreen-close">✕ Exit fullscreen</button></div>
        </div>
        <div style="position:relative;display:inline-block;max-width:min(94vw,1300px);max-height:76vh;border-radius:12px;box-shadow:0 0 0 3px var(--green), 0 0 34px 6px #2ecc7166;">
          <img src="${screen.image}" style="max-width:min(94vw,1300px);max-height:76vh;display:block;user-select:none;border-radius:8px;" draggable="false">
        </div>
        <p style="color:var(--green);font-size:13px;margin-top:14px;">✓ You've reached the end — this is the final screen.</p>
        <button class="btn primary" id="sim-play-done" style="margin-top:8px;">Done</button>`;
      document.getElementById("sim-play-fullscreen-close").addEventListener("click", ()=>{ overlay.remove(); render(); });
      document.getElementById("sim-play-done").addEventListener("click", ()=>{
        quizAnswers[quizIdx] = "done";
        overlay.remove(); render();
      });
      return;
    }

    const zonesHtml = (screen.zones||[]).map((z,zi)=>`<div class="sim-play-zone" data-sim-play-zone-fs="${zi}" style="position:absolute;left:${z.x}%;top:${z.y}%;width:${z.w}%;height:${z.h}%;cursor:pointer;"></div>`).join("");
    overlay.innerHTML = `
      <div style="width:100%;max-width:1300px;margin-bottom:14px;">
        <h2 style="color:var(--text);font-size:20px;font-weight:700;margin:0 0 12px;">${escapeHtml(q.q)}</h2>
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <span style="color:var(--text-faint);font-family:var(--mono);font-size:12px;">MISCLICKS: ${quizSimMisclicks[quizIdx]}/3</span>
          <button class="btn" id="sim-play-fullscreen-close">✕ Exit fullscreen</button>
        </div>
      </div>
      <div style="position:relative;display:inline-block;max-width:min(94vw,1300px);max-height:82vh;" id="sim-play-container">
        <img src="${screen.image}" style="max-width:min(94vw,1300px);max-height:82vh;display:block;user-select:none;border-radius:8px;" draggable="false">
        ${zonesHtml}
      </div>`;
    document.getElementById("sim-play-fullscreen-close").addEventListener("click", ()=>{ overlay.remove(); render(); });
    const container = document.getElementById("sim-play-container");
    const registerMisclick = (e)=>{
      showMisclickX(e.clientX, e.clientY);
      quizSimMisclicks[quizIdx]++;
      if(quizSimMisclicks[quizIdx] >= 3){ tooManyMisclicks(); }
    };
    // Right-click is repurposed here (some zones expect it), so the native
    // context menu is always suppressed inside the simulation, not just on
    // right-click zones specifically.
    container.addEventListener("contextmenu", (e)=>{ e.preventDefault(); });
    container.addEventListener("click", (e)=>{
      if(e.target.closest(".sim-play-zone")) return; // handled by the zone's own listener below
      registerMisclick(e);
    });
    container.addEventListener("contextmenu", (e)=>{
      if(e.target.closest(".sim-play-zone")) return; // handled by the zone's own listener below
      registerMisclick(e);
    });
    overlay.querySelectorAll("[data-sim-play-zone-fs]").forEach(el=>{
      const zi = +el.getAttribute("data-sim-play-zone-fs");
      const wantsRight = (screen.zones[zi].clickType||"left") === "right";
      const activate = (e)=>{
        e.preventDefault(); e.stopPropagation();
        if(!handleZoneClick(zi)) return;
        scheduleQuizProgressSave();
        if(quizAnswers[quizIdx] === "done"){ overlay.remove(); render(); } else { draw(); }
      };
      const wrongButton = (e)=>{
        e.preventDefault(); e.stopPropagation();
        registerMisclick(e);
      };
      el.addEventListener("click", wantsRight ? wrongButton : activate);
      el.addEventListener("contextmenu", wantsRight ? activate : wrongButton);
    });
  }
  // Screenshots are now storage URLs (not base64 embedded directly in the
  // question data), so the very first time each one displays, the browser
  // has to actually fetch it over the network — that's the delay after
  // clicking a zone. Preloading every screen's image up front, before
  // showing the first one, means by the time someone starts clicking
  // through, they're all already sitting in the browser's own image cache
  // — no explicit "unload" step needed afterward either, since letting the
  // preloaded Image objects go out of scope here is enough for the browser
  // to garbage-collect them normally once this fullscreen view closes.
  overlay.innerHTML = `<div style="color:var(--text-dim);font-family:var(--mono);font-size:13.5px;">Loading simulated navigation…</div>`;
  const preloadUrls = q.simScreens.map(s=> s.image).filter(Boolean);
  Promise.all(preloadUrls.map(url=> new Promise(resolve=>{
    const img = new Image();
    img.onload = resolve;
    img.onerror = resolve; // don't let one broken/missing image block the whole simulation from ever loading
    img.src = url;
  }))).then(()=>{ if(overlay.isConnected) draw(); });
}

/* ============================================================
   DRAG AUTO-SCROLL — activated during any drag-to-reorder gesture
   so dragging near the top/bottom edge scrolls the page.
   ============================================================ */
let _dragScrollSpeed = 0;
let _dragScrollRAF = null;
function _dragScrollHandler(e){
  const threshold = 110;
  const y = e.clientY;
  const h = window.innerHeight;
  if(y < threshold) _dragScrollSpeed = -((threshold - y) * 0.5 + 3);
  else if(y > h - threshold) _dragScrollSpeed = ((y - (h - threshold)) * 0.5 + 3);
  else _dragScrollSpeed = 0;
}
function _dragScrollStep(){
  if(_dragScrollSpeed !== 0) window.scrollBy(0, _dragScrollSpeed);
  _dragScrollRAF = requestAnimationFrame(_dragScrollStep);
}
function startDragAutoScroll(){
  _dragScrollSpeed = 0;
  document.addEventListener("dragover", _dragScrollHandler);
  if(!_dragScrollRAF) _dragScrollRAF = requestAnimationFrame(_dragScrollStep);
}
function stopDragAutoScroll(){
  document.removeEventListener("dragover", _dragScrollHandler);
  if(_dragScrollRAF){ cancelAnimationFrame(_dragScrollRAF); _dragScrollRAF = null; }
  _dragScrollSpeed = 0;
}

function slugify(s){ const base=(s||"").toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,''); let id=base||("module-"+Date.now()); let i=2;
  while(MODULES.some(m=>m.id===id && m.id!==editingExistingId)){ id=base+"-"+i; i++; } return id; }

function openModal(innerHtml, wide, blocking){
  closeModal();

  wrap.className = "overlay"; wrap.id = "app-modal-overlay";
  wrap.innerHTML = `<div class="modal ${wide?'wide':''}">${innerHtml}</div>`;

  return wrap;
}

function promptModal(title, placeholder, defaultValue){
  return new Promise((resolve)=>{
    openModal(`
      <h3>${escapeHtml(title)}</h3>
      <div class="field"><input type="text" id="prompt-modal-input" placeholder="${escapeHtml(placeholder||'')}" value="${escapeHtml(defaultValue||'')}"></div>
      <div class="modal-actions"><button class="btn" id="prompt-modal-cancel">Cancel</button><button class="btn primary" id="prompt-modal-ok">OK</button></div>
    `);
    const input = document.getElementById("prompt-modal-input");
    input.focus();
    let settled = false;
    const finish = (val)=>{ if(settled) return; settled = true; closeModal(); resolve(val); };
    document.getElementById("prompt-modal-cancel").addEventListener("click", ()=> finish(null));
    document.getElementById("prompt-modal-ok").addEventListener("click", ()=> finish(input.value.trim() || null));
    document.getElementById("app-modal-overlay").addEventListener("mousedown", (e)=>{
      if(e.target.id === "app-modal-overlay") finish(null);
    });
  });
}

function promptTableSizeModal(){
  return new Promise((resolve)=>{
    openModal(`
      <h3>Insert table</h3>
      <div class="field"><label>Rows</label><input type="number" id="table-rows-input" value="3" min="1" max="30"></div>
      <div class="field"><label>Columns</label><input type="number" id="table-cols-input" value="3" min="1" max="12"></div>
      <div class="modal-actions"><button class="btn" id="table-size-cancel">Cancel</button><button class="btn primary" id="table-size-ok">Insert</button></div>
    `);
    let settled = false;
    const finish = (val)=>{ if(settled) return; settled = true; closeModal(); resolve(val); };
    document.getElementById("table-size-cancel").addEventListener("click", ()=> finish(null));
    document.getElementById("table-size-ok").addEventListener("click", ()=>{
      const rows = Math.max(1, Math.min(30, parseInt(document.getElementById("table-rows-input").value) || 3));
      const cols = Math.max(1, Math.min(12, parseInt(document.getElementById("table-cols-input").value) || 3));
      finish({ rows, cols });
    });
    document.getElementById("app-modal-overlay").addEventListener("mousedown", (e)=>{
      if(e.target.id === "app-modal-overlay") finish(null);
    });
  });
}
function buildTableHtml(rows, cols){
  // <br> in each empty cell — some browsers won't let the cursor land in a
  // genuinely empty <td>, which makes an otherwise-fine table feel broken
  // to click into. The trailing empty paragraph guarantees there's always
  // somewhere to keep typing below the table, rather than the cursor
  // getting stuck with no way out if the table lands at the very end.
  const rowHtml = ()=> `<tr>${Array.from({length:cols}).map(()=>'<td><br></td>').join('')}</tr>`;
  return `<table class="rte-table">${Array.from({length:rows}).map(rowHtml).join('')}</table><p><br></p>`;
}

/* ============================================================

   embedded BUILD_VERSION has changed, someone shipped a new

function showUpdateBanner(){
  if(document.getElementById("update-banner")) return; // already showing
  const bar = document.createElement("div");
  bar.id = "update-banner";
  bar.className = "update-banner";
  bar.innerHTML = `<span>🔄 An update has been made. Refresh your tab to see the newest changes.</span><button id="update-banner-refresh">Refresh now</button>`;
  document.body.prepend(bar);

async function checkForNewVersion(){
  try{
    const res = await fetch(window.location.pathname + "?_v=" + Date.now(), { cache: "no-store" });
    if(!res.ok) return;
    const html = await res.text();
    const match = html.match(/const BUILD_VERSION = "([^"]+)"/);
    if(match && match[1] && match[1] !== BUILD_VERSION) showUpdateBanner();
  }catch(e){ /* network hiccup — just try again next interval */ }
}
setInterval(checkForNewVersion, 45 * 1000); // every 45 seconds

    const { error: delErr } = await supabase.from("feedback").delete().eq("id", id);
    if(delErr){ alert("Couldn't delete: " + delErr.message); return; }
    const row = document.querySelector(`[data-feedback-row="${id}"]`);
    if(row) row.remove();
    const list = document.getElementById("feedback-list");
    if(list && !list.children.length) list.innerHTML = '<p style="color:var(--text-faint);font-size:13px;">No feedback yet.</p>';
  }));
}

function clearFormatting(editorEl){
  editorEl.focus();
  // Handles native bold/italic/underline/execCommand-applied styles.
  document.execCommand("removeFormat", false, null);
  document.execCommand("unlink", false, null);
  // Pasted content (Word, Google Docs, other browser tabs, etc.) often carries
  // inline style/color attributes that removeFormat doesn't touch — strip those directly.
  editorEl.querySelectorAll("*").forEach(el=>{
    el.removeAttribute("style");
    el.removeAttribute("color");
    el.removeAttribute("bgcolor");
    el.removeAttribute("face");
  });
  editorEl.querySelectorAll("font").forEach(f=>{
    while(f.firstChild) f.parentNode.insertBefore(f.firstChild, f);
    f.parentNode.removeChild(f);
  });
  // removeFormat only touches inline formatting — flatten headings/quotes back
  // to plain paragraphs too, same as "clear formatting" in a normal editor.
  editorEl.querySelectorAll("h1,h2,h3,h4,blockquote").forEach(el=>{
    const p = document.createElement("p");
    while(el.firstChild) p.appendChild(el.firstChild);
    el.parentNode.replaceChild(p, el);
  });
}

function wireRichEditor(id){
  const toolbar = document.querySelector(`.rte-toolbar[data-rte="${id}"]`);
  const editorEl = document.getElementById(id);
  if(!toolbar || !editorEl) return;

  let savedRange = null;
  const saveCurrentRange = ()=>{
    const sel = window.getSelection();
    if(sel.rangeCount>0 && editorEl.contains(sel.anchorNode)) savedRange = sel.getRangeAt(0).cloneRange();
  };
  const restoreRange = ()=>{
    if(!savedRange) return;
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(savedRange);
  };
  const TOGGLE_CMDS = ["bold","italic","underline","strikeThrough","insertUnorderedList","insertOrderedList","justifyLeft","justifyCenter","justifyRight"];
  const updateToolbarState = ()=>{
    TOGGLE_CMDS.forEach(cmd=>{
      const btn = toolbar.querySelector(`button[data-cmd="${cmd}"]`);
      if(!btn) return;
      if(["justifyLeft","justifyCenter","justifyRight"].includes(cmd) && selectedImageWrap && editorEl.contains(selectedImageWrap)){
        const align = cmd==="justifyLeft" ? "left" : cmd==="justifyCenter" ? "center" : "right";
        btn.classList.toggle("active", selectedImageWrap.getAttribute("data-align")===align);
        return;
      }
      try{ btn.classList.toggle("active", document.queryCommandState(cmd)); }catch(e){}
    });
    const quoteBtn = toolbar.querySelector('button[data-cmd="blockquote"]');
    if(quoteBtn){ try{ quoteBtn.classList.toggle("active", document.queryCommandValue("formatBlock").toLowerCase()==="blockquote"); }catch(e){} }
  };
  editorEl.addEventListener("click", updateToolbarState);
  editorEl.addEventListener("mouseup", ()=>{ saveCurrentRange(); updateToolbarState(); });
  editorEl.addEventListener("keyup", ()=>{ saveCurrentRange(); updateToolbarState(); });
  editorEl.addEventListener("focus", updateToolbarState);

  toolbar.querySelectorAll("button[data-cmd]").forEach(btn=>{
    btn.addEventListener("mousedown", (e)=>e.preventDefault()); // keep focus/selection in the editor
    btn.addEventListener("click", async ()=>{
      editorEl.focus();
      const cmd = btn.getAttribute("data-cmd");
      if(cmd === "image"){ document.getElementById(`${id}-file`).click(); return; }
      if(cmd === "interactivePic"){
        const ipFileInput = document.getElementById(`${id}-ipic-file`);
        ipFileInput.onchange = async ()=>{
          const file = ipFileInput.files[0]; if(!file) return;
          ipFileInput.value = "";
          const lessonIdxMatch = id.match(/^lesson-rte-(\d+)$/);
          if(!lessonIdxMatch) return;
          const lesson = draftModule.lessons[+lessonIdxMatch[1]];
          if(!lesson || !lesson.id){ alert("Save the lesson first, then add an interactive picture."); return; }
          const dataUrl = await compressImageFile(file);
          if(!dataUrl) return; // compressImageFile already alerted the user about what went wrong
          const ipId = 'ip'+Date.now()+Math.random().toString(36).slice(2,8);
          const { error } = await supabase.from("interactive_pictures").insert({ id:ipId, lesson_id:lesson.id, image:dataUrl, hotspots:[] });
          if(error){ alert("Couldn't create interactive picture: " + error.message); return; }
          INTERACTIVE_PICTURES[ipId] = { id:ipId, lessonId:lesson.id, image:dataUrl, hotspots:[] };
          document.execCommand("insertHTML", false, `<div class="interactive-pic-embed" contenteditable="false" data-interactive-pic-id="${ipId}">&nbsp;</div>&nbsp;`);
          editorEl.dispatchEvent(new Event("input", { bubbles:true }));
          openInteractivePicConfigFullscreen(ipId);
        };
        ipFileInput.click();
        return;
      }
      if(cmd === "hr"){ document.execCommand("insertHTML", false, "<hr>"); return; }
      if(cmd === "table"){
        saveCurrentRange();
        const size = await promptTableSizeModal();
        if(size){
          restoreRange(); editorEl.focus();
          document.execCommand("insertHTML", false, buildTableHtml(size.rows, size.cols));
          attachTableResizeHandles(editorEl);
          editorEl.dispatchEvent(new Event("input", { bubbles:true }));
        }
        return;
      }
      if(cmd === "clearFormat"){ clearFormatting(editorEl); return; }
      if(cmd === "link"){
        saveCurrentRange();
        const url = await promptModal("Insert link", "https://example.com");
        if(url){
          restoreRange(); editorEl.focus(); document.execCommand("createLink", false, url);
          const sel = window.getSelection();
          const anchorEl = sel.anchorNode && (sel.anchorNode.nodeType===1 ? sel.anchorNode : sel.anchorNode.parentElement);
          const link = anchorEl && anchorEl.closest ? anchorEl.closest("a[href]") : null;
          if(link){ link.setAttribute("target","_blank"); link.setAttribute("rel","noopener noreferrer"); }
        }
        updateToolbarState();
        return;
      }
      if(cmd === "unlink"){ document.execCommand("unlink", false, null); return; }
      if(cmd === "blockquote"){
        const isQuote = document.queryCommandValue("formatBlock").toLowerCase() === "blockquote";
        document.execCommand("formatBlock", false, isQuote ? "P" : "BLOCKQUOTE");
        updateToolbarState();
        return;
      }
      if(["justifyLeft","justifyCenter","justifyRight"].includes(cmd) && selectedImageWrap && editorEl.contains(selectedImageWrap)){
        const align = cmd==="justifyLeft" ? "left" : cmd==="justifyCenter" ? "center" : "right";
        selectedImageWrap.setAttribute("data-align", align);
        editorEl.dispatchEvent(new Event("input", { bubbles:true }));
        return;
      }
      document.execCommand(cmd, false, null);
      updateToolbarState();
    });
  });
  const sizeSelect = toolbar.querySelector('select[data-cmd="fontSize"]');
  if(sizeSelect) sizeSelect.addEventListener("change", ()=>{ editorEl.focus(); document.execCommand("fontSize", false, sizeSelect.value); });
  const blockSelect = toolbar.querySelector('select[data-cmd="formatBlock"]');
  if(blockSelect) blockSelect.addEventListener("change", ()=>{ editorEl.focus(); document.execCommand("formatBlock", false, blockSelect.value); blockSelect.value = "P"; });
  toolbar.querySelectorAll('input[type="color"][data-cmd]').forEach(colorInput=>{
    colorInput.addEventListener("mousedown", (e)=>{ e.stopPropagation(); saveCurrentRange(); });
    colorInput.addEventListener("input", ()=>{
      editorEl.focus();
      restoreRange();
      document.execCommand(colorInput.getAttribute("data-cmd"), false, colorInput.value);
      const bar = colorInput.parentElement.querySelector(".swatch-bar");
      if(bar) bar.style.background = colorInput.value;
    });
  });
  const fileInput = document.getElementById(`${id}-file`);
  fileInput.addEventListener("change", async ()=>{
    const file = fileInput.files[0]; if(!file) return;
    const dataUrl = await compressImageFile(file);
    if(!dataUrl) return; // compressImageFile already alerted the user about what went wrong
    await insertResizableImage(editorEl, dataUrl);
    attachImageResizeHandles(editorEl);
    fileInput.value = "";
  });
  editorEl.addEventListener("paste", async (e)=>{
    const cd = e.clipboardData || window.clipboardData;
    const items = cd.items;
    // Some browsers attach a flattened image snapshot alongside real HTML when you
    // copy a mixed selection (text + images) from a page or document. If we only
    // checked for an image item, we'd wrongly treat the WHOLE paste as "just an
    // image" and silently discard all the actual text and other pictures. Only take
    // the single-image fast path when there's genuinely no HTML riding along with it.
    const hasHtml = Array.from(items).some(it => it.type === "text/html");
    if(!hasHtml){
      for(const item of items){
        if(item.type && item.type.startsWith("image/")){
          e.preventDefault();
          const file = item.getAsFile();
          const dataUrl = await compressImageFile(file);
          if(!dataUrl) return; // compressImageFile already alerted the user about what went wrong
          await insertResizableImage(editorEl, dataUrl);
          attachImageResizeHandles(editorEl);
          return;
        }
      }
    }
    // Mixed/rich paste (or plain text) — let the browser's default paste happen,
    // then wrap any plain <img> tags it inserted so every picture — no matter how
    // it got in — ends up resizable and click-to-enlarge, same as ones we insert.
    // Two passes: large pastes can take a moment longer to finish landing in the DOM.
    setTimeout(()=>{ normalizePastedImages(editorEl); attachImageResizeHandles(editorEl); }, 0);
    setTimeout(()=>{ normalizePastedImages(editorEl); attachImageResizeHandles(editorEl); }, 200);
  });
  attachTableControls(editorEl);
  attachTableResizeHandles(editorEl);
  attachImageResizeHandles(editorEl);
}

// A small persistent toolbar appears directly above whichever table the
// cursor is currently in, rather than a floating tooltip that has to track
// scroll position — simpler and more robust inside a hand-rolled
// contenteditable editor. Operates directly on the DOM (this isn't backed
// by execCommand, since there's no native table-editing command), then
// dispatches a synthetic input event afterward so the existing debounced
// autosave picks up the change exactly like any other edit would.
function attachTableControls(editorEl){
  let toolbarEl = null;
  let activeCell = null;

  function colIndexOf(cell){ return Array.from(cell.parentNode.children).indexOf(cell); }
  function emptyCellHtml(){ return "<td><br></td>"; }

  function ensureToolbar(){
    if(toolbarEl) return toolbarEl;
    toolbarEl = document.createElement("div");
    toolbarEl.className = "rte-table-toolbar";
    toolbarEl.setAttribute("contenteditable", "false");
    toolbarEl.innerHTML = `
      <button type="button" data-t="row-above" title="Insert row above">+Row ↑</button>
      <button type="button" data-t="row-below" title="Insert row below">+Row ↓</button>
      <button type="button" data-t="col-left" title="Insert column left">+Col ←</button>
      <button type="button" data-t="col-right" title="Insert column right">+Col →</button>
      <span class="rte-table-toolbar-sep"></span>
      <button type="button" data-t="del-row" title="Delete this row">−Row</button>
      <button type="button" data-t="del-col" title="Delete this column">−Col</button>
      <span class="rte-table-toolbar-sep"></span>
      <button type="button" data-t="del-table" title="Delete table">✕ Table</button>
    `;
    toolbarEl.querySelectorAll("button[data-t]").forEach(btn=>{
      btn.addEventListener("mousedown", (e)=> e.preventDefault()); // don't steal focus/selection away from the cell
      btn.addEventListener("click", ()=>{ if(activeCell && activeCell.isConnected) runTableAction(btn.getAttribute("data-t")); });
    });
    return toolbarEl;
  }

  function hideToolbar(){
    if(toolbarEl) toolbarEl.remove();
    activeCell = null;
  }

  function runTableAction(action){
    const table = activeCell.closest(".rte-table");
    if(!table){ hideToolbar(); return; }
    const row = activeCell.closest("tr");
    const colIdx = colIndexOf(activeCell);
    const rows = Array.from(table.rows);

    if(action==="row-above" || action==="row-below"){
      const newRow = document.createElement("tr");
      for(let i=0;i<row.children.length;i++) newRow.insertAdjacentHTML("beforeend", emptyCellHtml());
      const rowIdx = rows.indexOf(row);
      row.parentNode.insertBefore(newRow, action==="row-above" ? row : (rows[rowIdx+1] || null));
    } else if(action==="col-left" || action==="col-right"){
      rows.forEach(r=>{
        const cell = r.children[colIdx];
        if(cell) cell.insertAdjacentHTML(action==="col-left" ? "beforebegin" : "afterend", emptyCellHtml());
      });
    } else if(action==="del-row"){
      if(rows.length<=1){ table.remove(); hideToolbar(); editorEl.dispatchEvent(new Event("input",{bubbles:true})); return; }
      row.remove();
    } else if(action==="del-col"){
      if(row.children.length<=1){ table.remove(); hideToolbar(); editorEl.dispatchEvent(new Event("input",{bubbles:true})); return; }
      rows.forEach(r=>{ const cell = r.children[colIdx]; if(cell) cell.remove(); });
    } else if(action==="del-table"){
      table.remove(); hideToolbar();
      editorEl.dispatchEvent(new Event("input",{bubbles:true}));
      return;
    }
    attachTableResizeHandles(editorEl);
    editorEl.dispatchEvent(new Event("input",{bubbles:true}));
  }

  function showToolbarFor(cell){
    activeCell = cell;
    const table = cell.closest(".rte-table");
    if(!table) return;
    table.parentNode.insertBefore(ensureToolbar(), table);
  }

  editorEl.addEventListener("click", (e)=>{
    const cell = e.target.closest("td");
    const table = e.target.closest(".rte-table");
    if(cell && table && editorEl.contains(table)) showToolbarFor(cell);
    else if(toolbarEl && !e.target.closest(".rte-table-toolbar")) hideToolbar();
  });
  editorEl.addEventListener("keyup", ()=>{
    const sel = window.getSelection();
    if(!sel.anchorNode) return;
    const node = sel.anchorNode.nodeType===1 ? sel.anchorNode : sel.anchorNode.parentElement;
    const cell = node && node.closest ? node.closest("td") : null;
    if(cell && cell.closest(".rte-table") && editorEl.contains(cell)) showToolbarFor(cell);
  });
}

// Column handles hang off the first row's cells only — setting a column's
// width via any single row's cell is enough to size the whole column, since
// browsers align column widths across all rows in a table automatically.
// Row handles hang off each row's first cell for the same reason on the
// other axis. Re-run after every insert/delete since new cells need their
// own handles too.
function attachTableResizeHandles(editorEl){
  editorEl.querySelectorAll(".rte-table").forEach(table=>{
    const rows = Array.from(table.rows);
    if(!rows.length) return;
    Array.from(rows[0].children).forEach(cell=>{
      if(cell.querySelector(":scope > .rte-col-resize-handle")) return;
      const handle = document.createElement("span");
      handle.className = "rte-col-resize-handle";
      handle.setAttribute("contenteditable", "false");
      handle.setAttribute("draggable", "false");
      cell.appendChild(handle);
    });
    rows.forEach(row=>{
      const cell = row.children[0];
      if(!cell || cell.querySelector(":scope > .rte-row-resize-handle")) return;
      const handle = document.createElement("span");
      handle.className = "rte-row-resize-handle";
      handle.setAttribute("contenteditable", "false");
      handle.setAttribute("draggable", "false");
      cell.appendChild(handle);
    });
  });
}
let _colResizeDrag = null;
let _rowResizeDrag = null;
document.addEventListener("mousedown", (e)=>{
  const colHandle = e.target.closest(".rte-col-resize-handle");
  if(colHandle){
    e.preventDefault(); e.stopPropagation();
    const cell = colHandle.parentElement;
    _colResizeDrag = { cell, startX:e.clientX, startW:cell.offsetWidth };
    return;
  }
  const rowHandle = e.target.closest(".rte-row-resize-handle");
  if(rowHandle){
    e.preventDefault(); e.stopPropagation();
    const cell = rowHandle.parentElement;
    _rowResizeDrag = { row: cell.parentElement, startY:e.clientY, startH:cell.parentElement.offsetHeight };
  }
});
document.addEventListener("mousemove", (e)=>{
  if(_colResizeDrag){
    e.preventDefault();
    const { cell, startX, startW } = _colResizeDrag;
    const w = Math.max(30, startW + (e.clientX - startX));
    const table = cell.closest("table");
    const colIdx = Array.from(cell.parentNode.children).indexOf(cell);
    // Set on every row's cell in this column, not just the dragged one —
    // keeps the column's width intact even if that specific row later
    // gets deleted.
    Array.from(table.rows).forEach(r=>{ const c = r.children[colIdx]; if(c) c.style.width = w+"px"; });
    return;
  }
  if(_rowResizeDrag){
    e.preventDefault();
    const { row, startY, startH } = _rowResizeDrag;
    const h = Math.max(24, startH + (e.clientY - startY));
    Array.from(row.children).forEach(c=> c.style.height = h+"px");
  }
});
document.addEventListener("mouseup", ()=>{
  if(_colResizeDrag){
    const editorEl = _colResizeDrag.cell.closest(".rte-body");
    if(editorEl) editorEl.dispatchEvent(new Event("input", { bubbles:true }));
  }
  if(_rowResizeDrag){
    const editorEl = _rowResizeDrag.row.closest(".rte-body");
    if(editorEl) editorEl.dispatchEvent(new Event("input", { bubbles:true }));
  }
  _colResizeDrag = null; _rowResizeDrag = null;
});

/* ============================================================
   CUSTOM IMAGE RESIZE — replaces native CSS `resize`, which
   behaves inconsistently inside contenteditable regions across
   browsers (images would render at inflated size only while
   actively editing). This gives identical behavior everywhere.
   ============================================================ */
// The resize handle and delete button are live editing affordances only — they
// must never end up saved as part of the actual content, or they'd show up (and
// even still work) in read-only views. Always read saved content through this,
// never through a raw .innerHTML, on any editor whose content gets persisted.
function getCleanEditorHtml(editorEl){
  if(!editorEl) return "";
  const clone = editorEl.cloneNode(true);
  clone.querySelectorAll(".rte-resize-handle, .rte-img-delete, .rte-table-toolbar, .rte-col-resize-handle, .rte-row-resize-handle").forEach(el=> el.remove());
  return clone.innerHTML;
}
function fixImageSizing(wrap){
  const img = wrap.querySelector("img");
  if(!img) return;
  let w = parseInt(img.getAttribute("width")) || (img.style.width ? parseInt(img.style.width) : 0);
  let h = parseInt(img.getAttribute("height")) || (img.style.height ? parseInt(img.style.height) : 0);
  if((!w || !h) && (wrap.style.width || wrap.style.height)){
    // Legacy content: size was stored on the wrapper span (an older version of this
    // feature), not on the image itself, which is what the current system expects.
    // Migrate it onto the image so it renders identically everywhere.
    w = w || parseInt(wrap.style.width) || 0;
    h = h || parseInt(wrap.style.height) || 0;
    wrap.style.width = ""; wrap.style.height = "";
  }
  if(w && h){ setImageSize(img, w, h); return; }
  // No size data anywhere (img, its attributes, or the wrapper) — this is content
  // with zero sizing info at all. Fall back to computing from the image's real
  // pixel dimensions, same as a freshly pasted image, so it can never be left
  // completely unconstrained (which is what "giant" actually was).
  const applyNatural = ()=>{
    const nw = img.naturalWidth || 280;
    const nh = img.naturalHeight || 190;
    const maxW = 340, maxH = 260;
    const scale = Math.min(maxW/nw, maxH/nh, 1);
    setImageSize(img, Math.max(Math.round(nw*scale), 80), Math.max(Math.round(nh*scale), 60));
  };
  if(img.complete && img.naturalWidth){ applyNatural(); }
  else {
    setImageSize(img, 280, 190); // safe placeholder while it loads
    img.addEventListener("load", applyNatural, { once:true });
  }
}
function attachImageResizeHandles(editorEl){
  editorEl.querySelectorAll(".rte-img-wrap").forEach(wrap=>{
    fixImageSizing(wrap);
    if(!wrap.querySelector(".rte-resize-handle")){
      const handle = document.createElement("span");
      handle.className = "rte-resize-handle";
      handle.setAttribute("contenteditable", "false");
      handle.setAttribute("draggable", "false");
      wrap.appendChild(handle);
    }
    if(!wrap.querySelector(".rte-img-delete")){
      const delBtn = document.createElement("span");
      delBtn.className = "rte-img-delete";
      delBtn.setAttribute("contenteditable", "false");
      delBtn.setAttribute("draggable", "false");
      delBtn.title = "Delete image";
      delBtn.textContent = "✕";
      wrap.appendChild(delBtn);
    }
  });
}
// The wrapper itself is draggable="true" (so the picture can be dragged to a new
// spot in the text), but that same setting can hijack a mousedown-drag gesture
// that started on the resize handle or delete button, turning it into a native
// drag instead of our custom resize logic — which is what made resizing feel
// inconsistent. Block native drag from ever starting on those two controls.
document.addEventListener("dragstart", (e)=>{
  if(e.target.closest(".rte-resize-handle") || e.target.closest(".rte-img-delete")) e.preventDefault();
});
// Any link anywhere in rendered content (lessons, reference pages, notes,
// chat, quiz explanations, feedback, etc.) opens in a new tab rather than
// navigating away from the app — covers links already saved from before
// this was added too, not just ones created going forward.
document.addEventListener("click", (e)=>{
  const link = e.target.closest("a[href]");
  if(!link) return;
  const href = link.getAttribute("href");
  if(!href || href.startsWith("#")) return;
  e.preventDefault();

let _ipBoxDrawing = null;
document.addEventListener("mousemove", (e)=>{
  if(!_ipBoxDrawing) return;
  const { rect, startX, startY, previewEl, scale } = _ipBoxDrawing;
  const s = scale || 1;
  const x1 = Math.min(startX, e.clientX), x2 = Math.max(startX, e.clientX);
  const y1 = Math.min(startY, e.clientY), y2 = Math.max(startY, e.clientY);
  // previewEl lives inside the zoomable canvas, which now carries a CSS
  // transform (scale) — its own left/top/width/height are interpreted in
  // that parent's local, unscaled coordinate space, then visually scaled
  // up by the transform when rendered. Dividing by the current scale here
  // converts the viewport-pixel delta into that local space, so the
  // preview box actually appears at the size/position it should — without
  // this, it renders at the wrong size (invisible or huge) whenever
  // zoomed in at all, exactly when precise placement matters most.
  previewEl.style.left = ((x1 - rect.left) / s) + "px";
  previewEl.style.top = ((y1 - rect.top) / s) + "px";
  previewEl.style.width = ((x2-x1) / s) + "px";
  previewEl.style.height = ((y2-y1) / s) + "px";
});
