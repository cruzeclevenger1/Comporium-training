/* ============================================================
   TRACKER — standardized .xlsx export of a trainee's tracked
   progress (module progress, module quiz attempts, standalone
   quizzes). This is a straight report of what's in the database
   — no editable/custom fields — built client-side with SheetJS
   (already loaded in <head>), so no server round-trip is needed.
   Dates that weren't tracked before this feature existed show as
   "N/A"; start/finish dates are recorded going forward from here.
   ============================================================ */
function fmtTrackerDate(iso){
  if(!iso) return "N/A";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "N/A";
  return d.toLocaleString(undefined, { year:"numeric", month:"short", day:"numeric", hour:"2-digit", minute:"2-digit" });
}
function sanitizeTrackerSheetName(name, used){
  let base = (name||"Trainee").replace(/[\\\/\?\*\[\]:]/g, " ").trim().slice(0,31) || "Trainee";
  let candidate = base, n = 2;
  while(used.has(candidate.toLowerCase())){
    const suffix = " ("+n+")";
    candidate = base.slice(0, 31-suffix.length) + suffix;
    n++;
  }
  used.add(candidate.toLowerCase());
  return candidate;
}

// Pulls everything the tracker needs for one or more people in a handful of
// bulk queries (not one round-trip per person), then shapes it per-person.
async function fetchTrackerData(personIds, deptFilter){
  const [profRes, progRes, quizAttRes, standaloneQRes, standaloneAttRes, recipRes, teamMemRes] = await Promise.all([
    supabase.from("profiles").select("*").in("id", personIds),
    supabase.from("progress").select("*").in("user_id", personIds),
    supabase.from("quiz_attempts").select("*").in("user_id", personIds).order("created_at", { ascending:true }),
    supabase.from("standalone_quizzes").select("*").eq("sent", true),
    supabase.from("standalone_quiz_attempts").select("*").in("user_id", personIds),
    supabase.from("standalone_quiz_recipients").select("*"),
    supabase.from("team_members").select("*")
  ]);
  const profiles = profRes.data || [];
  const progressRows = progRes.data || [];
  const quizAttempts = quizAttRes.data || [];
  const standaloneQuizzes = standaloneQRes.data || [];
  const standaloneAttempts = standaloneAttRes.data || [];
  const recipients = recipRes.data || [];
  const teamMembers = teamMemRes.data || [];

  function buildModuleRow(m, pid){
    const pr = progressRows.find(r=>r.user_id===pid && r.module_id===m.id);
    const totalLessons = m.lessons.length;
    const viewedCount = viewedLessonCount(pr && pr.lessons_viewed, m);
    const hasQuiz = !!m.quiz.length;
    let status;
    if(hasQuiz){
      const allLessonsViewed = !totalLessons || viewedCount >= totalLessons;
      if(!pr) status = "Not started";
      else if(pr.best_score === m.quiz.length && allLessonsViewed) status = "Mastered";
      else if(pr.attempts) status = "Attempted";
      else status = "In progress";
    } else {
      if(totalLessons && viewedCount >= totalLessons) status = "Mastered";
      else if(viewedCount > 0) status = "In progress";
      else status = "Not started";
    }
    const lessonFraction = totalLessons ? Math.min(viewedCount/totalLessons, 1) : 0;
    const quizFraction = hasQuiz ? (pr ? (pr.best_score||0)/m.quiz.length : 0) : 0;
    const overallPct = hasQuiz ? Math.round((lessonFraction*0.5 + quizFraction*0.5) * 100) : Math.round(lessonFraction*100);
    return {
      moduleId: m.id,
      title: m.title, status, overallPct,
      lessonsViewed: viewedCount, totalLessons,
      quizBest: hasQuiz ? (pr ? (pr.best_score||0) : 0) : "N/A",
      quizTotal: hasQuiz ? m.quiz.length : "N/A",
      quizAttempts: pr ? (pr.attempts||0) : 0,
      started: fmtTrackerDate(pr && pr.started_at),
      finished: fmtTrackerDate(pr && pr.mastered_at)
    };
  }

  const result = {};
  personIds.forEach(pid=>{
    const profile = profiles.find(p=>p.id===pid);
    if(!profile) return;

    // Only the department(s) this person actually has access to — a
    // module or standalone quiz belonging to a department they don't have
    // shouldn't show up in their tracker at all. If the admin picked a
    // narrower department filter for this report, intersect with that too.
    let deptIds = DEPARTMENTS.filter(d=> !!profile[d.profileField]).map(d=>d.id);
    if(deptFilter) deptIds = deptIds.filter(dId=> deptFilter.includes(dId));
    const accessibleModules = MODULES.filter(m=> deptIds.some(dId=> teamHasDeptAccess(m, dId)));
    const accessibleModuleIds = new Set(accessibleModules.map(m=>m.id));

    const allModuleRows = accessibleModules.map(m=> buildModuleRow(m, pid));

    const attemptCounter = {};
    const allQuizAttemptRows = quizAttempts.filter(a=> a.user_id===pid && accessibleModuleIds.has(a.module_id)).map(a=>{
      attemptCounter[a.module_id] = (attemptCounter[a.module_id]||0) + 1;
      const m = modById(a.module_id);
      return {
        moduleId: a.module_id,
        module: m ? m.title : "(deleted module)",
        attemptNum: attemptCounter[a.module_id],
        score: a.score, total: a.total,
        pct: a.total ? Math.round((a.score/a.total)*100) : 0,
        started: fmtTrackerDate(a.started_at),
        submitted: fmtTrackerDate(a.created_at)
      };
    });

    const eligible = standaloneQuizzes.filter(q=>{
      if(!deptIds.some(dId=> rawRowHasDeptAccess(q, dId))) return false;
      if(q.audience_type==="everyone") return true;
      if(q.audience_type==="team") return teamMembers.some(tm=>tm.team_id===q.team_id && tm.user_id===pid);
      if(q.audience_type==="specific") return recipients.some(r=>r.quiz_id===q.id && r.user_id===pid);
      return false;
    });
    const allStandaloneRows = eligible.map(q=>{
      const att = standaloneAttempts.find(a=>a.quiz_id===q.id && a.user_id===pid);
      const status = !att ? "Not started" : (att.graded ? "Completed" : "Needs grading");
      return {
        quizObj: q,
        title: q.title, status,
        score: att ? (att.mc_score||0) : "N/A",
        total: att ? (att.mc_total||0) : "N/A",
        started: fmtTrackerDate(att && att.started_at),
        submitted: fmtTrackerDate(att && att.created_at)
      };
    });

    const mastered = allModuleRows.filter(r=>r.status==="Mastered").length;

    // Someone with just one department gets a single combined view (as
    // before). Someone with more than one gets a breakdown per department,
    // so their tracker never mixes progress across departments they may
    // have started at different times or with very different content.
    let perDept = null;
    if(deptIds.length > 1){
      perDept = deptIds.map(dId=>{
        const deptModuleIds = new Set(accessibleModules.filter(m=> teamHasDeptAccess(m, dId)).map(m=>m.id));
        return {
          deptId: dId, deptLabel: deptLabel(dId),
          moduleRows: allModuleRows.filter(r=> deptModuleIds.has(r.moduleId)),
          quizAttemptRows: allQuizAttemptRows.filter(r=> deptModuleIds.has(r.moduleId)),
          standaloneRows: allStandaloneRows.filter(r=> rawRowHasDeptAccess(r.quizObj, dId))
        };
      });
    }

    result[pid] = { profile, deptIds, moduleRows: allModuleRows, quizAttemptRows: allQuizAttemptRows, standaloneRows: allStandaloneRows, mastered, perDept };
  });
  return result;
}

// Colors matched from the template workbook (Tracker_Patrick_Keller.xlsx):
// its blue/peach/gray cells are theme colors at specific tints, resolved
// here to the equivalent literal RGB so they render identically without
// depending on the workbook's theme.
const TRACKER_COLORS = {
  header: "FF8EB4E3",     // column header row (blue)
  rowTitle: "FFFCD5B5",   // leftmost "row title" column (peach)
  notStarted: "FFD99694", // light red
  inProgress: "FFFFE699", // light pastel yellow
  mastered: "FF92D050",   // light green
  neutral: "FFDDD9C3"     // quiz/date columns that aren't status-driven
};
function trackerFill(hex){ return { fill: { patternType:"solid", fgColor:{ rgb: hex } } }; }
function trackerStatusFill(status){
  if(status === "Mastered" || status === "Completed") return trackerFill(TRACKER_COLORS.mastered);
  if(status === "Not started" || status === "Not Started") return trackerFill(TRACKER_COLORS.notStarted);
  return trackerFill(TRACKER_COLORS.inProgress); // In progress / Attempted / Needs grading
}

// Builds one fully-styled sheet: a centered name banner up top, then the
// Module Progress / Module Quiz Attempts / Standalone Quizzes sections,
// color-coded the same way as the template — status columns colored
// red/yellow/green, the row-title column peach, header rows blue, and the
// quiz/date columns (which aren't a "status") a neutral gray.
function buildStyledTrackerSheet(data, title){
  const aoa = [];
  const meta = [];
  const push = (arr, type, extra)=>{ aoa.push(arr); meta.push(Object.assign({type}, extra)); };

  push([], "blank");
  push([null,null,null, title], "title");
  push([], "blank");

  push(["MODULE PROGRESS"], "sectionTitle");
  push(["Module","Status","Overall %","Lessons Viewed","Total Lessons","Quiz Best Score","Quiz Total Questions","Quiz Attempts Used","Module Started","Module Finished"], "colHeader", { width:10 });
  if(data.moduleRows.length) data.moduleRows.forEach(r=> push([r.title, r.status, r.overallPct, r.lessonsViewed, r.totalLessons, r.quizBest, r.quizTotal, r.quizAttempts, r.started, r.finished], "moduleRow", { status:r.status }));
  else push(["No modules in this department yet."], "note");
  push([], "blank");

  push(["MODULE QUIZ ATTEMPTS"], "sectionTitle");
  push(["Module","Attempt #","Score","Total","Percent","Started","Submitted"], "colHeader", { width:7 });
  if(data.quizAttemptRows.length) data.quizAttemptRows.forEach(r=> push([r.module, r.attemptNum, r.score, r.total, r.pct+"%", r.started, r.submitted], "attemptRow"));
  else push(["No quiz attempts recorded."], "note");
  push([], "blank");

  push(["STANDALONE QUIZZES"], "sectionTitle");
  push(["Quiz","Status","Score","Total","Started","Submitted"], "colHeader", { width:6 });
  if(data.standaloneRows.length) data.standaloneRows.forEach(r=> push([r.title, r.status, r.score, r.total, r.started, r.submitted], "standaloneRow", { status:r.status }));
  else push(["No standalone quizzes assigned."], "note");

  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = [{wch:32},{wch:16},{wch:14},{wch:16},{wch:14},{wch:16},{wch:18},{wch:16},{wch:22},{wch:22}];

  const titleRow = meta.findIndex(m=> m.type==="title");
  ws['!merges'] = [{ s:{r:titleRow,c:3}, e:{r:titleRow,c:6} }];
  ws['!rows'] = ws['!rows'] || [];
  ws['!rows'][titleRow] = { hpt: 26 };

  const setStyle = (r,c,style)=>{
    const ref = XLSX.utils.encode_cell({r,c});
    if(!ws[ref]) ws[ref] = { t:"z" };
    ws[ref].s = style;
  };

  meta.forEach((m, r)=>{
    if(m.type === "title"){
      setStyle(r, 3, { font:{ name:"Calibri", sz:18 }, alignment:{ horizontal:"center" } });
    } else if(m.type === "colHeader"){
      for(let c=0; c<m.width; c++) setStyle(r, c, trackerFill(TRACKER_COLORS.header));
    } else if(m.type === "moduleRow"){
      setStyle(r, 0, trackerFill(TRACKER_COLORS.rowTitle));
      const statusStyle = trackerStatusFill(m.status);
      for(let c=1; c<=4; c++) setStyle(r, c, statusStyle);
      for(let c=5; c<=9; c++) setStyle(r, c, trackerFill(TRACKER_COLORS.neutral));
    } else if(m.type === "attemptRow"){
      setStyle(r, 0, trackerFill(TRACKER_COLORS.rowTitle));
    } else if(m.type === "standaloneRow"){
      setStyle(r, 0, trackerFill(TRACKER_COLORS.rowTitle));
      setStyle(r, 1, trackerStatusFill(m.status));
      for(let c=2; c<=5; c++) setStyle(r, c, trackerFill(TRACKER_COLORS.neutral));
    }
  });

  return ws;
}
// Writes one person's data into wb — a single sheet if they only have one
// department, or one sheet per department if they have several, so
// progress from different departments never gets mixed together.
function appendPersonTrackerSheets(wb, d, usedNames, includeNameInSheet){
  if(d.perDept && d.perDept.length > 1){
    d.perDept.forEach(dep=>{
      const title = includeNameInSheet ? `${d.profile.name} — ${dep.deptLabel}` : dep.deptLabel;
      const ws = buildStyledTrackerSheet(dep, title);
      const label = includeNameInSheet ? `${d.profile.name} (${dep.deptId})` : dep.deptLabel;
      XLSX.utils.book_append_sheet(wb, ws, sanitizeTrackerSheetName(label, usedNames));
    });
  } else {
    const ws = buildStyledTrackerSheet(d, d.profile.name);
    const label = includeNameInSheet ? d.profile.name : "Tracker";
    XLSX.utils.book_append_sheet(wb, ws, sanitizeTrackerSheetName(label, usedNames));
  }
}
// A blob: URI + <a download> works in most desktop browsers, but Safari/
// WebKit (iOS, iPadOS, and some in-app webviews) is known to ignore the
// download attribute on blob: URIs entirely and hand back a generic
// filename with no extension — the same issue this app hit with the old
// tracker export. The only reliable fix across all browsers is a real
// top-level navigation to a server response carrying a genuine
// Content-Disposition header, so this posts the generated file to a small
// edge function (deliver-xlsx) that just relays the bytes back with that
// header — see edge-function/deliver-xlsx.ts.
async function triggerXlsxDownload(wb, filename){
  const wbout = XLSX.write(wb, { bookType:"xlsx", type:"base64", bookSST:true });
  const { data:{ session:activeSession } } = await supabase.auth.getSession();
  if(!activeSession){ alert("Your session has expired — please log in again, then try the download again."); return; }
  const form = document.createElement("form");
  form.method = "POST";
  form.action = `${SUPABASE_URL}/functions/v1/deliver-xlsx`;
  form.target = "_self";
  form.style.display = "none";
  const addField = (name, value)=>{
    const el = document.createElement("textarea");
    el.name = name; el.value = value;
    form.appendChild(el);
  };
  addField("file", wbout);
  addField("filename", filename);
  addField("user_id", activeSession.user.id);
  addField("token", activeSession.access_token);
  document.body.appendChild(form);
  form.submit();
  setTimeout(()=> form.remove(), 3000);
}

// Shared by every report path (everyone / a team / specific people) — builds
// a workbook with a Summary sheet plus one detail sheet per person (or one
// per department, for anyone with access to more than one). deptFilter is
// an optional array of department ids to restrict the report to; omit it
// (or pass null) to include everything each person already has access to.
async function buildTrackerWorkbook(personIds, deptFilter){
  const allData = await fetchTrackerData(personIds, deptFilter);
  const wb = XLSX.utils.book_new();
  const summaryAoa = [["Name","Role","Department(s)","Modules Mastered","Total Modules","Overall Module %","Module Quiz Attempts","Standalone Quizzes Completed","Standalone Quizzes Assigned"]];
  personIds.forEach(pid=>{
    const d = allData[pid];
    if(!d) return;
    const totalModules = d.moduleRows.length;
    const overallAvg = totalModules ? Math.round(d.moduleRows.reduce((a,r)=>a+r.overallPct,0)/totalModules) : 0;
    const standaloneCompleted = d.standaloneRows.filter(r=>r.status==="Completed").length;
    const deptLabels = d.deptIds.map(deptLabel).join(" + ") || "None";
    summaryAoa.push([d.profile.name, d.profile.role||"", deptLabels, d.mastered, totalModules, overallAvg+"%", d.quizAttemptRows.length, standaloneCompleted, d.standaloneRows.length]);
  });
  const summaryWs = XLSX.utils.aoa_to_sheet(summaryAoa);
  summaryWs['!cols'] = [{wch:26},{wch:14},{wch:22},{wch:16},{wch:14},{wch:16},{wch:18},{wch:22},{wch:20}];
  XLSX.utils.book_append_sheet(wb, summaryWs, "Summary");

  const usedNames = new Set(["Summary"]);
  personIds.forEach(pid=>{
    const d = allData[pid];
    if(!d) return;
    appendPersonTrackerSheets(wb, d, usedNames, true);
  });
  return wb;
}

      personIds = allPeople.map(p=>p.id);
    } else if(scope === "team"){
      const chosenTeams = teams.filter(t=> document.querySelector(`[data-report-team="${t.id}"]`)?.checked);
      if(!chosenTeams.length){ errEl.textContent = "Check at least one team."; errEl.style.display = "block"; return; }
      personIds = [...new Set(chosenTeams.flatMap(t=>t.memberIds))];
      scopeLabel = chosenTeams.map(t=>t.name).join("_");
    } else {
      personIds = allPeople.filter(p=> document.querySelector(`[data-report-person="${p.id}"]`)?.checked).map(p=>p.id);
      if(!personIds.length){ errEl.textContent = "Check at least one person."; errEl.style.display = "block"; return; }
      scopeLabel = personIds.length===1 ? ((allPeople.find(p=>p.id===personIds[0])||{}).name||"Person") : `${personIds.length}_People`;
    }
    if(!personIds.length){ errEl.textContent = "No one matches that selection — check they have team members or exist."; errEl.style.display = "block"; return; }

    const btn = document.getElementById("report-generate");
    btn.disabled = true; btn.textContent = "Building…";
    try{
      const wb = await buildTrackerWorkbook(personIds, deptFilter);
      const safeScope = (scopeLabel||"Report").replace(/[^a-z0-9]+/gi,"_").slice(0,60);
      const allDepts = deptFilter.length === DEPARTMENTS.length;
      const deptTag = allDepts ? "" : `_${deptFilter.join("-")}`;
      const stamp = new Date().toISOString().slice(0,10);
      await triggerXlsxDownload(wb, `Progress_Report_${safeScope}${deptTag}_${stamp}.xlsx`);
      closeModal();
    } catch(err){
      errEl.textContent = "Couldn't build the report: " + err.message;
      errEl.style.display = "block";
      btn.disabled = false; btn.textContent = "Generate Report";
    }
  });
}

async function downloadTeamTracker(team){
  const btn = document.querySelector(`[data-download-team-tracker="${team.id}"]`);

function openSlideshowConfigFullscreen(ipId){

  document.body.appendChild(overlay);
  window.activeFullscreenCleanups.push(()=> overlay.remove());

  let saveTimer = null;
  function scheduleSave(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async ()=>{ await silentSave(()=> supabase.from("interactive_pictures").update({ slides: ip.slides }).eq("id", ipId)); }, 500);
  }

  function draw(){
    const slidesHtml = ip.slides.map((s,i)=>`
      <div class="sub-card" style="display:flex;align-items:center;gap:12px;">
        <img src="${s.image}" style="width:120px;height:80px;object-fit:cover;border-radius:6px;flex:none;">
        <div style="flex:1;color:var(--text-dim);font-size:13px;">Slide ${i+1}</div>
        <div style="display:flex;gap:6px;">
          <button class="mini-btn" data-slide-up="${i}" ${i===0?'disabled':''} title="Move earlier">↑</button>
          <button class="mini-btn" data-slide-down="${i}" ${i===ip.slides.length-1?'disabled':''} title="Move later">↓</button>
          <button class="mini-btn danger" data-slide-del="${i}" title="Remove">✕</button>
        </div>
      </div>`).join("");
    overlay.innerHTML = `
      <div style="width:100%;max-width:700px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
          <span style="color:var(--text-dim);font-family:var(--mono);font-size:12px;">SLIDESHOW · ${ip.slides.length} slide${ip.slides.length===1?'':'s'}</span>
          <button class="btn primary" id="slideshow-config-done">Done</button>
        </div>
        ${slidesHtml || `<p style="color:var(--text-faint);font-size:13px;">No slides yet.</p>`}
        <button class="dashed-btn" id="slideshow-add-more" style="margin-top:12px;width:100%;">+ Add more slides</button>
        <input type="file" accept="image/*" multiple style="display:none" id="slideshow-config-file-input">
      </div>`;
    document.getElementById("slideshow-config-done").addEventListener("click", ()=>{ scheduleSave(); overlay.remove(); if(view==="editor") renderEditor(); });
    const addBtn = document.getElementById("slideshow-add-more");
    const fileInput = document.getElementById("slideshow-config-file-input");
    addBtn.addEventListener("click", ()=> fileInput.click());
    fileInput.addEventListener("change", async (e)=>{
      const files = Array.from(e.target.files||[]);
      e.target.value = "";
      if(!files.length) return;
      addBtn.disabled = true; addBtn.textContent = "Uploading…";
      // Sequential, not parallel — same reasoning as the initial upload:
      // keeps the order they were selected in, rather than whatever order
      // the network happens to finish each upload.
      for(const file of files){
        const url = await compressImageFile(file);
        if(url) ip.slides.push({ image:url });
      }
      scheduleSave();
      draw();
    });
    overlay.querySelectorAll("[data-slide-del]").forEach(el=> el.addEventListener("click", ()=>{
      const i = +el.getAttribute("data-slide-del");
      if(!confirm("Remove this slide?")) return;
      ip.slides.splice(i,1);
      scheduleSave();
      draw();
    }));
    overlay.querySelectorAll("[data-slide-up]").forEach(el=> el.addEventListener("click", ()=>{
      const i = +el.getAttribute("data-slide-up");
      if(i<=0) return;
      [ip.slides[i-1], ip.slides[i]] = [ip.slides[i], ip.slides[i-1]];
      scheduleSave();
      draw();
    }));
    overlay.querySelectorAll("[data-slide-down]").forEach(el=> el.addEventListener("click", ()=>{
      const i = +el.getAttribute("data-slide-down");
      if(i>=ip.slides.length-1) return;
      [ip.slides[i], ip.slides[i+1]] = [ip.slides[i+1], ip.slides[i]];
      scheduleSave();
      draw();
    }));
  }
  draw();
}

async function openSlideshowViewer(ipId){
  const ip = INTERACTIVE_PICTURES[ipId];
  if(!ip){ alert("Couldn't load this slideshow."); return; }
  await ensureInteractivePicSlides(ipId);
  if(!ip.slides.length){ alert("This slideshow doesn't have any slides yet."); return; }
  if(!myInteractivePicProgress[ipId]) myInteractivePicProgress[ipId] = new Set();
  const seenSet = myInteractivePicProgress[ipId];

  const overlay = document.createElement("div");
  overlay.id = "slideshow-viewer-overlay";
  overlay.style.cssText = "position:fixed;inset:0;z-index:700;background:#000000f5;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;";
  document.body.appendChild(overlay);
  window.activeFullscreenCleanups.push(()=> overlay.remove());

  // Resume at the first slide not yet seen, rather than always restarting
  // at slide 1 — returning to a slideshow already partway through should
  // pick up close to where it left off, same spirit as quiz resume.
  let idx = 0;
  const firstUnseen = ip.slides.findIndex((s,i)=> !seenSet.has(i));
  if(firstUnseen >= 0) idx = firstUnseen;

  function markSeen(i){
    if(seenSet.has(i)) return;
    seenSet.add(i);
    silentSave(()=> Promise.resolve(supabase.from("interactive_picture_progress").upsert({
      user_id: session.user.id, interactive_picture_id: ipId, read_hotspot_ids: Array.from(seenSet), updated_at: new Date().toISOString()
    }, { onConflict: "user_id,interactive_picture_id" }))).catch(()=>{});
  }

  const onKeyDown = (e)=>{
    if(e.key === "ArrowLeft" && idx>0){ idx--; draw(); }
    else if(e.key === "ArrowRight" && idx<ip.slides.length-1){ idx++; draw(); }
  };
  document.addEventListener("keydown", onKeyDown);
  function cleanup(){ document.removeEventListener("keydown", onKeyDown); }
  window.activeFullscreenCleanups.push(cleanup);

  function draw(){
    markSeen(idx);
    const total = ip.slides.length;
    const done = ip.slides.filter((s,i)=>seenSet.has(i)).length;
    const allDone = done>=total;
    overlay.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;width:100%;max-width:1300px;margin-bottom:14px;gap:12px;">
        <span style="color:${allDone?'var(--green)':'var(--text-dim)'};font-family:var(--mono);font-size:12px;">SLIDE ${idx+1} OF ${total} · ${done}/${total} viewed${allDone?' — all done!':''}</span>
        <button class="btn ${allDone?'primary':''}" id="slideshow-viewer-close">${allDone?'Done ✓':'✕ Exit'}</button>
      </div>
      <div style="position:relative;display:flex;align-items:center;gap:16px;width:100%;max-width:1300px;justify-content:center;">
        <button class="btn" id="slideshow-prev" ${idx===0?'disabled':''} style="flex:none;font-size:20px;padding:14px 18px;">‹</button>
        <img src="${ip.slides[idx].image}" style="max-width:min(80vw,1100px);max-height:76vh;border-radius:8px;display:block;user-select:none;" draggable="false">
        <button class="btn" id="slideshow-next" ${idx===total-1?'disabled':''} style="flex:none;font-size:20px;padding:14px 18px;">›</button>
      </div>
      ${!allDone ? `<p style="color:var(--text-faint);font-size:12.5px;margin-top:14px;">Click through every slide with the arrows — all slides must be viewed before this counts as done.</p>` : `<p class="hint" style="margin-top:8px;">Use the arrows to review any slide again.</p>`}`;
    document.getElementById("slideshow-viewer-close").addEventListener("click", ()=>{ cleanup(); overlay.remove(); render(); });
    document.getElementById("slideshow-prev").addEventListener("click", ()=>{ if(idx>0){ idx--; draw(); } });
    document.getElementById("slideshow-next").addEventListener("click", ()=>{ if(idx<total-1){ idx++; draw(); } });
  }
  draw();
}

function openInteractivePicConfigFullscreen(ipId){
  const ip = INTERACTIVE_PICTURES[ipId];
  if(!ip){ alert("Couldn't find that interactive picture."); return; }
  const overlay = document.createElement("div");
  overlay.id = "ip-config-overlay";
  overlay.style.cssText = "position:fixed;inset:0;z-index:700;background:#000000f0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;";
  document.body.appendChild(overlay);
  window.activeFullscreenCleanups.push(()=> overlay.remove());

  let saveTimer = null;
  function scheduleSave(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async ()=>{ await silentSave(()=> supabase.from("interactive_pictures").update({ hotspots: ip.hotspots }).eq("id", ipId)); }, 500);
  }

  // Zoom capped so the image never exceeds the viewport — same as the
  // trainee viewer, and removes the need for Space-to-pan entirely.
  // getBoundingClientRect() below already accounts for the scale transform.
  let scale = 1;
  let currentViewport = null, currentCanvas = null, currentImg = null;

  function maxScale(){
    if(!currentViewport || !currentImg || !currentImg.naturalWidth) return 1;
    const vw = currentViewport.clientWidth, vh = currentViewport.clientHeight;
    const iw = currentImg.offsetWidth, ih = currentImg.offsetHeight;
    if(!iw || !ih) return 1;
    return Math.max(1, Math.min(vw/iw, vh/ih));
  }
  function applyTransform(){
    if(currentCanvas) currentCanvas.style.transform = `scale(${scale})`;
  }
  function onWheel(e){
    e.preventDefault();
    const cap = maxScale();
    scale = Math.min(cap, Math.max(1, scale + (e.deltaY < 0 ? 0.15 : -0.15)));
    applyTransform();
  }

  function draw(){
    const boxesHtml = ip.hotspots.map((h,hi)=>`
      <div class="sim-zone" data-ip-box="${hi}" style="position:absolute;left:${h.x}%;top:${h.y}%;width:${h.w}%;height:${h.h}%;border:2px dashed var(--red);cursor:pointer;">
        <button class="sim-zone-del" data-ip-box-del="${hi}" style="position:absolute;top:-10px;right:-10px;width:18px;height:18px;border-radius:50%;background:#c0392bdd;color:#fff;font-size:11px;line-height:18px;text-align:center;cursor:pointer;border:none;">✕</button>
        <span style="position:absolute;bottom:2px;left:2px;background:#000000cc;color:var(--red);font-size:10px;padding:1px 4px;border-radius:3px;font-family:var(--mono);white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(h.title||'(untitled)')}</span>
      </div>`).join("");
    overlay.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;width:100%;max-width:1200px;margin-bottom:14px;gap:12px;">
        <span style="color:var(--text-dim);font-family:var(--mono);font-size:12px;">INTERACTIVE PICTURE · ${ip.hotspots.length} hotspot${ip.hotspots.length===1?'':'s'} — drag to add one · scroll to zoom</span>
        <button class="btn primary" id="ip-config-done">Done</button>
      </div>
      <div class="ip-config-viewport" style="overflow:hidden;width:min(94vw,1200px);height:76vh;border-radius:8px;position:relative;display:flex;align-items:center;justify-content:center;">
        <div class="sim-screen-canvas" data-ip-canvas style="position:relative;display:inline-block;transform-origin:center center;">
          <img src="${ip.image}" style="max-width:min(75vw,920px);max-height:60vh;display:block;pointer-events:none;user-select:none;" draggable="false">
          <div class="sim-canvas-hint">✛ Drag to add a hotspot</div>
          ${boxesHtml}
        </div>
      </div>`;
    document.getElementById("ip-config-done").addEventListener("click", ()=>{ scheduleSave(); overlay.remove(); if(view==="editor") renderEditor(); });

    currentViewport = overlay.querySelector(".ip-config-viewport");
    currentCanvas = overlay.querySelector("[data-ip-canvas]");
    currentImg = currentCanvas.querySelector("img");
    scale = Math.min(scale, maxScale()); // clamp in case content or window size changed since last draw
    applyTransform();
    currentViewport.addEventListener("wheel", onWheel, { passive:false });
    currentCanvas.addEventListener("mousedown", (e)=>{
      if(e.target.closest(".sim-zone")) return;
      const rect = currentCanvas.getBoundingClientRect();
      const previewEl = document.createElement("div");
      previewEl.style.cssText = "position:absolute;border:2px solid var(--amber);background:#f5a62333;pointer-events:none;";
      currentCanvas.appendChild(previewEl);
      _ipBoxDrawing = { rect, startX:e.clientX, startY:e.clientY, previewEl, scale, onBoxAdded:(box)=>{
        ip.hotspots.push(box);
        scheduleSave();
        draw();
        openHotspotEditModal(ip, ip.hotspots.length-1, ()=>{ scheduleSave(); draw(); });
      }};
      e.preventDefault();
    });
    overlay.querySelectorAll("[data-ip-box-del]").forEach(el=> el.addEventListener("click",(e)=>{
      e.stopPropagation();
      const hi = +el.getAttribute("data-ip-box-del");
      ip.hotspots.splice(hi,1);
      scheduleSave();
      draw();
    }));
    overlay.querySelectorAll("[data-ip-box]").forEach(el=> el.addEventListener("click",(e)=>{
      if(e.target.closest("[data-ip-box-del]")) return;
      const hi = +el.getAttribute("data-ip-box");
      openHotspotEditModal(ip, hi, ()=>{ scheduleSave(); draw(); });
    }));
  }
  draw();
}

  // Zoom is capped so the image can never exceed the viewport in either
  // dimension — scaling out from the image's own center keeps it fully
  // visible and centered at every zoom level, so there's genuinely
  // nothing that could ever need panning. Only an element-level wheel
  // listener here, no window-level drag listeners, so there's nothing
  // that needs its own explicit cleanup beyond the overlay itself.
  let scale = 1;
  let currentViewport = null, currentInner = null, currentImg = null;

  function maxScale(){
    if(!currentViewport || !currentImg || !currentImg.naturalWidth) return 1;
    const vw = currentViewport.clientWidth, vh = currentViewport.clientHeight;
    const iw = currentImg.offsetWidth, ih = currentImg.offsetHeight;
    if(!iw || !ih) return 1;
    return Math.max(1, Math.min(vw/iw, vh/ih));
  }
  function applyTransform(){
    if(currentInner) currentInner.style.transform = `scale(${scale})`;
  }
  function onWheel(e){
    e.preventDefault();
    const cap = maxScale();
    scale = Math.min(cap, Math.max(1, scale + (e.deltaY < 0 ? 0.15 : -0.15)));
    applyTransform();
  }

  function draw(){
    const total = ip.hotspots.length;

    const boxesHtml = ip.hotspots.map((h,hi)=>`<div class="ip-play-hotspot ${readSet.has(h.id)?'ip-read':'ip-unread'}" data-ip-hotspot="${hi}" style="position:absolute;left:${h.x}%;top:${h.y}%;width:${h.w}%;height:${h.h}%;"></div>`).join("");

        <button class="btn ${allDone?'primary':''}" id="ip-viewer-close">${allDone?'Done ✓':'✕ Exit'}</button>
      </div>
      <div class="ip-viewer-viewport" style="overflow:hidden;width:min(94vw,1300px);height:76vh;border-radius:8px;position:relative;display:flex;align-items:center;justify-content:center;">

          ${boxesHtml}
        </div>
      </div>
      ${!allDone ? `<p style="color:var(--text-faint);font-size:12.5px;margin-top:10px;">Click every red box — it turns green once you've read it. All boxes must be green before you can move to the next lesson. Scroll to zoom in and out.</p>` : `<p class="hint" style="margin-top:8px;">Scroll to zoom in and out.</p>`}`;
    document.getElementById("ip-viewer-close").addEventListener("click", ()=>{ overlay.remove(); render(); });

    currentViewport = overlay.querySelector(".ip-viewer-viewport");
    currentInner = overlay.querySelector(".ip-pan-inner");
    currentImg = currentInner.querySelector("img");
    scale = Math.min(scale, maxScale()); // clamp in case content or window size changed since last draw
    applyTransform();
    currentViewport.addEventListener("wheel", onWheel, { passive:false });

    overlay.querySelectorAll("[data-ip-hotspot]").forEach(el=> el.addEventListener("click", ()=>{
      const hi = +el.getAttribute("data-ip-hotspot");
      const h = ip.hotspots[hi];
      const alreadyRead = readSet.has(h.id);
      openModal(`
        <h3>${escapeHtml(h.title || "Untitled")}</h3>
        <p class="sub" style="white-space:pre-wrap;">${escapeHtml(h.body || "")}</p>
        <div class="modal-actions"><button class="btn primary" id="ip-hotspot-view-ok">Got it</button></div>
      `);
      document.getElementById("ip-hotspot-view-ok").addEventListener("click", async ()=>{
        closeModal();
        if(!alreadyRead){
          readSet.add(h.id);
          draw();
          await silentSave(()=> Promise.resolve(supabase.from("interactive_picture_progress").upsert({
            user_id: session.user.id, interactive_picture_id: ipId, read_hotspot_ids: Array.from(readSet), updated_at: new Date().toISOString()
          }, { onConflict: "user_id,interactive_picture_id" })).catch(()=>{}));
        }
      });
    }));
  }
  draw();
}

function normalizeInteractivePicEmbeds(root){
  root.querySelectorAll('.interactive-pic-embed[data-interactive-pic-id]').forEach(el=>{
    const ipId = el.getAttribute('data-interactive-pic-id');
    const ip = INTERACTIVE_PICTURES[ipId];
    if(!ip) return;
    if(el.getAttribute('data-ip-loading')) return; // fetch already in flight for this element
    const isEditable = !!el.closest('[contenteditable="true"]');
    const mode = isEditable ? 'edit' : 'play';
    if(el.getAttribute('data-ip-hydrated') === mode) return;

    if(ip.type === 'slideshow'){
      if(!ip.slides){
        el.setAttribute('data-ip-loading', '1');
        el.innerHTML = `<div style="padding:30px;text-align:center;color:var(--text-faint);font-family:var(--mono);font-size:12px;">Loading slideshow…</div>`;
        ensureInteractivePicSlides(ipId).then(()=>{
          el.removeAttribute('data-ip-loading');
          // Full render() needed — the Next/Start Quiz gate was evaluated
          // before slides (fetched lazily) had loaded, and nothing else
          // re-checks it once they finish, so the button would stay stuck.
          if(view === "lesson") render(); else normalizeInteractivePicEmbeds(root);
        });
        return;

async function navigateToSiteLink(linkEl){
  const type = linkEl.getAttribute("data-link-type");
  if(type === "module" || type === "lesson"){
    const modId = linkEl.getAttribute("data-link-mod");
    const m = modById(modId);
    if(!m){ alert("That module isn't available — it may have been removed, or belongs to a department you don't have access to."); return; }
    if(!teamHasDeptAccess(m, activeDepartment)){
      // Only switch if the current tab doesn't already show this module —
      // and pick one the viewer actually has access to, since a shared
      // module's other department(s) might not be visible to them at all.
      const targetDept = DEPARTMENTS.find(dep=> teamHasDeptAccess(m, dep.id) && myDepartments().includes(dep.id));
      if(targetDept) activeDepartment = targetDept.id;
    }
    currentModId = modId;
    currentLessonIdx = type === "lesson" ? (+linkEl.getAttribute("data-link-lesson") || 0) : 0;
    if(currentLessonIdx >= m.lessons.length) currentLessonIdx = 0; // stale link (that lesson's since been removed) — fall back rather than crash
    view = "lesson";

    await loadReference(); // may not have been fetched yet this session, since it's normally only loaded on opening the Reference Guide
    const page = REFERENCE_PAGES.find(p=>p.id===refId);
    if(!page){ alert("That reference page isn't available — it may have been removed or moved."); return; }
    refActiveDepartment = page.department;
    currentRefId = refId;
    refEditing = false;
    view = "reference";
    render();
  }
}

function normalizePastedImages(editorEl){
  const rawImgs = Array.from(editorEl.querySelectorAll("img")).filter(img =>
    !img.closest(".rte-img-wrap") && !img.classList.contains("brand-mark") && !img.closest("header.top")
  );
  rawImgs.forEach(img=>{
    const wrap = document.createElement("span");
    wrap.className = "rte-img-wrap";
    wrap.setAttribute("contenteditable", "false");
    wrap.setAttribute("draggable", "true");
    const sizeToImage = ()=>{
      const w = img.naturalWidth || img.width || 280;
      const h = img.naturalHeight || img.height || 190;
      const maxW = 340, maxH = 260;
      const scale = Math.min(maxW/w, maxH/h, 1);
      setImageSize(img, Math.max(Math.round(w*scale), 80), Math.max(Math.round(h*scale), 60));
    };
    sizeToImage();
    if(!img.naturalWidth){
      // Image (often an external URL from the source page) hasn't finished loading yet —
      // resize the box once it does, instead of leaving it stuck at a fallback guess.
      img.addEventListener("load", sizeToImage, { once:true });
    }
    img.parentNode.insertBefore(wrap, img);
    img.removeAttribute("style");
    wrap.appendChild(img);
  });
  // Also re-check every already-wrapped image (covers legacy content that was sized
  // the old way, on the wrapper instead of the image) — this runs on every render,
  // so it self-heals in read-only views too, not just while actively editing.
  editorEl.querySelectorAll(".rte-img-wrap").forEach(fixImageSizing);
  // These live editing affordances should only ever exist inside an actively
  // editable .rte-body. If they show up anywhere else, it's leftover content
  // saved before this was fixed — strip it out so it can't be seen or used
  // (and, crucially, resized) in read-only views.
  editorEl.querySelectorAll(".rte-resize-handle, .rte-img-delete").forEach(el=>{
    if(!el.closest(".rte-body")) el.remove();
  });
}
function setImageSize(img, w, h){

function openImageLightbox(src){
  const wrap = document.createElement("div");
  wrap.className = "lightbox-overlay";
  wrap.innerHTML = `<button class="lightbox-close" title="Close">✕</button><img src="${src}" class="lightbox-img" draggable="false"><div class="lightbox-hint">Scroll or double-click to zoom · drag to pan</div>`;
  document.body.appendChild(wrap);
  const img = wrap.querySelector(".lightbox-img");

  let scale = 1, panX = 0, panY = 0, dragging = false, startX = 0, startY = 0;
  function applyTransform(){
    img.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    img.style.cursor = scale > 1 ? "grab" : "zoom-in";
  }

  function onWheel(e){
    e.preventDefault();
    const delta = e.deltaY < 0 ? 0.2 : -0.2;
    scale = Math.min(4, Math.max(1, scale + delta));
    if(scale === 1){ panX = 0; panY = 0; }
    applyTransform();
  }
  function onDblClick(){
    scale = scale > 1 ? 1 : 2.5;
    if(scale === 1){ panX = 0; panY = 0; }
    applyTransform();
  }
  function onMouseDown(e){
    if(scale <= 1) return;
    e.preventDefault();
    dragging = true; startX = e.clientX - panX; startY = e.clientY - panY;
    img.style.cursor = "grabbing";
  }
  function onMouseMove(e){
    if(!dragging) return;
    panX = e.clientX - startX; panY = e.clientY - startY;
    applyTransform();
  }
  function onMouseUp(){
    dragging = false;
    if(scale > 1) img.style.cursor = "grab";
  }

  img.addEventListener("wheel", onWheel, { passive:false });
  img.addEventListener("dblclick", onDblClick);
  img.addEventListener("mousedown", onMouseDown);
  window.addEventListener("mousemove", onMouseMove);
  window.addEventListener("mouseup", onMouseUp);

  const close = ()=>{
    window.removeEventListener("mousemove", onMouseMove);
    window.removeEventListener("mouseup", onMouseUp);
    document.removeEventListener("keydown", onKey);
    wrap.remove();
  };
  wrap.addEventListener("click", (e)=>{ if(e.target===wrap || e.target.classList.contains("lightbox-close")) close(); });
  const onKey = (e)=>{ if(e.key==="Escape") close(); };
  document.addEventListener("keydown", onKey);
}

function insertResizableImage(editorEl, dataUrl){

function compressImageFile(file, maxDim){
  // PNG (not JPEG) to avoid ringing artifacts on screenshot text. Uploads
  // to Storage and returns a URL instead of embedding base64 — base64 was
  // inflating the lessons table to ~17MB fetched on every login.
  maxDim = maxDim || 1800;
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=> resolve(null);
    reader.onload = (e)=>{
      const img = new Image();
      img.onerror = ()=> resolve(null);
      img.onload = async ()=>{
        let w = img.width, h = img.height;
        if(w > h && w > maxDim){ h = Math.round(h*maxDim/w); w = maxDim; }
        else if(h >= w && h > maxDim){ w = Math.round(w*maxDim/h); h = maxDim; }
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = "high";
        ctx.drawImage(img, 0, 0, w, h);
        canvas.toBlob(async (blob)=>{
          if(!blob){ alert("Couldn't process that image."); resolve(null); return; }
          const path = `img_${Date.now()}_${Math.random().toString(36).slice(2,8)}.png`;
          const { error } = await supabase.storage.from("lesson-images").upload(path, blob, { contentType:"image/png" });
          if(error){ alert("Couldn't upload image: " + error.message); resolve(null); return; }
          const { data } = supabase.storage.from("lesson-images").getPublicUrl(path);
          resolve(data.publicUrl);
        }, "image/png");
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function findAllOccurrences(text, query){
  const positions = [];
  if(!text || !query) return positions;
  const hay = text.toLowerCase(), needle = query.toLowerCase();
  let idx = hay.indexOf(needle);
  while(idx !== -1){
    positions.push(idx);
    idx = hay.indexOf(needle, idx + needle.length);
  }
  return positions;
}
function snippetAt(text, query, idx){
  const start = Math.max(0, idx-40);
  const end = Math.min(text.length, idx+query.length+60);
  const before = escapeHtml(text.slice(start, idx));
  const match = escapeHtml(text.slice(idx, idx+query.length));
  const after = escapeHtml(text.slice(idx+query.length, end));
  return `${start>0?'…':''}${before}<mark style="background:var(--amber-dim);color:var(--amber);">${match}</mark>${after}${end<text.length?'…':''}`;
}
// Finds the first occurrence of query inside containerSelector, scrolls it
// into view, and briefly highlights it — the highlight fades out on its
// own rather than needing to be dismissed.
function scrollToAndHighlightText(containerSelector, query){
  const container = document.querySelector(containerSelector);
  if(!container || !query) return;
  const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT);
  const needle = query.toLowerCase();
  let node;
  while((node = walker.nextNode())){
    const idx = node.nodeValue.toLowerCase().indexOf(needle);
    if(idx === -1) continue;
    const range = document.createRange();
    range.setStart(node, idx);
    range.setEnd(node, idx + query.length);
    const mark = document.createElement("mark");
    mark.className = "search-jump-highlight";
    try{ range.surroundContents(mark); } catch(e){ return; } // extremely unlikely for a plain text-node slice, but don't break the page if it happens
    mark.scrollIntoView({ behavior:"smooth", block:"center" });
    setTimeout(()=>{
      mark.classList.add("fade-out");
      setTimeout(()=>{
        const parent = mark.parentNode;
        if(!parent) return;
        while(mark.firstChild) parent.insertBefore(mark.firstChild, mark);
        parent.removeChild(mark);
        parent.normalize();
      }, 700); // matches the CSS transition duration below
    }, 2000);
    return;
  }
}
// Editors actively editing can search everything, including drafts and
// other departments' content — everyone else only searches what they'd
// actually be able to see on their own dashboard.
function searchableModules(){
  if(canEditContent() && editMode) return MODULES;
  const mine = myDepartments();
  return MODULES.filter(m=> m.isPublished && mine.some(d=> teamHasDeptAccess(m, d)));
}

let searchDrillModId = null; // null = showing the top-level module list
let searchDrillKey = null;   // null = showing the lesson/quiz list within searchDrillModId; set = showing instances within that lesson/quiz

// Every occurrence of the query, one entry per module+lesson (or
// module+quiz-question) so repeated hits in the same spot count as one
// group rather than a wall of near-duplicate rows.
function buildSearchGroups(q){
  const groups = [];
  function addOccurrences(modId, modTitle, label, text, source, lessonIdx, questionIdx){
    const positions = findAllOccurrences(text, q);
    if(!positions.length) return;
    const key = `${lessonIdx!==undefined?'L'+lessonIdx:'Q'+questionIdx}`;
    let group = groups.find(g=>g.modId===modId && g.key===key);
    if(!group){ group = { key, modId, modTitle, label, lessonIdx, questionIdx, instances: [] }; groups.push(group); }
    positions.forEach(pos=> group.instances.push({ source, snippet: snippetAt(text, q, pos) }));
  }
  searchableModules().forEach(m=>{
    m.lessons.forEach((l,li)=>{
      const label = `Lesson ${li+1}${l.title?' · '+l.title:''}`;
      if(l.title) addOccurrences(m.id, m.title, label, l.title, "title", li, undefined);
      const plainBody = stripHtml(l.body||"");
      if(plainBody) addOccurrences(m.id, m.title, label, plainBody, "body", li, undefined);
    });
    m.quiz.forEach((qq,qi)=>{
      if(qq.type==='simulation') return; // no searchable free text besides the prompt
      const hay = [qq.q, ...(qq.opts||[]), qq.explain||""].join(" ");
      addOccurrences(m.id, m.title, `Quiz Q${qi+1}`, hay, "quiz", undefined, qi);
    });
  });
  return groups;
}

function runContentSearch(query){
  const resultsEl = document.getElementById("content-search-results");
  if(!resultsEl) return;
  const q = query.trim();
  const queryChanged = lastContentSearchQuery !== query;
  lastContentSearchQuery = query;
  if(queryChanged){ searchDrillModId = null; searchDrillKey = null; } // typing a new query starts back at the top
  if(!q){ resultsEl.innerHTML = ""; return; }

  const groups = buildSearchGroups(q);

  // Level 3: instances within one specific lesson/quiz question.
  if(searchDrillModId && searchDrillKey){
    const g = groups.find(g=> g.modId===searchDrillModId && g.key===searchDrillKey);
    if(!g){ searchDrillKey = null; runContentSearch(query); return; }
    resultsEl.innerHTML = `
      <button class="mini-btn" data-search-back-lessons style="margin-bottom:10px;">← ${escapeHtml(g.modTitle)}</button>
      <div class="sub-card-head" style="margin-bottom:8px;"><span class="tag">${escapeHtml(g.label)}</span> <span style="color:var(--text-faint);font-size:12px;">${g.instances.length} match${g.instances.length===1?'':'es'}</span></div>
      ${g.instances.map((inst,i)=>`
        <div class="sub-card" data-search-instance="${i}" style="cursor:pointer;margin-bottom:8px;">
          <div class="sub-card-head"><span class="tag">${SEARCH_SOURCE_LABEL[inst.source]||""}</span></div>
          <div style="font-size:13px;color:var(--text-dim);">${inst.snippet}</div>
        </div>`).join("")}`;
    resultsEl.querySelector("[data-search-back-lessons]").addEventListener("click", ()=>{ searchDrillKey = null; runContentSearch(query); });
    resultsEl.querySelectorAll("[data-search-instance]").forEach(el=> el.addEventListener("click", (e)=>{
      const inst = g.instances[+e.currentTarget.getAttribute("data-search-instance")];
      closeModal();
      navigateToSearchResult(g, inst);
    }));
    return;
  }

  // Level 2: lessons/quiz questions with a match, within one module.
  if(searchDrillModId){
    const modGroups = groups.filter(g=> g.modId===searchDrillModId);
    const modTitle = modGroups[0] ? modGroups[0].modTitle : (modById(searchDrillModId)||{}).title || "";
    resultsEl.innerHTML = `
      <button class="mini-btn" data-search-back-modules style="margin-bottom:10px;">← All modules</button>
      ${modGroups.length ? modGroups.map((g,i)=>{
        const count = g.instances.length;
        const countBadge = count>1 ? ` <span style="color:var(--text-faint);font-size:12px;">(${count} matches)</span>` : "";
        const showPreview = showSearchPreview && count===1;
        return `
        <div class="sub-card" data-search-lesson="${i}" style="cursor:pointer;margin-bottom:8px;">
          <div class="sub-card-head"><span class="tag">${escapeHtml(g.label)}</span>${countBadge}</div>
          ${showPreview ? `<div style="font-size:13px;color:var(--text-dim);margin-top:4px;">${g.instances[0].snippet}</div>` : ""}
        </div>`;
      }).join("") : `<p style="color:var(--text-faint);font-size:13px;padding:10px 0;">No matches in "${escapeHtml(modTitle)}" anymore.</p>`}`;
    resultsEl.querySelector("[data-search-back-modules]").addEventListener("click", ()=>{ searchDrillModId = null; runContentSearch(query); });
    resultsEl.querySelectorAll("[data-search-lesson]").forEach(el=> el.addEventListener("click", (e)=>{
      searchDrillKey = modGroups[+e.currentTarget.getAttribute("data-search-lesson")].key;
      runContentSearch(query);
    }));
    return;
  }

  // Level 1: modules with any match at all.
  const byModule = [];
  groups.forEach(g=>{
    let entry = byModule.find(e=> e.modId===g.modId);
    if(!entry){ entry = { modId:g.modId, modTitle:g.modTitle, count:0 }; byModule.push(entry); }
    entry.count += g.instances.length;
  });
  resultsEl.innerHTML = byModule.length ? byModule.map((e,i)=>`
    <div class="sub-card" data-search-module="${i}" style="cursor:pointer;margin-bottom:8px;">
      <div class="sub-card-head"><span class="tag">${escapeHtml(e.modTitle)}</span> <span style="color:var(--text-faint);font-size:12px;">${e.count} match${e.count===1?'':'es'}</span></div>
    </div>`).join("") : `<p style="color:var(--text-faint);font-size:13px;padding:10px 0;">No matches.</p>`;
  resultsEl.querySelectorAll("[data-search-module]").forEach(el=> el.addEventListener("click", (e)=>{
    searchDrillModId = byModule[+e.currentTarget.getAttribute("data-search-module")].modId;
    runContentSearch(query);
  }));
}

// Takes someone to the match itself — the editor if they're actively
// editing content, or the normal lesson/module view otherwise, scrolling
// to and briefly highlighting the exact matched text when it's on a page
// that can show it directly (a lesson title or body).
function navigateToSearchResult(g, instance){
  if(canEditContent() && editMode){
    openEditor(g.modId, g.lessonIdx, g.questionIdx);
    return;
  }
  const m = modById(g.modId);
  if(!m) return;
  currentModId = g.modId;
  currentLessonIdx = (typeof g.lessonIdx === "number") ? g.lessonIdx : resumeLessonIdx(m);
  pendingSearchHighlight = (typeof g.lessonIdx === "number" && lastContentSearchQuery)
    ? { query: lastContentSearchQuery, source: (instance && instance.source) || "body" }
    : null;
  view = "lesson"; render();
  if(!pendingSearchHighlight) window.scrollTo(0,0); // quiz matches land on the module page with nothing specific to scroll to yet
}

const SEARCH_SOURCE_LABEL = { title:"Lesson title", body:"Lesson text", quiz:"Quiz text" };

async function openEditor(id, openToLessonIdx, openToQuestionIdx){
  if(id){
    editingExistingId = id;
    await ensureQuizSimScreens(modById(id));
    draftModule = JSON.parse(JSON.stringify(modById(id)));
    expandedLessonIdx = (typeof openToLessonIdx === "number" && draftModule.lessons[openToLessonIdx]) ? openToLessonIdx : null;
    expandedQuestionIdx = (typeof openToQuestionIdx === "number" && draftModule.quiz[openToQuestionIdx]) ? openToQuestionIdx : null;
    view = "editor"; render();
    return;
  }
  const title = await promptModal("New module", "Module title");
  if(!title) return;
  const newId = slugify(title.trim()) || ("module-" + Date.now());
  const activeDept = DEPARTMENTS.find(x=>x.id===currentActiveDepartment());
  const { error } = await supabase.from("modules").insert({ id:newId, title:title.trim(), short:"", led_color:"green", [activeDept.teamDbField]:true, sort_order: MODULES.length+1 });
  if(error){ alert("Couldn't create module: " + error.message); return; }
  logEdit("created", "module", title.trim(), null, currentActiveDepartment());
  await loadEverything();
  editingExistingId = newId;
  draftModule = JSON.parse(JSON.stringify(modById(newId)));
  expandedLessonIdx = null; expandedQuestionIdx = null;
  view = "editor"; render();
  if(isAdmin()) openNewModuleNotifyModal(title.trim());
}

function renderEditor(){

  const lessonsHtml = d.lessons.map((l,i)=>{
    if(i === expandedLessonIdx){
      return `<div class="sub-card"><div class="sub-card-head"><span class="tag">LESSON ${i+1} · EDITING</span>

        <div class="field"><label>Label</label><input type="text" data-lesson-label="${i}" value="${escapeHtml(l.label)}"></div>
        <div class="field"><label>Title</label><input type="text" data-lesson-title="${i}" value="${escapeHtml(l.title)}"></div>
        <div class="field"><label>Body</label>${richEditorHtml(`lesson-rte-${i}`, l.body)}<div class="hint">Paste an image directly, or use the 🖼 button. Drag an image's corner to resize it.</div></div>
        <div class="nav-buttons"><div></div><button class="btn primary" data-lesson-done="${i}">Done</button></div>
      </div>`;
    }

      <div class="mini-tools">

        <button class="mini-btn danger" data-lesson-del="${i}">Delete</button>

  const quizHtml = d.quiz.map((q,i)=>{
    if(i === expandedQuestionIdx){
      const typeSelectHtml = `<div class="field"><label>Question type</label>
        <select data-q-type="${i}">
          <option value="multiple_choice" ${q.type!=='simulation'?'selected':''}>Multiple choice</option>
          <option value="simulation" ${q.type==='simulation'?'selected':''}>Simulated Navigation</option>
        </select></div>`;
      const bodyHtml = q.type === 'simulation' ? renderSimBuilder(q, i) : (()=>{
        const optsHtml = q.opts.map((opt,oi)=>`<div class="opt-row"><input type="radio" name="correct-${i}" data-q-correct="${i}" value="${oi}" ${q.correct===oi?'checked':''}>
          <input type="text" data-q-opt="${i}:${oi}" value="${escapeHtml(opt)}"><button class="mini-btn danger" data-q-opt-del="${i}:${oi}" ${q.opts.length<=2?'disabled':''}>✕</button></div>`).join("");
        return `<div class="field"><label>Options (select correct)</label>${optsHtml}<button class="mini-btn" data-q-opt-add="${i}" style="margin-top:4px;">+ Add option</button></div>
        <div class="field"><label>Explanation</label><textarea data-q-explain="${i}" style="min-height:55px;">${escapeHtml(q.explain)}</textarea></div>`;
      })();
      return `<div class="sub-card"><div class="sub-card-head"><span class="tag">QUESTION ${i+1} · EDITING</span>
        <div style="display:flex;align-items:center;gap:10px;"><span id="q-save-status-${i}" style="font-size:11px;color:var(--text-faint);font-family:var(--mono);"></span><button class="mini-btn danger" data-q-del="${i}">Delete</button></div></div>
        ${typeSelectHtml}
        <div class="field"><label>${q.type==='simulation'?'Instruction (e.g. "What do you click to access this page?")':'Question'}</label><textarea data-q-text="${i}" style="min-height:55px;">${escapeHtml(q.q)}</textarea></div>
        ${bodyHtml}
        <div class="nav-buttons"><div></div><button class="btn primary" data-q-done="${i}">Done</button></div>
      </div>`;
    }
    const typeTag = q.type==='simulation' ? ' · SIMULATION' : '';
    return `<div class="sub-card" data-q-drag="${i}" draggable="true"><div class="sub-card-head"><span class="tag"><span class="drag-handle" title="Drag to reorder">⠿</span> QUESTION ${i+1}${typeTag}${q.q?' · '+escapeHtml(q.q.slice(0,50))+(q.q.length>50?'…':''):''}</span>
      <div class="mini-tools">
        <button class="mini-btn" data-q-edit="${i}">Edit</button>
        <button class="mini-btn danger" data-q-del="${i}">Delete</button>
      </div></div>
    </div>`;
  }).join("");

  renderShell(`
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <div class="k-label">${editingExistingId?"EDITING MODULE":"NEW MODULE"}</div>
        <span id="mod-save-status" style="font-size:11px;color:var(--text-faint);font-family:var(--mono);"></span>
      </div>
      <div class="field"><label>Module title</label><input type="text" id="mod-title" value="${escapeHtml(d.title)}"></div>
      <div class="field"><label>Department</label>
        ${myDepartments().length>1 ? `
        ${DEPARTMENTS.filter(dep=>myDepartments().includes(dep.id)).map(dep=>`<label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text);margin-bottom:6px;"><input type="checkbox" data-mod-dept-check="${dep.id}" ${d[dep.teamField]?'checked':''}> ${escapeHtml(dep.label)}</label>`).join("")}
        <p class="hint">Visible to anyone with access to any checked department.</p>
        ` : `<p style="color:var(--text-dim);font-size:13px;margin:0;">${deptLabel(myDepartments()[0])} — you only have access to one department, so this can't be changed here.</p>`}
      </div>
      <div class="field">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:400;"><input type="checkbox" id="mod-published" ${d.isPublished?'checked':''}> Published — visible to everyone with department access</label>
        <p class="hint">Unchecked, this module is only visible to editors, admins, and supervisors — trainees won't see it at all until you check this.</p>
      </div>
      <div class="field"><label>Short description</label><textarea id="mod-short" style="min-height:55px;">${escapeHtml(d.short)}</textarea></div>
      <div class="field">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:400;"><input type="checkbox" id="mod-popup-enabled" ${d.popupEnabled?'checked':''}> Show a popup when someone starts this module</label>
      </div>
      ${d.popupEnabled ? `
      <div class="field"><label>Popup title</label><input type="text" id="mod-popup-title" value="${escapeHtml(d.popupTitle||'')}" placeholder="e.g. Heads up"></div>
      <div class="field"><label>Popup message</label><textarea id="mod-popup-body" style="min-height:70px;" placeholder="What should they see before starting this module?">${escapeHtml(d.popupBody||'')}</textarea></div>
      ` : ''}
      <div class="editor-section"><div class="editor-section-head"><h3>Lessons</h3></div>${lessonsHtml||'<p style="color:var(--text-faint);font-size:13px;">No lessons yet.</p>'}<button class="dashed-btn" id="add-lesson">+ Add lesson</button></div>
      <div class="editor-section"><div class="editor-section-head"><h3>Quiz questions</h3></div>${quizHtml||'<p style="color:var(--text-faint);font-size:13px;">No questions yet.</p>'}<button class="dashed-btn" id="add-question">+ Add question</button></div>
      <div class="nav-buttons"><div style="display:flex;gap:10px;"><button class="btn danger" id="editor-delete">Delete module</button></div>
      <button class="btn primary" id="editor-done">Done</button></div>
      <p style="color:var(--text-faint);font-size:11.5px;font-family:var(--mono);margin-top:10px;">Changes save automatically as you type.</p>
    </div>`);
  wireEditorEvents();
}

let modAutosaveTimer = null;
let lessonAutosaveTimers = {};
let quizAutosaveTimers = {};

function wireEditorEvents(){
  const d = draftModule;

  function scheduleModAutosave(){
    const statusEl = document.getElementById("mod-save-status");
    if(statusEl){ statusEl.textContent = "Saving…"; statusEl.style.color = "var(--text-faint)"; }
    clearTimeout(modAutosaveTimer);
    window.pendingAutosaveKeys.add("mod:"+editingExistingId);
    modAutosaveTimer = setTimeout(async ()=>{
      const { error } = await silentSave(()=> supabase.from("modules").update({ title:d.title, short:d.short, access_ts:d.accessTs, access_cs:d.accessCs, access_testboard:d.accessTestboard, is_published:d.isPublished, popup_enabled:d.popupEnabled, popup_title:d.popupTitle, popup_body:d.popupBody }).eq("id", editingExistingId));
      window.pendingAutosaveKeys.delete("mod:"+editingExistingId);
      const el = document.getElementById("mod-save-status");
      if(el){
        if(error){ el.textContent = "Couldn't save: " + error.message; el.style.color = "var(--red)"; }
        else { el.textContent = "Saved"; el.style.color = "var(--green)"; }
      }
    }, 600);
  }
  document.getElementById("mod-title").addEventListener("input", e=>{ d.title=e.target.value; scheduleModAutosave(); });
  root.querySelectorAll("[data-mod-dept-check]").forEach(el=> el.addEventListener("change", (e)=>{
    const dep = DEPARTMENTS.find(x=>x.id===el.getAttribute("data-mod-dept-check"));
    if(!dep) return;
    if(!e.target.checked && [d.accessTs, d.accessCs, d.accessTestboard].filter(Boolean).length<=1){
      e.target.checked = true; // block leaving zero departments checked, rather than letting a save fail against the database's own at-least-one constraint
      alert("A module needs at least one department checked.");
      return;
    }
    d[dep.teamField] = e.target.checked;
    scheduleModAutosave();
  }));
  document.getElementById("mod-short").addEventListener("input", e=>{ d.short=e.target.value; scheduleModAutosave(); });
  document.getElementById("mod-published").addEventListener("change", e=>{ d.isPublished=e.target.checked; scheduleModAutosave(); });
  document.getElementById("mod-popup-enabled").addEventListener("change", e=>{ d.popupEnabled=e.target.checked; scheduleModAutosave(); renderEditor(); });
  const popupTitleEl = document.getElementById("mod-popup-title");
  if(popupTitleEl) popupTitleEl.addEventListener("input", e=>{ d.popupTitle=e.target.value; scheduleModAutosave(); });
  const popupBodyEl = document.getElementById("mod-popup-body");
  if(popupBodyEl) popupBodyEl.addEventListener("input", e=>{ d.popupBody=e.target.value; scheduleModAutosave(); });

  function scheduleLessonAutosave(i){
    const l = d.lessons[i];
    const statusEl = document.getElementById(`lesson-save-status-${i}`);
    if(statusEl){ statusEl.textContent = "Saving…"; statusEl.style.color = "var(--text-faint)"; }
    clearTimeout(lessonAutosaveTimers[l.id]);
    window.pendingAutosaveKeys.add("lesson:"+l.id);
    lessonAutosaveTimers[l.id] = setTimeout(async ()=>{
      const { error } = await silentSave(()=> supabase.from("lessons").update({ label:l.label, title:l.title, body:l.body }).eq("id", l.id));
      window.pendingAutosaveKeys.delete("lesson:"+l.id);
      const el = document.getElementById(`lesson-save-status-${i}`);
      if(el){
        if(error){ el.textContent = "Couldn't save: " + error.message; el.style.color = "var(--red)"; }
        else { el.textContent = "Saved"; el.style.color = "var(--green)"; }
      }
    }, 600);
  }
  root.querySelectorAll("[data-lesson-label]").forEach(el=> el.addEventListener("input", e=>{ const i=+el.dataset.lessonLabel; d.lessons[i].label=e.target.value; scheduleLessonAutosave(i); }));
  root.querySelectorAll("[data-lesson-title]").forEach(el=> el.addEventListener("input", e=>{ const i=+el.dataset.lessonTitle; d.lessons[i].title=e.target.value; scheduleLessonAutosave(i); }));
  if(expandedLessonIdx !== null){
    wireRichEditor(`lesson-rte-${expandedLessonIdx}`);
    const rteEl = document.getElementById(`lesson-rte-${expandedLessonIdx}`);
    if(rteEl) rteEl.addEventListener("input", ()=>{ d.lessons[expandedLessonIdx].body = getCleanEditorHtml(rteEl); scheduleLessonAutosave(expandedLessonIdx); });
  }
  let dragOverEl = null;
  let dragLessonIdx = null;
  root.querySelectorAll("[data-lesson-drag]").forEach(el=>{
    el.addEventListener("dragstart", (e)=>{ dragLessonIdx = +el.getAttribute("data-lesson-drag"); e.dataTransfer.effectAllowed = "move"; el.style.opacity = "0.4"; startDragAutoScroll(); });
    el.addEventListener("dragend", ()=>{
      el.style.opacity = "";
      stopDragAutoScroll();
      if(dragOverEl){ dragOverEl.classList.remove("drag-over-top","drag-over-bottom"); dragOverEl = null; }
    });
    el.addEventListener("dragover", (e)=>{
      e.preventDefault();
      const rect = el.getBoundingClientRect();
      const pos = (e.clientY - rect.top) < rect.height/2 ? "before" : "after";
      if(dragOverEl && dragOverEl!==el) dragOverEl.classList.remove("drag-over-top","drag-over-bottom");
      dragOverEl = el;
      el.classList.toggle("drag-over-top", pos==="before");
      el.classList.toggle("drag-over-bottom", pos==="after");
    });
    el.addEventListener("dragleave", ()=>{ el.classList.remove("drag-over-top","drag-over-bottom"); });
    el.addEventListener("drop", async (e)=>{
      e.preventDefault();
      const pos = el.classList.contains("drag-over-top") ? "before" : "after";
      el.classList.remove("drag-over-top","drag-over-bottom");
      let toIdx = +el.getAttribute("data-lesson-drag");
      if(dragLessonIdx===null || dragLessonIdx===toIdx){ dragLessonIdx=null; return; }
      if(pos==="after") toIdx++;
      const dragged = d.lessons[dragLessonIdx];
      const reordered = d.lessons.slice();
      reordered.splice(dragLessonIdx,1);
      if(dragLessonIdx < toIdx) toIdx--;
      reordered.splice(toIdx,0,dragged);
      d.lessons = reordered;
      dragLessonIdx = null;
      renderEditor();
      for(let i=0;i<d.lessons.length;i++){
        await supabase.from("lessons").update({ sort_order:i }).eq("id", d.lessons[i].id);
      }
    });
  });
  root.querySelectorAll("[data-lesson-del]").forEach(el=> el.addEventListener("click", async ()=>{
    const i=+el.dataset.lessonDel;
    if(!confirm("Delete this lesson?")) return;
    const { error } = await supabase.from("lessons").delete().eq("id", d.lessons[i].id);
    if(error){ alert("Couldn't delete: " + error.message); return; }
    logEdit("deleted", "lesson", `${d.title} — ${d.lessons[i].title}`, null, primaryDeptOf(d));
    d.lessons.splice(i,1);
    if(expandedLessonIdx===i) expandedLessonIdx=null;
    renderEditor();
  }));
  root.querySelectorAll("[data-lesson-edit]").forEach(el=> el.addEventListener("click", ()=>{
    expandedLessonIdx = +el.dataset.lessonEdit; renderEditor();
  }));
  root.querySelectorAll("[data-lesson-done]").forEach(el=> el.addEventListener("click", ()=>{
    const i = +el.dataset.lessonDone;
    logEdit("updated", "lesson", `${d.title} — ${d.lessons[i].title}`);
    expandedLessonIdx = null; renderEditor();
  }));
  document.getElementById("add-lesson").addEventListener("click", async ()=>{
    const blank = blankLesson();
    const { data, error } = await supabase.from("lessons").insert({ module_id: editingExistingId, sort_order: d.lessons.length, label: blank.label, title: blank.title, body: blank.body }).select().single();
    if(error){ alert("Couldn't add lesson: " + error.message); return; }
    logEdit("created", "lesson", `${d.title} — ${blank.title}`, null, primaryDeptOf(d));
    d.lessons.push({ id:data.id, label:data.label, title:data.title, body:data.body });
    expandedLessonIdx = d.lessons.length-1;
    renderEditor();
  });

  function scheduleQuizAutosave(i){
    const q = d.quiz[i];
    const statusEl = document.getElementById(`q-save-status-${i}`);
    if(statusEl){ statusEl.textContent = "Saving…"; statusEl.style.color = "var(--text-faint)"; }
    clearTimeout(quizAutosaveTimers[q.id]);
    window.pendingAutosaveKeys.add("modquestion:"+q.id);
    quizAutosaveTimers[q.id] = setTimeout(async ()=>{
      const { error } = await silentSave(()=> supabase.from("quiz_questions").update({ question:q.q, options:q.opts, correct_index:q.correct, explanation:q.explain, question_type:q.type, sim_screens:q.simScreens, end_goal:q.endGoal, final_screen_id:q.finalScreenId }).eq("id", q.id));
      window.pendingAutosaveKeys.delete("modquestion:"+q.id);
      const el = document.getElementById(`q-save-status-${i}`);
      if(el){
        if(error){ el.textContent = "Couldn't save: " + error.message; el.style.color = "var(--red)"; }
        else { el.textContent = "Saved"; el.style.color = "var(--green)"; }
      }
    }, 600);
  }
  scheduleQuizAutosaveGlobal = scheduleQuizAutosave;
  root.querySelectorAll("[data-q-type]").forEach(el=> el.addEventListener("change", e=>{
    const i=+el.dataset.qType; d.quiz[i].type=e.target.value;
    if(d.quiz[i].type==='simulation' && !d.quiz[i].simScreens) d.quiz[i].simScreens=[];
    scheduleQuizAutosave(i); renderEditor();
  }));
  root.querySelectorAll("[data-q-endgoal]").forEach(el=> el.addEventListener("change", e=>{
    const i=+el.dataset.qEndgoal; d.quiz[i].endGoal=e.target.value;
    if(e.target.value==='button') d.quiz[i].finalScreenId=null;
    scheduleQuizAutosave(i); renderEditor();
  }));
  root.querySelectorAll("[data-q-finalscreen]").forEach(el=> el.addEventListener("change", e=>{
    const i=+el.dataset.qFinalscreen; d.quiz[i].finalScreenId=e.target.value||null;
    scheduleQuizAutosave(i); renderEditor();
  }));
  root.querySelectorAll("[data-sim-add-screen]").forEach(el=> el.addEventListener("click", ()=>{
    const qi=+el.dataset.simAddScreen;
    d.quiz[qi].simScreens.push({ id:'scr'+Date.now()+Math.random().toString(36).slice(2,7), image:null, zones:[] });
    scheduleQuizAutosave(qi); renderEditor();
  }));
  root.querySelectorAll("[data-sim-fullscreen]").forEach(el=> el.addEventListener("click", ()=>{
    const [qi,si]=el.dataset.simFullscreen.split(":").map(Number);
    openSimEditFullscreen(qi, si);
  }));
  root.querySelectorAll("[data-sim-screen-del]").forEach(el=> el.addEventListener("click", ()=>{
    const [qi,si]=el.dataset.simScreenDel.split(":").map(Number);
    const removedId = d.quiz[qi].simScreens[si].id;
    d.quiz[qi].simScreens.splice(si,1);
    // Any zone that pointed at the removed screen now just completes the simulation instead.
    d.quiz[qi].simScreens.forEach(scr=> (scr.zones||[]).forEach(z=>{ if(z.targetScreenId===removedId) z.targetScreenId=null; }));
    scheduleQuizAutosave(qi); renderEditor();
  }));
  root.querySelectorAll("[data-sim-upload]").forEach(el=> el.addEventListener("change", async ()=>{
    const file = el.files[0]; if(!file) return;
    const [qi,si]=el.dataset.simUpload.split(":").map(Number);
    const dataUrl = await compressImageFile(file);
    if(!dataUrl) return; // compressImageFile already alerted the user — don't overwrite any existing screenshot with a failed upload
    d.quiz[qi].simScreens[si].image = dataUrl;
    scheduleQuizAutosave(qi); renderEditor();
  }));
  root.querySelectorAll("[data-sim-zone-del]").forEach(el=> el.addEventListener("click", (e)=>{
    e.stopPropagation();
    const [qi,si,zi]=el.dataset.simZoneDel.split(":").map(Number);
    d.quiz[qi].simScreens[si].zones.splice(zi,1);
    scheduleQuizAutosave(qi); renderEditor();
  }));
  root.querySelectorAll("[data-sim-zone]").forEach(el=> el.addEventListener("click", (e)=>{
    if(e.target.closest("[data-sim-zone-del]")) return;
    const [qi,si,zi]=el.getAttribute("data-sim-zone").split(":").map(Number);
    const zone = d.quiz[qi].simScreens[si].zones[zi];
    if(zone && zone.isFake) return; // nothing to configure on a fake zone besides deleting it
    openSimZoneTargetModal(d, qi, si, zi, ()=>{ scheduleQuizAutosave(qi); renderEditor(); });
  }));
  root.querySelectorAll("[data-sim-canvas]").forEach(canvas=>{
    const [qi,si] = canvas.getAttribute("data-sim-canvas").split(":").map(Number);
    canvas.addEventListener("contextmenu", (e)=> e.preventDefault()); // suppress the native right-click menu — right-click-drag here means "draw a fake button" instead
    canvas.addEventListener("mousedown", (e)=>{
      if(e.target.closest(".sim-zone")) return; // clicking an existing zone, not drawing a new one
      if(e.button!==0 && e.button!==2) return;
      const isFake = e.button===2;
      const rect = canvas.getBoundingClientRect();
      const previewEl = document.createElement("div");
      previewEl.style.cssText = `position:absolute;border:2px solid ${isFake?'var(--red)':'var(--green)'};background:${isFake?'#e74c3c33':'#2ecc7133'};pointer-events:none;`;
      canvas.appendChild(previewEl);
      _simZoneDrawing = { qi, si, rect, startX:e.clientX, startY:e.clientY, previewEl, draftModule:d, isFake,
        onZoneAdded: (newIdx)=>{
          renderEditor();
          if(!isFake) openSimZoneTargetModal(d, qi, si, newIdx, ()=>{ scheduleQuizAutosave(qi); renderEditor(); });
        } };
      e.preventDefault();
    });
  });
  root.querySelectorAll("[data-q-text]").forEach(el=> el.addEventListener("input", e=>{ const i=+el.dataset.qText; d.quiz[i].q=e.target.value; scheduleQuizAutosave(i); }));
  root.querySelectorAll("[data-q-explain]").forEach(el=> el.addEventListener("input", e=>{ const i=+el.dataset.qExplain; d.quiz[i].explain=e.target.value; scheduleQuizAutosave(i); }));
  root.querySelectorAll("[data-q-opt]").forEach(el=> el.addEventListener("input", e=>{ const [qi,oi]=el.dataset.qOpt.split(":").map(Number); d.quiz[qi].opts[oi]=e.target.value; scheduleQuizAutosave(qi); }));
  root.querySelectorAll("[data-q-correct]").forEach(el=> el.addEventListener("change", e=>{ const qi=+el.dataset.qCorrect; d.quiz[qi].correct=+e.target.value; scheduleQuizAutosave(qi); }));
  root.querySelectorAll("[data-q-opt-add]").forEach(el=> el.addEventListener("click", ()=>{ const qi=+el.dataset.qOptAdd; d.quiz[qi].opts.push("New option"); scheduleQuizAutosave(qi); renderEditor(); }));
  root.querySelectorAll("[data-q-opt-del]").forEach(el=> el.addEventListener("click", ()=>{
    const [qi,oi]=el.dataset.qOptDel.split(":").map(Number); if(d.quiz[qi].opts.length<=2) return;
    d.quiz[qi].opts.splice(oi,1); if(d.quiz[qi].correct===oi) d.quiz[qi].correct=0; else if(d.quiz[qi].correct>oi) d.quiz[qi].correct-=1;
    scheduleQuizAutosave(qi); renderEditor();
  }));
  let dragQuestionIdx = null;
  root.querySelectorAll("[data-q-drag]").forEach(el=>{
    el.addEventListener("dragstart", (e)=>{ dragQuestionIdx = +el.getAttribute("data-q-drag"); e.dataTransfer.effectAllowed = "move"; el.style.opacity = "0.4"; startDragAutoScroll(); });
    el.addEventListener("dragend", ()=>{
      el.style.opacity = "";
      stopDragAutoScroll();
      if(dragOverEl){ dragOverEl.classList.remove("drag-over-top","drag-over-bottom"); dragOverEl = null; }
    });
    el.addEventListener("dragover", (e)=>{
      e.preventDefault();
      const rect = el.getBoundingClientRect();
      const pos = (e.clientY - rect.top) < rect.height/2 ? "before" : "after";
      if(dragOverEl && dragOverEl!==el) dragOverEl.classList.remove("drag-over-top","drag-over-bottom");
      dragOverEl = el;
      el.classList.toggle("drag-over-top", pos==="before");
      el.classList.toggle("drag-over-bottom", pos==="after");
    });
    el.addEventListener("dragleave", ()=>{ el.classList.remove("drag-over-top","drag-over-bottom"); });
    el.addEventListener("drop", async (e)=>{
      e.preventDefault();
      const pos = el.classList.contains("drag-over-top") ? "before" : "after";
      el.classList.remove("drag-over-top","drag-over-bottom");
      let toIdx = +el.getAttribute("data-q-drag");
      if(dragQuestionIdx===null || dragQuestionIdx===toIdx){ dragQuestionIdx=null; return; }
      if(pos==="after") toIdx++;
      const dragged = d.quiz[dragQuestionIdx];
      const reordered = d.quiz.slice();
      reordered.splice(dragQuestionIdx,1);
      if(dragQuestionIdx < toIdx) toIdx--;
      reordered.splice(toIdx,0,dragged);
      d.quiz = reordered;
      dragQuestionIdx = null;
      renderEditor();
      for(let i=0;i<d.quiz.length;i++){
        await supabase.from("quiz_questions").update({ sort_order:i }).eq("id", d.quiz[i].id);
      }
    });
  });
  root.querySelectorAll("[data-q-del]").forEach(el=> el.addEventListener("click", async ()=>{
    const i=+el.dataset.qDel;
    if(!confirm("Delete this question?")) return;
    const { error } = await supabase.from("quiz_questions").delete().eq("id", d.quiz[i].id);
    if(error){ alert("Couldn't delete: " + error.message); return; }
    logEdit("deleted", "module_quiz_question", `${d.title} — ${d.quiz[i].q}`, null, primaryDeptOf(d));
    d.quiz.splice(i,1);
    if(expandedQuestionIdx===i) expandedQuestionIdx=null;
    renderEditor();
  }));
  root.querySelectorAll("[data-q-edit]").forEach(el=> el.addEventListener("click", ()=>{
    expandedQuestionIdx = +el.dataset.qEdit; renderEditor();
  }));
  root.querySelectorAll("[data-q-done]").forEach(el=> el.addEventListener("click", ()=>{
    const i = +el.dataset.qDone;
    logEdit("updated", "module_quiz_question", `${d.title} — ${d.quiz[i].q}`);
    expandedQuestionIdx = null; renderEditor();
  }));
  document.getElementById("add-question").addEventListener("click", async ()=>{
    const blank = blankQuestion();
    const { data, error } = await supabase.from("quiz_questions").insert({ module_id: editingExistingId, sort_order: d.quiz.length, question: blank.q, options: blank.opts, correct_index: blank.correct, explanation: blank.explain, question_type: blank.type, sim_screens: blank.simScreens }).select().single();
    if(error){ alert("Couldn't add question: " + error.message); return; }
    logEdit("created", "module_quiz_question", `${d.title} — ${blank.q}`, null, primaryDeptOf(d));
    d.quiz.push({ id:data.id, q:data.question, opts:data.options, correct:data.correct_index, explain:data.explanation, type:data.question_type||'multiple_choice', simScreens:data.sim_screens||[] });
    expandedQuestionIdx = d.quiz.length-1;
    renderEditor();
  });

  document.getElementById("editor-done").addEventListener("click", async ()=>{
    await loadEverything();
    currentModId = editingExistingId; currentLessonIdx = 0;
    const freshMod = modById(editingExistingId);
    view = (freshMod && freshMod.lessons.length) ? "lesson" : "dashboard";
    render();
  });

  document.getElementById("editor-delete").addEventListener("click", async ()=>{
    if(confirm(`Delete "${d.title||'this module'}"? This can't be undone.`)){
      await supabase.from("modules").delete().eq("id", editingExistingId);
      logEdit("deleted", "module", d.title, null, primaryDeptOf(d));
      await loadEverything(); view="dashboard"; render();
    }
  });
}
