const root = document.getElementById("app");
function escapeHtml(s){ const d=document.createElement("div"); d.textContent=s==null?"":s; return d.innerHTML; }
function modById(id){ return MODULES.find(m=>m.id===id); }
function pct(s){ return s && s.total ? Math.round((s.best/s.total)*100) : 0; }
function overallPct(m){
  const s = progressMap[m.id];
  const totalLessons = m.lessons.length || 1;
  const viewedCount = s && s.lessonsViewed ? s.lessonsViewed.length : 0;
  const lessonFraction = Math.min(viewedCount / totalLessons, 1);
  const quizFraction = s && m.quiz.length ? (s.best||0) / m.quiz.length : 0;
  return Math.round((lessonFraction*0.5 + quizFraction*0.5) * 100);
}
async function markLessonViewed(m, lessonId){
  const existing = progressMap[m.id] || { best:0, total:m.quiz.length, lastScore:0, attempts:0, lessonsViewed:[] };
  if(!existing.lessonsViewed) existing.lessonsViewed = [];
  if(existing.lessonsViewed.includes(lessonId)) return; // already recorded, skip the write
  existing.lessonsViewed = [...existing.lessonsViewed, lessonId];
  progressMap[m.id] = existing;
  await supabase.from("progress").upsert({
    user_id: session.user.id, module_id: m.id,
    best_score: existing.best, total: m.quiz.length, last_score: existing.lastScore, attempts: existing.attempts,
    lessons_viewed: existing.lessonsViewed, updated_at: new Date().toISOString()
  }, { onConflict: "user_id,module_id" });
}
let editMode = false;
function isAdmin(){ return profile && profile.role === "admin"; }
function canEdit(){ return isAdmin() && editMode; }

/* ============================================================
   DATA LOADING
   ============================================================ */
async function loadEverything(){
  const { data: mods } = await supabase.from("modules").select("*").order("sort_order");
  const { data: lessons } = await supabase.from("lessons").select("*").order("sort_order");
  const { data: quiz } = await supabase.from("quiz_questions").select("*").order("sort_order");
  MODULES = (mods||[]).map(m=>({
    id:m.id, title:m.title, short:m.short, ledColor:m.led_color,
    lessons:(lessons||[]).filter(l=>l.module_id===m.id).map(l=>({id:l.id,label:l.label,title:l.title,body:l.body})),
    quiz:(quiz||[]).filter(q=>q.module_id===m.id).map(q=>({id:q.id,q:q.question,opts:q.options,correct:q.correct_index,explain:q.explanation}))
  }));

  const { data: prog } = await supabase.from("progress").select("*").eq("user_id", session.user.id);
  progressMap = {};
  (prog||[]).forEach(p=>{ progressMap[p.module_id] = { best:p.best_score, total:p.total, lastScore:p.last_score, attempts:p.attempts, lessonsViewed:p.lessons_viewed||[] }; });
}

async function loadProfile(){
  const { data } = await supabase.from("profiles").select("*").eq("id", session.user.id).single();
  profile = data;
}

function renderAuth(){
  root.innerHTML = `
    <div class="auth-wrap">
      <div style="text-align:center;margin-bottom:26px;">
        <div class="brand-mark" style="margin:0 auto 12px;"><i></i><i></i><i></i></div>
        <div class="brand-text"><div class="name">COMPORIUM TRAINING MODULES</div><div class="tag">TIER 1 FIELD &amp; SIGNAL TRAINING</div></div>
      </div>
      <div class="card">
        <div class="auth-toggle">
          <button id="tab-login" class="${authMode==='login'?'active':''}">Log in</button>
          <button id="tab-signup" class="${authMode==='signup'?'active':''}">Sign up</button>
        </div>
        ${authError ? `<div class="error-msg">${escapeHtml(authError)}</div>` : ""}
        ${authInfo ? `<div class="info-msg">${escapeHtml(authInfo)}</div>` : ""}
        ${authMode==='signup' ? `<div class="field"><label>Your name</label><input type="text" id="auth-name" placeholder="Jordan Smith"></div>` : ""}
        <div class="field"><label>Email</label><input type="email" id="auth-email" placeholder="you@company.com"></div>
        <div class="field"><label>Password</label><input type="password" id="auth-password" placeholder="••••••••"></div>
        <button class="btn primary" id="auth-submit" style="width:100%;">${authMode==='login'?'Log in':'Create account'}</button>
      </div>
    </div>
  `;
  document.getElementById("tab-login").addEventListener("click", ()=>{ authMode="login"; authError=""; authInfo=""; renderAuth(); });
  document.getElementById("tab-signup").addEventListener("click", ()=>{ authMode="signup"; authError=""; authInfo=""; renderAuth(); });
  document.getElementById("auth-submit").addEventListener("click", submitAuth);
}

async function submitAuth(){
  authError=""; authInfo="";
  const email = document.getElementById("auth-email").value.trim();
  const password = document.getElementById("auth-password").value;
  if(!email || !password){ authError = "Enter an email and password."; renderAuth(); return; }

  if(authMode==="signup"){
    const name = document.getElementById("auth-name").value.trim();
    if(!name){ authError = "Enter your name."; renderAuth(); return; }
    const { data, error } = await supabase.auth.signUp({ email, password, options:{ data:{ name } } });
    if(error){ authError = error.message; renderAuth(); return; }
    if(data.session){
      session = data.session; await afterLogin();
    } else {
      authInfo = "Account created — check your email to confirm, then log in.";
      authMode = "login"; renderAuth();
    }
    return;
  }

  const { data, error } = await supabase.auth.signInWithPassword({ email, password });
  if(error){ authError = error.message; renderAuth(); return; }
  session = data.session;
  await afterLogin();
}

async function afterLogin(){
  view = "loading"; render();
  await loadProfile();
  await loadEverything();
  await loadNotifications();
  view = "home"; render();
}

async function logout(){
  await supabase.auth.signOut();
  session = null; profile = null; MODULES = []; progressMap = {};
  view = "auth"; authMode = "login"; render();
}

/* ============================================================
   DASHBOARD
   ============================================================ */
function resumeLessonIdx(m){
  const s = progressMap[m.id];
  const viewed = s && s.lessonsViewed ? s.lessonsViewed : [];
  const idx = m.lessons.findIndex(l=> !viewed.includes(l.id));
  return idx === -1 ? Math.max(m.lessons.length-1, 0) : idx;
}
function moduleStatus(id){ const s=progressMap[id]; if(!s) return "new"; if(s.best===s.total) return "mastered"; return "attempted"; }

function renderDashboard(){
  const cards = MODULES.map(m=>{
    const status = moduleStatus(m.id); const s = progressMap[m.id];
    const pillHtml = status==="mastered" ? `<span class="status-pill done">Mastered</span>`
      : status==="attempted" ? `<span class="status-pill progress">${s.best}/${s.total} correct</span>`
      : `<span class="status-pill">Not started</span>`;
    const on = status!=="new"; const mastered = status==="mastered";
    const leds = `<span class="led ${on?'on-green':''}"></span><span class="led ${on?(mastered?'on-green':'on-amber blink'):''}"></span><span class="led ${mastered?'on-green':''}"></span>`;
    const tools = canEdit() ? `<div class="card-tools"><button class="icon-btn" data-edit="${m.id}" title="Edit module">✎</button><button class="icon-btn danger" data-del="${m.id}" title="Delete module">✕</button></div>` : "";
    return `<div class="mod-card" data-mod="${m.id}">${tools}
      <div class="row-top"><div><h3>${escapeHtml(m.title)}</h3><p class="sub">${escapeHtml(m.short)}</p></div><div class="led-strip">${leds}</div></div>
      <div class="meta"><span>${m.lessons.length} LESSONS</span><span>${m.quiz.length} QUIZ Q's</span>${pillHtml}</div>
      <div class="progress-bar"><div style="width:${overallPct(m)}%"></div></div></div>`;
  }).join("");

  const addCard = canEdit() ? `<div class="add-mod-card" id="add-module">+ ADD MODULE</div>` : "";
  const totalQ = MODULES.reduce((a,m)=>a+m.quiz.length,0);
  const doneQ = Object.values(progressMap).reduce((a,s)=>a+(s.best||0),0);
  const modsMastered = MODULES.filter(m=>moduleStatus(m.id)==="mastered").length;

  renderShell(`
    <section class="hero">
      <div class="eyebrow">New Agent Onboarding</div>
      <h1>Before you take a call, learn to read the box.</h1>
      <p>Modules built from the tickets you'll actually see this week. Each ends in a scored quiz — your progress is saved to your account.</p>
      <div class="panel-row"><div class="stat"><div class="num">${modsMastered}/${MODULES.length}</div><div class="lbl">MODULES MASTERED</div></div>
      <div class="stat"><div class="num">${doneQ}/${totalQ}</div><div class="lbl">BEST-SCORE QUESTIONS CORRECT</div></div></div>
    </section>
    <div class="grid">${cards}${addCard}</div>
  `);

  root.querySelectorAll(".mod-card").forEach(el=> el.addEventListener("click",(e)=>{
    if(e.target.closest("[data-edit]")||e.target.closest("[data-del]")) return;
    const id = el.getAttribute("data-mod"); const m = modById(id);
    currentModId = id; currentLessonIdx = resumeLessonIdx(m); view="lesson"; render();
  }));
  root.querySelectorAll("[data-edit]").forEach(el=> el.addEventListener("click",(e)=>{ e.stopPropagation(); openEditor(el.getAttribute("data-edit")); }));
  root.querySelectorAll("[data-del]").forEach(el=> el.addEventListener("click", async (e)=>{
    e.stopPropagation(); const id = el.getAttribute("data-del"); const m = modById(id);
    if(confirm(`Delete "${m.title}"? This can't be undone.`)){
      await supabase.from("modules").delete().eq("id", id);
      await loadEverything(); render();
    }
  }));
  const addBtn = document.getElementById("add-module"); if(addBtn) addBtn.addEventListener("click", ()=>openEditor(null));
}

/* ============================================================
   LESSON / QUIZ / RESULTS
   ============================================================ */
function renderLesson(){
  const m = modById(currentModId); if(!m){ view="dashboard"; render(); return; }
  const lesson = m.lessons[currentLessonIdx];
  if(lesson.id) markLessonViewed(m, lesson.id);
  const tabs = m.lessons.map((l,i)=>`<button class="lesson-tab ${i===currentLessonIdx?'active':''}" data-idx="${i}">${i+1}. ${escapeHtml(l.title)}</button>`).join("");
  const isLast = currentLessonIdx === m.lessons.length-1;
  const editBtn = canEdit() ? `<button class="lesson-tab" id="edit-mod" style="border-color:var(--amber);color:var(--amber);">✎ Edit module</button>` : "";
  renderShell(`
    <div class="lesson-nav">${tabs}${editBtn}<button class="lesson-tab quiz" id="go-quiz">TAKE QUIZ →</button></div>
    <div class="card"><div class="k-label">${escapeHtml(lesson.label)}</div><h2>${escapeHtml(lesson.title)}</h2><div class="body">${lesson.body}</div>
      <div class="nav-buttons"><button class="btn" id="prev-lesson" ${currentLessonIdx===0?'disabled':''}>← Previous</button>
      ${isLast? `<button class="btn primary" id="to-quiz-btn">Start module quiz →</button>` : `<button class="btn primary" id="next-lesson">Next lesson →</button>`}</div>
      <div class="nav-buttons" style="margin-top:8px;"><div style="display:flex;gap:10px;"><button class="mini-btn" id="comment-lesson">💬 Comment</button><button class="mini-btn" id="highlight-lesson">✨ Highlight for admins</button></div><div></div></div>
    </div>`);
  root.querySelectorAll(".lesson-tab[data-idx]").forEach(el=> el.addEventListener("click", ()=>{ currentLessonIdx=parseInt(el.getAttribute("data-idx")); render(); }));
  document.getElementById("go-quiz").addEventListener("click", startQuiz);
  const prev=document.getElementById("prev-lesson"); if(prev) prev.addEventListener("click", ()=>{ if(currentLessonIdx>0){currentLessonIdx--; render();} });
  const next=document.getElementById("next-lesson"); if(next) next.addEventListener("click", ()=>{ currentLessonIdx++; render(); });
  const toQuiz=document.getElementById("to-quiz-btn"); if(toQuiz) toQuiz.addEventListener("click", startQuiz);
  const editMod=document.getElementById("edit-mod"); if(editMod) editMod.addEventListener("click", ()=>openEditor(m.id));
  document.getElementById("comment-lesson").addEventListener("click", ()=> sendToAdmins("comment", `${m.title} — ${lesson.title}`));
  document.getElementById("highlight-lesson").addEventListener("click", ()=> sendToAdmins("highlight", `${m.title} — ${lesson.title}`));
}

function startQuiz(){ const m=modById(currentModId); quizAnswers=new Array(m.quiz.length).fill(null); quizRevealed=new Array(m.quiz.length).fill(false); quizIdx=0; view="quiz"; render(); }

function renderQuiz(){
  const m = modById(currentModId); if(!m||!m.quiz.length){ view="lesson"; render(); return; }
  const q = m.quiz[quizIdx]; const revealed = quizRevealed[quizIdx]; const selected = quizAnswers[quizIdx];
  const opts = q.opts.map((opt,i)=>{ let cls="opt"; if(revealed){ cls+=" disabled"; if(i===q.correct) cls+=" correct"; else if(i===selected) cls+=" wrong"; } else if(i===selected){ cls+=" selected"; }
    return `<div class="${cls}" data-idx="${i}"><div class="dot"></div><span class="txt">${escapeHtml(opt)}</span></div>`; }).join("");
  const explain = revealed ? `<div class="explain"><strong>${selected===q.correct?'Correct.':'Not quite.'}</strong> ${escapeHtml(q.explain)}</div>` : "";
  const isLast = quizIdx === m.quiz.length-1;
  const editBtn = canEdit() ? `<button class="btn" id="edit-mod-q" style="border-color:var(--amber);color:var(--amber);">✎ Edit module</button>` : "";
  renderShell(`
    <div class="q-progress">MODULE QUIZ · ${escapeHtml(m.title.toUpperCase())} · QUESTION ${quizIdx+1} OF ${m.quiz.length}</div>
    <div class="card"><div class="q-block"><h3>${escapeHtml(q.q)}</h3>${opts}</div>${explain}
      <div class="nav-buttons"><div style="display:flex;gap:10px;"><button class="btn" id="quiz-prev" ${quizIdx===0?'disabled':''}>← Previous</button>${editBtn}</div>
      <button class="btn primary" id="quiz-next" ${selected===null?'disabled':''}>${isLast?(revealed?'See results →':'Check answer'):(revealed?'Next question →':'Check answer')}</button></div>
      <div class="nav-buttons" style="margin-top:8px;"><button class="mini-btn" id="flag-question">🚩 Flag this question</button><div></div></div>
    </div>`);
  if(!revealed) root.querySelectorAll(".opt").forEach(el=> el.addEventListener("click", ()=>{ quizAnswers[quizIdx]=parseInt(el.getAttribute("data-idx")); render(); }));
  document.getElementById("quiz-prev").addEventListener("click", ()=>{ if(quizIdx>0){ quizIdx--; render(); } });
  document.getElementById("quiz-next").addEventListener("click", ()=>{ if(!revealed){ quizRevealed[quizIdx]=true; render(); } else if(isLast){ finishQuiz(); } else { quizIdx++; render(); } });
  const editModQ=document.getElementById("edit-mod-q"); if(editModQ) editModQ.addEventListener("click", ()=>openEditor(m.id));
  document.getElementById("flag-question").addEventListener("click", ()=> sendToAdmins("flag", `${m.title} — Q${quizIdx+1}: ${q.q}`));
}

async function finishQuiz(){
  const m = modById(currentModId);
  const correctCount = quizAnswers.reduce((acc,ans,i)=> acc+(ans===m.quiz[i].correct?1:0),0);
  const prior = progressMap[m.id];
  const record = { best: Math.max(correctCount, prior?prior.best:0), total: m.quiz.length, lastScore: correctCount, attempts: (prior?prior.attempts:0)+1, lessonsViewed: prior&&prior.lessonsViewed ? prior.lessonsViewed : [] };
  progressMap[m.id] = record;
  await supabase.from("progress").upsert({
    user_id: session.user.id, module_id: m.id, best_score: record.best, total: record.total, last_score: record.lastScore, attempts: record.attempts, lessons_viewed: record.lessonsViewed, updated_at: new Date().toISOString()
  }, { onConflict: "user_id,module_id" });

  const answerDetail = m.quiz.map((q,i)=>({
    question: q.q, options: q.opts, selected: quizAnswers[i], correct: q.correct, is_correct: quizAnswers[i]===q.correct
  }));
  await supabase.from("quiz_attempts").insert({
    user_id: session.user.id, module_id: m.id, score: correctCount, total: m.quiz.length, answers: answerDetail
  });
  view = "results"; render();
}

function renderResults(){
  const m = modById(currentModId); const s = progressMap[m.id]; const p = pct(s);
  const leds = Array.from({length:5}).map((_,i)=>{ const lit = i < Math.round((s.lastScore/s.total)*5); const color = p===100?"on-green":p>=60?"on-amber":"on-red"; return `<span class="led ${lit?color:''}"></span>`; }).join("");
  const verdict = p===100?"Fully registered. This module is locked in.":p>=60?"Mostly holding — worth a second pass before it's live-call ready.":"Signal's not there yet. Revisit the lessons and retake when ready.";
  renderShell(`
    <div class="card result-hero"><div class="k-label">QUIZ RESULT · ${escapeHtml(m.title.toUpperCase())}</div>
      <div class="big-score">${s.lastScore}/${s.total}</div><div class="led-array">${leds}</div><div class="verdict">${escapeHtml(verdict)}</div>
      <div class="nav-buttons" style="justify-content:center;gap:14px;"><button class="btn" id="retake">Retake quiz</button><button class="btn" id="review">Review lessons</button><button class="btn primary" id="back-dash">Back to dashboard</button></div>
    </div>`);
  document.getElementById("retake").addEventListener("click", startQuiz);
  document.getElementById("review").addEventListener("click", ()=>{ currentLessonIdx=0; view="lesson"; render(); });
  document.getElementById("back-dash").addEventListener("click", ()=>{ view="dashboard"; render(); });
}

/* ============================================================
   TEAM PROGRESS (admin only)
   ============================================================ */
async function openTeamProgress(){
  const { data: people } = await supabase.from("profiles").select("*").order("name");
  const { data: allProgress } = await supabase.from("progress").select("*");
  teamRows = (people||[]).map(p=>{
    const rows = (allProgress||[]).filter(pr=>pr.user_id===p.id);
    const perModule = {};
    MODULES.forEach(m=>{
      const r = rows.find(rr=>rr.module_id===m.id);
      const totalLessons = m.lessons.length || 1;
      const viewedCount = r && r.lessons_viewed ? r.lessons_viewed.length : 0;
      const lessonFraction = Math.min(viewedCount/totalLessons, 1);
      const quizFraction = r && m.quiz.length ? (r.best_score||0)/m.quiz.length : 0;
      perModule[m.id] = Math.round((lessonFraction*0.5 + quizFraction*0.5) * 100);
    });
    return { id:p.id, name:p.name, role:p.role, perModule };
  });
  view = "team"; render();
}

function renderTeam(){
  const headerCols = MODULES.map(m=>`<th>${escapeHtml(m.title)}</th>`).join("");
  const rows = teamRows.map(r=>{
    const cells = MODULES.map(m=>`<td><button class="mini-btn" data-view-attempt="${r.id}:${m.id}">${r.perModule[m.id]}%</button></td>`).join("");
    const isSelf = r.id===profile.id;
    const roleSelect = isSelf
      ? `<span class="role-tag ${r.role==='admin'?'admin':''}">${r.role.toUpperCase()} (YOU)</span>`
      : `<select class="mini-btn" data-role-select="${r.id}"><option value="agent" ${r.role==='agent'?'selected':''}>User</option><option value="admin" ${r.role==='admin'?'selected':''}>Admin</option></select>`;
    const resetBtn = !isSelf ? `<button class="mini-btn" data-reset-pw="${r.id}" data-reset-name="${escapeHtml(r.name)}">Reset password</button>` : "";
    return `<tr><td>${escapeHtml(r.name)}</td><td>${roleSelect}</td>${cells}<td>${resetBtn}</td></tr>`;
  }).join("");
  renderShell(`
    <div class="card">
      <div class="k-label">ADMIN VIEW</div><h2>Team progress</h2>
      <p style="color:var(--text-dim);font-size:13.5px;margin:6px 0 20px;">Combined lesson + quiz completion per person. Click a percentage to see missed questions on their latest attempt.</p>
      <div style="overflow-x:auto;"><table class="team"><thead><tr><th>Name</th><th>Role</th>${headerCols}<th></th></tr></thead><tbody>${rows}</tbody></table></div>
    </div>
    <div id="attempt-detail" style="margin-top:16px;"></div>
  `);
  root.querySelectorAll("[data-role-select]").forEach(el=> el.addEventListener("change", async ()=>{
    const id = el.getAttribute("data-role-select");
    await supabase.from("profiles").update({ role: el.value }).eq("id", id);
    await openTeamProgress();
  }));
  root.querySelectorAll("[data-reset-pw]").forEach(el=> el.addEventListener("click", async ()=>{
    const id = el.getAttribute("data-reset-pw"); const name = el.getAttribute("data-reset-name");
    const newPw = prompt(`New password for ${name} (at least 6 characters):`);
    if(!newPw) return;
    if(newPw.length < 6){ alert("Password must be at least 6 characters."); return; }
    el.textContent = "Saving…"; el.disabled = true;
    const { data, error } = await supabase.functions.invoke("admin-reset-password", { body: { userId: id, newPassword: newPw } });
    if(error || (data && data.error)){ alert("Couldn't reset password: " + (data && data.error ? data.error : error.message)); }
    else { alert(`Password updated for ${name}.`); }
    el.textContent = "Reset password"; el.disabled = false;
  }));
  root.querySelectorAll("[data-view-attempt]").forEach(el=> el.addEventListener("click", async ()=>{
    const [userId, moduleId] = el.getAttribute("data-view-attempt").split(":");
    await showAttemptDetail(userId, moduleId);
  }));
}

async function showAttemptDetail(userId, moduleId){
  const holder = document.getElementById("attempt-detail");
  holder.innerHTML = `<div class="card"><p style="color:var(--text-faint);font-family:var(--mono);font-size:12px;">Loading latest attempt…</p></div>`;
  const { data: attempts } = await supabase.from("quiz_attempts").select("*").eq("user_id", userId).eq("module_id", moduleId).order("created_at", { ascending:false }).limit(1);
  const person = teamRows.find(r=>r.id===userId);
  const m = modById(moduleId);
  if(!attempts || !attempts.length){
    holder.innerHTML = `<div class="card"><p style="color:var(--text-dim);font-size:13.5px;">${escapeHtml(person?person.name:'This person')} hasn't taken the ${escapeHtml(m?m.title:'')} quiz yet.</p></div>`;
    return;
  }
  const a = attempts[0];
  const missed = (a.answers||[]).filter(x=>!x.is_correct);
  const missedHtml = missed.length ? missed.map(x=>`
    <div class="sub-card">
      <div style="font-size:14px;margin-bottom:8px;">${escapeHtml(x.question)}</div>
      <div style="font-size:13px;color:var(--red);margin-bottom:4px;">Their answer: ${escapeHtml(x.options[x.selected] ?? '(no answer)')}</div>
      <div style="font-size:13px;color:var(--green);">Correct answer: ${escapeHtml(x.options[x.correct])}</div>
    </div>
  `).join("") : `<p style="color:var(--green);font-size:13.5px;">No missed questions on their latest attempt — clean sweep.</p>`;
  holder.innerHTML = `
    <div class="card">
      <div class="k-label">LATEST ATTEMPT · ${escapeHtml(person?person.name:'')} · ${escapeHtml(m?m.title:'')}</div>
      <h2 style="margin-bottom:16px;">${a.score}/${a.total} correct</h2>
      ${missedHtml}
    </div>
  `;
}

/* ============================================================
   NOTIFICATIONS / MESSAGING
   ============================================================ */
async function loadNotifications(){
  const { data: announcements } = await supabase.from("messages").select("*").eq("audience","all").order("created_at",{ascending:false}).limit(8);
  NOTIF_ANNOUNCEMENTS = announcements || [];
  const { data: replies } = await supabase.from("messages").select("*").eq("audience","user").eq("recipient_id", session.user.id).order("created_at",{ascending:false}).limit(8);
  NOTIF_REPLIES = replies || [];
  if(isAdmin()){
    const { count } = await supabase.from("messages").select("*", { count:"exact", head:true }).eq("audience","admins").eq("is_read", false);
    NOTIF_ADMIN_UNREAD = count || 0;
  } else {
    NOTIF_ADMIN_UNREAD = 0;
  }
}
function bellBadgeCount(){ return NOTIF_REPLIES.filter(r=>!r.is_read).length + NOTIF_ADMIN_UNREAD; }

function renderNotifPanel(){
  const announceHtml = NOTIF_ANNOUNCEMENTS.length ? NOTIF_ANNOUNCEMENTS.map(a=>`
    <div class="notif-item">
      <div class="notif-item-body">${escapeHtml(a.body)}</div>
      <div class="notif-item-meta">${escapeHtml(a.sender_name)} · ${new Date(a.created_at).toLocaleDateString()}</div>
    </div>`).join("") : `<p class="notif-empty">No announcements yet.</p>`;

  const repliesHtml = NOTIF_REPLIES.length ? NOTIF_REPLIES.map(r=>`
    <div class="notif-item ${!r.is_read?'unread':''}">
      <div class="notif-item-body">${escapeHtml(r.body)}</div>
      <div class="notif-item-meta">Re: ${escapeHtml(r.context||'your feedback')} · ${new Date(r.created_at).toLocaleDateString()}</div>
      <button class="mini-btn" data-dismiss-notif="${r.id}">Dismiss</button>
    </div>`).join("") : `<p class="notif-empty">Nothing yet.</p>`;

  return `
    <div class="notif-panel" id="notif-panel">
      <div class="notif-panel-head">Notifications</div>
      <div class="notif-section-title">Announcements</div>
      ${announceHtml}
      <div class="notif-section-title">Replies to you</div>
      ${repliesHtml}
    </div>`;
}

async function toggleNotifPanel(){
  notifOpen = !notifOpen;
  if(notifOpen){
    await loadNotifications();
    const unreadIds = NOTIF_REPLIES.filter(r=>!r.is_read).map(r=>r.id);
    if(unreadIds.length){ await supabase.from("messages").update({ is_read:true }).in("id", unreadIds); await loadNotifications(); }
  }
  render();
}

async function sendToAdmins(type, context){
  const prompts = { flag:"What's wrong with this question?", highlight:"What would you like to highlight for admins?", comment:"Your comment for admins:" };
  const text = prompt(prompts[type] || "Your message:");
  if(!text || !text.trim()) return;
  await supabase.from("messages").insert({ sender_id: session.user.id, sender_name: profile.name, audience:"admins", type, body:text.trim(), context });
  alert("Sent to admins — thanks!");
}

async function composeAnnouncement(){
  const text = prompt("Announcement to send to everyone:");
  if(!text || !text.trim()) return;
  await supabase.from("messages").insert({ sender_id: session.user.id, sender_name: profile.name, audience:"all", type:"announcement", body:text.trim() });
  alert("Announcement sent to everyone.");
  await loadNotifications(); render();
}

async function openInbox(){
  const { data } = await supabase.from("messages").select("*").eq("audience","admins").order("created_at",{ascending:false});
  INBOX_ITEMS = data || [];
  const unreadIds = INBOX_ITEMS.filter(m=>!m.is_read).map(m=>m.id);
  if(unreadIds.length) await supabase.from("messages").update({ is_read:true }).in("id", unreadIds);
  await loadNotifications();
  view = "inbox"; render();
}

function renderInbox(){
  const typeLabel = { flag:"🚩 FLAG", highlight:"✨ HIGHLIGHT", comment:"💬 COMMENT" };
  const rows = INBOX_ITEMS.map(m=>`
    <div class="sub-card">
      <div class="sub-card-head">
        <span class="tag">${typeLabel[m.type]||m.type.toUpperCase()} · ${escapeHtml(m.sender_name)} · ${new Date(m.created_at).toLocaleString()}</span>
        <button class="mini-btn danger" data-discard-inbox="${m.id}">Discard</button>
      </div>
      ${m.context ? `<div style="font-size:12px;color:var(--text-faint);margin-bottom:6px;">${escapeHtml(m.context)}</div>` : ""}
      <div style="font-size:14px;margin-bottom:10px;color:var(--text);">${escapeHtml(m.body)}</div>
      <div class="field"><label>Reply</label><textarea id="reply-${m.id}" style="min-height:60px;" placeholder="Type a reply..."></textarea></div>
      <button class="mini-btn" data-send-reply="${m.id}">Send reply</button>
    </div>
  `).join("") || `<p style="color:var(--text-dim);font-size:14px;">Inbox is empty — nothing flagged or commented right now.</p>`;

  renderShell(`<div class="card"><div class="k-label">ADMIN INBOX</div><h2 style="margin-bottom:16px;">Flagged questions &amp; comments</h2>${rows}</div>`);

  root.querySelectorAll("[data-discard-inbox]").forEach(el=> el.addEventListener("click", async ()=>{
    if(confirm("Discard this item?")){ await supabase.from("messages").delete().eq("id", el.getAttribute("data-discard-inbox")); await openInbox(); }
  }));
  root.querySelectorAll("[data-send-reply]").forEach(el=> el.addEventListener("click", async ()=>{
    const id = el.getAttribute("data-send-reply");
    const original = INBOX_ITEMS.find(m=>m.id===id);
    const text = document.getElementById(`reply-${id}`).value.trim();
    if(!text) return;
    await supabase.from("messages").insert({ sender_id: session.user.id, sender_name: profile.name, recipient_id: original.sender_id, audience:"user", type:"reply", body:text, context: original.context, thread_id: id });
    alert("Reply sent.");
    document.getElementById(`reply-${id}`).value = "";
  }));
}
document.addEventListener("click", (e)=>{
  if(!notifOpen) return;
  if(e.target.closest(".bell-wrap")) return;
  notifOpen = false; render();
});

/* ============================================================
   EDITOR (admin only) — module / lessons / quiz CRUD
   ============================================================ */
function blankModule(){ return { id:null, title:"", short:"", ledColor:"green", lessons:[], quiz:[] }; }
function blankLesson(){ return { title:"New lesson", label:"Lesson · Untitled", body:"<p>Write the lesson content here.</p>" }; }
function blankQuestion(){ return { q:"New question", opts:["Option A","Option B"], correct:0, explain:"" }; }
function slugify(s){ const base=(s||"").toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,''); let id=base||("module-"+Date.now()); let i=2;
  while(MODULES.some(m=>m.id===id && m.id!==editingExistingId)){ id=base+"-"+i; i++; } return id; }

function openEditor(id){
  if(id){ editingExistingId=id; draftModule=JSON.parse(JSON.stringify(modById(id))); }
  else { editingExistingId=null; draftModule=blankModule(); }
  view="editor"; render();
}

function renderEditor(){
  const d = draftModule;
  const lessonsHtml = d.lessons.map((l,i)=>`
    <div class="sub-card"><div class="sub-card-head"><span class="tag">LESSON ${i+1}</span>
      <div class="mini-tools"><button class="mini-btn" data-lesson-up="${i}" ${i===0?'disabled':''}>↑</button>
      <button class="mini-btn" data-lesson-down="${i}" ${i===d.lessons.length-1?'disabled':''}>↓</button>
      <button class="mini-btn danger" data-lesson-del="${i}">Delete</button></div></div>
      <div class="field"><label>Label</label><input type="text" data-lesson-label="${i}" value="${escapeHtml(l.label)}"></div>
      <div class="field"><label>Title</label><input type="text" data-lesson-title="${i}" value="${escapeHtml(l.title)}"></div>
      <div class="field"><label>Body (HTML)</label><textarea data-lesson-body="${i}" style="min-height:150px;">${escapeHtml(l.body)}</textarea><div class="hint">Supports basic tags: &lt;p&gt; &lt;strong&gt; &lt;ul&gt;&lt;li&gt;.</div></div>
    </div>`).join("");

  const quizHtml = d.quiz.map((q,i)=>{
    const optsHtml = q.opts.map((opt,oi)=>`<div class="opt-row"><input type="radio" name="correct-${i}" data-q-correct="${i}" value="${oi}" ${q.correct===oi?'checked':''}>
      <input type="text" data-q-opt="${i}:${oi}" value="${escapeHtml(opt)}"><button class="mini-btn danger" data-q-opt-del="${i}:${oi}" ${q.opts.length<=2?'disabled':''}>✕</button></div>`).join("");
    return `<div class="sub-card"><div class="sub-card-head"><span class="tag">QUESTION ${i+1}</span>
      <div class="mini-tools"><button class="mini-btn" data-q-up="${i}" ${i===0?'disabled':''}>↑</button><button class="mini-btn" data-q-down="${i}" ${i===d.quiz.length-1?'disabled':''}>↓</button>
      <button class="mini-btn danger" data-q-del="${i}">Delete</button></div></div>
      <div class="field"><label>Question</label><textarea data-q-text="${i}" style="min-height:55px;">${escapeHtml(q.q)}</textarea></div>
      <div class="field"><label>Options (select correct)</label>${optsHtml}<button class="mini-btn" data-q-opt-add="${i}" style="margin-top:4px;">+ Add option</button></div>
      <div class="field"><label>Explanation</label><textarea data-q-explain="${i}" style="min-height:55px;">${escapeHtml(q.explain)}</textarea></div>
    </div>`;
  }).join("");

  renderShell(`
    <div class="card">
      <div class="k-label">${editingExistingId?"EDITING MODULE":"NEW MODULE"}</div>
      <div class="field"><label>Module title</label><input type="text" id="mod-title" value="${escapeHtml(d.title)}"></div>
      <div class="field"><label>Short description</label><textarea id="mod-short" style="min-height:55px;">${escapeHtml(d.short)}</textarea></div>
      <div class="editor-section"><div class="editor-section-head"><h3>Lessons</h3></div>${lessonsHtml||'<p style="color:var(--text-faint);font-size:13px;">No lessons yet.</p>'}<button class="dashed-btn" id="add-lesson">+ Add lesson</button></div>
      <div class="editor-section"><div class="editor-section-head"><h3>Quiz questions</h3></div>${quizHtml||'<p style="color:var(--text-faint);font-size:13px;">No questions yet.</p>'}<button class="dashed-btn" id="add-question">+ Add question</button></div>
      <div class="nav-buttons"><div style="display:flex;gap:10px;"><button class="btn" id="editor-cancel">Cancel</button>${editingExistingId?`<button class="btn danger" id="editor-delete">Delete module</button>`:""}</div>
      <button class="btn primary" id="editor-save">Save module</button></div>
    </div>`);
  wireEditorEvents();
}

function wireEditorEvents(){
  const d = draftModule;
  document.getElementById("mod-title").addEventListener("input", e=>{ d.title=e.target.value; });
  document.getElementById("mod-short").addEventListener("input", e=>{ d.short=e.target.value; });
  root.querySelectorAll("[data-lesson-label]").forEach(el=> el.addEventListener("input", e=>{ d.lessons[+el.dataset.lessonLabel].label=e.target.value; }));
  root.querySelectorAll("[data-lesson-title]").forEach(el=> el.addEventListener("input", e=>{ d.lessons[+el.dataset.lessonTitle].title=e.target.value; }));
  root.querySelectorAll("[data-lesson-body]").forEach(el=> el.addEventListener("input", e=>{ d.lessons[+el.dataset.lessonBody].body=e.target.value; }));
  root.querySelectorAll("[data-lesson-up]").forEach(el=> el.addEventListener("click", ()=>{ const i=+el.dataset.lessonUp; [d.lessons[i-1],d.lessons[i]]=[d.lessons[i],d.lessons[i-1]]; renderEditor(); }));
  root.querySelectorAll("[data-lesson-down]").forEach(el=> el.addEventListener("click", ()=>{ const i=+el.dataset.lessonDown; [d.lessons[i+1],d.lessons[i]]=[d.lessons[i],d.lessons[i+1]]; renderEditor(); }));
  root.querySelectorAll("[data-lesson-del]").forEach(el=> el.addEventListener("click", ()=>{ const i=+el.dataset.lessonDel; if(confirm("Delete this lesson?")){ d.lessons.splice(i,1); renderEditor(); } }));
  document.getElementById("add-lesson").addEventListener("click", ()=>{ d.lessons.push(blankLesson()); renderEditor(); });

  root.querySelectorAll("[data-q-text]").forEach(el=> el.addEventListener("input", e=>{ d.quiz[+el.dataset.qText].q=e.target.value; }));
  root.querySelectorAll("[data-q-explain]").forEach(el=> el.addEventListener("input", e=>{ d.quiz[+el.dataset.qExplain].explain=e.target.value; }));
  root.querySelectorAll("[data-q-opt]").forEach(el=> el.addEventListener("input", e=>{ const [qi,oi]=el.dataset.qOpt.split(":").map(Number); d.quiz[qi].opts[oi]=e.target.value; }));
  root.querySelectorAll("[data-q-correct]").forEach(el=> el.addEventListener("change", e=>{ d.quiz[+el.dataset.qCorrect].correct=+e.target.value; }));
  root.querySelectorAll("[data-q-opt-add]").forEach(el=> el.addEventListener("click", ()=>{ d.quiz[+el.dataset.qOptAdd].opts.push("New option"); renderEditor(); }));
  root.querySelectorAll("[data-q-opt-del]").forEach(el=> el.addEventListener("click", ()=>{
    const [qi,oi]=el.dataset.qOptDel.split(":").map(Number); if(d.quiz[qi].opts.length<=2) return;
    d.quiz[qi].opts.splice(oi,1); if(d.quiz[qi].correct===oi) d.quiz[qi].correct=0; else if(d.quiz[qi].correct>oi) d.quiz[qi].correct-=1; renderEditor();
  }));
  root.querySelectorAll("[data-q-up]").forEach(el=> el.addEventListener("click", ()=>{ const i=+el.dataset.qUp; [d.quiz[i-1],d.quiz[i]]=[d.quiz[i],d.quiz[i-1]]; renderEditor(); }));
  root.querySelectorAll("[data-q-down]").forEach(el=> el.addEventListener("click", ()=>{ const i=+el.dataset.qDown; [d.quiz[i+1],d.quiz[i]]=[d.quiz[i],d.quiz[i+1]]; renderEditor(); }));
  root.querySelectorAll("[data-q-del]").forEach(el=> el.addEventListener("click", ()=>{ const i=+el.dataset.qDel; if(confirm("Delete this question?")){ d.quiz.splice(i,1); renderEditor(); } }));
  document.getElementById("add-question").addEventListener("click", ()=>{ d.quiz.push(blankQuestion()); renderEditor(); });

  document.getElementById("editor-cancel").addEventListener("click", ()=>{ view = editingExistingId?"lesson":"dashboard"; if(editingExistingId){ currentModId=editingExistingId; currentLessonIdx=0; } render(); });

  const delBtn = document.getElementById("editor-delete");
  if(delBtn) delBtn.addEventListener("click", async ()=>{
    if(confirm(`Delete "${d.title||'this module'}"? This can't be undone.`)){
      await supabase.from("modules").delete().eq("id", editingExistingId);
      await loadEverything(); view="dashboard"; render();
    }
  });

  document.getElementById("editor-save").addEventListener("click", async ()=>{
    if(!d.title.trim()){ alert("Give the module a title before saving."); return; }
    const id = editingExistingId || slugify(d.title);
    await supabase.from("modules").upsert({ id, title:d.title, short:d.short, led_color:d.ledColor, sort_order: editingExistingId ? undefined : (MODULES.length+1) });
    await supabase.from("lessons").delete().eq("module_id", id);
    if(d.lessons.length){
      await supabase.from("lessons").insert(d.lessons.map((l,i)=>({ module_id:id, sort_order:i, label:l.label, title:l.title, body:l.body })));
    }
    await supabase.from("quiz_questions").delete().eq("module_id", id);
    if(d.quiz.length){
      await supabase.from("quiz_questions").insert(d.quiz.map((q,i)=>({ module_id:id, sort_order:i, question:q.q, options:q.opts, correct_index:q.correct, explanation:q.explain })));
    }
    await loadEverything();
    currentModId = id; currentLessonIdx = 0;
    view = MODULES.find(m=>m.id===id).lessons.length ? "lesson" : "dashboard";
    render();
  });
}

/* ============================================================
   SETTINGS (name, own password, theme)
   ============================================================ */
function currentTheme(){ return localStorage.getItem("lineup-theme") || "dark"; }
function applyTheme(t){
  if(t==="light") document.documentElement.classList.add("theme-light");
  else document.documentElement.classList.remove("theme-light");
  localStorage.setItem("lineup-theme", t);
}

function renderSettings(){
  const t = currentTheme();
  renderShell(`
    <div class="card">
      <div class="k-label">ACCOUNT SETTINGS</div>
      <h2 style="margin-bottom:20px;">Settings</h2>

      <div class="field"><label>Display name</label><input type="text" id="set-name" value="${escapeHtml(profile.name)}"></div>
      <button class="btn primary" id="save-name" style="margin-bottom:10px;">Save name</button>
      <div id="name-status" class="info-msg" style="margin:6px 0 0;min-height:16px;"></div>

      <div class="editor-section">
        <div class="editor-section-head"><h3>Change your password</h3></div>
        <div class="field"><label>New password</label><input type="password" id="set-pw1" placeholder="At least 6 characters"></div>
        <div class="field"><label>Confirm new password</label><input type="password" id="set-pw2"></div>
        <button class="btn primary" id="save-pw">Update password</button>
        <div id="pw-status" class="info-msg" style="margin:6px 0 0;min-height:16px;"></div>
      </div>

      <div class="editor-section">
        <div class="editor-section-head"><h3>Appearance</h3></div>
        <div class="theme-switch">
          <button id="theme-dark" class="${t==='dark'?'active':''}">🌙 Dark</button>
          <button id="theme-light" class="${t==='light'?'active':''}">☀️ Light</button>
        </div>
      </div>

      <div class="nav-buttons"><button class="btn" id="back-dash-settings">← Back to dashboard</button><div></div></div>
    </div>
  `);

  document.getElementById("back-dash-settings").addEventListener("click", ()=>{ view="home"; render(); });

  document.getElementById("save-name").addEventListener("click", async ()=>{
    const newName = document.getElementById("set-name").value.trim();
    const status = document.getElementById("name-status");
    if(!newName){ status.textContent = "Name can't be empty."; status.style.color = "var(--red)"; return; }
    const { error } = await supabase.from("profiles").update({ name:newName }).eq("id", session.user.id);
    if(error){ status.textContent = "Couldn't save: " + error.message; status.style.color = "var(--red)"; return; }
    profile.name = newName;
    status.textContent = "Saved."; status.style.color = "var(--green)";
    const pill = document.querySelector(".pill-btn"); if(pill) pill.textContent = newName;
  });

  document.getElementById("save-pw").addEventListener("click", async ()=>{
    const pw1 = document.getElementById("set-pw1").value;
    const pw2 = document.getElementById("set-pw2").value;
    const status = document.getElementById("pw-status");
    if(pw1.length < 6){ status.textContent = "Password must be at least 6 characters."; status.style.color = "var(--red)"; return; }
    if(pw1 !== pw2){ status.textContent = "Passwords don't match."; status.style.color = "var(--red)"; return; }
    const { error } = await supabase.auth.updateUser({ password: pw1 });
    if(error){ status.textContent = "Couldn't update: " + error.message; status.style.color = "var(--red)"; return; }
    status.textContent = "Password updated."; status.style.color = "var(--green)";
    document.getElementById("set-pw1").value = ""; document.getElementById("set-pw2").value = "";
  });

  document.getElementById("theme-dark").addEventListener("click", ()=>{ applyTheme("dark"); renderSettings(); });
  document.getElementById("theme-light").addEventListener("click", ()=>{ applyTheme("light"); renderSettings(); });
}

      </div>
      <div class="mod-card" id="go-reference-card">
        <div class="row-top"><div><h3>Reference Guide</h3><p class="sub">A living knowledge base the whole team can look things up in, not just new hires.</p></div><div class="led-strip"><span class="led" style="background:var(--cyan);border-color:var(--cyan);box-shadow:0 0 8px var(--cyan);"></span></div></div>
        <div class="meta"><span>ALWAYS UP TO DATE</span></div>
      </div>
    </div>
  `);
  document.getElementById("go-modules-card").addEventListener("click", ()=>{ view="dashboard"; render(); });
  document.getElementById("go-reference-card").addEventListener("click", openReference);
}

/* ============================================================
   REFERENCE GUIDE (OneNote-style, admin editable)
   ============================================================ */
async function loadReference(){
  const { data } = await supabase.from("reference_pages").select("*").order("sort_order");
  REFERENCE_PAGES = data || [];
  if(!REFERENCE_PAGES.find(p=>p.id===currentRefId)) currentRefId = null;
}
async function openReference(){
  await loadReference();
  refEditing = false;
  if(!currentRefId){ const top = REFERENCE_PAGES.find(p=>!p.parent_id); if(top) currentRefId = top.id; }
  view = "reference"; render();
}
function topLevelPages(){ return REFERENCE_PAGES.filter(p=>!p.parent_id).sort((a,b)=>a.sort_order-b.sort_order); }
function childPages(parentId){ return REFERENCE_PAGES.filter(p=>p.parent_id===parentId).sort((a,b)=>a.sort_order-b.sort_order); }

function renderReference(){
  const editOn = canEdit();
  const tops = topLevelPages();

  function sidebarRow(p, isChild){
    const active = p.id===currentRefId;
    const siblings = isChild ? childPages(p.parent_id) : tops;
    const idx = siblings.findIndex(s=>s.id===p.id);
    const tools = editOn ? `
      <span class="ref-row-tools">
        <button class="mini-btn" data-ref-up="${p.id}" ${idx===0?'disabled':''}>↑</button>
        <button class="mini-btn" data-ref-down="${p.id}" ${idx===siblings.length-1?'disabled':''}>↓</button>
        ${!isChild ? `<button class="mini-btn" data-ref-addsub="${p.id}">+ Sub</button>` : ""}
        <button class="mini-btn danger" data-ref-del="${p.id}">✕</button>
      </span>` : "";
    return `<div class="ref-row ${active?'active':''} ${isChild?'child':''}" data-ref-select="${p.id}"><span class="ref-row-title">${escapeHtml(p.title)}</span>${tools}</div>`;
  }

  const sidebarHtml = tops.map(p=>{
    const kids = childPages(p.id);
    return sidebarRow(p,false) + kids.map(k=>sidebarRow(k,true)).join("");
  }).join("") || `<p style="color:var(--text-faint);font-size:12.5px;padding:10px;">No pages yet.</p>`;

  const addTopBtn = editOn ? `<button class="dashed-btn" id="add-ref-page" style="margin-top:10px;">+ Add page</button>` : "";

  const page = REFERENCE_PAGES.find(p=>p.id===currentRefId);
  let contentHtml;
  if(!REFERENCE_PAGES.length){
    contentHtml = `<div class="card"><p style="color:var(--text-dim);font-size:14px;">Nothing here yet.${editOn ? ' Click "+ Add page" to start building it out.' : ' Check back once an admin has added content.'}</p></div>`;
  } else if(!page){
    contentHtml = `<div class="card"><p style="color:var(--text-dim);font-size:14px;">Select a page from the left.</p></div>`;
  } else if(refEditing){
    contentHtml = `
      <div class="card">
        <div class="k-label">EDITING PAGE</div>
        <div class="field"><label>Page title</label><input type="text" id="ref-title" value="${escapeHtml(refDraft.title)}"></div>
        <div class="field"><label>Body (HTML)</label><textarea id="ref-body" style="min-height:280px;">${escapeHtml(refDraft.body)}</textarea><div class="hint">Supports basic tags: &lt;p&gt; &lt;strong&gt; &lt;ul&gt;&lt;li&gt;.</div></div>
        <div class="nav-buttons">
          <div style="display:flex;gap:10px;"><button class="btn" id="ref-cancel">Cancel</button><button class="btn danger" id="ref-delete">Delete page</button></div>
          <button class="btn primary" id="ref-save">Save page</button>
        </div>
      </div>`;
  } else {
    const editBtn = editOn ? `<button class="btn" id="ref-edit" style="border-color:var(--amber);color:var(--amber);">✎ Edit page</button>` : "";
    contentHtml = `
      <div class="card">
        <div class="k-label">REFERENCE GUIDE</div>
        <h2>${escapeHtml(page.title)}</h2>
        <div class="body">${page.body}</div>
        <div class="nav-buttons"><div></div>${editBtn}</div>
      </div>`;
  }

  renderShell(`
    <div class="ref-layout">
      <div class="ref-sidebar"><div class="ref-sidebar-list">${sidebarHtml}</div>${addTopBtn}</div>
      <div class="ref-content">${contentHtml}</div>
    </div>
  `);

  root.querySelectorAll("[data-ref-select]").forEach(el=> el.addEventListener("click", ()=>{ currentRefId = el.getAttribute("data-ref-select"); refEditing=false; render(); }));

  const addPageBtn = document.getElementById("add-ref-page");
  if(addPageBtn) addPageBtn.addEventListener("click", async ()=>{
    const { data, error } = await supabase.from("reference_pages").insert({ title:"New page", body:"<p>Write here.</p>", parent_id:null, sort_order: tops.length }).select().single();
    if(!error){ await loadReference(); currentRefId = data.id; refDraft = { title:data.title, body:data.body }; refEditing = true; render(); }
  });
  root.querySelectorAll("[data-ref-addsub]").forEach(el=> el.addEventListener("click", async ()=>{
    const parentId = el.getAttribute("data-ref-addsub");
    const kids = childPages(parentId);
    const { data, error } = await supabase.from("reference_pages").insert({ title:"New subsection", body:"<p>Write here.</p>", parent_id:parentId, sort_order: kids.length }).select().single();
    if(!error){ await loadReference(); currentRefId = data.id; refDraft = { title:data.title, body:data.body }; refEditing = true; render(); }
  }));
  root.querySelectorAll("[data-ref-up]").forEach(el=> el.addEventListener("click", async ()=>{ await moveRefPage(el.getAttribute("data-ref-up"), -1); }));
  root.querySelectorAll("[data-ref-down]").forEach(el=> el.addEventListener("click", async ()=>{ await moveRefPage(el.getAttribute("data-ref-down"), 1); }));
  root.querySelectorAll("[data-ref-del]").forEach(el=> el.addEventListener("click", async ()=>{
    const id = el.getAttribute("data-ref-del");
    const target = REFERENCE_PAGES.find(p=>p.id===id);
    const hasKids = childPages(id).length>0;
    if(confirm(`Delete "${target.title}"?${hasKids?' This will also delete its subsections.':''}`)){
      await supabase.from("reference_pages").delete().eq("id", id);
      if(currentRefId===id) currentRefId = null;
      await loadReference(); render();
    }
  }));

  const editBtn = document.getElementById("ref-edit");
  if(editBtn) editBtn.addEventListener("click", ()=>{ refDraft = { title:page.title, body:page.body }; refEditing = true; render(); });
  const cancelBtn = document.getElementById("ref-cancel");
  if(cancelBtn) cancelBtn.addEventListener("click", ()=>{ refEditing=false; render(); });
  const saveBtn = document.getElementById("ref-save");
  if(saveBtn) saveBtn.addEventListener("click", async ()=>{
    const title = document.getElementById("ref-title").value.trim() || "Untitled page";
    const body = document.getElementById("ref-body").value;
    await supabase.from("reference_pages").update({ title, body }).eq("id", page.id);
    refEditing = false; await loadReference(); render();
  });
  const deleteBtn = document.getElementById("ref-delete");
  if(deleteBtn) deleteBtn.addEventListener("click", async ()=>{
    if(confirm(`Delete "${page.title}"? This can't be undone.`)){
      await supabase.from("reference_pages").delete().eq("id", page.id);
      refEditing = false; currentRefId = null; await loadReference(); render();
    }
  });
}

async function moveRefPage(id, direction){
  const p = REFERENCE_PAGES.find(x=>x.id===id);
  const siblings = (p.parent_id ? childPages(p.parent_id) : topLevelPages());
  const idx = siblings.findIndex(s=>s.id===id);
  const swapIdx = idx + direction;
  if(swapIdx < 0 || swapIdx >= siblings.length) return;
  const other = siblings[swapIdx];
  await supabase.from("reference_pages").update({ sort_order: other.sort_order }).eq("id", p.id);
  await supabase.from("reference_pages").update({ sort_order: p.sort_order }).eq("id", other.id);
  await loadReference(); render();
}

/* ============================================================
   ROUTER
   ============================================================ */
function render(){
  if(view==="loading") root.innerHTML = `<div style="padding:60px;text-align:center;color:#8A96AD;font-family:'IBM Plex Mono',monospace;font-size:13px;">LOADING…</div>`;
  else if(view==="auth") renderAuth();
  else if(view==="home") renderHome();
  else if(view==="dashboard") renderDashboard();
  else if(view==="lesson") renderLesson();
  else if(view==="quiz") renderQuiz();
  else if(view==="results") renderResults();
  else if(view==="editor") renderEditor();
  else if(view==="team") renderTeam();
  else if(view==="settings") renderSettings();
  else if(view==="reference") renderReference();
  else if(view==="inbox") renderInbox();
}

/* ============================================================
   INIT
   ============================================================ */
(async function init(){
  applyTheme(currentTheme());
  view="loading"; render();
  const { data } = await supabase.auth.getSession();
  if(data.session){ session = data.session; await afterLogin(); }
  else { view="auth"; render(); }

  supabase.auth.onAuthStateChange((event, newSession)=>{
    if(event === "SIGNED_OUT"){ session=null; profile=null; view="auth"; render(); }
  });
})();

})();
</script>
