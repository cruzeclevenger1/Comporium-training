let teamExpandedRows = new Set();
let TEAMS_LIST = [];
let teamRosterFilter = "";
let pendingRoleChanges = {}; // userId -> { role, perms:{editContent,createQuizzes,managePeople} }, staged until explicitly saved
let permissionsPanelOpen = new Set(); // userIds with the Permissions checklist expanded

const ROLE_PRESETS = {
  admin:  { editContent:true,  createQuizzes:true,  managePeople:true },
  editor: { editContent:true,  createQuizzes:false, managePeople:false },
  agent:  { editContent:false, createQuizzes:false, managePeople:false }
};
function computeDisplayRole(perms){
  for(const roleName of ["admin","editor","agent"]){
    const preset = ROLE_PRESETS[roleName];
    if(preset.editContent===perms.editContent && preset.createQuizzes===perms.createQuizzes && preset.managePeople===perms.managePeople) return roleName;
  }
  return "custom";
}
let teamSearchQuery = "";
let teamModuleFilter = "";
let teamsSectionOpen = { teams:false, people:false, modules:false, quizzes:false };
let QUIZ_PROGRESS_ROWS = null; // lazy-loaded the first time that section opens
let quizProgressExpandedRows = new Set();

async function loadQuizProgressData(){
  const dept = currentActiveDepartment();
  const { data: quizzesRaw } = await supabase.from("standalone_quizzes").select("*").eq("sent", true);
  const quizzes = guestMode ? quizzesRaw : (quizzesRaw||[]).filter(q=> (q.department||'TS')===dept);
  const { data: attempts } = await supabase.from("standalone_quiz_attempts").select("*");
  const { data: recipients } = await supabase.from("standalone_quiz_recipients").select("*");
  const { data: allTeamMembers } = await supabase.from("team_members").select("*");
  QUIZ_PROGRESS_ROWS = teamRows.map(person=>{
    const eligible = (quizzes||[]).filter(q=>{
      if(q.audience_type==="everyone") return true;
      if(q.audience_type==="team") return (allTeamMembers||[]).some(tm=>tm.team_id===q.team_id && tm.user_id===person.id);
      if(q.audience_type==="specific") return (recipients||[]).some(r=>r.quiz_id===q.id && r.user_id===person.id);
      return false;
    });
    const perQuiz = eligible.map(q=>{
      const attempt = (attempts||[]).find(a=>a.quiz_id===q.id && a.user_id===person.id);
      return { quizId:q.id, title:q.title, completed: !!attempt, needsGrading: !!attempt && !attempt.graded };
    });
    const completedCount = perQuiz.filter(x=>x.completed).length;
    const pct = perQuiz.length ? Math.round((completedCount/perQuiz.length)*100) : 0;
    return { id:person.id, name:person.name, role:person.role, teamIds:person.teamIds, canAccessTs:person.canAccessTs, canAccessCs:person.canAccessCs, perQuiz, completedCount, totalCount:perQuiz.length, pct };
  });
}

async function openTeamProgress(){
  if(guestMode){ view = "team"; render(); return; }
  const { data: people } = await supabase.from("profiles").select("*").order("name");
  const { data: allProgress } = await supabase.from("progress").select("*");
  const { data: teamsData } = await supabase.from("teams").select("*").order("name");
  const { data: memberships } = await supabase.from("team_members").select("*");

  TEAMS_LIST = (teamsData||[]).map(t=>({
    id: t.id, name: t.name, department: t.department||'TS',
    memberIds: (memberships||[]).filter(m=>m.team_id===t.id).map(m=>m.user_id)
  }));

  teamRows = (people||[]).map(p=>{
    const rows = (allProgress||[]).filter(pr=>pr.user_id===p.id);
    const perModule = {};
    const perModuleRaw = {};
    MODULES.forEach(m=>{
      const r = rows.find(rr=>rr.module_id===m.id);
      const totalLessons = m.lessons.length || 1;
      const viewedCount = r && r.lessons_viewed ? r.lessons_viewed.length : 0;
      const lessonFraction = Math.min(viewedCount/totalLessons, 1);
      if(!m.quiz.length){
        perModule[m.id] = Math.round(lessonFraction * 100);
      } else {
        const quizFraction = r ? (r.best_score||0)/m.quiz.length : 0;
        perModule[m.id] = Math.round((lessonFraction*0.5 + quizFraction*0.5) * 100);
      }
      perModuleRaw[m.id] = { best: r ? (r.best_score||0) : 0, total: m.quiz.length, attempts: r ? (r.attempts||0) : 0 };
    });
    const values = Object.values(perModule);
    const overall = values.length ? Math.round(values.reduce((a,b)=>a+b,0)/values.length) : 0;
    const mastered = values.filter(v=>v===100).length;
    const teamIds = (memberships||[]).filter(m=>m.user_id===p.id).map(m=>m.team_id);
    return { id:p.id, name:p.name, role:p.role, perModule, perModuleRaw, overall, mastered, teamIds,
      permEditContent: !!p.perm_edit_content, permCreateQuizzes: !!p.perm_create_quizzes, permManagePeople: !!p.perm_manage_people,
      canAccessTs: !!p.can_access_ts, canAccessCs: !!p.can_access_cs };
  });
  view = "team"; render();
}

function openTeamManageModal(teamId){
  const team = teamId ? TEAMS_LIST.find(t=>t.id===teamId) : null;
  const memberIds = new Set(team ? team.memberIds : []);
  const initialDept = team ? team.department : currentActiveDepartment();

  function memberListHtml(dept){
    return teamRows.filter(r=> canAccessDeptFor(r, dept)).map(r=>`
      <label style="display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px;color:var(--text);">
        <input type="checkbox" value="${r.id}" class="team-member-check" ${memberIds.has(r.id)?'checked':''}> ${escapeHtml(r.name)}${r.role==='admin'?' <span class="role-tag admin">ADMIN</span>':''}
      </label>`).join("") || `<p style="color:var(--text-faint);font-size:12.5px;">Nobody has access to this department yet.</p>`;
  }
  function canAccessDeptFor(r, dept){ return dept==='CS' ? r.canAccessCs : r.canAccessTs; }

  const deptFieldHtml = team
    ? `<div class="field"><label>Department</label><p style="color:var(--text-dim);font-size:13px;margin:0;">${team.department==='CS'?'Customer Service':'Tech Support'} — set when the team was created, can't be changed after.</p></div>`
    : `<div class="field"><label>Department</label>
        <select id="team-dept-select">
          <option value="TS" ${initialDept!=='CS'?'selected':''}>Tech Support</option>
          <option value="CS" ${initialDept==='CS'?'selected':''}>Customer Service</option>
        </select>
        <p class="hint">Teams can't mix departments — only people with access to the chosen one will be selectable below.</p>
      </div>`;

  openModal(`
    <h3>${team ? "Manage team" : "New team"}</h3>
    <div class="field"><label>Team name</label><input type="text" id="team-name-input" value="${team?escapeHtml(team.name):''}" placeholder="e.g. July 2026 New Hires"></div>
    ${deptFieldHtml}
    <div class="field"><label>Members</label>
      <div id="team-member-list" style="max-height:220px;overflow-y:auto;border:1px solid var(--stroke);border-radius:8px;padding:10px;">
        ${memberListHtml(initialDept)}
      </div>
    </div>
    <div class="modal-actions" style="justify-content:space-between;">
      ${team ? `<button class="btn danger" id="team-delete-btn">Delete team</button>` : `<span></span>`}
      <div style="display:flex;gap:10px;"><button class="btn" id="team-cancel-btn">Cancel</button><button class="btn primary" id="team-save-btn">${team?"Save":"Create"}</button></div>
    </div>
  `, true);
  const deptSelect = document.getElementById("team-dept-select");
  if(deptSelect) deptSelect.addEventListener("change", (e)=>{
    document.getElementById("team-member-list").innerHTML = memberListHtml(e.target.value);
  });
  document.getElementById("team-cancel-btn").addEventListener("click", closeModal);
  const delBtn = document.getElementById("team-delete-btn");
  if(delBtn) delBtn.addEventListener("click", async ()=>{
    if(confirm(`Delete "${team.name}"? This can't be undone.`)){
      await supabase.from("teams").delete().eq("id", team.id);
      if(teamRosterFilter === team.id) teamRosterFilter = ""; // don't leave the roster filtered on a team that no longer exists
      QUIZ_PROGRESS_ROWS = null; // team membership changed, force a fresh load next time it's viewed
      closeModal(); await openTeamProgress();
    }
  });
  document.getElementById("team-save-btn").addEventListener("click", async ()=>{
    const name = document.getElementById("team-name-input").value.trim();
    if(!name){ alert("Give the team a name."); return; }
    const selectedIds = Array.from(document.querySelectorAll(".team-member-check:checked")).map(cb=>cb.value);
    let tid = team ? team.id : null;
    if(!tid){
      const dept = document.getElementById("team-dept-select").value;
      const { data, error } = await supabase.from("teams").insert({ name, department: dept }).select().single();
      if(error){ alert("Couldn't create team: " + error.message); return; }
      tid = data.id;
    } else {
      await supabase.from("teams").update({ name }).eq("id", tid);
    }
    await supabase.from("team_members").delete().eq("team_id", tid);
    if(selectedIds.length){
      await supabase.from("team_members").insert(selectedIds.map(uid=>({ team_id: tid, user_id: uid })));
    }
    closeModal();
    await openTeamProgress();
  });
}

function renderTeam(){
  if(teamsSectionOpen.quizzes && !QUIZ_PROGRESS_ROWS && teamRows.length){
    loadQuizProgressData().then(()=> render());
  }
  const dept = currentActiveDepartment();
  const deptTeams = guestMode ? TEAMS_LIST : TEAMS_LIST.filter(t=> t.department===dept);
  const teamsHtml = deptTeams.length ? deptTeams.map(t=>`
    <button class="mini-btn" data-manage-team="${t.id}" style="margin:0 6px 6px 0;">${escapeHtml(t.name)} · ${t.memberIds.length}</button>
  `).join("") : `<p style="color:var(--text-faint);font-size:12.5px;">No teams yet.</p>`;

  // AUDIT FIX: previously showed every person regardless of the viewing
  // admin's own department access — a CS-only admin could see TS reps'
  // names, roles, module progress, and quiz progress. Scope the base roster
  // to people who actually have access to the department being viewed
  // before any of the existing role/team/search filters apply on top.
  const deptRows = guestMode ? teamRows : teamRows.filter(r=> dept==='CS' ? r.canAccessCs : r.canAccessTs);
  let filteredRows = deptRows;
  if(teamRosterFilter.startsWith("role:")){
    const role = teamRosterFilter.slice(5);
    filteredRows = deptRows.filter(r=> r.role === role);
  } else if(teamRosterFilter){
    filteredRows = deptRows.filter(r=> r.teamIds.includes(teamRosterFilter));
  }
  if(teamSearchQuery.trim()){
    const q = teamSearchQuery.trim().toLowerCase();
    filteredRows = filteredRows.filter(r=> r.name.toLowerCase().includes(q));
  }

  const focusModule = teamModuleFilter ? modById(teamModuleFilter) : null;

  // ---- People rows ----
  const peopleRows = filteredRows.map(r=>{
    const isSelf = r.id===profile.id;
    const pending = pendingRoleChanges[r.id];
    const storedPerms = { editContent:r.permEditContent, createQuizzes:r.permCreateQuizzes, managePeople:r.permManagePeople };
    const currentPerms = pending ? pending.perms : storedPerms;
    const displayRole = computeDisplayRole(currentPerms);
    const panelOpen = permissionsPanelOpen.has(r.id);
    const isDirty = !!pending && (pending.role !== r.role || pending.perms.editContent !== r.permEditContent || pending.perms.createQuizzes !== r.permCreateQuizzes || pending.perms.managePeople !== r.permManagePeople);

    const roleCell = isSelf
      ? `<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
          <span class="role-tag ${r.role==='admin'?'admin':''}">${r.role.toUpperCase()} (YOU)</span>
          <button class="mini-btn" data-perm-toggle="${r.id}">Department access ${panelOpen?'▾':'▸'}</button>
        </div>`
      : `<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
          <select class="mini-btn" data-role-select="${r.id}">
            <option value="agent" ${displayRole==='agent'?'selected':''}>User</option>
            <option value="editor" ${displayRole==='editor'?'selected':''}>Editor</option>
            <option value="admin" ${displayRole==='admin'?'selected':''}>Admin</option>
            <option value="custom" ${displayRole==='custom'?'selected':''}>Custom</option>
          </select>
          <button class="mini-btn" data-perm-toggle="${r.id}">Permissions ${panelOpen?'▾':'▸'}</button>
          ${isDirty ? `<button class="mini-btn" data-role-save="${r.id}" style="color:var(--green);border-color:var(--green-dim);">Save</button>` : ""}
        </div>`;
    const editPersonBtn = !isSelf ? `<button class="mini-btn" data-edit-person="${r.id}" data-edit-person-name="${escapeHtml(r.name)}">Edit</button>` : "";
    const mainRow = `<tr><td>${escapeHtml(r.name)}</td><td>${roleCell}</td><td>${editPersonBtn}</td></tr>`;
    const panelRow = panelOpen ? `
      <tr class="team-row-detail"><td colspan="3">
        <div style="padding:10px 4px 16px;display:flex;flex-direction:column;gap:8px;">
          ${!isSelf ? `
          <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text);"><input type="checkbox" data-perm-check="${r.id}:editContent" ${currentPerms.editContent?'checked':''}> Can edit modules, lessons and module quizzes</label>
          <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text);"><input type="checkbox" data-perm-check="${r.id}:createQuizzes" ${currentPerms.createQuizzes?'checked':''}> Can create quizzes</label>
          <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text);"><input type="checkbox" data-perm-check="${r.id}:managePeople" ${currentPerms.managePeople?'checked':''}> Can edit users and teams</label>
          <div style="border-top:1px solid var(--stroke);margin-top:6px;padding-top:10px;">` : ""}
            <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text);"><input type="checkbox" data-dept-check="${r.id}:ts" ${r.canAccessTs?'checked':''}> Can access Tech Support</label>
            <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text);margin-top:6px;"><input type="checkbox" data-dept-check="${r.id}:cs" ${r.canAccessCs?'checked':''}> Can access Customer Service</label>
          ${!isSelf ? `</div>` : ""}
        </div>
      </td></tr>` : "";
    return mainRow + panelRow;
  }).join("");

  // ---- Module progress rows ----
  const deptModulesForRoster = guestMode ? MODULES : MODULES.filter(m=> m.department===dept);
  // AUDIT FIX: r.overall / r.mastered were computed once at load time across
  // every module the admin can see, mixing both departments together —
  // switching tabs changed which module pills showed, but not these
  // aggregate numbers, so someone could see "100% mastered" on a tab with
  // zero modules in it. Recompute them fresh here, scoped to only the
  // modules actually in the active department.
  function deptOverallFor(r){
    const values = deptModulesForRoster.map(m=> r.perModule[m.id]).filter(v=> v!==undefined);
    return values.length ? Math.round(values.reduce((a,b)=>a+b,0)/values.length) : 0;
  }
  function deptMasteredFor(r){
    return deptModulesForRoster.filter(m=> r.perModule[m.id]===100).length;
  }
  const moduleRows = filteredRows.map(r=>{
    const expanded = teamExpandedRows.has(r.id);
    const moduleGrid = deptModulesForRoster.map(m=>{
      const pct = r.perModule[m.id];
      const cls = pct===100 ? "done" : pct>0 ? "progress" : "";
      return `<button class="status-pill ${cls}" data-view-attempt="${r.id}:${m.id}" style="cursor:pointer;">${escapeHtml(m.title)} · ${pct}%</button>`;
    }).join("");

    let progressCell, thirdCell;
    if(focusModule){
      const pct = r.perModule[focusModule.id];
      const raw = r.perModuleRaw[focusModule.id];
      progressCell = `<td style="min-width:160px;">
          <div style="display:flex;align-items:center;gap:8px;">
            <div class="progress-bar" style="flex:1;"><div style="width:${pct}%"></div></div>
            <span style="font-family:var(--mono);font-size:11.5px;color:var(--text-dim);white-space:nowrap;">${pct}%</span>
          </div>
        </td>`;
      thirdCell = `<td style="font-family:var(--mono);font-size:12px;color:var(--text-dim);white-space:nowrap;">${!focusModule.quiz.length ? "No quiz for this module" : (raw.attempts ? `${raw.best}/${raw.total} (${raw.total?Math.round((raw.best/raw.total)*100):0}%) correct` : "no attempts yet")}</td>`;
    } else {
      progressCell = `<td style="min-width:160px;">
          <div style="display:flex;align-items:center;gap:8px;">
            <div class="progress-bar" style="flex:1;"><div style="width:${deptOverallFor(r)}%"></div></div>
            <span style="font-family:var(--mono);font-size:11.5px;color:var(--text-dim);white-space:nowrap;">${deptOverallFor(r)}%</span>
          </div>
        </td>`;
      thirdCell = `<td style="font-family:var(--mono);font-size:12px;color:var(--text-dim);white-space:nowrap;">${deptMasteredFor(r)}/${deptModulesForRoster.length} (${deptModulesForRoster.length?Math.round((deptMasteredFor(r)/deptModulesForRoster.length)*100):0}%) mastered</td>`;
    }

    const mainRow = `
      <tr class="team-row-main" data-team-toggle="${r.id}" style="cursor:pointer;">
        <td>${escapeHtml(r.name)}</td>
        ${progressCell}
        ${thirdCell}
        <td style="text-align:center;color:var(--text-faint);">${expanded?'▾':'▸'}</td>
      </tr>`;
    const detailRow = expanded ? `
      <tr class="team-row-detail"><td colspan="4">
        <div style="display:flex;flex-wrap:wrap;gap:8px;padding:6px 4px 14px;">
          ${moduleGrid || `<span style="color:var(--text-faint);font-size:12.5px;">No modules yet.</span>`}
        </div>
      </td></tr>` : "";
    return mainRow + detailRow;
  }).join("");

  // ---- Quiz progress rows ----
  let quizRowsHtml = `<p style="color:var(--text-faint);font-size:13px;">Loading…</p>`;
  if(QUIZ_PROGRESS_ROWS){
    let filteredQuizRows = guestMode ? QUIZ_PROGRESS_ROWS : QUIZ_PROGRESS_ROWS.filter(r=> dept==='CS' ? r.canAccessCs : r.canAccessTs);
    if(teamRosterFilter.startsWith("role:")){
      filteredQuizRows = filteredQuizRows.filter(r=> r.role === teamRosterFilter.slice(5));
    } else if(teamRosterFilter){
      filteredQuizRows = filteredQuizRows.filter(r=> (r.teamIds||[]).includes(teamRosterFilter));
    }
    if(teamSearchQuery.trim()){
      const q = teamSearchQuery.trim().toLowerCase();
      filteredQuizRows = filteredQuizRows.filter(r=> r.name.toLowerCase().includes(q));
    }
    quizRowsHtml = filteredQuizRows.map(r=>{
      const expanded = quizProgressExpandedRows.has(r.id);
      const quizPills = r.perQuiz.map(pq=>{
        const cls = pq.needsGrading ? 'progress' : pq.completed ? 'done' : '';
        const label = pq.needsGrading ? 'Needs grading' : pq.completed ? 'Completed' : 'Not started';
        return `<button class="status-pill ${cls}" ${pq.completed?`data-view-quiz-attempt="${r.id}:${pq.quizId}"`:''} style="${pq.completed?'cursor:pointer;':'cursor:default;'}">${escapeHtml(pq.title)} · ${label}</button>`;
      }).join("");
      const mainRow = `
        <tr class="team-row-main" data-quiz-team-toggle="${r.id}" style="cursor:pointer;">
          <td>${escapeHtml(r.name)}</td>
          <td style="min-width:160px;"><div style="display:flex;align-items:center;gap:8px;"><div class="progress-bar" style="flex:1;"><div style="width:${r.pct}%"></div></div><span style="font-family:var(--mono);font-size:11.5px;color:var(--text-dim);white-space:nowrap;">${r.pct}%</span></div></td>
          <td style="font-family:var(--mono);font-size:12px;color:var(--text-dim);white-space:nowrap;">${r.completedCount}/${r.totalCount} completed</td>
          <td style="text-align:center;color:var(--text-faint);">${expanded?'▾':'▸'}</td>
        </tr>`;
      const detailRow = expanded ? `
        <tr class="team-row-detail"><td colspan="4">
          <div style="display:flex;flex-wrap:wrap;gap:8px;padding:6px 4px 14px;">
            ${quizPills || `<span style="color:var(--text-faint);font-size:12.5px;">No quizzes sent to this person yet.</span>`}
          </div>
        </td></tr>` : "";
      return mainRow + detailRow;
    }).join("") || `<tr><td colspan="4" style="color:var(--text-faint);font-size:13px;padding:16px 4px;">No one matches.</td></tr>`;
  }

  function sectionHeader(key, title, count){
    const open = teamsSectionOpen[key];
    return `<div class="collapsible-header" data-team-section-toggle="${key}" style="cursor:pointer;display:flex;align-items:center;justify-content:space-between;">
      <h2 style="margin:0;">${title}${count!=null?` <span style="color:var(--text-faint);font-size:13px;font-weight:400;">(${count})</span>`:''}</h2>
      <span style="color:var(--text-faint);font-size:16px;">${open?'▾':'▸'}</span>
    </div>`;
  }

  const teamPageDeptTabsHtml = (!guestMode && myDepartments().length>1) ? `<div class="dept-tabs">
      <button class="dept-tab ${dept==='TS'?'active':''}" data-team-dept="TS">Tech Support</button>
      <button class="dept-tab ${dept==='CS'?'active':''}" data-team-dept="CS">Customer Service</button>
    </div>` : "";

  renderShell(`
    ${teamPageDeptTabsHtml}
    ${canManagePeople() ? `
    <div class="card">
      ${sectionHeader('teams', 'Teams', deptTeams.length)}
      ${teamsSectionOpen.teams ? `
        <div style="margin-top:14px;">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
            <p style="color:var(--text-dim);font-size:13.5px;margin:0;">Group people together to filter progress by cohort, or target announcements at just this group.</p>
            <button class="btn primary" id="new-team-btn">+ New team</button>
          </div>
          <div>${teamsHtml}</div>
        </div>` : ""}
    </div>

    <div class="card" style="margin-top:16px;">
      ${sectionHeader('people', 'People', deptRows.length)}
      ${teamsSectionOpen.people ? `
        <div style="margin-top:14px;">
          <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;">
            <input type="text" id="team-search-people" data-no-enter-submit placeholder="Search by name…" value="${escapeHtml(teamSearchQuery)}" class="search-input" style="width:180px;">
            <select id="team-filter-people" style="width:auto;">
              <option value="">All teams</option>
              <option value="role:admin" ${teamRosterFilter==='role:admin'?'selected':''}>Admins</option>
              <option value="role:editor" ${teamRosterFilter==='role:editor'?'selected':''}>Editors</option>
              <option value="role:agent" ${teamRosterFilter==='role:agent'?'selected':''}>Users</option>
              ${TEAMS_LIST.map(t=>`<option value="${t.id}" ${teamRosterFilter===t.id?'selected':''}>${escapeHtml(t.name)}</option>`).join("")}
            </select>
          </div>
          <div style="overflow-x:auto;"><table class="team"><thead><tr><th>Name</th><th>Role</th><th></th></tr></thead><tbody>${peopleRows || `<tr><td colspan="3" style="color:var(--text-faint);font-size:13px;padding:16px 4px;">No one matches.</td></tr>`}</tbody></table></div>
        </div>` : ""}
    </div>` : ""}

    ${canManagePeople() ? `
    <div class="card" style="margin-top:16px;">
      ${sectionHeader('modules', 'Module Progress')}
      ${teamsSectionOpen.modules ? `
        <div style="margin-top:14px;">
          <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;">
            <input type="text" id="team-search-modules" data-no-enter-submit placeholder="Search by name…" value="${escapeHtml(teamSearchQuery)}" class="search-input" style="width:180px;">
            <select id="team-filter-modules" style="width:auto;">
              <option value="">All teams</option>
              <option value="role:admin" ${teamRosterFilter==='role:admin'?'selected':''}>Admins</option>
              <option value="role:editor" ${teamRosterFilter==='role:editor'?'selected':''}>Editors</option>
              <option value="role:agent" ${teamRosterFilter==='role:agent'?'selected':''}>Users</option>
              ${TEAMS_LIST.map(t=>`<option value="${t.id}" ${teamRosterFilter===t.id?'selected':''}>${escapeHtml(t.name)}</option>`).join("")}
            </select>
            <select id="module-filter" style="width:auto;">
              <option value="">All modules (overall)</option>
              ${deptModulesForRoster.map(m=>`<option value="${m.id}" ${teamModuleFilter===m.id?'selected':''}>${escapeHtml(m.title)}</option>`).join("")}
            </select>
            <button class="btn" id="go-analyze-btn" style="margin-left:auto;">📊 Analyze</button>
          </div>
          <p style="color:var(--text-dim);font-size:13.5px;margin:6px 0 20px;">${focusModule ? `Showing progress on <strong style="color:var(--text);">${escapeHtml(focusModule.title)}</strong> only.` : "Click a person to see their module-by-module breakdown."} Click a module pill to see missed questions on their latest attempt.</p>
          <div style="overflow-x:auto;"><table class="team"><thead><tr><th>Name</th><th>${focusModule ? escapeHtml(focusModule.title) : "Overall"}</th><th>${focusModule ? "Score" : "Mastered"}</th><th></th></tr></thead><tbody>${moduleRows || `<tr><td colspan="4" style="color:var(--text-faint);font-size:13px;padding:16px 4px;">No one matches.</td></tr>`}</tbody></table></div>
        </div>` : ""}
    </div>` : ""}

    <div id="attempt-detail" style="margin-top:16px;"></div>

    ${(canManagePeople() || canCreateQuizzes()) ? `
    <div class="card" style="margin-top:16px;">
      ${sectionHeader('quizzes', 'Quiz Progress')}
      ${teamsSectionOpen.quizzes ? `
        <div style="margin-top:14px;">
          <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;">
            <input type="text" id="team-search-quizzes" data-no-enter-submit placeholder="Search by name…" value="${escapeHtml(teamSearchQuery)}" class="search-input" style="width:180px;">
            <select id="team-filter-quizzes" style="width:auto;">
              <option value="">All teams</option>
              <option value="role:admin" ${teamRosterFilter==='role:admin'?'selected':''}>Admins</option>
              <option value="role:editor" ${teamRosterFilter==='role:editor'?'selected':''}>Editors</option>
              <option value="role:agent" ${teamRosterFilter==='role:agent'?'selected':''}>Users</option>
              ${TEAMS_LIST.map(t=>`<option value="${t.id}" ${teamRosterFilter===t.id?'selected':''}>${escapeHtml(t.name)}</option>`).join("")}
            </select>
            <button class="btn" id="go-quiz-analyze-btn" style="margin-left:auto;">📊 Analyze</button>
          </div>
          <p style="color:var(--text-dim);font-size:13.5px;margin:0 0 20px;">Percent of sent quizzes each person has completed. Click a completed quiz to see their answers.</p>
          <div style="overflow-x:auto;"><table class="team"><thead><tr><th>Name</th><th>Completion</th><th></th><th></th></tr></thead><tbody>${quizRowsHtml}</tbody></table></div>
        </div>` : ""}
    </div>` : ""}

    <div id="quiz-attempt-detail" style="margin-top:16px;"></div>
  `);

  root.querySelectorAll("[data-team-section-toggle]").forEach(el=> el.addEventListener("click", async ()=>{
    const key = el.getAttribute("data-team-section-toggle");
    teamsSectionOpen[key] = !teamsSectionOpen[key];
    if(key==="quizzes" && teamsSectionOpen.quizzes && !QUIZ_PROGRESS_ROWS){
      render(); // show the section immediately with a loading state
      await loadQuizProgressData();
    }
    render();
  }));

  document.getElementById("go-analyze-btn")?.addEventListener("click", openAnalyze);
  document.getElementById("go-quiz-analyze-btn")?.addEventListener("click", openQuizAnalyze);
  document.getElementById("new-team-btn")?.addEventListener("click", ()=> openTeamManageModal(null));
  root.querySelectorAll("[data-manage-team]").forEach(el=> el.addEventListener("click", ()=> openTeamManageModal(el.getAttribute("data-manage-team"))));
  document.getElementById("module-filter")?.addEventListener("change", (e)=>{ teamModuleFilter = e.target.value; render(); });
  root.querySelectorAll("[data-team-dept]").forEach(el=> el.addEventListener("click", ()=>{
    activeDepartment = el.getAttribute("data-team-dept");
    teamRosterFilter = ""; teamModuleFilter = "";
    QUIZ_PROGRESS_ROWS = null; // quiz eligibility is department-scoped now, force a fresh load
    render();
  }));

  ["people","modules","quizzes"].forEach(suffix=>{
    document.getElementById(`team-filter-${suffix}`)?.addEventListener("change", (e)=>{ teamRosterFilter = e.target.value; render(); });
    const searchEl = document.getElementById(`team-search-${suffix}`);
    if(searchEl){
      let debounceTimer = null;
      searchEl.addEventListener("input", (e)=>{
        teamSearchQuery = e.target.value;
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(()=>{
          render();
          const el = document.getElementById(`team-search-${suffix}`);
          if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
        }, 250);
      });
    }
  });

  root.querySelectorAll("[data-role-select]").forEach(el=> el.addEventListener("change", (e)=>{
    const id = el.getAttribute("data-role-select");
    const row = teamRows.find(r=>r.id===id);
    const newRole = e.target.value;
    if(newRole === "custom"){
      permissionsPanelOpen.add(id);
      if(!pendingRoleChanges[id]){
        pendingRoleChanges[id] = { role: row.role, perms: { editContent:row.permEditContent, createQuizzes:row.permCreateQuizzes, managePeople:row.permManagePeople } };
      }
    } else {
      pendingRoleChanges[id] = { role: newRole, perms: { ...ROLE_PRESETS[newRole] } };
    }
    renderTeam();
  }));
  root.querySelectorAll("[data-perm-toggle]").forEach(el=> el.addEventListener("click", (e)=>{
    e.stopPropagation();
    const id = el.getAttribute("data-perm-toggle");
    if(permissionsPanelOpen.has(id)) permissionsPanelOpen.delete(id); else permissionsPanelOpen.add(id);
    render();
  }));
  root.querySelectorAll("[data-perm-check]").forEach(el=> el.addEventListener("change", (e)=>{
    const [id, key] = el.getAttribute("data-perm-check").split(":");
    const row = teamRows.find(r=>r.id===id);
    if(!pendingRoleChanges[id]){
      pendingRoleChanges[id] = { role: row.role, perms: { editContent:row.permEditContent, createQuizzes:row.permCreateQuizzes, managePeople:row.permManagePeople } };
    }
    pendingRoleChanges[id].perms[key] = e.target.checked;
    const newDisplayRole = computeDisplayRole(pendingRoleChanges[id].perms);
    pendingRoleChanges[id].role = newDisplayRole === "custom" ? "agent" : newDisplayRole;
    renderTeam();
  }));
  root.querySelectorAll("[data-dept-check]").forEach(el=> el.addEventListener("change", async (e)=>{
    const [id, key] = el.getAttribute("data-dept-check").split(":");
    const row = teamRows.find(r=>r.id===id);
    const column = key === "ts" ? "can_access_ts" : "can_access_cs";
    const checked = e.target.checked;
    el.disabled = true;
    const { error } = await supabase.from("profiles").update({ [column]: checked }).eq("id", id);
    el.disabled = false;
    if(error){ alert("Couldn't save: " + error.message); e.target.checked = !checked; return; }
    if(key==="ts") row.canAccessTs = checked; else row.canAccessCs = checked;
    logEdit("updated", "department_access", `${row.name} — ${key.toUpperCase()} ${checked?'granted':'removed'}`);
    showToast("Access updated.");
  }));
  root.querySelectorAll("[data-role-save]").forEach(el=> el.addEventListener("click", async (e)=>{
    e.stopPropagation();
    const id = el.getAttribute("data-role-save");
    const pending = pendingRoleChanges[id];
    if(!pending) return;
    const { error } = await supabase.from("profiles").update({
      role: pending.role,
      perm_edit_content: pending.perms.editContent,
      perm_create_quizzes: pending.perms.createQuizzes,
      perm_manage_people: pending.perms.managePeople
    }).eq("id", id);
    if(error){ alert("Couldn't save: " + error.message); return; }
    delete pendingRoleChanges[id];
    await openTeamProgress();
  }));
  root.querySelectorAll("[data-edit-person]").forEach(el=> el.addEventListener("click", (e)=>{
    e.stopPropagation();
    openEditPersonModal(el.getAttribute("data-edit-person"), el.getAttribute("data-edit-person-name"));
  }));
  root.querySelectorAll("[data-team-toggle]").forEach(el=> el.addEventListener("click", (e)=>{
    if(e.target.closest("[data-role-select]")||e.target.closest("[data-role-save]")||e.target.closest("[data-edit-person]")) return;
    const id = el.getAttribute("data-team-toggle");
    if(teamExpandedRows.has(id)) teamExpandedRows.delete(id); else teamExpandedRows.add(id);
    render();
  }));
  root.querySelectorAll("[data-view-attempt]").forEach(el=> el.addEventListener("click", async (e)=>{
    e.stopPropagation();
    const [userId, moduleId] = el.getAttribute("data-view-attempt").split(":");
    await showAttemptDetail(userId, moduleId);
  }));
  root.querySelectorAll("[data-quiz-team-toggle]").forEach(el=> el.addEventListener("click", (e)=>{
    const id = el.getAttribute("data-quiz-team-toggle");
    if(quizProgressExpandedRows.has(id)) quizProgressExpandedRows.delete(id); else quizProgressExpandedRows.add(id);
    render();
  }));
  root.querySelectorAll("[data-view-quiz-attempt]").forEach(el=> el.addEventListener("click", async (e)=>{
    e.stopPropagation();
    const [userId, quizId] = el.getAttribute("data-view-quiz-attempt").split(":");
    await showStandaloneQuizAttemptDetail(userId, quizId);
  }));
}

async function showAttemptDetail(userId, moduleId){
  const holder = document.getElementById("attempt-detail");
  holder.innerHTML = `<div class="card"><p style="color:var(--text-faint);font-family:var(--mono);font-size:12px;">Loading latest attempt…</p></div>`;
  const person = teamRows.find(r=>r.id===userId);
  const m = modById(moduleId);

  let a;
  if(!m || !m.quiz.length){
    holder.innerHTML = `<div class="card"><p style="color:var(--text-dim);font-size:13.5px;">There is not a quiz for this module.</p></div>`;
    return;
  }
  if(guestMode){
    const raw = person ? person.perModuleRaw[moduleId] : null;
    if(!raw || !raw.attempts){
      holder.innerHTML = `<div class="card"><p style="color:var(--text-dim);font-size:13.5px;">${escapeHtml(person?person.name:'This person')} hasn't taken the ${escapeHtml(m?m.title:'')} quiz yet.</p></div>`;
      return;
    }
    // Simulate which questions were "missed" so the count matches their displayed score.
    const answers = m.quiz.map((q,i)=>{
      const isCorrect = i < raw.best;
      const selected = isCorrect ? q.correct : (q.correct === 0 ? 1 : 0);
      return { question: q.q, options: q.opts, selected, correct: q.correct, is_correct: isCorrect };
    });
    a = { score: raw.best, total: raw.total, answers };
  } else {
    const { data: attempts } = await supabase.from("quiz_attempts").select("*").eq("user_id", userId).eq("module_id", moduleId).order("created_at", { ascending:false }).limit(1);
    if(!attempts || !attempts.length){
      holder.innerHTML = `<div class="card"><p style="color:var(--text-dim);font-size:13.5px;">${escapeHtml(person?person.name:'This person')} hasn't taken the ${escapeHtml(m?m.title:'')} quiz yet.</p></div>`;
      return;
    }
    a = attempts[0];
  }

  const missed = (a.answers||[]).filter(x=>!x.is_correct);
  const missedHtml = missed.length ? missed.map((x,i)=>`
    <div class="sub-card">
      <div style="font-size:14px;margin-bottom:8px;">${escapeHtml(x.question)}</div>
      <div style="font-size:13px;color:var(--red);margin-bottom:4px;">Their answer: ${escapeHtml(x.options[x.selected] ?? '(no answer)')}</div>
      <div style="font-size:13px;color:var(--green);margin-bottom:10px;">Correct answer: ${escapeHtml(x.options[x.correct])}</div>
      <button class="mini-btn" data-coach="${i}">💬 Discuss with ${escapeHtml(person?person.name:'them')}</button>
    </div>
  `).join("") : `<p style="color:var(--green);font-size:13.5px;">No missed questions on their latest attempt — clean sweep.</p>`;
  holder.innerHTML = `
    <div class="card">
      <div class="k-label">LATEST ATTEMPT · ${escapeHtml(person?person.name:'')} · ${escapeHtml(m?m.title:'')}</div>
      <h2 style="margin-bottom:16px;">${a.score}/${a.total} (${a.total?Math.round((a.score/a.total)*100):0}%) correct</h2>
      ${missedHtml}
    </div>
  `;
  holder.querySelectorAll("[data-coach]").forEach(el=> el.addEventListener("click", ()=>{
    const q = missed[+el.getAttribute("data-coach")];
    openCoachingModal(userId, person ? person.name : "this person", `${m ? m.title : ''} — ${q.question}`);
  }));
}

let pendingGrades = {};
let chatPendingGrades = {}; // rootId -> { answerIdx: boolean } for inline grading in Chat
async function showStandaloneQuizAttemptDetail(userId, quizId, holderId, personNameOverride){
  holderId = holderId || "quiz-attempt-detail";
  const holder = document.getElementById(holderId);
  if(!holder) return;
  holder.innerHTML = `<div class="card"><p style="color:var(--text-faint);font-family:var(--mono);font-size:12px;">Loading answers…</p></div>`;
  const person = teamRows.find(r=>r.id===userId);
  const personName = personNameOverride || (person ? person.name : '');
  const { data: quiz } = await supabase.from("standalone_quizzes").select("*").eq("id", quizId).single();
  const { data: attempt } = await supabase.from("standalone_quiz_attempts").select("*").eq("user_id", userId).eq("quiz_id", quizId).single();
  if(!attempt){
    holder.innerHTML = `<div class="card"><p style="color:var(--text-dim);font-size:13.5px;">No submission found.</p></div>`;
    return;
  }
  const needsGrading = !attempt.graded;
  pendingGrades = {};
  const rows = (attempt.answers||[]).map((ans,idx)=>{
    if(ans.type === "long_answer"){
      if(needsGrading){
        return `<div class="sub-card">
          <div style="font-size:14px;margin-bottom:6px;"><strong>${escapeHtml(ans.question)}</strong> <span class="tag" style="margin-left:6px;">LONG ANSWER · NEEDS GRADING</span></div>
          <div style="font-size:13px;color:var(--text-dim);white-space:pre-wrap;margin-bottom:12px;">${escapeHtml(ans.answer || '(no answer)')}</div>
          <div style="display:flex;gap:10px;">
            <button class="mini-btn grade-choice" data-grade-idx="${idx}" data-grade-val="true" style="color:var(--text-dim);">✓ Mark Correct</button>
            <button class="mini-btn grade-choice" data-grade-idx="${idx}" data-grade-val="false" style="color:var(--text-dim);">✕ Mark Incorrect</button>
          </div>
        </div>`;
      }
      const gradeLabel = ans.is_correct===true ? ' · CORRECT' : ans.is_correct===false ? ' · INCORRECT' : '';
      return `<div class="sub-card"><div style="font-size:14px;margin-bottom:6px;"><strong>${escapeHtml(ans.question)}</strong> <span class="tag" style="margin-left:6px;">LONG ANSWER${gradeLabel}</span></div><div style="font-size:13px;color:var(--text-dim);white-space:pre-wrap;">${escapeHtml(ans.answer || '(no answer)')}</div></div>`;
    }
    const selectedText = ans.selected!=null ? ans.options[ans.selected] : "(no answer)";
    const correctText = ans.options[ans.correct];
    return `<div class="sub-card"><div style="font-size:14px;margin-bottom:6px;"><strong>${escapeHtml(ans.question)}</strong></div>
      <div style="font-size:13px;color:${ans.is_correct?'var(--green)':'var(--red)'};">Their answer: ${escapeHtml(selectedText)}</div>
      ${!ans.is_correct?`<div style="font-size:13px;color:var(--green);">Correct answer: ${escapeHtml(correctText)}</div>`:''}
    </div>`;
  }).join("");
  const longAnswerAnswersForScore = (attempt.answers||[]).filter(a=>a.type==="long_answer");
  const longAnswerCorrectForScore = longAnswerAnswersForScore.filter(a=>a.is_correct===true).length;
  const totalQForScore = (attempt.mc_total||0) + longAnswerAnswersForScore.length;
  const totalCorrectForScore = (attempt.mc_score||0) + longAnswerCorrectForScore;
  const pctForScore = totalQForScore ? Math.round((totalCorrectForScore/totalQForScore)*100) : null;
  holder.innerHTML = `
    <div class="card">
      <div class="k-label">QUIZ SUBMISSION · ${escapeHtml(personName)} · ${escapeHtml(quiz?quiz.title:'')}</div>
      ${needsGrading
        ? (attempt.mc_total ? `<h2 style="margin-bottom:16px;">${attempt.mc_score}/${attempt.mc_total} multiple choice correct so far</h2>` : `<h2 style="margin-bottom:16px;">Submitted</h2>`)
        : (totalQForScore ? `<h2 style="margin-bottom:16px;">${totalCorrectForScore}/${totalQForScore} correct <span style="color:var(--text-faint);font-size:14px;font-weight:400;">(${pctForScore}%)</span></h2>` : `<h2 style="margin-bottom:16px;">Submitted</h2>`)}
      ${needsGrading ? `<p style="color:var(--amber);font-size:13px;margin-bottom:16px;">⚠ This submission has long-answer questions that need grading before it's finalized.</p>` : ""}
      ${rows || `<p style="color:var(--text-faint);font-size:13px;">No answers recorded.</p>`}
      ${needsGrading ? `<div class="nav-buttons"><div></div><button class="btn primary" id="finalize-grading">Finalize grading</button></div>` : ""}
    </div>
  `;
  if(needsGrading){
    holder.querySelectorAll(".grade-choice").forEach(btn=> btn.addEventListener("click", ()=>{
      const idx = btn.getAttribute("data-grade-idx");
      const val = btn.getAttribute("data-grade-val") === "true";
      pendingGrades[idx] = val;
      holder.querySelectorAll(`.grade-choice[data-grade-idx="${idx}"]`).forEach(b=>{
        const isThis = b === btn;
        b.style.color = isThis ? (val ? "var(--green)" : "var(--red)") : "var(--text-dim)";
        b.style.borderColor = isThis ? (val ? "var(--green-dim)" : "var(--red-dim)") : "";
        b.style.fontWeight = isThis ? "700" : "400";
      });
    }));
    document.getElementById("finalize-grading").addEventListener("click", async ()=>{
      const longAnswerCount = (attempt.answers||[]).filter(a=>a.type==="long_answer").length;
      if(Object.keys(pendingGrades).length < longAnswerCount){ alert("Grade every long-answer question before finalizing."); return; }
      const updatedAnswers = (attempt.answers||[]).map((ans,idx)=>{
        if(ans.type==="long_answer" && pendingGrades[idx]!=null) return { ...ans, is_correct: pendingGrades[idx] };
        return ans;
      });
      const { data: updatedRows, error } = await supabase.from("standalone_quiz_attempts").update({ answers: updatedAnswers, graded: true }).eq("quiz_id", quizId).eq("user_id", userId).select();
      if(error){ alert("Couldn't save grading: " + error.message); return; }
      if(!updatedRows || !updatedRows.length){ alert("Grading didn't save — the database silently rejected this update (likely a permissions rule). Nothing changed. Please tell your admin/developer this happened."); return; }
      logEdit("graded", "standalone_quiz_attempt", `${quiz?quiz.title:'quiz'} — ${personName||'submission'}`);
      const correctCount = updatedAnswers.filter((a,i)=> attempt.answers[i]?.type==="long_answer" && a.is_correct===true).length;
      await Promise.resolve(supabase.from("messages").insert({
        sender_id: session.user.id, sender_name: profile.name, recipient_id: userId,
        audience:"user", type:"reply", claimed_by: session.user.id,
        body: `<p>Your quiz "<strong>${escapeHtml(quiz?quiz.title:'the quiz')}</strong>" has been graded — ${correctCount}/${longAnswerCount} (${longAnswerCount?Math.round((correctCount/longAnswerCount)*100):0}%) long-answer question${longAnswerCount===1?'':'s'} correct.</p>`
      })).catch(()=>{});
      showToast("Grading saved.");
      QUIZ_PROGRESS_ROWS = null;
      if(view === "quiz-sent-detail" && quizSentDetailQuiz){
        await refreshQuizSentDetailRoster();
        render();
        await showStandaloneQuizAttemptDetail(userId, quizId, `sent-detail-answers-${userId}`, personName);
      } else {
        await loadQuizProgressData();
        render();
        await showStandaloneQuizAttemptDetail(userId, quizId, holderId, personName);
      }
    });
  }
}

function renderQuizzesList(){
  const dept = currentActiveDepartment();
  const deptQuizzes = guestMode ? QUIZZES : QUIZZES.filter(q=> (q.department||'TS')===dept);
  const canManageQuizzes = canCreateQuizzes();
  const myQuizzes = deptQuizzes.filter(q=> q.isRecipient);
  const pending = myQuizzes.filter(q=> !q.myAttempt);
  const completed = myQuizzes.filter(q=> !!q.myAttempt);
  const sentQuizzes = canManageQuizzes ? deptQuizzes : [];
  const activeSent = sentQuizzes.filter(q=> !(q.sent && q.isFullyComplete));
  const fullyCompleteSent = sentQuizzes.filter(q=> q.sent && q.isFullyComplete);

  function quizCard(q, forManagement){
    let tag;
    if(!q.sent){ tag = `<span class="status-pill">Draft</span>`; }
    else if(forManagement){ tag = q.isFullyComplete ? `<span class="status-pill done">Fully completed</span>` : `<span class="status-pill done">Sent</span>`; }
    else if(q.myAttempt){
      if(q.myAttempt.graded){
        const longAnswerAnswers = (q.myAttempt.answers||[]).filter(a=>a.type==="long_answer");
        const longAnswerCorrect = longAnswerAnswers.filter(a=>a.is_correct===true).length;
        const totalQ = (q.myAttempt.mc_total||0) + longAnswerAnswers.length;
        const totalCorrect = (q.myAttempt.mc_score||0) + longAnswerCorrect;
        tag = totalQ ? `<span class="status-pill done">${totalCorrect}/${totalQ} (${Math.round((totalCorrect/totalQ)*100)}%)</span>` : `<span class="status-pill done">Completed</span>`;
      } else {
        tag = `<span class="status-pill progress">Awaiting grading</span>`;
      }
    }
    else { tag = `<span class="status-pill">Not started</span>`; }
    const deleteBtn = forManagement ? `<button class="mini-btn danger" data-quiz-delete="${q.id}" style="position:absolute;top:12px;right:12px;">Delete</button>` : "";
    return `<div class="mod-card" data-quiz-open="${q.id}" data-quiz-manage="${forManagement?'1':'0'}" style="position:relative;">
      ${deleteBtn}
      <div class="row-top"><div><h3>${escapeHtml(q.title)}</h3><p class="sub">${q.questions.length} question${q.questions.length===1?'':'s'} · from ${escapeHtml(q.createdByName||'an admin')}</p></div></div>
      <div class="meta"><span>${tag}</span></div>
    </div>`;
  }

  function sectionHeader(key, title, count){
    const open = quizListSectionOpen[key];
    return `<div class="collapsible-header" data-quiz-section-toggle="${key}" style="cursor:pointer;display:flex;align-items:center;justify-content:space-between;">
      <h2 style="margin:0;">${title} <span style="color:var(--text-faint);font-size:13px;font-weight:400;">(${count})</span></h2>
      <span style="color:var(--text-faint);font-size:16px;">${open?'▾':'▸'}</span>
    </div>`;
  }

  const addBtn = (canManageQuizzes && editMode) ? `<button class="dashed-btn" id="add-quiz" style="margin-top:14px;">+ New quiz</button>` : "";
  const quizDeptTabsHtml = (!guestMode && myDepartments().length>1) ? `<div class="dept-tabs">
      <button class="dept-tab ${dept==='TS'?'active':''}" data-quiz-dept="TS">Tech Support</button>
      <button class="dept-tab ${dept==='CS'?'active':''}" data-quiz-dept="CS">Customer Service</button>
    </div>` : "";
  renderShell(`
    ${quizDeptTabsHtml}
    <section class="hero">
      <div class="eyebrow">${T('quizzes.eyebrow','Quizzes')}</div>
      <h1>${T('quizzes.h1','Quick check-ins from your admins')}</h1>
      <p>${T('quizzes.p','These are separate from your Training Module quizzes — one-off quizzes sent out by admins.')}</p>
    </section>
    <div class="card">
      ${sectionHeader('pending', 'New / Not completed', pending.length)}
      ${quizListSectionOpen.pending ? `<div class="grid" style="margin-top:14px;">${pending.map(q=>quizCard(q,false)).join("") || '<p style="color:var(--text-faint);font-size:13px;">Nothing here.</p>'}</div>` : ""}
    </div>
    <div class="card" style="margin-top:16px;">
      ${sectionHeader('completed', 'Completed', completed.length)}
      ${quizListSectionOpen.completed ? `<div class="grid" style="margin-top:14px;">${completed.map(q=>quizCard(q,false)).join("") || '<p style="color:var(--text-faint);font-size:13px;">Nothing here yet.</p>'}</div>` : ""}
    </div>
    ${canManageQuizzes ? `
    <div class="card" style="margin-top:16px;">
      ${sectionHeader('sent', 'Sent Quizzes', activeSent.length)}
      ${quizListSectionOpen.sent ? `<p style="color:var(--text-dim);font-size:13.5px;margin:14px 0;">Every quiz you've created or sent, not yet fully complete. Click a sent quiz to see who's completed it and grade long-answer responses. Click a draft to keep editing it. Deleting a quiz here removes it — and everyone's completed results — everywhere.</p><div class="grid">${activeSent.map(q=>quizCard(q,true)).join("") || '<p style="color:var(--text-faint);font-size:13px;">Nothing here yet.</p>'}</div>` : ""}
    </div>
    <div class="card" style="margin-top:16px;">
      ${sectionHeader('sentCompleted', 'Fully Completed', fullyCompleteSent.length)}
      ${quizListSectionOpen.sentCompleted ? `<p style="color:var(--text-dim);font-size:13.5px;margin:14px 0;">Everyone eligible has completed and been fully graded on these.</p><div class="grid">${fullyCompleteSent.map(q=>quizCard(q,true)).join("") || '<p style="color:var(--text-faint);font-size:13px;">Nothing here yet.</p>'}</div>` : ""}
    </div>` : ""}
    ${addBtn}
  `);
  root.querySelectorAll("[data-quiz-dept]").forEach(el=> el.addEventListener("click", ()=>{
    activeDepartment = el.getAttribute("data-quiz-dept");
    render();
  }));
  root.querySelectorAll("[data-quiz-section-toggle]").forEach(el=> el.addEventListener("click", ()=>{
    const key = el.getAttribute("data-quiz-section-toggle");
    quizListSectionOpen[key] = !quizListSectionOpen[key];
    render();
  }));
  root.querySelectorAll("[data-quiz-delete]").forEach(el=> el.addEventListener("click", async (e)=>{
    e.stopPropagation();
    const id = el.getAttribute("data-quiz-delete");
    const q = QUIZZES.find(x=>x.id===id);
    if(!confirm(`Delete "${q?q.title:'this quiz'}"? This removes it — and everyone's completed results — for good.`)) return;
    const { error } = await supabase.from("standalone_quizzes").delete().eq("id", id);
    if(error){ alert("Couldn't delete: " + error.message); return; }
    logEdit("deleted", "standalone_quiz", q?q.title:'');
    await loadStandaloneQuizzes();
    render();
  }));
  root.querySelectorAll("[data-quiz-open]").forEach(el=> el.addEventListener("click", async ()=>{
    const id = el.getAttribute("data-quiz-open");
    const forManagement = el.getAttribute("data-quiz-manage") === "1";
    const q = QUIZZES.find(x=>x.id===id);
    if(forManagement){
      if(!q.sent){ await openQuizBuilder(id); return; } // draft — keep editing
      await openQuizSentDetail(id); return; // sent — view progress & grade
    }
    currentQuizId = id;
    if(q.myAttempt){ await loadStandaloneQuizzes(); view = "quiz-result-standalone"; render(); }
    else { quizTakeAnswers = {}; view = "quiz-take"; render(); }
  }));
  const addBtn2 = document.getElementById("add-quiz");
  if(addBtn2) addBtn2.addEventListener("click", createNewStandaloneQuiz);
}

let quizSentDetailQuiz = null;
let quizSentDetailRoster = [];
let quizSentDetailExpandedId = null;

async function openQuizSentDetail(quizId){
  const { data: quiz } = await supabase.from("standalone_quizzes").select("*").eq("id", quizId).single();
  if(!quiz){ alert("Couldn't load that quiz."); return; }
  const { data: questions } = await supabase.from("standalone_quiz_questions").select("*").eq("quiz_id", quizId).order("sort_order");
  quizSentDetailQuiz = { ...quiz, questions: (questions||[]).map(qq=>({ id:qq.id, type:qq.question_type, question:qq.question, options:qq.options||[], correct:qq.correct_index, explain:qq.explanation||"" })) };
  quizSentDetailExpandedId = null;
  await refreshQuizSentDetailRoster();
  view = "quiz-sent-detail"; render();
}

async function refreshQuizSentDetailRoster(){
  const quiz = quizSentDetailQuiz;
  if(!quiz) return;
  const { data: attempts } = await supabase.from("standalone_quiz_attempts").select("*").eq("quiz_id", quiz.id);
  const { data: allProfiles } = await supabase.from("profiles").select("id,name,role");
  let eligibleIds = [];
  if(quiz.audience_type === "everyone"){
    eligibleIds = (allProfiles||[]).map(p=>p.id);
  } else if(quiz.audience_type === "team"){
    const { data: members } = await supabase.from("team_members").select("user_id").eq("team_id", quiz.team_id);
    eligibleIds = (members||[]).map(m=>m.user_id);
  } else {
    const { data: recipients } = await supabase.from("standalone_quiz_recipients").select("user_id").eq("quiz_id", quiz.id);
    eligibleIds = (recipients||[]).map(r=>r.user_id);
  }
  quizSentDetailRoster = eligibleIds.map(uid=>{
    const person = (allProfiles||[]).find(p=>p.id===uid);
    const attempt = (attempts||[]).find(a=>a.user_id===uid);
    return { id:uid, name: person?person.name:'Unknown', completed: !!attempt, needsGrading: !!attempt && !attempt.graded };
  }).sort((a,b)=> a.name.localeCompare(b.name));
}

function renderQuizSentDetail(){
  const quiz = quizSentDetailQuiz;
  if(!quiz){ view="quizzes"; render(); return; }
  const completedCount = quizSentDetailRoster.filter(r=>r.completed).length;
  const rows = quizSentDetailRoster.map(r=>{
    const expanded = quizSentDetailExpandedId === r.id;
    const pillCls = r.needsGrading ? 'progress' : r.completed ? 'done' : '';
    const pillLabel = r.needsGrading ? 'Needs grading' : r.completed ? 'Completed' : 'Not completed';
    const mainRow = `<tr class="team-row-main" data-sent-detail-toggle="${r.id}" style="cursor:${r.completed?'pointer':'default'};">
      <td>${escapeHtml(r.name)}</td>
      <td><span class="status-pill ${pillCls}">${pillLabel}</span></td>
      <td style="text-align:center;color:var(--text-faint);">${r.completed?(expanded?'▾':'▸'):''}</td>
    </tr>`;
    const detailRow = (expanded && r.completed) ? `<tr class="team-row-detail"><td colspan="3"><div id="sent-detail-answers-${r.id}" style="padding:10px 4px 16px;"></div></td></tr>` : "";
    return mainRow + detailRow;
  }).join("");

  renderShell(`
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <div class="k-label">SENT QUIZ</div>
        <button class="mini-btn danger" id="sent-detail-delete">Delete quiz</button>
      </div>
      <h2 style="margin-bottom:4px;">${escapeHtml(quiz.title)}</h2>
      <p style="color:var(--text-dim);font-size:13.5px;margin:0 0 20px;">${completedCount}/${quizSentDetailRoster.length} (${quizSentDetailRoster.length?Math.round((completedCount/quizSentDetailRoster.length)*100):0}%) completed. Click a completed person to see their answers and grade any long-answer responses.</p>
      <div style="overflow-x:auto;"><table class="team"><thead><tr><th>Name</th><th>Status</th><th></th></tr></thead><tbody>${rows || `<tr><td colspan="3" style="color:var(--text-faint);font-size:13px;padding:16px 4px;">No one is eligible for this quiz yet.</td></tr>`}</tbody></table></div>
      <div class="nav-buttons"><button class="btn" id="sent-detail-back">← Back to Quizzes</button><div></div></div>
    </div>
  `);
  document.getElementById("sent-detail-back").addEventListener("click", ()=>{ view="quizzes"; render(); });
  document.getElementById("sent-detail-delete").addEventListener("click", async ()=>{
    if(!confirm(`Delete "${quiz.title}"? This removes it — and everyone's completed results — for good.`)) return;
    const { error } = await supabase.from("standalone_quizzes").delete().eq("id", quiz.id);
    if(error){ alert("Couldn't delete: " + error.message); return; }
    logEdit("deleted", "standalone_quiz", quiz.title);
    quizSentDetailQuiz = null;
    await loadStandaloneQuizzes();
    view = "quizzes"; render();
  });
  root.querySelectorAll("[data-sent-detail-toggle]").forEach(el=> el.addEventListener("click", async ()=>{
    const uid = el.getAttribute("data-sent-detail-toggle");
    const r = quizSentDetailRoster.find(x=>x.id===uid);
    if(!r || !r.completed) return;
    quizSentDetailExpandedId = (quizSentDetailExpandedId === uid) ? null : uid;
    render();
    if(quizSentDetailExpandedId === uid) await showStandaloneQuizAttemptDetail(uid, quiz.id, `sent-detail-answers-${uid}`, r.name);
  }));
}

    if(qq.type === "long_answer"){

    }
    const opts = (qq.options||[]).map((opt,oi)=>`<div class="opt-row"><input type="radio" name="qtake-${qq.id}" data-quiz-mc="${qq.id}" value="${oi}" ${quizTakeAnswers[qq.id]===oi?'checked':''}> <span>${escapeHtml(opt)}</span></div>`).join("");
    return `<div class="sub-card"><div class="sub-card-head"><span class="tag">QUESTION ${i+1}</span></div>

      <div class="nav-buttons"><button class="btn" id="quiz-take-back">← Back to Quizzes</button><button class="btn primary" id="submit-standalone-quiz">Submit Quiz</button></div>
    </div>
  `);
  document.getElementById("quiz-take-back").addEventListener("click", ()=>{ view="quizzes"; render(); });
  root.querySelectorAll("[data-quiz-mc]").forEach(el=> el.addEventListener("change", (e)=>{ quizTakeAnswers[el.getAttribute("data-quiz-mc")] = +e.target.value; }));
  root.querySelectorAll("[data-quiz-longanswer]").forEach(el=> el.addEventListener("input", (e)=>{ quizTakeAnswers[el.getAttribute("data-quiz-longanswer")] = e.target.value; }));
  document.getElementById("submit-standalone-quiz").addEventListener("click", submitStandaloneQuiz);
}

async function submitStandaloneQuiz(){
  const q = QUIZZES.find(x=>x.id===currentQuizId);
  if(!q) return;
  let mcScore = 0, mcTotal = 0;
  const answers = [];
  let longAnswerHtml = "";
  let hasLongAnswer = false;
  q.questions.forEach(qq=>{
    if(qq.type === "multiple_choice"){
      mcTotal++;
      const selected = quizTakeAnswers[qq.id];
      const isCorrect = selected === qq.correct;
      if(isCorrect) mcScore++;
      answers.push({ question_id:qq.id, question:qq.question, type:"multiple_choice", options:qq.options, selected, correct:qq.correct, is_correct:isCorrect });
    } else {
      hasLongAnswer = true;
      const text = (quizTakeAnswers[qq.id]||"").trim();
      answers.push({ question_id:qq.id, question:qq.question, type:"long_answer", answer:text });
      if(text) longAnswerHtml += `<p><strong>${escapeHtml(qq.question)}</strong><br>${escapeHtml(text)}</p>`;
    }
  });
  const submitBtn = document.getElementById("submit-standalone-quiz");
  if(submitBtn){ submitBtn.disabled = true; submitBtn.textContent = "Submitting…"; }
  const { error } = await supabase.from("standalone_quiz_attempts").insert({ quiz_id:q.id, user_id:session.user.id, user_name:profile.name, answers, mc_score:mcScore, mc_total:mcTotal, graded: !hasLongAnswer });
  if(error){
    alert("Couldn't submit: " + error.message);
    if(submitBtn){ submitBtn.disabled = false; submitBtn.textContent = "Submit Quiz"; }
    return;
  }
  if(hasLongAnswer && q.createdBy){
    await Promise.resolve(supabase.from("messages").insert({ sender_id:session.user.id, sender_name:profile.name, recipient_id:q.createdBy, audience:"user", type:"reply", claimed_by:q.createdBy, related_quiz_id:q.id, related_quiz_user_id:session.user.id, body:`<p>📝 ${escapeHtml(profile.name)} submitted long-answer responses for the quiz "${escapeHtml(q.title)}" — grade it below, then reply to send them feedback.</p>${longAnswerHtml}` })).catch(()=>{});
  }
  // Attach the just-submitted attempt immediately, in memory — the results
  // page no longer depends on a fresh reload finding it, which was the
  // cause of getting stuck on the submit screen.
  q.myAttempt = { quiz_id:q.id, user_id:session.user.id, user_name:profile.name, answers, mc_score:mcScore, mc_total:mcTotal, graded: !hasLongAnswer };
  showToast(hasLongAnswer ? "Submitted — your long answers are awaiting grading." : "Quiz submitted.");
  view = "quizzes"; render();
  loadStandaloneQuizzes().catch(()=>{}); // refresh in the background, doesn't block the transition
}

function renderQuizResultStandalone(){
  const q = QUIZZES.find(x=>x.id===currentQuizId);
  if(!q || !q.myAttempt){ view="quizzes"; render(); return; }
  const a = q.myAttempt;
  const longAnswerAnswers = (a.answers||[]).filter(ans=>ans.type==="long_answer");
  const longAnswerCorrect = longAnswerAnswers.filter(ans=>ans.is_correct===true).length;
  const totalQ = (a.mc_total||0) + longAnswerAnswers.length;
  const totalCorrect = (a.mc_score||0) + longAnswerCorrect;

  const rows = (a.answers||[]).map(ans=>{
    if(ans.type === "long_answer"){
      const gradeTag = !a.graded
        ? `<span class="tag" style="margin-left:6px;color:var(--amber);border-color:var(--amber-dim);">AWAITING GRADING</span>`
        : (ans.is_correct ? `<span class="tag" style="margin-left:6px;color:var(--green);border-color:var(--green-dim);">CORRECT</span>` : `<span class="tag" style="margin-left:6px;color:var(--red);border-color:var(--red-dim);">INCORRECT</span>`);
      return `<div class="sub-card"><div style="font-size:14px;margin-bottom:6px;color:var(--text);"><strong>${escapeHtml(ans.question)}</strong> ${gradeTag}</div><div style="font-size:13px;color:var(--text-dim);white-space:pre-wrap;">${escapeHtml(ans.answer || '(no answer)')}</div></div>`;
    }
    const selectedText = ans.selected!=null ? ans.options[ans.selected] : "(no answer)";
    const correctText = ans.options[ans.correct];
    return `<div class="sub-card"><div style="font-size:14px;margin-bottom:6px;color:var(--text);"><strong>${escapeHtml(ans.question)}</strong></div>
      <div style="font-size:13px;color:${ans.is_correct?'var(--green)':'var(--red)'};">Your answer: ${escapeHtml(selectedText)}</div>
      ${!ans.is_correct?`<div style="font-size:13px;color:var(--green);">Correct answer: ${escapeHtml(correctText)}</div>`:''}
    </div>`;
  }).join("");
  renderShell(`
    <div class="card">
      <div class="k-label">QUIZ SUBMITTED</div>
      <h2 style="margin-bottom:6px;">${escapeHtml(q.title)}</h2>
      ${a.graded
        ? `<p style="color:var(--text-dim);font-size:14px;margin-bottom:16px;">${totalCorrect}/${totalQ} correct (${totalQ ? Math.round((totalCorrect/totalQ)*100) : 0}%)</p>`
        : (a.mc_total ? `<p style="color:var(--text-dim);font-size:14px;margin-bottom:16px;">${a.mc_score}/${a.mc_total} multiple choice correct so far</p>` : "")}
      ${!a.graded ? `<p style="color:var(--amber);font-size:13px;margin-bottom:16px;">⏳ Your long-answer responses are waiting to be graded. Your final score will update once that's done.</p>` : ""}
      ${rows}
      <div class="nav-buttons"><div></div><button class="btn primary" id="back-to-quizzes">Back to Quizzes</button></div>
    </div>
  `);
  document.getElementById("back-to-quizzes").addEventListener("click", ()=>{ view="quizzes"; render(); });
}

async function openQuizBuilder(id){
  if(!TEAMS_LIST.length){
    const { data: teamsData } = await supabase.from("teams").select("*").order("name");
    const { data: memberships } = await supabase.from("team_members").select("*");
    TEAMS_LIST = (teamsData||[]).map(t=>({ id:t.id, name:t.name, department:t.department||'TS', memberIds:(memberships||[]).filter(m=>m.team_id===t.id).map(m=>m.user_id) }));
  }
  if(!teamRows.length){
    const { data: people } = await supabase.from("profiles").select("*").order("name");
    teamRows = (people||[]).map(p=>({ id:p.id, name:p.name, role:p.role, perModule:{}, perModuleRaw:{}, overall:0, mastered:0, teamIds:[], canAccessTs:!!p.can_access_ts, canAccessCs:!!p.can_access_cs }));
  }
  const { data: qRow } = await supabase.from("standalone_quizzes").select("*").eq("id", id).single();
  const { data: questions } = await supabase.from("standalone_quiz_questions").select("*").eq("quiz_id", id).order("sort_order");
  const { data: recipients } = await supabase.from("standalone_quiz_recipients").select("user_id").eq("quiz_id", id);
  quizBuilderDraft = {
    id, title:qRow.title, audienceType:qRow.audience_type, teamId:qRow.team_id, sent:qRow.sent, department:qRow.department||'TS',
    specificIds: (recipients||[]).map(r=>r.user_id),
    questions: (questions||[]).map(q=>({ id:q.id, type:q.question_type, question:q.question, options:q.options||["Option A","Option B"], correct:q.correct_index||0, explain:q.explanation||"" }))
  };
  expandedQuizQuestionIdx = null;
  view = "quiz-builder"; render();
}

let quizTitleAutosaveTimer = null;
let quizQuestionAutosaveTimers = {};

function renderQuizBuilder(){
  const d = quizBuilderDraft;
  const locked = d.sent; // audience/team/people can't change after sending

  const questionsHtml = d.questions.map((q,i)=>{
    if(i === expandedQuizQuestionIdx){
      const typeToggle = `<div class="field"><label>Question type</label>
        <select data-qz-type="${i}">
          <option value="multiple_choice" ${q.type==='multiple_choice'?'selected':''}>Multiple choice</option>
          <option value="long_answer" ${q.type==='long_answer'?'selected':''}>Long answer</option>
        </select></div>`;
      const mcFields = q.type==="multiple_choice" ? `
        <div class="field"><label>Options (select correct)</label>
          ${q.options.map((opt,oi)=>`<div class="opt-row"><input type="radio" name="qzcorrect-${i}" data-qz-correct="${i}" value="${oi}" ${q.correct===oi?'checked':''}><input type="text" data-qz-opt="${i}:${oi}" value="${escapeHtml(opt)}"><button class="mini-btn danger" data-qz-opt-del="${i}:${oi}" ${q.options.length<=2?'disabled':''}>✕</button></div>`).join("")}
          <button class="mini-btn" data-qz-opt-add="${i}" style="margin-top:4px;">+ Add option</button>
        </div>
        <div class="field"><label>Explanation (optional)</label><textarea data-qz-explain="${i}" style="min-height:50px;">${escapeHtml(q.explain)}</textarea></div>` : "";
      return `<div class="sub-card"><div class="sub-card-head"><span class="tag">QUESTION ${i+1} · EDITING</span><div style="display:flex;align-items:center;gap:10px;"><span id="qz-save-status-${i}" style="font-size:11px;color:var(--text-faint);font-family:var(--mono);"></span><button class="mini-btn danger" data-qz-del="${i}">Delete</button></div></div>
        ${typeToggle}
        <div class="field"><label>Question</label><textarea data-qz-text="${i}" style="min-height:55px;">${escapeHtml(q.question)}</textarea></div>
        ${mcFields}
        <div class="nav-buttons"><div></div><button class="btn primary" data-qz-done="${i}">Done</button></div>
      </div>`;
    }
    return `<div class="sub-card"><div class="sub-card-head"><span class="tag">QUESTION ${i+1}${q.question?' · '+escapeHtml(q.question.slice(0,50))+(q.question.length>50?'…':''):''} · ${q.type==='long_answer'?'LONG ANSWER':'MULTIPLE CHOICE'}</span>
      <div class="mini-tools"><button class="mini-btn" data-qz-edit="${i}">Edit</button><button class="mini-btn danger" data-qz-del="${i}">Delete</button></div></div>
    </div>`;
  }).join("");

  const audienceSection = `
    <div class="field"><label>Department</label><p style="color:var(--text-dim);font-size:13px;margin:0;">${d.department==='CS'?'Customer Service':'Tech Support'} — set when the quiz was created.</p></div>
    <div class="field"><label>Send to</label>
      <select id="qz-audience" ${locked?'disabled':''}>
        <option value="everyone" ${d.audienceType==='everyone'?'selected':''}>Everyone</option>
        <option value="team" ${d.audienceType==='team'?'selected':''}>A specific team…</option>
        <option value="specific" ${d.audienceType==='specific'?'selected':''}>Specific people…</option>
      </select>
    </div>
    ${d.audienceType==='team' ? `<div class="field" id="qz-team-field"><label>Team</label><select id="qz-team-select" ${locked?'disabled':''}>${TEAMS_LIST.filter(t=>t.department===d.department).map(t=>`<option value="${t.id}" ${d.teamId===t.id?'selected':''}>${escapeHtml(t.name)}</option>`).join("") || '<option value="">No teams in this department yet</option>'}</select></div>` : ""}
    ${d.audienceType==='specific' ? `<div class="field" id="qz-people-field"><label>Choose people</label><div id="qz-people-list" style="max-height:170px;overflow-y:auto;border:1px solid var(--stroke);border-radius:8px;padding:10px;">${teamRows.filter(r=> d.department==='CS' ? r.canAccessCs : r.canAccessTs).map(r=>`<label style="display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px;color:var(--text);"><input type="checkbox" value="${r.id}" class="qz-person-check" ${d.specificIds.includes(r.id)?'checked':''} ${locked?'disabled':''}> ${escapeHtml(r.name)}</label>`).join("")}</div></div>` : ""}
  `;

  renderShell(`
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <div class="k-label">${d.sent ? "SENT QUIZ" : "DRAFT QUIZ"}</div>
        <span id="qz-title-save-status" style="font-size:11px;color:var(--text-faint);font-family:var(--mono);"></span>
      </div>
      <div class="field"><label>Quiz title</label><input type="text" id="qz-title" value="${escapeHtml(d.title)}"></div>
      ${audienceSection}
      <div class="editor-section"><div class="editor-section-head"><h3>Questions</h3></div>${questionsHtml || '<p style="color:var(--text-faint);font-size:13px;">No questions yet.</p>'}<button class="dashed-btn" id="add-qz-question">+ Add question</button></div>
      <div class="nav-buttons"><div style="display:flex;gap:10px;"><button class="btn" id="qz-back">← Back</button><button class="btn danger" id="qz-delete">Delete quiz</button></div>
      ${!d.sent ? `<button class="btn primary" id="qz-send">Send quiz →</button>` : `<span class="status-pill done">Sent</span>`}</div>
      ${!d.sent ? `<p style="color:var(--text-faint);font-size:11.5px;font-family:var(--mono);margin-top:10px;">Questions save automatically. Nobody can see this quiz until you send it.</p>` : ""}
    </div>
  `);
  wireQuizBuilderEvents();
}

function wireQuizBuilderEvents(){
  const d = quizBuilderDraft;

  document.getElementById("qz-back").addEventListener("click", async ()=>{ await loadStandaloneQuizzes(); view="quizzes"; render(); });
  document.getElementById("qz-delete").addEventListener("click", async ()=>{
    if(confirm(`Delete "${d.title||'this quiz'}"? This can't be undone.`)){
      await supabase.from("standalone_quizzes").delete().eq("id", d.id);
      logEdit("deleted", "standalone_quiz", d.title);
      await loadStandaloneQuizzes(); view="quizzes"; render();
    }
  });

  const titleInput = document.getElementById("qz-title");
  titleInput.addEventListener("input", (e)=>{
    d.title = e.target.value;
    const statusEl = document.getElementById("qz-title-save-status");
    if(statusEl){ statusEl.textContent = "Saving…"; statusEl.style.color = "var(--text-faint)"; }
    clearTimeout(quizTitleAutosaveTimer);
    quizTitleAutosaveTimer = setTimeout(async ()=>{
      const { error } = await silentSave(()=> supabase.from("standalone_quizzes").update({ title:d.title }).eq("id", d.id));
      const el = document.getElementById("qz-title-save-status");
      if(el){ if(error){ el.textContent="Couldn't save: "+error.message; el.style.color="var(--red)"; } else { el.textContent="Saved"; el.style.color="var(--green)"; } }
    }, 600);
  });

  const audienceSelect = document.getElementById("qz-audience");
  if(audienceSelect) audienceSelect.addEventListener("change", (e)=>{ d.audienceType = e.target.value; renderQuizBuilder(); });
  const teamSelect = document.getElementById("qz-team-select");
  if(teamSelect) teamSelect.addEventListener("change", (e)=>{ d.teamId = e.target.value; });

  root.querySelectorAll("[data-qz-edit]").forEach(el=> el.addEventListener("click", ()=>{ expandedQuizQuestionIdx = +el.dataset.qzEdit; renderQuizBuilder(); }));
  root.querySelectorAll("[data-qz-done]").forEach(el=> el.addEventListener("click", ()=>{ expandedQuizQuestionIdx = null; renderQuizBuilder(); }));
  root.querySelectorAll("[data-qz-del]").forEach(el=> el.addEventListener("click", async ()=>{
    const i = +el.dataset.qzDel;
    if(!confirm("Delete this question?")) return;
    const { error } = await supabase.from("standalone_quiz_questions").delete().eq("id", d.questions[i].id);
    if(error){ alert("Couldn't delete: " + error.message); return; }
    d.questions.splice(i,1);
    if(expandedQuizQuestionIdx===i) expandedQuizQuestionIdx=null;
    renderQuizBuilder();
  }));

  function scheduleQuestionAutosave(i){
    const q = d.questions[i];
    const statusEl = document.getElementById(`qz-save-status-${i}`);
    if(statusEl){ statusEl.textContent = "Saving…"; statusEl.style.color = "var(--text-faint)"; }
    clearTimeout(quizQuestionAutosaveTimers[q.id]);
    quizQuestionAutosaveTimers[q.id] = setTimeout(async ()=>{
      const { error } = await silentSave(()=> supabase.from("standalone_quiz_questions").update({
        question_type:q.type, question:q.question,
        options: q.type==="multiple_choice" ? q.options : null,
        correct_index: q.type==="multiple_choice" ? q.correct : null,
        explanation: q.explain
      }).eq("id", q.id));
      const el = document.getElementById(`qz-save-status-${i}`);
      if(el){ if(error){ el.textContent="Couldn't save: "+error.message; el.style.color="var(--red)"; } else { el.textContent="Saved"; el.style.color="var(--green)"; } }
    }, 600);
  }
  root.querySelectorAll("[data-qz-type]").forEach(el=> el.addEventListener("change", (e)=>{ const i=+el.dataset.qzType; d.questions[i].type=e.target.value; scheduleQuestionAutosave(i); renderQuizBuilder(); }));
  root.querySelectorAll("[data-qz-text]").forEach(el=> el.addEventListener("input", (e)=>{ const i=+el.dataset.qzText; d.questions[i].question=e.target.value; scheduleQuestionAutosave(i); }));
  root.querySelectorAll("[data-qz-explain]").forEach(el=> el.addEventListener("input", (e)=>{ const i=+el.dataset.qzExplain; d.questions[i].explain=e.target.value; scheduleQuestionAutosave(i); }));
  root.querySelectorAll("[data-qz-opt]").forEach(el=> el.addEventListener("input", (e)=>{ const [qi,oi]=el.dataset.qzOpt.split(":").map(Number); d.questions[qi].options[oi]=e.target.value; scheduleQuestionAutosave(qi); }));
  root.querySelectorAll("[data-qz-correct]").forEach(el=> el.addEventListener("change", (e)=>{ const i=+el.dataset.qzCorrect; d.questions[i].correct=+e.target.value; scheduleQuestionAutosave(i); }));
  root.querySelectorAll("[data-qz-opt-add]").forEach(el=> el.addEventListener("click", ()=>{ const i=+el.dataset.qzOptAdd; d.questions[i].options.push("New option"); scheduleQuestionAutosave(i); renderQuizBuilder(); }));
  root.querySelectorAll("[data-qz-opt-del]").forEach(el=> el.addEventListener("click", ()=>{
    const [qi,oi]=el.dataset.qzOptDel.split(":").map(Number); if(d.questions[qi].options.length<=2) return;
    d.questions[qi].options.splice(oi,1);
    if(d.questions[qi].correct===oi) d.questions[qi].correct=0; else if(d.questions[qi].correct>oi) d.questions[qi].correct-=1;
    scheduleQuestionAutosave(qi); renderQuizBuilder();
  }));

  document.getElementById("add-qz-question").addEventListener("click", async ()=>{
    const { data, error } = await supabase.from("standalone_quiz_questions").insert({ quiz_id:d.id, sort_order:d.questions.length, question_type:"multiple_choice", question:"New question", options:["Option A","Option B"], correct_index:0, explanation:"" }).select().single();
    if(error){ alert("Couldn't add question: " + error.message); return; }
    d.questions.push({ id:data.id, type:data.question_type, question:data.question, options:data.options, correct:data.correct_index, explain:data.explanation||"" });
    expandedQuizQuestionIdx = d.questions.length-1;
    renderQuizBuilder();
  });

  root.querySelectorAll(".qz-person-check").forEach(cb=> cb.addEventListener("change", ()=>{
    d.specificIds = Array.from(document.querySelectorAll(".qz-person-check:checked")).map(c=>c.value);
  }));

  const sendBtn = document.getElementById("qz-send");
  if(sendBtn) sendBtn.addEventListener("click", async ()=>{
    if(!d.title.trim()){ alert("Give the quiz a title first."); return; }
    if(!d.questions.length){ alert("Add at least one question first."); return; }
    if(d.audienceType==="team" && !d.teamId){ alert("Pick a team first."); return; }
    if(d.audienceType==="specific" && !d.specificIds.length){ alert("Pick at least one person first."); return; }
    sendBtn.disabled = true; sendBtn.textContent = "Sending…";

    // Recipient list first, and checked for real errors — this is what actually
    // determines who can see the quiz, so it must never fail silently.
    if(d.audienceType==="specific"){
      const { error: delErr } = await Promise.resolve(supabase.from("standalone_quiz_recipients").delete().eq("quiz_id", d.id));
      if(delErr){ alert("Couldn't set up recipients: " + delErr.message); sendBtn.disabled = false; sendBtn.textContent = "Send quiz →"; return; }
      const { error: recErr } = await Promise.resolve(supabase.from("standalone_quiz_recipients").insert(d.specificIds.map(uid=>({ quiz_id:d.id, user_id:uid }))));
      if(recErr){ alert("Couldn't send to the people you picked: " + recErr.message); sendBtn.disabled = false; sendBtn.textContent = "Send quiz →"; return; }
    }

    const { error } = await supabase.from("standalone_quizzes").update({ audience_type:d.audienceType, team_id: d.audienceType==="team"?d.teamId:null, sent:true }).eq("id", d.id);
    if(error){ alert("Couldn't send: " + error.message); sendBtn.disabled = false; sendBtn.textContent = "Send quiz →"; return; }

    d.sent = true;
    logEdit("sent", "standalone_quiz", d.title);
    showToast("Quiz sent.");
    await loadStandaloneQuizzes();
    view = "quizzes"; render();
    // Notify whoever it was sent to (best-effort — never let this block the UI from updating).
    (async ()=>{
      const recipientRole = d.audienceType==="everyone" ? null : d.audienceType==="team" ? "team" : "specific";
      const { data: annData } = await Promise.resolve(supabase.from("messages").insert({
        sender_id: session.user.id, sender_name: profile.name, audience:"all", type:"announcement",
        body: `<p>📝 New quiz available: <strong>${escapeHtml(d.title)}</strong>. Head to Quizzes to take it.</p>`,
        recipient_role: recipientRole,
        team_id: d.audienceType==="team" ? d.teamId : null
      }).select().single()).catch(()=>({ data:null }));
      if(d.audienceType==="specific" && annData){
        await Promise.resolve(supabase.from("announcement_recipients").insert(d.specificIds.map(uid=>({ message_id: annData.id, user_id: uid })))).catch(()=>{});
      }
      await loadStandaloneQuizzes().catch(()=>{});
    })();
  });
}

   ANALYZE (admin only) — team-wide trends
