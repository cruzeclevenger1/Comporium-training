function launchConfetti(){
  const colors = ['#f5a623','#2ecc71','#00d4ff','#e74c3c','#a78bfa'];
  const container = document.createElement('div');
  container.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:850;overflow:hidden;';
  document.body.appendChild(container);
  for(let i=0;i<80;i++){
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    const size = 6 + Math.random()*6;
    piece.style.left = (Math.random()*100) + 'vw';
    piece.style.background = colors[Math.floor(Math.random()*colors.length)];
    piece.style.width = size + 'px';
    piece.style.height = (size*1.6) + 'px';
    piece.style.borderRadius = Math.random()>0.5 ? '50%' : '2px';
    piece.style.animationDuration = (2.2 + Math.random()*1.6) + 's';
    piece.style.animationDelay = (Math.random()*0.4) + 's';
    container.appendChild(piece);
  }
  setTimeout(()=> container.remove(), 4200);
}

function showToast(text, onClickFn){
  const el = document.createElement("div");
  el.className = "app-toast";
  el.textContent = text;
  el.addEventListener("click", ()=>{ el.remove(); (onClickFn || openNotifications)(); });
  document.body.appendChild(el);
  setTimeout(()=>{ el.classList.add("out"); setTimeout(()=>el.remove(), 300); }, 6000);
}

function setupRealtime(){
  teardownRealtime();
  const chMyProfile = supabase.channel("rt-my-profile-"+session.user.id)
    .on("postgres_changes", { event:"UPDATE", schema:"public", table:"profiles", filter:`id=eq.${session.user.id}` }, async ()=>{
      const oldP = profile;
      await loadProfile(); // re-fetch from source of truth rather than trusting the realtime payload directly —
                            // safer against payload-shape surprises and against two rapid updates racing each other
      const changed = !oldP || oldP.can_access_ts !== profile.can_access_ts || oldP.can_access_cs !== profile.can_access_cs || oldP.can_access_testboard !== profile.can_access_testboard
        || oldP.role !== profile.role || oldP.perm_edit_content !== profile.perm_edit_content
        || oldP.perm_create_quizzes !== profile.perm_create_quizzes || oldP.perm_manage_people !== profile.perm_manage_people;
      if(changed){
        showToast("Your access was updated.");
        activeDepartment = null; refActiveDepartment = null; // let it re-pick a sensible default under the new access
        await loadEverything();
        render();
      }
    }).subscribe();
  realtimeChannels.push(chMyProfile);

  const chAnnounce = supabase.channel("rt-announcements-"+session.user.id)
    .on("postgres_changes", { event:"INSERT", schema:"public", table:"messages", filter:"audience=eq.all" }, (payload)=>{
      if(payload.new.sender_id === session.user.id) return;
      showToast("📣 " + stripHtml(payload.new.body).slice(0,90), openNotifications);
      if(view==="notifications" || view==="chat") refreshMessagingView(); else loadAllNotifications().then(render);
    }).subscribe();
  realtimeChannels.push(chAnnounce);

  const chToMe = supabase.channel("rt-to-me-"+session.user.id)
    .on("postgres_changes", { event:"INSERT", schema:"public", table:"messages", filter:`recipient_id=eq.${session.user.id}` }, (payload)=>{
      showToast("💬 " + escapeHtml(payload.new.sender_name) + ": " + stripHtml(payload.new.body).slice(0,70), ()=>openChat());
      if(view==="notifications" || view==="chat") refreshMessagingView(); else loadAllNotifications().then(render);
    }).subscribe();
  realtimeChannels.push(chToMe);

  if(isAdmin()){
    const chAdmin = supabase.channel("rt-admin-inbox-"+session.user.id)
      .on("postgres_changes", { event:"INSERT", schema:"public", table:"messages", filter:"audience=eq.admins" }, (payload)=>{
        if(payload.new.thread_id || payload.new.sender_id === session.user.id) return;
        showToast("🚩 New item waiting in the admin inbox", openNotifications);
        if(view==="notifications" || view==="chat") refreshMessagingView(); else loadAllNotifications().then(render);
      }).subscribe();
    realtimeChannels.push(chAdmin);
  }

  // Discarding a conversation deletes rows — without listening for DELETE too,
  // the other participant would never see it disappear until they refresh.
  const chDeletes = supabase.channel("rt-deletes-"+session.user.id)
    .on("postgres_changes", { event:"DELETE", schema:"public", table:"messages" }, ()=>{
      if(view==="notifications" || view==="chat") refreshMessagingView(); else loadAllNotifications().then(render);
    }).subscribe();
  realtimeChannels.push(chDeletes);
}
function teardownRealtime(){ realtimeChannels.forEach(ch=> supabase.removeChannel(ch)); realtimeChannels = []; }

    <div class="modal-error" id="edit-person-error" style="display:none;"></div>

    <div class="field"><label>Name</label><p style="color:var(--text-dim);font-size:12.5px;margin:0 0 6px;">Current name: ${escapeHtml(name)}</p><input type="text" id="edit-person-name" value="${escapeHtml(name)}" ${noAutofillAttrs}></div>
    <div class="field"><label>Email</label><p style="color:var(--text-dim);font-size:12.5px;margin:0 0 6px;" id="edit-person-current-email">Current email: Loading…</p><input type="email" id="edit-person-email" placeholder="Leave blank to keep current email" ${noAutofillAttrs}></div>
    <div class="modal-actions" style="margin-bottom:22px;"><div></div><button class="btn primary" id="edit-person-save-name">Save changes</button></div>

    <div style="border-top:1px solid var(--stroke);padding-top:16px;margin-bottom:18px;">
      <label style="font-size:11.5px;color:var(--text-faint);font-family:var(--mono);display:block;margin-bottom:10px;letter-spacing:.05em;">RESET PASSWORD</label>
      <div class="field"><input type="password" id="edit-person-pw1" placeholder="New password (at least 6 characters)" ${noAutofillPwAttrs}></div>
      <div class="field"><input type="password" id="edit-person-pw2" placeholder="Confirm new password" ${noAutofillPwAttrs}></div>
      <div class="modal-actions"><div></div><button class="btn" id="edit-person-reset-pw">Reset password</button></div>
    </div>

    <div style="border-top:1px solid var(--stroke);padding-top:16px;">
      <label style="font-size:11.5px;color:var(--red);font-family:var(--mono);display:block;margin-bottom:10px;letter-spacing:.05em;">DANGER ZONE</label>
      <div class="field"><input type="password" id="edit-person-delete-pw" placeholder="Type YOUR password to confirm deletion"></div>
      <div class="modal-actions"><button class="btn" id="edit-person-cancel">Close</button><button class="btn danger" id="edit-person-delete">Delete account permanently</button></div>
    </div>
  `, true);

  document.getElementById("edit-person-cancel").addEventListener("click", closeModal);
  const err = document.getElementById("edit-person-error");
  const showErr = (msg)=>{ err.textContent = msg; err.style.display = "block"; };

  // Fetched separately rather than blocking the modal open on it — profiles
  // doesn't store email at all (it only ever lives in the separate auth
  // system), so this is a real round trip, not just a local lookup.
  (async ()=>{
    const { data, error } = await supabase.functions.invoke("admin-update-account", { body: { userId, fetchOnly: true } });
    const label = document.getElementById("edit-person-current-email");
    if(!label) return; // modal was closed before this resolved
    if(error || (data && data.error) || !data || !data.email){
      label.textContent = "Current email: couldn't load.";
      return;
    }
    label.textContent = `Current email: ${data.email}`;
  })();

  document.getElementById("edit-person-save-name").addEventListener("click", async ()=>{
    const newName = document.getElementById("edit-person-name").value.trim();
    const newEmail = document.getElementById("edit-person-email").value.trim();
    if(!newName){ showErr("Enter a name."); return; }
    if(newEmail && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(newEmail)){ showErr("Enter a valid email address, or leave it blank."); return; }
    const btn = document.getElementById("edit-person-save-name");
    btn.disabled = true; btn.textContent = "Saving…";
    // Routed through the server (service role, bypasses RLS entirely)
    // rather than a direct client-side update — guarantees this actually
    // persists regardless of any RLS/trigger interaction, and is required
    // anyway for the email half of this, which the client can never do for
    // someone else's account on its own.
    const { data, error } = await supabase.functions.invoke("admin-update-account", {
      body: { userId, name: newName, email: newEmail || null }
    });
    if(error || (data && data.error)){
      showErr("Couldn't save: " + ((data && data.error) || await extractFunctionError(error)));
      btn.disabled = false; btn.textContent = "Save changes";
      return;
    }
    logEdit("updated", "person_account", `${name} → ${newName}${newEmail ? ` (email changed)` : ''}`);
    closeModal();
    showToast("Saved.");
    await openTeamProgress();
  });

  document.getElementById("edit-person-reset-pw").addEventListener("click", async ()=>{
    const pw1 = document.getElementById("edit-person-pw1").value;
    const pw2 = document.getElementById("edit-person-pw2").value;
    if(pw1.length < 6){ showErr("Password must be at least 6 characters."); return; }
    if(pw1 !== pw2){ showErr("Passwords don't match."); return; }
    const btn = document.getElementById("edit-person-reset-pw");
    btn.disabled = true; btn.textContent = "Resetting…";
    const { data, error } = await supabase.functions.invoke("admin-reset-password", { body: { userId, newPassword: pw1 } });
    if(error || (data && data.error)){ showErr("Couldn't reset password: " + ((data && data.error) || await extractFunctionError(error))); btn.disabled=false; btn.textContent="Reset password"; return; }
    showToast("Password updated.");
    btn.disabled = false; btn.textContent = "Reset password";
    document.getElementById("edit-person-pw1").value = "";
    document.getElementById("edit-person-pw2").value = "";
  });

  document.getElementById("edit-person-delete").addEventListener("click", async ()=>{
    const pw = document.getElementById("edit-person-delete-pw").value;
    if(!pw){ showErr("Enter your password to confirm deletion."); return; }
    if(!confirm(`Really delete ${name}'s account? This permanently deletes their progress, notes, and messages. This cannot be undone.`)) return;
    const btn = document.getElementById("edit-person-delete");
    btn.disabled = true; btn.textContent = "Checking…";
    const { data: authData, error: authErr } = await supabase.auth.signInWithPassword({ email: session.user.email, password: pw });
    if(authErr){ showErr("Incorrect password."); btn.disabled=false; btn.textContent="Delete account permanently"; return; }
    session = authData.session;
    btn.textContent = "Deleting…";
    const { data, error } = await supabase.functions.invoke("admin-delete-user", { body: { userId } });
    if(error || (data && data.error)){ showErr("Couldn't delete: " + ((data && data.error) || await extractFunctionError(error))); btn.disabled=false; btn.textContent="Delete account permanently"; return; }
    closeModal();
    alert(`${name}'s account has been deleted.`);
    await openTeamProgress();
  });
}

function openSimZoneTargetModal(d, qi, si, zi, onSaved){
  const q = d.quiz[qi];
  const screens = q.simScreens;
  const zone = screens[si].zones[zi];
  const options = screens.map((s,idx)=> idx===si ? "" : `<option value="${s.id}" ${zone.targetScreenId===s.id?'selected':''}>Screen ${idx+1}</option>`).join("");
  const isScreenGoal = q.endGoal === 'screen';
  openModal(`
    <h3>Where does this button lead?</h3>
    <p class="sub">${isScreenGoal ? "Pick which screen this button leads to." : 'Pick the next screen, or "Finish" if this is the button that completes the simulation.'}</p>
    <div class="field"><select id="sim-zone-target-select">
      ${isScreenGoal ? `<option value="" ${!zone.targetScreenId?'selected':''} disabled>— choose a screen —</option>` : `<option value="" ${!zone.targetScreenId?'selected':''}>Finish (completes the simulation)</option>`}
      ${options}
    </select></div>
    <div class="field"><label>Which click activates this button?</label>
      <select id="sim-zone-clicktype-select">
        <option value="left" ${(zone.clickType||'left')==='left'?'selected':''}>Left click</option>
        <option value="right" ${zone.clickType==='right'?'selected':''}>Right click</option>
      </select>
      <p class="hint">Using the other button on this area counts as a misclick — useful for teaching right-click menus specifically.</p>
    </div>
    <div class="modal-actions"><button class="btn" id="sim-zone-cancel">Cancel</button><button class="btn primary" id="sim-zone-save">Save</button></div>
  `);
  document.getElementById("sim-zone-cancel").addEventListener("click", closeModal);
  document.getElementById("sim-zone-save").addEventListener("click", ()=>{
    const val = document.getElementById("sim-zone-target-select").value;
    if(isScreenGoal && !val){ alert("Pick which screen this button leads to."); return; }
    zone.targetScreenId = val || null;
    zone.clickType = document.getElementById("sim-zone-clicktype-select").value;
    closeModal();
    onSaved();
  });
}

      </div>`;
    }
    return `<div class="sim-zone" data-sim-zone="${qi}:${si}:${zi}" style="position:absolute;left:${z.x}%;top:${z.y}%;width:${z.w}%;height:${z.h}%;border:2px dashed var(--green);cursor:pointer;">
      <button class="sim-zone-del" data-sim-zone-del="${qi}:${si}:${zi}" style="position:absolute;top:-10px;right:-10px;width:18px;height:18px;border-radius:50%;background:#c0392bdd;color:#fff;font-size:11px;line-height:18px;text-align:center;cursor:pointer;border:none;">✕</button>

function openSimPlayFullscreen(q, quizIdx, handleZoneClick){
  if(quizSimMisclicks[quizIdx] === undefined) quizSimMisclicks[quizIdx] = 0;
  const overlay = document.createElement("div");
  overlay.id = "sim-play-fullscreen-overlay";
  overlay.style.cssText = "position:fixed;inset:0;z-index:700;background:#000000f5;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;";
  document.body.appendChild(overlay);
  window.activeFullscreenCleanups.push(()=> overlay.remove());

  function showMisclickX(clientX, clientY){
    const x = document.createElement("div");
    x.textContent = "✕";
    x.style.cssText = `position:fixed;left:${clientX-11}px;top:${clientY-14}px;color:var(--red);font-size:22px;font-weight:900;z-index:800;pointer-events:none;text-shadow:0 0 8px #000;transition:opacity .35s;`;
    document.body.appendChild(x);
    setTimeout(()=>{ x.style.opacity = "0"; }, 250);
    setTimeout(()=>{ x.remove(); }, 650);
  }

  function tooManyMisclicks(){
    overlay.remove();
    quizAnswers[quizIdx] = "failed";
    scheduleQuizProgressSave();
    // Re-render rather than advance directly — quizIdx here is a parameter
    // shadowing the real global quizIdx that Next/Finish reads, so
    // incrementing it would touch a local copy about to be discarded. This
    // shows the question in its failed state with the existing, correctly-
    // wired button to move forward.
    render();
  }

  function draw(){
    const screens = q.simScreens;
    const screen = screens[quizSimScreenIndex[quizIdx]];
    const isFinalScreen = q.endGoal === 'screen' && q.finalScreenId === screen.id;

    if(isFinalScreen){
      overlay.innerHTML = `
        <div style="width:100%;max-width:1300px;margin-bottom:14px;">
          <h2 style="color:var(--text);font-size:20px;font-weight:700;margin:0 0 12px;">${escapeHtml(q.q)}</h2>
          <div style="display:flex;justify-content:flex-end;"><button class="btn" id="sim-play-fullscreen-close">✕ Exit fullscreen</button></div>
        </div>
        <div style="position:relative;display:inline-block;max-width:min(94vw,1300px);max-height:76vh;border-radius:12px;box-shadow:0 0 0 3px var(--green), 0 0 34px 6px #2ecc7166;">
          <img src="${screen.image}" style="max-width:min(94vw,1300px);max-height:76vh;display:block;user-select:none;border-radius:8px;" draggable="false">
        </div>
        <p style="color:var(--green);font-size:13px;margin-top:14px;">✓ You've reached the end — this is the final screen.</p>
        <button class="btn primary" id="sim-play-done" style="margin-top:8px;">Done</button>`;
      document.getElementById("sim-play-fullscreen-close").addEventListener("click", ()=>{ overlay.remove(); render(); });
      document.getElementById("sim-play-done").addEventListener("click", ()=>{
        quizAnswers[quizIdx] = "done";
        overlay.remove(); render();
      });
      return;
    }

    const zonesHtml = (screen.zones||[]).map((z,zi)=>`<div class="sim-play-zone" data-sim-play-zone-fs="${zi}" style="position:absolute;left:${z.x}%;top:${z.y}%;width:${z.w}%;height:${z.h}%;cursor:pointer;"></div>`).join("");
    const misclickCount = quizSimMisclicks[quizIdx];
    // Bigger and color-escalating (dim → amber → red as strikes approach the
    // limit) rather than small and uniformly faint — the count needs to
    // actually catch the eye during a fast-moving exercise, not blend in.
    const misclickColor = misclickCount>=2 ? "var(--red)" : misclickCount>=1 ? "var(--amber)" : "var(--text-dim)";
    overlay.innerHTML = `
      <div style="width:100%;max-width:1300px;margin-bottom:14px;">
        <h2 style="color:var(--text);font-size:20px;font-weight:700;margin:0 0 12px;">${escapeHtml(q.q)}</h2>
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <span style="color:${misclickColor};font-family:var(--mono);font-size:18px;font-weight:700;">MISCLICKS: ${misclickCount}/3</span>
          <button class="btn" id="sim-play-fullscreen-close">✕ Exit fullscreen</button>
        </div>
      </div>
      <div style="position:relative;display:inline-block;max-width:min(94vw,1300px);max-height:82vh;" id="sim-play-container">
        <img src="${screen.image}" style="max-width:min(94vw,1300px);max-height:82vh;display:block;user-select:none;border-radius:8px;" draggable="false">
        ${zonesHtml}
      </div>`;
    document.getElementById("sim-play-fullscreen-close").addEventListener("click", ()=>{ overlay.remove(); render(); });
    const container = document.getElementById("sim-play-container");
    const registerMisclick = (e)=>{
      showMisclickX(e.clientX, e.clientY);
      quizSimMisclicks[quizIdx]++;
      if(quizSimMisclicks[quizIdx] >= 3){ tooManyMisclicks(); } else { draw(); }
    };
    // Right-click is repurposed here (some zones expect it), so the native
    // context menu is always suppressed inside the simulation, not just on
    // right-click zones specifically.
    container.addEventListener("contextmenu", (e)=>{ e.preventDefault(); });
    container.addEventListener("click", (e)=>{
      if(e.target.closest(".sim-play-zone")) return; // handled by the zone's own listener below
      registerMisclick(e);
    });
    container.addEventListener("contextmenu", (e)=>{
      if(e.target.closest(".sim-play-zone")) return; // handled by the zone's own listener below
      registerMisclick(e);
    });
    overlay.querySelectorAll("[data-sim-play-zone-fs]").forEach(el=>{
      const zi = +el.getAttribute("data-sim-play-zone-fs");
      const zone = screen.zones[zi];
      const wantsRight = (zone.clickType||"left") === "right";
      const activate = (e)=>{
        e.preventDefault(); e.stopPropagation();
        if(!handleZoneClick(zi)) return;
        scheduleQuizProgressSave();
        if(quizAnswers[quizIdx] === "done"){ overlay.remove(); render(); } else { draw(); }
      };
      const wrongButton = (e)=>{
        e.preventDefault(); e.stopPropagation();
        registerMisclick(e);
      };
      if(zone.isFake){
        // Looks and feels exactly like a real button — same hover cursor,
        // same click responsiveness — but neither click type ever actually
        // activates it. Always a strike, by design.
        el.addEventListener("click", wrongButton);
        el.addEventListener("contextmenu", wrongButton);
      } else {
        el.addEventListener("click", wantsRight ? wrongButton : activate);
        el.addEventListener("contextmenu", wantsRight ? activate : wrongButton);
      }
    });
  }
  // Screenshots are storage URLs now, so the first display of each one
  // needs a network fetch. Preloading every screen up front means they're
  // all in the browser's cache before anyone starts clicking through.
  overlay.innerHTML = `<div style="color:var(--text-dim);font-family:var(--mono);font-size:13.5px;">Loading simulated navigation…</div>`;
  const preloadUrls = q.simScreens.map(s=> s.image).filter(Boolean);
  Promise.all(preloadUrls.map(url=> new Promise(resolve=>{
    const img = new Image();
    img.onload = resolve;
    img.onerror = resolve; // don't let one broken/missing image block the whole simulation from ever loading
    img.src = url;
  }))).then(()=>{ if(overlay.isConnected) draw(); });
}

function openSimEditFullscreen(qi, si){
  const overlay = document.createElement("div");
  overlay.id = "sim-fullscreen-overlay";
  overlay.style.cssText = "position:fixed;inset:0;z-index:700;background:#000000f0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;";
  document.body.appendChild(overlay);
  window.activeFullscreenCleanups.push(()=> overlay.remove());

  function draw(){
    const screens = draftModule.quiz[qi].simScreens;
    const screen = screens[si];
    const zonesHtml = renderSimZonesHtml(screens, si, qi);
    overlay.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;width:100%;max-width:1200px;margin-bottom:14px;">
        <span style="color:var(--text-dim);font-family:var(--mono);font-size:12px;">SCREEN ${si+1} · EDITING FULLSCREEN — drag to add a button, right-click-drag for a fake one</span>
        <button class="btn primary" id="sim-fullscreen-close">Done</button>
      </div>
      <div class="sim-screen-canvas" data-sim-canvas-fs style="max-width:min(94vw,1200px);max-height:80vh;">
        <img src="${screen.image}" style="max-width:min(94vw,1200px);max-height:80vh;display:block;pointer-events:none;user-select:none;" draggable="false">
        <div class="sim-canvas-hint">✛ Drag for a real button · right-click-drag for a fake one</div>
        ${zonesHtml}
      </div>`;
    document.getElementById("sim-fullscreen-close").addEventListener("click", ()=>{ overlay.remove(); renderEditor(); });
    const canvas = overlay.querySelector("[data-sim-canvas-fs]");
    canvas.addEventListener("contextmenu", (e)=> e.preventDefault()); // suppress the native right-click menu — right-click-drag here means "draw a fake button" instead
    canvas.addEventListener("mousedown", (e)=>{
      if(e.target.closest(".sim-zone")) return;
      if(e.button!==0 && e.button!==2) return; // only left (real zone) or right (fake zone) — ignore middle-click etc.
      const isFake = e.button===2;
      const rect = canvas.getBoundingClientRect();
      const previewEl = document.createElement("div");
      previewEl.style.cssText = `position:absolute;border:2px solid ${isFake?'var(--red)':'var(--green)'};background:${isFake?'#e74c3c33':'#2ecc7133'};pointer-events:none;`;
      canvas.appendChild(previewEl);
      _simZoneDrawing = { qi, si, rect, startX:e.clientX, startY:e.clientY, previewEl, draftModule, isFake,
        onZoneAdded: (newIdx)=>{
          draw();
          // Fake zones have nothing to configure — no target screen, no
          // click type — so there's no modal to open for them at all,
          // unlike real zones which need a target picked immediately.
          if(!isFake) openSimZoneTargetModal(draftModule, qi, si, newIdx, ()=>{ scheduleQuizAutosaveGlobal(qi); draw(); });
        } };
      e.preventDefault();
    });
    overlay.querySelectorAll("[data-sim-zone-del]").forEach(el=> el.addEventListener("click", (e)=>{
      e.stopPropagation();
      const [, , zi] = el.getAttribute("data-sim-zone-del").split(":").map(Number);
      draftModule.quiz[qi].simScreens[si].zones.splice(zi,1);
      scheduleQuizAutosaveGlobal(qi);
      draw();
    }));
    overlay.querySelectorAll("[data-sim-zone]").forEach(el=> el.addEventListener("click", (e)=>{
      if(e.target.closest("[data-sim-zone-del]")) return;
      const [, , zi] = el.getAttribute("data-sim-zone").split(":").map(Number);
      const zone = draftModule.quiz[qi].simScreens[si].zones[zi];
      if(zone && zone.isFake) return; // nothing to configure on a fake zone besides deleting it
      openSimZoneTargetModal(draftModule, qi, si, zi, ()=>{ scheduleQuizAutosaveGlobal(qi); draw(); });
    }));
  }
  draw();
}

function renderSimBuilder(q, qi){
  const screens = q.simScreens || [];
  const endGoalHtml = `
    <div class="field"><label>End goal</label>
      <select data-q-endgoal="${qi}">
        <option value="button" ${q.endGoal!=='screen'?'selected':''}>A specific button finishes it</option>
        <option value="screen" ${q.endGoal==='screen'?'selected':''}>Reaching a specific screen finishes it</option>
      </select>
    </div>
    ${q.endGoal==='screen' ? `
    <div class="field"><label>Final screen</label>
      <select data-q-finalscreen="${qi}">
        <option value="">— choose a screen —</option>
        ${screens.map((s,si)=>`<option value="${s.id}" ${q.finalScreenId===s.id?'selected':''}>Screen ${si+1}</option>`).join("")}
      </select>
      <p class="hint">When someone navigates to this screen, it's shown to them with a "Done" button — no button click needed to finish.</p>
    </div>` : ''}`;
  const screensHtml = screens.map((screen, si)=>{
    const isFinal = q.endGoal==='screen' && q.finalScreenId===screen.id;
    const zonesHtml = isFinal ? '' : renderSimZonesHtml(screens, si, qi);
    return `<div class="sub-card" style="margin-bottom:10px;">
      <div class="sub-card-head"><span class="tag">SCREEN ${si+1}${isFinal?' · FINAL SCREEN':''}</span><div style="display:flex;gap:8px;">${screen.image&&!isFinal?`<button class="mini-btn" data-sim-fullscreen="${qi}:${si}">⛶ Fullscreen</button>`:''}<button class="mini-btn danger" data-sim-screen-del="${qi}:${si}">Delete screen</button></div></div>
      ${screen.image ? (isFinal ? `
        <div style="position:relative;display:inline-block;max-width:100%;">
          <img src="${screen.image}" style="max-width:100%;border-radius:8px;display:block;" draggable="false">
        </div>
        <p class="hint">This is the final screen — no buttons needed here, trainees just see it and click "Done."</p>
      ` : `
        <div class="sim-screen-canvas" data-sim-canvas="${qi}:${si}">
          <img src="${screen.image}" style="max-width:100%;display:block;pointer-events:none;user-select:none;" draggable="false">
          <div class="sim-canvas-hint">✛ Drag to add a button</div>
          ${zonesHtml}
        </div>
        <p class="hint">Drag on the image to draw a clickable zone, then pick where it leads. The zone stays invisible to trainees. Too small to place accurately? Use Fullscreen above.</p>
      `) : `<input type="file" accept="image/*" data-sim-upload="${qi}:${si}">`}
    </div>`;
  }).join("");
  return `${endGoalHtml}<div class="field"><label>Screens (in order)</label>${screensHtml || '<p style="color:var(--text-faint);font-size:13px;">No screens yet.</p>'}<button class="mini-btn" data-sim-add-screen="${qi}" style="margin-top:6px;">+ Add screen</button></div>`;

/* ============================================================
   DRAG AUTO-SCROLL — activated during any drag-to-reorder gesture
   so dragging near the top/bottom edge scrolls the page.
   ============================================================ */
let _dragScrollSpeed = 0;
let _dragScrollRAF = null;
function _dragScrollHandler(e){
  const threshold = 110;
  const y = e.clientY;
  const h = window.innerHeight;
  if(y < threshold) _dragScrollSpeed = -((threshold - y) * 0.5 + 3);
  else if(y > h - threshold) _dragScrollSpeed = ((y - (h - threshold)) * 0.5 + 3);
  else _dragScrollSpeed = 0;
}
function _dragScrollStep(){
  if(_dragScrollSpeed !== 0) window.scrollBy(0, _dragScrollSpeed);
  _dragScrollRAF = requestAnimationFrame(_dragScrollStep);
}
function startDragAutoScroll(){
  _dragScrollSpeed = 0;
  document.addEventListener("dragover", _dragScrollHandler);
  if(!_dragScrollRAF) _dragScrollRAF = requestAnimationFrame(_dragScrollStep);
}
function stopDragAutoScroll(){
  document.removeEventListener("dragover", _dragScrollHandler);
  if(_dragScrollRAF){ cancelAnimationFrame(_dragScrollRAF); _dragScrollRAF = null; }
  _dragScrollSpeed = 0;
}

function slugify(s){ const base=(s||"").toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,''); let id=base||("module-"+Date.now()); let i=2;
  while(MODULES.some(m=>m.id===id && m.id!==editingExistingId)){ id=base+"-"+i; i++; } return id; }

function buildTableHtml(rows, cols){
  // <br> per cell — some browsers won't let the cursor land in a truly
  // empty <td>. Trailing empty paragraph gives somewhere to keep typing
  // if the table lands at the very end.
  const rowHtml = ()=> `<tr>${Array.from({length:cols}).map(()=>'<td><br></td>').join('')}</tr>`;
  return `<table class="rte-table">${Array.from({length:rows}).map(rowHtml).join('')}</table><p><br></p>`;
}

/* ============================================================

   embedded BUILD_VERSION has changed, someone shipped a new

function showUpdateBanner(){
  if(document.getElementById("update-banner")) return; // already showing
  const bar = document.createElement("div");
  bar.id = "update-banner";
  bar.className = "update-banner";
  bar.innerHTML = `<span>🔄 An update has been made. Refresh your tab to see the newest changes.</span><button id="update-banner-refresh">Refresh now</button>`;
  document.body.prepend(bar);
  document.getElementById("update-banner-refresh").addEventListener("click", ()=> window.location.reload());
}
async function checkForNewVersion(){
  try{
    const res = await fetch(window.location.pathname + "?_v=" + Date.now(), { cache: "no-store" });
    if(!res.ok) return;
    const html = await res.text();
    const match = html.match(/const BUILD_VERSION = "([^"]+)"/);
    if(match && match[1] && match[1] !== BUILD_VERSION) showUpdateBanner();
  }catch(e){ /* network hiccup — just try again next interval */ }
}
setInterval(checkForNewVersion, 45 * 1000); // every 45 seconds

function clearFormatting(editorEl){
  editorEl.focus();
  const sel = window.getSelection();
  if(!sel.rangeCount || !editorEl.contains(sel.anchorNode) || sel.isCollapsed){
    // Nothing selected — there's no sensible scope to clean up, and (unlike
    // this function's previous behavior) this should never silently fall
    // back to wiping the entire lesson just because nothing was selected.
    alert("Select the text you want to clear formatting from first.");
    return;
  }
  // Handles native bold/italic/underline/execCommand-applied styles —
  // already correctly scoped to the current selection by the browser itself.
  document.execCommand("removeFormat", false, null);
  document.execCommand("unlink", false, null);
  // Pasted content often carries inline style/color attributes removeFormat
  // doesn't touch. Extracting just the selection into a detached container
  // to clean up, rather than the whole editor, which would strip
  // formatting from unrelated content elsewhere in the lesson.
  if(!sel.rangeCount) return;
  const range = sel.getRangeAt(0);
  if(range.collapsed) return;
  const frag = range.extractContents();
  const temp = document.createElement("div");
  temp.appendChild(frag);
  temp.querySelectorAll("*").forEach(el=>{
    el.removeAttribute("style");
    el.removeAttribute("color");
    el.removeAttribute("bgcolor");
    el.removeAttribute("face");
  });
  temp.querySelectorAll("font").forEach(f=>{
    while(f.firstChild) f.parentNode.insertBefore(f.firstChild, f);
    f.parentNode.removeChild(f);
  });
  // removeFormat only touches inline formatting — flatten headings/quotes back
  // to plain paragraphs too, same as "clear formatting" in a normal editor.
  temp.querySelectorAll("h1,h2,h3,h4,blockquote").forEach(el=>{
    const p = document.createElement("p");
    while(el.firstChild) p.appendChild(el.firstChild);
    el.parentNode.replaceChild(p, el);
  });
  const newRange = document.createRange();
  newRange.selectNodeContents(temp);
  const cleaned = newRange.extractContents();
  range.insertNode(cleaned);
  editorEl.dispatchEvent(new Event("input", { bubbles:true }));
}

function wireRichEditor(id){
  const toolbar = document.querySelector(`.rte-toolbar[data-rte="${id}"]`);
  const editorEl = document.getElementById(id);
  if(!toolbar || !editorEl) return;

  let savedRange = null;
  const saveCurrentRange = ()=>{
    const sel = window.getSelection();
    if(sel.rangeCount>0 && editorEl.contains(sel.anchorNode)) savedRange = sel.getRangeAt(0).cloneRange();
  };
  const restoreRange = ()=>{
    if(!savedRange) return;
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(savedRange);
  };
  const TOGGLE_CMDS = ["bold","italic","underline","strikeThrough","insertUnorderedList","insertOrderedList","justifyLeft","justifyCenter","justifyRight"];
  const updateToolbarState = ()=>{
    TOGGLE_CMDS.forEach(cmd=>{
      const btn = toolbar.querySelector(`button[data-cmd="${cmd}"]`);
      if(!btn) return;
      if(["justifyLeft","justifyCenter","justifyRight"].includes(cmd) && selectedImageWrap && editorEl.contains(selectedImageWrap)){
        const align = cmd==="justifyLeft" ? "left" : cmd==="justifyCenter" ? "center" : "right";
        btn.classList.toggle("active", selectedImageWrap.getAttribute("data-align")===align);
        return;
      }
      try{ btn.classList.toggle("active", document.queryCommandState(cmd)); }catch(e){}
    });
    const quoteBtn = toolbar.querySelector('button[data-cmd="blockquote"]');
    if(quoteBtn){ try{ quoteBtn.classList.toggle("active", document.queryCommandValue("formatBlock").toLowerCase()==="blockquote"); }catch(e){} }
    const sizeInput = toolbar.querySelector('input[data-cmd="fontSizeNum"]');
    if(sizeInput && document.activeElement !== sizeInput){
      // Walk up from the cursor looking for the nearest explicit font-size
      // style. Skipped while the input itself is focused so it doesn't
      // fight with someone actively typing a new number into it.
      let node = window.getSelection().anchorNode;
      if(node && node.nodeType===3) node = node.parentElement;
      let px = 14; // editor's own default (.rte-body font-size)
      while(node && node!==editorEl){
        if(node.style && node.style.fontSize){ px = parseInt(node.style.fontSize) || 14; break; }
        node = node.parentElement;
      }
      sizeInput.value = px;
    }
  };
  editorEl.addEventListener("click", updateToolbarState);
  editorEl.addEventListener("mouseup", ()=>{ saveCurrentRange(); updateToolbarState(); });
  editorEl.addEventListener("keyup", ()=>{ saveCurrentRange(); updateToolbarState(); });
  editorEl.addEventListener("focus", updateToolbarState);

  toolbar.querySelectorAll("button[data-cmd]").forEach(btn=>{
    btn.addEventListener("mousedown", (e)=>e.preventDefault()); // keep focus/selection in the editor
    btn.addEventListener("click", async ()=>{
      editorEl.focus();
      const cmd = btn.getAttribute("data-cmd");
      if(cmd === "image"){ document.getElementById(`${id}-file`).click(); return; }
      if(cmd === "interactivePic"){
        const ipFileInput = document.getElementById(`${id}-ipic-file`);
        ipFileInput.onchange = async ()=>{
          const file = ipFileInput.files[0]; if(!file) return;
          ipFileInput.value = "";
          const lessonIdxMatch = id.match(/^lesson-rte-(\d+)$/);
          if(!lessonIdxMatch) return;
          const lesson = draftModule.lessons[+lessonIdxMatch[1]];
          if(!lesson || !lesson.id){ alert("Save the lesson first, then add an interactive picture."); return; }
          const dataUrl = await compressImageFile(file);
          if(!dataUrl) return; // compressImageFile already alerted the user about what went wrong
          const ipId = 'ip'+Date.now()+Math.random().toString(36).slice(2,8);
          const { error } = await supabase.from("interactive_pictures").insert({ id:ipId, lesson_id:lesson.id, image:dataUrl, hotspots:[], content_type:'hotspot' });
          if(error){ alert("Couldn't create interactive picture: " + error.message); return; }
          INTERACTIVE_PICTURES[ipId] = { id:ipId, lessonId:lesson.id, image:dataUrl, hotspots:[], type:'hotspot', slides:null };
          document.execCommand("insertHTML", false, `<div class="interactive-pic-embed" contenteditable="false" data-interactive-pic-id="${ipId}">&nbsp;</div>&nbsp;`);
          editorEl.dispatchEvent(new Event("input", { bubbles:true }));
          openInteractivePicConfigFullscreen(ipId);
        };
        ipFileInput.click();
        return;
      }
      if(cmd === "slideshow"){
        const slideFileInput = document.getElementById(`${id}-slideshow-file`);
        slideFileInput.onchange = async ()=>{
          const files = Array.from(slideFileInput.files||[]);
          slideFileInput.value = "";
          if(!files.length) return;
          const lessonIdxMatch = id.match(/^lesson-rte-(\d+)$/);
          if(!lessonIdxMatch) return;
          const lesson = draftModule.lessons[+lessonIdxMatch[1]];
          if(!lesson || !lesson.id){ alert("Save the lesson first, then add a slideshow."); return; }
          // Uploaded one at a time, in order, rather than in parallel —
          // parallel uploads would let them finish in whatever order the
          // network happens to complete them, silently scrambling slide
          // order from what was actually selected.
          const urls = [];
          for(const file of files){
            const url = await compressImageFile(file);
            if(url) urls.push(url);
          }
          if(!urls.length){ alert("Couldn't upload any of those images."); return; }
          const slides = urls.map(u=>({ image:u }));
          const ipId = 'ip'+Date.now()+Math.random().toString(36).slice(2,8);
          const { error } = await supabase.from("interactive_pictures").insert({ id:ipId, lesson_id:lesson.id, content_type:'slideshow', slides, hotspots:[] });
          if(error){ alert("Couldn't create slideshow: " + error.message); return; }
          INTERACTIVE_PICTURES[ipId] = { id:ipId, lessonId:lesson.id, image:null, hotspots:[], type:'slideshow', slides };
          document.execCommand("insertHTML", false, `<div class="interactive-pic-embed" contenteditable="false" data-interactive-pic-id="${ipId}">&nbsp;</div>&nbsp;`);
          editorEl.dispatchEvent(new Event("input", { bubbles:true }));
          openSlideshowConfigFullscreen(ipId);
        };
        slideFileInput.click();
        return;
      }
      if(cmd === "hr"){ document.execCommand("insertHTML", false, "<hr>"); return; }
      if(cmd === "table"){
        saveCurrentRange();
        const size = await promptTableSizeModal();
        if(size){
          restoreRange(); editorEl.focus();
          document.execCommand("insertHTML", false, buildTableHtml(size.rows, size.cols));
          attachTableResizeHandles(editorEl);
          editorEl.dispatchEvent(new Event("input", { bubbles:true }));
        }
        return;
      }
      if(cmd === "clearFormat"){ clearFormatting(editorEl); return; }
      if(cmd === "link"){
        saveCurrentRange();
        const url = await promptModal("Insert link", "https://example.com");
        if(url){
          restoreRange(); editorEl.focus(); document.execCommand("createLink", false, url);
          const sel = window.getSelection();
          const anchorEl = sel.anchorNode && (sel.anchorNode.nodeType===1 ? sel.anchorNode : sel.anchorNode.parentElement);
          const link = anchorEl && anchorEl.closest ? anchorEl.closest("a[href]") : null;
          if(link){ link.setAttribute("target","_blank"); link.setAttribute("rel","noopener noreferrer"); }
        }
        updateToolbarState();
        return;
      }
      if(cmd === "sitelink"){
        saveCurrentRange();
        const target = await promptSiteLinkModal();
        if(target){
          restoreRange(); editorEl.focus();
          const sel = window.getSelection();
          const hasSelection = sel && !sel.isCollapsed && editorEl.contains(sel.anchorNode);
          const linkText = hasSelection ? sel.toString() : target.label;
          const attrs = [`data-link-type="${target.type}"`];
          if(target.modId) attrs.push(`data-link-mod="${escapeHtml(target.modId)}"`);
          if(target.lessonIdx!==undefined) attrs.push(`data-link-lesson="${target.lessonIdx}"`);
          if(target.refId) attrs.push(`data-link-ref="${escapeHtml(target.refId)}"`);
          document.execCommand("insertHTML", false, `<a href="#" class="internal-link" ${attrs.join(" ")}>${escapeHtml(linkText)}</a>`);
          editorEl.dispatchEvent(new Event("input", { bubbles:true }));
        }
        updateToolbarState();
        return;
      }
      if(cmd === "unlink"){ document.execCommand("unlink", false, null); return; }
      if(cmd === "blockquote"){
        const isQuote = document.queryCommandValue("formatBlock").toLowerCase() === "blockquote";
        document.execCommand("formatBlock", false, isQuote ? "P" : "BLOCKQUOTE");
        updateToolbarState();
        return;
      }
      if(["justifyLeft","justifyCenter","justifyRight"].includes(cmd) && selectedImageWrap && editorEl.contains(selectedImageWrap)){
        const align = cmd==="justifyLeft" ? "left" : cmd==="justifyCenter" ? "center" : "right";
        selectedImageWrap.setAttribute("data-align", align);
        editorEl.dispatchEvent(new Event("input", { bubbles:true }));
        return;
      }
      document.execCommand(cmd, false, null);
      updateToolbarState();
    });
  });
  const sizeInput = toolbar.querySelector('input[data-cmd="fontSizeNum"]');
  if(sizeInput){
    // Not using execCommand("fontSize") — it wraps selections in a legacy
    // <font size> tag and was unreliable for cleanly replacing an
    // already-sized selection. This manually strips existing font-size
    // styling from the selection and wraps it in one clean span instead.
    sizeInput.addEventListener("mousedown", (e)=>{ e.stopPropagation(); saveCurrentRange(); });
    sizeInput.addEventListener("change", ()=>{
      let px = parseInt(sizeInput.value);
      if(!px || px<8) px = 8;
      if(px>96) px = 96;
      // preventScroll — the number input had real focus (unlike other
      // toolbar buttons, which use mousedown+preventDefault to keep focus
      // in the editor), so a normal focus() would jump the cursor to the
      // start and scroll there before restoreRange() below fixes it.
      editorEl.focus({ preventScroll: true });
      restoreRange();
      const sel = window.getSelection();
      if(!sel.rangeCount || !editorEl.contains(sel.anchorNode)){ sizeInput.value = px; return; }
      const range = sel.getRangeAt(0);
      if(range.collapsed){
        // No text selected, just a cursor position — insert an empty sized
        // span there so whatever gets typed next inherits the new size,
        // rather than silently doing nothing.
        const span = document.createElement("span");
        span.style.fontSize = px + "px";
        span.appendChild(document.createTextNode("\u200b"));
        range.insertNode(span);
        const newRange = document.createRange();
        newRange.setStart(span.firstChild, 1);
        newRange.collapse(true);
        sel.removeAllRanges();
        sel.addRange(newRange);
      } else {
        const frag = range.extractContents();
        const temp = document.createElement("div");
        temp.appendChild(frag);
        temp.querySelectorAll("[style]").forEach(el=>{
          el.style.fontSize = "";
          if(!el.getAttribute("style")) el.removeAttribute("style");
        });
        temp.querySelectorAll("font[size]").forEach(el=> el.removeAttribute("size")); // legacy tags from older content
        const span = document.createElement("span");
        span.style.fontSize = px + "px";
        while(temp.firstChild) span.appendChild(temp.firstChild);
        range.insertNode(span);
        const newRange = document.createRange();
        newRange.selectNodeContents(span);
        sel.removeAllRanges();
        sel.addRange(newRange);
      }
      editorEl.dispatchEvent(new Event("input", { bubbles:true }));
      // Set last, deliberately — editorEl.focus() above fires the editor's
      // focus listener synchronously, which reads the still-stale selection
      // and would otherwise overwrite this back to the old value.
      sizeInput.value = px;
    });
  }
  const blockSelect = toolbar.querySelector('select[data-cmd="formatBlock"]');
  if(blockSelect) blockSelect.addEventListener("change", ()=>{ editorEl.focus(); document.execCommand("formatBlock", false, blockSelect.value); blockSelect.value = "P"; });
  toolbar.querySelectorAll('input[type="color"][data-cmd]').forEach(colorInput=>{
    colorInput.addEventListener("mousedown", (e)=>{ e.stopPropagation(); saveCurrentRange(); });
    colorInput.addEventListener("input", ()=>{
      editorEl.focus();
      restoreRange();
      document.execCommand(colorInput.getAttribute("data-cmd"), false, colorInput.value);
      const bar = colorInput.parentElement.querySelector(".swatch-bar");
      if(bar) bar.style.background = colorInput.value;
    });
  });
  const fileInput = document.getElementById(`${id}-file`);
  fileInput.addEventListener("change", async ()=>{
    const file = fileInput.files[0]; if(!file) return;
    const dataUrl = await compressImageFile(file);
    if(!dataUrl) return; // compressImageFile already alerted the user about what went wrong
    await insertResizableImage(editorEl, dataUrl);
    attachImageResizeHandles(editorEl);
    fileInput.value = "";
  });
  editorEl.addEventListener("paste", async (e)=>{
    const cd = e.clipboardData || window.clipboardData;
    const items = cd.items;
    // Some browsers attach a flattened image snapshot alongside real HTML
    // on a mixed paste — checking for an image item alone would wrongly
    // treat the whole paste as "just an image" and discard the text.
    const hasHtml = Array.from(items).some(it => it.type === "text/html");
    if(!hasHtml){
      for(const item of items){
        if(item.type && item.type.startsWith("image/")){
          e.preventDefault();
          const file = item.getAsFile();
          const dataUrl = await compressImageFile(file);
          if(!dataUrl) return; // compressImageFile already alerted the user about what went wrong
          await insertResizableImage(editorEl, dataUrl);
          attachImageResizeHandles(editorEl);
          return;
        }
      }
    }
    // Mixed/rich paste (or plain text) — let the browser's default paste happen,
    // then wrap any plain <img> tags it inserted so every picture — no matter how
    // it got in — ends up resizable and click-to-enlarge, same as ones we insert.
    // Two passes: large pastes can take a moment longer to finish landing in the DOM.
    setTimeout(()=>{ normalizePastedImages(editorEl); attachImageResizeHandles(editorEl); }, 0);
    setTimeout(()=>{ normalizePastedImages(editorEl); attachImageResizeHandles(editorEl); }, 200);
  });
  attachTableControls(editorEl);
  attachTableResizeHandles(editorEl);
  attachImageResizeHandles(editorEl);
}

// A small toolbar sits above whichever table the cursor is in, rather than
// a floating tooltip tracking scroll. Operates directly on the DOM (no
// native table-editing execCommand exists), then dispatches a synthetic
// input event so the existing autosave picks it up like any other edit.
function attachTableControls(editorEl){
  let toolbarEl = null;
  let activeCell = null;

  function colIndexOf(cell){ return Array.from(cell.parentNode.children).indexOf(cell); }
  function emptyCellHtml(){ return "<td><br></td>"; }

  function ensureToolbar(){
    if(toolbarEl) return toolbarEl;
    toolbarEl = document.createElement("div");
    toolbarEl.className = "rte-table-toolbar";
    toolbarEl.setAttribute("contenteditable", "false");
    toolbarEl.innerHTML = `
      <button type="button" data-t="row-above" title="Insert row above">+Row ↑</button>
      <button type="button" data-t="row-below" title="Insert row below">+Row ↓</button>
      <button type="button" data-t="col-left" title="Insert column left">+Col ←</button>
      <button type="button" data-t="col-right" title="Insert column right">+Col →</button>
      <span class="rte-table-toolbar-sep"></span>
      <button type="button" data-t="del-row" title="Delete this row">−Row</button>
      <button type="button" data-t="del-col" title="Delete this column">−Col</button>
      <span class="rte-table-toolbar-sep"></span>
      <button type="button" data-t="del-table" title="Delete table">✕ Table</button>
    `;
    toolbarEl.querySelectorAll("button[data-t]").forEach(btn=>{
      btn.addEventListener("mousedown", (e)=> e.preventDefault()); // don't steal focus/selection away from the cell
      btn.addEventListener("click", ()=>{ if(activeCell && activeCell.isConnected) runTableAction(btn.getAttribute("data-t")); });
    });
    return toolbarEl;
  }

  function hideToolbar(){
    if(toolbarEl) toolbarEl.remove();
    activeCell = null;
  }

  function runTableAction(action){
    const table = activeCell.closest(".rte-table");
    if(!table){ hideToolbar(); return; }
    const row = activeCell.closest("tr");
    const colIdx = colIndexOf(activeCell);
    const rows = Array.from(table.rows);

    if(action==="row-above" || action==="row-below"){
      const newRow = document.createElement("tr");
      for(let i=0;i<row.children.length;i++) newRow.insertAdjacentHTML("beforeend", emptyCellHtml());
      const rowIdx = rows.indexOf(row);
      row.parentNode.insertBefore(newRow, action==="row-above" ? row : (rows[rowIdx+1] || null));
    } else if(action==="col-left" || action==="col-right"){
      rows.forEach(r=>{
        const cell = r.children[colIdx];
        if(cell) cell.insertAdjacentHTML(action==="col-left" ? "beforebegin" : "afterend", emptyCellHtml());
      });
    } else if(action==="del-row"){
      if(rows.length<=1){ table.remove(); hideToolbar(); editorEl.dispatchEvent(new Event("input",{bubbles:true})); return; }
      row.remove();
    } else if(action==="del-col"){
      if(row.children.length<=1){ table.remove(); hideToolbar(); editorEl.dispatchEvent(new Event("input",{bubbles:true})); return; }
      rows.forEach(r=>{ const cell = r.children[colIdx]; if(cell) cell.remove(); });
    } else if(action==="del-table"){
      table.remove(); hideToolbar();
      editorEl.dispatchEvent(new Event("input",{bubbles:true}));
      return;
    }
    attachTableResizeHandles(editorEl);
    editorEl.dispatchEvent(new Event("input",{bubbles:true}));
  }

  function showToolbarFor(cell){
    activeCell = cell;
    const table = cell.closest(".rte-table");
    if(!table) return;
    table.parentNode.insertBefore(ensureToolbar(), table);
  }

  editorEl.addEventListener("click", (e)=>{
    const cell = e.target.closest("td");
    const table = e.target.closest(".rte-table");
    if(cell && table && editorEl.contains(table)) showToolbarFor(cell);
    else if(toolbarEl && !e.target.closest(".rte-table-toolbar")) hideToolbar();
  });
  editorEl.addEventListener("keyup", ()=>{
    const sel = window.getSelection();
    if(!sel.anchorNode) return;
    const node = sel.anchorNode.nodeType===1 ? sel.anchorNode : sel.anchorNode.parentElement;
    const cell = node && node.closest ? node.closest("td") : null;
    if(cell && cell.closest(".rte-table") && editorEl.contains(cell)) showToolbarFor(cell);
  });
}

// Column handles hang off the first row only (browsers align column widths
// across all rows automatically); row handles off each row's first cell.
// Re-run after every insert/delete since new cells need their own handles.
function attachTableResizeHandles(editorEl){
  editorEl.querySelectorAll(".rte-table").forEach(table=>{
    const rows = Array.from(table.rows);
    if(!rows.length) return;
    Array.from(rows[0].children).forEach(cell=>{
      if(cell.querySelector(":scope > .rte-col-resize-handle")) return;
      const handle = document.createElement("span");
      handle.className = "rte-col-resize-handle";
      handle.setAttribute("contenteditable", "false");
      handle.setAttribute("draggable", "false");
      cell.appendChild(handle);
    });
    rows.forEach(row=>{
      const cell = row.children[0];
      if(!cell || cell.querySelector(":scope > .rte-row-resize-handle")) return;
      const handle = document.createElement("span");
      handle.className = "rte-row-resize-handle";
      handle.setAttribute("contenteditable", "false");
      handle.setAttribute("draggable", "false");
      cell.appendChild(handle);
    });
  });
}
let _colResizeDrag = null;
let _rowResizeDrag = null;
document.addEventListener("mousedown", (e)=>{
  const colHandle = e.target.closest(".rte-col-resize-handle");
  if(colHandle){
    e.preventDefault(); e.stopPropagation();
    const cell = colHandle.parentElement;
    _colResizeDrag = { cell, startX:e.clientX, startW:cell.offsetWidth };
    return;
  }
  const rowHandle = e.target.closest(".rte-row-resize-handle");
  if(rowHandle){
    e.preventDefault(); e.stopPropagation();
    const cell = rowHandle.parentElement;
    _rowResizeDrag = { row: cell.parentElement, startY:e.clientY, startH:cell.parentElement.offsetHeight };
  }
});
document.addEventListener("mousemove", (e)=>{
  if(_colResizeDrag){
    e.preventDefault();
    const { cell, startX, startW } = _colResizeDrag;
    const w = Math.max(30, startW + (e.clientX - startX));
    const table = cell.closest("table");
    const colIdx = Array.from(cell.parentNode.children).indexOf(cell);
    // Set on every row's cell in this column, not just the dragged one —
    // keeps the column's width intact even if that specific row later
    // gets deleted.
    Array.from(table.rows).forEach(r=>{ const c = r.children[colIdx]; if(c) c.style.width = w+"px"; });
    return;
  }
  if(_rowResizeDrag){
    e.preventDefault();
    const { row, startY, startH } = _rowResizeDrag;
    const h = Math.max(24, startH + (e.clientY - startY));
    Array.from(row.children).forEach(c=> c.style.height = h+"px");
  }
});
document.addEventListener("mouseup", ()=>{
  if(_colResizeDrag){
    const editorEl = _colResizeDrag.cell.closest(".rte-body");
    if(editorEl) editorEl.dispatchEvent(new Event("input", { bubbles:true }));
  }
  if(_rowResizeDrag){
    const editorEl = _rowResizeDrag.row.closest(".rte-body");
    if(editorEl) editorEl.dispatchEvent(new Event("input", { bubbles:true }));
  }
  _colResizeDrag = null; _rowResizeDrag = null;
});

/* ============================================================
   CUSTOM IMAGE RESIZE — replaces native CSS `resize`, which
   behaves inconsistently inside contenteditable regions across
   browsers (images would render at inflated size only while
   actively editing). This gives identical behavior everywhere.
   ============================================================ */
// The resize handle and delete button are live editing affordances only — they
// must never end up saved as part of the actual content, or they'd show up (and
// even still work) in read-only views. Always read saved content through this,
// never through a raw .innerHTML, on any editor whose content gets persisted.
function getCleanEditorHtml(editorEl){
  if(!editorEl) return "";
  const clone = editorEl.cloneNode(true);
  clone.querySelectorAll(".rte-resize-handle, .rte-img-delete, .rte-table-toolbar, .rte-col-resize-handle, .rte-row-resize-handle").forEach(el=> el.remove());
  // Cleans up leftover zero-width-space placeholders from the font-size
  // tool's collapsed-cursor path — invisible but real elements that were
  // quietly inflating line height. Empty spans containing only the
  // character get removed; stray copies mixed into real text get stripped.
  clone.querySelectorAll("span").forEach(el=>{
    if(el.children.length===0 && el.textContent==="\u200b") el.remove();
  });
  let html = clone.innerHTML.split("\u200b").join("");
  return html;
}
function fixImageSizing(wrap){
  const img = wrap.querySelector("img");
  if(!img) return;
  let w = parseInt(img.getAttribute("width")) || (img.style.width ? parseInt(img.style.width) : 0);
  let h = parseInt(img.getAttribute("height")) || (img.style.height ? parseInt(img.style.height) : 0);
  if((!w || !h) && (wrap.style.width || wrap.style.height)){
    // Legacy content: size was stored on the wrapper span (an older version of this
    // feature), not on the image itself, which is what the current system expects.
    // Migrate it onto the image so it renders identically everywhere.
    w = w || parseInt(wrap.style.width) || 0;
    h = h || parseInt(wrap.style.height) || 0;
    wrap.style.width = ""; wrap.style.height = "";
  }
  if(w && h){ setImageSize(img, w, h); return; }
  // No size data anywhere (img, its attributes, or the wrapper) — this is content
  // with zero sizing info at all. Fall back to computing from the image's real
  // pixel dimensions, same as a freshly pasted image, so it can never be left
  // completely unconstrained (which is what "giant" actually was).
  const applyNatural = ()=>{
    const nw = img.naturalWidth || 280;
    const nh = img.naturalHeight || 190;
    const maxW = 340, maxH = 260;
    const scale = Math.min(maxW/nw, maxH/nh, 1);
    setImageSize(img, Math.max(Math.round(nw*scale), 80), Math.max(Math.round(nh*scale), 60));
  };
  if(img.complete && img.naturalWidth){ applyNatural(); }
  else {
    setImageSize(img, 280, 190); // safe placeholder while it loads
    img.addEventListener("load", applyNatural, { once:true });
  }
}
function attachImageResizeHandles(editorEl){
  editorEl.querySelectorAll(".rte-img-wrap").forEach(wrap=>{
    fixImageSizing(wrap);
    if(!wrap.querySelector(".rte-resize-handle")){
      const handle = document.createElement("span");
      handle.className = "rte-resize-handle";
      handle.setAttribute("contenteditable", "false");
      handle.setAttribute("draggable", "false");
      wrap.appendChild(handle);
    }
    if(!wrap.querySelector(".rte-img-delete")){
      const delBtn = document.createElement("span");
      delBtn.className = "rte-img-delete";
      delBtn.setAttribute("contenteditable", "false");
      delBtn.setAttribute("draggable", "false");
      delBtn.title = "Delete image";
      delBtn.textContent = "✕";
      wrap.appendChild(delBtn);
    }
  });
}
// The wrapper's draggable="true" (for moving the picture in text) can
// hijack a mousedown-drag on the resize handle or delete button into a
// native drag instead of the custom resize logic. Block it on those two.
document.addEventListener("dragstart", (e)=>{
  if(e.target.closest(".rte-resize-handle") || e.target.closest(".rte-img-delete")) e.preventDefault();
});
// Any link in rendered content opens in a new tab rather than navigating
// away — covers links saved before this was added too, not just new ones.
document.addEventListener("click", (e)=>{
  const link = e.target.closest("a[href]");
  if(!link) return;
  const href = link.getAttribute("href");
  if(!href || href.startsWith("#")) return;
  e.preventDefault();
  window.open(href, "_blank", "noopener,noreferrer");
});
document.addEventListener("click", (e)=>{
  const delBtn = e.target.closest(".rte-img-delete");
  if(!delBtn) return;
  e.preventDefault(); e.stopPropagation();
  const wrap = delBtn.parentElement;
  const editorEl = wrap.closest(".rte-body");
  wrap.remove();
  if(editorEl) editorEl.dispatchEvent(new Event("input", { bubbles:true }));
});
let selectedImageWrap = null;
document.addEventListener("click", (e)=>{
  if(e.target.closest(".rte-img-delete") || e.target.closest(".rte-resize-handle")) return; // their own listeners handle these
  const wrap = e.target.closest(".rte-body .rte-img-wrap");
  if(wrap){
    document.querySelectorAll(".rte-img-wrap.rte-img-selected").forEach(w=>{ if(w!==wrap) w.classList.remove("rte-img-selected"); });
    wrap.classList.add("rte-img-selected");
    selectedImageWrap = wrap;
    return;
  }
  if(e.target.closest(".rte-toolbar")) return; // don't lose the selection while using the toolbar
  document.querySelectorAll(".rte-img-wrap.rte-img-selected").forEach(w=> w.classList.remove("rte-img-selected"));
  selectedImageWrap = null;
});
let _imgResizeDrag = null;

let _simZoneDrawing = null;
document.addEventListener("mousemove", (e)=>{
  if(!_simZoneDrawing) return;
  const { rect, startX, startY, previewEl } = _simZoneDrawing;
  const x1 = Math.min(startX, e.clientX), x2 = Math.max(startX, e.clientX);
  const y1 = Math.min(startY, e.clientY), y2 = Math.max(startY, e.clientY);
  previewEl.style.left = (x1 - rect.left) + "px";
  previewEl.style.top = (y1 - rect.top) + "px";
  previewEl.style.width = (x2-x1) + "px";
  previewEl.style.height = (y2-y1) + "px";
});
document.addEventListener("mouseup", (e)=>{
  if(!_simZoneDrawing) return;
  const { qi, si, rect, startX, startY, previewEl, draftModule: dm, onZoneAdded, isFake } = _simZoneDrawing;
  _simZoneDrawing = null;
  previewEl.remove();
  const x1 = Math.min(startX, e.clientX), x2 = Math.max(startX, e.clientX);
  const y1 = Math.min(startY, e.clientY), y2 = Math.max(startY, e.clientY);
  const wPx = x2-x1, hPx = y2-y1;
  if(wPx < 10 || hPx < 10) return; // too small — treat as an accidental click, not a real zone
  const xPct = ((x1-rect.left)/rect.width)*100, yPct = ((y1-rect.top)/rect.height)*100;
  const wPct = (wPx/rect.width)*100, hPct = (hPx/rect.height)*100;
  const zone = { x:Math.round(xPct*10)/10, y:Math.round(yPct*10)/10, w:Math.round(wPct*10)/10, h:Math.round(hPct*10)/10, targetScreenId:null, clickType:"left", isFake:!!isFake };
  const screen = dm.quiz[qi].simScreens[si];
  if(!screen.zones) screen.zones = [];
  screen.zones.push(zone);
  const newIdx = screen.zones.length-1;
  scheduleQuizAutosaveGlobal(qi);
  if(onZoneAdded) onZoneAdded(newIdx); else renderEditor();
});
let scheduleQuizAutosaveGlobal = ()=>{}; // reassigned by wireEditorEvents each time it runs, so the shared drag handler above can trigger a save

let _ipBoxDrawing = null;
document.addEventListener("mousemove", (e)=>{
  if(!_ipBoxDrawing) return;
  const { rect, startX, startY, previewEl, scale } = _ipBoxDrawing;
  const s = scale || 1;
  const x1 = Math.min(startX, e.clientX), x2 = Math.max(startX, e.clientX);
  const y1 = Math.min(startY, e.clientY), y2 = Math.max(startY, e.clientY);
  // previewEl sits inside a CSS-transform-scaled canvas, so its coordinates
  // are in that parent's unscaled space. Dividing by the current scale
  // converts the viewport-pixel delta correctly, or the box renders at the
  // wrong size whenever zoomed in.
  previewEl.style.left = ((x1 - rect.left) / s) + "px";
  previewEl.style.top = ((y1 - rect.top) / s) + "px";
  previewEl.style.width = ((x2-x1) / s) + "px";
  previewEl.style.height = ((y2-y1) / s) + "px";
});
document.addEventListener("mouseup", (e)=>{
  if(!_ipBoxDrawing) return;
  const { rect, startX, startY, previewEl, onBoxAdded } = _ipBoxDrawing;
  _ipBoxDrawing = null;
  previewEl.remove();
  const x1 = Math.min(startX, e.clientX), x2 = Math.max(startX, e.clientX);
  const y1 = Math.min(startY, e.clientY), y2 = Math.max(startY, e.clientY);
  const wPx = x2-x1, hPx = y2-y1;
  if(wPx < 10 || hPx < 10) return;
  const xPct = ((x1-rect.left)/rect.width)*100, yPct = ((y1-rect.top)/rect.height)*100;
  const wPct = (wPx/rect.width)*100, hPct = (hPx/rect.height)*100;
  const box = { id:'hs'+Date.now()+Math.random().toString(36).slice(2,7), x:Math.round(xPct*10)/10, y:Math.round(yPct*10)/10, w:Math.round(wPct*10)/10, h:Math.round(hPct*10)/10, title:"", body:"" };
  if(onBoxAdded) onBoxAdded(box);
});
