async function openInlineAttemptDetail(userId, moduleId){
  // Toggle closed if clicking the same person+module's pill again
  if(attemptDetailFor && attemptDetailFor.userId===userId && attemptDetailFor.moduleId===moduleId){
    attemptDetailFor = null; attemptDetailData = null;
    render();
    return;
  }
  attemptDetailFor = { userId, moduleId };
  attemptDetailActiveIdx = 0;
  attemptDetailData = "loading";
  render();

  const m = modById(moduleId);
  if(!m || !m.quiz.length){ attemptDetailData = []; render(); return; }

  const { data: attempts } = await supabase.from("quiz_attempts").select("*").eq("user_id", userId).eq("module_id", moduleId).order("created_at", { ascending:false }).limit(MAX_QUIZ_ATTEMPTS);
  // Only apply the fetch if this is still the module someone's looking at —
  // clicking a different pill while this was in flight shouldn't have a
  // stale, late-arriving response overwrite what they're now viewing.
  if(!attemptDetailFor || attemptDetailFor.userId!==userId || attemptDetailFor.moduleId!==moduleId) return;
  attemptDetailData = attempts || [];
  render();
}
function renderLessonsViewedHtml(person, m){
  if(!m.lessons.length) return "";
  const raw = person.perModuleRaw[m.id];
  const viewedIds = new Set(raw ? raw.lessonsViewed : []);
  const rows = m.lessons.map(l=>{
    const seen = viewedIds.has(l.id);
    return `<div style="display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px solid var(--stroke);">
      <span style="color:${seen?'var(--green)':'var(--text-faint)'};font-size:14px;">${seen?'✓':'○'}</span>
      <span style="font-size:13.5px;color:${seen?'var(--text)':'var(--text-faint)'};">${escapeHtml(l.title||l.label||'Untitled lesson')}</span>
    </div>`;
  }).join("");
  return `
    <div class="card" style="margin:0 4px 14px;">
      <h3 style="margin-bottom:4px;">Lessons viewed</h3>
      <p style="color:var(--text-dim);font-size:13px;margin:0 0 10px;">${viewedIds.size}/${m.lessons.length} lessons opened at least once.</p>
      ${rows}
    </div>`;
}
function renderInlineAttemptDetailHtml(person){
  const m = modById(attemptDetailFor.moduleId);
  if(!m) return "";
  const raw = person.perModuleRaw[m.id];
  const resetBtnHtml = (m.quiz.length && raw && raw.attempts>0)
    ? `<div style="margin:0 4px 14px;"><button class="btn danger" data-reset-attempts="${person.id}:${m.id}" style="font-size:12.5px;padding:7px 12px;">🔄 Reset Attempts</button></div>`
    : "";
  const lessonsHtml = resetBtnHtml + renderLessonsViewedHtml(person, m);
  if(attemptDetailData === "loading"){
    return lessonsHtml + `<div class="sub-card" style="margin:0 4px 14px;"><p style="color:var(--text-faint);font-family:var(--mono);font-size:12px;margin:0;">Loading attempts…</p></div>`;
  }
  if(!m.quiz.length){
    return lessonsHtml; // no quiz on this module — lessons-viewed is the whole story
  }
  if(!attemptDetailData || !attemptDetailData.length){
    return lessonsHtml + `<div class="sub-card" style="margin:0 4px 14px;"><p style="color:var(--text-dim);font-size:13.5px;margin:0;">${escapeHtml(person.name)} hasn't taken the ${escapeHtml(m.title)} quiz yet.</p></div>`;
  }
  const total = attemptDetailData.length;
  const tabsHtml = attemptDetailData.map((a,i)=>`<button class="dept-tab ${attemptDetailActiveIdx===i?'active':''}" data-attempt-tab="${i}">Attempt ${total-i}${i===0?' (latest)':''}</button>`).join("");
  const a = attemptDetailData[Math.min(attemptDetailActiveIdx, total-1)];
  const missed = (a.answers||[]).filter(x=>!x.is_correct);
  const missedHtml = missed.length ? missed.map((x,i)=>`
    <div class="sub-card">
      <div style="font-size:14px;margin-bottom:8px;">${escapeHtml(x.question)}</div>
      ${x.type==='simulation'
        ? `<div style="font-size:13px;color:var(--red);margin-bottom:10px;">Missed too many clicks in the simulation — marked incorrect.</div>`
        : `<div style="font-size:13px;color:var(--red);margin-bottom:4px;">Their answer: ${escapeHtml(x.options[x.selected] ?? '(no answer)')}</div>
      <div style="font-size:13px;color:var(--green);margin-bottom:10px;">Correct answer: ${escapeHtml(x.options[x.correct])}</div>`}
      <button class="mini-btn" data-coach="${i}">💬 Discuss with ${escapeHtml(person.name)}</button>
    </div>
  `).join("") : `<p style="color:var(--green);font-size:13.5px;">No missed questions on this attempt — clean sweep.</p>`;
  return lessonsHtml + `
    <div class="card" style="margin:0 4px 14px;">
      <div class="dept-tabs" style="margin-bottom:14px;border-bottom:none;">${tabsHtml}</div>
      <h2 style="margin-bottom:16px;">${a.score}/${a.total} (${a.total?Math.round((a.score/a.total)*100):0}%) correct</h2>
      ${missedHtml}
    </div>`;
}

let pendingGrades = {};
let chatPendingGrades = {}; // rootId -> { answerIdx: boolean } for inline grading in Chat
async function showStandaloneQuizAttemptDetail(userId, quizId, holderId, personNameOverride){
  holderId = holderId || "quiz-attempt-detail";
  const holder = document.getElementById(holderId);
  if(!holder) return;
  holder.innerHTML = `<div class="card"><p style="color:var(--text-faint);font-family:var(--mono);font-size:12px;">Loading answers…</p></div>`;
  const person = teamRows.find(r=>r.id===userId);
  const personName = personNameOverride || (person ? person.name : '');
  const { data: quiz } = await supabase.from("standalone_quizzes").select("*").eq("id", quizId).single();
  const { data: attempt } = await supabase.from("standalone_quiz_attempts").select("*").eq("user_id", userId).eq("quiz_id", quizId).single();
  if(!attempt){
    holder.innerHTML = `<div class="card"><p style="color:var(--text-dim);font-size:13.5px;">No submission found.</p></div>`;
    return;
  }
  const needsGrading = !attempt.graded;
  pendingGrades = {};
  const rows = (attempt.answers||[]).map((ans,idx)=>{
    if(ans.type === "long_answer"){
      if(needsGrading){
        return `<div class="sub-card">
          <div style="font-size:14px;margin-bottom:6px;"><strong>${escapeHtml(ans.question)}</strong> <span class="tag" style="margin-left:6px;">LONG ANSWER · NEEDS GRADING</span></div>
          <div style="font-size:13px;color:var(--text-dim);white-space:pre-wrap;margin-bottom:12px;">${escapeHtml(ans.answer || '(no answer)')}</div>
          <div style="display:flex;gap:10px;">
            <button class="mini-btn grade-choice" data-grade-idx="${idx}" data-grade-val="true" style="color:var(--text-dim);">✓ Mark Correct</button>
            <button class="mini-btn grade-choice" data-grade-idx="${idx}" data-grade-val="false" style="color:var(--text-dim);">✕ Mark Incorrect</button>
          </div>
        </div>`;
      }
      const gradeLabel = ans.is_correct===true ? ' · CORRECT' : ans.is_correct===false ? ' · INCORRECT' : '';
      return `<div class="sub-card"><div style="font-size:14px;margin-bottom:6px;"><strong>${escapeHtml(ans.question)}</strong> <span class="tag" style="margin-left:6px;">LONG ANSWER${gradeLabel}</span></div><div style="font-size:13px;color:var(--text-dim);white-space:pre-wrap;">${escapeHtml(ans.answer || '(no answer)')}</div></div>`;
    }
    const selectedText = ans.selected!=null ? ans.options[ans.selected] : "(no answer)";
    const correctText = ans.options[ans.correct];
    return `<div class="sub-card"><div style="font-size:14px;margin-bottom:6px;"><strong>${escapeHtml(ans.question)}</strong></div>
      <div style="font-size:13px;color:${ans.is_correct?'var(--green)':'var(--red)'};">Their answer: ${escapeHtml(selectedText)}</div>
      ${!ans.is_correct?`<div style="font-size:13px;color:var(--green);">Correct answer: ${escapeHtml(correctText)}</div>`:''}
    </div>`;
  }).join("");
  const longAnswerAnswersForScore = (attempt.answers||[]).filter(a=>a.type==="long_answer");
  const longAnswerCorrectForScore = longAnswerAnswersForScore.filter(a=>a.is_correct===true).length;
  const totalQForScore = (attempt.mc_total||0) + longAnswerAnswersForScore.length;
  const totalCorrectForScore = (attempt.mc_score||0) + longAnswerCorrectForScore;
  const pctForScore = totalQForScore ? Math.round((totalCorrectForScore/totalQForScore)*100) : null;
  holder.innerHTML = `
    <div class="card">
      <div class="k-label">QUIZ SUBMISSION · ${escapeHtml(personName)} · ${escapeHtml(quiz?quiz.title:'')}</div>
      ${needsGrading
        ? (attempt.mc_total ? `<h2 style="margin-bottom:16px;">${attempt.mc_score}/${attempt.mc_total} multiple choice correct so far</h2>` : `<h2 style="margin-bottom:16px;">Submitted</h2>`)
        : (totalQForScore ? `<h2 style="margin-bottom:16px;">${totalCorrectForScore}/${totalQForScore} correct <span style="color:var(--text-faint);font-size:14px;font-weight:400;">(${pctForScore}%)</span></h2>` : `<h2 style="margin-bottom:16px;">Submitted</h2>`)}
      ${needsGrading ? `<p style="color:var(--amber);font-size:13px;margin-bottom:16px;">⚠ This submission has long-answer questions that need grading before it's finalized.</p>` : ""}
      ${rows || `<p style="color:var(--text-faint);font-size:13px;">No answers recorded.</p>`}
      ${needsGrading ? `<div class="nav-buttons"><div></div><button class="btn primary" id="finalize-grading">Finalize grading</button></div>` : ""}
    </div>
  `;
  if(needsGrading){
    holder.querySelectorAll(".grade-choice").forEach(btn=> btn.addEventListener("click", ()=>{
      const idx = btn.getAttribute("data-grade-idx");
      const val = btn.getAttribute("data-grade-val") === "true";
      pendingGrades[idx] = val;
      holder.querySelectorAll(`.grade-choice[data-grade-idx="${idx}"]`).forEach(b=>{
        const isThis = b === btn;
        b.style.color = isThis ? (val ? "var(--green)" : "var(--red)") : "var(--text-dim)";
        b.style.borderColor = isThis ? (val ? "var(--green-dim)" : "var(--red-dim)") : "";
        b.style.fontWeight = isThis ? "700" : "400";
      });
    }));
    document.getElementById("finalize-grading").addEventListener("click", async ()=>{
      const longAnswerCount = (attempt.answers||[]).filter(a=>a.type==="long_answer").length;
      if(Object.keys(pendingGrades).length < longAnswerCount){ alert("Grade every long-answer question before finalizing."); return; }
      const updatedAnswers = (attempt.answers||[]).map((ans,idx)=>{
        if(ans.type==="long_answer" && pendingGrades[idx]!=null) return { ...ans, is_correct: pendingGrades[idx] };
        return ans;
      });
      const { data: updatedRows, error } = await supabase.from("standalone_quiz_attempts").update({ answers: updatedAnswers, graded: true }).eq("quiz_id", quizId).eq("user_id", userId).select();
      if(error){ alert("Couldn't save grading: " + error.message); return; }
      if(!updatedRows || !updatedRows.length){ alert("Grading didn't save — the database silently rejected this update (likely a permissions rule). Nothing changed. Please tell your admin/developer this happened."); return; }
      logEdit("graded", "standalone_quiz_attempt", `${quiz?quiz.title:'quiz'} — ${personName||'submission'}`);
      const correctCount = updatedAnswers.filter((a,i)=> attempt.answers[i]?.type==="long_answer" && a.is_correct===true).length;
      await Promise.resolve(supabase.from("messages").insert({
        sender_id: session.user.id, sender_name: profile.name, recipient_id: userId,
        audience:"user", type:"reply", claimed_by: session.user.id,
        body: `<p>Your quiz "<strong>${escapeHtml(quiz?quiz.title:'the quiz')}</strong>" has been graded — ${correctCount}/${longAnswerCount} (${longAnswerCount?Math.round((correctCount/longAnswerCount)*100):0}%) long-answer question${longAnswerCount===1?'':'s'} correct.</p>`
      })).catch(()=>{});
      showToast("Grading saved.");
      QUIZ_PROGRESS_ROWS = null;
      if(view === "quiz-sent-detail" && quizSentDetailQuiz){
        await refreshQuizSentDetailRoster();
        render();
        await showStandaloneQuizAttemptDetail(userId, quizId, `sent-detail-answers-${userId}`, personName);
      } else {
        await loadQuizProgressData();
        render();
        await showStandaloneQuizAttemptDetail(userId, quizId, holderId, personName);
      }
    });
  }
}

/* ============================================================
   QUIZZES — list, take, results, and admin builder
   ============================================================ */
function renderQuizzesList(){
  const dept = currentActiveDepartment();
  const deptQuizzes = QUIZZES.filter(q=> teamHasDeptAccess(q, dept));
  const canManageQuizzes = canCreateQuizzes();
  const myQuizzes = deptQuizzes.filter(q=> q.isRecipient);
  const pending = myQuizzes.filter(q=> !q.myAttempt);
  const completed = myQuizzes.filter(q=> !!q.myAttempt);
  const sentQuizzes = canManageQuizzes ? deptQuizzes : [];
  const activeSent = sentQuizzes.filter(q=> !(q.sent && q.isFullyComplete));
  const fullyCompleteSent = sentQuizzes.filter(q=> q.sent && q.isFullyComplete);

  function quizCard(q, forManagement){
    let tag;
    if(!q.sent){ tag = `<span class="status-pill">Draft</span>`; }
    else if(forManagement){ tag = q.isFullyComplete ? `<span class="status-pill done">Fully completed</span>` : `<span class="status-pill done">Sent</span>`; }
    else if(q.myAttempt){
      if(q.myAttempt.graded){
        const longAnswerAnswers = (q.myAttempt.answers||[]).filter(a=>a.type==="long_answer");
        const longAnswerCorrect = longAnswerAnswers.filter(a=>a.is_correct===true).length;
        const totalQ = (q.myAttempt.mc_total||0) + longAnswerAnswers.length;
        const totalCorrect = (q.myAttempt.mc_score||0) + longAnswerCorrect;
        tag = totalQ ? `<span class="status-pill done">${totalCorrect}/${totalQ} (${Math.round((totalCorrect/totalQ)*100)}%)</span>` : `<span class="status-pill done">Completed</span>`;
      } else {
        tag = q.myAttempt.mc_total
          ? `<span class="status-pill progress">${q.myAttempt.mc_score}/${q.myAttempt.mc_total} MC · Awaiting grading</span>`
          : `<span class="status-pill progress">Awaiting grading</span>`;
      }
    }
    else { tag = `<span class="status-pill">Not started</span>`; }
    const deleteBtn = forManagement ? `<button class="mini-btn danger" data-quiz-delete="${q.id}" style="position:absolute;top:12px;right:12px;">Delete</button>` : "";
    return `<div class="mod-card" data-quiz-open="${q.id}" data-quiz-manage="${forManagement?'1':'0'}" style="position:relative;">
      ${deleteBtn}
      <div class="row-top"><div><h3>${escapeHtml(q.title)}</h3><p class="sub">${q.questions.length} question${q.questions.length===1?'':'s'} · from ${escapeHtml(q.createdByName||'an admin')}</p></div></div>
      <div class="meta"><span>${tag}</span></div>
    </div>`;
  }

  function sectionHeader(key, title, count){
    const open = quizListSectionOpen[key];
    return `<div class="collapsible-header" data-quiz-section-toggle="${key}" style="cursor:pointer;display:flex;align-items:center;justify-content:space-between;">
      <h2 style="margin:0;">${title} <span style="color:var(--text-faint);font-size:13px;font-weight:400;">(${count})</span></h2>
      <span style="color:var(--text-faint);font-size:16px;">${open?'▾':'▸'}</span>
    </div>`;
  }

  const effectiveMode = canManageQuizzes ? quizPageMode : "mine"; // no toggle reachable at all without manage permission, so always fall back to "mine" regardless of whatever the variable happens to hold
  const addBtn = (canManageQuizzes && effectiveMode==='manage') ? `<button class="dashed-btn" id="add-quiz" style="margin-top:14px;">+ New quiz</button>` : "";
  const quizDeptTabsHtml = (myDepartments().length>1) ? `<div class="dept-tabs">
      ${renderDeptTabsHtml(dept, 'quiz-dept')}
    </div>` : "";
  const modeTabsHtml = canManageQuizzes ? `<div class="dept-tabs" style="margin-bottom:18px;">
      <button class="dept-tab ${effectiveMode==='mine'?'active':''}" data-quiz-mode="mine">My Quizzes</button>
      <button class="dept-tab ${effectiveMode==='manage'?'active':''}" data-quiz-mode="manage">Manage Quizzes</button>
    </div>` : "";
  renderShell(`
    ${quizDeptTabsHtml}
    <section class="hero">
      <div class="eyebrow">${T('quizzes.eyebrow','Quizzes')}</div>
      <h1>${T('quizzes.h1','Quick check-ins from your admins')}</h1>
    </section>
    ${modeTabsHtml}
    ${effectiveMode === 'mine' ? `
    <div class="card">
      ${sectionHeader('pending', 'New / Not completed', pending.length)}
      ${quizListSectionOpen.pending ? `<div class="grid" style="margin-top:14px;">${pending.map(q=>quizCard(q,false)).join("") || '<p style="color:var(--text-faint);font-size:13px;">Nothing here.</p>'}</div>` : ""}
    </div>
    <div class="card" style="margin-top:16px;">
      ${sectionHeader('completed', 'Completed', completed.length)}
      ${quizListSectionOpen.completed ? `<div class="grid" style="margin-top:14px;">${completed.map(q=>quizCard(q,false)).join("") || '<p style="color:var(--text-faint);font-size:13px;">Nothing here yet.</p>'}</div>` : ""}
    </div>
    ` : `
    <div class="card">
      ${sectionHeader('sent', 'Sent Quizzes', activeSent.length)}
      ${quizListSectionOpen.sent ? `<p style="color:var(--text-dim);font-size:13.5px;margin:14px 0;">Deleting a quiz here removes it — and everyone's completed results — everywhere.</p><div class="grid">${activeSent.map(q=>quizCard(q,true)).join("") || '<p style="color:var(--text-faint);font-size:13px;">Nothing here yet.</p>'}</div>` : ""}
    </div>
    <div class="card" style="margin-top:16px;">
      ${sectionHeader('sentCompleted', 'Fully Completed', fullyCompleteSent.length)}
      ${quizListSectionOpen.sentCompleted ? `<div class="grid">${fullyCompleteSent.map(q=>quizCard(q,true)).join("") || '<p style="color:var(--text-faint);font-size:13px;">Nothing here yet.</p>'}</div>` : ""}
    </div>
    ${addBtn}
    `}
  `);
  root.querySelectorAll("[data-quiz-mode]").forEach(el=> el.addEventListener("click", ()=>{
    quizPageMode = el.getAttribute("data-quiz-mode");
    render();
  }));
  root.querySelectorAll("[data-quiz-dept]").forEach(el=> el.addEventListener("click", ()=>{
    activeDepartment = el.getAttribute("data-quiz-dept");
    render();
  }));
  root.querySelectorAll("[data-quiz-section-toggle]").forEach(el=> el.addEventListener("click", ()=>{
    const key = el.getAttribute("data-quiz-section-toggle");
    quizListSectionOpen[key] = !quizListSectionOpen[key];
    render();
  }));
  root.querySelectorAll("[data-quiz-delete]").forEach(el=> el.addEventListener("click", async (e)=>{
    e.stopPropagation();
    const id = el.getAttribute("data-quiz-delete");
    const q = QUIZZES.find(x=>x.id===id);
    if(!confirm(`Delete "${q?q.title:'this quiz'}"? This removes it — and everyone's completed results — for good.`)) return;
    const { error } = await supabase.from("standalone_quizzes").delete().eq("id", id);
    if(error){ alert("Couldn't delete: " + error.message); return; }
    logEdit("deleted", "standalone_quiz", q?q.title:'');
    await loadStandaloneQuizzes();
    render();
  }));
  root.querySelectorAll("[data-quiz-open]").forEach(el=> el.addEventListener("click", async ()=>{
    const id = el.getAttribute("data-quiz-open");
    const forManagement = el.getAttribute("data-quiz-manage") === "1";
    const q = QUIZZES.find(x=>x.id===id);
    if(forManagement){
      if(!q.sent){ await openQuizBuilder(id); return; } // draft — keep editing
      await openQuizSentDetail(id); return; // sent — view progress & grade
    }
    currentQuizId = id;
    if(q.myAttempt){ await loadStandaloneQuizzes(); view = "quiz-result-standalone"; render(); }
    else { quizTakeAnswers = {}; standaloneQuizStartedAt[id] = new Date().toISOString(); view = "quiz-take"; render(); }
  }));
  const addBtn2 = document.getElementById("add-quiz");
  if(addBtn2) addBtn2.addEventListener("click", createNewStandaloneQuiz);
}

let quizSentDetailQuiz = null;
let quizSentDetailRoster = [];
let quizSentDetailExpandedId = null;

async function openQuizSentDetail(quizId){
  const { data: quiz } = await supabase.from("standalone_quizzes").select("*").eq("id", quizId).single();
  if(!quiz){ alert("Couldn't load that quiz."); return; }
  const { data: questions } = await supabase.from("standalone_quiz_questions").select("*").eq("quiz_id", quizId).order("sort_order");
  quizSentDetailQuiz = { ...quiz, questions: (questions||[]).map(qq=>({ id:qq.id, type:qq.question_type, question:qq.question, options:qq.options||[], correct:qq.correct_index, explain:qq.explanation||"" })) };
  quizSentDetailExpandedId = null;
  await refreshQuizSentDetailRoster();
  view = "quiz-sent-detail"; render();
}

async function refreshQuizSentDetailRoster(){
  const quiz = quizSentDetailQuiz;
  if(!quiz) return;
  const { data: attempts } = await supabase.from("standalone_quiz_attempts").select("*").eq("quiz_id", quiz.id);
  const { data: allProfiles } = await supabase.from("profiles").select("id,name,role");
  let eligibleIds = [];
  if(quiz.audience_type === "everyone"){
    eligibleIds = (allProfiles||[]).map(p=>p.id);
  } else if(quiz.audience_type === "team"){
    const { data: members } = await supabase.from("team_members").select("user_id").eq("team_id", quiz.team_id);
    eligibleIds = (members||[]).map(m=>m.user_id);
  } else {
    const { data: recipients } = await supabase.from("standalone_quiz_recipients").select("user_id").eq("quiz_id", quiz.id);
    eligibleIds = (recipients||[]).map(r=>r.user_id);
  }
  quizSentDetailRoster = eligibleIds.map(uid=>{
    const person = (allProfiles||[]).find(p=>p.id===uid);
    const attempt = (attempts||[]).find(a=>a.user_id===uid);
    return { id:uid, name: person?person.name:'Unknown', completed: !!attempt, needsGrading: !!attempt && !attempt.graded };
  }).sort((a,b)=> a.name.localeCompare(b.name));
}

function renderQuizSentDetail(){
  const quiz = quizSentDetailQuiz;
  if(!quiz){ view="quizzes"; render(); return; }
  const completedCount = quizSentDetailRoster.filter(r=>r.completed).length;
  const rows = quizSentDetailRoster.map(r=>{
    const expanded = quizSentDetailExpandedId === r.id;
    const pillCls = r.needsGrading ? 'progress' : r.completed ? 'done' : '';
    const pillLabel = r.needsGrading ? 'Needs grading' : r.completed ? 'Completed' : 'Not completed';
    const mainRow = `<tr class="team-row-main" data-sent-detail-toggle="${r.id}" style="cursor:${r.completed?'pointer':'default'};">
      <td>${escapeHtml(r.name)}</td>
      <td><span class="status-pill ${pillCls}">${pillLabel}</span></td>
      <td style="text-align:center;color:var(--text-faint);">${r.completed?(expanded?'▾':'▸'):''}</td>
    </tr>`;
    const detailRow = (expanded && r.completed) ? `<tr class="team-row-detail"><td colspan="3"><div id="sent-detail-answers-${r.id}" style="padding:10px 4px 16px;"></div></td></tr>` : "";
    return mainRow + detailRow;
  }).join("");

  renderShell(`
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <div class="k-label">SENT QUIZ</div>
        <button class="mini-btn danger" id="sent-detail-delete">Delete quiz</button>
      </div>
      <h2 style="margin-bottom:4px;">${escapeHtml(quiz.title)}</h2>
      <p style="color:var(--text-dim);font-size:13.5px;margin:0 0 20px;">${completedCount}/${quizSentDetailRoster.length} (${quizSentDetailRoster.length?Math.round((completedCount/quizSentDetailRoster.length)*100):0}%) completed.</p>
      <div style="overflow-x:auto;"><table class="team"><thead><tr><th>Name</th><th>Status</th><th></th></tr></thead><tbody>${rows || `<tr><td colspan="3" style="color:var(--text-faint);font-size:13px;padding:16px 4px;">No one is eligible for this quiz yet.</td></tr>`}</tbody></table></div>
      <div class="nav-buttons"><button class="btn" id="sent-detail-back">← Back to Quizzes</button><div></div></div>
    </div>
  `);
  document.getElementById("sent-detail-back").addEventListener("click", ()=>{ view="quizzes"; render(); });
  document.getElementById("sent-detail-delete").addEventListener("click", async ()=>{
    if(!confirm(`Delete "${quiz.title}"? This removes it — and everyone's completed results — for good.`)) return;
    const { error } = await supabase.from("standalone_quizzes").delete().eq("id", quiz.id);
    if(error){ alert("Couldn't delete: " + error.message); return; }
    logEdit("deleted", "standalone_quiz", quiz.title);
    quizSentDetailQuiz = null;
    await loadStandaloneQuizzes();
    view = "quizzes"; render();
  });
  root.querySelectorAll("[data-sent-detail-toggle]").forEach(el=> el.addEventListener("click", async ()=>{
    const uid = el.getAttribute("data-sent-detail-toggle");
    const r = quizSentDetailRoster.find(x=>x.id===uid);
    if(!r || !r.completed) return;
    quizSentDetailExpandedId = (quizSentDetailExpandedId === uid) ? null : uid;
    render();
    if(quizSentDetailExpandedId === uid) await showStandaloneQuizAttemptDetail(uid, quiz.id, `sent-detail-answers-${uid}`, r.name);
  }));
}

async function createNewStandaloneQuiz(){
  const title = await promptModal("New quiz", "Quiz title");
  if(!title) return;
  const insertObj = { title:title.trim(), created_by:session.user.id, created_by_name:profile.name, audience_type:"everyone", sent:false };
  const activeDept = DEPARTMENTS.find(d=>d.id===currentActiveDepartment());
  if(activeDept) insertObj[activeDept.teamDbField] = true;
  const { data, error } = await supabase.from("standalone_quizzes").insert(insertObj).select().single();
  if(error){ alert("Couldn't create quiz: " + error.message); return; }
  logEdit("created", "standalone_quiz", title.trim());
  await loadStandaloneQuizzes();
  await openQuizBuilder(data.id);
}

function renderQuizTake(){

  if(!q){ view="quizzes"; render(); return; }
  const questionsHtml = q.questions.map((qq,i)=>{
    if(qq.type === "long_answer"){
      return `<div class="sub-card"><div class="sub-card-head"><span class="tag">QUESTION ${i+1} · LONG ANSWER</span></div>
        <div style="font-size:14px;margin-bottom:10px;color:var(--text);">${escapeHtml(qq.question)}</div>
        <div class="field"><textarea data-quiz-longanswer="${qq.id}" placeholder="Type your answer…" style="min-height:100px;">${escapeHtml(quizTakeAnswers[qq.id]||"")}</textarea></div>
      </div>`;
    }
    const opts = (qq.options||[]).map((opt,oi)=>`<div class="opt-row"><input type="radio" name="qtake-${qq.id}" data-quiz-mc="${qq.id}" value="${oi}" ${quizTakeAnswers[qq.id]===oi?'checked':''}> <span>${escapeHtml(opt)}</span></div>`).join("");
    return `<div class="sub-card"><div class="sub-card-head"><span class="tag">QUESTION ${i+1}</span></div>
      <div style="font-size:14px;margin-bottom:10px;color:var(--text);">${escapeHtml(qq.question)}</div>${opts}
    </div>`;
  }).join("");
  renderShell(`
    <div class="card">
      <div class="k-label">QUIZ</div>
      <h2 style="margin-bottom:16px;">${escapeHtml(q.title)}</h2>
      ${questionsHtml || `<p style="color:var(--text-faint);font-size:13px;">This quiz has no questions yet.</p>`}
      <div class="nav-buttons"><button class="btn" id="quiz-take-back">← Back to Quizzes</button><button class="btn primary" id="submit-standalone-quiz">Submit Quiz</button></div>
    </div>
  `);
  document.getElementById("quiz-take-back").addEventListener("click", ()=>{ view="quizzes"; render(); });
  root.querySelectorAll("[data-quiz-mc]").forEach(el=> el.addEventListener("change", (e)=>{ quizTakeAnswers[el.getAttribute("data-quiz-mc")] = +e.target.value; }));
  root.querySelectorAll("[data-quiz-longanswer]").forEach(el=> el.addEventListener("input", (e)=>{ quizTakeAnswers[el.getAttribute("data-quiz-longanswer")] = e.target.value; }));
  document.getElementById("submit-standalone-quiz").addEventListener("click", submitStandaloneQuiz);
}

async function submitStandaloneQuiz(){
  const q = QUIZZES.find(x=>x.id===currentQuizId);
  if(!q) return;
  let mcScore = 0, mcTotal = 0;
  const answers = [];
  let longAnswerHtml = "";
  let hasLongAnswer = false;
  q.questions.forEach(qq=>{
    if(qq.type === "multiple_choice"){
      mcTotal++;
      const selected = quizTakeAnswers[qq.id];
      const isCorrect = selected === qq.correct;
      if(isCorrect) mcScore++;
      answers.push({ question_id:qq.id, question:qq.question, type:"multiple_choice", options:qq.options, selected, correct:qq.correct, is_correct:isCorrect });
    } else {
      hasLongAnswer = true;
      const text = (quizTakeAnswers[qq.id]||"").trim();
      answers.push({ question_id:qq.id, question:qq.question, type:"long_answer", answer:text });
      if(text) longAnswerHtml += `<p><strong>${escapeHtml(qq.question)}</strong><br>${escapeHtml(text)}</p>`;
    }
  });
  const submitBtn = document.getElementById("submit-standalone-quiz");
  if(submitBtn){ submitBtn.disabled = true; submitBtn.textContent = "Submitting…"; }
  const { error } = await supabase.from("standalone_quiz_attempts").insert({ quiz_id:q.id, user_id:session.user.id, user_name:profile.name, answers, mc_score:mcScore, mc_total:mcTotal, graded: !hasLongAnswer, started_at: standaloneQuizStartedAt[q.id] || null });
  if(error){
    alert("Couldn't submit: " + error.message);
    if(submitBtn){ submitBtn.disabled = false; submitBtn.textContent = "Submit Quiz"; }
    return;
  }
  delete standaloneQuizStartedAt[q.id];
  if(hasLongAnswer && q.createdBy){
    await Promise.resolve(supabase.from("messages").insert({ sender_id:session.user.id, sender_name:profile.name, recipient_id:q.createdBy, audience:"user", type:"reply", claimed_by:q.createdBy, related_quiz_id:q.id, related_quiz_user_id:session.user.id, body:`<p>📝 ${escapeHtml(profile.name)} submitted long-answer responses for the quiz "${escapeHtml(q.title)}" — grade it below, then reply to send them feedback.</p>${longAnswerHtml}` })).catch(()=>{});
  }
  // Attach the just-submitted attempt immediately, in memory — the results
  // page no longer depends on a fresh reload finding it, which was the
  // cause of getting stuck on the submit screen.
  q.myAttempt = { quiz_id:q.id, user_id:session.user.id, user_name:profile.name, answers, mc_score:mcScore, mc_total:mcTotal, graded: !hasLongAnswer };
  showToast(hasLongAnswer ? "Submitted — your long answers are awaiting grading." : "Quiz submitted.");
  view = "quizzes"; render();
  loadStandaloneQuizzes().catch(()=>{}); // refresh in the background, doesn't block the transition
}

function renderQuizResultStandalone(){
  const q = QUIZZES.find(x=>x.id===currentQuizId);
  if(!q || !q.myAttempt){ view="quizzes"; render(); return; }
  const a = q.myAttempt;
  const longAnswerAnswers = (a.answers||[]).filter(ans=>ans.type==="long_answer");
  const longAnswerCorrect = longAnswerAnswers.filter(ans=>ans.is_correct===true).length;
  const totalQ = (a.mc_total||0) + longAnswerAnswers.length;
  const totalCorrect = (a.mc_score||0) + longAnswerCorrect;

  const rows = (a.answers||[]).map(ans=>{
    if(ans.type === "long_answer"){
      const gradeTag = !a.graded
        ? `<span class="tag" style="margin-left:6px;color:var(--amber);border-color:var(--amber-dim);">AWAITING GRADING</span>`
        : (ans.is_correct ? `<span class="tag" style="margin-left:6px;color:var(--green);border-color:var(--green-dim);">CORRECT</span>` : `<span class="tag" style="margin-left:6px;color:var(--red);border-color:var(--red-dim);">INCORRECT</span>`);
      return `<div class="sub-card"><div style="font-size:14px;margin-bottom:6px;color:var(--text);"><strong>${escapeHtml(ans.question)}</strong> ${gradeTag}</div><div style="font-size:13px;color:var(--text-dim);white-space:pre-wrap;">${escapeHtml(ans.answer || '(no answer)')}</div></div>`;
    }
    const selectedText = ans.selected!=null ? ans.options[ans.selected] : "(no answer)";
    const correctText = ans.options[ans.correct];
    return `<div class="sub-card"><div style="font-size:14px;margin-bottom:6px;color:var(--text);"><strong>${escapeHtml(ans.question)}</strong></div>
      <div style="font-size:13px;color:${ans.is_correct?'var(--green)':'var(--red)'};">Your answer: ${escapeHtml(selectedText)}</div>
      ${!ans.is_correct?`<div style="font-size:13px;color:var(--green);">Correct answer: ${escapeHtml(correctText)}</div>`:''}
    </div>`;
  }).join("");
  renderShell(`
    <div class="card">
      <div class="k-label">QUIZ SUBMITTED</div>
      <h2 style="margin-bottom:6px;">${escapeHtml(q.title)}</h2>
      ${a.graded
        ? `<p style="color:var(--text-dim);font-size:14px;margin-bottom:16px;">${totalCorrect}/${totalQ} correct (${totalQ ? Math.round((totalCorrect/totalQ)*100) : 0}%)</p>`
        : (a.mc_total ? `<p style="color:var(--text-dim);font-size:14px;margin-bottom:16px;">${a.mc_score}/${a.mc_total} multiple choice correct so far</p>` : "")}
      ${!a.graded ? `<p style="color:var(--amber);font-size:13px;margin-bottom:16px;">⏳ Your long-answer responses are waiting to be graded. Your final score will update once that's done.</p>` : ""}
      ${rows}
      <div class="nav-buttons"><div></div><button class="btn primary" id="back-to-quizzes">Back to Quizzes</button></div>
    </div>
  `);
  document.getElementById("back-to-quizzes").addEventListener("click", ()=>{ view="quizzes"; render(); });
}

async function openQuizBuilder(id){
  if(!TEAMS_LIST.length){
    const { data: teamsData } = await supabase.from("teams").select("*").order("name");
    const { data: memberships } = await supabase.from("team_members").select("*");
    TEAMS_LIST = (teamsData||[]).map(t=>({ id:t.id, name:t.name, accessTs:!!t.access_ts, accessCs:!!t.access_cs, accessTestboard:!!t.access_testboard, memberIds:(memberships||[]).filter(m=>m.team_id===t.id).map(m=>m.user_id) }));
  }
  if(!teamRows.length){
    const { data: people } = await supabase.from("profiles").select("*").order("name");
    teamRows = (people||[]).map(p=>({ id:p.id, name:p.name, role:p.role, perModule:{}, perModuleRaw:{}, overall:0, mastered:0, teamIds:[], canAccessTs:!!p.can_access_ts, canAccessCs:!!p.can_access_cs, canAccessTestboard:!!p.can_access_testboard }));
  }
  const { data: qRow } = await supabase.from("standalone_quizzes").select("*").eq("id", id).single();
  const { data: questions } = await supabase.from("standalone_quiz_questions").select("*").eq("quiz_id", id).order("sort_order");
  const { data: recipients } = await supabase.from("standalone_quiz_recipients").select("user_id").eq("quiz_id", id);
  quizBuilderDraft = {
    id, title:qRow.title, audienceType:qRow.audience_type, teamId:qRow.team_id, sent:qRow.sent,
    accessTs: !!qRow.access_ts, accessCs: !!qRow.access_cs, accessTestboard: !!qRow.access_testboard,
    specificIds: (recipients||[]).map(r=>r.user_id),
    questions: (questions||[]).map(q=>({ id:q.id, type:q.question_type, question:q.question, options:q.options||["Option A","Option B"], correct:q.correct_index||0, explain:q.explanation||"" }))
  };
  expandedQuizQuestionIdx = null;
  view = "quiz-builder"; render();
}

let quizTitleAutosaveTimer = null;
let quizQuestionAutosaveTimers = {};

function renderQuizBuilder(){
  const d = quizBuilderDraft;
  const locked = d.sent; // audience/team/people can't change after sending

  const questionsHtml = d.questions.map((q,i)=>{
    if(i === expandedQuizQuestionIdx){
      const typeToggle = `<div class="field"><label>Question type</label>
        <select data-qz-type="${i}">
          <option value="multiple_choice" ${q.type==='multiple_choice'?'selected':''}>Multiple choice</option>
          <option value="long_answer" ${q.type==='long_answer'?'selected':''}>Long answer</option>
        </select></div>`;
      const mcFields = q.type==="multiple_choice" ? `
        <div class="field"><label>Options (select correct)</label>
          ${q.options.map((opt,oi)=>`<div class="opt-row"><input type="radio" name="qzcorrect-${i}" data-qz-correct="${i}" value="${oi}" ${q.correct===oi?'checked':''}><input type="text" data-qz-opt="${i}:${oi}" value="${escapeHtml(opt)}"><button class="mini-btn danger" data-qz-opt-del="${i}:${oi}" ${q.options.length<=2?'disabled':''}>✕</button></div>`).join("")}
          <button class="mini-btn" data-qz-opt-add="${i}" style="margin-top:4px;">+ Add option</button>
        </div>
        <div class="field"><label>Explanation (optional)</label><textarea data-qz-explain="${i}" style="min-height:50px;">${escapeHtml(q.explain)}</textarea></div>` : "";
      return `<div class="sub-card"><div class="sub-card-head"><span class="tag">QUESTION ${i+1} · EDITING</span><div style="display:flex;align-items:center;gap:10px;"><span id="qz-save-status-${i}" style="font-size:11px;color:var(--text-faint);font-family:var(--mono);"></span><button class="mini-btn danger" data-qz-del="${i}">Delete</button></div></div>
        ${typeToggle}
        <div class="field"><label>Question</label><textarea data-qz-text="${i}" style="min-height:55px;">${escapeHtml(q.question)}</textarea></div>
        ${mcFields}
        <div class="nav-buttons"><div></div><button class="btn primary" data-qz-done="${i}">Done</button></div>
      </div>`;
    }
    return `<div class="sub-card"><div class="sub-card-head"><span class="tag">QUESTION ${i+1}${q.question?' · '+escapeHtml(q.question.slice(0,50))+(q.question.length>50?'…':''):''} · ${q.type==='long_answer'?'LONG ANSWER':'MULTIPLE CHOICE'}</span>
      <div class="mini-tools"><button class="mini-btn" data-qz-edit="${i}">Edit</button><button class="mini-btn danger" data-qz-del="${i}">Delete</button></div></div>
    </div>`;
  }).join("");

  const quizDepts = DEPARTMENTS.filter(dep=> d[dep.teamField]);
  const deptFieldHtml = locked
    ? `<div class="field"><label>Department</label><p style="color:var(--text-dim);font-size:13px;margin:0;">${quizDepts.map(dep=>dep.label).join(' + ') || 'None'} — set when the quiz was sent, can't be changed after.</p></div>`
    : `<div class="field"><label>Send to which department(s)</label>
        ${DEPARTMENTS.map(dep=>`<label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text);margin-bottom:6px;"><input type="checkbox" data-qz-dept-check="${dep.id}" ${d[dep.teamField]?'checked':''}> ${escapeHtml(dep.label)}</label>`).join("")}
        <p class="hint">Check one or more — only people with access to a checked department can ever see this quiz.</p>
      </div>`;
  const audienceSection = `
    ${deptFieldHtml}
    <div class="field"><label>Send to</label>
      <select id="qz-audience" ${locked?'disabled':''}>
        <option value="everyone" ${d.audienceType==='everyone'?'selected':''}>Everyone</option>
        <option value="team" ${d.audienceType==='team'?'selected':''}>A specific team…</option>
        <option value="specific" ${d.audienceType==='specific'?'selected':''}>Specific people…</option>
      </select>
    </div>
    ${d.audienceType==='team' ? `<div class="field" id="qz-team-field"><label>Team</label><select id="qz-team-select" ${locked?'disabled':''}>${TEAMS_LIST.filter(t=> quizDepts.some(dep=> t[dep.teamField])).map(t=>`<option value="${t.id}" ${d.teamId===t.id?'selected':''}>${escapeHtml(t.name)}</option>`).join("") || '<option value="">No teams in these departments yet</option>'}</select></div>` : ""}
    ${d.audienceType==='specific' ? `<div class="field" id="qz-people-field"><label>Choose people</label><div id="qz-people-list" style="max-height:170px;overflow-y:auto;border:1px solid var(--stroke);border-radius:8px;padding:10px;">${teamRows.filter(r=> quizDepts.some(dep=> r[dep.rowField])).map(r=>`<label style="display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px;color:var(--text);"><input type="checkbox" value="${r.id}" class="qz-person-check" ${d.specificIds.includes(r.id)?'checked':''} ${locked?'disabled':''}> ${escapeHtml(r.name)}</label>`).join("")}</div></div>` : ""}
  `;

  renderShell(`
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <div class="k-label">${d.sent ? "SENT QUIZ" : "DRAFT QUIZ"}</div>
        <span id="qz-title-save-status" style="font-size:11px;color:var(--text-faint);font-family:var(--mono);"></span>
      </div>
      <div class="field"><label>Quiz title</label><input type="text" id="qz-title" value="${escapeHtml(d.title)}"></div>
      ${audienceSection}
      <div class="editor-section"><div class="editor-section-head"><h3>Questions</h3></div>${questionsHtml || '<p style="color:var(--text-faint);font-size:13px;">No questions yet.</p>'}<button class="dashed-btn" id="add-qz-question">+ Add question</button></div>
      <div class="nav-buttons"><div style="display:flex;gap:10px;"><button class="btn" id="qz-back">← Back</button><button class="btn danger" id="qz-delete">Delete quiz</button></div>
      ${!d.sent ? `<button class="btn primary" id="qz-send">Send quiz →</button>` : `<span class="status-pill done">Sent</span>`}</div>
      ${!d.sent ? `<p style="color:var(--text-faint);font-size:11.5px;font-family:var(--mono);margin-top:10px;">Questions save automatically. Nobody can see this quiz until you send it.</p>` : ""}
    </div>
  `);
  wireQuizBuilderEvents();
}

function wireQuizBuilderEvents(){
  const d = quizBuilderDraft;

  document.getElementById("qz-back").addEventListener("click", async ()=>{ await loadStandaloneQuizzes(); view="quizzes"; render(); });
  document.getElementById("qz-delete").addEventListener("click", async ()=>{
    if(confirm(`Delete "${d.title||'this quiz'}"? This can't be undone.`)){
      await supabase.from("standalone_quizzes").delete().eq("id", d.id);
      logEdit("deleted", "standalone_quiz", d.title);
      await loadStandaloneQuizzes(); view="quizzes"; render();
    }
  });

  const titleInput = document.getElementById("qz-title");
  titleInput.addEventListener("input", (e)=>{
    d.title = e.target.value;
    const statusEl = document.getElementById("qz-title-save-status");
    if(statusEl){ statusEl.textContent = "Saving…"; statusEl.style.color = "var(--text-faint)"; }
    clearTimeout(quizTitleAutosaveTimer);
    quizTitleAutosaveTimer = setTimeout(async ()=>{
      const { error } = await silentSave(()=> supabase.from("standalone_quizzes").update({ title:d.title }).eq("id", d.id));
      const el = document.getElementById("qz-title-save-status");
      if(el){ if(error){ el.textContent="Couldn't save: "+error.message; el.style.color="var(--red)"; } else { el.textContent="Saved"; el.style.color="var(--green)"; } }
    }, 600);
  });

  const audienceSelect = document.getElementById("qz-audience");
  if(audienceSelect) audienceSelect.addEventListener("change", (e)=>{ d.audienceType = e.target.value; renderQuizBuilder(); });
  const teamSelect = document.getElementById("qz-team-select");
  if(teamSelect) teamSelect.addEventListener("change", (e)=>{ d.teamId = e.target.value; });
  root.querySelectorAll("[data-qz-dept-check]").forEach(el=> el.addEventListener("change", (e)=>{
    const dep = DEPARTMENTS.find(x=>x.id===el.getAttribute("data-qz-dept-check"));
    if(dep) d[dep.teamField] = e.target.checked;
    renderQuizBuilder(); // re-render so the team/people lists below reflect the new department selection immediately
  }));

  root.querySelectorAll("[data-qz-edit]").forEach(el=> el.addEventListener("click", ()=>{ expandedQuizQuestionIdx = +el.dataset.qzEdit; renderQuizBuilder(); }));
  root.querySelectorAll("[data-qz-done]").forEach(el=> el.addEventListener("click", ()=>{ expandedQuizQuestionIdx = null; renderQuizBuilder(); }));
  root.querySelectorAll("[data-qz-del]").forEach(el=> el.addEventListener("click", async ()=>{
    const i = +el.dataset.qzDel;
    if(!confirm("Delete this question?")) return;
    const { error } = await supabase.from("standalone_quiz_questions").delete().eq("id", d.questions[i].id);
    if(error){ alert("Couldn't delete: " + error.message); return; }
    d.questions.splice(i,1);
    if(expandedQuizQuestionIdx===i) expandedQuizQuestionIdx=null;
    renderQuizBuilder();
  }));

  function scheduleQuestionAutosave(i){
    const q = d.questions[i];
    const statusEl = document.getElementById(`qz-save-status-${i}`);
    if(statusEl){ statusEl.textContent = "Saving…"; statusEl.style.color = "var(--text-faint)"; }
    clearTimeout(quizQuestionAutosaveTimers[q.id]);
    window.pendingAutosaveKeys.add("qzquestion:"+q.id);
    quizQuestionAutosaveTimers[q.id] = setTimeout(async ()=>{
      const { error } = await silentSave(()=> supabase.from("standalone_quiz_questions").update({
        question_type:q.type, question:q.question,
        options: q.type==="multiple_choice" ? q.options : null,
        correct_index: q.type==="multiple_choice" ? q.correct : null,
        explanation: q.explain
      }).eq("id", q.id));
      window.pendingAutosaveKeys.delete("qzquestion:"+q.id);
      const el = document.getElementById(`qz-save-status-${i}`);
      if(el){ if(error){ el.textContent="Couldn't save: "+error.message; el.style.color="var(--red)"; } else { el.textContent="Saved"; el.style.color="var(--green)"; } }
    }, 600);
  }
  root.querySelectorAll("[data-qz-type]").forEach(el=> el.addEventListener("change", (e)=>{ const i=+el.dataset.qzType; d.questions[i].type=e.target.value; scheduleQuestionAutosave(i); renderQuizBuilder(); }));
  root.querySelectorAll("[data-qz-text]").forEach(el=> el.addEventListener("input", (e)=>{ const i=+el.dataset.qzText; d.questions[i].question=e.target.value; scheduleQuestionAutosave(i); }));
  root.querySelectorAll("[data-qz-explain]").forEach(el=> el.addEventListener("input", (e)=>{ const i=+el.dataset.qzExplain; d.questions[i].explain=e.target.value; scheduleQuestionAutosave(i); }));
  root.querySelectorAll("[data-qz-opt]").forEach(el=> el.addEventListener("input", (e)=>{ const [qi,oi]=el.dataset.qzOpt.split(":").map(Number); d.questions[qi].options[oi]=e.target.value; scheduleQuestionAutosave(qi); }));
  root.querySelectorAll("[data-qz-correct]").forEach(el=> el.addEventListener("change", (e)=>{ const i=+el.dataset.qzCorrect; d.questions[i].correct=+e.target.value; scheduleQuestionAutosave(i); }));
  root.querySelectorAll("[data-qz-opt-add]").forEach(el=> el.addEventListener("click", ()=>{ const i=+el.dataset.qzOptAdd; d.questions[i].options.push("New option"); scheduleQuestionAutosave(i); renderQuizBuilder(); }));
  root.querySelectorAll("[data-qz-opt-del]").forEach(el=> el.addEventListener("click", ()=>{
    const [qi,oi]=el.dataset.qzOptDel.split(":").map(Number); if(d.questions[qi].options.length<=2) return;
    d.questions[qi].options.splice(oi,1);
    if(d.questions[qi].correct===oi) d.questions[qi].correct=0; else if(d.questions[qi].correct>oi) d.questions[qi].correct-=1;
    scheduleQuestionAutosave(qi); renderQuizBuilder();
  }));

  document.getElementById("add-qz-question").addEventListener("click", async ()=>{
    const { data, error } = await supabase.from("standalone_quiz_questions").insert({ quiz_id:d.id, sort_order:d.questions.length, question_type:"multiple_choice", question:"New question", options:["Option A","Option B"], correct_index:0, explanation:"" }).select().single();
    if(error){ alert("Couldn't add question: " + error.message); return; }
    d.questions.push({ id:data.id, type:data.question_type, question:data.question, options:data.options, correct:data.correct_index, explain:data.explanation||"" });
    expandedQuizQuestionIdx = d.questions.length-1;
    renderQuizBuilder();
  });

  root.querySelectorAll(".qz-person-check").forEach(cb=> cb.addEventListener("change", ()=>{
    d.specificIds = Array.from(document.querySelectorAll(".qz-person-check:checked")).map(c=>c.value);
  }));

  const sendBtn = document.getElementById("qz-send");
  if(sendBtn) sendBtn.addEventListener("click", async ()=>{
    if(!d.title.trim()){ alert("Give the quiz a title first."); return; }
    if(!d.questions.length){ alert("Add at least one question first."); return; }
    if(!DEPARTMENTS.some(dep=> d[dep.teamField])){ alert("Check at least one department to send this to."); return; }
    if(d.audienceType==="team" && !d.teamId){ alert("Pick a team first."); return; }
    if(d.audienceType==="specific" && !d.specificIds.length){ alert("Pick at least one person first."); return; }
    sendBtn.disabled = true; sendBtn.textContent = "Sending…";

    // Recipient list first, and checked for real errors — this is what actually
    // determines who can see the quiz, so it must never fail silently.
    if(d.audienceType==="specific"){
      const { error: delErr } = await Promise.resolve(supabase.from("standalone_quiz_recipients").delete().eq("quiz_id", d.id));
      if(delErr){ alert("Couldn't set up recipients: " + delErr.message); sendBtn.disabled = false; sendBtn.textContent = "Send quiz →"; return; }
      const { error: recErr } = await Promise.resolve(supabase.from("standalone_quiz_recipients").insert(d.specificIds.map(uid=>({ quiz_id:d.id, user_id:uid }))));
      if(recErr){ alert("Couldn't send to the people you picked: " + recErr.message); sendBtn.disabled = false; sendBtn.textContent = "Send quiz →"; return; }
    }

    const updateObj = { audience_type:d.audienceType, team_id: d.audienceType==="team"?d.teamId:null, sent:true, sent_at:new Date().toISOString() };
    DEPARTMENTS.forEach(dep=>{ updateObj[dep.teamDbField] = !!d[dep.teamField]; });
    const { error } = await supabase.from("standalone_quizzes").update(updateObj).eq("id", d.id);
    if(error){ alert("Couldn't send: " + error.message); sendBtn.disabled = false; sendBtn.textContent = "Send quiz →"; return; }

    d.sent = true;
    logEdit("sent", "standalone_quiz", d.title);
    showToast("Quiz sent.");
    await loadStandaloneQuizzes();
    view = "quizzes"; render();
    // Notify whoever it was sent to (best-effort — never let this block the UI from updating).
    (async ()=>{
      const recipientRole = d.audienceType==="everyone" ? null : d.audienceType==="team" ? "team" : "specific";
      const { data: annData } = await Promise.resolve(supabase.from("messages").insert({
        sender_id: session.user.id, sender_name: profile.name, audience:"all", type:"announcement",
        body: `<p>📝 New quiz available: <strong>${escapeHtml(d.title)}</strong>. Head to Quizzes to take it.</p>`,
        recipient_role: recipientRole,
        team_id: d.audienceType==="team" ? d.teamId : null
      }).select().single()).catch(()=>({ data:null }));
      if(d.audienceType==="specific" && annData){
        await Promise.resolve(supabase.from("announcement_recipients").insert(d.specificIds.map(uid=>({ message_id: annData.id, user_id: uid })))).catch(()=>{});
      }
      await loadStandaloneQuizzes().catch(()=>{});
    })();
  });
}

/* ============================================================
   STANDALONE QUIZZES — admin-authored, no module attached.
   Separate from Training Module quizzes entirely.
   ============================================================ */
let QUIZZES = [];
let quizAlertActive = false; // drives the red/green dot on the Home "Quizzes" card
let quizListSectionOpen = { pending:true, completed:false, sent:false, sentCompleted:false };
let quizPageMode = "mine"; // "mine" = quizzes assigned to me, "manage" = quizzes I've created/sent to others
let currentQuizId = null;
let standaloneQuizStartedAt = {}; // quizId -> ISO timestamp captured when the trainee opens a standalone quiz, for the Tracker export
let quizTakeAnswers = {};
let quizBuilderDraft = null;
let expandedQuizQuestionIdx = null;

async function loadStandaloneQuizzes(){
  const [{ data: quizzes }, { data: questions }, { data: myAttempts }, { data: myTeamMemberships }, { data: myRecipientRows }] = await Promise.all([
    supabase.from("standalone_quizzes").select("*").order("created_at", { ascending:false }),
    supabase.from("standalone_quiz_questions").select("*").order("sort_order"),
    supabase.from("standalone_quiz_attempts").select("*").eq("user_id", session.user.id),
    supabase.from("team_members").select("team_id").eq("user_id", session.user.id),
    supabase.from("standalone_quiz_recipients").select("quiz_id").eq("user_id", session.user.id)
  ]);
  const myTeamIds = new Set((myTeamMemberships||[]).map(m=>m.team_id));
  const myRecipientQuizIds = new Set((myRecipientRows||[]).map(r=>r.quiz_id));

  QUIZZES = (quizzes||[])
    .filter(q=> myDepartments().some(id=> rawRowHasDeptAccess(q, id)))
    .map(q=>{
    // Broad visibility (via RLS) lets any quiz-manager see every quiz, for
    // management purposes. That's NOT the same as "this quiz is actually
    // meant for me to take" — compute that separately and explicitly.
    let isRecipient = false;
    if(q.sent){
      if(q.audience_type === "everyone") isRecipient = true;
      else if(q.audience_type === "team") isRecipient = myTeamIds.has(q.team_id);
      else if(q.audience_type === "specific") isRecipient = myRecipientQuizIds.has(q.id);
    }
    return {
      id:q.id, title:q.title, createdBy:q.created_by, createdByName:q.created_by_name,
      accessTs:!!q.access_ts, accessCs:!!q.access_cs, accessTestboard:!!q.access_testboard,
      audienceType:q.audience_type, teamId:q.team_id, sent:q.sent, createdAt:q.created_at,
      questions:(questions||[]).filter(qq=>qq.quiz_id===q.id).map(qq=>({ id:qq.id, type:qq.question_type, question:qq.question, options:qq.options||[], correct:qq.correct_index, explain:qq.explanation||"" })),
      myAttempt: (myAttempts||[]).find(a=>a.quiz_id===q.id) || null,
      isRecipient, isFullyComplete:false // filled in by the background pass below, for quiz-managers only
    };
  });

  // A reasonable first-pass value so the dashboard LED is correct immediately
  // for regular users; managers get a more complete answer (including ungraded
  // submissions) once the background pass below finishes.
  quizAlertActive = QUIZZES.some(q=> q.isRecipient && !q.myAttempt);

  // Completion status across everyone (not just yourself) is only needed for
  // quiz-managers, and requires 4 extra bulk queries — not worth blocking
  // everyone else's login for. Runs after the page is already usable.
  if(canCreateQuizzes()) loadQuizManagerExtras().catch(()=>{});
}

async function loadQuizManagerExtras(){
  const [aAttempts, aTeamMembers, aRecipients, aProfiles] = await Promise.all([
    supabase.from("standalone_quiz_attempts").select("quiz_id,user_id,graded"),
    supabase.from("team_members").select("team_id,user_id"),
    supabase.from("standalone_quiz_recipients").select("quiz_id,user_id"),
    supabase.from("profiles").select("id")
  ]);
  const allAttempts = aAttempts.data || [], allTeamMembers = aTeamMembers.data || [];
  const allRecipients = aRecipients.data || [], allProfileIds = (aProfiles.data || []).map(p=>p.id);

  QUIZZES.forEach(q=>{
    if(!q.sent) return;
    let eligibleIds;
    if(q.audienceType === "everyone") eligibleIds = allProfileIds;
    else if(q.audienceType === "team") eligibleIds = allTeamMembers.filter(m=>m.team_id===q.teamId).map(m=>m.user_id);
    else eligibleIds = allRecipients.filter(r=>r.quiz_id===q.id).map(r=>r.user_id);
    q.isFullyComplete = eligibleIds.length > 0 && eligibleIds.every(uid=>{
      const att = allAttempts.find(a=>a.quiz_id===q.id && a.user_id===uid);
      return att && att.graded;
    });
  });

  const hasPending = QUIZZES.some(q=> q.isRecipient && !q.myAttempt);
  const hasUngraded = allAttempts.some(a=> !a.graded);
  quizAlertActive = hasPending || hasUngraded;
  if(view==="home" || view==="quizzes") render(); // refresh the LED / Sent Quizzes tab now that this landed
}

const EDIT_LOG_TYPE_LABELS = {
  module: "Module", lesson: "Lesson", module_quiz_question: "Module quiz question",
  reference_page: "Reference page", standalone_quiz: "Quiz", standalone_quiz_attempt: "Quiz grading"
};
const EDIT_LOG_ACTION_COLORS = { created:"var(--green)", updated:"var(--cyan)", deleted:"var(--red)", sent:"var(--amber)", graded:"var(--cyan)" };

function renderEditLog(){
  const dept = currentActiveDepartment();
  let rows = EDIT_LOG_ROWS.filter(r=> !r.department || r.department===dept);

  }

  if(editLogPage > totalPages) editLogPage = totalPages;
  if(editLogPage < 1) editLogPage = 1;
  const startIdx = (editLogPage - 1) * editLogPageSize;
  const pageRows = rows.slice(startIdx, startIdx + editLogPageSize);

  const rowsHtml = pageRows.map(r=>{
    const typeLabel = EDIT_LOG_TYPE_LABELS[r.entity_type] || r.entity_type;
    const actionColor = EDIT_LOG_ACTION_COLORS[r.action] || "var(--text-dim)";

      <td style="font-family:var(--mono);font-size:11.5px;color:var(--text-dim);white-space:nowrap;">${escapeHtml(typeLabel)}</td>
      <td>${escapeHtml(r.entity_label||'')}</td>
    </tr>`;
  }).join("");

  const deptTabsHtml = (myDepartments().length>1) ? `<div class="dept-tabs">
      ${renderDeptTabsHtml(dept, 'editlog-dept')}
    </div>` : "";

  renderShell(`
    ${deptTabsHtml}
    <div class="card">
      <div class="k-label">ADMIN</div>
      <h2 style="margin-bottom:4px;">Edit Log</h2>
      <p style="color:var(--text-dim);font-size:13.5px;margin:0 0 20px;">Every change to modules, lessons, module quizzes, the reference guide, and standalone quizzes — including who made it and when.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center;">
        <input type="text" id="edit-log-search" data-no-enter-submit placeholder="Search by name or person…" value="${escapeHtml(editLogSearchQuery)}" class="search-input" style="width:220px;">
        <select id="edit-log-filter" style="width:auto;">
          <option value="">All types</option>
          ${Object.entries(EDIT_LOG_TYPE_LABELS).map(([k,v])=>`<option value="${k}" ${editLogTypeFilter===k?'selected':''}>${v}</option>`).join("")}
        </select>
        <div style="margin-left:auto;display:flex;align-items:center;gap:8px;">
          <span style="color:var(--text-faint);font-size:12.5px;">Per page:</span>
          <select id="edit-log-pagesize" style="width:auto;">
            <option value="25" ${editLogPageSize===25?'selected':''}>25</option>
            <option value="50" ${editLogPageSize===50?'selected':''}>50</option>
            <option value="100" ${editLogPageSize===100?'selected':''}>100</option>
          </select>
        </div>
      </div>
      <div style="overflow-x:auto;"><table class="team"><thead><tr><th>When</th><th>Who</th><th>Action</th><th>Type</th><th>What</th></tr></thead><tbody>${rowsHtml || `<tr><td colspan="5" style="color:var(--text-faint);font-size:13px;padding:16px 4px;">No matching entries.</td></tr>`}</tbody></table></div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-top:16px;flex-wrap:wrap;gap:10px;">
        <span style="color:var(--text-faint);font-size:12.5px;">${rows.length ? `Showing ${startIdx+1}–${Math.min(startIdx+editLogPageSize, rows.length)} of ${rows.length}` : "No entries"}</span>
        <div style="display:flex;gap:8px;align-items:center;">
          <button class="mini-btn" id="edit-log-prev" ${editLogPage<=1?'disabled':''}>← Prev</button>
          <span style="color:var(--text-dim);font-size:12.5px;font-family:var(--mono);">Page ${editLogPage} of ${totalPages}</span>
          <button class="mini-btn" id="edit-log-next" ${editLogPage>=totalPages?'disabled':''}>Next →</button>
        </div>
      </div>
    </div>
  `);

  root.querySelectorAll("[data-editlog-dept]").forEach(el=> el.addEventListener("click", ()=>{
    activeDepartment = el.getAttribute("data-editlog-dept");
    editLogPage = 1; render();
  }));
  document.getElementById("edit-log-filter").addEventListener("change", (e)=>{ editLogTypeFilter = e.target.value; editLogPage = 1; render(); });
  document.getElementById("edit-log-pagesize").addEventListener("change", (e)=>{ editLogPageSize = +e.target.value; editLogPage = 1; render(); });
  document.getElementById("edit-log-prev").addEventListener("click", ()=>{ if(editLogPage>1){ editLogPage--; render(); } });
  document.getElementById("edit-log-next").addEventListener("click", ()=>{ if(editLogPage<totalPages){ editLogPage++; render(); } });
  const searchEl = document.getElementById("edit-log-search");
  let editLogSearchDebounce = null;
  searchEl.addEventListener("input", (e)=>{
    editLogSearchQuery = e.target.value;
    editLogPage = 1;
    clearTimeout(editLogSearchDebounce);
    editLogSearchDebounce = setTimeout(()=>{
      render();
      const el = document.getElementById("edit-log-search");
      if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
    }, 200);
  });
}

/* ============================================================
   NOTIFICATIONS / MESSAGING
   ============================================================ */
async function loadAllNotifications(){
  const joinCutoff = (profile && profile.created_at) ? profile.created_at : "1970-01-01T00:00:00Z";
  const admin = isAdmin();
  // None of these seven depend on each other — only followUps below does
  // (needs rootIds from these). Batched into one round trip instead of
  // running sequentially.
  const [
    { data: announcements, error: announceErr },
    { data: dismissals },
    { data: myRoots },
    { data: directSent },
    { data: directReceived },
    ucRes,
    mcRes
  ] = await Promise.all([
    supabase.from("messages").select("*").eq("audience","all").gte("created_at", joinCutoff).order("created_at",{ascending:false}).limit(15),
    supabase.from("announcement_dismissals").select("message_id").eq("user_id", session.user.id),
    supabase.from("messages").select("*").eq("audience","admins").is("thread_id", null).eq("sender_id", session.user.id).order("created_at",{ascending:false}),
    supabase.from("messages").select("*").eq("audience","user").is("thread_id", null).eq("sender_id", session.user.id).order("created_at",{ascending:false}),
    supabase.from("messages").select("*").eq("audience","user").is("thread_id", null).eq("recipient_id", session.user.id).order("created_at",{ascending:false}),
    admin ? supabase.from("messages").select("*").eq("audience","admins").is("thread_id", null).is("claimed_by", null).order("created_at",{ascending:false}) : Promise.resolve({ data: null }),
    admin ? supabase.from("messages").select("*").eq("audience","admins").is("thread_id", null).eq("claimed_by", session.user.id).order("created_at",{ascending:false}) : Promise.resolve({ data: null })
  ]);
  if(announceErr) console.error("Failed to load announcements:", announceErr);
  const dismissedIds = new Set((dismissals||[]).map(d=>d.message_id));
  NOTIF_ANNOUNCEMENTS = (announcements||[]).filter(a=> !dismissedIds.has(a.id));

  let claimedRoots = [];
  if(admin){
    NOTIF_UNCLAIMED = (ucRes.data||[]).filter(m=> !m.department || canAccessDepartment(m.department));
    claimedRoots = (mcRes.data||[]).filter(m=> !m.department || canAccessDepartment(m.department));
  } else {
    NOTIF_UNCLAIMED = [];
  }

  const rootMap = {};
  (myRoots||[]).forEach(r=> rootMap[r.id]=r);
  claimedRoots.forEach(r=> rootMap[r.id]=r);
  (directSent||[]).forEach(r=> rootMap[r.id]=r);
  (directReceived||[]).forEach(r=> rootMap[r.id]=r);
  const allRoots = Object.values(rootMap);
  const rootIds = allRoots.map(r=>r.id);

  let followUps = [];
  if(rootIds.length){
    const { data: fu } = await supabase.from("messages").select("*").eq("audience","user").in("thread_id", rootIds).order("created_at",{ascending:true});
    followUps = fu || [];
  }
  NOTIF_THREADS = allRoots.map(root=>{
    const messages = followUps.filter(f=>f.thread_id===root.id);
    const lastActivity = messages.length ? messages[messages.length-1].created_at : root.created_at;
    return { root, messages, lastActivity };
  }).sort((a,b)=> new Date(b.lastActivity) - new Date(a.lastActivity));

  const quizLinkedThreads = NOTIF_THREADS.filter(t=> t.root.related_quiz_id && t.root.related_quiz_user_id);
  if(quizLinkedThreads.length){
    const quizIds = [...new Set(quizLinkedThreads.map(t=>t.root.related_quiz_id))];
    const { data: linkedAttempts } = await supabase.from("standalone_quiz_attempts").select("*").in("quiz_id", quizIds);
    const { data: linkedQuizzes } = await supabase.from("standalone_quizzes").select("id,title").in("id", quizIds);
    quizLinkedThreads.forEach(t=>{
      t.relatedAttempt = (linkedAttempts||[]).find(a=> a.quiz_id===t.root.related_quiz_id && a.user_id===t.root.related_quiz_user_id) || null;
      t.relatedQuizTitle = (linkedQuizzes||[]).find(q=>q.id===t.root.related_quiz_id)?.title || "quiz";
    });
  }
}

function notifBadgeCount(){
  return isAdmin() ? NOTIF_UNCLAIMED.length : 0;
}
function chatBadgeCount(){
  let unread = 0;
  NOTIF_THREADS.forEach(t=> t.messages.forEach(m=>{ if(m.recipient_id===session.user.id && !m.is_read) unread++; }));
  return unread;
}

async function loadMessagingData(){
  await loadAllNotifications();
}

async function markMyThreadMessagesRead(){
  const unreadIds = [];
  NOTIF_THREADS.forEach(t=> t.messages.forEach(m=>{ if(m.recipient_id===session.user.id && !m.is_read) unreadIds.push(m.id); }));
  if(unreadIds.length){ await supabase.from("messages").update({ is_read:true }).in("id", unreadIds); await loadMessagingData(); }
}

function applyDefaultThreadVisibility(){
  if(NOTIF_THREADS.length > 1){
    NOTIF_THREADS.forEach(t=> collapsedThreadIds.add(t.root.id));
  } else if(NOTIF_THREADS.length === 1){
    collapsedThreadIds.delete(NOTIF_THREADS[0].root.id);
  }
}

async function openNotifications(){
  await loadMessagingData();
  view = "notifications"; render();
}

async function openChat(focusThreadId){
  await loadMessagingData();
  await markMyThreadMessagesRead();
  applyDefaultThreadVisibility();
  if(focusThreadId) collapsedThreadIds.delete(focusThreadId);
  view = "chat"; render();
}

async function refreshMessagingView(){
  await loadMessagingData();
  if(view==="chat") await markMyThreadMessagesRead();
  if(view==="notifications" || view==="chat") render();
}

const typeLabel = { flag:"🚩 Flag", highlight:"✨ Highlight", comment:"💬 Comment" };

function otherPartyName(t){
  if(t.root.sender_id !== session.user.id) return t.root.sender_name;
  const theirMsg = t.messages.find(m=> m.sender_id !== session.user.id);
  return theirMsg ? theirMsg.sender_name : "no one yet";
}

function threadCardHtml(t){
  const statusPill = !t.root.claimed_by ? `<span class="status-pill progress">Awaiting reply</span>` : `<span class="status-pill done">In conversation</span>`;
  const collapsed = collapsedThreadIds.has(t.root.id);

  if(collapsed){

      <div class="sub-card thread-card thread-collapsed" data-thread-toggle="${t.root.id}">
        <div class="sub-card-head" style="cursor:pointer;">
          <span class="tag">${typeLabel[t.root.type]||t.root.type}${t.root.context?(' · '+escapeHtml(t.root.context)):''} · with ${escapeHtml(otherPartyName(t))}</span>

        </div>
      </div>`;
  }

  const bubbles = [t.root, ...t.messages].map(m=>{
    const mine = m.sender_id === session.user.id;
    return `<div class="chat-bubble ${mine?'mine':'theirs'}">
      <div class="chat-bubble-meta">${escapeHtml(m.sender_name)} · ${new Date(m.created_at).toLocaleString()}</div>
      <div class="chat-bubble-body">${sanitizeHtml(m.body)}</div>

  const needsGrading = t.relatedAttempt && !t.relatedAttempt.graded;
  const gradingHtml = needsGrading ? `
    <div class="sub-card" style="background:#0a0f1c;margin-top:10px;">
      <div class="sub-card-head"><span class="tag">GRADE THIS SUBMISSION · ${escapeHtml(t.relatedQuizTitle||'')}</span></div>

          <div style="font-size:13px;color:var(--text);margin-bottom:4px;"><strong>${escapeHtml(ans.question)}</strong></div>
          <div style="font-size:13px;color:var(--text-dim);white-space:pre-wrap;margin-bottom:8px;">${escapeHtml(ans.answer||'(no answer)')}</div>
          <div style="display:flex;gap:8px;">

  const bottomHtml = needsGrading ? `
      <div class="field" style="margin-top:10px;"><label style="font-size:11px;color:var(--text-faint);">Optional feedback to include with your response</label>${richEditorHtml(`thread-rte-${t.root.id}`, "")}</div>

      <div class="field" style="margin-top:10px;">${richEditorHtml(`thread-rte-${t.root.id}`, "")}</div>
      <button class="mini-btn" data-send-thread="${t.root.id}" style="margin-top:8px;">Send</button>
    `;

  return `
    <div class="sub-card thread-card">
      <div class="sub-card-head">
        <span class="tag">${typeLabel[t.root.type]||t.root.type}${t.root.context?(' · '+escapeHtml(t.root.context)):''} · with ${escapeHtml(otherPartyName(t))}</span>
        <span style="display:flex;gap:8px;align-items:center;">${statusPill}<button class="mini-btn" data-thread-toggle="${t.root.id}">Hide</button><button class="mini-btn danger" data-discard-thread="${t.root.id}">Discard</button></span>
      </div>
      <div class="chat-scroll">${bubbles}</div>

      ${bottomHtml}
    </div>`;

function renderChat(){
  const threadsHtml = NOTIF_THREADS.map(threadCardHtml).join("") || `<p style="color:var(--text-faint);font-size:13px;">No conversations yet.</p>`;

  renderShell(`
    <div class="card">
      <div class="k-label">CHAT</div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
        <h2 style="margin:0;">Conversations</h2>
        <button class="btn primary" id="new-convo-btn">+ New Conversation</button>
      </div>
      ${threadsHtml}
    </div>
  `);

  const newConvoBtn = document.getElementById("new-convo-btn");
  if(newConvoBtn) newConvoBtn.addEventListener("click", openNewConversationModal);

  NOTIF_THREADS.forEach(t=> wireRichEditor(`thread-rte-${t.root.id}`));
  root.querySelectorAll("[data-thread-toggle]").forEach(el=> el.addEventListener("click", (e)=>{
    e.stopPropagation();
    const id = el.getAttribute("data-thread-toggle");
    if(collapsedThreadIds.has(id)) collapsedThreadIds.delete(id); else collapsedThreadIds.add(id);
    render();
  }));
  root.querySelectorAll("[data-discard-thread]").forEach(el=> el.addEventListener("click", async ()=>{
    const id = el.getAttribute("data-discard-thread");
    if(confirm("Discard this conversation? This can't be undone.")){
      await supabase.from("messages").delete().eq("thread_id", id);
      await supabase.from("messages").delete().eq("id", id);
      collapsedThreadIds.delete(id);
      await refreshMessagingView();
    }
  }));
  root.querySelectorAll("[data-send-thread]").forEach(el=> el.addEventListener("click", async ()=>{
    await sendThreadMessage(el.getAttribute("data-send-thread"));
  }));
  root.querySelectorAll(".chat-grade-choice").forEach(btn=> btn.addEventListener("click", ()=>{
    const rootId = btn.getAttribute("data-chat-grade-root");
    const idx = btn.getAttribute("data-chat-grade-idx");
    const val = btn.getAttribute("data-chat-grade-val") === "true";
    if(!chatPendingGrades[rootId]) chatPendingGrades[rootId] = {};
    chatPendingGrades[rootId][idx] = val;
    root.querySelectorAll(`.chat-grade-choice[data-chat-grade-root="${rootId}"][data-chat-grade-idx="${idx}"]`).forEach(b=>{
      const isThis = b === btn;
      b.style.color = isThis ? (val ? "var(--green)" : "var(--red)") : "var(--text-dim)";
      b.style.fontWeight = isThis ? "700" : "400";
    });
  }));
  root.querySelectorAll("[data-send-grading-response]").forEach(btn=> btn.addEventListener("click", async ()=>{
    const rootId = btn.getAttribute("data-send-grading-response");
    const t = NOTIF_THREADS.find(x=>x.root.id===rootId);
    if(!t || !t.relatedAttempt) return;
    const grades = chatPendingGrades[rootId] || {};
    const longAnswerIdxs = t.relatedAttempt.answers.map((a,i)=> a.type==="long_answer" ? i : null).filter(i=>i!=null);
    const allGraded = longAnswerIdxs.every(i=> grades[i] != null);
    if(!allGraded){ alert("Mark every long-answer question Correct or Incorrect before sending a response."); return; }

    btn.disabled = true; btn.textContent = "Sending…";
    const updatedAnswers = t.relatedAttempt.answers.map((a,i)=> a.type==="long_answer" ? { ...a, is_correct: grades[i] } : a);

    const { data: updatedRows, error: gradeErr } = await supabase.from("standalone_quiz_attempts").update({ answers: updatedAnswers, graded: true }).eq("quiz_id", t.root.related_quiz_id).eq("user_id", t.root.related_quiz_user_id).select();
    if(gradeErr){ alert("Couldn't save grading: " + gradeErr.message); btn.disabled = false; btn.textContent = "Send response"; return; }
    if(!updatedRows || !updatedRows.length){ alert("Grading didn't save — the database silently rejected this update (likely a permissions rule). Nothing was sent. Please tell your admin/developer this happened."); btn.disabled = false; btn.textContent = "Send response"; return; }

    const editorEl = document.getElementById(`thread-rte-${rootId}`);
    const customFeedback = editorEl ? getCleanEditorHtml(editorEl).trim() : "";
    const correctCount = longAnswerIdxs.filter(i=>grades[i]===true).length;
    const summaryHtml = `<p>Your long-answer responses for "<strong>${escapeHtml(t.relatedQuizTitle||'the quiz')}</strong>" have been graded: ${correctCount}/${longAnswerIdxs.length} (${longAnswerIdxs.length?Math.round((correctCount/longAnswerIdxs.length)*100):0}%) correct.</p>${(customFeedback && customFeedback!=="<br>") ? customFeedback : ""}`;

    const { error: msgErr } = await supabase.from("messages").insert({
      sender_id: session.user.id, sender_name: profile.name,
      recipient_id: t.root.related_quiz_user_id, audience:"user", type:"reply",
      claimed_by: session.user.id, body: summaryHtml
    });
    if(msgErr){ alert("Grading was saved, but the response couldn't be sent: " + msgErr.message); }

    // Clear this submission out of the admin's conversations — its job is done.
    await supabase.from("messages").delete().eq("thread_id", rootId);
    await supabase.from("messages").delete().eq("id", rootId);

    delete chatPendingGrades[rootId];
    logEdit("graded", "standalone_quiz_attempt", `${t.relatedQuizTitle} — ${t.root.sender_name}`);
    QUIZ_PROGRESS_ROWS = null; // Quiz Progress will reflect the new grade on next load
    showToast("Response sent.");
    await refreshMessagingView();
  }));
}

async function sendThreadMessage(rootId){
  const editorEl = document.getElementById(`thread-rte-${rootId}`);
  const body = getCleanEditorHtml(editorEl).trim();
  if(!body || body === "<br>") return;
  const root = NOTIF_UNCLAIMED.find(m=>m.id===rootId) || (NOTIF_THREADS.find(t=>t.root.id===rootId)||{}).root;
  if(!root) return;

  const wasUnclaimedPoolItem = root.audience === "admins" && !root.claimed_by;

  let recipientId;
  if(root.audience === "user"){
    // Direct thread (e.g. admin-initiated coaching conversation) — just message the other participant.
    recipientId = (root.sender_id === session.user.id) ? root.recipient_id : root.sender_id;
  } else {
    // Pool-originated flag/comment thread.
    const iAmOriginalSender = root.sender_id === session.user.id;
    if(iAmOriginalSender){
      recipientId = root.claimed_by;
      if(!recipientId){ alert("No admin has picked this up yet — nothing to send to."); return; }
    } else {
      recipientId = root.sender_id;
      if(!root.claimed_by){
        await supabase.from("messages").update({ claimed_by: session.user.id }).eq("id", root.id).is("claimed_by", null);
      }
    }
  }
  await supabase.from("messages").insert({ sender_id: session.user.id, sender_name: profile.name, recipient_id: recipientId, audience:"user", type:"reply", body, context: root.context, thread_id: root.id });

  if(wasUnclaimedPoolItem){
    await openChat(root.id); // follow through on the conversation you just started
  } else {
    await refreshMessagingView();
  }
}
