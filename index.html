<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');
  :root{
    --bg:#0A0F1A; --panel:#121A2B; --stroke:#24304a; --text:#E7ECF6; --text-dim:#8A96AD; --text-faint:#5A6480;
    --green:#34D399; --green-dim:#34D39933; --amber:#F0A93D; --amber-dim:#F0A93D33; --red:#EF5D5D; --red-dim:#EF5D5D33;
    --cyan:#52D5E0; --cyan-dim:#52D5E033; --mono:'IBM Plex Mono',monospace; --sans:'IBM Plex Sans',sans-serif;
    --input-bg:#0e1626; --body-bg-glow:radial-gradient(circle at 15% -10%,#17233d 0%,transparent 45%),radial-gradient(circle at 100% 0%,#142234 0%,transparent 40%);
  }
  *{box-sizing:border-box;} html,body{margin:0;padding:0;}
  body{ background:var(--body-bg-glow),var(--bg); color:var(--text); font-family:var(--sans); min-height:100vh; -webkit-font-smoothing:antialiased; }
  a,button,input,textarea{font-family:inherit;}
  #app{ max-width:1180px; margin:0 auto; padding:28px 20px 90px; }
  header.top{ display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; padding-bottom:22px; margin-bottom:26px; border-bottom:1px solid var(--stroke); }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand-mark{ width:36px; max-width:36px; height:auto; max-height:36px; object-fit:contain; display:block; flex:none; }
  .brand-text .name{ font-family:var(--mono); font-weight:700; letter-spacing:.04em; font-size:13px; }
  .brand-text .tag{ font-size:11px; color:var(--text-faint); letter-spacing:.05em; }
  .top-right{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  nav.crumbs{ font-family:var(--mono); font-size:12px; color:var(--text-faint); }
  .crumbs-row{ display:block; font-family:var(--mono); font-size:12px; color:var(--text-faint); margin:-8px 0 18px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .crumbs-row button{ background:none; border:none; color:var(--cyan); cursor:pointer; font-family:var(--mono); font-size:12px; padding:0; }
  .crumbs-row button:hover{ text-decoration:underline; }
  nav.crumbs button{ background:none; border:none; color:var(--cyan); cursor:pointer; font-family:var(--mono); font-size:12px; padding:0; }
  .pill-btn{ font-family:var(--mono); font-size:11px; letter-spacing:.04em; padding:7px 12px; border-radius:7px; border:1px solid var(--stroke); background:#141d30; color:var(--text-dim); cursor:pointer; }
  .dept-tabs{ display:flex; gap:4px; margin-bottom:16px; border-bottom:2px solid var(--stroke); padding-left:2px; }
  .dept-tab{ padding:10px 22px; border-radius:10px 10px 0 0; border:1px solid transparent; border-bottom:none; background:transparent; color:var(--text-faint); cursor:pointer; font-size:13.5px; font-family:var(--sans); font-weight:600; position:relative; bottom:-2px; transition:background .15s, color .15s; }
  .dept-tab:hover{ color:var(--text-dim); background:var(--input-bg); }
  .dept-tab.active{ background:var(--panel); color:var(--cyan); border-color:var(--stroke); border-bottom:2px solid var(--panel); }
  html.theme-light .dept-tab.active{ background:var(--panel); border-bottom-color:var(--panel); }
  .pill-btn:hover{ border-color:#3a4a70; color:var(--text); }
  .admin-badge{ font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; padding:6px 10px; border-radius:20px; border:1px solid var(--amber-dim); background:var(--amber-dim); color:var(--amber); }
  .led-strip{ display:flex; gap:6px; align-items:center; }
  .led{ width:9px; height:9px; border-radius:50%; background:#26314a; border:1px solid #2f3c5a; flex:none; }
  .led.on-green{ background:var(--green); border-color:var(--green); box-shadow:0 0 8px var(--green); }
  .led.on-amber{ background:var(--amber); border-color:var(--amber); box-shadow:0 0 8px var(--amber); }
  .led.on-red{ background:var(--red); border-color:var(--red); box-shadow:0 0 8px var(--red); }
  .led.blink{ animation:blinkled 1.1s steps(1) infinite; } @keyframes blinkled{50%{opacity:.15;}}
  .hero{ background:var(--panel); border:1px solid var(--stroke); border-radius:14px; padding:26px 26px 22px; margin-bottom:26px; position:relative; overflow:hidden; }
  .hero::after{ content:""; position:absolute; right:-40px; top:-40px; width:220px; height:220px; background:radial-gradient(circle,var(--cyan-dim),transparent 70%); pointer-events:none; }
  .hero .eyebrow{ font-family:var(--mono); font-size:11px; color:var(--cyan); letter-spacing:.14em; text-transform:uppercase; margin-bottom:10px; }
  .hero h1{ font-size:26px; margin:0 0 10px; line-height:1.25; font-weight:700; }
  .hero p{ color:var(--text-dim); font-size:14.5px; line-height:1.6; max-width:560px; margin:0 0 18px; }
  .panel-row{ display:flex; gap:22px; flex-wrap:wrap; }
  .stat{ font-family:var(--mono); } .stat .num{ font-size:22px; font-weight:700; } .stat .lbl{ font-size:11px; color:var(--text-faint); letter-spacing:.06em; }
  .grid{ display:grid; gap:14px; }
  .mod-card{ background:var(--panel); border:1px solid var(--stroke); border-radius:12px; padding:20px; cursor:pointer; transition:.15s; display:flex; flex-direction:column; gap:12px; position:relative; }
  .mod-card:hover{ border-color:#3a4a70; transform:translateY(-1px); }
  .mod-card .row-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:14px; }
  .mod-card h3{ margin:0 0 6px; font-size:16.5px; } .mod-card .sub{ color:var(--text-dim); font-size:13px; line-height:1.5; margin:0; }
  .mod-card .meta{ font-family:var(--mono); font-size:11px; color:var(--text-faint); display:flex; gap:14px; margin-top:2px; align-items:center; }
  .status-pill{ font-family:var(--mono); font-size:10.5px; letter-spacing:.05em; padding:4px 9px; border-radius:20px; border:1px solid var(--stroke); color:var(--text-faint); white-space:nowrap; text-transform:uppercase; }
  button.status-pill{ background:var(--panel); text-transform:none; letter-spacing:0; font-size:11.5px; }
  button.status-pill:hover{ border-color:#3a4a70; color:var(--text); }
  .team-row-main:hover{ background:#141d30; } html.theme-light .team-row-main:hover{ background:var(--input-bg); }
  .team-row-detail td{ border-bottom:1px solid var(--stroke); background:var(--input-bg); }
  html.theme-light .team-row-detail td{ background:#f5f7fb; }
  .status-pill.done{ color:var(--green); border-color:var(--green-dim); background:var(--green-dim); }
  .status-pill.progress{ color:var(--amber); border-color:var(--amber-dim); background:var(--amber-dim); }
  .progress-bar{ height:5px; border-radius:4px; background:#1c2740; overflow:hidden; } .progress-bar>div{ height:100%; background:linear-gradient(90deg,var(--cyan),var(--green)); }
  .card-tools{ position:absolute; top:14px; right:14px; display:flex; gap:6px; }
  .icon-btn{ width:28px; height:28px; border-radius:7px; border:1px solid var(--stroke); background:#0f1626; color:var(--text-dim); cursor:pointer; font-size:13px; display:flex; align-items:center; justify-content:center; }
  .icon-btn:hover{ border-color:#3a4a70; color:var(--text); } .icon-btn.danger:hover{ border-color:var(--red); color:var(--red); }
  .add-mod-card{ border:1px dashed var(--stroke); border-radius:12px; display:flex; align-items:center; justify-content:center; padding:26px; cursor:pointer; color:var(--text-faint); font-family:var(--mono); font-size:12.5px; }
  .add-mod-card:hover{ border-color:var(--cyan); color:var(--cyan); }
  .lesson-nav{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:22px; }
  .lesson-tab{ font-family:var(--mono); font-size:11.5px; padding:7px 12px; border-radius:8px; border:1px solid var(--stroke); background:var(--panel); color:var(--text-dim); cursor:pointer; }
  .lesson-tab.active{ border-color:var(--cyan); color:var(--cyan); background:var(--cyan-dim); } .lesson-tab.quiz{ margin-left:auto; }
  .card{ background:var(--panel); border:1px solid var(--stroke); border-radius:12px; padding:26px; position:relative; }
  .ref-content .card{ border:none; }
  .card h2{ margin:0 0 4px; font-size:20px; } .card .k-label{ font-family:var(--mono); font-size:11px; color:var(--text-faint); letter-spacing:.1em; text-transform:uppercase; margin-bottom:14px; }
  .card .body p{ color:#C7CFE0; font-size:14.5px; line-height:1.75; margin:0 0 14px; }
  .card .body ul{ margin:0 0 14px; padding-left:20px; color:#C7CFE0; font-size:14.5px; line-height:1.8; } .card .body li{ margin-bottom:4px; } .card .body strong{ color:var(--text); }
  .card .body img{ max-width:100%; border-radius:8px; margin:10px 0; display:block; }
  .light-table{ display:grid; grid-template-columns:auto 1fr; gap:10px 16px; margin:16px 0 18px; font-size:13.5px; }
  .light-table .lt-led{ display:flex; align-items:center; gap:8px; font-family:var(--mono); color:var(--text-dim); } .light-table .lt-desc{ color:#C7CFE0; }
  .callout{ border-left:3px solid var(--amber); background:var(--amber-dim); border-radius:0 8px 8px 0; padding:12px 16px; font-size:13.5px; color:#F3DCB0; margin:16px 0; }
  .callout.tip{ border-left-color:var(--cyan); background:var(--cyan-dim); color:#C9EEF2; }
  .nav-buttons{ display:flex; justify-content:space-between; margin-top:22px; gap:10px; flex-wrap:wrap; }
  .btn{ font-family:var(--mono); font-size:12.5px; letter-spacing:.03em; padding:10px 18px; border-radius:8px; border:1px solid var(--stroke); background:#182236; color:var(--text); cursor:pointer; transition:.15s; }
  .btn:hover{ border-color:#4a5b82; } .btn.primary{ background:linear-gradient(155deg,#1c3a35,#14261f); border-color:var(--green); color:var(--green); }
  .btn.primary:hover{ box-shadow:0 0 0 1px var(--green); } .btn.danger{ background:linear-gradient(155deg,#3a1c1c,#261414); border-color:var(--red); color:var(--red); } .btn:disabled{ opacity:.35; cursor:not-allowed; }
  .q-progress{ font-family:var(--mono); font-size:11.5px; color:var(--text-faint); margin-bottom:8px; }
  .q-block{ margin-bottom:8px; } .q-block h3{ font-size:16.5px; line-height:1.5; margin:0 0 18px; }
  .opt{ display:flex; align-items:flex-start; gap:12px; padding:13px 15px; border:1px solid var(--stroke); border-radius:9px; margin-bottom:10px; cursor:pointer; background:#0f1626; transition:.12s; }
  .opt:hover{ border-color:#3a4a70; } .opt .dot{ width:15px; height:15px; border-radius:50%; border:1px solid #445071; flex:none; margin-top:2px; }
  .opt span.txt{ font-size:14px; color:#D5DCEA; line-height:1.5; }
  .opt.selected{ border-color:var(--cyan); background:var(--cyan-dim); } .opt.selected .dot{ border-color:var(--cyan); background:var(--cyan); }
  .opt.correct{ border-color:var(--green); background:var(--green-dim); } .opt.correct .dot{ border-color:var(--green); background:var(--green); }
  .opt.wrong{ border-color:var(--red); background:var(--red-dim); } .opt.wrong .dot{ border-color:var(--red); background:var(--red); } .opt.disabled{ cursor:default; }
  .explain{ font-size:13px; color:var(--text-dim); background:#0f1626; border:1px solid var(--stroke); border-radius:8px; padding:12px 14px; margin-top:6px; line-height:1.6; } .explain strong{ color:var(--text); }
  .result-hero{ text-align:center; padding:36px 20px; } .result-hero .big-score{ font-family:var(--mono); font-size:52px; font-weight:700; } .result-hero .verdict{ font-size:14px; color:var(--text-dim); margin-top:6px; }
  .led-array{ display:flex; justify-content:center; gap:8px; margin:22px 0; } .led-array .led{ width:12px; height:12px; }
  footer.foot{ margin-top:60px; text-align:center; font-family:var(--mono); font-size:11px; color:var(--text-faint); }
  .field{ margin-bottom:16px; } .field label{ display:block; font-family:var(--mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-faint); margin-bottom:6px; }
  .field input[type=text],.field input[type=email],.field input[type=password],.field textarea{ width:100%; background:var(--input-bg); border:1px solid var(--stroke); border-radius:8px; color:var(--text); padding:10px 12px; font-size:13.5px; line-height:1.6; font-family:var(--sans); resize:vertical; }
  .search-input{ background:var(--input-bg); border:1px solid var(--stroke); border-radius:8px; color:var(--text); padding:9px 12px; font-size:13px; font-family:var(--sans); }
  .search-input:focus{ border-color:var(--cyan); }
  .field textarea{ font-family:var(--mono); font-size:12.5px; min-height:110px; }
  .field input:focus,.field textarea:focus{ border-color:var(--cyan); } .field .hint{ font-size:11px; color:var(--text-faint); margin-top:5px; }
  .editor-section{ margin-top:30px; } .editor-section-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .editor-section-head h3{ font-size:14px; margin:0; font-family:var(--mono); letter-spacing:.05em; color:var(--text-dim); text-transform:uppercase; }
  .sub-card{ background:var(--input-bg); border:1px solid var(--stroke); border-radius:10px; padding:18px; margin-bottom:14px; position:relative; }
  .sub-card-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; } .sub-card-head .tag{ font-family:var(--mono); font-size:10.5px; color:var(--text-faint); }
  .mini-tools{ display:flex; gap:6px; }
  .mini-btn{ font-family:var(--mono); font-size:10.5px; padding:5px 9px; border-radius:6px; border:1px solid var(--stroke); background:#141d30; color:var(--text-dim); cursor:pointer; }
  .mini-btn:hover{ border-color:#3a4a70; color:var(--text); } .mini-btn.danger:hover{ border-color:var(--red); color:var(--red); }
  .opt-row{ display:flex; align-items:center; gap:10px; margin-bottom:8px; } .opt-row input[type=radio]{ accent-color:var(--green); width:16px; height:16px; flex:none; } .opt-row input[type=text]{ flex:1; }
  .dashed-btn{ width:100%; border:1px dashed var(--stroke); border-radius:9px; background:none; color:var(--text-faint); font-family:var(--mono); font-size:12px; padding:12px; cursor:pointer; }
  .dashed-btn:hover{ border-color:var(--cyan); color:var(--cyan); }
  table.team{ width:100%; border-collapse:collapse; font-size:13px; }
  table.team th{ text-align:left; font-family:var(--mono); font-size:10.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.05em; padding:8px 10px; border-bottom:1px solid var(--stroke); }
  table.team td{ padding:10px; border-bottom:1px solid var(--stroke); color:#D5DCEA; }
  .role-tag{ font-family:var(--mono); font-size:10px; padding:3px 8px; border-radius:12px; border:1px solid var(--stroke); }
  .role-tag.admin{ color:var(--amber); border-color:var(--amber-dim); background:var(--amber-dim); }
  .auth-wrap{ max-width:400px; margin:60px auto; }
  .auth-toggle{ display:flex; gap:8px; margin-bottom:20px; }
  .auth-toggle button{ flex:1; padding:10px; border-radius:8px; border:1px solid var(--stroke); background:#141d30; color:var(--text-dim); cursor:pointer; font-family:var(--mono); font-size:12px; }
  .auth-toggle button.active{ border-color:var(--cyan); color:var(--cyan); background:var(--cyan-dim); }
  .error-msg{ color:var(--red); font-size:12.5px; font-family:var(--mono); margin:-6px 0 12px; }
  .info-msg{ color:var(--cyan); font-size:12.5px; font-family:var(--mono); margin:-6px 0 12px; }
  @media (max-width:640px){ .hero h1{ font-size:21px; } .card{ padding:18px; } }
  html.theme-light{
    --bg:#F3F5FA; --panel:#FFFFFF; --stroke:#DCE3F0; --text:#1B2233; --text-dim:#5B6478; --text-faint:#8891A3;
    --input-bg:#eef1f8; --body-bg-glow:none;
  }
  html.theme-light body{ background:#F3F5FA; }

  /* Programmer — true black terminal, phosphor green */
  html.theme-programmer{
    --bg:#000000; --panel:#000000; --stroke:#1f3d1f; --text:#3dff70; --text-dim:#2ee85c; --text-faint:#22b348;
    --green:#3dff70; --green-dim:#3dff7033; --amber:#ffcc00; --amber-dim:#ffcc0033; --red:#ff4444; --red-dim:#ff444433;
    --cyan:#00ffaa; --cyan-dim:#00ffaa33; --input-bg:#020a04; --body-bg-glow:none;
  }
  html.theme-programmer body{ background:#000000; }
  html.theme-programmer, html.theme-programmer .card .body p, html.theme-programmer .card .body ul, html.theme-programmer .opt span.txt{ font-family:var(--mono); }

  /* Retro Amber — old CRT monochrome terminal */
  html.theme-retro{

(function(){

    if(window.loadingBarSuppressed || window.silentSaveDepth > 0) return;

    bar.style.opacity = '1';
    if(parseFloat(bar.style.width) < 70) bar.style.width = '70%';
  }

    if(activeRequests===0) return; // nothing to hide (e.g. showBar was suppressed for this one)

      // three sequential (not concurrent) requests, and without this grace
      // period each one finishes and restarts the bar, showing as a visible
      // double sweep instead of one smooth motion.
      completeTimer = setTimeout(()=>{
        bar.style.width = '100%';

    if(isSupabase) showBar();
    const result = _origFetch(...args);
    if(isSupabase) result.finally(hideBar);

})();

/* ============================================================
   GUEST MODE — lets a visitor tour the real app with sample data
   and zero writes ever reaching the database. Rather than
   rewriting every screen to use fake data, we let the real
   render/data functions run exactly as normal, but transparently
   redirect every supabase.from(...) call to an in-memory,
   always-empty, always-successful fake result while guest mode is
   on. Combined with skipping the handful of top-level "load from
   DB" functions (which would otherwise overwrite our sample data
   with that emptiness), this means the whole app just works as a
   sandbox with zero risk to real data and zero code duplication.
   ============================================================ */
let guestMode = false;
let guestViewingAsAdmin = false;

function _fakeQueryChain(){
  const result = { data: [], error: null, count: 0 };
  const chain = {
    select(){ return chain; }, insert(){ return chain; }, update(){ return chain; }, upsert(){ return chain; }, delete(){ return chain; },
    eq(){ return chain; }, neq(){ return chain; }, in(){ return chain; }, is(){ return chain; },
    gt(){ return chain; }, gte(){ return chain; }, lt(){ return chain; }, lte(){ return chain; },
    order(){ return chain; }, limit(){ return chain; }, range(){ return chain; },
    single(){ return Promise.resolve({ data:null, error:null }); },
    then(resolve, reject){ return Promise.resolve(result).then(resolve, reject); },
    catch(reject){ return Promise.resolve(result).catch(reject); },
  };
  return chain;
}
const _realSupabaseFrom = supabase.from.bind(supabase);
supabase.from = function(table){ return guestMode ? _fakeQueryChain() : _realSupabaseFrom(table); };
const _realInvoke = supabase.functions.invoke.bind(supabase.functions);
supabase.functions.invoke = function(name, opts){

  return _realInvoke(name, opts);
};

/* ============================================================
   APP STATE
   ============================================================ */
let session = null;

let MODULES = [];           // [{id,title,short,ledColor,lessons:[...],quiz:[...]}]
let progressMap = {};       // { moduleId: {best,total,lastScore,attempts} }
let INTERACTIVE_PICTURES = {}; // id -> { id, lessonId, image, hotspots:[{id,x,y,w,h,title,body}] }
let myInteractivePicProgress = {}; // interactivePictureId -> Set of read hotspot ids
let dismissedModulePopups = new Set(); // moduleIds this user chose "don't show again" for

let view = "loading";       // loading | auth | dashboard | lesson | quiz | results | editor | team
let authMode = "login";     // login | signup
let authError = "";
let authInfo = "";

let currentModId = null;
let currentLessonIdx = 0;

const root = document.getElementById("app");
function escapeHtml(s){ const d=document.createElement("div"); d.textContent=s==null?"":s; return d.innerHTML; }

/* ============================================================
   ULTIMATE EDIT MODE — one specific person can override any
   piece of static site copy. Overrides persist for everyone;
   only the super editor can change them.

let UI_TEXT = {};
let UI_TEXT_DEFAULTS = {};
let ultimateEditMode = false;

function isSuperEditor(){
  return !!(session && session.user && session.user.email && session.user.email.toLowerCase() === "cruzeclevenger@gmail.com");
}

function T(key, defaultText){
  UI_TEXT_DEFAULTS[key] = defaultText;
  const val = Object.prototype.hasOwnProperty.call(UI_TEXT, key) ? UI_TEXT[key] : defaultText;
  if(ultimateEditMode && isSuperEditor()){
    return `<span class="ult-edit-text" data-ult-key="${escapeHtml(key)}">${escapeHtml(val)}</span>`;
  }

}

async function loadUiTextOverrides(){
  const { data } = await supabase.from("site_text_overrides").select("*");
  UI_TEXT = {};
  (data||[]).forEach(row=>{ UI_TEXT[row.key] = row.value; });
}
async function saveUiTextOverride(key, value){
  await supabase.from("site_text_overrides").upsert({ key, value, updated_at: new Date().toISOString() });
  UI_TEXT[key] = value;
}
async function resetUiTextOverride(key){
  await supabase.from("site_text_overrides").delete().eq("key", key);
  delete UI_TEXT[key];
}

function openUltEditModal(key){
  const current = Object.prototype.hasOwnProperty.call(UI_TEXT, key) ? UI_TEXT[key] : (UI_TEXT_DEFAULTS[key] || "");
  openModal(`
    <h3>Edit text</h3>
    <p class="sub">Key: <span style="font-family:var(--mono);">${escapeHtml(key)}</span> — visible to everyone once saved.</p>

  document.getElementById("ult-cancel-btn").addEventListener("click", closeModal);
  document.getElementById("ult-reset-btn").addEventListener("click", async ()=>{

// Enter submits the nearest primary action from any single-line text input —
// textareas and contenteditable bodies are untouched, since Enter there means
// "new line," not "submit."
const ENTER_SUBMIT_SKIP_TYPES = ["checkbox","radio","button","submit","file","range","color"];
document.addEventListener("keydown", (e)=>{
  if(e.key !== "Enter" || e.shiftKey) return;
  const el = e.target;
  if(!el || el.tagName !== "INPUT") return;
  if(ENTER_SUBMIT_SKIP_TYPES.includes((el.type||"text").toLowerCase())) return;
  if(el.hasAttribute("data-no-enter-submit")) return;
  const container = el.closest(".modal, .card, .auth-wrap") || document;
  const primaryBtn = container.querySelector(".btn.primary, #auth-submit");
  if(primaryBtn && !primaryBtn.disabled){
    e.preventDefault();
    primaryBtn.click();
  }
});
function modById(id){ return MODULES.find(m=>m.id===id); }
function pct(s){ return s && s.total ? Math.round((s.best/s.total)*100) : 0; }
function overallPct(m){
  const s = progressMap[m.id];
  const totalLessons = m.lessons.length || 1;
  const viewedCount = s && s.lessonsViewed ? s.lessonsViewed.length : 0;
  const lessonFraction = Math.min(viewedCount / totalLessons, 1);
  if(!m.quiz.length) return Math.round(lessonFraction * 100);
  const quizFraction = s ? (s.best||0) / m.quiz.length : 0;
  return Math.round((lessonFraction*0.5 + quizFraction*0.5) * 100);
}
async function markLessonViewed(m, lessonId){
  const existing = progressMap[m.id] || { best:0, total:m.quiz.length, lastScore:0, attempts:0, lessonsViewed:[] };
  if(!existing.lessonsViewed) existing.lessonsViewed = [];
  if(existing.lessonsViewed.includes(lessonId)) return; // already recorded, skip the write
  existing.lessonsViewed = [...existing.lessonsViewed, lessonId];
  progressMap[m.id] = existing;
  await supabase.from("progress").upsert({
    user_id: session.user.id, module_id: m.id,

/* ============================================================
   DATA LOADING
   ============================================================ */
async function loadEverything(){
  if(guestMode) return;
  // All eight of these are independent of each other — none reads a result
  // from any of the others, only session.user.id, which is already
  // available before this function even runs. Previously split into two
  // sequential Promise.all batches even though the second batch never
  // actually needed anything from the first; combining them into one cuts
  // the wait down to the single slowest query instead of the sum of two
  // separate round-trip groups.
  const [modsRes, lessonsRes, quizRes, progRes, dismissalsRes, ipicsRes, ipProgressRes, quizInProgressRes] = await Promise.all([
    supabase.from("modules").select("*").order("sort_order"),
    supabase.from("lessons").select("*").order("sort_order"),
    supabase.from("quiz_questions").select("id,module_id,sort_order,question,options,correct_index,explanation,question_type,end_goal,final_screen_id").order("sort_order"),
    supabase.from("progress").select("*").eq("user_id", session.user.id),
    supabase.from("module_popup_dismissals").select("module_id").eq("user_id", session.user.id),
    supabase.from("interactive_pictures").select("id,lesson_id,hotspots"),
    supabase.from("interactive_picture_progress").select("*").eq("user_id", session.user.id),
    supabase.from("quiz_in_progress").select("module_id").eq("user_id", session.user.id)
  ]);
  const mods = modsRes.data, lessons = lessonsRes.data, quiz = quizRes.data;
  MODULES = (mods||[]).map(m=>({
    id:m.id, title:m.title, short:m.short, ledColor:m.led_color, department: m.department || 'TS',
    popupEnabled: !!m.popup_enabled, popupTitle: m.popup_title||"", popupBody: m.popup_body||"",
    lessons:(lessons||[]).filter(l=>l.module_id===m.id).map(l=>({id:l.id,label:l.label,title:l.title,body:l.body})),
    // sim_screens (Simulated Navigation screenshots) deliberately excluded here — each one can hold
    // several full-resolution screenshots, and bulk-loading every module's at login was the single
    // biggest contributor to slow first-page load. Fetched lazily instead, only when actually needed
    // (starting that quiz, or opening that module in the editor) — see ensureQuizSimScreens().
    quiz:(quiz||[]).filter(q=>q.module_id===m.id).map(q=>({id:q.id,q:q.question,opts:q.options,correct:q.correct_index,explain:q.explanation,type:q.question_type||'multiple_choice',simScreens:null,endGoal:q.end_goal||'button',finalScreenId:q.final_screen_id||null}))
  }));

  modulesWithResumableQuiz = new Set((quizInProgressRes.data||[]).map(r=>r.module_id));

  progressMap = {};
  (progRes.data||[]).forEach(p=>{ progressMap[p.module_id] = { best:p.best_score, total:p.total, lastScore:p.last_score, attempts:p.attempts, lessonsViewed:p.lessons_viewed||[] }; });

  dismissedModulePopups = new Set((dismissalsRes.data||[]).map(d=>d.module_id));

  INTERACTIVE_PICTURES = {};
  (ipicsRes.data||[]).forEach(ip=>{ INTERACTIVE_PICTURES[ip.id] = { id:ip.id, lessonId:ip.lesson_id, image:null, hotspots:ip.hotspots||[] }; });
  myInteractivePicProgress = {};
  (ipProgressRes.data||[]).forEach(p=>{ myInteractivePicProgress[p.interactive_picture_id] = new Set(p.read_hotspot_ids||[]); });
}

async function ensureQuizSimScreens(m){
  const simQuestions = m.quiz.filter(q=> q.type==='simulation' && q.simScreens===null);
  if(!simQuestions.length) return;
  const ids = simQuestions.map(q=>q.id);
  const { data } = await supabase.from("quiz_questions").select("id,sim_screens").in("id", ids);
  (data||[]).forEach(row=>{
    const q = m.quiz.find(x=>x.id===row.id);
    if(q) q.simScreens = row.sim_screens || [];
  });
}

async function ensureInteractivePicImage(ipId){
  const ip = INTERACTIVE_PICTURES[ipId];
  if(!ip || ip.image) return ip; // already have it, or it doesn't exist
  const { data } = await supabase.from("interactive_pictures").select("image").eq("id", ipId).single();
  if(data) ip.image = data.image;
  return ip;
}

async function loadProfile(){
  if(guestMode) return;
  const { data } = await supabase.from("profiles").select("*").eq("id", session.user.id).single();
  profile = data;
  simWarningDismissed = !!(profile && profile.sim_warning_dismissed);
  dashboardShowCompleted = !!(profile && profile.dashboard_show_completed);
}

function openGuestIntroModal(){
  openModal(`
    <h3>You're about to view a guest preview</h3>
    <p class="sub">Feel free to click around — but nothing here is real data. Any module edits, quiz answers, notes, announcements, or messages you create will <strong style="color:var(--text);">not</strong> be saved anywhere. This is a sandboxed look at the site, not the live system.</p>
    <div class="modal-actions"><button class="btn" id="guest-cancel">Never mind</button><button class="btn primary" id="guest-continue">Got it, continue</button></div>
  `);
  document.getElementById("guest-cancel").addEventListener("click", closeModal);
  document.getElementById("guest-continue").addEventListener("click", ()=>{ closeModal(); openGuestTourChoiceModal(); });
}

function openGuestTourChoiceModal(){
  openModal(`
    <h3>Would you like to review all the features?</h3>
    <p class="sub">I can show you a quick rundown of what this platform can do — especially the admin side — or you can jump straight in and explore on your own with sample data. Either way, you can pull up the feature list anytime from the button at the top.</p>
    <div class="modal-actions"><button class="btn" id="guest-explore">No thanks, let me explore</button><button class="btn primary" id="guest-review-features">Yes, show me</button></div>
  `);
  document.getElementById("guest-explore").addEventListener("click", ()=>{ closeModal(); enterGuestMode(false); });
  document.getElementById("guest-review-features").addEventListener("click", ()=>{ closeModal(); enterGuestMode(true); });
}

async function fetchGuestDemoCustomization(){
  try{
    const { data, error } = await supabase.from("guest_demo_data").select("*").eq("id", 1).single();
    if(error || !data) return null;
    return data.data || null;
  }catch(e){ return null; }
}

async function enterGuestMode(showFeatures){
  const customization = await fetchGuestDemoCustomization(); // fetched BEFORE guestMode flips on, using the real client
  guestMode = true;
  guestViewingAsAdmin = false;
  buildGuestFixtures(customization);
  view = showFeatures ? "guest-features" : "home";
  render();
}

function exitGuestMode(){
  guestMode = false; guestViewingAsAdmin = false;
  session = null; profile = null;
  MODULES = []; progressMap = {}; REFERENCE_PAGES = []; PERSONAL_NOTES = []; TEAMS_LIST = []; teamRows = [];
  NOTIF_ANNOUNCEMENTS = []; NOTIF_THREADS = []; NOTIF_UNCLAIMED = [];
  ANALYZE_MODULE_STATS = []; ANALYZE_MISSED_QUESTIONS = []; ANALYZE_TOTALS = { totalPeople:0, notStarted:0, totalAttempts:0, totalFlags:0 };
  removeFeedbackButton();
  view = "auth"; authMode = "login"; render();
}

function buildGuestFixtures(customization){
  const now = new Date().toISOString();
  session = { user: { id: "guest-user", email: "guest@example.com" } };
  const defaults = defaultGuestData();
  const g = (customization && typeof customization === "object") ? customization : {};

  profile = { id:"guest-user", name:"Guest Visitor", role:"agent", created_at: now, is_first_login:false, last_seen_announcement_at: now };
  wasFirstLoginThisSession = false;
  editMode = false;

  const srcModules = (g.modules && g.modules.length) ? g.modules : defaults.modules;
  MODULES = srcModules.map((m,mi)=>({
    id: m.id || `guest-mod-${mi}`,
    title: m.title || "Untitled module",
    short: m.short || "",
    ledColor: m.ledColor || "green",
    lessons: (m.lessons||[]).map((l,li)=>({ id: l.id || `guest-lesson-${mi}-${li}`, label: l.label||"", title: l.title||"", body: l.body||"" })),
    quiz: (m.quiz||[]).map((q,qi)=>({ id: q.id || `guest-q-${mi}-${qi}`, q: q.q||"", opts: q.opts||["Option A","Option B"], correct: q.correct||0, explain: q.explain||"" }))
  }));
  progressMap = {};
  if(MODULES[0]){
    progressMap[MODULES[0].id] = { best: MODULES[0].quiz.length?1:0, total: MODULES[0].quiz.length, lastScore: MODULES[0].quiz.length?1:0, attempts: MODULES[0].quiz.length?1:0, lessonsViewed: MODULES[0].lessons.map(l=>l.id) };
  }

  const srcRef = (g.referencePages && g.referencePages.length) ? g.referencePages : defaults.referencePages;
  REFERENCE_PAGES = srcRef.map((p,i)=>({ id: p.id || `guest-ref-${i}`, parent_id: p.parent_id || null, sort_order: i, title: p.title||"Untitled page", body: p.body||"" }));
  currentRefId = REFERENCE_PAGES[0] ? REFERENCE_PAGES[0].id : null;
  refEditing = false; notesCollapsed = new Set(); refCollapsed = new Set();

  const srcNotes = (g.notes && g.notes.length) ? g.notes : defaults.notes;
  PERSONAL_NOTES = srcNotes.map((n,i)=>({ id: n.id || `guest-note-${i}`, parent_id:null, sort_order:i, title: n.title||"Untitled note", body: n.body||"" }));
  currentNoteId = PERSONAL_NOTES[0] ? PERSONAL_NOTES[0].id : null;

  const srcTeam = (g.team && g.team.length) ? g.team : defaults.team;
  TEAMS_LIST = [ { id:"gt1", name:"July 2026 New Hires", memberIds: srcTeam.map((_,i)=>`gu${i}`) } ];
  teamRows = srcTeam.map((t,i)=>{
    const overall = typeof t.overall === "number" ? t.overall : 0;
    const perModule = {}; const perModuleRaw = {};
    MODULES.forEach(m=>{
      perModule[m.id] = overall;
      perModuleRaw[m.id] = { best: Math.round((overall/100)*(m.quiz.length||0)), total: m.quiz.length, attempts: overall>0?1:0 };
    });
    return { id:`gu${i}`, name: t.name||"Unnamed", role: t.role||"agent", perModule, perModuleRaw, overall, mastered: t.mastered!=null ? t.mastered : (overall===100?MODULES.length:0), teamIds:["gt1"] };
  });

  const srcAnn = (g.announcement && g.announcement.body) ? g.announcement : defaults.announcement;
  NOTIF_ANNOUNCEMENTS = [ { id:"gann1", sender_name: srcAnn.senderName || "Admin", created_at: now, body: srcAnn.body } ];
  NOTIF_THREADS = [];
  NOTIF_UNCLAIMED = (MODULES[1] && MODULES[1].quiz[0]) ? [ { id:"gflag1", type:"flag", sender_name: teamRows[0]?teamRows[0].name:"A teammate", created_at: now, context:`${MODULES[1].title} — Q1`, body:"<p>Is this question worded confusingly? Just double-checking before I answer.</p>" } ] : [];

  ANALYZE_MODULE_STATS = MODULES.map(m=>({
    id:m.id, title:m.title,
    avgCompletion: teamRows.length ? Math.round(teamRows.reduce((a,r)=>a+(r.perModule[m.id]||0),0)/teamRows.length) : 0,
    masteredCount: teamRows.filter(r=>r.perModule[m.id]===100).length,
    startedCount: teamRows.filter(r=>(r.perModule[m.id]||0)>0).length
  }));
  ANALYZE_MISSED_QUESTIONS = (MODULES[1] && MODULES[1].quiz[0]) ? [ { moduleId:MODULES[1].id, moduleTitle:MODULES[1].title, question:MODULES[1].quiz[0].q, missed:4, total:6, missRate:67 } ] : [];
  ANALYZE_TOTALS = { totalPeople: teamRows.length, notStarted: teamRows.filter(r=>r.overall===0).length, totalAttempts: teamRows.length*3, totalFlags: NOTIF_UNCLAIMED.length };

  UI_TEXT = {}; UI_TEXT_DEFAULTS = {};
}

// Wrap an autosave's Supabase call so the global loading bar skips it —
// autosave-on-typing already shows its own "Saving…/Saved" text right next
// to the field, so the global bar firing on every keystroke-triggered save
// is redundant noise, unlike genuinely unindicated actions (deletes, page
// loads, explicit button clicks) where the bar is the only feedback.
async function silentSave(fn){
  window.silentSaveDepth = (window.silentSaveDepth||0) + 1;
  try { return await fn(); }
  finally { window.silentSaveDepth = Math.max(0, (window.silentSaveDepth||1) - 1); }
}

function promptDepartmentChoice(){
  return new Promise((resolve)=>{
    function draw(){
      openModal(`
        <h3>Which team are you on?</h3>
        <p class="sub">This decides which training modules and reference guide you'll see. An admin can always add access to the other team later if that changes.</p>
        <div class="modal-error" id="dept-pick-error" style="display:none;"></div>
        <div class="modal-actions" style="justify-content:center;gap:14px;">
          <button class="btn primary" id="dept-pick-ts" style="flex:1;">Tech Support</button>
          <button class="btn primary" id="dept-pick-cs" style="flex:1;">Customer Service</button>
        </div>
      `, false, true);
      // No close/cancel path is wired here on purpose — this has to be
      // answered before the account is usable, since which modules even
      // exist for this person depends on the answer.
      const finish = async (field, btn)=>{
        btn.disabled = true; btn.textContent = "Saving…";
        const { error } = await supabase.from("profiles").update({ [field]: true }).eq("id", session.user.id);
        if(error){
          // AUDIT FIX: this used to proceed regardless of whether the save
          // actually succeeded, which meant a failed write here (network
          // blip, etc.) let the person into the app with a choice that was
          // never actually persisted — silently bringing this same picker
          // back on their next login. Now it stays open and lets them retry.
          const err = document.getElementById("dept-pick-error");
          if(err){ err.textContent = "Couldn't save: " + error.message + " — try again."; err.style.display = "block"; }
          btn.disabled = false; btn.textContent = field==="can_access_ts" ? "Tech Support" : "Customer Service";
          return;
        }
        profile[field] = true;
        closeModal();
        resolve();
      };
      document.getElementById("dept-pick-ts").addEventListener("click", (e)=> finish("can_access_ts", e.target));
      document.getElementById("dept-pick-cs").addEventListener("click", (e)=> finish("can_access_cs", e.target));
    }
    draw();
  });
}

function formatNamePart(str){
  return str.trim().split(/\s+/).filter(Boolean).map(word=>
    word.split('-').map(seg => seg.charAt(0).toUpperCase() + seg.slice(1).toLowerCase()).join('-')
  ).join(' ');
}

async function submitAuth(){
  authError=""; authInfo="";
  const email = document.getElementById("auth-email").value.trim();
  const password = document.getElementById("auth-password").value;
  if(!email || !password){ authError = "Enter an email and password."; renderAuth(); return; }

  if(authMode==="signup"){
    const firstRaw = document.getElementById("auth-first-name").value.trim();
    const lastRaw = document.getElementById("auth-last-name").value.trim();
    if(!firstRaw || !lastRaw){ authError = "Enter your first and last name."; renderAuth(); return; }
    const name = `${formatNamePart(firstRaw)} ${formatNamePart(lastRaw)}`;
    const { data, error } = await supabase.auth.signUp({ email, password, options:{ data:{ name } } });
    if(error){ authError = error.message; renderAuth(); return; }
    if(data.session){
      session = data.session; await afterLogin();
    } else {
      authInfo = "Account created — check your email to confirm, then log in.";
      authMode = "login"; renderAuth();
    }
    return;
  }

  const { data, error } = await supabase.auth.signInWithPassword({ email, password });
  if(error){ authError = error.message; renderAuth(); return; }
  session = data.session;
  await afterLogin();
}

let wasFirstLoginThisSession = false;

async function afterLogin(){
  window.loadingBarSuppressed = true;
  view = "loading"; render();
  await loadProfile();
  wasFirstLoginThisSession = profile.is_first_login === true;
  if(wasFirstLoginThisSession){
    await supabase.from("profiles").update({ is_first_login:false }).eq("id", session.user.id);
    profile.is_first_login = false;
  }
  if(profile && !profile.can_access_ts && !profile.can_access_cs){
    await promptDepartmentChoice();
  }
  // These four don't depend on each other's results, only on profile being
  // loaded — running them in parallel instead of one-after-another cuts
  // total login time from the sum of all four round trips down to the
  // slowest single one.
  await Promise.all([
    loadEverything(),
    loadUiTextOverrides(),
    loadAllNotifications(),
    loadStandaloneQuizzes()
  ]);
  setupRealtime();
  window.loadingBarSuppressed = false;
  view = "home"; render();
  ensureFeedbackButton();
  await showUnseenAnnouncements();
}

async function showUnseenAnnouncements(){
  const since = profile.last_seen_announcement_at || profile.created_at || "1970-01-01T00:00:00Z";
  const { data, error } = await supabase.from("messages").select("*").eq("audience","all").gt("created_at", since).order("created_at",{ascending:true});
  if(error){ console.error("Failed to check for new announcements:", error); return; }
  const { data: dismissals } = await supabase.from("announcement_dismissals").select("message_id").eq("user_id", session.user.id);
  const dismissedIds = new Set((dismissals||[]).map(d=>d.message_id));
  const unseen = (data || []).filter(a=> !dismissedIds.has(a.id));

  // Unread chat messages — NOTIF_THREADS is already populated from loadAllNotifications() in afterLogin.
  const unreadMessages = [];
  NOTIF_THREADS.forEach(t=> t.messages.forEach(m=>{ if(m.recipient_id===session.user.id && !m.is_read) unreadMessages.push(m); }));

  if(!unseen.length && !unreadMessages.length) return;

  function renderDigest(){
    const annHtml = unseen.length ? `
      <h3 style="font-size:13px;color:var(--text-dim);margin:0 0 10px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.05em;">Announcements</h3>
      ${unseen.map(a=>`
        <div class="sub-card" data-digest-item="${a.id}">
          <div class="sub-card-head"><span class="tag">📣 ${escapeHtml(a.sender_name)} · ${new Date(a.created_at).toLocaleString()}</span>
            <button class="mini-btn" data-digest-dismiss="${a.id}">Dismiss</button></div>
          <div style="font-size:14px;color:var(--text);">${a.body}</div>
        </div>`).join("")}
    ` : "";

    const msgHtml = unreadMessages.length ? `
      <h3 style="font-size:13px;color:var(--text-dim);margin:${unseen.length?'20px':'0'} 0 10px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.05em;">New messages</h3>
      ${unreadMessages.map(m=>`
        <div class="sub-card">
          <div class="sub-card-head"><span class="tag">💬 ${escapeHtml(m.sender_name)} · ${new Date(m.created_at).toLocaleString()}</span></div>
          <div style="font-size:14px;color:var(--text);">${m.body}</div>
        </div>`).join("")}
      <button class="btn" id="digest-go-chat" style="margin-top:4px;">Open Chat →</button>
    ` : "";

    const totalCount = unseen.length + unreadMessages.length;
    openModal(`
      <h3>${totalCount===1 ? "1 thing" : `${totalCount} things`} while you were away</h3>
      <p class="sub">Posted or sent while you were logged out.</p>
      ${annHtml}${msgHtml}
      <div class="modal-actions">
        ${unseen.length ? `<button class="btn" id="ann-digest-dismiss-all">Dismiss all</button>` : ""}
        <button class="btn primary" id="ann-digest-ok">Got it</button>
      </div>
    `, true);
    document.querySelectorAll("[data-digest-dismiss]").forEach(el=> el.addEventListener("click", async ()=>{
      const id = el.getAttribute("data-digest-dismiss");
      await supabase.from("announcement_dismissals").upsert({ user_id: session.user.id, message_id: id });
      const idx = unseen.findIndex(u=>u.id===id);
      if(idx>-1) unseen.splice(idx,1);
      if(!unseen.length && !unreadMessages.length){ closeModal(); markAnnouncementsSeen(); }
      else renderDigest();
    }));
    const dismissAllBtn = document.getElementById("ann-digest-dismiss-all");
    if(dismissAllBtn) dismissAllBtn.addEventListener("click", async ()=>{
      await supabase.from("announcement_dismissals").upsert(unseen.map(a=>({ user_id: session.user.id, message_id: a.id })));
      unseen.length = 0;
      if(!unreadMessages.length){ closeModal(); markAnnouncementsSeen(); }
      else renderDigest();
    });
    const goChat = document.getElementById("digest-go-chat");
    if(goChat) goChat.addEventListener("click", ()=>{ closeModal(); markAnnouncementsSeen(); openChat(); });
    document.getElementById("ann-digest-ok").addEventListener("click", ()=>{ closeModal(); markAnnouncementsSeen(); });
  }

  async function markAnnouncementsSeen(){
    if(!data.length) return;
    const latest = data[data.length-1].created_at;
    await supabase.from("profiles").update({ last_seen_announcement_at: latest }).eq("id", session.user.id);
    profile.last_seen_announcement_at = latest;
  }

  renderDigest();
}

}

   ============================================================ */
function resumeLessonIdx(m){
  const s = progressMap[m.id];
  const viewed = s && s.lessonsViewed ? s.lessonsViewed : [];
  const idx = m.lessons.findIndex(l=> !viewed.includes(l.id));
  return idx === -1 ? Math.max(m.lessons.length-1, 0) : idx;
}
function moduleStatus(id){
  const s = progressMap[id];
  const m = modById(id);
  if(m && !m.quiz.length){
    const viewedCount = s && s.lessonsViewed ? s.lessonsViewed.length : 0;
    if(m.lessons.length && viewedCount >= m.lessons.length) return "mastered";
    if(viewedCount > 0) return "reading";
    return "new";
  }
  if(!s) return "new";
  if(s.total > 0 && s.best === s.total) return "mastered";
  if(!s.attempts) return "reading";
  return "attempted";
}

async function reorderModuleDrop(draggedId, targetId, pos){
  const fromIdx = MODULES.findIndex(m=>m.id===draggedId);
  let toIdx = MODULES.findIndex(m=>m.id===targetId);
  if(fromIdx===-1 || toIdx===-1) return;
  if(pos==="after") toIdx++;
  const dragged = MODULES[fromIdx];
  const reordered = MODULES.slice();
  reordered.splice(fromIdx,1);
  if(fromIdx < toIdx) toIdx--;
  reordered.splice(toIdx,0,dragged);
  MODULES = reordered;
  for(let i=0;i<MODULES.length;i++){
    await supabase.from("modules").update({ sort_order:i }).eq("id", MODULES[i].id);
  }
  render();
}

let activeDepartment = null; // 'TS' or 'CS' — only meaningful for people with access to both; set on first render
// AUDIT FIX: every fullscreen overlay (Simulated Navigation player/editor,
// Interactive Picture config/viewer) is appended directly to document.body,
// outside #root, so a normal render() never touches it. Each pushes its own
// removal here when opened, so logout() (or anything else that needs to
// force-close the app) can clean up whichever one happens to be open,
// instead of leaving it visually stuck on screen with stale listeners.
window.activeFullscreenCleanups = [];
function closeAllFullscreenOverlays(){
  window.activeFullscreenCleanups.forEach(fn=>{ try{ fn(); } catch(e){} });
  window.activeFullscreenCleanups = [];
}

function canAccessDepartment(dept){
  if(guestMode) return true; // guest preview shows everything regardless of department
  if(!profile) return false;
  return dept === 'CS' ? !!profile.can_access_cs : !!profile.can_access_ts;
}
function myDepartments(){
  const list = [];
  if(canAccessDepartment('TS')) list.push('TS');
  if(canAccessDepartment('CS')) list.push('CS');
  return list;
}
function currentActiveDepartment(){
  const mine = myDepartments();
  if(mine.length===0) return 'TS';
  if(activeDepartment && mine.includes(activeDepartment)) return activeDepartment;
  activeDepartment = mine[0];
  return activeDepartment;
}
let themeDropdownOpen = false;

function renderDashboard(){
  lastModuleContext = { view:"dashboard" };
  if(!guestMode && myDepartments().length===0){
    renderShell(`
      <div class="card">
        <div class="k-label">NO ACCESS YET</div>
        <h2 style="margin-bottom:8px;">You don't have access to any department yet</h2>
        <p style="color:var(--text-dim);font-size:14px;">This is unusual — normally this gets set the first time you log in. Ask an admin to grant you Tech Support or Customer Service access from Teams → People → Permissions.</p>
      </div>
    `);

  }

  const visibleModules = dashboardShowCompleted ? deptModules : deptModules.filter(m=> moduleStatus(m.id)!=="mastered");
  const cards = visibleModules.map(m=>{
    const status = moduleStatus(m.id); const s = progressMap[m.id];
    const pillHtml = status==="mastered" ? `<span class="status-pill done">Mastered</span>`
      : status==="attempted" ? `<span class="status-pill progress">${s.best}/${s.total} (${s.total?Math.round((s.best/s.total)*100):0}%) correct</span>`
      : status==="reading" ? `<span class="status-pill progress">${m.quiz.length ? "Quiz not started" : "In progress"}</span>`
      : `<span class="status-pill">Not started</span>`;

    const leds = `<span class="led ${on?'on-green':''}"></span><span class="led ${on?(mastered?'on-green':'on-amber blink'):''}"></span><span class="led ${mastered?'on-green':''}"></span>`;
    const tools = editOn ? `<div class="card-tools"><span class="drag-handle" title="Drag to reorder">⠿</span><button class="icon-btn" data-edit="${m.id}" title="Edit module">✎</button><button class="icon-btn danger" data-del="${m.id}" title="Delete module">✕</button></div>` : "";
    return `<div class="mod-card" data-mod="${m.id}" data-mod-drag="${m.id}" draggable="${editOn}">${tools}
      <div class="row-top"><div><h3>${escapeHtml(m.title)}</h3><p class="sub">${escapeHtml(m.short)}</p></div><div class="led-strip">${leds}</div></div>
      <div class="meta"><span>${m.lessons.length} LESSONS</span><span>${m.quiz.length} QUIZ Q's</span>${pillHtml}</div>

  const deptTabsHtml = (!guestMode && myDepartments().length>1) ? `<div class="dept-tabs">

      <button class="dept-tab ${dept==='CS'?'active':''}" data-dept="CS">Customer Service</button>

  renderShell(`
    <section class="hero">
      <div class="eyebrow">${T('dashboard.eyebrow','New Agent Onboarding')}</div>
      <h1>${T('dashboard.h1','Before you take a call, learn to read the box.')}</h1>
      <p>${T("dashboard.p","Modules built from the tickets you'll actually see this week. Each ends in a scored quiz — your progress is saved to your account.")}</p>
      <div class="panel-row"><div class="stat"><div class="num">${modsMastered}/${deptModules.length}</div><div class="lbl">MODULES MASTERED</div></div>
      <div class="stat"><div class="num">${doneQ}/${totalQ}</div><div class="lbl">BEST-SCORE QUESTIONS CORRECT</div></div></div>
    </section>
    ${deptTabsHtml}
    <div style="display:flex;justify-content:flex-end;margin-bottom:14px;">
      <button class="pill-btn" id="toggle-incomplete-filter">${dashboardShowCompleted ? "✓ Showing completed" : "Show Completed"}</button>

  root.querySelectorAll("[data-dept]").forEach(el=> el.addEventListener("click", ()=>{ activeDepartment = el.getAttribute("data-dept"); render(); }));
  document.getElementById("toggle-incomplete-filter").addEventListener("click", async ()=>{
    dashboardShowCompleted = !dashboardShowCompleted;
    render();
    if(!guestMode) await supabase.from("profiles").update({ dashboard_show_completed: dashboardShowCompleted }).eq("id", session.user.id);
  });

  root.querySelectorAll(".mod-card").forEach(el=> el.addEventListener("click",(e)=>{
    if(e.target.closest("[data-edit]")||e.target.closest("[data-del]")||e.target.closest(".drag-handle")) return;
    const id = el.getAttribute("data-mod"); const m = modById(id);
    currentModId = id; currentLessonIdx = resumeLessonIdx(m); view="lesson"; render(); window.scrollTo(0,0);
    if(m && m.popupEnabled && !dismissedModulePopups.has(m.id)){
      openModal(`
        <h3>${escapeHtml(m.popupTitle || "Heads up")}</h3>
        <p class="sub" style="white-space:pre-wrap;">${escapeHtml(m.popupBody || "")}</p>

        <div class="modal-actions"><button class="btn primary" id="mod-popup-close">Got it</button></div>
      `);
      document.getElementById("mod-popup-close").addEventListener("click", async ()=>{
        const dontShow = document.getElementById("mod-popup-dontshow").checked;
        closeModal();
        if(dontShow){
          dismissedModulePopups.add(m.id);
          await Promise.resolve(supabase.from("module_popup_dismissals").upsert({ user_id: session.user.id, module_id: m.id }, { onConflict: "user_id,module_id" })).catch(()=>{});
        }
      });
    }
  }));
  root.querySelectorAll("[data-edit]").forEach(el=> el.addEventListener("click",(e)=>{ e.stopPropagation(); openEditor(el.getAttribute("data-edit")); }));
  root.querySelectorAll("[data-del]").forEach(el=> el.addEventListener("click", async (e)=>{
    e.stopPropagation(); const id = el.getAttribute("data-del"); const m = modById(id);
    if(confirm(`Delete "${m.title}"? This can't be undone.`)){
      await supabase.from("modules").delete().eq("id", id);
      await loadEverything(); render();
    }
  }));

  if(editOn){
    let dragModId = null;
    let dragOverEl = null;
    root.querySelectorAll("[data-mod-drag]").forEach(el=>{
      el.addEventListener("dragstart", (e)=>{ dragModId = el.getAttribute("data-mod-drag"); e.dataTransfer.effectAllowed = "move"; el.style.opacity = "0.4"; startDragAutoScroll(); });
      el.addEventListener("dragend", ()=>{
        el.style.opacity = "";
        stopDragAutoScroll();
        if(dragOverEl){ dragOverEl.classList.remove("drag-over-top","drag-over-bottom"); dragOverEl = null; }
      });
      el.addEventListener("dragover", (e)=>{
        e.preventDefault();
        const rect = el.getBoundingClientRect();
        const pos = (e.clientY - rect.top) < rect.height/2 ? "before" : "after";
        if(dragOverEl && dragOverEl!==el) dragOverEl.classList.remove("drag-over-top","drag-over-bottom");
        dragOverEl = el;
        el.classList.toggle("drag-over-top", pos==="before");
        el.classList.toggle("drag-over-bottom", pos==="after");
      });
      el.addEventListener("dragleave", ()=>{ el.classList.remove("drag-over-top","drag-over-bottom"); });
      el.addEventListener("drop", async (e)=>{
        e.preventDefault();
        const pos = el.classList.contains("drag-over-top") ? "before" : "after";
        el.classList.remove("drag-over-top","drag-over-bottom");
        const targetId = el.getAttribute("data-mod-drag");
        if(!dragModId || dragModId===targetId){ dragModId=null; return; }
        await reorderModuleDrop(dragModId, targetId, pos);
        dragModId = null;
      });
    });
  }
  const addBtn = document.getElementById("add-module"); if(addBtn) addBtn.addEventListener("click", ()=>openEditor(null));
}

function lessonInteractivePicsComplete(lesson){
  if(!lesson || !lesson.body) return true;
  const matches = [...lesson.body.matchAll(/data-interactive-pic-id="([^"]+)"/g)];
  if(!matches.length) return true;
  return matches.every(m=>{
    const ip = INTERACTIVE_PICTURES[m[1]];
    if(!ip || !ip.hotspots.length) return true;
    const readSet = myInteractivePicProgress[m[1]] || new Set();
    return ip.hotspots.every(h=>readSet.has(h.id));
  });
}

function renderLesson(){
  const m = modById(currentModId); if(!m){ view="dashboard"; render(); return; }
  if(!m.lessons.length){ view="dashboard"; render(); return; } // module has no lessons at all
  if(!m.lessons[currentLessonIdx]) currentLessonIdx = 0; // stale index for this module (e.g. it had more lessons before, or currentLessonIdx carried over from a different module) — fall back to the first lesson instead of crashing
  lastModuleContext = { view:"lesson", modId: currentModId, lessonIdx: currentLessonIdx };
  const lesson = m.lessons[currentLessonIdx];
  if(lesson.id) markLessonViewed(m, lesson.id);
  const tabs = m.lessons.map((l,i)=>`<button class="lesson-tab ${i===currentLessonIdx?'active':''}" data-idx="${i}">${i+1}. ${escapeHtml(l.title)}</button>`).join("");

  const editBtn = canEdit() ? `<button class="lesson-tab" id="edit-mod" style="border-color:var(--amber);color:var(--amber);">✎ Edit module</button>` : "";
  const hasQuiz = m.quiz.length > 0;
  const attemptsUsed = (progressMap[m.id] && progressMap[m.id].attempts) || 0;
  const attemptsExhausted = hasQuiz && attemptsUsed >= MAX_QUIZ_ATTEMPTS && !canEditContent();
  const hasResumableQuiz = (quizInProgressModId === m.id && quizActiveIndices.length) || modulesWithResumableQuiz.has(m.id);
  const quizTab = hasQuiz ? `<button class="lesson-tab quiz" id="go-quiz" ${attemptsExhausted?'disabled':''}>${attemptsExhausted?'QUIZ · NO ATTEMPTS LEFT':(hasResumableQuiz?'RESUME QUIZ →':'TAKE QUIZ →')}</button>` : "";
  const picsComplete = lessonInteractivePicsComplete(lesson);
  const nextDisabled = !picsComplete;
  const nextBtnHtml = isLast
    ? (hasQuiz ? (attemptsExhausted ? `<button class="btn primary" id="back-to-modules-btn">Back to Training Modules →</button>` : `<button class="btn primary" id="to-quiz-btn" ${nextDisabled?'disabled':''}>Start module quiz →</button>`) : `<button class="btn primary" id="back-to-modules-btn" ${nextDisabled?'disabled':''}>Back to Training Modules →</button>`)
    : `<button class="btn primary" id="next-lesson" ${nextDisabled?'disabled':''}>Next lesson →</button>`;
  renderShell(`
    <div class="lesson-nav">${tabs}${editBtn}${quizTab}</div>
    <div class="card"><div class="k-label">${escapeHtml(lesson.label)}</div><h2>${escapeHtml(lesson.title)}</h2><div class="body">${lesson.body}</div>
      ${nextDisabled ? `<p style="color:var(--amber);font-size:13px;margin-top:14px;">⚠ Finish exploring the interactive picture above — click every red box until it's green — before you can continue.</p>` : ''}
      <div class="nav-buttons"><button class="btn" id="prev-lesson" ${currentLessonIdx===0?'disabled':''}>← Previous</button>
      ${nextBtnHtml}</div>
      <div class="nav-buttons" style="margin-top:8px;"><button class="mini-btn" id="comment-lesson">💬 Comment</button><div></div></div>
    </div>`);
  root.querySelectorAll(".lesson-tab[data-idx]").forEach(el=> el.addEventListener("click", ()=>{ currentLessonIdx=parseInt(el.getAttribute("data-idx")); render(); }));
  const goQuiz = document.getElementById("go-quiz"); if(goQuiz) goQuiz.addEventListener("click", startQuiz);
  const prev=document.getElementById("prev-lesson"); if(prev) prev.addEventListener("click", ()=>{ if(currentLessonIdx>0){currentLessonIdx--; render(); window.scrollTo(0,0);} });
  const next=document.getElementById("next-lesson"); if(next) next.addEventListener("click", ()=>{ currentLessonIdx++; render(); window.scrollTo(0,0); });
  const toQuiz=document.getElementById("to-quiz-btn"); if(toQuiz) toQuiz.addEventListener("click", ()=>{ startQuiz(); window.scrollTo(0,0); });
  const backToModules=document.getElementById("back-to-modules-btn"); if(backToModules) backToModules.addEventListener("click", ()=>{ view="dashboard"; render(); window.scrollTo(0,0); });
  const editMod=document.getElementById("edit-mod"); if(editMod) editMod.addEventListener("click", ()=>openEditor(m.id, currentLessonIdx));
  document.getElementById("comment-lesson").addEventListener("click", ()=> openFeedbackModal("comment", `${m.title} — ${lesson.title}`));
}

async function startQuiz(mode){
  const m = modById(currentModId);
  const wouldBeTestRun = canEditContent() && editMode;
  // Already have this exact module's session live in memory (e.g. they went
  // to recheck a lesson and are now coming straight back) — just resume,
  // don't touch anything. Skipped for test runs specifically: an editor
  // actively testing content may have just changed the simulation's screens,
  // and a stale in-memory session could point at a screen index that no
  // longer exists — always regenerate fresh in that case instead.
  if(mode !== "missed" && !wouldBeTestRun && quizInProgressModId === currentModId && quizActiveIndices.length){
    view = "quiz"; render();
    return;
  }
  await ensureQuizSimScreens(m);
  quizIsTestRun = wouldBeTestRun;
  quizTestRunResult = null;
  const priorAttempts = (progressMap[m.id] && progressMap[m.id].attempts) || 0;
  if(priorAttempts >= MAX_QUIZ_ATTEMPTS && !canEditContent()){ alert(`You've used all ${MAX_QUIZ_ATTEMPTS} attempts for this quiz.`); return; }
  quizCarriedAnswers = {};

  // Real (non-test-run) sessions: check for a persisted in-progress session
  // for this module — someone who left the site entirely and came back.
  // Validated against the module's current question count in case content
  // changed while they were away; stale/mismatched saves are discarded
  // rather than risking a crash on an out-of-range index.
  if(mode !== "missed" && !quizIsTestRun){
    const { data: saved } = await supabase.from("quiz_in_progress").select("*").eq("user_id", session.user.id).eq("module_id", m.id).maybeSingle();
    if(saved && Array.isArray(saved.active_indices) && saved.active_indices.every(i=> i>=0 && i<m.quiz.length)){
      quizActiveIndices = saved.active_indices;
      quizAnswers = saved.answers || new Array(quizActiveIndices.length).fill(null);
      quizRevealed = saved.revealed || new Array(quizActiveIndices.length).fill(false);
      quizIdx = Math.min(saved.current_idx||0, quizActiveIndices.length-1);
      quizSimScreenIndex = saved.sim_screen_index || {};
      quizSimMisclicks = saved.sim_misclicks || {};
      quizInProgressModId = currentModId;
      view = "quiz"; render();
      return;
    }
  }

  quizSimScreenIndex = {};
  quizSimMisclicks = {};
  if(mode === "missed"){
    const { data: attempts } = await supabase.from("quiz_attempts").select("*").eq("user_id", session.user.id).eq("module_id", m.id).order("created_at", { ascending:false }).limit(1);
    const lastAttempt = attempts && attempts[0];
    if(lastAttempt && lastAttempt.answers && lastAttempt.answers.length === m.quiz.length){
      const missedIdx = [];
      m.quiz.forEach((q,i)=>{
        const priorAns = lastAttempt.answers[i];
        if(priorAns && priorAns.is_correct){
          quizCarriedAnswers[i] = { question:q.q, options:q.opts, selected:priorAns.selected, correct:q.correct, is_correct:true };
        } else {
          missedIdx.push(i);
        }
      });
      quizActiveIndices = missedIdx.length ? missedIdx : m.quiz.map((_,i)=>i);
    } else {
      quizActiveIndices = m.quiz.map((_,i)=>i); // no usable prior attempt — fall back to full quiz
    }
  } else {
    quizActiveIndices = m.quiz.map((_,i)=>i);
  }
  quizAnswers = new Array(quizActiveIndices.length).fill(null);
  quizRevealed = new Array(quizActiveIndices.length).fill(false);
  quizIdx = 0; quizInProgressModId = currentModId; view = "quiz"; render();
}

function scheduleQuizProgressSave(){
  // Test runs and the "missed questions" retake flow don't get persisted —
  // test runs are never real attempts to begin with, and a missed-retake
  // session is short-lived by nature (it only exists right after finishing
  // a full attempt).
  if(quizIsTestRun || !session || guestMode) return;
  clearTimeout(quizProgressSaveTimer);
  quizProgressSaveTimer = setTimeout(async ()=>{
    modulesWithResumableQuiz.add(currentModId);
    await silentSave(()=> supabase.from("quiz_in_progress").upsert({
      user_id: session.user.id, module_id: currentModId,
      active_indices: quizActiveIndices, answers: quizAnswers, revealed: quizRevealed, current_idx: quizIdx,
      sim_screen_index: quizSimScreenIndex, sim_misclicks: quizSimMisclicks,
      updated_at: new Date().toISOString()
    }, { onConflict: "user_id,module_id" }));
  }, 400);
}

function renderQuiz(){
  const m = modById(currentModId); if(!m||!m.quiz.length){ view="lesson"; render(); return; }
  const realIdx = quizActiveIndices[quizIdx];
  if(realIdx===undefined || !m.quiz[realIdx]){ view="lesson"; render(); return; } // stale quiz session state pointing at a question that doesn't exist for this module — bail to the lesson view rather than crashing
  lastModuleContext = { view:"quiz", modId: currentModId, lessonIdx: currentLessonIdx };
  const q = m.quiz[realIdx]; const revealed = quizRevealed[quizIdx]; const selected = quizAnswers[quizIdx];
  const isMissedRetake = quizActiveIndices.length < m.quiz.length;
  const isSim = q.type === 'simulation';
  const isLast = quizIdx === quizActiveIndices.length-1;
  const editBtn = canEdit() ? `<button class="btn" id="edit-mod-q" style="border-color:var(--amber);color:var(--amber);">✎ Edit module</button>` : "";

  let bodyHtml, nextLabel, nextDisabled;
  if(isSim){
    const screens = q.simScreens || [];
    // Also handles a screen index that's out of bounds for the current
    // screens array, not just an undefined one — a saved/resumed session
    // could point at a screen that no longer exists if the content changed
    // since it was saved, and that should recover gracefully rather than
    // silently showing "not set up" for a question that actually is.
    if(quizSimScreenIndex[quizIdx] === undefined || quizSimScreenIndex[quizIdx] >= screens.length) quizSimScreenIndex[quizIdx] = 0;
    const screen = screens[quizSimScreenIndex[quizIdx]];
    if(!screen || !screen.image){
      bodyHtml = `<p style="color:var(--text-faint);">This simulation hasn't been set up yet.</p>`;
    } else if(selected){
      bodyHtml = `<div style="position:relative;display:inline-block;max-width:100%;border-radius:8px;box-shadow:0 0 0 3px var(--green), 0 0 22px 4px #2ecc7155;">
        <img src="${screen.image}" style="max-width:100%;display:block;user-select:none;border-radius:8px;opacity:.75;" draggable="false">
      </div><p style="color:var(--green);font-size:13px;margin-top:12px;">✓ Done — you found it.</p>`;
    } else {
      bodyHtml = `<p style="color:var(--text-dim);font-size:13.5px;margin-bottom:10px;">This exercise only works in fullscreen. Click the screenshot to begin.</p>
      <div style="position:relative;display:inline-block;max-width:100%;cursor:pointer;" id="sim-play-inline-trigger">
        <img src="${screen.image}" style="max-width:100%;display:block;user-select:none;border-radius:8px;" draggable="false">
        <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#00000055;border-radius:8px;">
          <span style="background:#000000cc;color:var(--cyan);padding:8px 16px;border-radius:20px;font-size:13px;font-family:var(--mono);">⛶ Click to start</span>
        </div>
      </div>`;
    }
    nextLabel = isLast ? 'See results →' : 'Next question →';
    nextDisabled = selected===null;
  } else {
    const opts = q.opts.map((opt,i)=>{ let cls="opt"; if(revealed){ cls+=" disabled"; if(i===q.correct) cls+=" correct"; else if(i===selected) cls+=" wrong"; } else if(i===selected){ cls+=" selected"; }
      return `<div class="${cls}" data-idx="${i}"><div class="dot"></div><span class="txt">${escapeHtml(opt)}</span></div>`; }).join("");
    const explain = revealed ? `<div class="explain"><strong>${selected===q.correct?'Correct.':'Not quite.'}</strong> ${escapeHtml(q.explain)}</div>` : "";
    bodyHtml = opts + explain;
    nextLabel = isLast?(revealed?'See results →':'Check answer'):(revealed?'Next question →':'Check answer');
    nextDisabled = selected===null;
  }

  const jumpNavHtml = canEdit() ? `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;">
    ${quizActiveIndices.map((_,idx)=>`<button class="mini-btn" data-quiz-jump="${idx}" style="${idx===quizIdx?'border-color:var(--amber);color:var(--amber);':''}min-width:34px;">${idx+1}</button>`).join("")}
    <span style="color:var(--text-faint);font-size:11px;font-family:var(--mono);align-self:center;margin-left:6px;">EDIT MODE · JUMP TO ANY QUESTION</span>
  </div>` : "";

  renderShell(`
    <div class="q-progress">MODULE QUIZ${isMissedRetake?' · RETAKING MISSED QUESTIONS':''} · ${escapeHtml(m.title.toUpperCase())} · QUESTION ${quizIdx+1} OF ${quizActiveIndices.length}</div>
    ${jumpNavHtml}
    <div class="card"><div class="q-block"><h3>${escapeHtml(q.q)}</h3>${bodyHtml}</div>
      <div class="nav-buttons"><div style="display:flex;gap:10px;"><button class="btn" id="quiz-prev" ${quizIdx===0?'disabled':''}>← Previous</button>${editBtn}</div>
      <button class="btn primary" id="quiz-next" ${nextDisabled?'disabled':''}>${nextLabel}</button></div>
      <div class="nav-buttons" style="margin-top:8px;"><button class="mini-btn" id="flag-question">🚩 Flag this question</button><div></div></div>
    </div>`);

  if(isSim){
    const handleZoneClick = (zi)=>{
      const screens = q.simScreens;
      const screen = screens[quizSimScreenIndex[quizIdx]];
      const zone = screen.zones[zi];
      if(zone.targetScreenId){
        const nextScreenIdx = screens.findIndex(s=>s.id===zone.targetScreenId);
        if(nextScreenIdx>=0){ quizSimScreenIndex[quizIdx] = nextScreenIdx; return true; }
        return false;
      } else {
        quizAnswers[quizIdx] = "done";
        return true;
      }
    };
    const trigger = document.getElementById("sim-play-inline-trigger");
    if(trigger) trigger.addEventListener("click", ()=>{
      const proceed = ()=> openSimPlayFullscreen(q, quizIdx, handleZoneClick);
      if(simWarningDismissed) proceed(); else showSimWarningModal(proceed);
    });
    document.getElementById("quiz-next").addEventListener("click", ()=>{ if(isLast){ finishQuiz(); } else { quizIdx++; render(); window.scrollTo(0,0); } });
  } else {
    if(!revealed) root.querySelectorAll(".opt").forEach(el=> el.addEventListener("click", ()=>{ quizAnswers[quizIdx]=parseInt(el.getAttribute("data-idx")); scheduleQuizProgressSave(); render(); }));
    document.getElementById("quiz-next").addEventListener("click", ()=>{ if(!revealed){ quizRevealed[quizIdx]=true; scheduleQuizProgressSave(); render(); } else if(isLast){ finishQuiz(); } else { quizIdx++; scheduleQuizProgressSave(); render(); window.scrollTo(0,0); } });
  }
  document.getElementById("quiz-prev").addEventListener("click", ()=>{ if(quizIdx>0){ quizIdx--; render(); window.scrollTo(0,0); } });
  root.querySelectorAll("[data-quiz-jump]").forEach(el=> el.addEventListener("click", ()=>{ quizIdx = +el.getAttribute("data-quiz-jump"); render(); }));
  const editModQ=document.getElementById("edit-mod-q"); if(editModQ) editModQ.addEventListener("click", ()=>openEditor(m.id, undefined, realIdx));
  document.getElementById("flag-question").addEventListener("click", ()=> openFeedbackModal("flag", `${m.title} — Q${quizIdx+1}: ${q.q}`));
}

async function finishQuiz(){
  const m = modById(currentModId);
  const answerDetail = new Array(m.quiz.length);
  quizActiveIndices.forEach((realIdx, i)=>{
    const q = m.quiz[realIdx];
    if(q.type === 'simulation'){
      answerDetail[realIdx] = { question:q.q, type:'simulation', is_correct: true };
    } else {
      answerDetail[realIdx] = { question:q.q, options:q.opts, selected:quizAnswers[i], correct:q.correct, is_correct: quizAnswers[i]===q.correct };
    }
  });
  Object.keys(quizCarriedAnswers).forEach(idxStr=>{ answerDetail[+idxStr] = quizCarriedAnswers[idxStr]; });
  const correctCount = answerDetail.reduce((acc,a)=> acc + (a && a.is_correct ? 1 : 0), 0);

  if(quizIsTestRun){
    // Testing content in edit mode — doesn't count as a real attempt, nothing gets saved.
    quizTestRunResult = { lastScore: correctCount, total: m.quiz.length };
    quizJustFinished = true; view = "results"; render(); window.scrollTo(0,0);
    return;
  }

  quizInProgressModId = null;
  modulesWithResumableQuiz.delete(m.id);
  // Cancel any pending debounced save from scheduleQuizProgressSave() —
  // without this, a save queued right as the last question was answered
  // (a very plausible timing on a short quiz) can fire *after* this delete
  // runs, silently re-creating the row via upsert with the now-stale,
  // already-completed state still in it. The next "Retake" would then find
  // that resurrected row and restore it as an in-progress session, showing
  // whatever was already answered — including a simulation question
  // appearing permanently "done" even on a fresh attempt.
  clearTimeout(quizProgressSaveTimer);
  await supabase.from("quiz_in_progress").delete().eq("user_id", session.user.id).eq("module_id", m.id);

  const prior = progressMap[m.id];
  const record = { best: Math.max(correctCount, prior?prior.best:0), total: m.quiz.length, lastScore: correctCount, attempts: (prior?prior.attempts:0)+1, lessonsViewed: prior&&prior.lessonsViewed ? prior.lessonsViewed : [] };
  progressMap[m.id] = record;
  await supabase.from("progress").upsert({
    user_id: session.user.id, module_id: m.id, best_score: record.best, total: record.total, last_score: record.lastScore, attempts: record.attempts, lessons_viewed: record.lessonsViewed, updated_at: new Date().toISOString()
  }, { onConflict: "user_id,module_id" });

  await supabase.from("quiz_attempts").insert({
    user_id: session.user.id, module_id: m.id, score: correctCount, total: m.quiz.length, answers: answerDetail
  });
  quizJustFinished = true; view = "results"; render(); window.scrollTo(0,0);
}

function renderResults(){
  const m = modById(currentModId); if(!m){ view="dashboard"; render(); return; }
  lastModuleContext = { view:"results", modId: currentModId, lessonIdx: currentLessonIdx };

  if(quizIsTestRun && quizTestRunResult){
    const s = quizTestRunResult;
    const p = s.total ? Math.round((s.lastScore/s.total)*100) : 0;
    if(quizJustFinished){ quizJustFinished = false; if(p===100) launchConfetti(); }
    const leds = Array.from({length:5}).map((_,i)=>{ const lit = i < Math.round((s.lastScore/s.total)*5); const color = p===100?"on-green":p>=60?"on-amber":"on-red"; return `<span class="led ${lit?color:''}"></span>`; }).join("");
    renderShell(`
      <div class="card result-hero"><div class="k-label">TEST RUN · ${escapeHtml(m.title.toUpperCase())}</div>
        <div class="big-score">${s.lastScore}/${s.total}</div><div class="led-array">${leds}</div>
        <p style="color:var(--amber);font-size:13px;margin-top:14px;">⚠ Test run — nothing was saved. This doesn't count as a real attempt.</p>
        <div class="nav-buttons" style="justify-content:center;gap:14px;margin-top:14px;"><button class="btn" id="retake">Retake quiz</button><button class="btn" id="review">Review lessons</button><button class="btn primary" id="back-dash">Back to dashboard</button></div>
      </div>`);
    document.getElementById("retake").addEventListener("click", ()=> startQuiz("full"));
    document.getElementById("review").addEventListener("click", ()=>{ currentLessonIdx=0; view="lesson"; render(); window.scrollTo(0,0); });
    document.getElementById("back-dash").addEventListener("click", ()=>{ view="dashboard"; render(); window.scrollTo(0,0); });
    return;
  }

  const s = progressMap[m.id]; const p = pct(s);
  if(quizJustFinished){ quizJustFinished = false; if(p===100) launchConfetti(); }
  const leds = Array.from({length:5}).map((_,i)=>{ const lit = i < Math.round((s.lastScore/s.total)*5); const color = p===100?"on-green":p>=60?"on-amber":"on-red"; return `<span class="led ${lit?color:''}"></span>`; }).join("");
  const verdict = p===100?"Fully registered. This module is locked in.":p>=60?"Mostly holding — worth a second pass before it's live-call ready.":"Signal's not there yet. Revisit the lessons and retake when ready.";
  const attemptsUsed = s.attempts || 0;
  const attemptsExhausted = attemptsUsed >= MAX_QUIZ_ATTEMPTS && !canEditContent();
  const hasMissed = s.lastScore < s.total && !attemptsExhausted;
  const attemptsLine = canEditContent()
    ? `<p style="font-family:var(--mono);font-size:13px;margin-top:14px;color:var(--text-dim);">Unlimited attempts (content editor)</p>`
    : `<p style="font-family:var(--mono);font-size:13px;margin-top:14px;color:${attemptsExhausted?'var(--red)':'var(--text-dim)'};">${attemptsUsed}/${MAX_QUIZ_ATTEMPTS} attempts${attemptsExhausted ? ' — No attempts left' : ' — Try again?'}</p>`;
  renderShell(`
    <div class="card result-hero"><div class="k-label">QUIZ RESULT · ${escapeHtml(m.title.toUpperCase())}</div>
      <div class="big-score">${s.lastScore}/${s.total}</div><div class="led-array">${leds}</div><div class="verdict">${escapeHtml(verdict)}</div>
      ${attemptsLine}
      ${hasMissed ? `<label style="display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;font-size:13px;color:var(--text-dim);margin-top:10px;"><input type="checkbox" id="retake-missed-toggle"> Retake missed questions only — questions you already got right won't count against you</label>` : ""}
      <div class="nav-buttons" style="justify-content:center;gap:14px;margin-top:14px;"><button class="btn" id="retake" ${attemptsExhausted?'disabled':''}>Retake quiz</button><button class="btn" id="review">Review lessons</button><button class="btn primary" id="back-dash">Back to dashboard</button></div>
    </div>`);
  const retakeBtn = document.getElementById("retake");
  if(!attemptsExhausted) retakeBtn.addEventListener("click", ()=>{
    const toggle = document.getElementById("retake-missed-toggle");
    startQuiz(toggle && toggle.checked ? "missed" : "full");
  });
  document.getElementById("review").addEventListener("click", ()=>{ currentLessonIdx=0; view="lesson"; render(); window.scrollTo(0,0); });
  document.getElementById("back-dash").addEventListener("click", ()=>{ view="dashboard"; render(); window.scrollTo(0,0); });
}
