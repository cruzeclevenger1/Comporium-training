  { id:"dark", icon:"🌙", label:"Dark", bg:"#0A0F1A", color:"#52D5E0", border:"#24304a" },
  { id:"light", icon:"☀️", label:"Light", bg:"#F3F5FA", color:"#1B2233", border:"#DCE3F0" },
  { id:"programmer", icon:"&gt;_", label:"Programmer", bg:"#000000", color:"#3dff70", border:"#1f3d1f", mono:true },
  { id:"retro", icon:"📺", label:"Retro Amber", bg:"#0a0603", color:"#ffb000", border:"#4a3414" },
  { id:"synthwave", icon:"🌆", label:"Synthwave", bg:"#0d0221", color:"#00f0ff", border:"#5a2680" },
  { id:"ocean", icon:"🌊", label:"Ocean", bg:"#041624", color:"#3ddcf0", border:"#28587a" },
  { id:"forest", icon:"🌲", label:"Forest", bg:"#0d1610", color:"#5aeb90", border:"#3a5a44" },
  { id:"japan", icon:"🌸", label:"Japan", bg:"#1a0f16", color:"#ff9dc0", border:"#4a2e3d" },
  { id:"contrast", icon:"◐", label:"High Contrast", bg:"#000000", color:"#ffff00", border:"#ffffff" }
];
const THEME_NAMES = THEMES.map(t=>t.id);
function currentTheme(){ const t = localStorage.getItem("lineup-theme") || "dark"; return THEME_NAMES.includes(t) ? t : "dark"; }
function applyTheme(t){
  THEME_NAMES.forEach(name=>{ if(name!=="dark") document.documentElement.classList.remove("theme-"+name); });
  if(t!=="dark") document.documentElement.classList.add("theme-"+t);
  localStorage.setItem("lineup-theme", t);
}

  const reqAdminBtn = document.getElementById("request-admin-btn");
  if(reqAdminBtn) reqAdminBtn.addEventListener("click", async ()=>{
    const status = document.getElementById("admin-req-status");
    reqAdminBtn.disabled = true;
    const { data: existing } = await supabase.from("messages").select("id").eq("sender_id", session.user.id).eq("type","admin_request").is("thread_id", null);
    if(existing && existing.length){
      status.textContent = "You already have a pending request — an admin will review it soon.";

    const { data, error } = await supabase.functions.invoke("admin-update-account", {
      body: { userId: session.user.id, name: newName }

    if(error || (data && data.error)){ status.textContent = "Couldn't save: " + ((data && data.error) || await extractFunctionError(error)); status.style.color = "var(--red)"; return; }
    profile.name = newName;

    const pill = document.querySelector(".pill-btn"); if(pill) pill.textContent = newName;
  });

  document.getElementById("save-pw").addEventListener("click", async ()=>{
    const pw1 = document.getElementById("set-pw1").value;
    const pw2 = document.getElementById("set-pw2").value;
    const status = document.getElementById("pw-status");
    if(pw1.length < 6){ status.textContent = "Password must be at least 6 characters."; status.style.color = "var(--red)"; return; }
    if(pw1 !== pw2){ status.textContent = "Passwords don't match."; status.style.color = "var(--red)"; return; }
    const { error } = await supabase.auth.updateUser({ password: pw1 });
    if(error){ status.textContent = "Couldn't update: " + error.message; status.style.color = "var(--red)"; return; }
    status.textContent = "Password updated."; status.style.color = "var(--green)";
    document.getElementById("set-pw1").value = ""; document.getElementById("set-pw2").value = "";
  });

  const themeToggle = document.getElementById("theme-dropdown-toggle");
  if(themeToggle) themeToggle.addEventListener("click", (e)=>{ e.stopPropagation(); themeDropdownOpen = !themeDropdownOpen; renderSettings(); });
  root.querySelectorAll("[data-theme]").forEach(el=> el.addEventListener("click", ()=>{
    const t = el.getAttribute("data-theme");
    applyTheme(t);
    themeDropdownOpen = false;
    renderSettings();
    if(profile){
      profile.theme = t;
      silentSave(()=> supabase.from("profiles").update({ theme:t }).eq("id", session.user.id));
    }
  }));

  // The panel defaults to opening downward, but if there isn't enough room
  // left in the viewport below it, that pushes the bottom themes off screen
  // and forces scrolling the whole page instead of just the dropdown.
  // Flip it to open upward in that case.
  const panel = document.querySelector(".theme-dropdown-panel");
  if(panel){
    const rect = panel.getBoundingClientRect();
    if(rect.bottom > window.innerHeight){
      panel.style.top = "auto";
      panel.style.bottom = "calc(100% + 6px)";
    }
  }
}

/* ============================================================
   REFERENCE GUIDE (OneNote-style, admin editable)
   ============================================================ */
let refCollapsed = new Set();
let refSearchQuery = "";
let dragRefId = null;
let refActiveDepartment = null;
function currentActiveRefDepartment(){
  const mine = myDepartments();
  if(mine.length===0) return 'TS';
  if(refActiveDepartment && mine.includes(refActiveDepartment)) return refActiveDepartment;
  refActiveDepartment = mine[0];
  return refActiveDepartment;
}

async function loadReference(){
  const { data } = await supabase.from("reference_pages").select("*").order("sort_order");
  REFERENCE_PAGES = data || [];
  if(!REFERENCE_PAGES.find(p=>p.id===currentRefId)) currentRefId = null;
}
async function openReference(){
  await loadReference();
  refEditing = false;
  if(!currentRefId || !REFERENCE_PAGES.find(p=>p.id===currentRefId && p.department===currentActiveRefDepartment())){
    const top = topLevelPages()[0];
    currentRefId = top ? top.id : null;
  }
  view = "reference"; render();
}
function topLevelPages(){ return REFERENCE_PAGES.filter(p=>!p.parent_id && p.department===currentActiveRefDepartment()).sort((a,b)=>a.sort_order-b.sort_order); }
function childPages(parentId){ return REFERENCE_PAGES.filter(p=>p.parent_id===parentId).sort((a,b)=>a.sort_order-b.sort_order); }

function renderReference(){
  const editOn = canEdit();
  const tops = topLevelPages();

  function sidebarRow(p, isChild){
    const active = p.id===currentRefId;
    const kids = isChild ? [] : childPages(p.id);
    const collapsed = refCollapsed.has(p.id);
    const chevron = (!isChild && kids.length) ? `<button class="mini-btn" data-ref-toggle="${p.id}" style="padding:2px 5px;">${collapsed?'▸':'▾'}</button>` : `<span style="width:20px;display:inline-block;"></span>`;
    const tools = editOn ? `
      <span class="ref-row-tools">
        ${!isChild ? `<button class="mini-btn" data-ref-addsub="${p.id}">+ Sub</button>` : ""}
        <button class="mini-btn danger" data-ref-del="${p.id}">✕</button>
      </span>` : "";
    return `<div class="ref-row ${active?'active':''} ${isChild?'child':''}" draggable="${editOn}" data-ref-select="${p.id}" data-ref-drag="${p.id}" data-ref-parent="${p.parent_id||''}">
      ${!isChild ? chevron : ""}<span class="ref-row-title">${escapeHtml(p.title)}</span>${tools}
    </div>`;
  }

  const searchActive = refSearchQuery.trim().length > 0;
  const searchLower = refSearchQuery.trim().toLowerCase();
  const titleMatches = (p)=> p.title.toLowerCase().includes(searchLower);

  const sidebarHtml = tops.filter(p=> !searchActive || titleMatches(p) || childPages(p.id).some(titleMatches)).map(p=>{
    const kids = childPages(p.id).filter(k=> !searchActive || titleMatches(p) || titleMatches(k));
    const collapsed = searchActive ? false : refCollapsed.has(p.id);
    return sidebarRow(p,false) + (!collapsed ? kids.map(k=>sidebarRow(k,true)).join("") : "");
  }).join("") || (searchActive ? `<p style="color:var(--text-faint);font-size:12.5px;padding:10px;">No matches.</p>` : `<p style="color:var(--text-faint);font-size:12.5px;padding:10px;">No pages yet.</p>`);

  const addTopBtn = editOn ? `<button class="dashed-btn" id="add-ref-page" style="margin-top:10px;">+ Add page</button>` : "";

  const page = REFERENCE_PAGES.find(p=>p.id===currentRefId);
  let contentHtml;
  if(!REFERENCE_PAGES.length){
    contentHtml = `<div class="card"><p style="color:var(--text-dim);font-size:14px;">Nothing here yet.${editOn ? ' Click "+ Add page" to start building it out.' : ' Check back once an admin has added content.'}</p></div>`;
  } else if(!page){
    contentHtml = `<div class="card"><p style="color:var(--text-dim);font-size:14px;">Select a page from the left.</p></div>`;
  } else if(refEditing){
    contentHtml = `
      <div class="card">
        <input type="text" id="ref-title" class="onenote-title-input" placeholder="Page title" value="${escapeHtml(refDraft.title)}">
        ${richEditorHtml("ref-body-rte", refDraft.body)}
        <div class="hint" style="margin-top:8px;">Paste an image directly, or use the 🖼 button. Drag an image's corner to resize it.</div>
        <div class="nav-buttons">
          <div style="display:flex;gap:10px;align-items:center;"><button class="btn danger" id="ref-delete">Delete page</button><span id="ref-save-status" style="font-size:12px;color:var(--text-faint);font-family:var(--mono);"></span></div>
          <button class="btn primary" id="ref-done">Done editing</button>
        </div>
      </div>`;
  } else {
    const editBtn = editOn ? `<button class="btn" id="ref-edit" style="border-color:var(--amber);color:var(--amber);">✎ Edit page</button>` : "";
    contentHtml = `
      <div class="card">
        <div class="k-label">REFERENCE GUIDE</div>
        <h2>${escapeHtml(page.title)}</h2>
        <div class="body">${sanitizeHtml(page.body)}</div>
        <div class="nav-buttons"><div></div>${editBtn}</div>
      </div>`;
  }

  const refDeptTabsHtml = (myDepartments().length>1) ? `<div class="dept-tabs">
      ${renderDeptTabsHtml(currentActiveRefDepartment(), 'ref-dept')}
    </div>` : "";

  renderShell(`
    ${refDeptTabsHtml}
    <div class="ref-layout">
      <div class="ref-sidebar">
        <input type="text" id="ref-search" data-no-enter-submit placeholder="Search reference guide…" value="${escapeHtml(refSearchQuery)}" class="search-input" style="width:100%;box-sizing:border-box;margin-bottom:10px;">
        <div class="ref-sidebar-list">${sidebarHtml}</div>${addTopBtn}
      </div>
      <div class="ref-content">${contentHtml}</div>
    </div>
  `);

  root.querySelectorAll("[data-ref-dept]").forEach(el=> el.addEventListener("click", ()=>{
    refActiveDepartment = el.getAttribute("data-ref-dept");
    const top = topLevelPages()[0];
    currentRefId = top ? top.id : null;
    refEditing = false;
    render();
  }));

  const refSearchEl = document.getElementById("ref-search");
  if(refSearchEl){
    let refSearchDebounce = null;
    refSearchEl.addEventListener("input", (e)=>{
      refSearchQuery = e.target.value;
      clearTimeout(refSearchDebounce);
      refSearchDebounce = setTimeout(()=>{
        render();
        const el = document.getElementById("ref-search");
        if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
      }, 200);
    });
  }

  if(refEditing) wireRichEditor("ref-body-rte");
  if(refEditing){
    const refTitleInput = document.getElementById("ref-title");
    const refBodyRte = document.getElementById("ref-body-rte");
    if(refTitleInput && refBodyRte){
      const trigger = ()=> scheduleRefAutosave(page.id, refTitleInput, refBodyRte);
      refTitleInput.addEventListener("input", trigger);
      refBodyRte.addEventListener("input", trigger);
    }
  }

  root.querySelectorAll("[data-ref-select]").forEach(el=> el.addEventListener("click", (e)=>{
    if(e.target.closest("[data-ref-toggle]")||e.target.closest("[data-ref-addsub]")||e.target.closest("[data-ref-del]")) return;
    currentRefId = el.getAttribute("data-ref-select"); refEditing=false; render();
  }));
  root.querySelectorAll("[data-ref-toggle]").forEach(el=> el.addEventListener("click", (e)=>{
    e.stopPropagation();
    const id = el.getAttribute("data-ref-toggle");
    if(refCollapsed.has(id)) refCollapsed.delete(id); else refCollapsed.add(id);
    render();
  }));

  const addPageBtn = document.getElementById("add-ref-page");
  if(addPageBtn) addPageBtn.addEventListener("click", async ()=>{
    const { data, error } = await supabase.from("reference_pages").insert({ title:"New page", body:"<p>Write here.</p>", parent_id:null, department: currentActiveRefDepartment(), sort_order: tops.length }).select().single();
    if(!error){ logEdit("created", "reference_page", data.title, null, data.department); await loadReference(); currentRefId = data.id; refDraft = { title:data.title, body:data.body }; refEditing = true; render(); }
  });
  root.querySelectorAll("[data-ref-addsub]").forEach(el=> el.addEventListener("click", async (e)=>{
    e.stopPropagation();
    const parentId = el.getAttribute("data-ref-addsub");
    const kids = childPages(parentId);
    const parentPage = REFERENCE_PAGES.find(p=>p.id===parentId);
    refCollapsed.delete(parentId);
    const { data, error } = await supabase.from("reference_pages").insert({ title:"New subsection", body:"<p>Write here.</p>", parent_id:parentId, department: parentPage ? parentPage.department : currentActiveRefDepartment(), sort_order: kids.length }).select().single();
    if(!error){ logEdit("created", "reference_page", data.title, null, data.department); await loadReference(); currentRefId = data.id; refDraft = { title:data.title, body:data.body }; refEditing = true; render(); }
  }));
  root.querySelectorAll("[data-ref-del]").forEach(el=> el.addEventListener("click", async (e)=>{
    e.stopPropagation();
    const id = el.getAttribute("data-ref-del");
    const target = REFERENCE_PAGES.find(p=>p.id===id);
    const hasKids = childPages(id).length>0;
    if(confirm(`Delete "${target.title}"?${hasKids?' This will also delete its subsections.':''}`)){
      await supabase.from("reference_pages").delete().eq("id", id);
      logEdit("deleted", "reference_page", target.title, null, target.department);
      if(currentRefId===id) currentRefId = null;
      await loadReference(); render();
    }
  }));

  if(editOn){
    let dragOverEl = null;
    root.querySelectorAll("[data-ref-drag]").forEach(el=>{
      el.addEventListener("dragstart", (e)=>{ dragRefId = el.getAttribute("data-ref-drag"); e.dataTransfer.effectAllowed = "move"; el.style.opacity = "0.4"; startDragAutoScroll(); });
      el.addEventListener("dragend", ()=>{
        el.style.opacity = "";
        stopDragAutoScroll();
        if(dragOverEl){ dragOverEl.classList.remove("drag-over-top","drag-over-bottom"); dragOverEl = null; }
      });
      el.addEventListener("dragover", (e)=>{
        e.preventDefault();
        const rect = el.getBoundingClientRect();
        const pos = (e.clientY - rect.top) < rect.height/2 ? "before" : "after";
        if(dragOverEl && dragOverEl!==el) dragOverEl.classList.remove("drag-over-top","drag-over-bottom");
        dragOverEl = el;
        el.classList.toggle("drag-over-top", pos==="before");
        el.classList.toggle("drag-over-bottom", pos==="after");
      });
      el.addEventListener("dragleave", ()=>{ el.classList.remove("drag-over-top","drag-over-bottom"); });
      el.addEventListener("drop", async (e)=>{
        e.preventDefault();
        const pos = el.classList.contains("drag-over-top") ? "before" : "after";
        el.classList.remove("drag-over-top","drag-over-bottom");
        const targetId = el.getAttribute("data-ref-drag");
        if(!dragRefId || dragRefId===targetId){ dragRefId=null; return; }
        await reorderRefDrop(dragRefId, targetId, pos);
        dragRefId = null;
      });
    });
  }

  const editBtn = document.getElementById("ref-edit");
  if(editBtn) editBtn.addEventListener("click", ()=>{ refDraft = { title:page.title, body:page.body }; refEditing = true; render(); });
  const doneBtn = document.getElementById("ref-done");
  if(doneBtn) doneBtn.addEventListener("click", async ()=>{
    const titleEl = document.getElementById("ref-title");
    const bodyEl = document.getElementById("ref-body-rte");
    if(titleEl && bodyEl) await flushRefSave(page.id, titleEl, bodyEl);
    logEdit("updated", "reference_page", page.title, null, page.department);
    refEditing=false; render();
  });
  const deleteBtn = document.getElementById("ref-delete");
  if(deleteBtn) deleteBtn.addEventListener("click", async ()=>{
    if(confirm(`Delete "${page.title}"? This can't be undone.`)){
      await supabase.from("reference_pages").delete().eq("id", page.id);
      logEdit("deleted", "reference_page", page.title, null, page.department);
      refEditing = false; currentRefId = null; await loadReference(); render();
    }
  });
}

let refSaveTimer = null;
async function flushRefSave(pageId, titleInput, bodyRte){
  clearTimeout(refSaveTimer);
  window.pendingAutosaveKeys.delete("ref:"+pageId);
  const title = titleInput.value.trim() || "Untitled page";
  const body = getCleanEditorHtml(bodyRte);
  const { error } = await silentSave(()=> supabase.from("reference_pages").update({ title, body }).eq("id", pageId));
  const statusElNow = document.getElementById("ref-save-status");
  if(error){
    if(statusElNow){ statusElNow.textContent = "Couldn't save: " + error.message; statusElNow.style.color = "var(--red)"; }
    return false;
  }
  const p = REFERENCE_PAGES.find(x=>x.id===pageId);
  if(p){ p.title = title; p.body = body; }
  const titleEl = document.querySelector(`[data-ref-select="${pageId}"] .ref-row-title`);
  if(titleEl) titleEl.textContent = title;
  if(statusElNow){ statusElNow.textContent = "Saved"; statusElNow.style.color = "var(--green)"; }
  return true;
}
function scheduleRefAutosave(pageId, titleInput, bodyRte){
  const statusEl = document.getElementById("ref-save-status");
  if(statusEl){ statusEl.textContent = "Saving…"; statusEl.style.color = "var(--text-faint)"; }
  clearTimeout(refSaveTimer);
  window.pendingAutosaveKeys.add("ref:"+pageId);
  refSaveTimer = setTimeout(()=>{ flushRefSave(pageId, titleInput, bodyRte); }, 700);
}

async function reorderRefDrop(draggedId, targetId, pos){
  const dragged = REFERENCE_PAGES.find(p=>p.id===draggedId);
  const target = REFERENCE_PAGES.find(p=>p.id===targetId);
  if(!dragged || !target) return;
  if((dragged.parent_id||null) !== (target.parent_id||null)) return; // only reorder within the same level
  const siblings = (dragged.parent_id ? childPages(dragged.parent_id) : topLevelPages());
  const fromIdx = siblings.findIndex(s=>s.id===draggedId);
  let toIdx = siblings.findIndex(s=>s.id===targetId);
  if(fromIdx===-1 || toIdx===-1) return;
  if(pos==="after") toIdx++;
  const reordered = siblings.slice();
  reordered.splice(fromIdx,1);
  if(fromIdx < toIdx) toIdx--;
  reordered.splice(toIdx,0,dragged);
  for(let i=0;i<reordered.length;i++){
    if(reordered[i].sort_order !== i){ await supabase.from("reference_pages").update({ sort_order:i }).eq("id", reordered[i].id); }
  }
  await loadReference(); render();
}

/* ============================================================
   PERSONAL NOTES — private per-user notepad, autosaving.
   Same page/subsection structure as the Reference Guide, but only
   ever visible to the person who wrote it (enforced by RLS).

let PERSONAL_NOTES = [];
let currentNoteId = null;
let notesCollapsed = new Set();
let noteSearchQuery = "";
let dragNoteId = null;
let noteSaveTimer = null;
let notesActiveDepartment = null;
function currentActiveNotesDepartment(){
  const mine = myDepartments();
  if(mine.length===0) return 'TS';
  if(notesActiveDepartment && mine.includes(notesActiveDepartment)) return notesActiveDepartment;
  notesActiveDepartment = mine[0];
  return notesActiveDepartment;
}

async function loadPersonalNotes(){
  const { data } = await supabase.from("personal_notes").select("*").eq("user_id", session.user.id).order("sort_order");
  PERSONAL_NOTES = data || [];
  if(!PERSONAL_NOTES.find(n=>n.id===currentNoteId)) currentNoteId = null;
}
async function openNotes(){
  await loadPersonalNotes();
  if(!currentNoteId || !PERSONAL_NOTES.find(n=>n.id===currentNoteId && n.department===currentActiveNotesDepartment())){
    const top = topLevelNotes()[0];
    currentNoteId = top ? top.id : null;
  }
  view = "notes"; render();
}
function topLevelNotes(){ return PERSONAL_NOTES.filter(n=>!n.parent_id && n.department===currentActiveNotesDepartment()).sort((a,b)=>a.sort_order-b.sort_order); }
function childNotes(parentId){ return PERSONAL_NOTES.filter(n=>n.parent_id===parentId).sort((a,b)=>a.sort_order-b.sort_order); }

function renderNotes(){
  const tops = topLevelNotes();

  function sidebarRow(n, isChild){
    const active = n.id===currentNoteId;

    const chevron = (!isChild && kids.length) ? `<button class="mini-btn" data-note-toggle="${n.id}" style="padding:2px 5px;">${collapsed?'▸':'▾'}</button>` : `<span style="width:20px;display:inline-block;"></span>`;

      ${!isChild ? chevron : ""}<span class="ref-row-title">${escapeHtml(n.title)}</span>${tools}

    const kids = childNotes(n.id).filter(k=> !noteSearchActive || noteTitleMatches(n) || noteTitleMatches(k));
    const collapsed = noteSearchActive ? false : notesCollapsed.has(n.id);
    return sidebarRow(n,false) + (!collapsed ? kids.map(k=>sidebarRow(k,true)).join("") : "");
  }).join("") || (noteSearchActive ? `<p style="color:var(--text-faint);font-size:12.5px;padding:10px;">No matches.</p>` : `<p style="color:var(--text-faint);font-size:12.5px;padding:10px;">No notes yet.</p>`);

  if(!note){
    contentHtml = `<div class="card"><p style="color:var(--text-dim);font-size:14px;">${PERSONAL_NOTES.length ? 'Select a note from the left.' : 'Nothing here yet — click "+ Add note" to start your first page.'}</p></div>`;
  } else {
    contentHtml = `
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div class="k-label" style="margin-bottom:0;">MY NOTES · PRIVATE TO YOU</div>
          <span id="note-save-status" style="font-family:var(--mono);font-size:11px;color:var(--text-faint);"></span>
        </div>
        <input type="text" id="note-title" class="onenote-title-input" placeholder="Note title" value="${escapeHtml(note.title)}" style="margin-top:10px;">
        ${richEditorHtml("note-body-rte", note.body)}
        <div class="hint" style="margin-top:8px;">Saved automatically as you type. Paste an image directly, or use the 🖼 button.</div>
        <div class="nav-buttons"><button class="btn danger" id="note-delete">Delete note</button><div></div></div>
      </div>`;
  }

  const notesDeptTabsHtml = (myDepartments().length>1) ? `<div class="dept-tabs">
      ${renderDeptTabsHtml(currentActiveNotesDepartment(), 'notes-dept')}
    </div>` : "";

  renderShell(`
    ${notesDeptTabsHtml}
    <div class="ref-layout">
      <div class="ref-sidebar">
        <input type="text" id="note-search" data-no-enter-submit placeholder="Search notes…" value="${escapeHtml(noteSearchQuery)}" class="search-input" style="width:100%;box-sizing:border-box;margin-bottom:10px;">
        <div class="ref-sidebar-list">${sidebarHtml}</div><button class="dashed-btn" id="add-note" style="margin-top:10px;">+ Add note</button>
      </div>
      <div class="ref-content">${contentHtml}</div>
    </div>
  `);

  root.querySelectorAll("[data-notes-dept]").forEach(el=> el.addEventListener("click", ()=>{
    notesActiveDepartment = el.getAttribute("data-notes-dept");
    const top = topLevelNotes()[0];
    currentNoteId = top ? top.id : null;
    render();
  }));

  const noteSearchEl = document.getElementById("note-search");
  if(noteSearchEl){
    let noteSearchDebounce = null;
    noteSearchEl.addEventListener("input", (e)=>{
      noteSearchQuery = e.target.value;
      clearTimeout(noteSearchDebounce);
      noteSearchDebounce = setTimeout(()=>{
        render();

  root.querySelectorAll("[data-note-toggle]").forEach(el=> el.addEventListener("click", (e)=>{
    e.stopPropagation();
    const id = el.getAttribute("data-note-toggle");
    if(notesCollapsed.has(id)) notesCollapsed.delete(id); else notesCollapsed.add(id);
    render();
  }));

  const addBtn = document.getElementById("add-note");
  if(addBtn) addBtn.addEventListener("click", async ()=>{
    const { data, error } = await supabase.from("personal_notes").insert({ user_id: session.user.id, title:"New note", body:"<p>Write here.</p>", parent_id:null, department: currentActiveNotesDepartment(), sort_order: tops.length }).select().single();
    if(!error){ await loadPersonalNotes(); currentNoteId = data.id; render(); }
  });
  root.querySelectorAll("[data-note-addsub]").forEach(el=> el.addEventListener("click", async (e)=>{
    e.stopPropagation();
    const parentId = el.getAttribute("data-note-addsub");
    const kids = childNotes(parentId);
    const parentNote = PERSONAL_NOTES.find(n=>n.id===parentId);
    notesCollapsed.delete(parentId);
    const { data, error } = await supabase.from("personal_notes").insert({ user_id: session.user.id, title:"New subsection", body:"<p>Write here.</p>", parent_id:parentId, department: parentNote ? parentNote.department : currentActiveNotesDepartment(), sort_order: kids.length }).select().single();
    if(!error){ await loadPersonalNotes(); currentNoteId = data.id; render(); }
  }));
  root.querySelectorAll("[data-note-del]").forEach(el=> el.addEventListener("click", async (e)=>{
    e.stopPropagation();
    const id = el.getAttribute("data-note-del");
    const target = PERSONAL_NOTES.find(n=>n.id===id);
    const hasKids = childNotes(id).length>0;
    if(confirm(`Delete "${target.title}"?${hasKids?' This will also delete its subsections.':''}`)){
      await supabase.from("personal_notes").delete().eq("id", id);
      if(currentNoteId===id) currentNoteId = null;
      await loadPersonalNotes(); render();
    }
  }));

  let dragOverEl = null;
  root.querySelectorAll("[data-note-drag]").forEach(el=>{
    el.addEventListener("dragstart", (e)=>{ dragNoteId = el.getAttribute("data-note-drag"); e.dataTransfer.effectAllowed = "move"; el.style.opacity = "0.4"; startDragAutoScroll(); });
    el.addEventListener("dragend", ()=>{
      el.style.opacity = "";
      stopDragAutoScroll();
      if(dragOverEl){ dragOverEl.classList.remove("drag-over-top","drag-over-bottom"); dragOverEl = null; }
    });
    el.addEventListener("dragover", (e)=>{
      e.preventDefault();
      const rect = el.getBoundingClientRect();
      const pos = (e.clientY - rect.top) < rect.height/2 ? "before" : "after";
      if(dragOverEl && dragOverEl!==el) dragOverEl.classList.remove("drag-over-top","drag-over-bottom");
      dragOverEl = el;
      el.classList.toggle("drag-over-top", pos==="before");
      el.classList.toggle("drag-over-bottom", pos==="after");
    });
    el.addEventListener("dragleave", ()=>{ el.classList.remove("drag-over-top","drag-over-bottom"); });
    el.addEventListener("drop", async (e)=>{
      e.preventDefault();
      const pos = el.classList.contains("drag-over-top") ? "before" : "after";
      el.classList.remove("drag-over-top","drag-over-bottom");
      const targetId = el.getAttribute("data-note-drag");
      if(!dragNoteId || dragNoteId===targetId){ dragNoteId=null; return; }
      await reorderNoteDrop(dragNoteId, targetId, pos);
      dragNoteId = null;
    });
  });

  const deleteBtn = document.getElementById("note-delete");
  if(deleteBtn) deleteBtn.addEventListener("click", async ()=>{
    if(confirm(`Delete "${note.title}"? This can't be undone.`)){
      await supabase.from("personal_notes").delete().eq("id", note.id);
      currentNoteId = null; await loadPersonalNotes(); render();
    }
  });

  const titleInput = document.getElementById("note-title");
  const bodyRte = document.getElementById("note-body-rte");
  if(titleInput && bodyRte){
    const trigger = ()=> scheduleNoteAutosave(note.id, titleInput, bodyRte);
    titleInput.addEventListener("input", trigger);
    bodyRte.addEventListener("input", trigger);
  }
}

function scheduleNoteAutosave(noteId, titleInput, bodyRte){
  const statusEl = document.getElementById("note-save-status");
  if(statusEl){ statusEl.textContent = "Saving…"; statusEl.style.color = "var(--text-faint)"; }
  clearTimeout(noteSaveTimer);
  window.pendingAutosaveKeys.add("note:"+noteId);
  noteSaveTimer = setTimeout(async ()=>{
    const title = titleInput.value.trim() || "Untitled note";
    const body = getCleanEditorHtml(bodyRte);
    const { error } = await silentSave(()=> supabase.from("personal_notes").update({ title, body, updated_at: new Date().toISOString() }).eq("id", noteId));
    window.pendingAutosaveKeys.delete("note:"+noteId);
    const statusElNow = document.getElementById("note-save-status");
    if(error){
      if(statusElNow){ statusElNow.textContent = "Couldn't save: " + error.message; statusElNow.style.color = "var(--red)"; }
      return;
    }
    const n = PERSONAL_NOTES.find(x=>x.id===noteId);
    if(n){ n.title = title; n.body = body; }
    const titleEl = document.querySelector(`[data-note-select="${noteId}"] .ref-row-title`);
    if(titleEl) titleEl.textContent = title;
    if(statusElNow){ statusElNow.textContent = "Saved"; statusElNow.style.color = "var(--green)"; }
  }, 900);
}

async function reorderNoteDrop(draggedId, targetId, pos){
  const dragged = PERSONAL_NOTES.find(n=>n.id===draggedId);
  const target = PERSONAL_NOTES.find(n=>n.id===targetId);
  if(!dragged || !target) return;
  if((dragged.parent_id||null) !== (target.parent_id||null)) return;
  const siblings = (dragged.parent_id ? childNotes(dragged.parent_id) : topLevelNotes());
  const fromIdx = siblings.findIndex(s=>s.id===draggedId);
  let toIdx = siblings.findIndex(s=>s.id===targetId);
  if(fromIdx===-1 || toIdx===-1) return;
  if(pos==="after") toIdx++;
  const reordered = siblings.slice();
  reordered.splice(fromIdx,1);
  if(fromIdx < toIdx) toIdx--;
  reordered.splice(toIdx,0,dragged);
  for(let i=0;i<reordered.length;i++){
    if(reordered[i].sort_order !== i){ await supabase.from("personal_notes").update({ sort_order:i }).eq("id", reordered[i].id); }
  }
  await loadPersonalNotes(); render();
}

/* ============================================================
   INIT
   ============================================================ */
(async function init(){
  window.loadingBarSuppressed = true;
  applyTheme(currentTheme());
  view="loading"; render();

  // The query-param/token_hash link format doesn't establish a session on
  // its own the way the hash-fragment format does — it has to be explicitly
  // exchanged first. Tried before the normal getSession() check below,
  // since without this exchange there'd be no session yet to find.
  let landedSession = null;
  if(TOKEN_HASH && (AUTH_LINK_TYPE === "invite" || AUTH_LINK_TYPE === "recovery")){
    const { data: verifyData } = await supabase.auth.verifyOtp({ token_hash: TOKEN_HASH, type: AUTH_LINK_TYPE });
    if(verifyData && verifyData.session) landedSession = verifyData.session;
  }
  if(!landedSession){
    const { data } = await supabase.auth.getSession();
    landedSession = data.session;
  }

  if(landedSession){
    session = landedSession;
    if(AUTH_LINK_TYPE === "invite" || AUTH_LINK_TYPE === "recovery"){
      window.loadingBarSuppressed = false;
      view = "set-password";
      render();
    } else {
      await afterLogin();
    }
  } else {
    window.loadingBarSuppressed = false;
    if(AUTH_LINK_TYPE === "invite" || AUTH_LINK_TYPE === "recovery"){
      // This was an invite/recovery link, but no session came of it — the
      // link had already been used or expired. Land on the normal login
      // screen with an explanation rather than a dead end.
      authError = "This link has expired or already been used. Ask an admin to resend it.";
    }
    view="auth"; render();
  }

  supabase.auth.onAuthStateChange((event, newSession)=>{
    if(event === "SIGNED_OUT"){ session=null; profile=null; view="auth"; render(); }
  });
})();

})();
