<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comporium Training Modules</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');
  :root{
    --bg:#0A0F1A; --panel:#121A2B; --stroke:#24304a; --text:#E7ECF6; --text-dim:#8A96AD; --text-faint:#5A6480;
    --green:#34D399; --green-dim:#34D39933; --amber:#F0A93D; --amber-dim:#F0A93D33; --red:#EF5D5D; --red-dim:#EF5D5D33;
    --cyan:#52D5E0; --cyan-dim:#52D5E033; --mono:'IBM Plex Mono',monospace; --sans:'IBM Plex Sans',sans-serif;
  }
  *{box-sizing:border-box;} html,body{margin:0;padding:0;}
  body{ background:radial-gradient(circle at 15% -10%,#17233d 0%,transparent 45%),radial-gradient(circle at 100% 0%,#142234 0%,transparent 40%),var(--bg); color:var(--text); font-family:var(--sans); min-height:100vh; -webkit-font-smoothing:antialiased; }
  a,button,input,textarea{font-family:inherit;}
  #app{ max-width:1180px; margin:0 auto; padding:28px 20px 90px; }
  header.top{ display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; padding-bottom:22px; margin-bottom:26px; border-bottom:1px solid var(--stroke); }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand-mark{ width:34px; height:34px; border-radius:7px; background:linear-gradient(155deg,#17213a,#0d1424); border:1px solid var(--stroke); display:flex; align-items:center; justify-content:center; gap:3px; }
  .brand-mark i{ width:3px; height:14px; border-radius:2px; background:var(--green); box-shadow:0 0 6px var(--green); }
  .brand-mark i:nth-child(2){ height:9px; background:var(--amber); box-shadow:0 0 6px var(--amber);}
  .brand-mark i:nth-child(3){ height:18px; background:var(--cyan); box-shadow:0 0 6px var(--cyan);}
  .brand-text .name{ font-family:var(--mono); font-weight:700; letter-spacing:.04em; font-size:13px; }
  .brand-text .tag{ font-size:11px; color:var(--text-faint); letter-spacing:.05em; }
  .top-right{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  nav.crumbs{ font-family:var(--mono); font-size:12px; color:var(--text-faint); }
  nav.crumbs button{ background:none; border:none; color:var(--cyan); cursor:pointer; font-family:var(--mono); font-size:12px; padding:0; }
  .pill-btn{ font-family:var(--mono); font-size:11px; letter-spacing:.04em; padding:7px 12px; border-radius:7px; border:1px solid var(--stroke); background:#141d30; color:var(--text-dim); cursor:pointer; }
  .pill-btn:hover{ border-color:#3a4a70; color:var(--text); }
  .admin-badge{ font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; padding:6px 10px; border-radius:20px; border:1px solid var(--amber-dim); background:var(--amber-dim); color:var(--amber); }
  .led-strip{ display:flex; gap:6px; align-items:center; }
  .led{ width:9px; height:9px; border-radius:50%; background:#26314a; border:1px solid #2f3c5a; flex:none; }
  .led.on-green{ background:var(--green); border-color:var(--green); box-shadow:0 0 8px var(--green); }
  .led.on-amber{ background:var(--amber); border-color:var(--amber); box-shadow:0 0 8px var(--amber); }
  .led.on-red{ background:var(--red); border-color:var(--red); box-shadow:0 0 8px var(--red); }
  .led.blink{ animation:blinkled 1.1s steps(1) infinite; } @keyframes blinkled{50%{opacity:.15;}}
  .hero{ background:var(--panel); border:1px solid var(--stroke); border-radius:14px; padding:26px 26px 22px; margin-bottom:26px; position:relative; overflow:hidden; }
  .hero::after{ content:""; position:absolute; right:-40px; top:-40px; width:220px; height:220px; background:radial-gradient(circle,var(--cyan-dim),transparent 70%); pointer-events:none; }
  .hero .eyebrow{ font-family:var(--mono); font-size:11px; color:var(--cyan); letter-spacing:.14em; text-transform:uppercase; margin-bottom:10px; }
  .hero h1{ font-size:26px; margin:0 0 10px; line-height:1.25; font-weight:700; }
  .hero p{ color:var(--text-dim); font-size:14.5px; line-height:1.6; max-width:560px; margin:0 0 18px; }
  .panel-row{ display:flex; gap:22px; flex-wrap:wrap; }
  .stat{ font-family:var(--mono); } .stat .num{ font-size:22px; font-weight:700; } .stat .lbl{ font-size:11px; color:var(--text-faint); letter-spacing:.06em; }
  .grid{ display:grid; gap:14px; }
  .mod-card{ background:var(--panel); border:1px solid var(--stroke); border-radius:12px; padding:20px; cursor:pointer; transition:.15s; display:flex; flex-direction:column; gap:12px; position:relative; }
  .mod-card:hover{ border-color:#3a4a70; transform:translateY(-1px); }
  .mod-card .row-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:14px; }
  .mod-card h3{ margin:0 0 6px; font-size:16.5px; } .mod-card .sub{ color:var(--text-dim); font-size:13px; line-height:1.5; margin:0; }
  .mod-card .meta{ font-family:var(--mono); font-size:11px; color:var(--text-faint); display:flex; gap:14px; margin-top:2px; align-items:center; }
  .status-pill{ font-family:var(--mono); font-size:10.5px; letter-spacing:.05em; padding:4px 9px; border-radius:20px; border:1px solid var(--stroke); color:var(--text-faint); white-space:nowrap; text-transform:uppercase; }
  .status-pill.done{ color:var(--green); border-color:var(--green-dim); background:var(--green-dim); }
  .status-pill.progress{ color:var(--amber); border-color:var(--amber-dim); background:var(--amber-dim); }
  .progress-bar{ height:5px; border-radius:4px; background:#1c2740; overflow:hidden; } .progress-bar>div{ height:100%; background:linear-gradient(90deg,var(--cyan),var(--green)); }
  .card-tools{ position:absolute; top:14px; right:14px; display:flex; gap:6px; }
  .icon-btn{ width:28px; height:28px; border-radius:7px; border:1px solid var(--stroke); background:#0f1626; color:var(--text-dim); cursor:pointer; font-size:13px; display:flex; align-items:center; justify-content:center; }
  .icon-btn:hover{ border-color:#3a4a70; color:var(--text); } .icon-btn.danger:hover{ border-color:var(--red); color:var(--red); }
  .add-mod-card{ border:1px dashed var(--stroke); border-radius:12px; display:flex; align-items:center; justify-content:center; padding:26px; cursor:pointer; color:var(--text-faint); font-family:var(--mono); font-size:12.5px; }
  .add-mod-card:hover{ border-color:var(--cyan); color:var(--cyan); }
  .lesson-nav{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:22px; }
  .lesson-tab{ font-family:var(--mono); font-size:11.5px; padding:7px 12px; border-radius:8px; border:1px solid var(--stroke); background:var(--panel); color:var(--text-dim); cursor:pointer; }
  .lesson-tab.active{ border-color:var(--cyan); color:var(--cyan); background:var(--cyan-dim); } .lesson-tab.quiz{ margin-left:auto; }
  .card{ background:var(--panel); border:1px solid var(--stroke); border-radius:12px; padding:26px; position:relative; }
  .ref-content .card{ border:none; }
  .card h2{ margin:0 0 4px; font-size:20px; } .card .k-label{ font-family:var(--mono); font-size:11px; color:var(--text-faint); letter-spacing:.1em; text-transform:uppercase; margin-bottom:14px; }
  .card .body p{ color:#C7CFE0; font-size:14.5px; line-height:1.75; margin:0 0 14px; }
  .card .body ul{ margin:0 0 14px; padding-left:20px; color:#C7CFE0; font-size:14.5px; line-height:1.8; } .card .body li{ margin-bottom:4px; } .card .body strong{ color:var(--text); }
  .card .body img{ max-width:100%; border-radius:8px; margin:10px 0; display:block; }
  .light-table{ display:grid; grid-template-columns:auto 1fr; gap:10px 16px; margin:16px 0 18px; font-size:13.5px; }
  .light-table .lt-led{ display:flex; align-items:center; gap:8px; font-family:var(--mono); color:var(--text-dim); } .light-table .lt-desc{ color:#C7CFE0; }
  .callout{ border-left:3px solid var(--amber); background:var(--amber-dim); border-radius:0 8px 8px 0; padding:12px 16px; font-size:13.5px; color:#F3DCB0; margin:16px 0; }
  .callout.tip{ border-left-color:var(--cyan); background:var(--cyan-dim); color:#C9EEF2; }
  .nav-buttons{ display:flex; justify-content:space-between; margin-top:22px; gap:10px; flex-wrap:wrap; }
  .btn{ font-family:var(--mono); font-size:12.5px; letter-spacing:.03em; padding:10px 18px; border-radius:8px; border:1px solid var(--stroke); background:#182236; color:var(--text); cursor:pointer; transition:.15s; }
  .btn:hover{ border-color:#4a5b82; } .btn.primary{ background:linear-gradient(155deg,#1c3a35,#14261f); border-color:var(--green); color:var(--green); }
  .btn.primary:hover{ box-shadow:0 0 0 1px var(--green); } .btn.danger{ background:linear-gradient(155deg,#3a1c1c,#261414); border-color:var(--red); color:var(--red); } .btn:disabled{ opacity:.35; cursor:not-allowed; }
  .q-progress{ font-family:var(--mono); font-size:11.5px; color:var(--text-faint); margin-bottom:8px; }
  .q-block{ margin-bottom:8px; } .q-block h3{ font-size:16.5px; line-height:1.5; margin:0 0 18px; }
  .opt{ display:flex; align-items:flex-start; gap:12px; padding:13px 15px; border:1px solid var(--stroke); border-radius:9px; margin-bottom:10px; cursor:pointer; background:#0f1626; transition:.12s; }
  .opt:hover{ border-color:#3a4a70; } .opt .dot{ width:15px; height:15px; border-radius:50%; border:1px solid #445071; flex:none; margin-top:2px; }
  .opt span.txt{ font-size:14px; color:#D5DCEA; line-height:1.5; }
  .opt.selected{ border-color:var(--cyan); background:var(--cyan-dim); } .opt.selected .dot{ border-color:var(--cyan); background:var(--cyan); }
  .opt.correct{ border-color:var(--green); background:var(--green-dim); } .opt.correct .dot{ border-color:var(--green); background:var(--green); }
  .opt.wrong{ border-color:var(--red); background:var(--red-dim); } .opt.wrong .dot{ border-color:var(--red); background:var(--red); } .opt.disabled{ cursor:default; }
  .explain{ font-size:13px; color:var(--text-dim); background:#0f1626; border:1px solid var(--stroke); border-radius:8px; padding:12px 14px; margin-top:6px; line-height:1.6; } .explain strong{ color:var(--text); }
  .result-hero{ text-align:center; padding:36px 20px; } .result-hero .big-score{ font-family:var(--mono); font-size:52px; font-weight:700; } .result-hero .verdict{ font-size:14px; color:var(--text-dim); margin-top:6px; }
  .led-array{ display:flex; justify-content:center; gap:8px; margin:22px 0; } .led-array .led{ width:12px; height:12px; }
  footer.foot{ margin-top:60px; text-align:center; font-family:var(--mono); font-size:11px; color:var(--text-faint); }
  .field{ margin-bottom:16px; } .field label{ display:block; font-family:var(--mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-faint); margin-bottom:6px; }
  .field input[type=text],.field input[type=email],.field input[type=password],.field textarea{ width:100%; background:#0e1626; border:1px solid var(--stroke); border-radius:8px; color:var(--text); padding:10px 12px; font-size:13.5px; line-height:1.6; font-family:var(--sans); resize:vertical; }
  .field textarea{ font-family:var(--mono); font-size:12.5px; min-height:110px; }
  .field input:focus,.field textarea:focus{ border-color:var(--cyan); } .field .hint{ font-size:11px; color:var(--text-faint); margin-top:5px; }
  .editor-section{ margin-top:30px; } .editor-section-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .editor-section-head h3{ font-size:14px; margin:0; font-family:var(--mono); letter-spacing:.05em; color:var(--text-dim); text-transform:uppercase; }
  .sub-card{ background:#0e1626; border:1px solid var(--stroke); border-radius:10px; padding:18px; margin-bottom:14px; }
  .sub-card-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; } .sub-card-head .tag{ font-family:var(--mono); font-size:10.5px; color:var(--text-faint); }
  .mini-tools{ display:flex; gap:6px; }
  .mini-btn{ font-family:var(--mono); font-size:10.5px; padding:5px 9px; border-radius:6px; border:1px solid var(--stroke); background:#141d30; color:var(--text-dim); cursor:pointer; }
  .mini-btn:hover{ border-color:#3a4a70; color:var(--text); } .mini-btn.danger:hover{ border-color:var(--red); color:var(--red); }
  .opt-row{ display:flex; align-items:center; gap:10px; margin-bottom:8px; } .opt-row input[type=radio]{ accent-color:var(--green); width:16px; height:16px; flex:none; } .opt-row input[type=text]{ flex:1; }
  .dashed-btn{ width:100%; border:1px dashed var(--stroke); border-radius:9px; background:none; color:var(--text-faint); font-family:var(--mono); font-size:12px; padding:12px; cursor:pointer; }
  .dashed-btn:hover{ border-color:var(--cyan); color:var(--cyan); }
  table.team{ width:100%; border-collapse:collapse; font-size:13px; }
  table.team th{ text-align:left; font-family:var(--mono); font-size:10.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.05em; padding:8px 10px; border-bottom:1px solid var(--stroke); }
  table.team td{ padding:10px; border-bottom:1px solid var(--stroke); color:#D5DCEA; }
  .role-tag{ font-family:var(--mono); font-size:10px; padding:3px 8px; border-radius:12px; border:1px solid var(--stroke); }
  .role-tag.admin{ color:var(--amber); border-color:var(--amber-dim); background:var(--amber-dim); }
  .auth-wrap{ max-width:400px; margin:60px auto; }
  .auth-toggle{ display:flex; gap:8px; margin-bottom:20px; }
  .auth-toggle button{ flex:1; padding:10px; border-radius:8px; border:1px solid var(--stroke); background:#141d30; color:var(--text-dim); cursor:pointer; font-family:var(--mono); font-size:12px; }
  .auth-toggle button.active{ border-color:var(--cyan); color:var(--cyan); background:var(--cyan-dim); }
  .error-msg{ color:var(--red); font-size:12.5px; font-family:var(--mono); margin:-6px 0 12px; }
  .info-msg{ color:var(--cyan); font-size:12.5px; font-family:var(--mono); margin:-6px 0 12px; }
  @media (max-width:640px){ .hero h1{ font-size:21px; } .card{ padding:18px; } }
  html.theme-light{
    --bg:#F3F5FA; --panel:#FFFFFF; --stroke:#DCE3F0; --text:#1B2233; --text-dim:#5B6478; --text-faint:#8891A3;
  }
  html.theme-light body{ background:#F3F5FA; }
  html.theme-light .card .body p, html.theme-light .card .body ul, html.theme-light .opt span.txt{ color:#333d52; }

  html.theme-light .opt{ background:#eef1f8; }

  html.theme-light .export-textarea{ background:#eef1f8; color:#1b6b52; }

  html.theme-light .btn{ background:#eef1f8; }

  html.theme-light .btn.danger{ background:linear-gradient(155deg,#fadada,#f6c6c6); }
  html.theme-light .pill-btn{ background:#eef1f8; }
  html.theme-light .mini-btn{ background:#eef1f8; }
  html.theme-light .icon-btn{ background:#eef1f8; }
  html.theme-light .lesson-tab{ background:#eef1f8; }
  select{ width:100%; background:#0e1626; border:1px solid var(--stroke); border-radius:8px; color:var(--text); padding:10px 12px; font-size:13.5px; font-family:var(--sans); cursor:pointer; appearance:none; -webkit-appearance:none; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%238A96AD'/></svg>"); background-repeat:no-repeat; background-position:right 12px center; padding-right:32px; }
  select:focus{ outline:none; border-color:var(--cyan); }

  .gear-btn{ width:34px; height:34px; border-radius:8px; border:1px solid var(--stroke); background:#141d30; color:var(--text-dim); cursor:pointer; font-size:15px; display:flex; align-items:center; justify-content:center; }
  html.theme-light .gear-btn{ background:#eef1f8; }
  .gear-btn:hover{ border-color:#3a4a70; color:var(--text); }
  .theme-switch{ display:flex; gap:8px; }

  html.theme-light .theme-switch button{ background:#eef1f8; }
  .top-nav{ display:flex; gap:8px; margin-bottom:24px; }
  .top-nav-btn{ font-family:var(--mono); font-size:12px; letter-spacing:.03em; padding:9px 16px; border-radius:8px; border:1px solid var(--stroke); background:var(--panel); color:var(--text-dim); cursor:pointer; }
  .top-nav-btn:hover{ border-color:#3a4a70; color:var(--text); }
  .top-nav-btn.active{ border-color:var(--cyan); color:var(--cyan); background:var(--cyan-dim); }
  .two-col-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:640px){ .two-col-grid{ grid-template-columns:1fr; } }
  .three-col-grid{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; }
  @media (max-width:860px){ .three-col-grid{ grid-template-columns:1fr 1fr; } }
  @media (max-width:560px){ .three-col-grid{ grid-template-columns:1fr; } }
  .ref-layout{ display:flex; gap:14px; align-items:flex-start; }
  .ref-sidebar{ width:168px; flex:none; }
  .ref-content{ flex:1; min-width:0; }
  .ref-sidebar-list{ display:flex; flex-direction:column; gap:5px; }
  .ref-row{ display:flex; align-items:center; padding:9px 10px; border-radius:8px; cursor:pointer; font-size:13px; color:var(--text-dim); position:relative; transition:background .12s; }
  .ref-row:hover{ background:#141d30; } html.theme-light .ref-row:hover{ background:#eef1f8; }
  .ref-row.active{ background:var(--cyan-dim); color:var(--cyan); }
  .ref-row.child{ margin-left:16px; font-size:12.5px; color:var(--text-faint); position:relative; }
  .ref-row.child::before{ content:""; position:absolute; left:-10px; top:2px; bottom:2px; width:1px; background:var(--stroke); }
  .ref-row.child .ref-row-title::before{ content:"—"; margin-right:5px; color:var(--text-faint); }
  .ref-row-title{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; min-width:0; }
  .ref-row-tools{ display:flex; gap:2px; flex:none; opacity:0; pointer-events:none; transition:opacity .12s; position:absolute; right:6px; top:50%; transform:translateY(-50%); background:#141d30; border-radius:6px; padding:2px; }
  html.theme-light .ref-row-tools{ background:#eef1f8; }

  .ref-row.drag-over-bottom::after, .mod-card.drag-over-bottom::after{ content:""; position:absolute; left:4px; right:4px; bottom:-4px; height:3px; border-radius:2px; background:var(--cyan); box-shadow:0 0 6px var(--cyan); z-index:2; }
  .drag-handle{ cursor:grab; color:var(--text-faint); font-size:15px; width:28px; height:28px; display:flex; align-items:center; justify-content:center; }
  .ref-row[draggable="true"]{ cursor:grab; }
  .onenote-title-input{ width:100%; background:none; border:none; border-bottom:1px solid var(--stroke); font-size:26px; font-weight:700; color:var(--text); font-family:var(--sans); padding:4px 2px 14px; outline:none; margin-bottom:14px; }
  .onenote-title-input::placeholder{ color:var(--text-faint); font-weight:400; }

  @media (max-width:768px){ .ref-layout{ flex-direction:column; } .ref-sidebar{ width:100%; } }

  .bell-wrap{ position:relative; }
  .notif-dot{ position:absolute; top:4px; right:4px; width:8px; height:8px; border-radius:50%; background:var(--red); box-shadow:0 0 6px var(--red); }

  .notif-panel-head{ font-family:var(--mono); font-size:12px; letter-spacing:.05em; text-transform:uppercase; color:var(--text-faint); margin-bottom:10px; }
  .notif-section-title{ font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--text-faint); margin:14px 0 6px; }
  .notif-item{ background:#0e1626; border:1px solid var(--stroke); border-radius:8px; padding:9px 10px; margin-bottom:6px; font-size:12.5px; }

<body>
<div id="app"></div>

<script>
(function(){

/* ============================================================
   FILL THESE IN — Supabase project settings → API
   ============================================================ */
const SUPABASE_URL = "https://lstevbfkiooknptjdpjg.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_Nt7ZCMg7PfeRssw1dGqA9w_xa8EyhiM";


const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ============================================================
   APP STATE
   ============================================================ */
let session = null;
let profile = null;         // { id, name, role }
let MODULES = [];           // [{id,title,short,ledColor,lessons:[...],quiz:[...]}]
let progressMap = {};       // { moduleId: {best,total,lastScore,attempts} }

let view = "loading";       // loading | auth | dashboard | lesson | quiz | results | editor | team
let authMode = "login";     // login | signup
let authError = "";
let authInfo = "";

let currentModId = null;
let currentLessonIdx = 0;
let quizAnswers = []; let quizRevealed = []; let quizIdx = 0;

let draftModule = null; let editingExistingId = null;
let teamRows = [];
let REFERENCE_PAGES = [];
let currentRefId = null;
let refEditing = false;
let refDraft = null;

let NOTIF_ANNOUNCEMENTS = [];
let NOTIF_UNCLAIMED = [];  // admin only: flags/comments nobody has claimed yet (no messages yet)
let NOTIF_THREADS = [];    // conversations I'm part of: { root, messages, lastActivity }
let collapsedThreadIds = new Set();
let realtimeChannels = [];

const root = document.getElementById("app");
function escapeHtml(s){ const d=document.createElement("div"); d.textContent=s==null?"":s; return d.innerHTML; }
function modById(id){ return MODULES.find(m=>m.id===id); }
function pct(s){ return s && s.total ? Math.round((s.best/s.total)*100) : 0; }
function overallPct(m){
  const s = progressMap[m.id];
  const totalLessons = m.lessons.length || 1;
  const viewedCount = s && s.lessonsViewed ? s.lessonsViewed.length : 0;
  const lessonFraction = Math.min(viewedCount / totalLessons, 1);
  const quizFraction = s && m.quiz.length ? (s.best||0) / m.quiz.length : 0;
  return Math.round((lessonFraction*0.5 + quizFraction*0.5) * 100);
}
async function markLessonViewed(m, lessonId){
  const existing = progressMap[m.id] || { best:0, total:m.quiz.length, lastScore:0, attempts:0, lessonsViewed:[] };
  if(!existing.lessonsViewed) existing.lessonsViewed = [];
  if(existing.lessonsViewed.includes(lessonId)) return; // already recorded, skip the write
  existing.lessonsViewed = [...existing.lessonsViewed, lessonId];
  progressMap[m.id] = existing;
  await supabase.from("progress").upsert({
    user_id: session.user.id, module_id: m.id,
    best_score: existing.best, total: m.quiz.length, last_score: existing.lastScore, attempts: existing.attempts,
    lessons_viewed: existing.lessonsViewed, updated_at: new Date().toISOString()
  }, { onConflict: "user_id,module_id" });
}
let editMode = false;
function isAdmin(){ return profile && profile.role === "admin"; }
function canEdit(){ return isAdmin() && editMode; }

/* ============================================================
   DATA LOADING
   ============================================================ */
async function loadEverything(){
  const { data: mods } = await supabase.from("modules").select("*").order("sort_order");
  const { data: lessons } = await supabase.from("lessons").select("*").order("sort_order");
  const { data: quiz } = await supabase.from("quiz_questions").select("*").order("sort_order");
  MODULES = (mods||[]).map(m=>({
    id:m.id, title:m.title, short:m.short, ledColor:m.led_color,
    lessons:(lessons||[]).filter(l=>l.module_id===m.id).map(l=>({id:l.id,label:l.label,title:l.title,body:l.body})),
    quiz:(quiz||[]).filter(q=>q.module_id===m.id).map(q=>({id:q.id,q:q.question,opts:q.options,correct:q.correct_index,explain:q.explanation}))
  }));

  const { data: prog } = await supabase.from("progress").select("*").eq("user_id", session.user.id);
  progressMap = {};
  (prog||[]).forEach(p=>{ progressMap[p.module_id] = { best:p.best_score, total:p.total, lastScore:p.last_score, attempts:p.attempts, lessonsViewed:p.lessons_viewed||[] }; });
}

async function loadProfile(){
  const { data } = await supabase.from("profiles").select("*").eq("id", session.user.id).single();
  profile = data;
}

/* ============================================================
   AUTH
   ============================================================ */
function renderAuth(){
  root.innerHTML = `
    <div class="auth-wrap">
      <div style="text-align:center;margin-bottom:26px;">
        <div class="brand-mark" style="margin:0 auto 12px;"><i></i><i></i><i></i></div>
        <div class="brand-text"><div class="name">COMPORIUM TRAINING MODULES</div></div>
      </div>
      <div class="card">
        <div class="auth-toggle">
          <button id="tab-login" class="${authMode==='login'?'active':''}">Log in</button>
          <button id="tab-signup" class="${authMode==='signup'?'active':''}">Sign up</button>
        </div>
        ${authError ? `<div class="error-msg">${escapeHtml(authError)}</div>` : ""}
        ${authInfo ? `<div class="info-msg">${escapeHtml(authInfo)}</div>` : ""}
        ${authMode==='signup' ? `<div class="field"><label>Your name</label><input type="text" id="auth-name" placeholder="Jordan Smith"></div>` : ""}
        <div class="field"><label>Email</label><input type="email" id="auth-email" placeholder="you@company.com"></div>
        <div class="field"><label>Password</label><input type="password" id="auth-password" placeholder="••••••••"></div>
        <button class="btn primary" id="auth-submit" style="width:100%;">${authMode==='login'?'Log in':'Create account'}</button>
      </div>
    </div>
  `;
  document.getElementById("tab-login").addEventListener("click", ()=>{ authMode="login"; authError=""; authInfo=""; renderAuth(); });
  document.getElementById("tab-signup").addEventListener("click", ()=>{ authMode="signup"; authError=""; authInfo=""; renderAuth(); });
  document.getElementById("auth-submit").addEventListener("click", submitAuth);
}

async function submitAuth(){
  authError=""; authInfo="";
  const email = document.getElementById("auth-email").value.trim();
  const password = document.getElementById("auth-password").value;
  if(!email || !password){ authError = "Enter an email and password."; renderAuth(); return; }

  if(authMode==="signup"){
    const name = document.getElementById("auth-name").value.trim();
    if(!name){ authError = "Enter your name."; renderAuth(); return; }
    const { data, error } = await supabase.auth.signUp({ email, password, options:{ data:{ name } } });
    if(error){ authError = error.message; renderAuth(); return; }
    if(data.session){
      session = data.session; await afterLogin();
    } else {
      authInfo = "Account created — check your email to confirm, then log in.";
      authMode = "login"; renderAuth();
    }
    return;
  }

  const { data, error } = await supabase.auth.signInWithPassword({ email, password });
  if(error){ authError = error.message; renderAuth(); return; }
  session = data.session;
  await afterLogin();
}

async function afterLogin(){
  view = "loading"; render();
  await loadProfile();
  await loadEverything();
  await loadAllNotifications();
  setupRealtime();
  view = "home"; render();
  await showUnseenAnnouncements();
}

async function showUnseenAnnouncements(){
  const since = profile.last_seen_announcement_at || "1970-01-01T00:00:00Z";
  const { data, error } = await supabase.from("messages").select("*").eq("audience","all").gt("created_at", since).order("created_at",{ascending:true});
  if(error){ console.error("Failed to check for new announcements:", error); return; }
  const { data: dismissals } = await supabase.from("announcement_dismissals").select("message_id").eq("user_id", session.user.id);
  const dismissedIds = new Set((dismissals||[]).map(d=>d.message_id));
  const unseen = (data || []).filter(a=> !dismissedIds.has(a.id));

  // Unread chat messages — NOTIF_THREADS is already populated from loadAllNotifications() in afterLogin.
  const unreadMessages = [];
  NOTIF_THREADS.forEach(t=> t.messages.forEach(m=>{ if(m.recipient_id===session.user.id && !m.is_read) unreadMessages.push(m); }));

  if(!unseen.length && !unreadMessages.length) return;

  function renderDigest(){
    const annHtml = unseen.length ? `
      <h3 style="font-size:13px;color:var(--text-dim);margin:0 0 10px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.05em;">Announcements</h3>
      ${unseen.map(a=>`
        <div class="sub-card" data-digest-item="${a.id}">
          <div class="sub-card-head"><span class="tag">📣 ${escapeHtml(a.sender_name)} · ${new Date(a.created_at).toLocaleString()}</span>
            <button class="mini-btn" data-digest-dismiss="${a.id}">Dismiss</button></div>
          <div style="font-size:14px;color:var(--text);">${a.body}</div>
        </div>`).join("")}
    ` : "";

    const msgHtml = unreadMessages.length ? `
      <h3 style="font-size:13px;color:var(--text-dim);margin:${unseen.length?'20px':'0'} 0 10px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.05em;">New messages</h3>
      ${unreadMessages.map(m=>`
        <div class="sub-card">
          <div class="sub-card-head"><span class="tag">💬 ${escapeHtml(m.sender_name)} · ${new Date(m.created_at).toLocaleString()}</span></div>
          <div style="font-size:14px;color:var(--text);">${m.body}</div>
        </div>`).join("")}
      <button class="btn" id="digest-go-chat" style="margin-top:4px;">Open Chat →</button>
    ` : "";

    const totalCount = unseen.length + unreadMessages.length;
    openModal(`
      <h3>${totalCount===1 ? "1 thing" : `${totalCount} things`} while you were away</h3>
      <p class="sub">Posted or sent while you were logged out.</p>
      ${annHtml}${msgHtml}
      <div class="modal-actions"><button class="btn primary" id="ann-digest-ok">Got it</button></div>
    `, true);
    document.querySelectorAll("[data-digest-dismiss]").forEach(el=> el.addEventListener("click", async ()=>{
      const id = el.getAttribute("data-digest-dismiss");
      await supabase.from("announcement_dismissals").upsert({ user_id: session.user.id, message_id: id });
      const idx = unseen.findIndex(u=>u.id===id);
      if(idx>-1) unseen.splice(idx,1);
      if(!unseen.length && !unreadMessages.length){ closeModal(); markAnnouncementsSeen(); }
      else renderDigest();
    }));
    const goChat = document.getElementById("digest-go-chat");
    if(goChat) goChat.addEventListener("click", ()=>{ closeModal(); markAnnouncementsSeen(); openChat(); });
    document.getElementById("ann-digest-ok").addEventListener("click", ()=>{ closeModal(); markAnnouncementsSeen(); });
  }

  async function markAnnouncementsSeen(){
    if(!data.length) return;
    const latest = data[data.length-1].created_at;
    await supabase.from("profiles").update({ last_seen_announcement_at: latest }).eq("id", session.user.id);
    profile.last_seen_announcement_at = latest;
  }

  renderDigest();
}

async function logout(){
  teardownRealtime();
  await supabase.auth.signOut();
  session = null; profile = null; MODULES = []; progressMap = {};
  view = "auth"; authMode = "login"; render();
}

/* ============================================================
   SHELL
   ============================================================ */
function renderShell(inner){
  const inModulesFlow = ["lesson","quiz","results","editor"].includes(view);

  root.innerHTML = `
    <header class="top">
      <div class="brand">
        <button class="gear-btn" id="open-settings" title="Settings">⚙</button>
        <div class="brand-mark"><i></i><i></i><i></i></div>
        <div class="brand-text"><div class="name">COMPORIUM TRAINING MODULES</div></div>
      </div>
      <div class="top-right">
        <nav class="crumbs">${ (view==="home"||view==="dashboard"||view==="reference"||view==="notes") ? "" : `<button id="crumb-home">${crumbLabel}</button> / ${escapeHtml(currentModId && modById(currentModId) ? modById(currentModId).title.toUpperCase() : (view==='editor'?'EDITOR':view==='team'?'TEAM PROGRESS':view==='settings'?'SETTINGS':view==='notifications'?'NOTIFICATIONS':view==='chat'?'CHAT':''))}`}</nav>
        ${isAdmin() ? `<button class="pill-btn" id="go-team-btn">Team Progress</button>` : ""}

          <button class="gear-btn" id="notif-bell" title="Notifications">🔔${notifBadgeCount()>0?`<span class="notif-dot"></span>`:''}</button>
        </div>
        <div class="bell-wrap">
          <button class="gear-btn" id="chat-bubble" title="Conversations">💬${chatBadgeCount()>0?`<span class="notif-dot"></span>`:''}</button>
        </div>
        <span class="pill-btn" style="cursor:default;">${escapeHtml(profile ? profile.name : "")}</span>

          <div class="admin-menu">
            <span class="admin-badge">ADMIN ▾</span>

      <button class="top-nav-btn ${section==='modules'?'active':''}" id="nav-modules">Training Modules</button>
      <button class="top-nav-btn ${section==='reference'?'active':''}" id="nav-reference">Reference</button>
      <button class="top-nav-btn ${section==='notes'?'active':''}" id="nav-notes">My Notes</button>
    </div>
    <main>${inner}</main>
    <footer class="foot">SIGNAL HELD · PROGRESS SAVED AUTOMATICALLY</footer>
  `;
  const crumb = document.getElementById("crumb-home"); if(crumb) crumb.addEventListener("click", ()=>{ view=crumbTarget; render(); });
  document.getElementById("nav-home").addEventListener("click", ()=>{ view="home"; render(); });
  document.getElementById("nav-modules").addEventListener("click", ()=>{ view="dashboard"; render(); });
  document.getElementById("nav-reference").addEventListener("click", openReference);
  document.getElementById("nav-notes").addEventListener("click", openNotes);
  document.getElementById("open-settings").addEventListener("click", ()=>{ view="settings"; render(); });
  document.getElementById("logout-btn").addEventListener("click", logout);
  document.getElementById("notif-bell").addEventListener("click", openNotifications);
  document.getElementById("chat-bubble").addEventListener("click", ()=> openChat());
  const toggleEdit = document.getElementById("toggle-edit-mode");
  if(toggleEdit) toggleEdit.addEventListener("click", ()=>{ editMode = !editMode; render(); });
  const openAnnounce = document.getElementById("open-announce");
  if(openAnnounce) openAnnounce.addEventListener("click", openAnnouncementModal);
  const goTeamBtn = document.getElementById("go-team-btn");
  if(goTeamBtn) goTeamBtn.addEventListener("click", openTeamProgress);
}

/* ============================================================
   DASHBOARD
   ============================================================ */
function resumeLessonIdx(m){
  const s = progressMap[m.id];
  const viewed = s && s.lessonsViewed ? s.lessonsViewed : [];
  const idx = m.lessons.findIndex(l=> !viewed.includes(l.id));
  return idx === -1 ? Math.max(m.lessons.length-1, 0) : idx;
}
function moduleStatus(id){
  const s = progressMap[id];
  if(!s) return "new";
  if(s.total > 0 && s.best === s.total) return "mastered";
  if(!s.attempts) return "reading";
  return "attempted";
}

async function reorderModuleDrop(draggedId, targetId, pos){
  const fromIdx = MODULES.findIndex(m=>m.id===draggedId);
  let toIdx = MODULES.findIndex(m=>m.id===targetId);
  if(fromIdx===-1 || toIdx===-1) return;
  if(pos==="after") toIdx++;
  const dragged = MODULES[fromIdx];
  const reordered = MODULES.slice();
  reordered.splice(fromIdx,1);
  if(fromIdx < toIdx) toIdx--;
  reordered.splice(toIdx,0,dragged);
  MODULES = reordered;
  for(let i=0;i<MODULES.length;i++){
    await supabase.from("modules").update({ sort_order:i }).eq("id", MODULES[i].id);
  }
  render();
}

function renderDashboard(){
  const editOn = canEdit();
  const cards = MODULES.map(m=>{
    const status = moduleStatus(m.id); const s = progressMap[m.id];
    const pillHtml = status==="mastered" ? `<span class="status-pill done">Mastered</span>`
      : status==="attempted" ? `<span class="status-pill progress">${s.best}/${s.total} correct</span>`
      : status==="reading" ? `<span class="status-pill progress">Quiz not started</span>`
      : `<span class="status-pill">Not started</span>`;
    const on = status!=="new"; const mastered = status==="mastered";
    const leds = `<span class="led ${on?'on-green':''}"></span><span class="led ${on?(mastered?'on-green':'on-amber blink'):''}"></span><span class="led ${mastered?'on-green':''}"></span>`;
    const tools = editOn ? `<div class="card-tools"><span class="drag-handle" title="Drag to reorder">⠿</span><button class="icon-btn" data-edit="${m.id}" title="Edit module">✎</button><button class="icon-btn danger" data-del="${m.id}" title="Delete module">✕</button></div>` : "";
    return `<div class="mod-card" data-mod="${m.id}" data-mod-drag="${m.id}" draggable="${editOn}">${tools}
      <div class="row-top"><div><h3>${escapeHtml(m.title)}</h3><p class="sub">${escapeHtml(m.short)}</p></div><div class="led-strip">${leds}</div></div>
      <div class="meta"><span>${m.lessons.length} LESSONS</span><span>${m.quiz.length} QUIZ Q's</span>${pillHtml}</div>
      <div class="progress-bar"><div style="width:${overallPct(m)}%"></div></div></div>`;
  }).join("");

  const addCard = canEdit() ? `<div class="add-mod-card" id="add-module">+ ADD MODULE</div>` : "";
  const totalQ = MODULES.reduce((a,m)=>a+m.quiz.length,0);
  const doneQ = Object.values(progressMap).reduce((a,s)=>a+(s.best||0),0);
  const modsMastered = MODULES.filter(m=>moduleStatus(m.id)==="mastered").length;

  renderShell(`
    <section class="hero">
      <div class="eyebrow">New Agent Onboarding</div>
      <h1>Before you take a call, learn to read the box.</h1>
      <p>Modules built from the tickets you'll actually see this week. Each ends in a scored quiz — your progress is saved to your account.</p>
      <div class="panel-row"><div class="stat"><div class="num">${modsMastered}/${MODULES.length}</div><div class="lbl">MODULES MASTERED</div></div>
      <div class="stat"><div class="num">${doneQ}/${totalQ}</div><div class="lbl">BEST-SCORE QUESTIONS CORRECT</div></div></div>
    </section>
    <div class="grid">${cards}${addCard}</div>
  `);

  root.querySelectorAll(".mod-card").forEach(el=> el.addEventListener("click",(e)=>{
    if(e.target.closest("[data-edit]")||e.target.closest("[data-del]")||e.target.closest(".drag-handle")) return;
    const id = el.getAttribute("data-mod"); const m = modById(id);
    currentModId = id; currentLessonIdx = resumeLessonIdx(m); view="lesson"; render();
  }));
  root.querySelectorAll("[data-edit]").forEach(el=> el.addEventListener("click",(e)=>{ e.stopPropagation(); openEditor(el.getAttribute("data-edit")); }));
  root.querySelectorAll("[data-del]").forEach(el=> el.addEventListener("click", async (e)=>{
    e.stopPropagation(); const id = el.getAttribute("data-del"); const m = modById(id);
    if(confirm(`Delete "${m.title}"? This can't be undone.`)){
      await supabase.from("modules").delete().eq("id", id);
      await loadEverything(); render();
    }
  }));

  if(editOn){
    let dragModId = null;
    let dragOverEl = null;
    root.querySelectorAll("[data-mod-drag]").forEach(el=>{
      el.addEventListener("dragstart", (e)=>{ dragModId = el.getAttribute("data-mod-drag"); e.dataTransfer.effectAllowed = "move"; el.style.opacity = "0.4"; startDragAutoScroll(); });
      el.addEventListener("dragend", ()=>{
        el.style.opacity = "";
        stopDragAutoScroll();
        if(dragOverEl){ dragOverEl.classList.remove("drag-over-top","drag-over-bottom"); dragOverEl = null; }
      });
      el.addEventListener("dragover", (e)=>{
        e.preventDefault();
        const rect = el.getBoundingClientRect();
        const pos = (e.clientY - rect.top) < rect.height/2 ? "before" : "after";
        if(dragOverEl && dragOverEl!==el) dragOverEl.classList.remove("drag-over-top","drag-over-bottom");
        dragOverEl = el;
        el.classList.toggle("drag-over-top", pos==="before");
        el.classList.toggle("drag-over-bottom", pos==="after");
      });
      el.addEventListener("dragleave", ()=>{ el.classList.remove("drag-over-top","drag-over-bottom"); });
      el.addEventListener("drop", async (e)=>{
        e.preventDefault();
        const pos = el.classList.contains("drag-over-top") ? "before" : "after";
        el.classList.remove("drag-over-top","drag-over-bottom");
        const targetId = el.getAttribute("data-mod-drag");
        if(!dragModId || dragModId===targetId){ dragModId=null; return; }
        await reorderModuleDrop(dragModId, targetId, pos);
        dragModId = null;
      });
    });
  }
  const addBtn = document.getElementById("add-module"); if(addBtn) addBtn.addEventListener("click", ()=>openEditor(null));
}

   LESSON / QUIZ / RESULTS
   ============================================================ */
function renderLesson(){
  const m = modById(currentModId); if(!m){ view="dashboard"; render(); return; }
  const lesson = m.lessons[currentLessonIdx];
  if(lesson.id) markLessonViewed(m, lesson.id);
  const tabs = m.lessons.map((l,i)=>`<button class="lesson-tab ${i===currentLessonIdx?'active':''}" data-idx="${i}">${i+1}. ${escapeHtml(l.title)}</button>`).join("");
  const isLast = currentLessonIdx === m.lessons.length-1;
  const editBtn = canEdit() ? `<button class="lesson-tab" id="edit-mod" style="border-color:var(--amber);color:var(--amber);">✎ Edit module</button>` : "";
  renderShell(`
    <div class="lesson-nav">${tabs}${editBtn}<button class="lesson-tab quiz" id="go-quiz">TAKE QUIZ →</button></div>
    <div class="card"><div class="k-label">${escapeHtml(lesson.label)}</div><h2>${escapeHtml(lesson.title)}</h2><div class="body">${lesson.body}</div>
      <div class="nav-buttons"><button class="btn" id="prev-lesson" ${currentLessonIdx===0?'disabled':''}>← Previous</button>
      ${isLast? `<button class="btn primary" id="to-quiz-btn">Start module quiz →</button>` : `<button class="btn primary" id="next-lesson">Next lesson →</button>`}</div>
      <div class="nav-buttons" style="margin-top:8px;"><button class="mini-btn" id="comment-lesson">💬 Comment</button><div></div></div>
    </div>`);
  root.querySelectorAll(".lesson-tab[data-idx]").forEach(el=> el.addEventListener("click", ()=>{ currentLessonIdx=parseInt(el.getAttribute("data-idx")); render(); }));
  document.getElementById("go-quiz").addEventListener("click", startQuiz);
  const prev=document.getElementById("prev-lesson"); if(prev) prev.addEventListener("click", ()=>{ if(currentLessonIdx>0){currentLessonIdx--; render();} });
  const next=document.getElementById("next-lesson"); if(next) next.addEventListener("click", ()=>{ currentLessonIdx++; render(); });
  const toQuiz=document.getElementById("to-quiz-btn"); if(toQuiz) toQuiz.addEventListener("click", startQuiz);
  const editMod=document.getElementById("edit-mod"); if(editMod) editMod.addEventListener("click", ()=>openEditor(m.id));
  document.getElementById("comment-lesson").addEventListener("click", ()=> openFeedbackModal("comment", `${m.title} — ${lesson.title}`));
}

function startQuiz(){ const m=modById(currentModId); quizAnswers=new Array(m.quiz.length).fill(null); quizRevealed=new Array(m.quiz.length).fill(false); quizIdx=0; view="quiz"; render(); }

function renderQuiz(){
  const m = modById(currentModId); if(!m||!m.quiz.length){ view="lesson"; render(); return; }
  const q = m.quiz[quizIdx]; const revealed = quizRevealed[quizIdx]; const selected = quizAnswers[quizIdx];
  const opts = q.opts.map((opt,i)=>{ let cls="opt"; if(revealed){ cls+=" disabled"; if(i===q.correct) cls+=" correct"; else if(i===selected) cls+=" wrong"; } else if(i===selected){ cls+=" selected"; }
    return `<div class="${cls}" data-idx="${i}"><div class="dot"></div><span class="txt">${escapeHtml(opt)}</span></div>`; }).join("");
  const explain = revealed ? `<div class="explain"><strong>${selected===q.correct?'Correct.':'Not quite.'}</strong> ${escapeHtml(q.explain)}</div>` : "";
  const isLast = quizIdx === m.quiz.length-1;
  const editBtn = canEdit() ? `<button class="btn" id="edit-mod-q" style="border-color:var(--amber);color:var(--amber);">✎ Edit module</button>` : "";
  renderShell(`
    <div class="q-progress">MODULE QUIZ · ${escapeHtml(m.title.toUpperCase())} · QUESTION ${quizIdx+1} OF ${m.quiz.length}</div>
    <div class="card"><div class="q-block"><h3>${escapeHtml(q.q)}</h3>${opts}</div>${explain}
      <div class="nav-buttons"><div style="display:flex;gap:10px;"><button class="btn" id="quiz-prev" ${quizIdx===0?'disabled':''}>← Previous</button>${editBtn}</div>
      <button class="btn primary" id="quiz-next" ${selected===null?'disabled':''}>${isLast?(revealed?'See results →':'Check answer'):(revealed?'Next question →':'Check answer')}</button></div>
      <div class="nav-buttons" style="margin-top:8px;"><button class="mini-btn" id="flag-question">🚩 Flag this question</button><div></div></div>
    </div>`);
  if(!revealed) root.querySelectorAll(".opt").forEach(el=> el.addEventListener("click", ()=>{ quizAnswers[quizIdx]=parseInt(el.getAttribute("data-idx")); render(); }));
  document.getElementById("quiz-prev").addEventListener("click", ()=>{ if(quizIdx>0){ quizIdx--; render(); } });
  document.getElementById("quiz-next").addEventListener("click", ()=>{ if(!revealed){ quizRevealed[quizIdx]=true; render(); } else if(isLast){ finishQuiz(); } else { quizIdx++; render(); } });
  const editModQ=document.getElementById("edit-mod-q"); if(editModQ) editModQ.addEventListener("click", ()=>openEditor(m.id));
  document.getElementById("flag-question").addEventListener("click", ()=> openFeedbackModal("flag", `${m.title} — Q${quizIdx+1}: ${q.q}`));
}

async function finishQuiz(){
  const m = modById(currentModId);
  const correctCount = quizAnswers.reduce((acc,ans,i)=> acc+(ans===m.quiz[i].correct?1:0),0);
  const prior = progressMap[m.id];
  const record = { best: Math.max(correctCount, prior?prior.best:0), total: m.quiz.length, lastScore: correctCount, attempts: (prior?prior.attempts:0)+1, lessonsViewed: prior&&prior.lessonsViewed ? prior.lessonsViewed : [] };
  progressMap[m.id] = record;
  await supabase.from("progress").upsert({
    user_id: session.user.id, module_id: m.id, best_score: record.best, total: record.total, last_score: record.lastScore, attempts: record.attempts, lessons_viewed: record.lessonsViewed, updated_at: new Date().toISOString()
  }, { onConflict: "user_id,module_id" });

  const answerDetail = m.quiz.map((q,i)=>({
    question: q.q, options: q.opts, selected: quizAnswers[i], correct: q.correct, is_correct: quizAnswers[i]===q.correct
  }));
  await supabase.from("quiz_attempts").insert({
    user_id: session.user.id, module_id: m.id, score: correctCount, total: m.quiz.length, answers: answerDetail
  });
  view = "results"; render();
}

function renderResults(){
  const m = modById(currentModId); const s = progressMap[m.id]; const p = pct(s);
  const leds = Array.from({length:5}).map((_,i)=>{ const lit = i < Math.round((s.lastScore/s.total)*5); const color = p===100?"on-green":p>=60?"on-amber":"on-red"; return `<span class="led ${lit?color:''}"></span>`; }).join("");
  const verdict = p===100?"Fully registered. This module is locked in.":p>=60?"Mostly holding — worth a second pass before it's live-call ready.":"Signal's not there yet. Revisit the lessons and retake when ready.";
  renderShell(`
    <div class="card result-hero"><div class="k-label">QUIZ RESULT · ${escapeHtml(m.title.toUpperCase())}</div>
      <div class="big-score">${s.lastScore}/${s.total}</div><div class="led-array">${leds}</div><div class="verdict">${escapeHtml(verdict)}</div>
      <div class="nav-buttons" style="justify-content:center;gap:14px;"><button class="btn" id="retake">Retake quiz</button><button class="btn" id="review">Review lessons</button><button class="btn primary" id="back-dash">Back to dashboard</button></div>
    </div>`);
  document.getElementById("retake").addEventListener("click", startQuiz);
  document.getElementById("review").addEventListener("click", ()=>{ currentLessonIdx=0; view="lesson"; render(); });
  document.getElementById("back-dash").addEventListener("click", ()=>{ view="dashboard"; render(); });
}

/* ============================================================
   TEAM PROGRESS (admin only)
   ============================================================ */
async function openTeamProgress(){
  const { data: people } = await supabase.from("profiles").select("*").order("name");
  const { data: allProgress } = await supabase.from("progress").select("*");
  teamRows = (people||[]).map(p=>{
    const rows = (allProgress||[]).filter(pr=>pr.user_id===p.id);
    const perModule = {};
    MODULES.forEach(m=>{
      const r = rows.find(rr=>rr.module_id===m.id);
      const totalLessons = m.lessons.length || 1;
      const viewedCount = r && r.lessons_viewed ? r.lessons_viewed.length : 0;
      const lessonFraction = Math.min(viewedCount/totalLessons, 1);
      const quizFraction = r && m.quiz.length ? (r.best_score||0)/m.quiz.length : 0;
      perModule[m.id] = Math.round((lessonFraction*0.5 + quizFraction*0.5) * 100);
    });
    return { id:p.id, name:p.name, role:p.role, perModule };
  });
  view = "team"; render();
}

function renderTeam(){
  const headerCols = MODULES.map(m=>`<th>${escapeHtml(m.title)}</th>`).join("");
  const rows = teamRows.map(r=>{
    const cells = MODULES.map(m=>`<td><button class="mini-btn" data-view-attempt="${r.id}:${m.id}">${r.perModule[m.id]}%</button></td>`).join("");
    const isSelf = r.id===profile.id;
    const roleSelect = isSelf
      ? `<span class="role-tag ${r.role==='admin'?'admin':''}">${r.role.toUpperCase()} (YOU)</span>`
      : `<select class="mini-btn" data-role-select="${r.id}"><option value="agent" ${r.role==='agent'?'selected':''}>User</option><option value="admin" ${r.role==='admin'?'selected':''}>Admin</option></select>`;
    const resetBtn = !isSelf ? `<button class="mini-btn" data-reset-pw="${r.id}" data-reset-name="${escapeHtml(r.name)}">Reset password</button>` : "";
    return `<tr><td>${escapeHtml(r.name)}</td><td>${roleSelect}</td>${cells}<td>${resetBtn}</td></tr>`;
  }).join("");
  renderShell(`
    <div class="card">
      <div class="k-label">ADMIN VIEW</div><h2>Team progress</h2>
      <p style="color:var(--text-dim);font-size:13.5px;margin:6px 0 20px;">Combined lesson + quiz completion per person. Click a percentage to see missed questions on their latest attempt.</p>
      <div style="overflow-x:auto;"><table class="team"><thead><tr><th>Name</th><th>Role</th>${headerCols}<th></th></tr></thead><tbody>${rows}</tbody></table></div>
    </div>
    <div id="attempt-detail" style="margin-top:16px;"></div>
  `);
  root.querySelectorAll("[data-role-select]").forEach(el=> el.addEventListener("change", async ()=>{
    const id = el.getAttribute("data-role-select");
    await supabase.from("profiles").update({ role: el.value }).eq("id", id);
    await openTeamProgress();
  }));
  root.querySelectorAll("[data-reset-pw]").forEach(el=> el.addEventListener("click", ()=>{
    openPasswordResetModal(el.getAttribute("data-reset-pw"), el.getAttribute("data-reset-name"));
  }));
  root.querySelectorAll("[data-view-attempt]").forEach(el=> el.addEventListener("click", async ()=>{
    const [userId, moduleId] = el.getAttribute("data-view-attempt").split(":");
    await showAttemptDetail(userId, moduleId);
  }));
}

async function showAttemptDetail(userId, moduleId){
  const holder = document.getElementById("attempt-detail");
  holder.innerHTML = `<div class="card"><p style="color:var(--text-faint);font-family:var(--mono);font-size:12px;">Loading latest attempt…</p></div>`;
  const { data: attempts } = await supabase.from("quiz_attempts").select("*").eq("user_id", userId).eq("module_id", moduleId).order("created_at", { ascending:false }).limit(1);
  const person = teamRows.find(r=>r.id===userId);
  const m = modById(moduleId);
  if(!attempts || !attempts.length){
    holder.innerHTML = `<div class="card"><p style="color:var(--text-dim);font-size:13.5px;">${escapeHtml(person?person.name:'This person')} hasn't taken the ${escapeHtml(m?m.title:'')} quiz yet.</p></div>`;
    return;
  }
  const a = attempts[0];
  const missed = (a.answers||[]).filter(x=>!x.is_correct);
  const missedHtml = missed.length ? missed.map((x,i)=>`
    <div class="sub-card">
      <div style="font-size:14px;margin-bottom:8px;">${escapeHtml(x.question)}</div>
      <div style="font-size:13px;color:var(--red);margin-bottom:4px;">Their answer: ${escapeHtml(x.options[x.selected] ?? '(no answer)')}</div>
      <div style="font-size:13px;color:var(--green);margin-bottom:10px;">Correct answer: ${escapeHtml(x.options[x.correct])}</div>
      <button class="mini-btn" data-coach="${i}">💬 Discuss with ${escapeHtml(person?person.name:'them')}</button>
    </div>
  `).join("") : `<p style="color:var(--green);font-size:13.5px;">No missed questions on their latest attempt — clean sweep.</p>`;
  holder.innerHTML = `
    <div class="card">
      <div class="k-label">LATEST ATTEMPT · ${escapeHtml(person?person.name:'')} · ${escapeHtml(m?m.title:'')}</div>
      <h2 style="margin-bottom:16px;">${a.score}/${a.total} correct</h2>
      ${missedHtml}
    </div>
  `;
  holder.querySelectorAll("[data-coach]").forEach(el=> el.addEventListener("click", ()=>{
    const q = missed[+el.getAttribute("data-coach")];
    openCoachingModal(userId, person ? person.name : "this person", `${m ? m.title : ''} — ${q.question}`);
  }));
}

/* ============================================================
   NOTIFICATIONS / MESSAGING
   ============================================================ */
async function loadAllNotifications(){
  const { data: announcements, error: announceErr } = await supabase.from("messages").select("*").eq("audience","all").order("created_at",{ascending:false}).limit(15);
  if(announceErr) console.error("Failed to load announcements:", announceErr);
  const { data: dismissals } = await supabase.from("announcement_dismissals").select("message_id").eq("user_id", session.user.id);
  const dismissedIds = new Set((dismissals||[]).map(d=>d.message_id));
  NOTIF_ANNOUNCEMENTS = (announcements||[]).filter(a=> !dismissedIds.has(a.id));

  const { data: myRoots } = await supabase.from("messages").select("*").eq("audience","admins").is("thread_id", null).eq("sender_id", session.user.id).order("created_at",{ascending:false});

  const { data: directSent } = await supabase.from("messages").select("*").eq("audience","user").is("thread_id", null).eq("sender_id", session.user.id).order("created_at",{ascending:false});
  const { data: directReceived } = await supabase.from("messages").select("*").eq("audience","user").is("thread_id", null).eq("recipient_id", session.user.id).order("created_at",{ascending:false});

  let claimedRoots = [];
  if(isAdmin()){
    const { data: uc } = await supabase.from("messages").select("*").eq("audience","admins").is("thread_id", null).is("claimed_by", null).order("created_at",{ascending:false});
    NOTIF_UNCLAIMED = uc || [];
    const { data: mc } = await supabase.from("messages").select("*").eq("audience","admins").is("thread_id", null).eq("claimed_by", session.user.id).order("created_at",{ascending:false});
    claimedRoots = mc || [];
  } else {
    NOTIF_UNCLAIMED = [];
  }

  const rootMap = {};
  (myRoots||[]).forEach(r=> rootMap[r.id]=r);
  claimedRoots.forEach(r=> rootMap[r.id]=r);
  (directSent||[]).forEach(r=> rootMap[r.id]=r);
  (directReceived||[]).forEach(r=> rootMap[r.id]=r);
  const allRoots = Object.values(rootMap);
  const rootIds = allRoots.map(r=>r.id);

  let followUps = [];
  if(rootIds.length){
    const { data: fu } = await supabase.from("messages").select("*").eq("audience","user").in("thread_id", rootIds).order("created_at",{ascending:true});
    followUps = fu || [];
  }
  NOTIF_THREADS = allRoots.map(root=>{
    const messages = followUps.filter(f=>f.thread_id===root.id);
    const lastActivity = messages.length ? messages[messages.length-1].created_at : root.created_at;
    return { root, messages, lastActivity };
  }).sort((a,b)=> new Date(b.lastActivity) - new Date(a.lastActivity));
}

function notifBadgeCount(){
  return isAdmin() ? NOTIF_UNCLAIMED.length : 0;
}
function chatBadgeCount(){
  let unread = 0;
  NOTIF_THREADS.forEach(t=> t.messages.forEach(m=>{ if(m.recipient_id===session.user.id && !m.is_read) unread++; }));
  return unread;
}

async function loadMessagingData(){
  await loadAllNotifications();
}

async function markMyThreadMessagesRead(){
  const unreadIds = [];
  NOTIF_THREADS.forEach(t=> t.messages.forEach(m=>{ if(m.recipient_id===session.user.id && !m.is_read) unreadIds.push(m.id); }));
  if(unreadIds.length){ await supabase.from("messages").update({ is_read:true }).in("id", unreadIds); await loadMessagingData(); }
}

function applyDefaultThreadVisibility(){
  if(NOTIF_THREADS.length > 1){
    NOTIF_THREADS.forEach(t=> collapsedThreadIds.add(t.root.id));
  } else if(NOTIF_THREADS.length === 1){
    collapsedThreadIds.delete(NOTIF_THREADS[0].root.id);
  }
}

async function openNotifications(){
  await loadMessagingData();
  view = "notifications"; render();
}

async function openChat(focusThreadId){
  await loadMessagingData();
  await markMyThreadMessagesRead();
  applyDefaultThreadVisibility();
  if(focusThreadId) collapsedThreadIds.delete(focusThreadId);
  view = "chat"; render();
}

async function refreshMessagingView(){
  await loadMessagingData();
  if(view==="chat") await markMyThreadMessagesRead();
  if(view==="notifications" || view==="chat") render();
}

const typeLabel = { flag:"🚩 Flag", highlight:"✨ Highlight", comment:"💬 Comment" };

function otherPartyName(t){
  if(t.root.sender_id !== session.user.id) return t.root.sender_name;
  const theirMsg = t.messages.find(m=> m.sender_id !== session.user.id);
  return theirMsg ? theirMsg.sender_name : "no one yet";
}

function threadCardHtml(t){
  const statusPill = !t.root.claimed_by ? `<span class="status-pill progress">Awaiting reply</span>` : `<span class="status-pill done">In conversation</span>`;
  const collapsed = collapsedThreadIds.has(t.root.id);

  if(collapsed){
    return `
      <div class="sub-card thread-card thread-collapsed" data-thread-toggle="${t.root.id}">
        <div class="sub-card-head" style="cursor:pointer;">
          <span class="tag">${typeLabel[t.root.type]||t.root.type}${t.root.context?(' · '+escapeHtml(t.root.context)):''} · with ${escapeHtml(otherPartyName(t))}</span>
          <span style="display:flex;gap:8px;align-items:center;">${statusPill}<button class="mini-btn" data-thread-toggle="${t.root.id}">Show</button></span>
        </div>
      </div>`;
  }

  const bubbles = [t.root, ...t.messages].map(m=>{
    const mine = m.sender_id === session.user.id;
    return `<div class="chat-bubble ${mine?'mine':'theirs'}">
      <div class="chat-bubble-meta">${escapeHtml(m.sender_name)} · ${new Date(m.created_at).toLocaleString()}</div>
      <div class="chat-bubble-body">${m.body}</div>
    </div>`;
  }).join("");
  return `
    <div class="sub-card thread-card">
      <div class="sub-card-head">
        <span class="tag">${typeLabel[t.root.type]||t.root.type}${t.root.context?(' · '+escapeHtml(t.root.context)):''} · with ${escapeHtml(otherPartyName(t))}</span>
        <span style="display:flex;gap:8px;align-items:center;">${statusPill}<button class="mini-btn" data-thread-toggle="${t.root.id}">Hide</button><button class="mini-btn danger" data-discard-thread="${t.root.id}">Discard</button></span>
      </div>
      <div class="chat-scroll">${bubbles}</div>
      <div class="field" style="margin-top:10px;">${richEditorHtml(`thread-rte-${t.root.id}`, "")}</div>
      <button class="mini-btn" data-send-thread="${t.root.id}" style="margin-top:8px;">Send</button>
    </div>`;
}

function renderNotifications(){
  const announceHtml = NOTIF_ANNOUNCEMENTS.length ? NOTIF_ANNOUNCEMENTS.map(a=>`
    <div class="sub-card">

    render();

  root.querySelectorAll("[data-discard-thread]").forEach(el=> el.addEventListener("click", async ()=>{

      await supabase.from("messages").delete().eq("id", id);

      await refreshMessagingView();

async function sendThreadMessage(rootId){
  const editorEl = document.getElementById(`thread-rte-${rootId}`);
  const body = editorEl.innerHTML.trim();
  if(!body || body === "<br>") return;
  const root = NOTIF_UNCLAIMED.find(m=>m.id===rootId) || (NOTIF_THREADS.find(t=>t.root.id===rootId)||{}).root;
  if(!root) return;

  const wasUnclaimedPoolItem = root.audience === "admins" && !root.claimed_by;

  let recipientId;
  if(root.audience === "user"){
    // Direct thread (e.g. admin-initiated coaching conversation) — just message the other participant.
    recipientId = (root.sender_id === session.user.id) ? root.recipient_id : root.sender_id;
  } else {
    // Pool-originated flag/comment thread.
    const iAmOriginalSender = root.sender_id === session.user.id;
    if(iAmOriginalSender){
      recipientId = root.claimed_by;
      if(!recipientId){ alert("No admin has picked this up yet — nothing to send to."); return; }
    } else {
      recipientId = root.sender_id;
      if(!root.claimed_by){
        await supabase.from("messages").update({ claimed_by: session.user.id }).eq("id", root.id).is("claimed_by", null);
      }
    }
  }
  await supabase.from("messages").insert({ sender_id: session.user.id, sender_name: profile.name, recipient_id: recipientId, audience:"user", type:"reply", body, context: root.context, thread_id: root.id });

  if(wasUnclaimedPoolItem){
    await openChat(root.id); // follow through on the conversation you just started
  } else {
    await refreshMessagingView();
  }
}

/* ============================================================
   REALTIME + TOASTS
   ============================================================ */
function stripHtml(html){ const d = document.createElement("div"); d.innerHTML = html; return (d.textContent||"").trim(); }

function showToast(text, onClickFn){
  const el = document.createElement("div");
  el.className = "app-toast";
  el.textContent = text;
  el.addEventListener("click", ()=>{ el.remove(); (onClickFn || openNotifications)(); });
  document.body.appendChild(el);
  setTimeout(()=>{ el.classList.add("out"); setTimeout(()=>el.remove(), 300); }, 6000);
}

function setupRealtime(){
  teardownRealtime();
  const chAnnounce = supabase.channel("rt-announcements-"+session.user.id)
    .on("postgres_changes", { event:"INSERT", schema:"public", table:"messages", filter:"audience=eq.all" }, (payload)=>{
      if(payload.new.sender_id === session.user.id) return;
      showToast("📣 " + stripHtml(payload.new.body).slice(0,90), openNotifications);
      if(view==="notifications" || view==="chat") refreshMessagingView(); else loadAllNotifications();
    }).subscribe();
  realtimeChannels.push(chAnnounce);

  const chToMe = supabase.channel("rt-to-me-"+session.user.id)
    .on("postgres_changes", { event:"INSERT", schema:"public", table:"messages", filter:`recipient_id=eq.${session.user.id}` }, (payload)=>{
      showToast("💬 " + escapeHtml(payload.new.sender_name) + ": " + stripHtml(payload.new.body).slice(0,70), ()=>openChat());
      if(view==="notifications" || view==="chat") refreshMessagingView(); else loadAllNotifications();
    }).subscribe();
  realtimeChannels.push(chToMe);

  if(isAdmin()){
    const chAdmin = supabase.channel("rt-admin-inbox-"+session.user.id)
      .on("postgres_changes", { event:"INSERT", schema:"public", table:"messages", filter:"audience=eq.admins" }, (payload)=>{
        if(payload.new.thread_id || payload.new.sender_id === session.user.id) return;
        showToast("🚩 New item waiting in the admin inbox", openNotifications);
        if(view==="notifications" || view==="chat") refreshMessagingView(); else loadAllNotifications();
      }).subscribe();
    realtimeChannels.push(chAdmin);
  }

  // Discarding a conversation deletes rows — without listening for DELETE too,
  // the other participant would never see it disappear until they refresh.
  const chDeletes = supabase.channel("rt-deletes-"+session.user.id)
    .on("postgres_changes", { event:"DELETE", schema:"public", table:"messages" }, ()=>{
      if(view==="notifications" || view==="chat") refreshMessagingView(); else loadAllNotifications();
    }).subscribe();
  realtimeChannels.push(chDeletes);
}
function teardownRealtime(){ realtimeChannels.forEach(ch=> supabase.removeChannel(ch)); realtimeChannels = []; }

/* ============================================================
   DRAG AUTO-SCROLL — activated during any drag-to-reorder gesture
   so dragging near the top/bottom edge scrolls the page.
   ============================================================ */
let _dragScrollSpeed = 0;
let _dragScrollRAF = null;
function _dragScrollHandler(e){
  const threshold = 110;
  const y = e.clientY;
  const h = window.innerHeight;
  if(y < threshold) _dragScrollSpeed = -((threshold - y) * 0.5 + 3);
  else if(y > h - threshold) _dragScrollSpeed = ((y - (h - threshold)) * 0.5 + 3);
  else _dragScrollSpeed = 0;
}
function _dragScrollStep(){
  if(_dragScrollSpeed !== 0) window.scrollBy(0, _dragScrollSpeed);
  _dragScrollRAF = requestAnimationFrame(_dragScrollStep);
}
function startDragAutoScroll(){
  _dragScrollSpeed = 0;
  document.addEventListener("dragover", _dragScrollHandler);
  if(!_dragScrollRAF) _dragScrollRAF = requestAnimationFrame(_dragScrollStep);
}
function stopDragAutoScroll(){
  document.removeEventListener("dragover", _dragScrollHandler);
  if(_dragScrollRAF){ cancelAnimationFrame(_dragScrollRAF); _dragScrollRAF = null; }
  _dragScrollSpeed = 0;
}

function slugify(s){ const base=(s||"").toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,''); let id=base||("module-"+Date.now()); let i=2;
  while(MODULES.some(m=>m.id===id && m.id!==editingExistingId)){ id=base+"-"+i; i++; } return id; }

/* ============================================================
   RICH TEXT EDITOR (used for reference pages, lesson bodies,
   announcements, comments/flags, and admin replies)
   ============================================================ */
function richEditorHtml(id, initialHtml){
  return `
    <div class="rte-toolbar" data-rte="${id}">
      <button type="button" data-cmd="bold" title="Bold"><b>B</b></button>
      <button type="button" data-cmd="italic" title="Italic"><i>I</i></button>
      <button type="button" data-cmd="underline" title="Underline"><u>U</u></button>
      <div class="rte-sep"></div>
      <select data-cmd="fontSize" title="Text size">
        <option value="2">Small</option>
        <option value="3" selected>Normal</option>
        <option value="5">Large</option>
        <option value="7">Huge</option>
      </select>
      <div class="rte-sep"></div>
      <button type="button" data-cmd="insertUnorderedList" title="Bullet list">• List</button>
      <button type="button" data-cmd="insertOrderedList" title="Numbered list">1. List</button>
      <div class="rte-sep"></div>
      <button type="button" data-cmd="image" title="Insert image">🖼</button>
      <input type="file" accept="image/*" style="display:none" id="${id}-file">
      <div class="rte-sep"></div>
      <button type="button" data-cmd="clearFormat" title="Clear formatting">Tx</button>
    </div>
    <div class="rte-body" id="${id}" contenteditable="true">${initialHtml || ""}</div>
  `;
}
function clearFormatting(editorEl){
  editorEl.focus();
  // Handles native bold/italic/underline/execCommand-applied styles.
  document.execCommand("removeFormat", false, null);
  // Pasted content (Word, Google Docs, other browser tabs, etc.) often carries
  // inline style/color attributes that removeFormat doesn't touch — strip those directly.
  editorEl.querySelectorAll("*").forEach(el=>{
    el.removeAttribute("style");
    el.removeAttribute("color");
    el.removeAttribute("bgcolor");
    el.removeAttribute("face");
  });
  editorEl.querySelectorAll("font").forEach(f=>{
    while(f.firstChild) f.parentNode.insertBefore(f.firstChild, f);
    f.parentNode.removeChild(f);
  });
}

function wireRichEditor(id){
  const toolbar = document.querySelector(`.rte-toolbar[data-rte="${id}"]`);
  const editorEl = document.getElementById(id);
  if(!toolbar || !editorEl) return;
  toolbar.querySelectorAll("button[data-cmd]").forEach(btn=>{
    btn.addEventListener("mousedown", (e)=>e.preventDefault()); // keep focus/selection in the editor
    btn.addEventListener("click", async ()=>{
      editorEl.focus();
      const cmd = btn.getAttribute("data-cmd");
      if(cmd === "image"){ document.getElementById(`${id}-file`).click(); return; }
      if(cmd === "clearFormat"){ clearFormatting(editorEl); return; }
      document.execCommand(cmd, false, null);
    });
  });
  const sizeSelect = toolbar.querySelector('select[data-cmd="fontSize"]');
  if(sizeSelect) sizeSelect.addEventListener("change", ()=>{ editorEl.focus(); document.execCommand("fontSize", false, sizeSelect.value); });
  const fileInput = document.getElementById(`${id}-file`);
  fileInput.addEventListener("change", async ()=>{
    const file = fileInput.files[0]; if(!file) return;
    const dataUrl = await compressImageFile(file);
    insertResizableImage(editorEl, dataUrl);
    fileInput.value = "";
  });
  editorEl.addEventListener("paste", async (e)=>{
    const cd = e.clipboardData || window.clipboardData;
    const items = cd.items;
    // Some browsers attach a flattened image snapshot alongside real HTML when you
    // copy a mixed selection (text + images) from a page or document. If we only
    // checked for an image item, we'd wrongly treat the WHOLE paste as "just an
    // image" and silently discard all the actual text and other pictures. Only take
    // the single-image fast path when there's genuinely no HTML riding along with it.
    const hasHtml = Array.from(items).some(it => it.type === "text/html");
    if(!hasHtml){
      for(const item of items){
        if(item.type && item.type.startsWith("image/")){
          e.preventDefault();
          const file = item.getAsFile();
          const dataUrl = await compressImageFile(file);
          insertResizableImage(editorEl, dataUrl);
          return;
        }
      }
    }
    // Mixed/rich paste (or plain text) — let the browser's default paste happen,
    // then wrap any plain <img> tags it inserted so every picture — no matter how
    // it got in — ends up resizable and click-to-enlarge, same as ones we insert.
    // Two passes: large pastes can take a moment longer to finish landing in the DOM.
    setTimeout(()=> normalizePastedImages(editorEl), 0);
    setTimeout(()=> normalizePastedImages(editorEl), 200);
  });
}
function normalizePastedImages(editorEl){
  const rawImgs = Array.from(editorEl.querySelectorAll("img")).filter(img => !img.closest(".rte-img-wrap"));
  rawImgs.forEach(img=>{
    const wrap = document.createElement("span");
    wrap.className = "rte-img-wrap";
    wrap.setAttribute("contenteditable", "false");
    wrap.setAttribute("draggable", "true");
    const sizeToImage = ()=>{
      const w = img.naturalWidth || img.width || 280;
      const h = img.naturalHeight || img.height || 190;
      const maxW = 340, maxH = 260;
      const scale = Math.min(maxW/w, maxH/h, 1);
      wrap.style.width = Math.max(Math.round(w*scale), 80) + "px";
      wrap.style.height = Math.max(Math.round(h*scale), 60) + "px";
    };
    sizeToImage();
    if(!img.naturalWidth){
      // Image (often an external URL from the source page) hasn't finished loading yet —
      // resize the box once it does, instead of leaving it stuck at a fallback guess.
      img.addEventListener("load", sizeToImage, { once:true });
    }
    img.parentNode.insertBefore(wrap, img);
    img.removeAttribute("width"); img.removeAttribute("height"); img.removeAttribute("style");
    wrap.appendChild(img);
  });
}
function openImageLightbox(src){
  const wrap = document.createElement("div");
  wrap.className = "lightbox-overlay";
  wrap.innerHTML = `<button class="lightbox-close" title="Close">✕</button><img src="${src}" class="lightbox-img" draggable="false"><div class="lightbox-hint">Scroll or double-click to zoom · drag to pan</div>`;
  document.body.appendChild(wrap);
  const img = wrap.querySelector(".lightbox-img");

  let scale = 1, panX = 0, panY = 0, dragging = false, startX = 0, startY = 0;
  function applyTransform(){
    img.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    img.style.cursor = scale > 1 ? "grab" : "zoom-in";
  }

  function onWheel(e){
    e.preventDefault();
    const delta = e.deltaY < 0 ? 0.2 : -0.2;
    scale = Math.min(4, Math.max(1, scale + delta));
    if(scale === 1){ panX = 0; panY = 0; }
    applyTransform();
  }
  function onDblClick(){
    scale = scale > 1 ? 1 : 2.5;
    if(scale === 1){ panX = 0; panY = 0; }
    applyTransform();
  }
  function onMouseDown(e){
    if(scale <= 1) return;
    e.preventDefault();
    dragging = true; startX = e.clientX - panX; startY = e.clientY - panY;
    img.style.cursor = "grabbing";
  }
  function onMouseMove(e){
    if(!dragging) return;
    panX = e.clientX - startX; panY = e.clientY - startY;
    applyTransform();
  }
  function onMouseUp(){
    dragging = false;
    if(scale > 1) img.style.cursor = "grab";
  }

  img.addEventListener("wheel", onWheel, { passive:false });
  img.addEventListener("dblclick", onDblClick);
  img.addEventListener("mousedown", onMouseDown);
  window.addEventListener("mousemove", onMouseMove);
  window.addEventListener("mouseup", onMouseUp);

  const close = ()=>{
    window.removeEventListener("mousemove", onMouseMove);
    window.removeEventListener("mouseup", onMouseUp);
    document.removeEventListener("keydown", onKey);
    wrap.remove();
  };
  wrap.addEventListener("click", (e)=>{ if(e.target===wrap || e.target.classList.contains("lightbox-close")) close(); });
  const onKey = (e)=>{ if(e.key==="Escape") close(); };
  document.addEventListener("keydown", onKey);
}
document.addEventListener("click", (e)=>{
  const img = e.target.closest(".rte-img-wrap img");
  if(!img) return;
  if(img.closest('[contenteditable="true"]')) return;
  openImageLightbox(img.getAttribute("src"));
});

function insertResizableImage(editorEl, dataUrl){
  editorEl.focus();
  const probe = new Image();
  probe.onload = ()=>{
    const maxW = 340, maxH = 260;
    let w = probe.naturalWidth || maxW, h = probe.naturalHeight || maxH;
    const scale = Math.min(maxW/w, maxH/h, 1);
    w = Math.max(Math.round(w*scale), 80);
    h = Math.max(Math.round(h*scale), 60);
    document.execCommand("insertHTML", false, `<span class="rte-img-wrap" contenteditable="false" draggable="true" style="width:${w}px;height:${h}px;"><img src="${dataUrl}"></span>&nbsp;`);
  };
  probe.src = dataUrl;
}
function compressImageFile(file, maxDim, quality){
  maxDim = maxDim || 900; quality = quality || 0.82;
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = (e)=>{
      const img = new Image();
      img.onerror = reject;
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > h && w > maxDim){ h = Math.round(h*maxDim/w); w = maxDim; }
        else if(h >= w && h > maxDim){ w = Math.round(w*maxDim/h); h = maxDim; }
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function wireEditorEvents(){
  const d = draftModule;
  document.getElementById("mod-title").addEventListener("input", e=>{ d.title=e.target.value; });
