// ============================================================
// ONE-TIME MIGRATION — moves images that were embedded as base64
// directly in database text/jsonb columns out to actual file
// storage, replacing them with a short URL instead. Existing
// content saved before compressImageFile() switched to uploading
// still has these embedded, which is what was inflating the lessons
// table alone to ~17MB fetched on every login. Safe to re-run —
// anything already migrated (a real URL, not a data: URL) is
// skipped automatically.
// ============================================================
async function migrateOneBase64Image(dataUrl){
  try{
    const blob = await (await fetch(dataUrl)).blob();
    const ext = (blob.type.split("/")[1] || "png").split("+")[0];
    const path = `img_${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;
    const { error } = await supabase.storage.from("lesson-images").upload(path, blob, { contentType: blob.type || "image/png" });
    if(error) return null;
    const { data } = supabase.storage.from("lesson-images").getPublicUrl(path);
    return data.publicUrl;
  }catch(e){ return null; }
}
async function migrateBase64InHtml(html){
  if(!html || !html.includes("data:image")) return html; // fast path — nothing to do, most rows won't have any
  const regex = /src="(data:image\/[a-zA-Z0-9.+-]+;base64,[^"]+)"/g;
  const dataUrls = [...new Set([...html.matchAll(regex)].map(m=>m[1]))]; // de-duped — an image pasted twice shouldn't upload twice
  let updated = html;
  for(const dataUrl of dataUrls){
    const url = await migrateOneBase64Image(dataUrl);
    if(url) updated = updated.split(dataUrl).join(url); // split/join replaces every occurrence, not just the first
  }
  return updated;
}
async function runImageMigration(onProgress){
  let migratedCount = 0, failedCount = 0;
  const bump = (label)=>{ migratedCount++; onProgress(`${label} (${migratedCount} migrated so far)…`); };

  const { data: lessons } = await supabase.from("lessons").select("id,body");
  for(const l of (lessons||[])){
    if(!l.body || !l.body.includes("data:image")) continue;
    const updated = await migrateBase64InHtml(l.body);
    if(updated !== l.body){
      const { error } = await supabase.from("lessons").update({ body: updated }).eq("id", l.id);
      if(error) failedCount++; else bump("Migrating lesson content");
    }
  }

  const { data: refPages } = await supabase.from("reference_pages").select("id,body");
  for(const r of (refPages||[])){
    if(!r.body || !r.body.includes("data:image")) continue;
    const updated = await migrateBase64InHtml(r.body);
    if(updated !== r.body){
      const { error } = await supabase.from("reference_pages").update({ body: updated }).eq("id", r.id);
      if(error) failedCount++; else bump("Migrating reference guide content");
    }
  }

  const { data: ipics } = await supabase.from("interactive_pictures").select("id,image");
  for(const ip of (ipics||[])){
    if(!ip.image || !ip.image.startsWith("data:image")) continue;
    const url = await migrateOneBase64Image(ip.image);
    if(!url){ failedCount++; continue; }
    const { error } = await supabase.from("interactive_pictures").update({ image: url }).eq("id", ip.id);
    if(error){ failedCount++; continue; }
    if(INTERACTIVE_PICTURES[ip.id]) INTERACTIVE_PICTURES[ip.id].image = url;
    bump("Migrating interactive pictures");
  }

  const { data: simQuestions } = await supabase.from("quiz_questions").select("id,sim_screens").eq("question_type","simulation");
  for(const q of (simQuestions||[])){
    if(!q.sim_screens || !q.sim_screens.length) continue;
    let changed = false;
    for(const scr of q.sim_screens){
      if(scr.image && scr.image.startsWith("data:image")){
        const url = await migrateOneBase64Image(scr.image);
        if(url){ scr.image = url; changed = true; } else failedCount++;
      }
    }
    if(changed){
      const { error } = await supabase.from("quiz_questions").update({ sim_screens: q.sim_screens }).eq("id", q.id);
      if(error) failedCount++; else bump("Migrating simulation screenshots");
    }
  }

  return { migratedCount, failedCount };
}

function openInteractivePicConfigFullscreen(ipId){
  const ip = INTERACTIVE_PICTURES[ipId];
  if(!ip){ alert("Couldn't find that interactive picture."); return; }
  const overlay = document.createElement("div");
  overlay.id = "ip-config-overlay";
  overlay.style.cssText = "position:fixed;inset:0;z-index:700;background:#000000f0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;";
  document.body.appendChild(overlay);
  window.activeFullscreenCleanups.push(()=> overlay.remove());

  let saveTimer = null;
  function scheduleSave(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async ()=>{ await silentSave(()=> supabase.from("interactive_pictures").update({ hotspots: ip.hotspots }).eq("id", ipId)); }, 500);
  }

  // Same transform-based zoom as the trainee viewer. Panning here is gated
  // behind holding Space, since plain drag already means "draw a new
  // hotspot box" — wheel-zoom has no such conflict and works identically
  // to everywhere else. getBoundingClientRect() (used below for box-draw
  // coordinate math) automatically accounts for the transform, so the
  // existing drawing logic needs no changes at all to work correctly zoomed in.
  let scale = 1, panX = 0, panY = 0;
  let spaceHeld = false, panning = false, panMoved = false, startX = 0, startY = 0;
  let currentViewport = null, currentCanvas = null;

  function applyTransform(){
    if(currentCanvas) currentCanvas.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
  }
  function onWheel(e){
    e.preventDefault();
    const delta = e.deltaY < 0 ? 0.2 : -0.2;
    scale = Math.min(4, Math.max(1, scale + delta));
    if(scale === 1){ panX = 0; panY = 0; }
    applyTransform();
  }
  const onKeyDown = (e)=>{ if(e.code==="Space" && !e.target.closest("input,textarea")){ spaceHeld = true; if(currentCanvas) currentCanvas.style.cursor = "grab"; } };
  const onKeyUp = (e)=>{ if(e.code==="Space"){ spaceHeld = false; if(currentCanvas && !panning) currentCanvas.style.cursor = ""; } };
  const onWindowMouseMove = (e)=>{
    if(!panning) return;
    // e.buttons===0 means no mouse button is actually pressed right now —
    // this catches the case where mouseup fired outside the browser window
    // entirely (dragged off the edge of the screen and released there),
    // which the browser never reports back to the page at all. Without
    // this check, panning state gets stuck "on" indefinitely since the
    // mouseup listener below would simply never run.
    if(e.buttons === 0){ panning = false; if(currentCanvas) currentCanvas.style.cursor = spaceHeld ? "grab" : ""; return; }
    const nx = e.clientX - startX, ny = e.clientY - startY;
    if(Math.abs(nx-panX) > 3 || Math.abs(ny-panY) > 3) panMoved = true;
    if(!panMoved) return;
    panX = nx; panY = ny;
    if(currentCanvas) currentCanvas.style.cursor = "grabbing";
    applyTransform();
  };
  const onWindowMouseUp = ()=>{
    panning = false;
    if(currentCanvas) currentCanvas.style.cursor = spaceHeld ? "grab" : "";
  };
  document.addEventListener("keydown", onKeyDown);
  document.addEventListener("keyup", onKeyUp);
  window.addEventListener("mousemove", onWindowMouseMove);
  window.addEventListener("mouseup", onWindowMouseUp);
  function cleanupZoomListeners(){
    document.removeEventListener("keydown", onKeyDown);
    document.removeEventListener("keyup", onKeyUp);
    window.removeEventListener("mousemove", onWindowMouseMove);
    window.removeEventListener("mouseup", onWindowMouseUp);
  }
  window.activeFullscreenCleanups.push(cleanupZoomListeners);

  function draw(){
    const boxesHtml = ip.hotspots.map((h,hi)=>`
      <div class="sim-zone" data-ip-box="${hi}" style="position:absolute;left:${h.x}%;top:${h.y}%;width:${h.w}%;height:${h.h}%;border:2px dashed var(--red);cursor:pointer;">
        <button class="sim-zone-del" data-ip-box-del="${hi}" style="position:absolute;top:-10px;right:-10px;width:18px;height:18px;border-radius:50%;background:#c0392bdd;color:#fff;font-size:11px;line-height:18px;text-align:center;cursor:pointer;border:none;">✕</button>
        <span style="position:absolute;bottom:2px;left:2px;background:#000000cc;color:var(--red);font-size:10px;padding:1px 4px;border-radius:3px;font-family:var(--mono);white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(h.title||'(untitled)')}</span>
      </div>`).join("");
    overlay.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;width:100%;max-width:1200px;margin-bottom:14px;gap:12px;">
        <span style="color:var(--text-dim);font-family:var(--mono);font-size:12px;">INTERACTIVE PICTURE · ${ip.hotspots.length} hotspot${ip.hotspots.length===1?'':'s'} — drag to add one</span>
        <button class="btn primary" id="ip-config-done">Done</button>
      </div>
      <div class="ip-config-viewport" style="overflow:hidden;width:min(94vw,1200px);height:76vh;border-radius:8px;position:relative;display:flex;align-items:center;justify-content:center;">
        <div class="sim-screen-canvas" data-ip-canvas style="position:relative;display:inline-block;">
          <img src="${ip.image}" style="max-width:min(94vw,1200px);max-height:76vh;display:block;pointer-events:none;user-select:none;" draggable="false">
          <div class="sim-canvas-hint">✛ Drag to add a hotspot · hold Space to pan when zoomed in</div>
          ${boxesHtml}
        </div>
      </div>`;
    document.getElementById("ip-config-done").addEventListener("click", ()=>{ scheduleSave(); cleanupZoomListeners(); overlay.remove(); if(view==="editor") renderEditor(); });

    currentViewport = overlay.querySelector(".ip-config-viewport");
    currentCanvas = overlay.querySelector("[data-ip-canvas]");
    applyTransform();
    if(spaceHeld) currentCanvas.style.cursor = "grab";
    currentViewport.addEventListener("wheel", onWheel, { passive:false });
    currentCanvas.addEventListener("mousedown", (e)=>{
      if(spaceHeld){
        panning = true; panMoved = false;
        startX = e.clientX - panX; startY = e.clientY - panY;
        e.preventDefault();
        return;
      }
      if(e.target.closest(".sim-zone")) return;
      const rect = currentCanvas.getBoundingClientRect();
      const previewEl = document.createElement("div");
      previewEl.style.cssText = "position:absolute;border:2px solid var(--amber);background:#f5a62333;pointer-events:none;";
      currentCanvas.appendChild(previewEl);
      _ipBoxDrawing = { rect, startX:e.clientX, startY:e.clientY, previewEl, scale, onBoxAdded:(box)=>{
        ip.hotspots.push(box);
        scheduleSave();
        draw();
        openHotspotEditModal(ip, ip.hotspots.length-1, ()=>{ scheduleSave(); draw(); });
      }};
      e.preventDefault();
    });
    overlay.querySelectorAll("[data-ip-box-del]").forEach(el=> el.addEventListener("click",(e)=>{
      e.stopPropagation();
      const hi = +el.getAttribute("data-ip-box-del");
      ip.hotspots.splice(hi,1);
      scheduleSave();
      draw();
    }));
    overlay.querySelectorAll("[data-ip-box]").forEach(el=> el.addEventListener("click",(e)=>{
      if(e.target.closest("[data-ip-box-del]")) return;
      const hi = +el.getAttribute("data-ip-box");
      openHotspotEditModal(ip, hi, ()=>{ scheduleSave(); draw(); });
    }));
  }
  draw();
}

async function openInteractivePicViewer(ipId){
  const ip = INTERACTIVE_PICTURES[ipId];
  if(!ip){ alert("Couldn't load this interactive picture."); return; }
  if(!myInteractivePicProgress[ipId]) myInteractivePicProgress[ipId] = new Set();
  const readSet = myInteractivePicProgress[ipId];

  const overlay = document.createElement("div");
  overlay.id = "ip-viewer-overlay";
  overlay.style.cssText = "position:fixed;inset:0;z-index:700;background:#000000f5;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;";
  document.body.appendChild(overlay);
  window.activeFullscreenCleanups.push(()=> overlay.remove());

  // Same transform-based approach as the plain image lightbox (a proven,
  // working pattern) rather than the earlier scrollbar/width% version that
  // kept causing issues: overflow:hidden on the viewport means there are
  // never scrollbars, wheel adjusts scale, holding the mouse down and
  // dragging pans via translate(). The image and hotspots share one
  // transformed container so they always move in perfect sync.
  let scale = 1, panX = 0, panY = 0;
  let dragging = false, dragMoved = false, startX = 0, startY = 0;
  let currentPanInner = null, currentViewport = null;

  function applyTransform(){
    if(currentPanInner) currentPanInner.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    if(currentViewport) currentViewport.style.cursor = scale > 1 ? "grab" : "";
  }
  function onWheel(e){
    e.preventDefault();
    const delta = e.deltaY < 0 ? 0.2 : -0.2;
    scale = Math.min(4, Math.max(1, scale + delta));
    if(scale === 1){ panX = 0; panY = 0; }
    applyTransform();
  }
  function onMouseDown(e){
    if(scale <= 1) return;
    dragging = true; dragMoved = false;
    startX = e.clientX - panX; startY = e.clientY - panY;
  }
  function onWindowMouseMove(e){
    if(!dragging) return;
    // Same reasoning as the config tool's version — catches a mouseup that
    // happened outside the browser window entirely, which never reaches
    // this page at all and would otherwise leave panning stuck "on."
    if(e.buttons === 0){ dragging = false; if(currentViewport) currentViewport.style.cursor = scale > 1 ? "grab" : ""; return; }
    const nx = e.clientX - startX, ny = e.clientY - startY;
    if(Math.abs(nx-panX) > 3 || Math.abs(ny-panY) > 3) dragMoved = true;
    if(!dragMoved) return;
    panX = nx; panY = ny;
    if(currentViewport) currentViewport.style.cursor = "grabbing";
    applyTransform();
  }
  function onWindowMouseUp(){
    dragging = false;
    if(currentViewport) currentViewport.style.cursor = scale > 1 ? "grab" : "";
    // Deferred, not immediate — a click event fires synchronously right
    // after mouseup, and the hotspot handler below needs to still see
    // dragMoved=true at that moment to correctly suppress opening the
    // hotspot when this mouseup was actually the end of a pan, not a
    // genuine click. Clearing it on the next tick lets that check land
    // first, then resets cleanly for the next real interaction.
    if(dragMoved) setTimeout(()=>{ dragMoved = false; }, 0);
  }
  window.addEventListener("mousemove", onWindowMouseMove);
  window.addEventListener("mouseup", onWindowMouseUp);
  function cleanupZoomListeners(){
    window.removeEventListener("mousemove", onWindowMouseMove);
    window.removeEventListener("mouseup", onWindowMouseUp);
  }
  window.activeFullscreenCleanups.push(cleanupZoomListeners);

  function draw(){
    const total = ip.hotspots.length;
    const done = ip.hotspots.filter(h=>readSet.has(h.id)).length;
    const allDone = total>0 && done>=total;
    const boxesHtml = ip.hotspots.map((h,hi)=>`<div class="ip-play-hotspot ${readSet.has(h.id)?'ip-read':'ip-unread'}" data-ip-hotspot="${hi}" style="position:absolute;left:${h.x}%;top:${h.y}%;width:${h.w}%;height:${h.h}%;"></div>`).join("");
    overlay.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;width:100%;max-width:1300px;margin-bottom:14px;gap:12px;">
        <span style="color:${allDone?'var(--green)':'var(--text-dim)'};font-family:var(--mono);font-size:12px;">${done}/${total} read${allDone?' — all done!':''}</span>
        <button class="btn ${allDone?'primary':''}" id="ip-viewer-close">${allDone?'Done ✓':'✕ Exit'}</button>
      </div>

function normalizePastedImages(editorEl){
  const rawImgs = Array.from(editorEl.querySelectorAll("img")).filter(img =>
    !img.closest(".rte-img-wrap") && !img.classList.contains("brand-mark") && !img.closest("header.top")
  );
  rawImgs.forEach(img=>{
    const wrap = document.createElement("span");
    wrap.className = "rte-img-wrap";
    wrap.setAttribute("contenteditable", "false");
    wrap.setAttribute("draggable", "true");
    const sizeToImage = ()=>{
      const w = img.naturalWidth || img.width || 280;
      const h = img.naturalHeight || img.height || 190;
      const maxW = 340, maxH = 260;
      const scale = Math.min(maxW/w, maxH/h, 1);
      setImageSize(img, Math.max(Math.round(w*scale), 80), Math.max(Math.round(h*scale), 60));
    };
    sizeToImage();
    if(!img.naturalWidth){
      // Image (often an external URL from the source page) hasn't finished loading yet —
      // resize the box once it does, instead of leaving it stuck at a fallback guess.
      img.addEventListener("load", sizeToImage, { once:true });
    }
    img.parentNode.insertBefore(wrap, img);
    img.removeAttribute("style");
    wrap.appendChild(img);
  });
  // Also re-check every already-wrapped image (covers legacy content that was sized
  // the old way, on the wrapper instead of the image) — this runs on every render,
  // so it self-heals in read-only views too, not just while actively editing.
  editorEl.querySelectorAll(".rte-img-wrap").forEach(fixImageSizing);
  // These live editing affordances should only ever exist inside an actively
  // editable .rte-body. If they show up anywhere else, it's leftover content
  // saved before this was fixed — strip it out so it can't be seen or used
  // (and, crucially, resized) in read-only views.
  editorEl.querySelectorAll(".rte-resize-handle, .rte-img-delete").forEach(el=>{
    if(!el.closest(".rte-body")) el.remove();
  });
}
function setImageSize(img, w, h){
  img.setAttribute("width", w);
  img.setAttribute("height", h);
  img.style.width = w + "px";
  img.style.height = h + "px";
}
function openImageLightbox(src){
  const wrap = document.createElement("div");
  wrap.className = "lightbox-overlay";
  wrap.innerHTML = `<button class="lightbox-close" title="Close">✕</button><img src="${src}" class="lightbox-img" draggable="false"><div class="lightbox-hint">Scroll or double-click to zoom · drag to pan</div>`;
  document.body.appendChild(wrap);
  const img = wrap.querySelector(".lightbox-img");

  let scale = 1, panX = 0, panY = 0, dragging = false, startX = 0, startY = 0;
  function applyTransform(){
    img.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    img.style.cursor = scale > 1 ? "grab" : "zoom-in";
  }

  function onWheel(e){
    e.preventDefault();
    const delta = e.deltaY < 0 ? 0.2 : -0.2;
    scale = Math.min(4, Math.max(1, scale + delta));
    if(scale === 1){ panX = 0; panY = 0; }
    applyTransform();
  }
  function onDblClick(){
    scale = scale > 1 ? 1 : 2.5;
    if(scale === 1){ panX = 0; panY = 0; }
    applyTransform();
  }
  function onMouseDown(e){
    if(scale <= 1) return;
    e.preventDefault();
    dragging = true; startX = e.clientX - panX; startY = e.clientY - panY;
    img.style.cursor = "grabbing";
  }
  function onMouseMove(e){
    if(!dragging) return;
    panX = e.clientX - startX; panY = e.clientY - startY;
    applyTransform();
  }
  function onMouseUp(){
    dragging = false;
    if(scale > 1) img.style.cursor = "grab";
  }

  img.addEventListener("wheel", onWheel, { passive:false });
  img.addEventListener("dblclick", onDblClick);
  img.addEventListener("mousedown", onMouseDown);
  window.addEventListener("mousemove", onMouseMove);
  window.addEventListener("mouseup", onMouseUp);

  const close = ()=>{
    window.removeEventListener("mousemove", onMouseMove);
    window.removeEventListener("mouseup", onMouseUp);
    document.removeEventListener("keydown", onKey);
    wrap.remove();
  };
  wrap.addEventListener("click", (e)=>{ if(e.target===wrap || e.target.classList.contains("lightbox-close")) close(); });
  const onKey = (e)=>{ if(e.key==="Escape") close(); };
  document.addEventListener("keydown", onKey);
}

function insertResizableImage(editorEl, dataUrl){
  editorEl.focus();
  return new Promise((resolve)=>{
    const probe = new Image();
    probe.onload = ()=>{
      const maxW = 340, maxH = 260;
      let w = probe.naturalWidth || maxW, h = probe.naturalHeight || maxH;
      const scale = Math.min(maxW/w, maxH/h, 1);
      w = Math.max(Math.round(w*scale), 80);
      h = Math.max(Math.round(h*scale), 60);
      document.execCommand("insertHTML", false, `<span class="rte-img-wrap" contenteditable="false" draggable="true"><img src="${dataUrl}" width="${w}" height="${h}" style="width:${w}px;height:${h}px;"></span>&nbsp;`);
      resolve();
    };
    probe.onerror = ()=> resolve(); // don't hang forever if the image data is somehow bad
    probe.src = dataUrl;
  });
}
function compressImageFile(file, maxDim){
  // PNG instead of JPEG — lossy JPEG compression is genuinely bad for screenshots
  // with sharp text edges (the classic "ringing" artifacts that blur text right
  // where you need it sharpest). PNG is lossless, ideal for UI/text screenshots.
  // Also raised the max dimension substantially so real screenshots aren't
  // downscaled at all unless they're unusually large.
  //
  // Uploads to Supabase Storage and returns a URL, rather than returning the
  // image itself as a base64 data URL to be embedded directly in whatever
  // database column it ends up in. Base64 embedding was inflating the
  // lessons table alone to ~17MB fetched on every single login — every
  // image in every lesson downloaded again by everyone, every time, since
  // it was baked into the same text column as the lesson content itself. A
  // short URL in that column instead means the actual image bytes only
  // transfer when that specific image is actually rendered.
  maxDim = maxDim || 1800;
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=> resolve(null);
    reader.onload = (e)=>{
      const img = new Image();
      img.onerror = ()=> resolve(null);
      img.onload = async ()=>{
        let w = img.width, h = img.height;
        if(w > h && w > maxDim){ h = Math.round(h*maxDim/w); w = maxDim; }
        else if(h >= w && h > maxDim){ w = Math.round(w*maxDim/h); h = maxDim; }
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = "high";
        ctx.drawImage(img, 0, 0, w, h);
        canvas.toBlob(async (blob)=>{
          if(!blob){ alert("Couldn't process that image."); resolve(null); return; }
          const path = `img_${Date.now()}_${Math.random().toString(36).slice(2,8)}.png`;
          const { error } = await supabase.storage.from("lesson-images").upload(path, blob, { contentType:"image/png" });
          if(error){ alert("Couldn't upload image: " + error.message); resolve(null); return; }
          const { data } = supabase.storage.from("lesson-images").getPublicUrl(path);
          resolve(data.publicUrl);
        }, "image/png");
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

async function openEditor(id, openToLessonIdx, openToQuestionIdx){
  if(id){
    editingExistingId = id;
    await ensureQuizSimScreens(modById(id));
    draftModule = JSON.parse(JSON.stringify(modById(id)));
    expandedLessonIdx = (typeof openToLessonIdx === "number" && draftModule.lessons[openToLessonIdx]) ? openToLessonIdx : null;
    expandedQuestionIdx = (typeof openToQuestionIdx === "number" && draftModule.quiz[openToQuestionIdx]) ? openToQuestionIdx : null;
    view = "editor"; render();
    return;
  }
  const title = await promptModal("New module", "Module title");
  if(!title) return;
  const newId = slugify(title.trim()) || ("module-" + Date.now());
  const { error } = await supabase.from("modules").insert({ id:newId, title:title.trim(), short:"", led_color:"green", department: currentActiveDepartment(), sort_order: MODULES.length+1 });
  if(error){ alert("Couldn't create module: " + error.message); return; }
  logEdit("created", "module", title.trim(), null, currentActiveDepartment());
  await loadEverything();
  editingExistingId = newId;
  draftModule = JSON.parse(JSON.stringify(modById(newId)));
  expandedLessonIdx = null; expandedQuestionIdx = null;
  view = "editor"; render();
  if(isAdmin()) openNewModuleNotifyModal(title.trim());
}

      if(el){
        if(error){ el.textContent = "Couldn't save: " + error.message; el.style.color = "var(--red)"; }
        else { el.textContent = "Saved"; el.style.color = "var(--green)"; }
      }
    }, 600);
  }
  document.getElementById("mod-title").addEventListener("input", e=>{ d.title=e.target.value; scheduleModAutosave(); });
  const deptSelectEl = document.getElementById("mod-department");
  if(deptSelectEl) deptSelectEl.addEventListener("change", e=>{ d.department=e.target.value; scheduleModAutosave(); });
  document.getElementById("mod-short").addEventListener("input", e=>{ d.short=e.target.value; scheduleModAutosave(); });
  document.getElementById("mod-popup-enabled").addEventListener("change", e=>{ d.popupEnabled=e.target.checked; scheduleModAutosave(); renderEditor(); });
  const popupTitleEl = document.getElementById("mod-popup-title");
  if(popupTitleEl) popupTitleEl.addEventListener("input", e=>{ d.popupTitle=e.target.value; scheduleModAutosave(); });
  const popupBodyEl = document.getElementById("mod-popup-body");
  if(popupBodyEl) popupBodyEl.addEventListener("input", e=>{ d.popupBody=e.target.value; scheduleModAutosave(); });

  function scheduleLessonAutosave(i){
    const l = d.lessons[i];
    const statusEl = document.getElementById(`lesson-save-status-${i}`);
    if(statusEl){ statusEl.textContent = "Saving…"; statusEl.style.color = "var(--text-faint)"; }
    clearTimeout(lessonAutosaveTimers[l.id]);
    lessonAutosaveTimers[l.id] = setTimeout(async ()=>{
      const { error } = await silentSave(()=> supabase.from("lessons").update({ label:l.label, title:l.title, body:l.body }).eq("id", l.id));
      const el = document.getElementById(`lesson-save-status-${i}`);
      if(el){
        if(error){ el.textContent = "Couldn't save: " + error.message; el.style.color = "var(--red)"; }
        else { el.textContent = "Saved"; el.style.color = "var(--green)"; }
      }
    }, 600);
  }
  root.querySelectorAll("[data-lesson-label]").forEach(el=> el.addEventListener("input", e=>{ const i=+el.dataset.lessonLabel; d.lessons[i].label=e.target.value; scheduleLessonAutosave(i); }));
  root.querySelectorAll("[data-lesson-title]").forEach(el=> el.addEventListener("input", e=>{ const i=+el.dataset.lessonTitle; d.lessons[i].title=e.target.value; scheduleLessonAutosave(i); }));
  if(expandedLessonIdx !== null){
    wireRichEditor(`lesson-rte-${expandedLessonIdx}`);
    const rteEl = document.getElementById(`lesson-rte-${expandedLessonIdx}`);
    if(rteEl) rteEl.addEventListener("input", ()=>{ d.lessons[expandedLessonIdx].body = getCleanEditorHtml(rteEl); scheduleLessonAutosave(expandedLessonIdx); });
  }
  let dragOverEl = null;
  let dragLessonIdx = null;
  root.querySelectorAll("[data-lesson-drag]").forEach(el=>{
    el.addEventListener("dragstart", (e)=>{ dragLessonIdx = +el.getAttribute("data-lesson-drag"); e.dataTransfer.effectAllowed = "move"; el.style.opacity = "0.4"; startDragAutoScroll(); });
    el.addEventListener("dragend", ()=>{
      el.style.opacity = "";
      stopDragAutoScroll();
      if(dragOverEl){ dragOverEl.classList.remove("drag-over-top","drag-over-bottom"); dragOverEl = null; }
    });
    el.addEventListener("dragover", (e)=>{
      e.preventDefault();
      const rect = el.getBoundingClientRect();
      const pos = (e.clientY - rect.top) < rect.height/2 ? "before" : "after";
      if(dragOverEl && dragOverEl!==el) dragOverEl.classList.remove("drag-over-top","drag-over-bottom");
      dragOverEl = el;
      el.classList.toggle("drag-over-top", pos==="before");
      el.classList.toggle("drag-over-bottom", pos==="after");
    });
    el.addEventListener("dragleave", ()=>{ el.classList.remove("drag-over-top","drag-over-bottom"); });
    el.addEventListener("drop", async (e)=>{
      e.preventDefault();
      const pos = el.classList.contains("drag-over-top") ? "before" : "after";
      el.classList.remove("drag-over-top","drag-over-bottom");
      let toIdx = +el.getAttribute("data-lesson-drag");
      if(dragLessonIdx===null || dragLessonIdx===toIdx){ dragLessonIdx=null; return; }
      if(pos==="after") toIdx++;
      const dragged = d.lessons[dragLessonIdx];
      const reordered = d.lessons.slice();
      reordered.splice(dragLessonIdx,1);
      if(dragLessonIdx < toIdx) toIdx--;
      reordered.splice(toIdx,0,dragged);
      d.lessons = reordered;
      dragLessonIdx = null;
      renderEditor();
      for(let i=0;i<d.lessons.length;i++){
        await supabase.from("lessons").update({ sort_order:i }).eq("id", d.lessons[i].id);
      }
    });
  });
  root.querySelectorAll("[data-lesson-del]").forEach(el=> el.addEventListener("click", async ()=>{
    const i=+el.dataset.lessonDel;
    if(!confirm("Delete this lesson?")) return;
    const { error } = await supabase.from("lessons").delete().eq("id", d.lessons[i].id);
    if(error){ alert("Couldn't delete: " + error.message); return; }
    logEdit("deleted", "lesson", `${d.title} — ${d.lessons[i].title}`, null, d.department);
    d.lessons.splice(i,1);
    if(expandedLessonIdx===i) expandedLessonIdx=null;
    renderEditor();
  }));
  root.querySelectorAll("[data-lesson-edit]").forEach(el=> el.addEventListener("click", ()=>{
    expandedLessonIdx = +el.dataset.lessonEdit; renderEditor();
  }));
  root.querySelectorAll("[data-lesson-done]").forEach(el=> el.addEventListener("click", ()=>{
    const i = +el.dataset.lessonDone;
    logEdit("updated", "lesson", `${d.title} — ${d.lessons[i].title}`);
    expandedLessonIdx = null; renderEditor();
  }));
  document.getElementById("add-lesson").addEventListener("click", async ()=>{
    const blank = blankLesson();
    const { data, error } = await supabase.from("lessons").insert({ module_id: editingExistingId, sort_order: d.lessons.length, label: blank.label, title: blank.title, body: blank.body }).select().single();
    if(error){ alert("Couldn't add lesson: " + error.message); return; }
    logEdit("created", "lesson", `${d.title} — ${blank.title}`, null, d.department);
    d.lessons.push({ id:data.id, label:data.label, title:data.title, body:data.body });
    expandedLessonIdx = d.lessons.length-1;
    renderEditor();
  });

  function scheduleQuizAutosave(i){
    const q = d.quiz[i];
    const statusEl = document.getElementById(`q-save-status-${i}`);
    if(statusEl){ statusEl.textContent = "Saving…"; statusEl.style.color = "var(--text-faint)"; }
    clearTimeout(quizAutosaveTimers[q.id]);
    quizAutosaveTimers[q.id] = setTimeout(async ()=>{
      const { error } = await silentSave(()=> supabase.from("quiz_questions").update({ question:q.q, options:q.opts, correct_index:q.correct, explanation:q.explain, question_type:q.type, sim_screens:q.simScreens, end_goal:q.endGoal, final_screen_id:q.finalScreenId }).eq("id", q.id));
      const el = document.getElementById(`q-save-status-${i}`);
      if(el){
        if(error){ el.textContent = "Couldn't save: " + error.message; el.style.color = "var(--red)"; }
        else { el.textContent = "Saved"; el.style.color = "var(--green)"; }
      }
    }, 600);
  }
  scheduleQuizAutosaveGlobal = scheduleQuizAutosave;
  root.querySelectorAll("[data-q-type]").forEach(el=> el.addEventListener("change", e=>{
    const i=+el.dataset.qType; d.quiz[i].type=e.target.value;
    if(d.quiz[i].type==='simulation' && !d.quiz[i].simScreens) d.quiz[i].simScreens=[];
    scheduleQuizAutosave(i); renderEditor();
  }));
  root.querySelectorAll("[data-q-endgoal]").forEach(el=> el.addEventListener("change", e=>{
    const i=+el.dataset.qEndgoal; d.quiz[i].endGoal=e.target.value;
    if(e.target.value==='button') d.quiz[i].finalScreenId=null;
    scheduleQuizAutosave(i); renderEditor();
  }));
  root.querySelectorAll("[data-q-finalscreen]").forEach(el=> el.addEventListener("change", e=>{
    const i=+el.dataset.qFinalscreen; d.quiz[i].finalScreenId=e.target.value||null;
    scheduleQuizAutosave(i); renderEditor();
  }));
  root.querySelectorAll("[data-sim-add-screen]").forEach(el=> el.addEventListener("click", ()=>{
    const qi=+el.dataset.simAddScreen;
    d.quiz[qi].simScreens.push({ id:'scr'+Date.now()+Math.random().toString(36).slice(2,7), image:null, zones:[] });
    scheduleQuizAutosave(qi); renderEditor();
  }));
  root.querySelectorAll("[data-sim-fullscreen]").forEach(el=> el.addEventListener("click", ()=>{
    const [qi,si]=el.dataset.simFullscreen.split(":").map(Number);
    openSimEditFullscreen(qi, si);
  }));
  root.querySelectorAll("[data-sim-screen-del]").forEach(el=> el.addEventListener("click", ()=>{
    const [qi,si]=el.dataset.simScreenDel.split(":").map(Number);
    const removedId = d.quiz[qi].simScreens[si].id;
    d.quiz[qi].simScreens.splice(si,1);
    // Any zone that pointed at the removed screen now just completes the simulation instead.
    d.quiz[qi].simScreens.forEach(scr=> (scr.zones||[]).forEach(z=>{ if(z.targetScreenId===removedId) z.targetScreenId=null; }));
    scheduleQuizAutosave(qi); renderEditor();
  }));
  root.querySelectorAll("[data-sim-upload]").forEach(el=> el.addEventListener("change", async ()=>{
    const file = el.files[0]; if(!file) return;
    const [qi,si]=el.dataset.simUpload.split(":").map(Number);
    const dataUrl = await compressImageFile(file);
    if(!dataUrl) return; // compressImageFile already alerted the user — don't overwrite any existing screenshot with a failed upload
    d.quiz[qi].simScreens[si].image = dataUrl;
    scheduleQuizAutosave(qi); renderEditor();
  }));
  root.querySelectorAll("[data-sim-zone-del]").forEach(el=> el.addEventListener("click", (e)=>{
    e.stopPropagation();
    const [qi,si,zi]=el.dataset.simZoneDel.split(":").map(Number);
    d.quiz[qi].simScreens[si].zones.splice(zi,1);
    scheduleQuizAutosave(qi); renderEditor();
  }));
  root.querySelectorAll("[data-sim-zone]").forEach(el=> el.addEventListener("click", (e)=>{
    if(e.target.closest("[data-sim-zone-del]")) return;
    const [qi,si,zi]=el.getAttribute("data-sim-zone").split(":").map(Number);
    openSimZoneTargetModal(d, qi, si, zi, ()=>{ scheduleQuizAutosave(qi); renderEditor(); });
  }));
  root.querySelectorAll("[data-sim-canvas]").forEach(canvas=>{
    const [qi,si] = canvas.getAttribute("data-sim-canvas").split(":").map(Number);
    canvas.addEventListener("mousedown", (e)=>{
      if(e.target.closest(".sim-zone")) return; // clicking an existing zone, not drawing a new one
      const rect = canvas.getBoundingClientRect();
      const previewEl = document.createElement("div");
      previewEl.style.cssText = "position:absolute;border:2px solid var(--amber);background:#f5a62333;pointer-events:none;";
      canvas.appendChild(previewEl);
      _simZoneDrawing = { qi, si, rect, startX:e.clientX, startY:e.clientY, previewEl, draftModule:d,
        onZoneAdded: (newIdx)=>{ renderEditor(); openSimZoneTargetModal(d, qi, si, newIdx, ()=>{ scheduleQuizAutosave(qi); renderEditor(); }); } };
      e.preventDefault();
    });
  });
  root.querySelectorAll("[data-q-text]").forEach(el=> el.addEventListener("input", e=>{ const i=+el.dataset.qText; d.quiz[i].q=e.target.value; scheduleQuizAutosave(i); }));
  root.querySelectorAll("[data-q-explain]").forEach(el=> el.addEventListener("input", e=>{ const i=+el.dataset.qExplain; d.quiz[i].explain=e.target.value; scheduleQuizAutosave(i); }));
  root.querySelectorAll("[data-q-opt]").forEach(el=> el.addEventListener("input", e=>{ const [qi,oi]=el.dataset.qOpt.split(":").map(Number); d.quiz[qi].opts[oi]=e.target.value; scheduleQuizAutosave(qi); }));
  root.querySelectorAll("[data-q-correct]").forEach(el=> el.addEventListener("change", e=>{ const qi=+el.dataset.qCorrect; d.quiz[qi].correct=+e.target.value; scheduleQuizAutosave(qi); }));
  root.querySelectorAll("[data-q-opt-add]").forEach(el=> el.addEventListener("click", ()=>{ const qi=+el.dataset.qOptAdd; d.quiz[qi].opts.push("New option"); scheduleQuizAutosave(qi); renderEditor(); }));
  root.querySelectorAll("[data-q-opt-del]").forEach(el=> el.addEventListener("click", ()=>{
    const [qi,oi]=el.dataset.qOptDel.split(":").map(Number); if(d.quiz[qi].opts.length<=2) return;
    d.quiz[qi].opts.splice(oi,1); if(d.quiz[qi].correct===oi) d.quiz[qi].correct=0; else if(d.quiz[qi].correct>oi) d.quiz[qi].correct-=1;
    scheduleQuizAutosave(qi); renderEditor();
  }));
  let dragQuestionIdx = null;
  root.querySelectorAll("[data-q-drag]").forEach(el=>{
    el.addEventListener("dragstart", (e)=>{ dragQuestionIdx = +el.getAttribute("data-q-drag"); e.dataTransfer.effectAllowed = "move"; el.style.opacity = "0.4"; startDragAutoScroll(); });
    el.addEventListener("dragend", ()=>{
      el.style.opacity = "";
      stopDragAutoScroll();
      if(dragOverEl){ dragOverEl.classList.remove("drag-over-top","drag-over-bottom"); dragOverEl = null; }
    });
    el.addEventListener("dragover", (e)=>{
      e.preventDefault();
      const rect = el.getBoundingClientRect();
      const pos = (e.clientY - rect.top) < rect.height/2 ? "before" : "after";
      if(dragOverEl && dragOverEl!==el) dragOverEl.classList.remove("drag-over-top","drag-over-bottom");
      dragOverEl = el;
      el.classList.toggle("drag-over-top", pos==="before");
      el.classList.toggle("drag-over-bottom", pos==="after");
    });
    el.addEventListener("dragleave", ()=>{ el.classList.remove("drag-over-top","drag-over-bottom"); });
    el.addEventListener("drop", async (e)=>{
      e.preventDefault();
      const pos = el.classList.contains("drag-over-top") ? "before" : "after";
      el.classList.remove("drag-over-top","drag-over-bottom");
      let toIdx = +el.getAttribute("data-q-drag");
      if(dragQuestionIdx===null || dragQuestionIdx===toIdx){ dragQuestionIdx=null; return; }
      if(pos==="after") toIdx++;
      const dragged = d.quiz[dragQuestionIdx];
      const reordered = d.quiz.slice();
      reordered.splice(dragQuestionIdx,1);
      if(dragQuestionIdx < toIdx) toIdx--;
      reordered.splice(toIdx,0,dragged);
      d.quiz = reordered;
      dragQuestionIdx = null;
      renderEditor();
      for(let i=0;i<d.quiz.length;i++){
        await supabase.from("quiz_questions").update({ sort_order:i }).eq("id", d.quiz[i].id);
      }
    });
  });
  root.querySelectorAll("[data-q-del]").forEach(el=> el.addEventListener("click", async ()=>{
    const i=+el.dataset.qDel;
    if(!confirm("Delete this question?")) return;
    const { error } = await supabase.from("quiz_questions").delete().eq("id", d.quiz[i].id);
    if(error){ alert("Couldn't delete: " + error.message); return; }
    logEdit("deleted", "module_quiz_question", `${d.title} — ${d.quiz[i].q}`, null, d.department);
    d.quiz.splice(i,1);
    if(expandedQuestionIdx===i) expandedQuestionIdx=null;
    renderEditor();
  }));
  root.querySelectorAll("[data-q-edit]").forEach(el=> el.addEventListener("click", ()=>{
    expandedQuestionIdx = +el.dataset.qEdit; renderEditor();
  }));
  root.querySelectorAll("[data-q-done]").forEach(el=> el.addEventListener("click", ()=>{
    const i = +el.dataset.qDone;
    logEdit("updated", "module_quiz_question", `${d.title} — ${d.quiz[i].q}`);
    expandedQuestionIdx = null; renderEditor();
  }));
  document.getElementById("add-question").addEventListener("click", async ()=>{
    const blank = blankQuestion();
    const { data, error } = await supabase.from("quiz_questions").insert({ module_id: editingExistingId, sort_order: d.quiz.length, question: blank.q, options: blank.opts, correct_index: blank.correct, explanation: blank.explain, question_type: blank.type, sim_screens: blank.simScreens }).select().single();
    if(error){ alert("Couldn't add question: " + error.message); return; }
    logEdit("created", "module_quiz_question", `${d.title} — ${blank.q}`, null, d.department);
    d.quiz.push({ id:data.id, q:data.question, opts:data.options, correct:data.correct_index, explain:data.explanation, type:data.question_type||'multiple_choice', simScreens:data.sim_screens||[] });
    expandedQuestionIdx = d.quiz.length-1;
    renderEditor();
  });

  document.getElementById("editor-done").addEventListener("click", async ()=>{
    await loadEverything();
    currentModId = editingExistingId; currentLessonIdx = 0;
    const freshMod = modById(editingExistingId);
    view = (freshMod && freshMod.lessons.length) ? "lesson" : "dashboard";
    render();
  });

  document.getElementById("editor-delete").addEventListener("click", async ()=>{
    if(confirm(`Delete "${d.title||'this module'}"? This can't be undone.`)){
      await supabase.from("modules").delete().eq("id", editingExistingId);
      logEdit("deleted", "module", d.title, null, d.department);
      await loadEverything(); view="dashboard"; render();
    }
  });
}

/* ============================================================
   EDIT GUEST PREVIEW (admin only) — customizes what a guest sees
   ============================================================ */
let guestEditorDraft = null;

async function openGuestEditor(){
  const { data } = await supabase.from("guest_demo_data").select("*").eq("id", 1).single();
  const existing = (data && data.data) ? data.data : null;
  const defaults = defaultGuestData();
  guestEditorDraft = (existing && Object.keys(existing).length) ? existing : JSON.parse(JSON.stringify(defaults));
  guestEditorDraft.modules = guestEditorDraft.modules && guestEditorDraft.modules.length ? guestEditorDraft.modules : defaults.modules;
  guestEditorDraft.referencePages = guestEditorDraft.referencePages && guestEditorDraft.referencePages.length ? guestEditorDraft.referencePages : defaults.referencePages;
  guestEditorDraft.notes = guestEditorDraft.notes && guestEditorDraft.notes.length ? guestEditorDraft.notes : defaults.notes;
  guestEditorDraft.team = guestEditorDraft.team && guestEditorDraft.team.length ? guestEditorDraft.team : defaults.team;
  guestEditorDraft.announcement = guestEditorDraft.announcement || defaults.announcement;
  view = "guest-editor"; render();
}

function renderGuestEditor(){
  const d = guestEditorDraft;

  const modulesHtml = d.modules.map((m,mi)=>`

      <div class="sub-card-head"><span class="tag">MODULE ${mi+1}</span><button class="mini-btn danger" data-gmod-del="${mi}">Delete module</button></div>

      ${(m.quiz||[]).map((q,qi)=>`

        </div>`).join("")}
      <button class="mini-btn" data-gmod-addq="${mi}">+ Add question</button>
    </div>`).join("");

  const refHtml = d.referencePages.map((p,i)=>`
    <div class="sub-card">
      <div class="sub-card-head"><span class="tag">PAGE ${i+1}</span><button class="mini-btn danger" data-gref-del="${i}">Delete</button></div>
      <div class="field"><label>Title</label><input type="text" data-gref-title="${i}" value="${escapeHtml(p.title)}"></div>
      <div class="field"><label>Body (HTML)</label><textarea data-gref-body="${i}" style="min-height:70px;">${escapeHtml(p.body)}</textarea></div>
    </div>`).join("");

  const notesHtml = d.notes.map((n,i)=>`
    <div class="sub-card">
      <div class="sub-card-head"><span class="tag">NOTE ${i+1}</span><button class="mini-btn danger" data-gnote-del="${i}">Delete</button></div>
      <div class="field"><label>Title</label><input type="text" data-gnote-title="${i}" value="${escapeHtml(n.title)}"></div>
      <div class="field"><label>Body (HTML)</label><textarea data-gnote-body="${i}" style="min-height:60px;">${escapeHtml(n.body)}</textarea></div>
    </div>`).join("");

  const teamHtml = d.team.map((t,i)=>`
    <div class="sub-card">
      <div class="sub-card-head"><span class="tag">PERSON ${i+1}</span><button class="mini-btn danger" data-gteam-del="${i}">Delete</button></div>
      <div class="field"><label>Name</label><input type="text" data-gteam-name="${i}" value="${escapeHtml(t.name)}"></div>
      <div class="field"><label>Overall progress % (0-100)</label><input type="text" data-gteam-overall="${i}" value="${t.overall}"></div>
    </div>`).join("");

  renderShell(`
    <div class="card">
      <div class="k-label">ADMIN</div>
      <h2 style="margin-bottom:4px;">Edit Guest Preview</h2>
      <p style="color:var(--text-dim);font-size:13.5px;margin:0 0 20px;">This is exactly what someone sees when they click "View site as guest." Changes here only affect that demo — never real data or real people.</p>

      <div class="editor-section"><div class="editor-section-head"><h3>Sample Modules</h3></div>${modulesHtml||'<p style="color:var(--text-faint);font-size:13px;">No modules yet.</p>'}<button class="dashed-btn" id="gadd-module">+ Add module</button></div>

  root.querySelectorAll("[data-gq-del]").forEach(el=> el.addEventListener("click", ()=>{ const [mi,qi]=el.dataset.gqDel.split(":").map(Number); d.modules[mi].quiz.splice(qi,1); renderGuestEditor(); }));

  document.getElementById("gadd-module").addEventListener("click", ()=>{ d.modules.push({ title:"New module", short:"", ledColor:"green", lessons:[], quiz:[] }); renderGuestEditor(); });

  root.querySelectorAll("[data-gref-title]").forEach(el=> el.addEventListener("input", e=>{ d.referencePages[+el.dataset.grefTitle].title = e.target.value; }));
  root.querySelectorAll("[data-gref-body]").forEach(el=> el.addEventListener("input", e=>{ d.referencePages[+el.dataset.grefBody].body = e.target.value; }));

   ============================================================ */
const THEMES = [
  { id:"dark", icon:"🌙", label:"Dark", bg:"#0A0F1A", color:"#52D5E0", border:"#24304a" },
  { id:"light", icon:"☀️", label:"Light", bg:"#F3F5FA", color:"#1B2233", border:"#DCE3F0" },
  { id:"programmer", icon:"&gt;_", label:"Programmer", bg:"#000000", color:"#3dff70", border:"#1f3d1f", mono:true },
  { id:"retro", icon:"📺", label:"Retro Amber", bg:"#0a0603", color:"#ffb000", border:"#4a3414" },
  { id:"synthwave", icon:"🌆", label:"Synthwave", bg:"#0d0221", color:"#00f0ff", border:"#5a2680" },
  { id:"ocean", icon:"🌊", label:"Ocean", bg:"#041624", color:"#3ddcf0", border:"#28587a" },
  { id:"forest", icon:"🌲", label:"Forest", bg:"#0d1610", color:"#5aeb90", border:"#3a5a44" },
  { id:"japan", icon:"🌸", label:"Japan", bg:"#1a0f16", color:"#ff9dc0", border:"#4a2e3d" },
  { id:"contrast", icon:"◐", label:"High Contrast", bg:"#000000", color:"#ffff00", border:"#ffffff" }
];
const THEME_NAMES = THEMES.map(t=>t.id);
function currentTheme(){ const t = localStorage.getItem("lineup-theme") || "dark"; return THEME_NAMES.includes(t) ? t : "dark"; }
function applyTheme(t){
  THEME_NAMES.forEach(name=>{ if(name!=="dark") document.documentElement.classList.remove("theme-"+name); });
  if(t!=="dark") document.documentElement.classList.add("theme-"+t);
  localStorage.setItem("lineup-theme", t);
}

function renderSettings(){
  const t = currentTheme();
  renderShell(`
    <div class="card">
      <div class="k-label">ACCOUNT SETTINGS</div>
      <h2 style="margin-bottom:20px;">Settings</h2>

      <div class="field"><label>Display name</label><input type="text" id="set-name" value="${escapeHtml(profile.name)}"></div>
      <button class="btn primary" id="save-name" style="margin-bottom:10px;">Save name</button>
      <div id="name-status" class="info-msg" style="margin:6px 0 0;min-height:16px;"></div>

      <div class="editor-section">
        <div class="editor-section-head"><h3>Change your password</h3></div>
        <div class="field"><label>New password</label><input type="password" id="set-pw1" placeholder="At least 6 characters"></div>
        <div class="field"><label>Confirm new password</label><input type="password" id="set-pw2"></div>
        <button class="btn primary" id="save-pw">Update password</button>
        <div id="pw-status" class="info-msg" style="margin:6px 0 0;min-height:16px;"></div>
      </div>

      <div class="editor-section">
        <div class="editor-section-head"><h3>Appearance</h3></div>
        ${(()=>{
          const cur = THEMES.find(th=>th.id===t) || THEMES[0];
          const optionsHtml = THEMES.map(th=>`
            <button class="theme-option ${th.id===t?'active':''}" data-theme="${th.id}">
              <span class="theme-swatch-sm" style="background:${th.bg};color:${th.color};border-color:${th.border};${th.mono?'font-family:var(--mono);':''}">${th.icon}</span>
              <span>${th.label}</span>
            </button>`).join("");
          return `
          <div class="theme-dropdown">
            <button class="theme-dropdown-trigger" id="theme-dropdown-toggle">
              <span class="theme-swatch-sm" style="background:${cur.bg};color:${cur.color};border-color:${cur.border};${cur.mono?'font-family:var(--mono);':''}">${cur.icon}</span>
              <span>${cur.label}</span>
              <span style="margin-left:auto;color:var(--text-faint);">${themeDropdownOpen?'▲':'▼'}</span>
            </button>
            ${themeDropdownOpen ? `<div class="theme-dropdown-panel">${optionsHtml}</div>` : ''}
          </div>`;
        })()}
      </div>

      ${(!isAdmin() && !guestMode) ? `
      <div class="editor-section">
        <div class="editor-section-head"><h3>Admin access</h3></div>
        <p style="color:var(--text-dim);font-size:13px;margin:0 0 12px;">If you need admin access — for content editing, team management, etc. — you can request it. Any admin can approve or deny it from their Notifications.</p>
        <button class="btn" id="request-admin-btn">Request admin access</button>
        <div id="admin-req-status" class="info-msg" style="margin:8px 0 0;min-height:16px;"></div>
      </div>` : ""}

      <div class="nav-buttons"><button class="btn" id="back-dash-settings">← Back to dashboard</button><div></div></div>
    </div>
  `);

  document.getElementById("back-dash-settings").addEventListener("click", ()=>{ view="home"; render(); });

  const reqAdminBtn = document.getElementById("request-admin-btn");
  if(reqAdminBtn) reqAdminBtn.addEventListener("click", async ()=>{
    const status = document.getElementById("admin-req-status");
    reqAdminBtn.disabled = true;
    const { data: existing } = await supabase.from("messages").select("id").eq("sender_id", session.user.id).eq("type","admin_request").is("thread_id", null);
    if(existing && existing.length){
      status.textContent = "You already have a pending request — an admin will review it soon.";
      status.style.color = "var(--amber)";
      reqAdminBtn.disabled = false;
      return;
    }
    const { error } = await supabase.from("messages").insert({ sender_id: session.user.id, sender_name: profile.name, audience:"admins", type:"admin_request", body:`<p>${escapeHtml(profile.name)} is requesting admin access.</p>` });
    if(error){ status.textContent = "Couldn't send request: " + error.message; status.style.color = "var(--red)"; reqAdminBtn.disabled = false; return; }
    status.textContent = "Request sent — an admin will review it soon.";
    status.style.color = "var(--green)";
  });

  document.getElementById("save-name").addEventListener("click", async ()=>{
    const newName = document.getElementById("set-name").value.trim();
    const status = document.getElementById("name-status");
    if(!newName){ status.textContent = "Name can't be empty."; status.style.color = "var(--red)"; return; }
    const { error } = await supabase.from("profiles").update({ name:newName }).eq("id", session.user.id);
    if(error){ status.textContent = "Couldn't save: " + error.message; status.style.color = "var(--red)"; return; }
    profile.name = newName;
    status.textContent = "Saved."; status.style.color = "var(--green)";
    const pill = document.querySelector(".pill-btn"); if(pill) pill.textContent = newName;
  });

  document.getElementById("save-pw").addEventListener("click", async ()=>{
    const pw1 = document.getElementById("set-pw1").value;
    const pw2 = document.getElementById("set-pw2").value;
    const status = document.getElementById("pw-status");
    if(pw1.length < 6){ status.textContent = "Password must be at least 6 characters."; status.style.color = "var(--red)"; return; }
    if(pw1 !== pw2){ status.textContent = "Passwords don't match."; status.style.color = "var(--red)"; return; }
    const { error } = await supabase.auth.updateUser({ password: pw1 });
    if(error){ status.textContent = "Couldn't update: " + error.message; status.style.color = "var(--red)"; return; }
    status.textContent = "Password updated."; status.style.color = "var(--green)";
    document.getElementById("set-pw1").value = ""; document.getElementById("set-pw2").value = "";
  });

  const themeToggle = document.getElementById("theme-dropdown-toggle");
  if(themeToggle) themeToggle.addEventListener("click", (e)=>{ e.stopPropagation(); themeDropdownOpen = !themeDropdownOpen; renderSettings(); });
  root.querySelectorAll("[data-theme]").forEach(el=> el.addEventListener("click", ()=>{ applyTheme(el.getAttribute("data-theme")); themeDropdownOpen = false; renderSettings(); }));

  // The panel defaults to opening downward, but if there isn't enough room
  // left in the viewport below it, that pushes the bottom themes off screen
  // and forces scrolling the whole page instead of just the dropdown.
  // Flip it to open upward in that case.
  const panel = document.querySelector(".theme-dropdown-panel");
  if(panel){
    const rect = panel.getBoundingClientRect();
    if(rect.bottom > window.innerHeight){
      panel.style.top = "auto";
      panel.style.bottom = "calc(100% + 6px)";
    }
  }
}

/* ============================================================
   REFERENCE GUIDE (OneNote-style, admin editable)
   ============================================================ */
let refCollapsed = new Set();
let refSearchQuery = "";
let dragRefId = null;
let refActiveDepartment = null;
function currentActiveRefDepartment(){
  const mine = myDepartments();
  if(mine.length===0) return 'TS';
  if(refActiveDepartment && mine.includes(refActiveDepartment)) return refActiveDepartment;
  refActiveDepartment = mine[0];
  return refActiveDepartment;
}

async function loadReference(){
  if(guestMode) return;
  const { data } = await supabase.from("reference_pages").select("*").order("sort_order");
  REFERENCE_PAGES = data || [];
  if(!REFERENCE_PAGES.find(p=>p.id===currentRefId)) currentRefId = null;
}
async function openReference(){
  await loadReference();
  refEditing = false;
  if(!currentRefId || !REFERENCE_PAGES.find(p=>p.id===currentRefId && p.department===currentActiveRefDepartment())){
    const top = topLevelPages()[0];
    currentRefId = top ? top.id : null;
  }
  view = "reference"; render();
}
function topLevelPages(){ return REFERENCE_PAGES.filter(p=>!p.parent_id && (guestMode || p.department===currentActiveRefDepartment())).sort((a,b)=>a.sort_order-b.sort_order); }
function childPages(parentId){ return REFERENCE_PAGES.filter(p=>p.parent_id===parentId).sort((a,b)=>a.sort_order-b.sort_order); }

function renderReference(){
  const editOn = canEdit();
  const tops = topLevelPages();

  function sidebarRow(p, isChild){
    const active = p.id===currentRefId;
    const kids = isChild ? [] : childPages(p.id);
    const collapsed = refCollapsed.has(p.id);
    const chevron = (!isChild && kids.length) ? `<button class="mini-btn" data-ref-toggle="${p.id}" style="padding:2px 5px;">${collapsed?'▸':'▾'}</button>` : `<span style="width:20px;display:inline-block;"></span>`;
    const tools = editOn ? `
      <span class="ref-row-tools">
        ${!isChild ? `<button class="mini-btn" data-ref-addsub="${p.id}">+ Sub</button>` : ""}
        <button class="mini-btn danger" data-ref-del="${p.id}">✕</button>
      </span>` : "";
    return `<div class="ref-row ${active?'active':''} ${isChild?'child':''}" draggable="${editOn}" data-ref-select="${p.id}" data-ref-drag="${p.id}" data-ref-parent="${p.parent_id||''}">
      ${!isChild ? chevron : ""}<span class="ref-row-title">${escapeHtml(p.title)}</span>${tools}
    </div>`;
  }

  const searchActive = refSearchQuery.trim().length > 0;
  const searchLower = refSearchQuery.trim().toLowerCase();
  const titleMatches = (p)=> p.title.toLowerCase().includes(searchLower);

  const sidebarHtml = tops.filter(p=> !searchActive || titleMatches(p) || childPages(p.id).some(titleMatches)).map(p=>{
    const kids = childPages(p.id).filter(k=> !searchActive || titleMatches(p) || titleMatches(k));
    const collapsed = searchActive ? false : refCollapsed.has(p.id);
    return sidebarRow(p,false) + (!collapsed ? kids.map(k=>sidebarRow(k,true)).join("") : "");
  }).join("") || (searchActive ? `<p style="color:var(--text-faint);font-size:12.5px;padding:10px;">No matches.</p>` : `<p style="color:var(--text-faint);font-size:12.5px;padding:10px;">No pages yet.</p>`);

  const addTopBtn = editOn ? `<button class="dashed-btn" id="add-ref-page" style="margin-top:10px;">+ Add page</button>` : "";

  const page = REFERENCE_PAGES.find(p=>p.id===currentRefId);
  let contentHtml;
  if(!REFERENCE_PAGES.length){
    contentHtml = `<div class="card"><p style="color:var(--text-dim);font-size:14px;">Nothing here yet.${editOn ? ' Click "+ Add page" to start building it out.' : ' Check back once an admin has added content.'}</p></div>`;
  } else if(!page){
    contentHtml = `<div class="card"><p style="color:var(--text-dim);font-size:14px;">Select a page from the left.</p></div>`;
  } else if(refEditing){
    contentHtml = `
      <div class="card">
        <input type="text" id="ref-title" class="onenote-title-input" placeholder="Page title" value="${escapeHtml(refDraft.title)}">
        ${richEditorHtml("ref-body-rte", refDraft.body)}
        <div class="hint" style="margin-top:8px;">Paste an image directly, or use the 🖼 button. Drag an image's corner to resize it.</div>
        <div class="nav-buttons">
          <div style="display:flex;gap:10px;align-items:center;"><button class="btn danger" id="ref-delete">Delete page</button><span id="ref-save-status" style="font-size:12px;color:var(--text-faint);font-family:var(--mono);"></span></div>
          <button class="btn primary" id="ref-done">Done editing</button>
        </div>
      </div>`;
  } else {
    const editBtn = editOn ? `<button class="btn" id="ref-edit" style="border-color:var(--amber);color:var(--amber);">✎ Edit page</button>` : "";
    contentHtml = `
      <div class="card">
        <div class="k-label">REFERENCE GUIDE</div>
        <h2>${escapeHtml(page.title)}</h2>
        <div class="body">${page.body}</div>
        <div class="nav-buttons"><div></div>${editBtn}</div>
      </div>`;
  }

    currentRefId = top ? top.id : null;
    refEditing = false;
    render();
  }));

  const refSearchEl = document.getElementById("ref-search");
  if(refSearchEl){
    let refSearchDebounce = null;
    refSearchEl.addEventListener("input", (e)=>{
      refSearchQuery = e.target.value;

        render();

        if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }

    });

      refBodyRte.addEventListener("input", trigger);
    }

  root.querySelectorAll("[data-ref-select]").forEach(el=> el.addEventListener("click", (e)=>{

    currentRefId = el.getAttribute("data-ref-select"); refEditing=false; render();
  }));
  root.querySelectorAll("[data-ref-toggle]").forEach(el=> el.addEventListener("click", (e)=>{

  }));

    const { data, error } = await supabase.from("reference_pages").insert({ title:"New page", body:"<p>Write here.</p>", parent_id:null, department: currentActiveRefDepartment(), sort_order: tops.length }).select().single();

  });
  root.querySelectorAll("[data-ref-addsub]").forEach(el=> el.addEventListener("click", async (e)=>{
    e.stopPropagation();
    const parentId = el.getAttribute("data-ref-addsub");
    const kids = childPages(parentId);
    const parentPage = REFERENCE_PAGES.find(p=>p.id===parentId);
    refCollapsed.delete(parentId);
    const { data, error } = await supabase.from("reference_pages").insert({ title:"New subsection", body:"<p>Write here.</p>", parent_id:parentId, department: parentPage ? parentPage.department : currentActiveRefDepartment(), sort_order: kids.length }).select().single();

let refSaveTimer = null;
async function flushRefSave(pageId, titleInput, bodyRte){
  clearTimeout(refSaveTimer);
  const title = titleInput.value.trim() || "Untitled page";
  const body = getCleanEditorHtml(bodyRte);
  const { error } = await silentSave(()=> supabase.from("reference_pages").update({ title, body }).eq("id", pageId));
  const statusElNow = document.getElementById("ref-save-status");
  if(error){
    if(statusElNow){ statusElNow.textContent = "Couldn't save: " + error.message; statusElNow.style.color = "var(--red)"; }
    return false;
  }
  const p = REFERENCE_PAGES.find(x=>x.id===pageId);
  if(p){ p.title = title; p.body = body; }
  const titleEl = document.querySelector(`[data-ref-select="${pageId}"] .ref-row-title`);
  if(titleEl) titleEl.textContent = title;
  if(statusElNow){ statusElNow.textContent = "Saved"; statusElNow.style.color = "var(--green)"; }
  return true;
}
function scheduleRefAutosave(pageId, titleInput, bodyRte){
  const statusEl = document.getElementById("ref-save-status");
  if(statusEl){ statusEl.textContent = "Saving…"; statusEl.style.color = "var(--text-faint)"; }
  clearTimeout(refSaveTimer);
  refSaveTimer = setTimeout(()=>{ flushRefSave(pageId, titleInput, bodyRte); }, 700);
}

async function reorderRefDrop(draggedId, targetId, pos){
  const dragged = REFERENCE_PAGES.find(p=>p.id===draggedId);
  const target = REFERENCE_PAGES.find(p=>p.id===targetId);
  if(!dragged || !target) return;
  if((dragged.parent_id||null) !== (target.parent_id||null)) return; // only reorder within the same level
  const siblings = (dragged.parent_id ? childPages(dragged.parent_id) : topLevelPages());
  const fromIdx = siblings.findIndex(s=>s.id===draggedId);
  let toIdx = siblings.findIndex(s=>s.id===targetId);
  if(fromIdx===-1 || toIdx===-1) return;
  if(pos==="after") toIdx++;
  const reordered = siblings.slice();
  reordered.splice(fromIdx,1);
  if(fromIdx < toIdx) toIdx--;
  reordered.splice(toIdx,0,dragged);
  for(let i=0;i<reordered.length;i++){
    if(reordered[i].sort_order !== i){ await supabase.from("reference_pages").update({ sort_order:i }).eq("id", reordered[i].id); }
  }
  await loadReference(); render();
}

async function loadPersonalNotes(){
  if(guestMode) return;

  await loadPersonalNotes();

function topLevelNotes(){ return PERSONAL_NOTES.filter(n=>!n.parent_id && (guestMode || n.department===currentActiveNotesDepartment())).sort((a,b)=>a.sort_order-b.sort_order); }
function childNotes(parentId){ return PERSONAL_NOTES.filter(n=>n.parent_id===parentId).sort((a,b)=>a.sort_order-b.sort_order); }

function scheduleNoteAutosave(noteId, titleInput, bodyRte){

  if(fromIdx===-1 || toIdx===-1) return;
  if(pos==="after") toIdx++;
  const reordered = siblings.slice();
  reordered.splice(fromIdx,1);
  if(fromIdx < toIdx) toIdx--;
  reordered.splice(toIdx,0,dragged);
  for(let i=0;i<reordered.length;i++){
    if(reordered[i].sort_order !== i){ await supabase.from("personal_notes").update({ sort_order:i }).eq("id", reordered[i].id); }
  }
  await loadPersonalNotes(); render();
}
